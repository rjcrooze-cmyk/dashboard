banned Nvidia capacity through Southeast Asian data centres. The practical effect is that Chinese frontier labs — the ones shipping GLM and DeepSeek — get materially more training and inference compute than export controls intended.","heat":74,"delta":"new","sources":20,"url":"https://the-decoder.com/china-lets-nvidias-h200-chips-trickle-onto-the-mainland-to-help-its-ai-firms-keep-pace-with-the-us/","glance":"The chip embargo is leaking from both ends at once.","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Export controls are visibly eroding on both sides","basis":"FT and Reuters report H200 shipments; CNBC/Quartz on the overseas-rental loophole"}},{"t":"GLM-5.3 tops open-model rankings, weights delayed","s":"Open-weight benchmark jump: Zhipu's GLM-5.3 scored 60 on the Artificial Analysis Intelligence Index — up 7 points from GLM-5.2, level with Kimi K3 and ahead of US open models — while undercutting rivals on price, though the weight release slipped after the model surfaced thousands of software bugs in testing. For teams self-hosting, it is the cheapest route to near-frontier coding and agentic work without sending code to a US API.","heat":73,"delta":"new","sources":6,"url":"https://the-decoder.com/glm-5-3-tops-the-open-model-rankings-and-undercuts-rivals-on-price-but-its-release-is-delayed/","glance":"China's open models are now the price-performance frontier.","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Open weights close on closed frontier, cheaply","basis":"Artificial Analysis index score of 60, independently published and widely replicated"}},{"t":"Claude designed working protein binders for 14 targets","s":"Research result with wet-lab receipts: Anthropic reports Claude designed protein binders from scratch against 15 targets and succeeded on 14, with 22-35% of individual designs binding versus the 10-15% typical of human campaigns, and some binding several times tighter than the best published result. The use-case is early-stage drug discovery — work that normally takes a specialist weeks or months per target.","heat":71,"delta":"new","sources":13,"url":"https://www.anthropic.com/research/Claude-accelerates-protein-design","glance":"An LLM agent now runs the whole protein-design loop.","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Real wet-lab wins, but one lab and self-reported","basis":"Anthropic post plus Adaptyv Bio wet-lab validation; not yet independently replicated"}},{"t":"Etched hits $21B on $700M chip round","s":"Funding move in AI silicon: Etched, the transformer-specific inference chip startup, raised $700M led by Jane Street at a $21B valuation — double its valuation from under a month earlier. The use-case is cheap high-throughput inference: hard-wiring the transformer into the ASIC to undercut Nvidia GPUs on tokens per dollar.","heat":64,"delta":"new","sources":16,"url":"https://techcrunch.com/2026/08/18/etcheds-valuation-doubles-to-21b-in-a-month/","glance":"Inference-only silicon is now a $21B bet against Nvidia.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Huge valuation, production volume still unproven","basis":"Reuters/TechCrunch on the $700M round; shipping volumes not yet disclosed"}},{"t":"Anthropic's revenue run-rate passes OpenAI at $65B","s":"Business inflection, not a launch: Anthropic's annualized revenue run-rate topped $65B ahead of its IPO, and WSJ reporting shows OpenAI's Q2 sales growing tepidly by comparison — the first time Anthropic has led on revenue. It reframes the enterprise question from 'which model is smartest' to 'which vendor is actually being paid'.","heat":63,"delta":"steady","sources":10,"url":"https://www.reuters.com/technology/anthropic-revenue-run-rate-tops-65-billion-source-says-2026-08-17/","glance":"The revenue crown changed hands for the first time.","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Enterprise spend has quietly picked a leader","basis":"Reuters and Bloomberg source-based figures; WSJ on OpenAI's Q2 comparison"}},{"t":"Claude Code's boosted weekly limits expire tonight","s":"Price-and-quota story that developers actually feel: Anthropic's May-August promotional 50% uplift on Claude Code weekly limits ends tonight, dropping heavy users back to base quotas. For agentic coding shops it is a straight cost increase per unit of work, and it lands alongside a multi-model degradation incident on Claude's status page.","heat":63,"delta":"steady","sources":3,"url":"https://support.claude.com/en/articles/15910845-claude-code-may-august-2026-weekly-limits-promotion","glance":"The cheap agentic-coding window is closing.","assess":{"mag":2,"timeline":"now","evidence":"proven","verdict":"Confirmed quota rollback, immediate cost impact","basis":"Anthropic's own support article; 292-point HN thread and DevOps.com coverage"}},{"t":"OpenAI CFO tells staff IPO comes by 2027","s":"Financing signal: CFO Sarah Friar told an all-hands that OpenAI 'will be a public company in 2027' or sooner, landing the same week its growth was reported as lagging Anthropic's and its training was paused. Going public would force quarterly disclosure of the compute costs and losses the whole AI capex cycle currently rests on.","heat":62,"delta":"new","sources":7,"url":"https://www.cnbc.com/2026/08/19/open-ai-ipo-timing-2027-friar.html","glance":"The biggest private AI bet is heading for public books.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"strong","verdict":"Timeline stated internally, not yet filed","basis":"CNBC and Techmeme sourcing from an OpenAI all-hands; no S-1 on file"}},{"t":"OpenAI offers zero data retention on frontier models","s":"Enterprise launch aimed straight at a rival: OpenAI will now offer zero data retention for frontier-model API customers, saying it does not need to store business data to keep models safe — a direct counter to Anthropic's privacy positioning. The use-case is regulated buyers (banks, health, legal) who could not send prompts to a vendor that retained them.","heat":51,"delta":"new","sources":8,"url":"https://openai.com/index/offering-zero-data-retention-for-frontier-models/","glance":"Privacy just became the enterprise battleground, not benchmarks.","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Shipped policy change, real for regulated buyers","basis":"OpenAI's own announcement, covered by WSJ, Axios and TechCrunch"}},{"t":"Modular open-sources the Mojo language","s":"Developer-infrastructure launch: Modular released Mojo, its Python-superset language for GPU and accelerator kernels, as open source at ModCon. The use-case is writing high-performance AI kernels without dropping into CUDA C++, which matters for anyone trying to run models on non-Nvidia silicon.","heat":48,"delta":"new","sources":2,"url":"https://www.modular.com/blog/mojo-open-source","glance":"A credible CUDA-alternative toolchain is finally open.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"proven","verdict":"Code is out; ecosystem adoption is the real test","basis":"Modular's ModCon announcement; 370+ combined HN points across two threads"}},{"t":"Claude gains autonomous Gmail sending","s":"Agentic launch with a sharp edge: Claude can now compose, reply, forward and send Gmail messages without asking for approval each time. The use-case is genuine inbox triage and follow-up automation, but it also removes the human confirmation step that was the main guardrail on an AI acting in your name.","heat":45,"delta":"new","sources":9,"url":"https://news.google.com/rss/articles/CBMilwFBVV95cUxQbUgwQldwUjJ5OUstNk1FUzJzaTdhVmlqVnRGUnN0ZjRXbVEwemdRVVk0LU1Ic1ZkLVA3eTEteWw1N25VSXdRWGJPelhUaHpHaEpjRUVLTWk1SzFUVFp2NDRZVGpDU0RFNVRiN3pqQWpSQjMta1BrYWVUR19UbWRxdHBQTTdzZG9SSHhsSjVLM0FfY1JNOWxz?oc=5","glance":"Your assistant can now hit send for you.","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Shipped, useful, and a real trust step-change","basis":"Shipped feature covered by 9to5Google, PCMag, Android Police and Mashable"}},{"t":"xAI sued over Grok CSAM deepfakes","s":"Regulation and litigation converging: a federal suit alleges xAI's Grok enabled creation of child sexual abuse imagery, with more plaintiffs joining, while a judge let Minnesota's AI 'nudification' ban take effect over xAI's First Amendment challenge. It is the first serious test of whether image-model outputs are protected speech or a product-liability problem.","heat":45,"delta":"new","sources":9,"url":"https://news.google.com/rss/articles/CBMigwFBVV95cUxPOXJORzVjdmtxRVlMTDdiYnh3bnZRc2NoMktnS0J1d3ZTdVpvdTlIa2ZkSDV6NjN2UktjUEg2SHR2aDNQVGdCdUxKMC1SLWJmUlZqaHIwdC1IUjhWV2tPZ1VPVXlBcWl0U2FfbTFaaDFvR0RXQmVmRmlWbXRLQWR1Y3h5cw?oc=5","glance":"Image-model liability is now being decided in court.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"strong","verdict":"Live litigation that could set the liability rule","basis":"Federal complaint plus Minnesota ruling, reported by Law360, Mashable, Courthouse News"}}]},"aitrendsUpdated":"2026-08-20T02:54:03.382042+00:00","science":{"updated":"2026-08-20T02:53:18Z","items":[{"t":"First phase 3 win for a personalised mRNA cancer therapy in melanoma","s":"Merck and Moderna say a phase 3 trial of intismeran autogene — an mRNA therapy built from each patient's own tumour mutations — plus Keytruda cut the risk of recurrence or death versus Keytruda alone in fully resected stage IIB–IV melanoma. It is the first successful phase 3 of an individualised mRNA cancer treatment; results are a company topline, not yet peer-reviewed or published, and the FDA still has to review it.","tag":"Health","imp":"critical","glance":"mRNA cancer vaccine works","url":"https://www.scientificamerican.com/article/moderna-and-merck-announce-landmark-trial-showing-mrna-therapy-significantly-cuts-odds-of-recurrent-skin-cancer/","published":"2026-08-19T20:45:00Z","src":"Scientific American","assess":{"mag":5,"timeline":"1-2 yrs","evidence":"strong","verdict":"First phase 3 win for personalised cancer mRNA","basis":"Phase 3 topline in resected stage IIB-IV melanoma; not yet published"},"eli":"Doctors read the DNA of your own tumour, then print an mRNA shot that teaches your immune system to hunt exactly that tumour. In the biggest test so far, adding it to standard immunotherapy kept the cancer from coming back more often than immunotherapy alone."},{"t":"Machine learning finds existing drugs that protect neurons in childhood dementia","s":"Using patient-derived neural models that reproduce key features of childhood dementia, a Nature Communications team built a screening platform combining imaging, transcriptomics, electrophysiology and machine learning, and picked out repurposed compounds that reduced the disease phenotype. Repurposed drugs are the fastest route to the clinic for an ultra-rare, currently untreatable disease — but this is preclinical human-cell work.","tag":"Health","imp":"important","glance":"Repurposed drugs for childhood dementia","url":"https://www.nature.com/articles/s41467-026-76837-1","published":"2026-08-20T00:00:00Z","src":"Nature Communications","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Screening platform names repurposable neuroprotectants","basis":"Preclinical patient-derived neural models, Nature Communications; no human dosing"}},{"t":"People past 100 carry an unusual store of cancer-killing T cells","s":"A Cell Reports study found that around age 100 a rare population of cytotoxic CD4 T cells — helper cells that behave like killers — expands and keeps adapting in supercentenarians. The authors read it as an adaptive response to lifelong antigen exposure, which makes these cells a concrete target for immunotherapy and healthy-ageing work. Observational immunology in a small, rare cohort.","tag":"Biology","imp":"important","glance":"Superagers' killer T cells","url":"https://www.sciencealert.com/people-who-live-past-100-may-be-protected-by-rare-cancer-killing-immune-cells","published":"2026-08-19T23:00:00Z","src":"ScienceAlert / Cell Reports","assess":{"mag":4,"timeline":"10+ yrs","evidence":"early","verdict":"A named immune-cell target for healthy ageing","basis":"Cell Reports observational study of a small supercentenarian cohort"}},{"t":"China lands and recovers a Zhuque-3 booster, joining SpaceX and Blue Origin","s":"LandSpace successfully landed and recovered the first stage of its Zhuque-3 rocket, eight months after its first attempt exploded on the pad. China now has a demonstrated reusable orbital-class booster, which is the main lever on launch cost for satellites, constellations and cargo.","tag":"Physics & Space","imp":"important","glance":"China lands reusable booster","url":"https://www.scientificamerican.com/article/china-successfully-lands-its-zhuque-3-rocket-rivaling-blue-origin-and-spacex/","published":"2026-08-19T16:00:00Z","src":"Scientific American","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Reusable orbital booster demonstrated outside the US","basis":"Flown and recovered first stage; second attempt after a 2025 failure"}},{"t":"An experimental tetanus-diphtheria vaccine survives without refrigeration","s":"In early trials a reformulated tetanus and diphtheria vaccine still protected without needing a cold chain. Refrigeration is the single largest logistics cost and failure point for immunisation in hot, remote and low-income regions, so a shelf-stable formulation changes who can be reached — but this is early-stage trial data, not an approved product.","tag":"Health","imp":"important","glance":"Vaccine needs no fridge","url":"https://www.sciencenews.org/article/experimental-vaccine-doesnt-need-fridge","published":"2026-08-19T13:30:00Z","src":"Science News","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Cold-chain-free vaccine clears early trials","basis":"Early-stage human trials of a reformulated Td vaccine; not approved"}},{"t":"A light-driven reaction breaks down mixed plastic waste without any catalyst","s":"Researchers in Science Advances report an autoinductive photochemical route that upcycles aromatic polymers and mixed plastics using autosensitization — the reaction generates its own sensitiser, so no added catalyst is needed. Mixed, contaminated plastic streams are exactly what mechanical recycling cannot handle, so a catalyst-free chemical route matters for real waste.","tag":"Chemistry","imp":"important","glance":"Catalyst-free plastic upcycling","url":"https://www.science.org/doi/abs/10.1126/sciadv.aeg9384?af=R","published":"2026-08-19T07:00:00Z","src":"Science Advances","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Mixed-plastic upcycling without an added catalyst","basis":"Peer-reviewed lab chemistry in Science Advances; no pilot-scale demonstration"}},{"t":"Lab-grown heart muscle injected into failing hearts clears its first randomised trial","s":"An early-stage randomised trial in Nature Medicine injected allogeneic human iPSC-derived cardiomyocytes directly into the heart muscle of patients with advanced ischaemic heart failure, reporting on safety and early efficacy. It is a first randomised readout for off-the-shelf stem-cell-derived heart muscle, but the trial is small and early-stage, not a definitive efficacy result.","tag":"Health","imp":"important","glance":"Stem-cell heart muscle trial","url":"https://www.nature.com/articles/s41591-026-04605-1","published":"2026-08-19T00:00:00Z","src":"Nature Medicine","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Off-the-shelf heart muscle reaches randomised testing","basis":"Early-stage randomised trial, Nature Medicine; small cohort, safety-led endpoints"}},{"t":"An AI CT reader for liver cancer clears a multicentre study and a trial","s":"LiON, a contrast-enhanced CT system that handles flexible multiphase scans and folds in clinical data, was tested across multiple centres and in a single-arm trial published in Nature Medicine. The stated use is cutting missed or delayed liver-cancer diagnoses and steering what the clinician does next.","tag":"Health","imp":"important","glance":"AI catches liver cancer","url":"https://www.nature.com/articles/s41591-026-04589-y","published":"2026-08-19T00:00:00Z","src":"Nature Medicine","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Diagnostic AI validated across centres, not one site","basis":"Multicentre study plus single-arm trial, peer-reviewed in Nature Medicine"}},{"t":"Mapping norovirus RNA structure yields a stable, self-weakening vaccine strain","s":"A Cell paper mapped RNA structure across the murine norovirus genome, then disrupted specific structural elements to cripple replication in cells and in animals. The weakened virus stayed genetically stable and produced protective immunity, giving a rational design route for live vaccines against RNA viruses. Animal work so far.","tag":"Biology","imp":"important","glance":"Rational norovirus vaccine design","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00920-7?rss=yes","published":"2026-08-19T00:00:00Z","src":"Cell","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Rational attenuation route for RNA-virus vaccines","basis":"Peer-reviewed in Cell; murine norovirus model, protective immunity in vivo"}},{"t":"Engineered polymer crystals sharply raise solar hydrogen production","s":"Engineering the crystal structure of polymer photocatalysts vastly increased their activity for splitting water into hydrogen using only sunlight, according to a Nature research-highlight on the work. Cheap organic photocatalysts that work without rare metals are one of the few routes to green hydrogen that could scale; this remains lab-scale activity, not a device.","tag":"Energy","imp":"important","glance":"Sunlight to hydrogen fuel","url":"https://www.nature.com/articles/d41586-026-02373-z","published":"2026-08-19T00:00:00Z","src":"Nature","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Polymer photocatalysts get a large activity jump","basis":"Nature-reported crystal engineering of polymer catalysts; laboratory activity only"}},{"t":"Brain organoids kept alive five years keep maturing on a human clock","s":"Nature reports human brain organoids grown for over five years in culture that continued to mature and track elapsed time following human-specific internal programs, outside a body. That matters practically because late-onset brain disease and long-horizon drug testing have never had a human model that ages, only ones a few months old.","tag":"Biology","imp":"important","glance":"Five-year-old brain organoids","url":"https://www.nature.com/articles/s41586-026-10877-x","published":"2026-08-19T00:00:00Z","src":"Nature","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Human brain models that finally age realistically","basis":"Peer-reviewed in Nature; organoids cultured over five years with maturation markers"}},{"t":"An approved epilepsy drug both eased osteoarthritis pain and pushed cartilage back toward repair","s":"Yale researchers found that lacosamide, an FDA-approved epilepsy medication, reduced joint pain and reversed cartilage damage in osteoarthritis models, with the strongest effect when injected into the joint inside a purpose-built hydrogel. Published in Bioactive Materials; this is preclinical work in animal models, not a human trial, but the drug's existing approval means a repurposing trial could start without the usual safety runway.","tag":"Health","imp":"important","glance":"Approved drug repairs cartilage in models","url":"https://scitechdaily.com/fda-approved-drug-shows-promise-for-reversing-osteoarthritis-damage/","published":"2026-08-18T23:43:51Z","src":"SciTechDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Repurposing route to disease-modifying OA care","basis":"Preclinical animal study in Bioactive Materials using an already-approved drug"},"eli":"Osteoarthritis treatments today only mute the pain. This one, already sold for epilepsy, seems to nudge the joint's own cells back into rebuilding cartilage."},{"t":"Swapping in krypton gas lets quantum chips be made at foundry-friendly temperatures","s":"Tantalum makes excellent superconducting circuits but normally has to be deposited above 400°C, too hot for the tools most semiconductor foundries run. Using krypton in the sputtering process brings the deposition temperature down into range, which is what stands between lab-grade quantum chips and volume manufacturing on existing lines.","tag":"Physics & Materials","imp":"important","glance":"Quantum chips made on standard tools","url":"https://phys.org/news/2026-08-krypton-gas-emerges-ingredient-quantum.html","published":"2026-08-18T23:40:06Z","src":"Phys.org","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Removes a real manufacturing bottleneck","basis":"Materials process result reported with characterised film quality at lower temperature"}},{"t":"Removing the Y chromosome at fertilisation turned male mouse embryos into fertile female clones","s":"A team at the University of Yamanashi in Japan used CRISPR to eliminate the Y chromosome immediately after fertilisation, producing healthy, fertile female mice that are clones of the male donor. The practical target is conservation: species reduced to a single surviving male could, in principle, be continued. Peer-reviewed animal work — no primate or livestock demonstration yet.","tag":"Biology","imp":"important","glance":"Sex reversal makes female clones from a male","url":"https://www.newscientist.com/article/2585076-female-clones-created-from-the-blood-of-male-mice/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS","published":"2026-08-18T14:00:00Z","src":"New Scientist","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"A genuine escape route for one-male species","basis":"Peer-reviewed mouse study producing healthy, fertile offspring"},"eli":"If a species is down to one male, it normally ends there. This technique makes females from that male's cells, so breeding can continue."},{"t":"An entire airspace will re-route planes to stop them making warming contrails","s":"From November, controllers managing the Shanwick airspace over the eastern North Atlantic will advise altitude changes to avoid the atmospheric conditions that form persistent contrails, using AI-generated forecasts from Google. Contrails are thought to cause roughly a third of aviation's climate impact, and this is the first trial across a whole airspace rather than a handful of flights.","tag":"Climate & Energy","imp":"important","glance":"Whole airspace to dodge contrails","url":"https://www.newscientist.com/article/2585091-planes-flying-over-the-atlantic-will-be-re-routed-to-avoid-contrails/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS","published":"2026-08-18T09:00:00Z","src":"New Scientist","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"First airspace-wide contrail avoidance","basis":"Operational trial announced by Contrails.org and ATC authorities, November start"}}]},"scienceUpdated":"2026-08-20T02:54:03.382042+00:00","scienceDaily":{"updated":"2026-08-20T02:53:18Z","items":[{"t":"Probiotic bacteria engineered into drug factories inside pancreatic tumours","s":"Engineered probiotic bacteria infiltrated pancreatic tumours, recruited cancer-fighting immune cells and slowed tumour growth in animal studies, and worked better when combined with chemotherapy, radiation or immunotherapy. Pancreatic cancer is one of the hardest tumours to reach with drugs, so a living carrier that concentrates inside it is a real delivery route. Animal work only.","tag":"Health","imp":"important","glance":"Bacteria attack pancreatic cancer","url":"https://www.sciencedaily.com/releases/2026/08/260816044830.htm","published":"2026-08-19T12:10:13Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Living drug delivery into a hard tumour","basis":"Animal studies; tumour growth slowed and synergy with existing therapies"}},{"t":"Tiny quantum engines pull usable energy out of waste heat","s":"A quantum-scale engine design was shown to extract useful work from heat that classical engines discard, using quantum correlations rather than a bigger temperature gap. Waste heat is the largest single loss in industry and computing, so any mechanism that harvests it has an obvious end use — though this is fundamental thermodynamics at the device scale, far from a product.","tag":"Physics & Space","imp":"important","glance":"Engines from waste heat","url":"https://www.sciencedaily.com/releases/2026/08/260819041222.htm","published":"2026-08-19T11:49:52Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"10+ yrs","evidence":"early","verdict":"Quantum route to harvesting discarded heat","basis":"Peer-reviewed quantum thermodynamics result at device scale, no prototype"}},{"t":"Silver nanoparticles cut DNA and make gene assembly five times more efficient","s":"Japanese researchers used silver nanoparticles to slice DNA precisely and leave longer 'sticky ends', letting genetic fragments join up to five times more efficiently than conventional methods. Building long DNA sequences is the rate-limiting step for gene therapies, cancer vaccines, engineered drugs and improved crops, so a cheaper assembly step feeds all of them. Laboratory method, not yet in production pipelines.","tag":"Biology","imp":"important","glance":"Faster DNA assembly method","url":"https://www.sciencedaily.com/releases/2026/08/260816044842.htm","published":"2026-08-19T07:46:13Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"A five-fold speed-up in building long DNA","basis":"Peer-reviewed method paper with measured 5x assembly efficiency gain"}},{"t":"A common blood-pressure drug class tied to 33% higher kidney risk in type 2 diabetes","s":"People with type 2 diabetes taking dihydropyridine calcium channel blockers had a 33% higher risk of serious kidney problems, even when already on kidney-protective medication. This is directly actionable prescribing information — it questions whether DCCBs should be a routine second-line choice in diabetic kidney disease — but it is an association from observational data, not a randomised trial.","tag":"Health","imp":"important","glance":"BP drug, kidney risk","url":"https://www.sciencedaily.com/releases/2026/08/260816044844.htm","published":"2026-08-18T22:45:38Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Prescribing signal against routine DCCB use","basis":"Large observational cohort; 33% higher serious kidney events, not randomised"}},{"t":"Light-driven microrobots hunt bacteria and drop them where you want","s":"Researchers built microscopic light-powered robots that move quickly through liquid, capture bacteria and deposit them at chosen locations. The stated use is precise manipulation of cells and microbes — sample preparation, targeted decontamination and lab automation at a scale tweezers cannot reach. Laboratory demonstration.","tag":"Chemistry","imp":"important","glance":"Microrobots collect bacteria","url":"https://www.sciencedaily.com/releases/2026/08/260816044850.htm","published":"2026-08-18T22:21:50Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Steerable microrobots that capture live cells","basis":"Peer-reviewed lab demonstration of light-driven capture and release"}}]},"scienceDailyUpdated":"2026-08-20T02:54:03.382042+00:00","life":{"updated":"2026-08-20T02:54:03.382042+00:00","items":[]},"lifeUpdated":"2026-08-20T02:54:03.382042+00:00","mind":{"updated":"2026-08-20T02:53:18Z","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"The cortex thickens years before Alzheimer's amyloid becomes detectable","s":"Longitudinal MRI in Nature Neuroscience shows cortical thickness changes appearing at least seven years before amyloid turns positive on PET. That reframes the earliest window of Alzheimer's disease and gives a cheap, widely available scan a possible role in spotting people long before current biomarkers do.","url":"https://www.nature.com/articles/s41593-026-02363-4","published":"2026-08-19T00:00:00Z","src":"Nature Neuroscience","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Alzheimer's leaves a structural trace years earlier","basis":"Longitudinal MRI-PET cohort, peer-reviewed in Nature Neuroscience"},"eli":"Brain scans picked up a change in the thickness of the brain's outer layer about seven years before the protein doctors currently look for showed up. That means an ordinary MRI might flag Alzheimer's risk far earlier than we thought.","glance":"The cortex thickens years before Alzheim"},{"t":"Psilocybin rewires burst firing across the whole brain through 5-HT2A","s":"Simultaneous Neuropixels recordings of 46,360 single units across 35 mice, with EEG, pupillometry and a 5-HT2A blocker for control, show psilocybin selectively reconfiguring burst coding brain-wide rather than simply raising activity. It gives a mechanistic account of a drug already in late-stage depression trials. Preprint on bioRxiv, animal data, not yet peer-reviewed.","url":"https://www.biorxiv.org/content/10.64898/2026.08.14.744865v1","published":"2026-08-19T00:00:00Z","src":"bioRxiv","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Mechanism for psilocybin's brain-wide effect","basis":"Preprint; 46,360 units across 35 mice with ketanserin pharmacological control"},"glance":"Psilocybin rewires burst firing across t"},{"t":"The brain reuses the same circuit modules to run different tasks","s":"Recording from mice and comparing against artificial recurrent networks trained on the same problems, researchers found the cortex does not build a dedicated circuit per task: it composes a small set of reusable modules, recombining them as the task changes, and the artificial networks converged on the same modular solution. Published in Nature; combines in-vivo recording with computational modelling. It is a structural answer to how flexible cognition is possible without unlimited circuitry, and gives a concrete target for what to look for in human recordings.","url":"https://news.google.com/rss/articles/CBMikwFBVV95cUxNTFRsb1UtX1VHcEJNNFo5RjFRa2ZGdnpiQWpGSUhDM01MOFpVTlhhSzloQlZxWGRUeEp","published":"2026-08-17T09:00:00+00:00","src":"MIT News / Nature","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Cognition runs on reusable parts","basis":"Nature paper; mouse recordings plus matched network models"},"glance":"The brain reuses the same circuit module"}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"Magnetic nanodiscs switch on astrocytes deep in the brain with no implant","s":"Anti-GLAST-conjugated magnetite vortex nanodiscs plus a low-amplitude alternating magnetic field activated astrocytes selectively in living brain tissue, without viral gene delivery, tethered fibre implants or MRI-scale magnets. Every existing method of targeting these cells needs surgery or gene therapy, so a wireless route is what would make astrocyte neuromodulation usable outside specialist labs. bioRxiv preprint, animal work.","url":"https://www.biorxiv.org/content/10.64898/2026.08.13.744740v1","published":"2026-08-19T00:00:00Z","src":"bioRxiv","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Wireless deep-brain stimulation without genes or implants","basis":"Preprint; anti-GLAST magnetite nanodiscs activate astrocytes at low magnetic field"},"glance":"Magnetic nanodiscs switch on astrocytes "}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"Rewriting a painful childhood memory in imagery cut fear of failure for months","s":"Researchers at SWPS University and the Nencki Institute had young adults revisit painful childhood memories through imagery-based rescripting, and found lasting reductions in fear, guilt, sadness and stress that persisted months later. Published in Frontiers in Psychology; a controlled study in young adults, so the effect size in older or clinical populations is still open.","url":"https://www.sciencedaily.com/releases/2026/08/260815064833.htm","published":"2026-08-18T05:06:35Z","src":"ScienceDaily / SWPS University","eli":"Instead of arguing with a bad memory, you re-imagine the scene with a different ending — and the feeling attached to it loosens.","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Durable change from a short imagery protocol","basis":"Peer-reviewed study in Frontiers in Psychology with months-long follow-up"},"glance":"Rewriting a painful childhood memory in "},{"t":"Directed attention measurably damped an acute inflammatory response in humans","s":"In a Bar-Ilan University study, participants given an attentional task during an induced acute inflammatory challenge showed a measurably reduced inflammatory response compared with controls, evidence that top-down attention reaches the immune response and not only the perception of it. Peer-reviewed human study with an objective biological readout rather than self-report, which is what separates it from most mind-body claims. Effect sizes are modest and it is one study.","url":"https://news.google.com/rss/articles/CBMiXEFVX3lxTE1GSmV5VmR1bG9OQ2JFc1hYVWJnb3VPUEYwLTNIUG1rTDRFZ3BGNmplOV9heU1CMDBOZ3d","published":"2026-08-17T09:05:00+00:00","src":"Bar-Ilan University / EurekAlert!","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Attention reaches the immune system","basis":"Human study with objective inflammatory markers"},"glance":"Directed attention measurably damped an "},{"t":"Eight years of tracking found more screen time linked to better cognitive processing in teens","s":"A Finnish cohort followed children for eight years and found that those with higher screen use tended to show better cognitive processing as teenagers, the opposite of the expected direction. The authors attribute much of it to what the screen time displaced or accompanied — participants who also kept up physical activity and sleep did best — and stress this is an observational association, so the finding constrains the simple 'screens damage developing brains' claim rather than proving screens help.","url":"https://www.sciencedaily.com/releases/2026/08/260815064803.htm","published":"2026-08-17T06:41:08+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Screen-harm story does not hold","basis":"Eight-year cohort; observational, not causal"},"glance":"Eight years of tracking found more scree"}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Travelling brain waves may be the engine that builds what you see","s":"Researchers argue that electrical waves sweeping across the cortex are not background noise but a core computational mechanism — shaping what gets noticed, predicting what comes next and assembling the brain's internal picture of the world. It is a synthesis of accumulated recording evidence rather than a single new experiment, so treat it as a strong framework claim, not a settled finding.","url":"https://www.sciencedaily.com/releases/2026/08/260816044827.htm","published":"2026-08-18T16:40:57Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"unclear","evidence":"early","verdict":"Travelling waves proposed as perception's mechanism","basis":"Peer-reviewed synthesis of cortical travelling-wave recordings; framework claim"},"glance":"Travelling brain waves may be the engine"}]}]},"mindUpdated":"2026-08-20T02:54:03.382042+00:00","mindset":{"updated":"2026-08-20T02:54:03.382042+00:00","messages":[{"who":"Joseph Rodrigues","t":"I'm begging you to ignore the 3D","vid":"q5NeTNkWI-s","url":"https://www.youtube.com/watch?v=q5NeTNkWI-s","gist":"Rodrigues works from a two-pyramid diagram: a desired reality stack of vision, identity, values and beliefs, capabilities, behaviours and environments, and a greyed-out old reality the Bible calls the old man. His claim is that a person operates from one or the other, and defaults to the second because of inherited programming absorbed from family, school and surroundings without ever being questioned. The practical instruction is not to avoid difficulty but to use it: when a challenge triggers the old thoughts, let those thoughts appear and disappear, let the emotion arise and subside in the body, and do the thing anyway. He calls these mind purification opportunity points and links them to Csikszentmihalyi's flow, where challenge meets skill, and to the release of anandamide. Scripture punctuates it, Romans 12:2 on renewing the mind and Psalm 37:4. He describes keeping a definite chief aim since 2004, replacing each with a higher one once actualised."},{"who":"Elmer O. Locker Jr","t":"The person who listens to this audio is a millionaire (1111-888)","vid":"hS5QyELgV6Q","url":"https://www.youtube.com/watch?v=hS5QyELgV6Q","gist":"Despite the title, this is not a talk but a looped affirmation track: a narrator recites money affirmations in the first person over music, stated as an attempt to impress them on the subconscious during relaxed or sleeping attention. The script opens with permission-giving lines about releasing old negative beliefs about money and accepting new ones, moves to identity statements such as being a magnet for money and being worthy of abundance, then to present-tense possession, right now I have millions of dollars, huge amounts of money pass through my hands every day. A few lines deliberately decouple feeling from amount: money is framed as energy, small sums are welcomed alongside large ones, and spending is cast as joyful rather than depleting. The same block of roughly thirty affirmations then repeats, essentially unchanged, for the remainder of the hour. Repetition is the method rather than any argument."},{"who":"AH Universe (Abraham Hicks)","t":"You're not attracting — you're becoming the one who has it","vid":"EFH4--b1Suc","url":"https://www.youtube.com/watch?v=EFH4--b1Suc","gist":"The frame here is that a desire is already a reality — a vibrational one — the moment life helps you clarify it, long before it can be seen, heard or touched. Abraham calls that store of clarified wants the vortex, and says you cannot stop creating it; the only variable is whether you tune to its frequency or hold yourself apart from it. The mechanism offered for that is emotion: negative feeling is not a verdict on other people's behaviour but a readout of the gap between what you have become and where your attention currently sits. They retell Jerry's question, 'how do we turn thoughts to things', and Esther's nine months of daily meditation — quieting attention until, absent resistance, the connection arrived as motion before it ever arrived as words. Diversity and contrast are defended as the engine that produces preference in the first place, so the instruction is not to eliminate the unwanted but to stop broadcasting from it."}]},"mindsetUpdated":"2026-08-20T02:54:03.382042+00:00","youtube":{"count":15,"note":"267 subscribed channels polled (excluded genres, Mind-tab and mindset channels removed); 15 channels had uploads on today's IST date; 15 items kept after dropping 1 sleep/ASMR upload, 1 clip with no captions and 1 with no real content.","groups":[{"h":"AI, robotics & the frontier","items":[{"t":"The summer Math fell to the machines","s":"Over roughly three weeks in mid-2026, AI models disproved or advanced more long-open mathematical conjectures than the previous decade of human work: the 1939 Jacobian conjecture fell to a counterexample found with AI help, the 30-year-old dense Garg-Goemans conjecture was killed by a seven-node network GPT-5.6 produced from four prompts, and OpenAI shipped ten open problems with machine-checkable Lean certificates including the first improvement to the sphere-packing bound since 1978. Terence Tao has publicly warned of a resulting crisis in mathematical values and practice.","glance":"Frontier models are now closing decades-old open maths problems in days, so the scarce skill is shifting from proving results to posing the right problem and formally verifying the machine's answer.","url":"https://www.youtube.com/watch?v=iuZPTE5qsJY","vid":"iuZPTE5qsJY","published":"2026-08-19T18:45:57Z","src":"Fireship","subject":"AI"},{"t":"AI doesn't need to be good at everything — just R&D (Ryan Greenblatt)","s":"Greenblatt's argument is that transformative change does not require broadly superhuman AI: it is sufficient for models to be excellent at R&D specifically — chip design, building fabs, orchestrating factories, designing and operating robots, and AI research itself. From there you get an 'industrial explosion' in which AIs build out vastly more compute and run research at a volume humans struggle to follow.","glance":"You don't need AGI for a discontinuity — models that are merely excellent at chip, factory and AI R&D are enough to trigger a compounding industrial explosion.","url":"https://www.youtube.com/watch?v=9oqFUheU104","vid":"9oqFUheU104","published":"2026-08-19T20:36:01Z","src":"Dwarkesh Patel","subject":"AI","short":true},{"t":"Introducing GEN-1.5, a one-shot learner","s":"Generalist's new robot foundation model learns new manipulation tasks from a few seconds of in-context demonstration — 'physical prompting' — with zero training, and can compose prompts to chain longer tasks or transfer behaviour from simulation to the real world. The team stresses success rates are still low, but the capability emerged from the training recipe rather than being explicitly trained: the robot improvised a banana as a brush when its brush was taken away, removed a paper cover blocking a bowl, switched hands ambidextrously, and mimicked a human demonstrating with bare hands.","glance":"Robot foundation models are starting to show in-context learning like LLMs — show the arm a task for a few seconds and it generalises, improvising new tools rather than replaying a trained trajectory.","url":"https://www.youtube.com/watch?v=1cllCVK-9lo","vid":"1cllCVK-9lo","published":"2026-08-19T19:45:59Z","src":"Generalist","subject":"Robotics"},{"t":"Front Page LIVE: Cognizant's non-STEM hiring bet and Cyient's engineering turnaround","s":"Two substantial segments. Cognizant onboarded 489 B-school graduates, deliberately weighted toward non-STEM subjects (sociology, psychology, office management, industrial design; over 42% women), on the thesis that the AI skills gap is a translation gap, not a coding gap — someone still has to convert what a model can technically do into what a client wants solved. Then Cyient's DET head Sukamal Banerjee explains why he refuses the 'AI-first' label, calling his approach 'embracing intelligence', and walks through a 0.9% constant-currency revenue decline and a 15% EBIT margin target pushed back a full year.","glance":"The emerging enterprise-AI bottleneck is translation, not code: firms are hiring psychology and design grads beside engineers because judgment about what a client actually needs is the part AI does not absorb.","url":"https://www.youtube.com/watch?v=Rnc9KeU1nN0","vid":"Rnc9KeU1nN0","published":"2026-08-19T21:06:31Z","src":"AIM Network","subject":"Business","pointsLabel":"Segments covered","points":[{"t":"Cognizant hires 489 B-school grads, heavily non-STEM","s":"The intake skews to sociology, psychology, office management and industrial design, with 42%+ women, and sits inside a commitment to scale to 5,000 frontier-certified engineers and 10,000 frontier business operators. The stated logic: as AI absorbs technical work, interdisciplinary judgment about what to build becomes the scarce input."},{"t":"Cyient DET: 'embracing intelligence', not 'AI-first'","s":"Banerjee says peers painted their websites with 'AI-first' as an empty slogan; in mission-critical, safety-critical industries adoption stays in the hands of domain experts with the wisdom to judge what to accept. He also notes AI's coding-productivity effect has not yet arrived in mechanical, electrical or electronics engineering."},{"t":"Why the numbers went backwards, and the Tao Digital deal","s":"DET fell 0.9% year-on-year in constant currency, driven almost entirely by one large energy project ramping down; outside energy the business grew. The 15% EBIT target moved from Q4 FY27 to H1 FY28 because they refused to cut transformation investment to hit a quarterly number. The Tao Digital acquisition is called transformative for capability (platform-software and data engineering), not scale."},{"t":"What changes for a working engineer","s":"Effort is shifting out of the middle of the product lifecycle and toward both ends — design and concept at the front, integration, packaging and documentation at the back. Banerjee's advice is adaptability and constant learning, and he flags rising memory prices as a real constraint that ends the 'storage is cheap, generate all the data' era."}]}]},{"h":"Space & hard science","items":[{"t":"How a failed science experiment rediscovered a missing colour","s":"Tyrian purple cost more than three times its weight in gold because 1g needed the anal glands of about 10,000 murex snails, fermented with salt and children's urine in lead pots until sunlight oxidised the yellow brew through green to purple. The recipe died with Byzantium in 1453, until in 1856 an 18-year-old, William Perkin, failed to synthesise anti-malarial quinine from coal-tar aniline and accidentally made mauve — the first synthetic dye. That industry became Bayer; its acid chemistry led to fertiliser, then explosives, then WWI mustard gas — and doctors noticing mustard gas destroyed fast-dividing white blood cells gave us the alkylating agents used in almost every cancer treatment today.","glance":"A failed attempt to synthesise a malaria drug produced the first artificial dye, and that same coal-tar chemistry chain ran through fertiliser and mustard gas to today's alkylating chemotherapy agents.","url":"https://www.youtube.com/watch?v=lqfSkPPrUno","vid":"lqfSkPPrUno","published":"2026-08-19T21:00:30Z","src":"ABC Science","subject":"Science"},{"t":"SpaceX recovers an intact Starship from the sea after 24 days","s":"On Flight 13 Starship tipped into the Indian Ocean and, for the first time, floated intact — a 170-ft vehicle roughly 1,000 miles off north-west Australia. Recovery crews fought worsening seas for days; Musk publicly said recovery was 'not looking good' before the team towed the ship the opposite way, to Christmas Island, after about 24 days at sea, where engineers can now inspect suborbital-flight damage in calm water before the trip back to Starbase. The episode also reports the next-gen Tesla Roadster may be unveiled this month at SpaceX's McGregor engine test site, with a limited SpaceX-branded version using actual cold-gas thrusters — a claim still sourced to reporting, not a confirmed Tesla event.","glance":"Starship survived an ocean landing intact and was towed 24 days to Christmas Island, giving SpaceX its first hands-on look at what a suborbital re-entry actually does to the airframe.","url":"https://www.youtube.com/watch?v=P-n18Ub8C5Q","vid":"P-n18Ub8C5Q","published":"2026-08-19T19:00:31Z","src":"The Tesla Space","subject":"Space"},{"t":"KELT-9b: the exoplanet so hot it tears molecules apart","s":"KELT-9b is over twice Jupiter's size and mass and is the hottest known exoplanet: its dayside peaks above 7,800°F, hot enough to dissociate molecules, and the vaporised iron and titanium in the upper atmosphere absorb so much energy that the atmosphere reaches over 19,000°F — roughly twice the temperature of the Sun's surface. It is tidally locked, so the other hemisphere sits in permanent night, its atmosphere is boiling off into space, and it completes an orbit every ~33 hours from 667 light-years away.","glance":"A planet's atmosphere can end up hotter than its surface: vaporised iron and titanium in KELT-9b's upper layers trap stellar radiation and push it past 19,000°F, twice the Sun's surface temperature.","url":"https://www.youtube.com/watch?v=CPW0DuxHPmQ","vid":"CPW0DuxHPmQ","published":"2026-08-19T19:49:24Z","src":"ASTRO ALEXANDRA","subject":"Space","short":true},{"t":"Why Sakurai is the quantum mechanics textbook to use","s":"The recommendation is Sakurai & Napolitano's Modern Quantum Mechanics, specifically the first half written by Sakurai himself. Its distinguishing move is opening not with wave mechanics but with the Stern-Gerlach experiment, using it to argue that the only way to describe the observed result is if the internal dynamics involve complex numbers — so the imaginary unit is derived as a physical necessity rather than assumed. From there it builds angular momentum, then the Heisenberg and Schrödinger pictures. Griffiths remains the undergraduate text; Sakurai is the graduate one.","glance":"Sakurai teaches quantum mechanics by starting from Stern-Gerlach and showing that complex numbers are physically forced on you, not a mathematical convenience — which is why it's the graduate standard.","url":"https://www.youtube.com/watch?v=Qe5Q6dZD9js","vid":"Qe5Q6dZD9js","published":"2026-08-19T21:28:23Z","src":"From First Principles","subject":"Physics","short":true}]},{"h":"Money, markets & business","items":[{"t":"The 90-day clause hidden in every SpaceX AI compute deal","s":"Every AI compute agreement SpaceX has announced — with Google, Anthropic, Reflection AI — contains a clause, inserted at SpaceX's request, letting either party wind up on 90 days' notice. The argument is that this is leverage, not risk-sharing: it lets SpaceX reclaim compute for its own model training or inference if it has a breakthrough, and it lets them reprice into a spot market. With no exclusivity, SpaceX can tell a customer that rivals are offering double and invite them to match in 90 days or exit.","glance":"Short termination windows in infrastructure contracts are a pricing option, not a weakness — SpaceX asked for 90-day exits so it can reclaim or reprice its own compute as the spot market moves.","url":"https://www.youtube.com/watch?v=0xr1fx1E-NA","vid":"0xr1fx1E-NA","published":"2026-08-20T00:41:58Z","src":"Solving The Money Problem","subject":"Business"},{"t":"How Starlink services broken compute in orbit: it doesn't","s":"Asked how you repair a data centre in space, SpaceX's launch-business CFO answers that you don't — you deorbit the satellite. Failures are not expected to cluster, the fleet is replaced on a roughly five-year cycle anyway, and each generation is around ten times more capable than the last, so the replacement cadence absorbs the failures. That, plus Starlink itself, is why SpaceX puts orbital data-centre capacity three years out while hedge funds argue it is five to ten.","glance":"Orbital data centres skip repair entirely: on a five-year replacement cycle where each generation is ~10x more powerful, deorbiting a failed satellite is cheaper than servicing it.","url":"https://www.youtube.com/watch?v=bGNlePpr46Q","vid":"bGNlePpr46Q","published":"2026-08-19T19:18:54Z","src":"Solving The Money Problem","subject":"Business","short":true},{"t":"The 2013 'Tesla is way overvalued' warning, revisited","s":"A August 2013 'Danger Zone' article argued Tesla was priced for enormous profit growth it had never demonstrated, noting its market cap was 50% above Harley-Davidson's on a third of Harley's projected revenue and half its gross margin. Split-adjusted, the stock sat near $9.50 when that warning ran; it is up roughly 35x since.","glance":"Comparing a scaling company to a mature one on current revenue and margin is how confident valuation calls go 35x wrong — the 2013 Tesla-vs-Harley-Davidson case is the canonical example.","url":"https://www.youtube.com/watch?v=Iyja4vf9xmM","vid":"Iyja4vf9xmM","published":"2026-08-19T23:38:45Z","src":"Solving The Money Problem","subject":"Investing","short":true}]},{"h":"Tech you can actually buy","items":[{"t":"LAVNA LP45 smart padlock review","s":"A rechargeable biometric padlock aimed at renters who can't replace the main door lock: IP67-rated, zinc-alloy body with a 10mm stainless shackle, storing up to 20 fingerprints plus Bluetooth app unlock at 4-5m and two physical override keys. The 500mAh battery lasts three to four months, and if it dies while you're outside, five minutes on a USB-C power bank restores fingerprint unlock. Priced around Rs 2,700-2,900. The practical use case shown is giving every family member keyless access so a child arriving home early isn't locked out.","glance":"If you rent and can't change the door lock, a biometric padlock gives the whole household keyless entry for under Rs 3,000 — and a five-minute power-bank top-up rescues a dead battery.","url":"https://www.youtube.com/watch?v=OQmma_pvNR0","vid":"OQmma_pvNR0","published":"2026-08-20T00:30:13Z","src":"talkingStuff Network","subject":"Gadgets"},{"t":"Pixel 11 Pro XL unboxing","s":"The retail box now contains only a USB-C to C cable and states outright that no SIM card is needed — the phone is eSIM-only. The camera bar carries a new multicolour LED called 'highlight' whose main job is signalling that you're talking to Gemini while the phone is face down, and PixelSnap magnetic accessories make the larger XL body easier to hold one-handed.","glance":"Google has gone eSIM-only on the Pixel 11 Pro XL and added a 'highlight' LED on the camera bar that tells you Gemini is listening while the phone lies face down.","url":"https://www.youtube.com/watch?v=i4WJV3stNoo","vid":"i4WJV3stNoo","published":"2026-08-19T19:01:33Z","src":"Joshua Vergara","subject":"Gadgets"}]},{"h":"Build & make","items":[{"t":"The 2ZR Yaris engine swap is finally assembled","s":"Two years into a 2ZR swap, the useful engineering detail is how to drive the 1ZR ACIS variable intake manifold without a standalone ECU: take the tach signal off the OBD-II port and feed a simple RPM switch that sends voltage above a threshold (set at 4,200rpm) to open the runner — acceptable precisely because ACIS isn't mission-critical. Other hard-won notes: the 1NZ fan fouls the ACIS manifold and needs the fan shroud trimmed; ARP wheel studs are longer, allowing a rear spacer to match wider control arms; and after two years it stops making sense to reinstall 100,000-mile axles to save money on a build you've already over-invested in.","glance":"You can trigger a variable intake manifold without a standalone ECU by taking the tacho signal off OBD-II into a cheap RPM switch — good enough for non-critical systems.","url":"https://www.youtube.com/watch?v=ck3HHrS07mo","vid":"ck3HHrS07mo","published":"2026-08-19T19:10:57Z","src":"Rassool Racing","subject":"DIY"}]},{"h":"Mind & practice","items":[{"t":"Awakening is not escaping your human life","s":"Loch Kelly names two obstacles. The first is treating awakening as either/or — either you're a human personality or you're pure awareness — when the ego doesn't need to be destroyed; it's a delusion but not an illusion, in the same way your hand is 'just awareness, energy and form' at depth yet still a hand when you use it. The second is spiritually zapping the protective parts of yourself. Borrowing from IFS, he argues you begin by thanking your managers, protectors and exiles — there are no bad parts, they are confused attempts at safety and connection — because deconstructing without acknowledging them means they return. The practical sequence is calming the nervous system, then befriending rather than repressing the parts that resist.","glance":"Trying to dissolve your protective parts stalls awakening — thank them first, because deconstructing without acknowledging them just guarantees they come back.","url":"https://www.youtube.com/watch?v=FYndP_-yRxQ","vid":"FYndP_-yRxQ","published":"2026-08-19T22:54:40Z","src":"Loch Kelly","subject":"Mindfulness"}]}]},"elon":{"day":"2026-08-18","source":"@jcub2x daily recap","note":"Built from 'Elon Musk posted 31 times on X today (08/18/26)'. The newer recap for 08/19 (129 posts) went up about an hour before this run and YouTube had not finished generating its captions, so it could not be transcribed in time; this recap is roughly 28 hours old. Engagement counts (likes/views) are not read out in the recap, so none are shown — items are ordered most-notable first. Per-post timestamps are not given in the recap either, so all items carry the recap's publish time.","items":[{"kind":"post","t":"SpaceX confirmed its recovery team had guided Starship Flight 13 to a spot off Christmas Island after roughly 24 days adrift in the Indian Ocean, with engineers heading out to inspect it in calmer water before any attempt to return it to Starbase.","s":"Musk quoted the SpaceX update with a one-line confirmation: 'Starship Flight 13 is being recovered from sea.' It is the first time an intact Starship has been retrieved from the ocean.","imp":"critical","iso":"2026-08-18T22:30:02Z","href":"https://x.com/elonmusk/status/2089717086310318249"},{"kind":"post","t":"Artificial Analysis published its agentic index, where Grok 4.6 took joint top spot at 59 alongside Claude Opus 5 Max, completing tasks in ~53 turns and ~0.5B input tokens versus ~103 turns and ~2B tokens, at about $0.84 per task.","s":"Musk amplified the result — 'Grok is very good at agentic tasks' — and told users to try Grok 4.6, adding that Grok 4.7, which he called a major upgrade, is coming soon.","imp":"important","iso":"2026-08-18T22:30:02Z"},{"kind":"repost","t":"Starlink announced partnerships with 48 airlines worldwide, covering more than 7,000 aircraft already equipped, undergoing installation, or under contract.","s":"Musk reposted the aviation-connectivity milestone without added comment.","imp":"important","iso":"2026-08-18T22:30:02Z"},{"kind":"repost","t":"Starlink said it was providing free internet through 17 September to customers in Hawaii affected by Hurricane Alala, and working with local officials to deploy terminals for emergency crews and residents in the worst-hit areas.","s":"Musk reposted the disaster-response announcement.","imp":"important","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"Investor Gavin Baker argued on the All-In podcast that Anthropic is losing marginal share to OpenAI, open source and Grok even while growing fast, and questioned who leaked its reported $65B annual recurring revenue figure ahead of a possible IPO roadshow.","s":"Musk's reply was a compliment rather than a jab: 'Anthropic is number one on revenue bench, which is by far the most important benchmark.' The $65B ARR figure is reported, not confirmed by Anthropic.","imp":"important","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"Goldman Sachs forecast a $1.8 trillion space economy by 2035, calling it the second space age; commenters argued the real figure is one or two orders of magnitude larger because space will carry most compute, power and internet traffic.","s":"Musk responded 'It will be much bigger', agreed with the compute-and-power argument, and added that 'space is bigger than big — Earth is super tiny by comparison'.","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"reply","t":"A clip circulated of Musk saying SpaceX has to pick its battles because 'if SpaceX doesn't do it, I'm not sure how it will happen' on making life multiplanetary; a viewer replied that there is only one battle.","s":"Musk answered: 'Consciousness must achieve this or it will die.'","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"A retrospective noted that when Marques Brownlee interviewed Musk eight years ago, Fremont was Tesla's only car plant; since then Tesla has added three more car factories, a Semi factory, three megafactories, a lithium refinery, 4680 cell production, the best-selling car in the world in the Model Y, and a level-4 Cybercab.","s":"Musk quoted it with: 'So much has been built since then.'","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"Peter Yang published a tutorial setting up five Grokbot agents — an adviser that manages other bots, a YouTube researcher, an X scout, an inbox-and-subscriptions cleaner, and a travel concierge — and tested whether one could install and play classic games.","s":"Musk quoted it with a single word, 'Grokbot', signalling endorsement of the agent-roster use case.","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"A second Grokbot guide argued the shift is that the bot now holds the computer, the login, the memory and the time, so the user's skill becomes deciding what to delegate and where a bot's authority ends — 'give each bot a job title, not a prompt'.","s":"Musk called the article 'interesting'. He used the same one-word response on a third, longer Grokbot setup guide.","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"Medicalsphere reported Grok 4.6 took the top spot on MedAgentBench, a benchmark for autonomous agents completing clinical tasks against simulated electronic health records, averaging ~95.9% pass@1 across three runs and edging out GPT-5.6.","s":"Musk noted 'Grok 4.6 takes top spot on this benchmark.' Benchmark results are vendor-adjacent and were not independently verified in the recap.","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"A separate legal-research benchmark put Grok 4.6 second at 62.12% for $1.52 per task, against Claude Opus 5 at 65.15% for $6.58 and GPT-5.6 at 60% for $19.69 — beating GPT-5.6 on accuracy at roughly a thirteenth of the cost.","s":"Musk amplified the cost-per-task comparison.","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"SemiAnalysis argued that Musk's first-principles engineering means SpaceX has likely secured sites for its remaining gigawatt of capacity and that a 10GW target for 2027 is within reach.","s":"Musk called the analysis 'interesting'. The 10GW figure is an outside projection, not a company commitment.","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"repost","t":"SpaceX said it is investing $40 million with South Haven officials to develop a new police and fire training facility for the communities around its sites.","s":"Musk reposted the local-investment announcement.","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"reply","t":"Research involving Anthropic interpretability researcher Jack Lindsey described 'mind viruses' in natural language that spread between AI agents — one model adopts an idea, stores it in persistent memory and passes it to another, with some payloads surviving a context wipe via persistent files.","s":"Musk's engagement treated the outcome as expected rather than surprising. The work is early and the recap did not cite a peer-reviewed publication.","imp":"interesting","iso":"2026-08-18T22:30:02Z"},{"kind":"reply","t":"A video argued that China is not a socialist success story but a state-capitalist one, dating its poverty reduction to Deng Xiaoping's 1978 legalisation of private business and attributing the Great Leap Forward famine to collectivised agriculture.","s":"Musk replied 'True.' The framing is contested among economists, and famine death estimates cited in the video (20-55 million) span a wide and disputed range.","imp":"noise","iso":"2026-08-18T22:30:02Z"},{"kind":"repost","t":"A widely shared post used Titanic survival rates — about 73% of women versus 19% of men — to argue that modern culture undervalues male sacrifice.","s":"Musk reposted it without comment. The statistics are broadly accurate for the Titanic but the wider cultural claim is opinion, not data.","imp":"noise","iso":"2026-08-18T22:30:02Z"},{"kind":"reply","t":"German media reported that a court found an Iraqi man not criminally responsible, on grounds of paranoid schizophrenia, for pushing a 16-year-old Ukrainian refugee in front of a freight train in Lower Saxony.","s":"Musk responded with an expression of alarm rather than text. Details are as reported in the recap and the case is politically contested; treat specifics as unverified here.","imp":"noise","iso":"2026-08-18T22:30:02Z"},{"kind":"reply","t":"A woman posted a personal account of being sexually abused and groomed as a child, describing the ethnicity of the perpetrators and objecting to statistics being used to dismiss her experience.","s":"Musk responded with an expression of alarm. The post is a personal testimony, not verified reporting; it is summarised here without reproducing its contents.","imp":"noise","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"The All-In Summit 2026 speaker list was published, led by Jensen Huang, Satya Nadella, Gwynne Shotwell, Jared Isaacman, Brad Gerstner and Bill Gurley among others.","s":"Musk: 'Wow, this is an all-star lineup.'","imp":"noise","iso":"2026-08-18T22:30:02Z"},{"kind":"repost","t":"Grok announced a contest offering $100,000, $50,000 and $25,000 for the top three video scenes from Homer's Odyssey created with Grok Imagine's video and voice capabilities.","s":"Musk reposted the contest announcement.","imp":"noise","iso":"2026-08-18T22:30:02Z"},{"kind":"post","t":"Cursor announced Origin, its own code-hosting platform, integrated with the Cursor editor and able to sync repositories from GitHub.","s":"Musk quoted it with 'Sync to origin.'","imp":"noise","iso":"2026-08-18T22:30:02Z"}],"highlight":{"t":"Starship Flight 13 recovered intact from the Indian Ocean","s":"After Flight 13's ship survived its ocean splashdown and floated instead of breaking up, SpaceX spent about 24 days towing the roughly 170-foot vehicle through rough seas — at one point Musk publicly said recovery was 'not looking good' — before guiding it to Christmas Island. Musk's confirmation, 'Starship Flight 13 is being recovered from sea', marks the first time an intact Starship has been retrieved from the water, giving engineers their first direct look at what a suborbital flight does to the airframe.","href":"https://x.com/elonmusk/status/2089717086310318249"}},"elonNews":[{"t":"Starlink reapplies for an Indian satellite licence with direct-to-device plans","s":"Musk's Starlink has filed a fresh application for Indian regulatory approval of its satellite broadband network, this time including direct-to-device service, according to an Economic Times report picked up by Reuters. An earlier bid had stalled over security and spectrum conditions.","url":"https://news.google.com/rss/articles/CBMitwFBVV95cUxPNGlzNWhsVGxkUlYyV1NXU3c5cWNNUjVfMHJZS3hJdXpza3pGR3puMmFzajBGV0otcXhMeTVpeUNqbzhlU3V0Qm9sLTA0cnlEQVRsRDhJQlR","published":"2026-08-20T00:42:00Z","src":"Reuters"},{"t":"SpaceX recovers the Starship it once feared lost in the Indian Ocean","s":"SpaceX engineers reached the Starship upper stage that splashed down near Christmas Island in the Indian Ocean and recovered the vehicle nearly 24 days after landing, the first time a flown Starship has been retrieved from the sea. Elon Musk had earlier said the ship, Ship 40, was probably lost.","url":"https://www.bbc.co.uk/news/videos/c4gw160q3v3o?at_medium=RSS&at_campaign=rss","published":"2026-08-19T15:01:57Z","src":"BBC"},{"t":"xAI asks a federal judge to block Minnesota's AI 'nudification' ban","s":"Musk's xAI argued in federal court in Minneapolis that Minnesota's law banning AI-generated sexual deepfakes is unconstitutionally broad and should be temporarily blocked. The judge is weighing the request; the state says the law targets non-consensual imagery, not speech.","url":"https://news.google.com/rss/articles/CBMirgFBVV95cUxOdEdnLWlXMVlLLTZUOUplaUNwN2xzS3lQbnd1SlN1dlRzaGlBR0dPT1Byb0paVjI1azJZVC1aTzhQVUNQMVJRdUlGbXNySVFadEV4ZWRjYU9","published":"2026-08-19T22:33:00Z","src":"CBS News"},{"t":"Cognition's CEO denies a report that SpaceX tried to buy the startup","s":"Cognition chief executive Scott Wu publicly denied a report that SpaceX had approached the AI coding startup about an acquisition, calling the account inaccurate. The denial follows a run of reports about SpaceX expanding beyond launch and satellites.","url":"https://techcrunch.com/2026/08/19/cognition-ceo-denies-report-that-spacex-tried-to-acquire-the-startup/","published":"2026-08-19T21:51:23Z","src":"TechCrunch"},{"t":"Tesla opens Cybercab robotaxi rides to a select group of riders","s":"Tesla began offering rides in the two-seat Cybercab to a small set of invited members of the public through a sweepstakes, the vehicle's first public passenger outings ahead of a wider Austin rollout.","url":"https://www.teslarati.com/tesla-opens-cybercab-first-public-ride-sweepstakes/","published":"2026-08-19T16:03:03Z","src":"Teslarati"},{"t":"A NASA orbiter photographs the crater left by a SpaceX rocket on the Moon","s":"NASA's Lunar Reconnaissance Orbiter has imaged a fresh crater on the lunar surface created when a spent SpaceX rocket stage struck the Moon earlier this month, giving scientists before-and-after pictures of an impact of known origin.","url":"https://www.space.com/astronomy/moon/a-spacex-rocket-slammed-into-the-moon-this-month-and-a-nasa-spacecraft-has-spotted-its-lunar-grave-photos","published":"2026-08-19T17:00:00Z","src":"Space.com"},{"t":"Ex-Tesla president links the Roadster delay to SpaceX thruster technology","s":"Former Tesla president Jerome Guillen said the long-delayed next-generation Roadster has slipped because the car is being reworked around SpaceX-derived cold-gas thrusters, tightening the two companies' engineering overlap ahead of a mooted merger.","url":"https://electrek.co/2026/08/19/ex-tesla-president-roadster-delay-spacex-thrusters/","published":"2026-08-19T13:40:39Z","src":"Electrek"},{"t":"China's Landspace lands a Zhuque-3 booster, narrowing SpaceX's lead","s":"Landspace recovered the first stage of its Zhuque-3 rocket on land after a second orbital flight, making it the latest Chinese firm to demonstrate booster reuse and further eroding SpaceX's monopoly on routine recovery.","url":"https://spacenews.com/chinas-landspace-recovers-booster-with-second-orbital-launch-of-zhuque-3-rocket/","published":"2026-08-19T01:10:00Z","src":"SpaceNews"}],"elonNewsUpdated":"2026-08-20T02:54:03.382042+00:00"};

/* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();
/*FRESH_GUARD_END*/

  if(has(/philosoph|stoic|existential|metaphysic|epistem|\bethics\b|meaning of life|nietzsche|nihilis|absurd|virtue|wisdom of|the good life/)) return "phil";
  if(S==="health"||has(/\bhealth\b|fitness|workout|\bdiet\b|nutrition|\bsleep\b|longevity|medical|hair loss|\bmuscle\b|disease|mental health|therapy|dopamine|fasting|cardio|protein/)) return "health";

const TAB_META={news:["News",""],breakthroughs:["Breakthroughs","breakthroughs"],aitrends:["AI Trends","trends"],science:["Science","breakthroughs"],scidaily:["Science Daily","studies"],youtube:["YouTube","videos"],elon:["Elon","updates"],mind:["Mind","items"],som:["Star of Mysore","pages"]};

// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");

  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>

  });

const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");

let filterT=null;

function applyFilter(){

// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }

function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));

  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }

const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");

document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }

  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }

});

(function(){
