4, "timeline": "now", "evidence": "strong", "verdict": "Detectable provenance for AI text", "basis": "SynthID-style token biasing; survives copy-paste and light edits, not rewriting"}}, {"t": "Data-centre power becomes the binding constraint", "s": "US data centres could consume more natural gas than Germany and Japan combined by 2035 on current trajectories, and TechCrunch documented the build-out colliding with towns already scarred by heavy industry. Georgia Power meanwhile said new large-load contracts will cut about $180 a year from customer bills, so the local picture is genuinely mixed.", "heat": 55, "delta": "new", "sources": 9, "url": "https://techcrunch.com/2026/09/15/us-data-centers-could-consume-more-natural-gas-than-germany-and-japan-combined-by-2035/", "glance": "Power, not chips, is the limit", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Energy is the real AI bottleneck", "basis": "Projection of US data-centre gas demand exceeding Germany plus Japan by 2035"}}, {"t": "TabPFN-3.5 tops tabular foundation models", "s": "A new release of TabPFN claims state of the art for tabular foundation models — predicting on spreadsheet-shaped business data with no task-specific training. Most real company data is tabular, and a model that works well on a few hundred rows without a training run is the version of AI most small businesses can actually use.", "heat": 46, "delta": "new", "sources": 4, "url": "https://www.reddit.com/r/MachineLearning/comments/1wh4xhy/tabpfn35_is_released_as_the_next_sota_tabular/", "glance": "Foundation model for spreadsheets", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Zero-training predictions on small tables", "basis": "Announced as SOTA tabular foundation model; no task-specific training required"}}, {"t": "Frontier-class local models reach consumer hardware", "s": "DeepSeek V4.1 Flash is running at around 40 tokens/second on an M3 Ultra with native speculative decoding, and Qwen3.8-27B variants with 1M-token context are circulating in NVFP4 quantisation. The gap between what you can run privately on one machine and what the API vendors sell keeps narrowing.", "heat": 44, "delta": "rising", "sources": 6, "url": "https://www.reddit.com/r/LocalLLaMA/comments/1wgy6tm/deepseek_v41f_q4_on_m3_ultra_with_native_dspark/", "glance": "Big models run on one desktop", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Private inference gets practical", "basis": "Community benchmarks: V4.1 Flash ~40 tok/s on M3 Ultra; Qwen3.8-27B at 1M context"}}, {"t": "Meta puts a price on social media and AI", "s": "Meta launched \"One\" subscriptions bundling its apps with AI features, its clearest move yet to charge consumers directly rather than monetise only through advertising, and separately let AI agents handle WhatsApp Business onboarding.", "heat": 40, "delta": "new", "sources": 4, "url": "https://news.google.com/rss/articles/CBMib0FVX3lxTE94eVZYQ3hkeXdTd1JMV0oxV2lISzk4ZmhsV1NFNlFKNzNDRkZDVEllR20zajJ4bW9uMEpJNEpnQWlwRTh6LVRtaDZPU1F6eHFCMlFhdFlmUUNXSkIyR2lzM0hFdXFpRk0wMVZ4MjJ0cw?oc=5", "glance": "Meta starts charging for AI", "assess": {"mag": 2, "timeline": "now", "evidence": "proven", "verdict": "Consumer subscriptions for AI features", "basis": "Meta One launch plus AI agents handling WhatsApp Business setup"}}, {"t": "OpenAI pushes its IPO to 2027 and buys a camera maker", "s": "Sam Altman told Fortune an IPO this year would be ill-advised, moving the listing to 2027 at the earliest and reversing guidance the CFO gave employees last month. Separately OpenAI acquired smartphone-camera maker Glass Imaging for a reported $300 million, another signal it intends to ship hardware.", "heat": 38, "delta": "cooling", "sources": 5, "url": "https://techcrunch.com/2026/09/14/openai-buys-smartphone-camera-maker-glass-imaging-for-300-million-report-says/", "glance": "OpenAI delays IPO, buys camera firm", "assess": {"mag": 2, "timeline": "now", "evidence": "proven", "verdict": "Listing slips, hardware ambitions grow", "basis": "Altman interview with Fortune; Glass Imaging acquisition reported at $300M"}}]}, "aitrendsUpdated": "2026-09-16T02:01:13Z", "science": {"updated": "2026-09-16T02:01:13Z", "items": [{"t": "Seawater becomes hydrogen and drinking water in one 250-kilowatt machine", "s": "Direct seawater electrolysis normally corrodes electrodes and triggers chlorine side-reactions. A team reporting in Nature Energy coupled alkaline electrolysis to low-temperature desalination, using the electrolyser's own waste heat to distil the seawater it then splits — so the stack always sees fresh water. They ran it at 250 kW, a real pilot rather than a bench cell. Peer-reviewed in Nature Energy.", "tag": "Energy", "imp": "critical", "glance": "Seawater to hydrogen at pilot scale", "url": "https://www.nature.com/articles/s41560-026-02130-6", "published": "2026-09-15T00:00:00Z", "src": "Nature Energy", "assess": {"mag": 5, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Green hydrogen without fresh water", "basis": "250 kW pilot in Nature Energy; waste-heat desalination feeds the electrolyser"}}, {"t": "An oral pill shrank KRAS-G12D lung and pancreatic tumours in a first human trial", "s": "KRAS G12D is one of the most common cancer mutations and among the hardest to drug. GFH375 is an oral, dual on-off binding inhibitor; in a phase 1 trial reported in Nature Medicine it produced encouraging response rates in non-small-cell lung cancer and pancreatic cancer, with most treatment-related side effects low-grade. There was one treatment-related death, and phase 1 measures safety, not survival. Peer-reviewed in Nature Medicine.", "tag": "Health", "imp": "critical", "glance": "Oral drug hits \"undruggable\" KRAS", "url": "https://www.nature.com/articles/s41591-026-04559-4", "published": "2026-09-15T00:00:00Z", "src": "Nature Medicine", "assess": {"mag": 5, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "First oral answer to KRAS-G12D", "basis": "Nature Medicine phase 1; responses in NSCLC and pancreatic cancer, one drug-related death"}, "eli": "KRAS is a switch inside cells that tells them to keep growing. In many lung and pancreatic cancers that switch is jammed on, and for forty years nobody could make a drug that fits it. This pill fits one of the jammed versions, and in a first safety trial some tumours shrank."}, {"t": "Solar cells ran 10 metres under the South China Sea and charged a battery in two hours", "s": "Sunlight is scattered and absorbed fast in water, so underwater photovoltaics have only ever been tested at about two metres. A Yunnan University team tuned cells to the narrow blue-green band that survives at depth and ran them 10 metres down in the open sea, harvesting enough power to charge lithium-ion batteries in two hours. That is the difference between a lab curiosity and a way to keep seabed sensors, moorings and underwater drones running without surfacing. Peer-reviewed in Joule.", "tag": "Energy", "imp": "important", "glance": "Underwater solar works at 10m", "url": "https://www.sciencealert.com/scientists-successfully-test-underwater-solar-cells-32-feet-below-the-south-china-sea", "published": "2026-09-15T13:00:00Z", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Power for seabed sensors and drones", "basis": "Open-sea test at 10 m in Joule; charged Li-ion cells in two hours"}}, {"t": "A \"living medication\" made from patients' own cells rebuilt bone in advanced osteoporosis", "s": "Osteoporosis affects an estimated 500 million people and causes up to 37 million fragility fractures a year, and existing drugs mostly slow loss rather than rebuild. In a first-in-human phase 1 trial reported in Cell, ten patients with advanced osteoporosis received a modified version of their own mesenchymal stem cells and showed significant bone-strengthening effects. Ten patients is a safety trial, not proof of fracture prevention. Peer-reviewed in Cell.", "tag": "Health", "imp": "important", "glance": "Own cells rebuild weak bone", "url": "https://www.sciencealert.com/living-medication-may-have-restored-bone-strength-in-10-patients-with-advanced-osteoporosis", "published": "2026-09-15T22:00:00Z", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Cell therapy that rebuilds bone", "basis": "First-in-human phase 1 in Cell; 10 patients, safety primary endpoint"}}, {"t": "Plasma plus electricity turns waste CO₂ into methanol and butane in one step", "s": "Turning captured carbon dioxide into something worth selling is what makes carbon capture pay for itself, and most routes need high pressure or scarce catalysts. Yale researchers combined electrocatalysis with a plasma stage to make methanol, butane and other feedstock chemicals from CO₂ at practical efficiency. Peer-reviewed in Nature Catalysis.", "tag": "Chemistry", "imp": "important", "glance": "CO₂ into fuel feedstock", "url": "https://phys.org/news/2026-09-plasma-electricity-methanol-butane-chemicals.html", "published": "2026-09-15T22:40:01Z", "src": "Phys.org / Nature Catalysis", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Makes captured carbon worth money", "basis": "Nature Catalysis; plasma plus electrocatalysis yields methanol and butane"}}, {"t": "A deep-sea enzyme makes ammonia from air and survives industrial heat", "s": "Ammonia for fertiliser is made by the Haber-Bosch process, which consumes roughly 1-2% of world energy. Natural nitrogen-fixing enzymes are a gentler route but fall apart at useful temperatures. Researchers characterised a nitrogenase from a deep-sea microbe that stays stable when hot, which is the property a bio-industrial fertiliser process would need. Peer-reviewed; enzyme-level result, not a plant.", "tag": "Chemistry", "imp": "important", "glance": "Heat-proof enzyme fixes nitrogen", "url": "https://phys.org/news/2026-09-stable-enzyme-deep-sea-microbe.html", "published": "2026-09-15T18:00:06Z", "src": "Phys.org", "assess": {"mag": 4, "timeline": "10+ yrs", "evidence": "early", "verdict": "A gentler path to fertiliser", "basis": "Thermostable nitrogenase characterised; enzyme-level, far from industrial scale"}}, {"t": "One nanopore reads amino acids, DNA bases, sugars and peptides at once", "s": "Existing nanopore sensors are tuned to one class of molecule at a time. By modifying a bacterial porin, researchers built a single pore that identifies amino acids, nucleoside monophosphates, saccharides and peptides simultaneously, hitting 98.7% classification accuracy with machine learning and reading the composition of native glycopeptides. That is a route to cheap multi-analyte diagnostics on one chip. Peer-reviewed in Nature Biotechnology.", "tag": "Biology", "imp": "important", "glance": "One sensor reads four molecule types", "url": "https://www.nature.com/articles/s41587-026-03322-x", "published": "2026-09-15T00:00:00Z", "src": "Nature Biotechnology", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Multi-analyte diagnostics on one pore", "basis": "Nature Biotechnology; 98.7% accuracy across four analyte classes"}}, {"t": "Quantum teleportation jumped to 100 channels at once, carrying a whole image", "s": "Quantum teleportation has been demonstrated for years, but one channel at a time — which caps how much a future quantum network could carry. A team led by Jietai Jing at East China Normal University teleported the quantum state of a 100-pixel image across 100 independently addressable channels simultaneously, the largest parallel teleportation reported. Bandwidth, not distance, is the bottleneck for linking quantum computers, and this attacks it directly.", "tag": "Physics & Space", "imp": "important", "glance": "100-channel quantum teleportation", "url": "https://www.sciencealert.com/breakthrough-scientists-just-teleported-an-image-across-100-quantum-channels-at-once", "published": "2026-09-15T02:38:45Z", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Bandwidth for quantum networks", "basis": "Largest parallel teleportation reported: 100 addressable channels, 100-pixel image"}}, {"t": "Organ-on-a-chip screening is good enough to cut thousands of animal drug tests", "s": "Regulators have been waiting for non-animal safety data that is actually more predictive, not merely more humane. New Scientist reports that organ-on-a-chip devices and organoids now give more accurate human safety signals than animal models for several toxicity endpoints, which is what regulators need before they will accept them — and would remove thousands of animal tests per drug programme while making early safety calls better.", "tag": "Health", "imp": "important", "glance": "Chips replace animal safety tests", "url": "https://www.newscientist.com/article/2587512-how-better-ways-of-screening-drugs-could-soon-lead-to-thousands-fewer-animal-tests/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "published": "2026-09-15T15:00:00Z", "src": "New Scientist", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Better safety data, fewer animals", "basis": "Organ-on-chip and organoid toxicity data now outperform animal models on key endpoints"}}, {"t": "A placenta-derived nasal spray held off Alzheimer's decline in mice", "s": "Amyloid and tau get the attention, but chronic activation of microglia and astrocytes damages neurons through inflammation too. A team at the Catholic University of the Sacred Heart gave mice a nasal formulation of extracellular vesicles from human placental cells and saw protection against cognitive decline. This is a mouse study — animal, preclinical — and Alzheimer's has a long history of mouse results that did not carry over. Peer-reviewed in Translational Neurodegeneration.", "tag": "Health", "imp": "important", "glance": "Nasal spray targets brain inflammation", "url": "https://www.sciencealert.com/nasal-spray-derived-from-human-placenta-protects-against-alzheimers-decline-study-in-mice-shows", "published": "2026-09-16T01:08:19Z", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "10+ yrs", "evidence": "early", "verdict": "Anti-inflammatory route into the brain", "basis": "Mouse study, Translational Neurodegeneration; placental vesicles given nasally"}}, {"t": "CAR T-cell therapy cleared a 3-year-old's liver cancer in two doses", "s": "A chemotherapy-resistant hepatoblastoma went into complete remission after two doses of CAR T cells, delivered entirely on an outpatient basis, in a case report in the New England Journal of Medicine. CAR-T has so far worked mainly in blood cancers; this is a single patient, so the finding is early, but it is a usable route into solid tumours.", "tag": "Health", "imp": "important", "glance": "CAR-T clears a child's solid tumour", "url": "https://www.sciencealert.com/a-3-year-olds-metastatic-cancer-disappeared-after-two-doses-of-experimental-therapy", "published": "2026-09-15T01:08:09Z", "src": "ScienceAlert / NEJM", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "CAR-T reaches a solid tumour", "basis": "NEJM case report: durable complete remission, outpatient"}, "eli": "CAR-T means taking a patient's own immune cells and rewiring them to recognise cancer. It has worked well against cancers of the blood, but solid lumps are harder to get into. Here two infusions cleared a liver tumour in a three-year-old that chemotherapy could not touch."}, {"t": "A hidden nickel structure could cut catalyst metal use tenfold", "s": "Researchers at DICP showed that the active site in methane partial oxidation is an in-situ [Ni1O4Ni4] structure formed on nickel oxide, not the metallic nickel nanoparticles chemists have assumed for years. Designing catalysts around that structure points to methane-to-syngas catalysts that use about ten times less nickel, which is the main cost in the process.", "tag": "Chemistry", "imp": "important", "glance": "Ten times less nickel per catalyst", "url": "https://scitechdaily.com/nickel-catalysts-dont-work-the-way-scientists-thought/", "published": "2026-09-15T00:58:13Z", "src": "Dalian Institute of Chemical Physics", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Redraws how syngas catalysts are designed", "basis": "In-situ characterisation identifies the real active site"}}, {"t": "Room-temperature magnetic synapses cut the power AI hardware needs", "s": "A device built on magnetic skyrmions behaves like a synapse at room temperature, storing and updating weights in the same place rather than shuttling them to memory. That removes the data movement that dominates the energy bill of running neural networks. It is a lab demonstration, not a chip.", "tag": "Physics & Computing", "imp": "important", "glance": "Skyrmion synapses run at room temperature", "url": "https://phys.org/news/2026-09-room-temperature-skyrmion-based-synapses.html", "published": "2026-09-14T23:20:01Z", "src": "Phys.org", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Neuromorphic parts leave the cryostat", "basis": "Room-temperature skyrmion synapse demonstrated in the lab"}}, {"t": "Antibody cocktails can be designed to steer viruses into dead ends", "s": "A Harvard study maps which escape mutations a virus can reach from a given antibody, and shows that choosing combinations whose escape routes conflict corners the virus in mutations that cost it fitness. Applied to influenza and SARS-CoV-2, it offers a way to design cocktails that variants cannot simply outrun.", "tag": "Biology", "imp": "important", "glance": "Cocktails that corner viral escape", "url": "https://phys.org/news/2026-09-antibody-cocktails-viruses-evolutionary-dead.html", "published": "2026-09-14T20:40:16Z", "src": "Harvard (via Phys.org)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Turns escape mapping into drug design", "basis": "Harvard fitness-landscape analysis of antibody escape routes"}}, {"t": "Off-the-shelf T cells from cord blood hunt tumours that hide their target", "s": "UCLA engineered TCR T cells from cord-blood stem cells that read protein fragments displayed from inside a cancer cell, so tumours cannot escape by hiding a surface marker. Because they are made from donor cord blood rather than each patient's own cells, they sidestep the weeks-long, high-cost personalised manufacturing that limits TCR therapy today. Preclinical.", "tag": "Health", "imp": "important", "glance": "Ready-made T cells for solid tumours", "url": "https://scitechdaily.com/ucla-scientists-develop-cancer-fighting-cells-that-tumors-struggle-to-escape/", "published": "2026-09-14T15:21:27Z", "src": "UCLA (via SciTechDaily)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Removes T-cell therapy's manufacturing bottleneck", "basis": "Cord-blood-derived TCR cells, preclinical; targets intracellular antigens"}}]}, "scienceUpdated": "2026-09-16T02:01:13Z", "scienceDaily": {"updated": "2026-09-16T02:01:13Z", "items": [{"t": "139 trials and 10,000 patients: knee braces beat high-tech options for arthritis pain", "s": "A network meta-analysis pooling 139 randomised trials and nearly 10,000 people with knee osteoarthritis found knee braces ranked highest overall for reducing pain, stiffness and mobility problems, with water-based therapy strongest for pain and regular exercise consistently improving both pain and function. More expensive high-tech interventions ranked lower. Peer-reviewed meta-analysis of randomised trials — the strongest evidence tier for a treatment comparison.", "tag": "Health", "imp": "critical", "glance": "Braces beat gadgets for knee pain", "url": "https://www.sciencedaily.com/releases/2026/09/260913082208.htm", "published": "2026-09-15T03:57:43Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Cheapest options rank highest", "basis": "Network meta-analysis: 139 RCTs, ~10,000 patients; braces and hydrotherapy top-ranked"}}, {"t": "Four weeks of a different diet measurably lowered biological age in older adults", "s": "Older adults who shifted the balance of fat, carbohydrate and animal protein in their diets showed reduced biological-age markers after four weeks, with the strongest effect in an omnivorous, lower-fat, higher-carbohydrate arm. Four weeks and epigenetic-clock endpoints are a long way from proven longevity benefit, but the intervention is free and immediately available. Peer-reviewed controlled trial; biomarker endpoints, not outcomes.", "tag": "Health", "imp": "important", "glance": "Diet shift cut biological age", "url": "https://www.sciencedaily.com/releases/2026/09/260915100000.htm", "published": "2026-09-16T01:35:54Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "Diet composition moves ageing markers", "basis": "Controlled trial, 4 weeks; epigenetic-age endpoints, not clinical outcomes"}}, {"t": "The flesh-eating screwworm is back in the US, and a new system predicts where it goes next", "s": "The New World screwworm, eradicated from the United States decades ago, has returned and is spreading north, threatening livestock, wildlife, pets and in rare cases people. A UC San Diego team built a tracking system that predicts where outbreaks will appear next, while officials revive the sterile-insect eradication strategy that worked before. For livestock owners this is an operational warning, not a curiosity.", "tag": "Biology", "imp": "important", "glance": "Screwworm returns; tracker predicts spread", "url": "https://www.sciencedaily.com/releases/2026/09/260914102439.htm", "published": "2026-09-15T10:39:40Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Predictive tracking for a livestock parasite", "basis": "UC San Diego prediction system; screwworm confirmed spreading north in the US"}}, {"t": "Low vitamin D tripled the odds of severe pain after breast cancer surgery", "s": "In 184 women undergoing mastectomy, those who were vitamin D deficient were three times more likely to report moderate-to-severe pain in the first 24 hours after surgery and used substantially more tramadol. Vitamin D status is cheap to measure and cheap to correct before elective surgery, which makes this immediately actionable if it replicates. Single-centre observational study of 184 patients — an association, not yet a proven intervention.", "tag": "Health", "imp": "important", "glance": "Vitamin D linked to post-op pain", "url": "https://www.sciencedaily.com/releases/2026/09/260914042053.htm", "published": "2026-09-14T12:52:54Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "early", "verdict": "A cheap pre-surgery check", "basis": "184-patient observational study; 3x risk of moderate-severe 24h pain if deficient"}}, {"t": "A chemistry rule taught for a century appears to be wrong by two or three bonds", "s": "The inductive effect — how an atom's pull on electrons fades along a chain of bonds — has been taught for nearly a hundred years as weakening gradually over three or four bonds. Researchers report that in neutral molecules it extends across roughly one bond and then stops. If it holds, it changes how chemists reason about reactivity when designing molecules, and makes the concept easier to teach correctly. Peer-reviewed.", "tag": "Chemistry", "imp": "important", "glance": "Textbook chemistry rule revised", "url": "https://www.sciencedaily.com/releases/2026/09/260913082157.htm", "published": "2026-09-14T14:13:47Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Rewrites a core reactivity rule", "basis": "Peer-reviewed; inductive effect in neutral molecules found to span ~one bond"}}, {"t": "Younger generations are ageing faster biologically, tracking their cancer risk", "s": "A Washington University study found that each more recent birth cohort looks biologically older than the one before it at the same chronological age, and that the gap tracks the rise in cancer diagnoses under 55. The practical consequence is that screening ages set for earlier generations are increasingly out of step with the population being screened.", "tag": "Health", "imp": "important", "glance": "Cohorts ageing faster than their years", "url": "https://www.sciencedaily.com/releases/2026/09/260913082200.htm", "published": "2026-09-14T14:47:07Z", "src": "ScienceDaily / WashU", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Screening ages lag the population", "basis": "Cohort analysis linking biological age to early-onset cancer"}}, {"t": "A wearable catches the night-time hormone surges routine tests miss", "s": "A portable device developed at Bristol tracked aldosterone around the clock and found that people with primary aldosteronism have bursts of the hormone at night, when blood is almost never drawn. Peer-reviewed in Science Translational Medicine, it explains why a condition that may affect up to one in five people with high blood pressure is so often missed, and points at a test that would actually find it.", "tag": "Health", "imp": "important", "glance": "Night-time hormone bursts explain missed hypertension", "url": "https://www.sciencedaily.com/releases/2026/09/260913081916.htm", "published": "2026-09-14T13:57:49Z", "src": "ScienceDaily / Science Translational Medicine", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Finds a treatable cause hiding from blood tests", "basis": "Wearable hormone monitoring, Science Translational Medicine"}, "eli": "Some high blood pressure is not just 'high blood pressure' — it is driven by a gland pumping out too much of a salt-retaining hormone, which is treatable once you spot it. The catch is that the surges happen while you are asleep, so a daytime blood test comes back normal. A wearable that samples all night finds them."}, {"t": "Blocking one mitochondrial step switched off the inflammation of ageing", "s": "Senescent cells were found to use malfunctioning mitochondria to unlock inflammatory genes, holding the immune system in a prolonged state of alert. Blocking one step in that pathway reduced inflammation and improved function in animals, giving a specific target for the chronic inflammation that drives age-related disease. Preclinical.", "tag": "Health", "imp": "important", "glance": "A drug target for inflammation of ageing", "url": "https://www.sciencedaily.com/releases/2026/09/260911214301.htm", "published": "2026-09-14T03:48:19Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Names a druggable step in inflammaging", "basis": "Animal work: blocking the pathway cut inflammation"}}]}, "scienceDailyUpdated": "2026-09-16T02:01:13Z", "life": {"updated": "2026-09-16T02:01:13Z", "items": []}, "lifeUpdated": "2026-09-16T02:01:13Z", "mind": {"updated": "2026-09-16T02:01:13Z", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "The brain rewires how it controls its own genome between 50 and 75", "s": "Researchers mapped sweeping changes in how the human brain regulates its genome starting in midlife. The largest shift fell between roughly ages 50 and 75, when many of the brain's original resident immune cells declined and were replaced by cells with a more inflammatory profile. That gives a concrete window and a concrete cell population to aim at for why ageing sharply raises Alzheimer's risk. Peer-reviewed; human post-mortem and single-cell genomic data.", "tag": "Neuroscience", "imp": "critical", "glance": "Brain's genome control shifts at 50", "url": "https://www.sciencedaily.com/releases/2026/09/260914102441.htm", "published": "2026-09-15T14:28:38Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A defined window for brain ageing", "basis": "Single-cell genomic mapping; resident microglia replaced by inflammatory cells at 50-75"}}, {"t": "Human intracranial recordings split the jobs of the two orbitofrontal cortices", "s": "Direct electrode recordings inside the human brain showed the medial and lateral orbitofrontal cortex contribute differently to valuing choices — a distinction previously inferred mostly from lesions and imaging. Intracranial human data is rare and settles arguments that scanner studies cannot. Peer-reviewed in Nature Neuroscience.", "tag": "Neuroscience", "imp": "important", "glance": "Two decision circuits separated", "url": "https://www.nature.com/articles/s41593-026-02444-4", "published": "2026-09-15T00:00:00Z", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Direct human recordings settle a split", "basis": "Nature Neuroscience; intracranial electrodes in humans, medial vs lateral OFC"}}, {"t": "Short-range brain wiring buffers cognition as grey matter shrinks", "s": "USC researchers imaged 459 community-dwelling adults over 60 in India and found that the condition of superficial white matter — the short fibres just beneath the cortex — predicts how strongly grey-matter loss translates into cognitive decline. Published in Alzheimer's & Dementia, and among the first such studies in a low- and middle-income population.", "url": "https://www.sciencedaily.com/releases/2026/09/260913081921.htm", "published": "2026-09-14T14:23:40Z", "src": "Alzheimer's & Dementia (USC Stevens INI)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Local wiring buffers grey-matter loss", "basis": "459-adult imaging cohort, Alzheimer's & Dementia"}, "eli": "As people age the outer layer of the brain thins, and that usually costs them some sharpness. This study says the short wires sitting just under that layer matter too: when they stay healthy, the thinning hurts far less.", "glance": "Local wiring buffers grey-matter loss"}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Paradromics' implant let a woman with motor neuron disease speak in real time", "s": "Paradromics reported real-time speech from its Connexus intracortical implant, decoding imagined words as the user thinks them rather than after a pause. The first patient, who has motor neuron disease, held live conversation. Real-time rather than batch decoding is the difference between a communication aid and a conversation. Early clinical, first-in-human — a single participant.", "tag": "BCI", "imp": "critical", "glance": "Implant gives real-time speech", "url": "https://news.google.com/rss/articles/CBMi9AFBVV95cUxQRk4xQjBCUFdZeFV1cjNFMzYySVQ2VTk2WmJlODBEd1hhNjhFY3pRLXBwWG04Z3NJdVBLTUNjSjVwcHZKdjByNGc1dUl2NkVWaTlrNlZ3SWFJSThQQng4bnhnd3NUOXFHV3c3THhQWnRiOEs5aTY2NjJBUG95bU1PN0NIQng3bXoyYl9mOUVzTWVzSkxkVldWQ3MzZTVZYTAzWHJjYVUzV05kTFB5TUtoQXh2Z25lLVNUMFZRS19kMm9YREpadDdJZkFkdzF5SnllRFpyam9kaWZNaEpJNnJmdnlYbUU0R0l2MHV2dTFMaDJBenhq?oc=5", "published": "2026-09-14T18:58:03Z", "src": "Paradromics / Eagle-Tribune", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Real-time decoding of imagined speech", "basis": "First-in-human Connexus implant; live conversation from a single participant"}}, {"t": "One implant lets paralysed people speak and gesture at the same time", "s": "A UCSF team covering a large stretch of sensorimotor cortex with a single iPhone-sized array decoded speech and movement signals simultaneously, letting participants with paralysis talk while their avatar nodded, shook its head or waved. Published in Nature Neuroscience; earlier implants managed one or the other, and gesture is what carries the nuance in ordinary conversation.", "url": "https://www.newscientist.com/article/2589210-brain-implant-lets-people-with-paralysis-speak-and-gesture-at-the-same-time/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "published": "2026-09-14T16:37:23Z", "src": "Nature Neuroscience (UCSF)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Speech and gesture from one array", "basis": "Nature Neuroscience: simultaneous multimodal decoding in paralysis"}, "glance": "Speech and gesture from one array"}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "A new study undercuts the core assumption behind the implicit bias test", "s": "The Implicit Association Test underpins a large share of unconscious-bias research and corporate training. A new study challenges its central assumption — that reaction-time differences index a stable hidden attitude — which bears on how much weight thousands of downstream findings and training programmes can carry. Peer-reviewed.", "tag": "Psychology", "imp": "important", "glance": "Implicit bias test challenged", "url": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxQem81TlZjMWMxR09VRWpzUy1tQnBXSTJiRkpxSTExNG5pS3ljY0JCaWhnTWwtMFh4eDYzMHR2NGRzcjZIZ0NmOEo3dVRuSUw2YmhvWU5zY2ptYTRoOFdxbXE1RThOZ2xBS3NJQWMtc1ZGaUlWODhvRnJiVG9oSXJFYXdwUFJZdERURDJ4M0dXUm1iUGN6dUJyR3NUbmFCXy1ZV0x4bTdyaEFfM0FqLWdsMXhKVkx2SG5JcHkw?oc=5", "published": "2026-09-15T14:43:02Z", "src": "PsyPost", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Questions the IAT's central premise", "basis": "Peer-reviewed challenge to the reaction-time-equals-attitude assumption in the IAT"}}, {"t": "Collectivism predicts behaviour better when defined as duty, not warmth", "s": "Cross-cultural psychology has long measured collectivism as generalised warmth toward one's group. Researchers report that defining it as specific duties within relationships gives substantially better predictive validity — which would revise a construct used across decades of cross-cultural comparisons. Peer-reviewed in Nature Human Behaviour.", "tag": "Psychology", "imp": "important", "glance": "Collectivism redefined as duty", "url": "https://www.nature.com/articles/s41562-026-02525-1", "published": "2026-09-15T00:00:00Z", "src": "Nature Human Behaviour", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Better predictive validity for a core construct", "basis": "Nature Human Behaviour; duty-based definition outperforms warmth-based measures"}}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today", "s": "No Major or Historic peer-reviewed consciousness result surfaced in the last 72 hours across the journal, preprint and search sweep. Consciousness studies is genuinely sparse week to week — a short section here is honest, not a gap.", "url": "", "published": "", "src": "", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "No standout result this cycle", "basis": "Full mind_feeds scan plus targeted sweep returned nothing at Major or above"}, "glance": "No standout consciousness result"}]}]}, "mindUpdated": "2026-09-16T02:01:13Z", "mindset": {"updated": "2026-09-16T02:01:13Z", "messages": [{"who": "Joseph Rodrigues", "t": "It took me 46 years to realize what I'll tell you in 39 minutes.", "vid": "W4Ln2lfLeVM", "url": "https://www.youtube.com/watch?v=W4Ln2lfLeVM", "gist": "He starts with the rented-Lamborghini problem: coaches who look wealthy on Instagram, sell programmes on the strength of that image, and then deliver generic advice you could have got from a search engine. His objection is not the rented car — presenting an aspirational image to attract clients is fine, he says, as long as you actually deliver what you promised. The objection is templated advice sold as bespoke counsel. What he says he learned from doing IT work for genuinely wealthy business owners is that they look nothing like the image: no flashy cars, social feeds full of their kids, no interest in coaching anyone. When they did give advice it was specific, came from their own scar tissue, and produced results you would not find in a textbook. So value the nuances rather than black-and-white rules, and if generic advice fails you, treat that as useful — it forces you to find the way to market and sell that fits you rather than someone else's template. The three habits he draws out of those owners: they build the business rather than the image, they spend money on the life they actually want rather than on proof of it, and they put capital aside for long-term wealth and for the next product, because every product has a life cycle and a declining one is normal rather than a failure."}, {"who": "Elmer O. Locker Jr", "t": "Change Your Consciousness, Change Your Reality Now!", "vid": "MUkEEwsciIA", "url": "https://www.youtube.com/watch?v=MUkEEwsciIA", "gist": "A short, blunt restatement of the Neville Goddard premise he returns to most: your outer circumstances will not move until your inner state does. He frames the life you are living as a film already shot — written, rehearsed and finished — which will keep playing exactly as it is unless you change the one thing you actually control. That control is twofold: mastering where your attention goes, and changing your concept of yourself in the present moment. Not planning differently, not trying harder inside the same self-image, but assuming you are already someone different and holding that. He is emphatic that this is available at any time and costs nothing, which is the point of the urgency in the title — nothing external is stopping the change, so the only question is whether you make it now."}, {"who": "AH Universe", "t": "Get Addicted to Feeling Good! (Abraham Hicks 2026)", "vid": "eyOm9XjQ6T8", "url": "https://www.youtube.com/watch?v=eyOm9XjQ6T8", "gist": "A woman who has been at home raising her children says she is ready for a larger life but cannot name what she wants beyond 'healthy, wealthy and wise'. The answer pushes back on the vagueness: satisfaction comes from specifying, because you cannot tell whether you match a desire you have not defined. Then the reframe — every stretch of dissatisfaction you have already waded through was itself the asking, so what you want is already in motion and the work left is only letting it in. The tell for whether you are letting it in is how you feel: discouragement, anger or flatness about a subject means you are blocking it right now, in this moment. Negative emotion, on this account, is not a failure but the most useful signal you have. The resistance came on one layer at a time and comes off the same way, through soothing rather than forcing. The closing point is the sharpest: many people are addicted to struggle because at some stage they decided it made them look virtuous or strong — and that addiction is what keeps them out of the receiving mode and demanding more struggle just to cover the basics."}]}, "mindsetUpdated": "2026-09-16T02:01:13Z", "youtube": {"count": 19, "note": "Uploads from the last 24 hours across 268 subscribed channels, gisted from real transcripts.", "groups": [{"h": "🤖 AI & Tech", "items": [{"t": "Satya Nadella on the AI Doomer Slowdown, Microsoft’s Master Plan & Who Wins AI", "s": "Satya Nadella argues the safety question is really a diffusion question: models are already far ahead of how they are used, and the bottleneck is change management inside companies, not capability. He wants enterprises to control weights, see generated code and fine-tune privately, and says the productivity gain will only show in GDP when AI invents new work rather than trimming existing workflows.", "glance": "The models are ahead of their uses — the hard part is rewiring how work actually gets done, not making them smarter.", "vid": "hdcsTeCFE0I", "url": "https://www.youtube.com/watch?v=hdcsTeCFE0I", "src": "@allin", "published": "2026-09-15T17:40:13Z", "points": [{"t": "Capability overhang is real", "s": "Models are already good enough; broad diffusion is slow because workflows and change management take years, not because the science is missing."}, {"t": "Enterprises want control, not just access", "s": "Customers are asking to embed knowledge in weights they own, see all generated code, and fine-tune privately. A multi-model world is now a resilience requirement."}, {"t": "Where the productivity actually lands", "s": "His clearest example is healthcare: a doctor dictating to DAX Copilot instead of keying an EMR, plus inbox triage. Most healthcare cost is workflow cost."}, {"t": "The capital-allocation split", "s": "Land, power and cold shell are long-duration bets; racks and chips are about 60% of cost and are bought against a two-to-three-year demand forecast. Microsoft builds, leases and now rents to cover supply gaps."}, {"t": "Data centres have a receipts problem", "s": "Twenty years of data from Quincy, Washington: tax revenue up 12x, resident-paid taxes down a third, 1,200 continuous construction jobs, a new school and hospital. The industry has not told that story."}], "pointsLabel": "Five takeaways from the interview"}, {"t": "Anthropic researchers are quitting... and now we know why", "s": "Anthropic published a 154-page threat report the same week two researchers quit over safety concerns. It catalogues Russian malware crews using Claude agents to auto-rewrite flagged payloads, Chinese undergraduates running an autonomous zero-day pipeline, and hundreds of millions of distillation attacks from rival labs — all on Haiku/Sonnet/Opus tiers, none on the newest frontier models.", "glance": "The misuse is already industrial: agents that rewrite their own malware when antivirus flags it, and rival labs harvesting answers at a million requests a day.", "vid": "7r4ikZHm9AI", "url": "https://www.youtube.com/watch?v=7r4ikZHm9AI", "src": "@Fireship", "published": "2026-09-15T17:57:01Z"}, {"t": "Claude Is Now Leaving Invisible Fingerprints In Its Text", "s": "Claude now watermarks its text output. The generator secretly labels candidate next-words green or red and nudges toward green, so a long passage carries a statistical fingerprint invisible to humans. It survives copy-paste and light editing but not a full rewrite, and only approved organisations can run the check.", "glance": "AI text now carries a hidden statistical fingerprint that light editing will not remove — only a complete rewrite does.", "vid": "YoEWjZSwoys", "url": "https://www.youtube.com/watch?v=YoEWjZSwoys", "src": "@TwoMinutePapers", "published": "2026-09-15T10:24:01Z"}, {"t": "I Was Shocked How Easy This Agent Was To Use", "s": "A walkthrough of a consumer agent that runs on a hosted virtual machine rather than your own computer, connecting to email, calendar and apps. The demo task — audit my AI tool subscriptions and report what I am paying for — ran end to end and returned a real list.", "glance": "Hosted agents that connect to your own email and calendar are now simple enough to use like a messaging app, no setup ritual required.", "vid": "FxcYK5WOk1c", "url": "https://www.youtube.com/watch?v=FxcYK5WOk1c", "src": "@mreflow", "published": "2026-09-15T12:37:49Z", "short": true}, {"t": "What chess Elo suggests about AI's economic impact", "s": "Chess engine Elo rose almost perfectly linearly for decades, but the economic consequence was a step change: experts always won, then never won. The argument is that AI's economic impact has been small so far only because capability is still below the human band, and the crossing will look sudden rather than gradual.", "glance": "Steady capability gains produce sudden economic effects — the chess Elo curve was linear but the human-versus-machine outcome flipped all at once.", "vid": "Fp4a4CaI-74", "url": "https://www.youtube.com/watch?v=Fp4a4CaI-74", "src": "@DwarkeshPatel", "published": "2026-09-15T21:27:37Z", "short": true}, {"t": "The Touch Bar is back.", "s": "A third-party magnetic Touch Bar strip that clips onto a MacBook below the display instead of replacing function keys, with haptic feedback, a plugin ecosystem, and detachable use as a ruler. It becomes a media controller or an editing shortcut bar depending on the app.", "glance": "The Touch Bar idea works better as a detachable accessory than as a replacement for keys you actually need.", "vid": "XfFuUhryF5c", "url": "https://www.youtube.com/watch?v=XfFuUhryF5c", "src": "@RetroTechLab", "published": "2026-09-16T01:07:13Z", "short": true}]}, {"h": "🧬 Science, Mind & Health", "items": [{"t": "This Woman Cured Her Cancer with an Insane Method", "s": "Croatian virologist Beata Halassy treated her own stage 3B recurrent breast cancer by injecting lab-grown measles and vesicular stomatitis viruses directly into the tumour — oncolytic virotherapy, self-administered. The tumour swelled after the second dose, then shrank and softened enough for surgery. The science is real and the self-experiment is the part medicine cannot endorse.", "glance": "Oncolytic viruses work because cancer cells switch off the antiviral defences healthy cells keep — the tumour becomes the easiest target in the body.", "vid": "0NY2gAftzJE", "url": "https://www.youtube.com/watch?v=0NY2gAftzJE", "src": "@kurzgesagt", "published": "2026-09-15T14:11:25Z"}, {"t": "Einstein’s Biggest Blunder Might Have Been Even Bigger!", "s": "DESI and the Dark Energy Survey now independently show dark energy is weakening, so the universe's acceleration is slowing and it may eventually contract. A new paper in a top journal argues this follows from applying the quantum uncertainty principle to the universe as a whole — you cannot simultaneously know its size and its rate of change — which would make the observations the first evidence that gravity is quantum.", "glance": "If the universe obeys an uncertainty principle, dark energy has to decay over time — which is exactly what DESI now sees.", "vid": "Kln2KRqrZOk", "url": "https://www.youtube.com/watch?v=Kln2KRqrZOk", "src": "@SabineHossenfelder", "published": "2026-09-15T13:12:01Z"}, {"t": "Cells have more autonomy than we thought | Michael Levin", "s": "Michael Levin's frog experiments show cells carry out high-level instructions without being told how. A bioelectric signal saying \"build an eye\" produces a working eye anywhere on the body, and embryos with organs deliberately misplaced still develop into normal frogs because each organ finds its own way.", "glance": "Biology programs by high-level goal, not by instruction — tell cells to build an eye and they work out the how themselves.", "vid": "8ah8y2HLc_M", "url": "https://www.youtube.com/watch?v=8ah8y2HLc_M", "src": "@The-Well", "published": "2026-09-15T16:11:25Z", "short": true}, {"t": "Scientists Create Perfect Urinal, Win Ig Nobel Prize", "s": "Splashback happens because a droplet hitting a surface at more than about 30 degrees flattens into a sheet that peels off and shatters. A Waterloo-Caltech team solved the isogonal-curve problem to design surfaces that always meet the stream below 30 degrees; the nautilus-spiral design cut splash by 99% and is being considered for aircraft and trains.", "glance": "Keeping any impact angle under 30 degrees eliminates splash almost entirely — a geometry constraint, not a materials problem.", "vid": "Elf4cUjwKF0", "url": "https://www.youtube.com/watch?v=Elf4cUjwKF0", "src": "@DrBenMiles", "published": "2026-09-15T16:11:25Z"}, {"t": "Doctor Explains Why Kids Can Regrow Their Fingertips 🤔", "s": "In 1974 a Sheffield doctor discovered by accident that a child's fingertip regrows — nail bed, tissue, skin and nerves — if the wound is only cleaned and dressed rather than stitched closed. Suturing the wound is what prevents regeneration.", "glance": "Children regrow fingertips if the wound is left open; stitching it closed is what blocks the regeneration.", "vid": "V51bCKlt_oI", "url": "https://www.youtube.com/watch?v=V51bCKlt_oI", "src": "@ABCScience", "published": "2026-09-16T00:38:25Z", "short": true}, {"t": "I Ranked 10 Foods: Highest To Lowest Calories", "s": "One cup of each of ten foods, measured: chocolate-covered almonds 1,179 calories, granola 438, chicken breast 249 (almost all protein), potato chips 129, beer 100, strawberries 48, cauliflower rice 25, sugar-free jelly 10, spinach 7, konjac noodles 5.", "glance": "Volume tells you nothing about calories — a cup of chocolate almonds equals eighteen cups of strawberries.", "vid": "odXsFBG0MGI", "url": "https://www.youtube.com/watch?v=odXsFBG0MGI", "src": "@JeffNippard", "published": "2026-09-15T14:15:01Z", "short": true}]}, {"h": "💼 Business, Policy & Building", "items": [{"t": "JD Vance on AI, Entitlement Fraud, Iran War, Israel, H-1B Abuse & the Midterms", "s": "A wide-ranging interview covering the Iran war and energy markets, the deficit, the data-centre backlash, H-1B reform, federal fraud, and the administration's relationships with Israel and NATO. Positions are the Vice President's own and are contested; the segments below summarise what was claimed rather than endorsing it.", "glance": "The clearest thread is energy: the case made is that the US under-built generation for a generation, and the data-centre backlash is the bill arriving on household power bills.", "vid": "PUcooQRy0PU", "url": "https://www.youtube.com/watch?v=PUcooQRy0PU", "src": "@allin", "published": "2026-09-15T21:24:37Z", "points": [{"t": "Iran and energy markets", "s": "Claims substantial destruction of Iran's nuclear and conventional capability, but concedes Iran is still firing on commercial shipping during negotiations. Argues US withdrawal from the region would mean a worldwide energy crisis."}, {"t": "Deficit and interest rates", "s": "Asked about the 30-year yield near 5.2% and the risk to the dollar, he says Congress — both parties — has not shown willingness to be serious on spending."}, {"t": "Why data centres draw backlash", "s": "His diagnosis: a generation of not building power. Cites households whose bills went from $290 to $580 a month, and argues the answer is building generation rather than stopping data centres."}, {"t": "H-1B reform", "s": "States the goal is that H-1B should not replace American workers with lower-wage foreign hires; acknowledges the administration has been sued over parts of the approach."}, {"t": "Federal fraud", "s": "Cites the DOGE-era estimate of 20% of federal spending, or roughly $1.4 trillion, and says the largest obstacle is that the states with the worst fraud cooperate least."}, {"t": "Israel and NATO", "s": "Argues for rooting both relationships in US interest specifically, and claims the President has been more willing than predecessors to differ publicly with the Israeli government."}], "pointsLabel": "Six segments from the interview"}, {"t": "The World’s Largest Air Battery Just Switched On", "s": "China switched on the world's largest compressed-air storage plant in a salt cavern under Huai'an in March 2026: 2.4 GWh at 600 MW, 71% round-trip efficiency, no lithium and no fuel burned on discharge. But dividing capacity by power gives four hours of runtime — exactly the window where lithium already wins, which undercuts the whole case for compressed air as long-duration storage.", "glance": "The largest compressed-air battery ever built runs for four hours — the same duration lithium already does cheaply, so it does not solve the problem it was built for.", "vid": "N3EqEocLPJk", "url": "https://www.youtube.com/watch?v=N3EqEocLPJk", "src": "@UndecidedTechnology", "published": "2026-09-15T12:28:13Z"}, {"t": "Why Some People Never Grow Up - Mark Manson", "s": "Mark Manson compresses developmental psychology into three stages. A child asks only whether it gets the thing it wants. An adolescent learns to trade — rules, bargains, getting approval. An adult finds something worth being disliked for and stops negotiating it. Most people, he argues, stall in the transactional adolescent stage for life.", "glance": "Adulthood is having something you will accept disapproval for — most people stay stuck bargaining for approval instead.", "vid": "mSoRXk3S4d0", "url": "https://www.youtube.com/watch?v=mSoRXk3S4d0", "src": "@AfterSkool", "published": "2026-09-15T16:12:37Z"}, {"t": "The Most Controversial Math Problem Today", "s": "The Navier-Stokes existence and smoothness problem carries a million-dollar Millennium Prize. Two researchers using AI tools were closing in on a blow-up proof when OpenAI turned its own resources on it and produced a result in about 88 hours — raising an unresolved question about whether their queries taught the system how.", "glance": "A century-old Millennium Prize problem fell in 88 hours, and nobody can cleanly say whose work it was.", "vid": "QmRchnYSqBQ", "url": "https://www.youtube.com/watch?v=QmRchnYSqBQ", "src": "@CleoAbram", "published": "2026-09-15T14:22:49Z", "short": true}, {"t": "Would you take a 150-month car loan?", "s": "A dealer in collectible cars describes financing now stretching to 150- and 160-month terms — twelve and a half years — on select collector vehicles, alongside conventional 60-month loans.", "glance": "Collector-car lenders now write 150-month terms; a loan longer than most people keep a house is being normalised for a depreciating asset.", "vid": "8GIjIPSLJUs", "url": "https://www.youtube.com/watch?v=8GIjIPSLJUs", "src": "@SpeedLabsMotorEnvy", "published": "2026-09-15T20:53:25Z", "short": true}]}, {"h": "🔬 Deep tech explainers", "items": [{"t": "Quantum Computing's Silicon Future Explained #shorts", "s": "A quantum-computing researcher argues silicon spin qubits will win over superconducting circuits, trapped ions and neutral atoms for one reason: they can be made in the same fabs that already make every transistor. The first fault-tolerant wafer will be enormously expensive; the second will be cheap.", "glance": "Whichever qubit can be built in an existing semiconductor fab wins, because the second wafer costs almost nothing.", "vid": "vTdYHnLEvT0", "url": "https://www.youtube.com/watch?v=vTdYHnLEvT0", "src": "@FromFirstPrinciplesPod", "published": "2026-09-15T19:30:37Z"}, {"t": "Every US Electrical Outlet Explained", "s": "A tour of the NEMA connector system — why North America has so many plug and receptacle shapes, and what each is actually for. Two engineering reasons drive the split: oversizing contacts makes manufacturing harder and invites loose connections over time, and breakers are sized to protect the whole downstream chain including thin appliance cords, which can otherwise cap fault current below the trip threshold and start a fire.", "glance": "Plug shapes are a safety system, not an inconvenience: the breaker has to protect the thinnest cord downstream, so the connector has to declare what is plugged in.", "vid": "n_1wzYQwnts", "url": "https://www.youtube.com/watch?v=n_1wzYQwnts", "src": "@PracticalEngineeringChannel", "published": "2026-09-15T13:12:01Z"}]}]}, "elon": {"day": "2026-09-15", "source": "@jcub2x daily recap", "note": "Built from the @jcub2x recap for 15 Sep 2026 (\"Elon Musk posted 40 times on X today\"), posted about three hours before this run. Engagement counts are not in the recap, so likes and views are not shown; items are ordered most notable first.", "items": [{"kind": "post", "t": "On AI safety: Musk proposed that every frontier lab run every other lab's safety tests before release", "s": "He argued each lab already has a test harness for bioweapons, nuclear and deliberate deception, and that mutual pre-release API access would let competitors go public if a model failed — with the legal liability doing the enforcing. He called it the one thing all parties, including China, might agree to.", "imp": "critical", "iso": "2026-09-15T18:00:00"}, {"kind": "post", "t": "On slowing down: Musk clarified what he meant by \"Dario is right\"", "s": "Asked at the All-In Summit, he said he was endorsing Amodei's description of the danger rather than his regulatory proposal — that risk from frontier models is now rising exponentially and that when many people inside Anthropic and OpenAI say their own models are dangerous, they should be believed. He also said regulation is a one-way ratchet and compared self-policing to the film industry inventing its own ratings.", "imp": "critical", "iso": "2026-09-15T18:20:00"}, {"kind": "post", "t": "On xAI models: Grok 4.7 is \"roughly on par with Opus 5\", and Grok 5 \"may be better than anything\"", "s": "He laid out a ladder — 4.7 at parity with Opus 5, 4.8 a noticeable improvement, 4.9 around Astra and Fable class, and Grok 5 possibly ahead of everything. He added that Grok 4.8 is a 2.5-trillion-parameter model finishing training this week on the new stack.", "imp": "important", "iso": "2026-09-15T10:00:00"}, {"kind": "reply", "t": "On the training stack: \"our C and C++ training stack was written by humans\"", "s": "Replying to a claim that xAI's speed comes from AI-generated parallel code, he said the pre-training stack was written primarily by the Starlink software team and is probably best in industry, while the reinforcement-learning stack is still a legacy mix of third-party systems that has yet to be fixed. He added that AI is not yet good enough for extremely high-performance software, \"but it will be\".", "imp": "important", "iso": "2026-09-15T10:30:00"}, {"kind": "post", "t": "On Terafab: chip supply is either built in-house or the scaling stops", "s": "He gave two reasons for building the fab — the possibility that Taiwanese chips stop arriving for some reason, and the plain fact that existing fabs run at maximum capacity. Scaling AI in data centres plus edge compute for cars and humanoid robots needs logic, memory and packaging together. \"It's either build Terafab or fail to scale.\"", "imp": "important", "iso": "2026-09-15T17:00:00"}, {"kind": "post", "t": "On Starship: Flight 14 is the last before SpaceX tries to catch the ship itself", "s": "If Flight 14 goes well, Flight 15 attempts the catch, with a re-flight of both ship and booster late this year or early next. The design goal he restated is full and rapid reusability, aircraft-style. SpaceX has since set 22 September for the flight.", "imp": "important", "iso": "2026-09-15T17:30:00"}, {"kind": "repost", "t": "Reposted Jensen Huang's All-In appearance, in which Trump phoned in live to call AI-risk warnings \"a hoax\"", "s": "The President, put on speakerphone on stage, said the data centres are \"the oil of the next 20-25 years\", that robots taking over is a hoax, and that opposition serves China's interests — while adding that the build-out should be done prudently. Musk reposted the clip without additional comment. The claims are contested and the framing is the speaker's own.", "imp": "important", "iso": "2026-09-15T16:00:00"}, {"kind": "post", "t": "On engineering: \"Physics is the law, and everything else is a recommendation\"", "s": "Expanding on it, he said physics is a harsh judge with no fooling it — if something is wrong the rocket explodes, and no amount of praise changes that. He said he has seen people break laws made by humans but never laws made by physics.", "imp": "important", "iso": "2026-09-15T12:00:00"}, {"kind": "repost", "t": "Reposted Gwynne Shotwell saying he is living in an Airstream trailer in Memphis to bring up Colossus 2", "s": "Shotwell said he is in Memphis helping build out the site rather than doing so remotely. It was picked up widely as a story in its own right; Musk reposted it without comment.", "imp": "interesting", "iso": "2026-09-15T14:00:00"}, {"kind": "post", "t": "On the Roadster: a reveal is coming and he will not spoil it", "s": "He promised the reveal will \"blow people's minds\", said excitement is guaranteed, and that there will be a live audience present to demonstrate it is not AI-generated. Asked why Tesla and SpaceX remain separate companies, he called it a \"great question\" and did not answer.", "imp": "important", "iso": "2026-09-15T18:40:00"}, {"kind": "post", "t": "On Tesla FSD: insurance quotes now show the FSD discount at the point of order", "s": "Tesla began showing estimated insurance premiums with and without Full Self-Driving on the US ordering page — up to $60 a month lower with FSD. He amplified a complaint that California bars insurers from pricing on how people actually drive, so heavy FSD users in Tesla's largest US market cannot get the discount.", "imp": "important", "iso": "2026-09-15T08:00:00"}, {"kind": "repost", "t": "Reposted Slovenia's deputy prime minister endorsing FSD, replying \"Slovenia, hallelujah\"", "s": "The infrastructure and energy minister called supervised FSD safe and efficient, noting it does not get tired or fall asleep. Musk also amplified a user reporting 85% FSD use across a 35-day streak, commenting \"Tesla self-driving is amazing\".", "imp": "interesting", "iso": "2026-09-15T09:00:00"}, {"kind": "repost", "t": "Reposted SpaceX community work in Memphis and Starlink connectivity in Argentina", "s": "The Memphis site published renovated gym and classroom work at Fairley High School; separately, a post reported roughly 300 Starlink antennas installed across an Argentine province since 2024, bringing internet to 100% of its schools.", "imp": "interesting", "iso": "2026-09-15T11:00:00"}, {"kind": "repost", "t": "Reposted a claim that Georgia data-centre contracts will cut about $180 a year from power bills", "s": "Georgia Power said new large-load contracts, overwhelmingly data centres, would save customers close to a billion dollars. Musk's comment: \"AI data centers resulting in lower electricity prices for consumers.\" The claim is the utility's and has not been independently verified here.", "imp": "interesting", "iso": "2026-09-15T15:00:00"}, {"kind": "repost", "t": "Amplified several contested political and cultural posts", "s": "These included a clip of a Texas Senate candidate on gender-identity and child welfare (\"Wow\"), a post disputing a 60 Minutes segment on pardon lobbying (\"Hmm\"), and items on crime statistics and historical political attitudes. The claims in them are contested and are reproduced here only as a note that he amplified them, without the raw text.", "imp": "interesting", "iso": "2026-09-15T19:00:00"}], "highlight": {"t": "Musk proposed that rival AI labs run each other's safety tests before any model ships", "s": "At the All-In Summit and then on X, Musk argued every frontier lab already has a harness that tests for bioweapon, nuclear and deception capability, and that the practical safety step is for each lab to run everyone else's tests via pre-release API access. If a model fails and the developer ships anyway, competitors can say so publicly and the legal liability becomes enormous. He named Anthropic and OpenAI as the two leaders, said on balance Anthropic puts more care into safety, and suggested Chinese labs could be brought into the same scheme — the rare AI-governance idea that needs no new regulator.", "href": "https://www.youtube.com/watch?v=nOaaqYhBwcA"}}, "elonNews": [{"t": "SpaceX sets 22 September for Starship's first orbital flight attempt", "s": "SpaceX declared Starship ready for orbit and scheduled Flight 14 for 22 September, the first try at orbital velocity.", "url": "https://arstechnica.com/space/2026/09/spacex-sets-launch-date-for-first-starship-orbital-flight/", "published": "2026-09-15T18:48:00Z", "src": "Ars Technica"}, {"t": "Regulators press Tesla on whether the Cybercab can be driven by a human", "s": "A US safety agency ordered Tesla to answer questions about Cybercab certification, including whether the vehicle offers any option for human control.", "url": "https://news.google.com/rss/articles/CBMixwFBVV95cUxPUDl2VHNCWFlwUjVSZFRZZUVsZ1JLejFVVnlXdldIbkFFMDNmVDB3cFdCZ090SW5jU2cxcGJuQy05a0R6V2tqSENRMThjOEJERUduM0Q1ODNLNDhGTHFRQ2NfUkdicFZob1cwdm5senhqOElMUlR1N2h1MjdrakdTemhybUZWSGxBdmYwcHNyOFdvOTFGdlBYbnZGOUQzUk9WX1E1a1dfOFJYaEh5YmJOVlJLQmRBVFppZUJWYlpBMU1jLUhlQndB?oc=5", "published": "2026-09-15T20:10:00Z", "src"   let s=Math.floor((Date.now()-d.getTime())/1000); if(s<0)s=0;
  if(s<60) return "just now";
  if(s<3600){const n=Math.floor(s/60);return n+" min"+(n>1?"s":"")+" ago";}
  if(s<86400){const n=Math.floor(s/3600);return n+" hour"+(n>1?"s":"")+" ago";}
  const days=Math.floor(s/86400);
  if(days===1) return "yesterday";
  if(days<7) return days+" days ago";

/* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

    if(it.assess){const a=it.assess;parts.push("RATING: magnitude "+a.mag+"/5, timeline "+a.timeline+", evidence "+a.evidence+(a.verdict?"; verdict “"+a.verdict+"”":"")+(a.basis?" (basis: "+a.basis+")":""));}
    if(Array.isArray(it.facts)&&it.facts.length) parts.push("KEY FACTS: "+it.facts.map(f=>f.l+": "+f.v).join("; "));

${parts.join("\n")}${priorTxt}

  try{ let text;
    if(window.cowork&&window.cowork.askClaude){ const res=await window.cowork.askClaude(prompt,it?[it]:[]);
      text=typeof res==="string"?res:(res&&(res.text||res.content||res.output))||JSON.stringify(res);
    } else { const rr=await fetch(__ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, url:(it&&it.url)||"", title:(c.dataset.title||(it&&it.t)||"")})});

      text=jj.text||jj.answer||(jj.content&&jj.content[0]&&jj.content[0].text)||JSON.stringify(jj); }
    p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>${fmt(String(text).trim())}`;
  }catch(e){ p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>Couldn't answer right now — ${esc(String((e&&e.message)||e))}. Try the source link.`; }
}
