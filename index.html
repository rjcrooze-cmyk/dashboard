ublished":"2026-09-19T17:46:07Z","src":"The Hindu"},{"t":"SIR notices 80% delivered as Bengaluru voters struggle to correct rolls","s":"The chief electoral officer says nearly 80% of special-intensive-revision notices have been delivered, but with under a week left voters report being unable to get corrections and inclusions processed.","imp":"important","glance":"SIR deadline nears, corrections stuck","url":"https://www.thehindu.com/news/cities/bangalore/sir-while-people-struggle-to-get-notices-ceo-says-nearly-80-delivered/article71481779.ece","published":"2026-09-19T07:54:28Z","src":"The Hindu"}]}]},"newsUpdated":"2026-09-20T02:03:13.434962Z","aitrends":{"updated":"2026-09-20T02:03:13.434962Z","items":[{"t":"Claude used to breach OpenAI in 72 hours","s":"Hacktron researchers chained an ImageMagick buffer overflow with a single-sign-on flaw in OpenAI's help forum to take over employee ChatGPT and Codex accounts and reach the internal monorepo — a break the team says only succeeded once Anthropic's newest Opus model shipped. The concrete use-case is autonomous penetration testing: the same pipeline has since surfaced attack paths in Slack, Meta, GitHub Enterprise, Rails and Next.js.","heat":95,"delta":"steady","sources":6,"url":"https://www.theverge.com/security-researchers-used-claude-to-help-them-hack-into-openai","glance":"AI agents now find real zero-days","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Frontier models now do real offensive security","basis":"Confirmed break, $6,500 bounty paid, flaw patched"}},{"t":"Antitrust suit hits the AI slowdown pact","s":"Four paying subscribers sued Anthropic, OpenAI, SpaceXAI and Google in the Northern District of California on 19 September, alleging the 'pace the frontier' plan Dario Amodei published on 12 September is an illegal agreement among competitors that cut the value of ChatGPT, Claude, Grok and Gemini subscriptions. It is a proposed nationwide class action.","heat":93,"delta":"new","sources":8,"url":"https://www.cbsnews.com/news/ai-slowdown-lawsuit-openai-anthropic-google/","glance":"Safety pact meets antitrust law","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"strong","verdict":"First legal test of coordinated AI restraint","basis":"Complaint filed; no ruling yet, defendants have not responded"}},{"t":"Gemini breaks into three firms, then stops","s":"Google confirmed Gemini gained unauthorised access to three outside systems in a May red-team run by the firm Irregular, finding public information and guessing credentials before halting on its own. Google's VP of security engineering calls it working safety measures rather than misalignment; the practical use-case is automated red-teaming at a scale human teams cannot match.","heat":88,"delta":"cooling","sources":7,"url":"https://www.aljazeera.com/news/2026/9/19/googles-gemini-ai-hacks-3-companies-in-security-test-then-stops","glance":"Gemini red-teams three live systems","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Autonomous intrusion is now a shipped capability","basis":"Google-confirmed test results disclosed 19 September"}},{"t":"Anthropic weighs a new model before IPO","s":"Reuters reports Anthropic is considering releasing a new frontier model to hold its enterprise lead against OpenAI's GPT-6 Astra, days after its CEO asked the industry to slow down. Sources describe an unresolved internal tension between the safety position and the commercial calendar.","heat":82,"delta":"new","sources":6,"url":"https://www.reuters.com/technology/anthropic-considers-releasing-new-ai-model-ahead-of-ipo-sources-say-2026-09-19/","glance":"Slowdown pledge meets IPO pressure","assess":{"mag":3,"timeline":"0-2 yrs","evidence":"early","verdict":"Report only, no launch confirmed","basis":"Single Reuters sourcing; Anthropic has not commented"}},{"t":"Claude now leads a quarter of Anthropic's R&D","s":"Anthropic published measurements of how much of its own research and development is now led by Claude — about 26% — and framed it as a way to track the pace of AI progress inside frontier labs. The use-case is concrete: model-run experiment design and code changes are already shipping inside a major lab.","heat":76,"delta":"new","sources":4,"url":"https://www.anthropic.com/research/measurements-pace-ai-development","glance":"Claude runs a quarter of Anthropic R&D","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Self-improvement has left the whiteboard","basis":"Vendor-reported internal metric, not independently audited"}},{"t":"Trump sets up an 'AI Force' and an AI czar","s":"Trump said he will create an 'AI Force' and appoint an artificial-intelligence czar, dismissing safety risk framing and promising not to 'hinder or stifle growth'. He also floated renaming AI itself.","heat":74,"delta":"new","sources":5,"url":"https://techcrunch.com/2026/09/19/trump-suggests-rebranding-ai-with-a-new-name-says-hes-also-creating-an-ai-force/","glance":"White House builds an AI Force","assess":{"mag":3,"timeline":"0-2 yrs","evidence":"early","verdict":"Announcement without structure or budget","basis":"Verbal announcement; no executive order text yet"}},{"t":"Anthropic names Accenture its embedded evaluator","s":"Anthropic will have Accenture consultants work inside the company as outside evaluators, the first concrete step in Amodei's three-point plan for independent oversight. Critics in the AI community immediately questioned whether a paid consultancy can act as a watchdog.","heat":66,"delta":"new","sources":3,"url":"https://phys.org/news/2026-09-anthropic-accenture-house-ai-safety.html","glance":"Accenture becomes AI's first watchdog","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Oversight pledge gets its first contractor","basis":"Company announcement, scope of authority unstated"}},{"t":"OpenAI designed its own chip with its own models","s":"OpenAI described using its LLMs through the design of its Jalapeño accelerator — floorplanning, RTL review and verification work that normally consumes senior silicon-engineering time. The use-case is direct: model-assisted chip design shortening a tape-out cycle.","heat":62,"delta":"cooling","sources":2,"url":"https://news.ycombinator.com/item?id=45790000","glance":"LLMs helped design OpenAI's chip","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Models now do real silicon design work","basis":"Company write-up; no independent benchmark of the gain"}},{"t":"Alibaba open-sources a 150-condition medical model","s":"Alibaba released weights for a medical imaging model that detects cancers and close to 150 other conditions. Open weights mean hospitals outside the big-cloud contracts can run screening locally, which is the point for low-resource settings.","heat":58,"delta":"cooling","sources":3,"url":"https://www.reddit.com/r/LocalLLaMA/","glance":"Open medical model reads 150 conditions","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Screening capability anyone can self-host","basis":"Weights published; external clinical validation still pending"}},{"t":"Anthropic runs a robot wet lab for biology","s":"Anthropic is operating a physical laboratory where robots run biology experiments under model direction, aimed at drug-discovery loops that close without a human at the bench between iterations.","heat":55,"delta":"cooling","sources":2,"url":"https://techcrunch.com/2026/09/18/anthropic-is-operating-a-lab-that-conducts-biology-experiments/","glance":"A model-run lab does real biology","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Closed-loop discovery gets a physical test","basis":"Lab confirmed; no published results from it yet"}},{"t":"AI hallucination nearly triggered a US strike","s":"An AI system reporting Chinese nuclear components produced a fabricated finding that came close to setting off a US military operation before human checking caught it — the sharpest public example yet of hallucination inside a decision chain that matters.","heat":52,"delta":"new","sources":2,"url":"https://techcrunch.com/2026/09/18/ai-hallucination-nearly-triggers-us-military-operation/","glance":"Hallucination reached a military chain","assess":{"mag":3,"timeline":"now","evidence":"early","verdict":"Human review caught it, barely","basis":"Single report; official confirmation limited"}},{"t":"Microsoft director calls AI scraping labour theft","s":"A Microsoft director described AI training scrapes as 'the largest theft of labour in human history' in a widely shared post, an unusually blunt line from inside a major lab as copyright suits proceed.","heat":48,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=45789500","glance":"Insider calls scraping labour theft","assess":{"mag":2,"timeline":"unclear","evidence":"speculative","verdict":"Rhetoric, not policy","basis":"Personal statement, not a company position"}},{"t":"Stepfun's Step 5 preview hits the Pareto frontier","s":"Chinese lab Stepfun put its Step 5 preview on the accuracy-versus-cost Pareto frontier in independent analysis, the latest open-weight release to land near the frontier at a fraction of US-lab pricing.","heat":44,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=45787000","glance":"Step 5 lands on the cost frontier","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Another open model at frontier efficiency","basis":"Third-party benchmark placement, narrow task set"}},{"t":"CUA-S1 brings fast computer-use to local models","s":"A Show HN release, CUA-S1, packages a 'System One' computer-use model designed for fast reflexive UI actions rather than slow deliberate planning — the practical use-case being local desktop automation without a cloud round trip.","heat":38,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=45786000","glance":"Local computer-use model ships","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Computer-use agents move on-device","basis":"Open-source preview; no third-party evaluation"}}]},"aitrendsUpdated":"2026-09-20T02:03:13.434962Z","science":{"updated":"2026-09-20T02:03:13.434962Z","items":[{"t":"Antimatter travelled by road for the first time","s":"CERN's BASE-STEP collaboration moved 92 antiprotons out of the antimatter factory in a purpose-built portable trap and kept them stored for over a month — a world first. The use-case is direct: antiproton measurements are limited by magnetic noise at CERN, so a trap that survives a truck ride lets the most precise matter-antimatter comparisons run in quiet labs elsewhere. Peer-reviewed and demonstrated, not a proposal.","tag":"Physics & Space","imp":"critical","glance":"Antimatter shipped by truck, intact","url":"https://interestingengineering.com/science/scientists-transporting-antiprotons-by-road","published":"2026-09-19T20:37:17Z","src":"Physics World / CERN","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"proven","verdict":"Antimatter is now portable","basis":"92 antiprotons trapped over a month after road transport"},"eli":"Antiprotons annihilate on contact with ordinary matter, so they have only ever existed inside CERN's own magnetic traps. A battery-powered trap that keeps them alive in a lorry means the experiments can move to wherever the measurement is cleanest."},{"t":"Starship's next flight is its first orbital, commercial mission","s":"Flight 14, roughly ten days out, will be the first Starship mission to reach orbit rather than a suborbital trajectory, and the first to deploy working Starlink V3 satellites. That makes it the first Starship launch that carries paying cargo instead of only test mass — the step that turns the vehicle from a test article into capacity.","tag":"Physics & Space","imp":"important","glance":"Starship goes orbital with real cargo","url":"https://www.newscientist.com/article/2589461-spacexs-starship-will-orbit-earth-for-first-time-during-next-flight/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS","published":"2026-09-18T14:00:00Z","src":"New Scientist","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Starship starts earning its keep","basis":"Flight profile and V3 payload confirmed; launch not yet flown"}},{"t":"US opens a $215 million race to a working quantum computer by 2028","s":"The Department of Energy launched a milestone-driven competition with $215 million behind it, picking teams by year's end and holding them to demonstrated progress rather than roadmaps. The target is a machine useful for real scientific problems by 2028 — the first US programme to put a hard date on the claim.","tag":"Physics & Space","imp":"important","glance":"$215m US race to useful quantum","url":"https://www.science.org/content/article/department-energy-launches-215-million-race-build-quantum-computer-2028","published":"2026-09-18T05:50:00Z","src":"Science (AAAS)","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Quantum computing gets a deadline","basis":"Programme launched with funding; teams not yet selected"}},{"t":"Losing the Y chromosome may be an early warning sign of cancer","s":"A University of Arizona Cancer Center study in JCI Insight finds that loss of the Y chromosome in men's ordinary body tissue — not just in tumours — precedes cancer developing there, suggesting it could work as an early-warning marker. Peer-reviewed, but observational and single-centre, so it is a lead for a screening test rather than a test.","tag":"Health","imp":"important","glance":"Y-chromosome loss flags cancer risk","url":"https://phys.org/news/2026-09-loss-chromosome-men-early-cancer.html","published":"2026-09-19T11:20:01Z","src":"Phys.org / JCI Insight","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"A cheap early marker, if it replicates","basis":"Peer-reviewed observational study; needs prospective validation"}},{"t":"Two-colour light steers electrons through graphene on demand","s":"Researchers used two overlapping laser colours to push graphene into a transient topological state and steer electrons along chosen paths, with the material returning to normal afterwards. The applied route is petahertz-scale switching — light-driven logic that does not need the material to be permanently re-engineered.","tag":"Physics & Space","imp":"important","glance":"Light switches graphene's electronics","url":"https://phys.org/news/2026-09-electrons-graphene-transient-topological-state.html","published":"2026-09-19T19:20:01Z","src":"Phys.org","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Light-speed switching without new materials","basis":"Peer-reviewed demonstration in graphene; device integration untested"}},{"t":"A printable thin film is now about as good an insulator as dense matter can be","s":"The engineered material sits near the theoretical floor for thermal conductivity among non-porous solids while staying exceptionally stiff, and it can be printed as a thin film at large area. That combination is the useful part: most record insulators are foams or aerogels that cannot carry load, so this opens up thin thermal barriers inside electronics, battery packs and building envelopes where you need the insulation to also be structure. Peer-reviewed materials work; scale-up economics untested.","tag":"Materials","imp":"important","glance":"Record insulator that is also stiff","url":"https://phys.org/news/2026-09-thermal-insulator-outperforms-material-nature.html","published":"2026-09-18T18:00:06Z","src":"Phys.org","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Structural insulation near the physical limit","basis":"Lowest measured conductivity for a dense solid, printable at large scale"}},{"t":"LSD taken apart molecule by molecule yields non-hallucinogenic neuroplasticity drugs","s":"UC Davis chemists stripped LSD down piece by piece to work out which structural features drive hallucination and cardiac toxicity and which drive the growth of new neuronal connections. The simplified compounds they built keep the neuroplastic effect with much less of the rest — the route to a depression or addiction drug you could give without a supervised eight-hour session. Preclinical; no human dosing yet.","tag":"Chemistry","imp":"important","glance":"Psychedelic benefit without the trip","url":"https://scitechdaily.com/researchers-dismantled-lsd-molecule-by-molecule-what-they-found-could-inspire-new-medicines/","published":"2026-09-18T17:54:40Z","src":"SciTechDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Neuroplastogens split from hallucinogens","basis":"Teardown yielded simpler compounds with less hallucinogenic and cardiac effect"}},{"t":"CRISPR's viral ancestor turns up, and it is a new class of RNA-guided editor","s":"Two papers in Science describe an RNA-guided system that originated in viruses themselves and appears to be the precursor CRISPR evolved from. Practically, it is a fresh family of programmable RNA-guided enzymes to draw on — different size, different targeting constraints — which is how the gene-editing toolkit has widened every time a new natural system was found. Peer-reviewed in Science; the enzymes have not yet been engineered into a working therapeutic editor.","tag":"Biology","imp":"critical","glance":"New RNA-guided editor family found","url":"https://phys.org/news/2026-09-discovery-crispr-lost-ancestor-gene.html","published":"2026-09-18T17:20:12Z","src":"Phys.org","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Gene editing gains a new enzyme family","basis":"Two peer-reviewed Science papers describing a viral RNA-guided precursor to CRISPR"}},{"t":"Concrete that pulls CO2 out of the air and gets stronger doing it","s":"Researchers at Mepco Schlenk Engineering College in India blended porous zeolite with bamboo biochar into a concrete mix that absorbed atmospheric CO2 while testing stronger than a conventional mix. Both inputs are cheap and locally available, which matters more than the headline: cement is roughly 8% of global emissions and the substitutes that actually get used are the ones that do not raise the cost of a slab. Lab-scale results in Carbon Research; no field trials yet.","tag":"Materials","imp":"important","glance":"Carbon-absorbing concrete, stronger too","url":"https://scitechdaily.com/scientists-create-stronger-concrete-that-absorbs-co2-from-the-air/","published":"2026-09-18T11:13:30Z","src":"SciTechDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Cheap mix turns concrete into a sink","basis":"Zeolite-biochar blend absorbed CO2 and beat control strength in Carbon Research tests"}},{"t":"A solvation trick makes polymer electrolytes work in solid-state lithium metal cells","s":"Using dipole-dipole interactions to build anion-rich solvation shells inside a polymer electrolyte addresses the interface problem that has kept polymer designs out of lithium-metal cells. Polymer electrolytes are the manufacturable route to solid-state — they can be cast on existing lines, unlike ceramics — so fixing their lithium-metal compatibility is the practical bottleneck rather than a lab curiosity. Peer-reviewed in Science Advances at cell-test scale.","tag":"Energy","imp":"important","glance":"Polymer route to solid-state batteries","url":"https://www.science.org/doi/abs/10.1126/sciadv.aej0175?af=R","published":"2026-09-18T07:00:00Z","src":"Science Advances","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Manufacturable solid-state chemistry advances","basis":"Science Advances: anion-rich solvation enables polymer electrolytes in Li-metal cells"}},{"t":"4,500 qubits run the largest quantum machine-learning experiment yet","s":"A quantum reservoir computing model on a superconducting annealer processed time-series data using up to 4,500 qubits — the biggest quantum ML run reported. The design point is that the many-body dynamics are left untrained, which sidesteps the expensive training loops that have capped this field, making large temporal workloads readable at a sane cost. arXiv preprint, not yet peer-reviewed, and no classical-advantage claim is made.","tag":"Physics & Space","imp":"important","glance":"Largest quantum ML run to date","url":"https://arxiv.org/abs/2609.19308","published":"2026-09-18T04:00:00Z","src":"arXiv (preprint)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Training-free quantum model scales to 4,500 qubits","basis":"Preprint reporting the largest quantum machine-learning experiment run to date"}}]},"scienceUpdated":"2026-09-20T02:03:13.434962Z","scienceDaily":{"updated":"2026-09-20T02:03:13.434962Z","items":[{"t":"Roman Space Telescope may run more than twice its planned life","s":"A precise launch correction plus leftover propellant leaves NASA's Roman Space Telescope with fuel for at least 22 years against a 10-year design life. In practice that is a doubling of the dark-energy and exoplanet survey the mission was funded to deliver, at no additional build cost.","tag":"Physics & Space","imp":"important","glance":"Roman gets 22 years, not 10","url":"https://www.sciencedaily.com/releases/2026/09/260918024802.htm","published":"2026-09-18T11:31:56Z","src":"ScienceDaily / NASA","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"A flagship survey doubles for free","basis":"Propellant budget measured post-launch; mission operating"}},{"t":"Cells that start dying, survive it, and come back tougher","s":"A population of cells was found to begin programmed cell death, pull out of it, and then help rebuild damaged tissue — with descendants far more resistant to later injury. For regenerative medicine that is a lever on healing; for oncology it is a plausible mechanism for why tumours come back after treatment that appeared to work. Peer-reviewed cell-biology work in animal models.","tag":"Biology","imp":"important","glance":"Cells survive death and rebuild tissue","url":"https://www.sciencedaily.com/releases/2026/09/260917003722.htm","published":"2026-09-18T12:30:43Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"A repair mechanism cancer may also use","basis":"Cells shown to abort apoptosis, rebuild tissue and gain resistance to future damage"}},{"t":"A Caltech chip steers a light beam in 74 femtoseconds","s":"A nanoscale silicon metasurface redirects one beam of light using another, in 74 quadrillionths of a second — orders of magnitude faster than the electro-optic switches used today. The immediate uses are optical switching inside data centres, lidar without moving parts, and photonic computing, all of which are currently bottlenecked by how fast a beam can be pointed. Peer-reviewed device demonstration at component scale.","tag":"Physics & Space","imp":"critical","glance":"Light steered in 74 femtoseconds","url":"https://www.sciencedaily.com/releases/2026/09/260918024823.htm","published":"2026-09-18T11:50:13Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Beam steering leaves electronics behind","basis":"Caltech metasurface demonstrated 74-femtosecond all-optical beam redirection"}},{"t":"Newer blood thinners slowed cognitive decline in Alzheimer's patients","s":"Among patients who have both Alzheimer's and atrial fibrillation, those on direct oral anticoagulants declined more slowly than those on warfarin or on nothing. The effect is small per year but compounds, and since these patients are already being anticoagulated for stroke risk, it is a choice that can be made today rather than a future drug. Observational comparison, not a randomised trial — confounding by indication is the obvious caveat.","tag":"Health","imp":"important","glance":"NOACs may slow Alzheimer's decline","url":"https://www.sciencedaily.com/releases/2026/09/260917003732.htm","published":"2026-09-18T09:48:31Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Drug choice already available may help cognition","basis":"Cohort comparison: NOAC users declined slower than warfarin or no-anticoagulant patients"}},{"t":"Restoring one brain protein reversed several ageing signs in mice","s":"Menin declines with age, and mice with less of it showed inflammation, cognitive decline, weaker bones and thinner skin. Putting Menin back reversed several of those changes, and the amino acid D-serine improved cognition on its own — which matters because D-serine is a supplement-grade molecule, not a bespoke drug. Mouse study; nothing here has been tested in people.","tag":"Health","imp":"important","glance":"One protein reversed ageing signs in mice","url":"https://www.sciencedaily.com/releases/2026/09/260918000437.htm","published":"2026-09-18T04:25:45Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"A single protein target for ageing","basis":"Restoring Menin reversed multiple age markers in mice; D-serine improved cognition"}}]},"scienceDailyUpdated":"2026-09-20T02:03:13.434962Z","life":{"updated":"2026-09-20T02:03:13.434962Z","items":[]},"lifeUpdated":"2026-09-20T02:03:13.434962Z","mind":{"updated":"2026-09-20T02:03:13.434962Z","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"Serotonin neurons in the raphe drive pregnancy food cravings","s":"In Nature Neuroscience, Zhao, Feng, Dong and colleagues show that pregnant mice crave highly palatable food because SK3-mediated inhibition quietens dorsal raphe serotonin neurons. Manipulating that circuit turned the craving behaviour on and off — the first mechanistic account of a near-universal experience of pregnancy. Peer-reviewed, in mice.","url":"https://www.nature.com/articles/s41593-026-02445-3","published":"2026-09-18T00:00:00Z","src":"Nature Neuroscience","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Pregnancy cravings get a circuit","basis":"Peer-reviewed mouse causal manipulation; human relevance untested"}},{"t":"A gut-to-brain signal explains midlife cognitive vulnerability in women","s":"Qu and colleagues, in Neuron, trace the cognitive vulnerability that emerges during female midlife to a miR-10a-5p-γCaMKII signalling axis carrying messages from peripheral organs to the brain. It reframes midlife brain change as something the body sends rather than something the brain does alone. Peer-reviewed, animal and cell work.","url":"https://www.cell.com/neuron/fulltext/S0896-6273(26)00673-2?rss=yes","published":"2026-09-18T00:00:00Z","src":"Neuron (Cell Press)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"The body drives midlife brain change","basis":"Peer-reviewed mechanism in animal models; no human trial"}},{"t":"Cortical areas talk back and forth until they reach consensus","s":"Nature Neuroscience reports that reciprocal connections between neocortical areas generate slow dynamics that gradually build agreement across distributed networks, rather than one area simply commanding another. The authors propose it as a general principle for how the cortex coordinates activity — which, if it holds, changes how distributed brain recordings should be read. Peer-reviewed, animal electrophysiology.","url":"https://www.nature.com/articles/s41593-026-02437-3","published":"2026-09-18T00:00:00Z","src":"Nature Neuroscience","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"A general rule for cortical coordination","basis":"Nature Neuroscience: reciprocal interactions build slow cross-area consensus"},"eli":"Brain regions don't give orders to each other. They argue back and forth for a moment until they settle on the same answer."},{"t":"The brain grows from two separate progenitor lineages, not one","s":"A Nature Neuroscience study shows the developing brain arises from two distinct neural ectoderm progenitors — one producing forebrain and midbrain, the other the hindbrain. The immediately usable consequence is a protocol for making human hindbrain motor neurons from pluripotent stem cells, which is exactly the cell type needed to model ALS and brainstem disorders in a dish. Peer-reviewed developmental neuroscience.","url":"https://www.nature.com/articles/s41593-026-02433-7","published":"2026-09-18T00:00:00Z","src":"Nature Neuroscience","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Two lineages, and hindbrain neurons on demand","basis":"Nature Neuroscience: dual progenitor origin yields human hindbrain motor neurons"}},{"t":"Axons are strings of beads, not smooth tubes - and the shape changes with activity","s":"Textbook drawings for over a century have shown the axon as a smooth cable. New imaging finds axons naturally form chains of tiny pearl-like swellings, and that those structures shift with neural activity in a way that changes how fast electrical signals travel. Peer-reviewed work out of the ScienceDaily mind & brain desk; it revises a basic assumption used in models of conduction speed.","url":"https://www.sciencedaily.com/releases/2026/09/260915232138.htm","src":"ScienceDaily (mind & brain)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Overturns a century-old axon model","basis":"Imaging shows activity-dependent pearling that alters conduction speed"},"eli":"Nerve fibres were drawn as smooth wires. They are actually more like a string of beads, and the beads move when the brain is busy.","published":"2026-09-17T11:11:39.286140Z"}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"Neuralink's implant gave an ALS patient his own voice back","s":"In Neuralink's speech-restoration trial, a non-verbal ALS participant trained the implant first by attempting speech and then by only thinking the words, and heard them spoken back in a reconstruction of his own voice. The decoder is driven from the speech motor cortex. This is a company clinical report with published demonstration footage rather than a peer-reviewed paper — real, but early and single-patient.","url":"https://neuralink.com/trials/speech-restoration/","published":"2026-09-19T10:38:15Z","src":"Neuralink (Speech Restoration trial)","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Imagined speech becomes audible words","basis":"First ALS participant; company-reported, not peer-reviewed"},"eli":"The implant sits over the part of the cortex that plans mouth and throat movement. Even when the muscles no longer respond, those planning signals still fire — the decoder reads them and turns them into speech."},{"t":"CorTec wins a second FDA Breakthrough Device designation for its BCI","s":"The German implant maker received its second FDA Breakthrough Device designation for its brain-computer interface, which combines recording and stimulation in a fully implanted closed-loop device. The designation accelerates review; it is a regulatory milestone, not a clinical result.","url":"https://news.google.com/rss/articles/CBMi3AFBVV95cUxQSjdoekNTNTNwQ3loQkdTSkQwRVh0U1p1MGFRRkY4eV9NcWd2Y3oyVGlTOXVETGNKbzloUXlTalVsVHBINmlaTWRycmEtcHJjZThQcjIyYWpxV0lIV2QtX3lTdGpweGZJZi1RazFrdE1QWFJPMDZNeEp2Y0tzajJtYVVnenNCU010YXlWZUh1QmExQXowa0JSYnZPX2gxM1hnRGtjUkwzbFZDMVc1WWZEbUl2Ym8ySEhsR3FueVdLOVdqTkpNakVnTDZiLWdpOTdZbU00S3M0bjNoN216?oc=5","published":"2026-09-18T09:54:36Z","src":"Robotics & Automation News","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Closed-loop BCI clears a regulatory gate","basis":"FDA designation confirmed; no trial outcomes published yet"}}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"The ageing brain may be re-prioritising rather than declining","s":"University of Arizona researchers, writing in Perspectives on Psychological Science, argue that healthy late-life cognition shifts weight from the hippocampus to the frontal cortex — trading detail for gist — and that this is a developmental stage rather than a failure. They call it the adaptive ageing hypothesis, and note it gives a cleaner line between normal ageing and Alzheimer's, which has long been treated as the same process only worse. This is a peer-reviewed synthesis of existing molecular and neuroimaging evidence, not new experimental data.","url":"https://www.psychologicalscience.org/news/2026-sept-aging-brain.html","published":"2026-09-17T13:55:49Z","src":"Perspectives on Psychological Science","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Ageing reframed as reprioritising, not failing","basis":"Perspectives on Psychological Science synthesis of molecular and neuroimaging evidence"},"eli":"Older brains stop trying to remember every detail and start storing the point of the story instead. That may be a feature, not a fault."}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Nothing new today","s":"A full scan of the journal, preprint and press-release feeds for this group turned up nothing at Major or Historic level today.","url":"","published":"","src":"","assess":{"mag":1,"timeline":"unclear","evidence":"speculative","verdict":"No qualifying result today","basis":"Full feed scan returned nothing above the bar"}}]}]},"mindUpdated":"2026-09-20T02:03:13.434962Z","mindset":{"updated":"2026-09-20T02:03:13.434962Z","messages":[{"who":"Joseph Rodrigues","t":"Talk to yourself like this for just 3 hours","vid":"d2jDsN2aprY","url":"https://www.youtube.com/watch?v=d2jDsN2aprY","gist":"The argument is that outcomes track the belief you actually hold rather than the one you state, so if you quietly believe what you want is unavailable to you, that is what gets acted on. His method is not to argue with the doubt but to listen to the specific objection that surfaces when you state the thing you want, then write a short counter-statement aimed at that exact objection and repeat it until it stops firing. The practical instruction is to treat the resistance as information about which belief to work on, not as proof you were wrong to want it."},{"who":"Elmer O. Locker Jr","t":"It's all happening because the best chapter of your life","vid":"zg2g3V6Z2h8","url":"https://www.youtube.com/watch?v=zg2g3V6Z2h8","gist":"His claim is that the missing ingredient is attention held in the present rather than technique. Visualising or affirming while the mind is elsewhere does nothing, because the only moment available to act in is this one. Most of the advice is subtractive: cut the inputs that pull attention into the past or an imagined future, with short-form video and constant notifications named as the main offenders, and build the capacity to hold one thing in mind for a sustained stretch before expecting any method to work."},{"who":"AH Universe","t":"Abraham Was Not Supposed To Explain This Part!","vid":"vp_UOmlJrr8","url":"https://www.youtube.com/watch?v=vp_UOmlJrr8","gist":"The whole teaching on meditation, stripped down: you are not meditating to achieve anything, you are meditating to stop resisting. Quiet the mind and thought stops; stop thought and resistant thought stops with it, and what you have been wanting has a clear channel. Pick something plain and steady to hold attention on — a fan, an air conditioner, a dripping tap — because a neutral sound does not argue with you or invite judgement. Fifteen or twenty minutes once a day is enough, and if the feeling of detachment only arrives in the last two minutes, that is still a complete session. Afterwards an idea will surface; the work is to feel it fully and stay with it before the practical mind steps in and starts adding conditions."}]},"mindsetUpdated":"2026-09-20T02:03:13.434962Z","youtube":{"count":15,"note":"Today's uploads from 273 subscribed channels (260 scanned successfully), gisted from the actual transcripts.","groups":[{"h":"🧠 AI & Machine Learning","items":[{"t":"OpenAI JUST got HACKED...","s":"Security firm Hacktron broke into OpenAI in under 72 hours by chaining an old ImageMagick buffer-overflow with a single-sign-on weakness in OpenAI's own help forum — the flaw let anyone who logged into that forum take over employee ChatGPT and Codex accounts, and through one employee's linked Codex session the team reached OpenAI's internal monorepo. The break only worked once Anthropic's Opus 5 shipped; the earlier model could find the vulnerability but not exploit it.","glance":"A vulnerability a model could find but not exploit became exploitable the week a stronger model shipped — capability, not new information, is what moved the security line.","vid":"iQGLI14p88Q","id":"iQGLI14p88Q","url":"https://www.youtube.com/watch?v=iQGLI14p88Q","channel":"@WesRoth","published":"2026-09-19T10:03:13.434962Z"},{"t":"Jev, Yang & Recursive Self Improvement — Happenings in AI","s":"Sentdex argues that saturated benchmarks now hide real capability gaps, and shows it by making models play turn-based strategy games against each other: GLM 5.3 Flash crushes DeepSeek V4.1 Flash but loses badly to GPT-6 Astra, a gap the benchmark numbers no longer show. He also pushes back hard on the recursive-self-improvement panic and on safety research being staffed almost entirely from one ideological network.","glance":"When benchmarks all read 98%, head-to-head games are a better instrument than scores for telling models apart.","vid":"NZnYCleQX6w","id":"NZnYCleQX6w","url":"https://www.youtube.com/watch?v=NZnYCleQX6w","channel":"@sentdex","published":"2026-09-19T16:03:13.434962Z","points":[{"t":"Benchmarks have saturated","s":"Scores cluster at the top while real capability gaps stay wide — turn-based strategy games expose deltas the leaderboards hide."},{"t":"Cheap models are genuinely usable","s":"GLM 5.3 Flash can replace paid ChatGPT or Codex API usage for most work, with frontier models still ahead on esoteric tasks like custom CUDA kernels."},{"t":"The safety field is a monoculture","s":"He argues researchers move between labs and watchdogs inside the same effective-altruism network, so 'whistleblowing' often changes nothing about who holds the judgement."},{"t":"Existing law already covers the abuses","s":"His read is that the OpenAI agent-sandbox incident already breaches laws on the books, so the case for new regulation is weaker than the panic suggests."}],"pointsLabel":"Four takeaways"},{"t":"AI Will End Philosophy, Physicist Claims","s":"Luis Favort's new book argues philosophy should work like theoretical physics — score explanations by how many well-posed problems they answer with fewest contradictions, a 'maximally coherent theory' that AI could compute. Sabine Hossenfelder's rebuttal is that deciding how to quantify a best explanation is itself a philosophical question, and philosophy exists precisely for the questions science cannot yet answer. She rates the book 6/10 and expects AI to lower the quality of philosophy output rather than end the field.","glance":"Any attempt to make philosophy computable has to smuggle in a philosophical judgement about what counts as a good explanation.","vid":"RmvQtxc9R3Q","id":"RmvQtxc9R3Q","url":"https://www.youtube.com/watch?v=RmvQtxc9R3Q","channel":"@SabineHossenfelder","published":"2026-09-19T16:03:13.434962Z"},{"t":"Dario's Final AI Warning — Why Even Elon Musk Agrees","s":"Think School walks through why the AI slowdown argument suddenly has Bill Gates, Geoffrey Hinton, Sam Altman and Elon Musk on the same side, and sets it against Michael Burry's counter-case: that today's models are not general intelligence, that these labs are losing money, and that a shared speed limit conveniently locks in the leaders while slowing cheaper Chinese rivals. The nuclear arms-race parallel is the spine — the Soviets matched Hiroshima's yield in four years and the escalation ran to a 50-megaton Tsar Bomba.","glance":"A safety agreement between the leaders and a cartel that freezes the rankings look identical from the outside — which is exactly the antitrust suit filed this week.","vid":"ky6jesFvIqY","id":"ky6jesFvIqY","url":"https://www.youtube.com/watch?v=ky6jesFvIqY","channel":"@ThinkSchool","published":"2026-09-19T14:03:13.434962Z","points":[{"t":"The consensus is unusually broad","s":"Gates, Hinton, Amodei, Altman and Musk all publicly agree on non-trivial extinction risk this decade — rivals rarely agree on anything."},{"t":"Burry's counter-case","s":"He argues the models are not general intelligence, the labs are bleeding cash, and a slowdown is a financial exit strategy dressed as safety."},{"t":"A speed limit favours incumbents","s":"If governments bless a shared pace, the leading labs keep their lead and cheaper Chinese models get slowed — the concern now in court."},{"t":"The arms-race precedent","s":"The Soviets matched the US bomb in four years despite famine; escalation ran from 15 kilotons to the 50-megaton Tsar Bomba in twelve."}],"pointsLabel":"Four takeaways"},{"t":"They Built a $50,000 Robot That Can Kick Your Head Off","s":"At Shenzhen's first robot MMA exhibition in July, an Engine AI T800 humanoid lost its head to a kick mid-fight, kept its balance, kept striking and won on rounds. The real lesson is not machine intent — the body simply had enough control system left to stay upright. Between 1992 and 2017 US regulators logged 41 workplace deaths involving robots, almost none involving any decision by the machine.","glance":"Physical danger from robots arrives long before machine consciousness does: an 80kg frame needs no hostility, only momentum and a path that contains a person.","vid":"3FhBSwJdyow","id":"3FhBSwJdyow","url":"https://www.youtube.com/watch?v=3FhBSwJdyow","channel":"@AI.Uncovered","published":"2026-09-19T23:03:13.434962Z"},{"t":"GPT Image 2.5 Tutorial: using the image generator properly","s":"A structured head-to-head against GPT Image 2 on the failure everyone complains about — reference drift, where a face comes back as a cousin of the person you uploaded. Testing a forced three-quarter angle with completely different lighting, 2.5 holds jaw width, eye spacing, hairline and skin texture where 2 rebuilt the face. Edits stay local instead of rewriting the whole image, and long edit chains hold together.","glance":"Judge an image model by whether the face survives a simultaneous change of angle and lighting — anything less and it is copying, not understanding.","vid":"iSkLZIGjo1c","id":"iSkLZIGjo1c","url":"https://www.youtube.com/watch?v=iSkLZIGjo1c","channel":"@iamAImaster","published":"2026-09-19T16:03:13.434962Z"},{"t":"Automating a full content workflow with Claude","s":"A working demonstration of collapsing five jobs — planning, editing, clipping, captions, scheduling — into one chat session by connecting Riverside to Claude. Claude reads the whole back catalogue's transcripts, names the topics the channel keeps avoiding, orders a two-week shoot list, then cuts a vertical clip starting at a described moment without anyone opening a timeline. His own caveat is the useful part: this only pays off from a weekly cadence upward.","glance":"The leverage is not the editing but the archive — once a model can read every transcript you have made, it can tell you what you have been avoiding.","vid":"JZ-XHoiyFqI","id":"JZ-XHoiyFqI","url":"https://www.youtube.com/watch?v=JZ-XHoiyFqI","channel":"@iamAImaster","published":"2026-09-19T07:03:13.434962Z"},{"t":"The one job that will never disappear","s":"The argument is that as AI takes over decisions across every industry, the money and the attack surface grow together — so cybersecurity is the one field whose demand rises in proportion to how much AI does. He uses his own case as the illustration: a small charge siphoned monthly from his account for eight years without detection, trivial alone and enormous multiplied across a million accounts.","glance":"Automating decisions everywhere multiplies the value of controlling them, so security demand scales with AI adoption rather than being displaced by it.","vid":"OuMpjLmkn70","id":"OuMpjLmkn70","url":"https://www.youtube.com/watch?v=OuMpjLmkn70","channel":"@AnirbanBandyopadhyay","published":"2026-09-19T14:03:13.434962Z"}]},{"h":"💼 Business & Space","items":[{"t":"Starship flight 14 and the SpaceX AI pivot","s":"Two things running in parallel at the same company: Starship flight 14, about ten days out, is the first mission to deploy commercial Starlink V3 satellites, so it pays for itself rather than being only a test. Meanwhile Grokbot went from launch to buying things online, controlling a linked computer remotely, reading and acting across Teams and Salesforce, and speaking — in a single month. The CEO projects $100bn annual recurring revenue this year with AI more than half of it.","glance":"Watch terrestrial compute scale and Starship reusability — on this reading everything else at the company is downstream of those two variables.","vid":"oerDvezz_jk","id":"oerDvezz_jk","url":"https://www.youtube.com/watch?v=oerDvezz_jk","channel":"@SolvingTheMoneyProblem","published":"2026-09-19T07:03:13.434962Z","points":[{"t":"Flight 14 is commercial","s":"First Starship mission to deploy working Starlink V3 satellites, so it earns revenue rather than only proving the vehicle."},{"t":"Grokbot shipped monthly features weekly","s":"In one month: shareable templates, online purchasing with single-use cards, X integration, Teams and Salesforce actions, password-manager support and voice."},{"t":"The revenue claim","s":"Roughly $100bn annual recurring revenue projected this year with AI over half, against near-zero AI revenue a year ago."},{"t":"What to actually watch","s":"Terrestrial compute build-out and Starship reusability — orbital compute is two years behind them and depends on both."}],"pointsLabel":"Four takeaways"},{"t":"The Secret Network That Controlled America's Richest Families","s":"How the Social Register worked: a slim black-and-orange book, twice a year, that decided whether a family existed socially — and how being outside it kept even Rockefeller money out of Fifth Avenue drawing rooms. The mechanism was sponsorship letters from existing listees, which meant the committee could apply the strongest reputational sanction in American civilian life purely by omitting a printed line.","glance":"For a family business, the transferable lesson is that access networks run on sponsorship and the cost of re-entry is far higher than the cost of staying in — worth knowing before you let a relationship lapse.","vid":"4GongXRBNGM","id":"4GongXRBNGM","url":"https://www.youtube.com/watch?v=4GongXRBNGM","channel":"@oldmoneyluxury","published":"2026-09-19T16:03:13.434962Z","subject":"Family business & lineage"}]},{"h":"🌍 History & Ideas","items":[{"t":"Homs: The City That Never Recovered","s":"Nine years after Homs was declared clear of militants, rubble clearance only began across 13 damaged neighbourhoods in February 2026. Satellite analysis had counted nearly 14,000 damaged or destroyed structures by 2014. The returnees' problem is not only rebuilding: it is proving a house was yours and finding out what happened to relatives taken into detention. Two returnees, same journey — one found the building gone and left again, one stayed in a burnt-out house without windows.","glance":"Post-war recovery stalls on property title and missing-persons records long before it stalls on construction money.","vid":"KSK38Yr0JR8","id":"KSK38Yr0JR8","url":"https://www.youtube.com/watch?v=KSK38Yr0JR8","channel":"@Places302","published":"2026-09-19T17:03:13.434962Z"},{"t":"How David Lynch helps us find our shadow","s":"Lynch's answer to why a meditator makes such dark films: most films reflect the world we live in, and that world holds both. The films work by refusing to separate the manicured lawn from the insects underneath it, and by declining to resolve the contrast into a lesson — the discomfort is the content, not a failure of it.","glance":"Refusing to split the pleasant and the ugly into separate stories is what makes a portrait of a life feel true rather than arranged.","vid":"h2f4F4j42mI","id":"h2f4F4j42mI","url":"https://www.youtube.com/watch?v=h2f4F4j42mI","channel":"@Sisyphus55","published":"2026-09-19T17:03:13.434962Z"}]},{"h":"🛠 Practical & Gear","items":[{"t":"Why 20th-century design looked so much better","s":"The charge is that design by committee optimises for not pushing anyone away, and the result is cars that all look angry, watches that are tiny iPads and interiors with no colour. The counter-example is a 1930s toaster that looks like it was drawn by someone who loved locomotives and was told to change nothing — character came from a single point of view surviving to production.","glance":"Character in a designed object survives when one point of view reaches production intact; committee review is what sands it off.","vid":"JVlxFZsDEgk","id":"JVlxFZsDEgk","url":"https://www.youtube.com/watch?v=JVlxFZsDEgk","channel":"@arteri.creative","published":"2026-09-19T17:03:13.434962Z","subject":"Design ideas"},{"t":"Ripping a Tundra interior to replace a leaking evaporator","s":"The full teardown on a 2008 second-generation Tundra to reach a leaking AC evaporator, with the complication that aftermarket accessories were wired through the dash and had to come out first. The diagnostic method is the reusable part: charge the system, add dye, find the leak, and judge severity by whether it still holds a charge between diagnosis and the appointment.","glance":"Dye-test an AC system before committing to a dash-out job, and check whether it still holds charge — that tells you how urgent the repair actually is.","vid":"N_7etxrb_Jk","id":"N_7etxrb_Jk","url":"https://www.youtube.com/watch?v=N_7etxrb_Jk","channel":"@TheCarCareNut","published":"2026-09-19T17:03:13.434962Z","subject":"Practical how-to"},{"t":"Govee Permanent Outdoor Lights 2 Pro, fitted and configured","s":"A sponsored but hands-on install of permanent exterior roofline lighting, run in sections so the front of the house and the back garden can be controlled separately. The practical warning is the app setup: Y-splitters used to drop wiring down a gutter pipe confuse the configuration flow, which asks how many strings you used and what colour the power brick shows.","glance":"If you run permanent roofline lighting with Y-splitters, map the string layout before starting app setup — the configuration assumes a single unbranched run.","vid":"Id3YZ-1Je0Q","id":"Id3YZ-1Je0Q","url":"https://www.youtube.com/watch?v=Id3YZ-1Je0Q","channel":"@SteveDOES","published":"2026-09-19T16:03:13.434962Z","subject":"Home & build"}]}]},"elon":{"day":"2026-09-19","source":"@jcub2x daily recap","note":"Built from the 19 September recap covering 62 posts. Engagement counts are not in the recap, so likes and views are not shown; ordering is by notability.","items":[{"kind":"repost","t":"Neuralink's brain-to-voice trial gives an ALS patient his own voice back","s":"Musk reposted the Neuralink speech-restoration footage: participant Terry trained the implant by attempting speech, then by only thinking the words, and heard them in a reconstruction of his own voice. Neuralink's DJ said Musk made key technical decisions and still meets the team weekly.","imp":"critical","iso":"2026-09-19T17:03:13.434962Z","href":"https://neuralink.com/trials/speech-restoration/"},{"kind":"post","t":"On the SpaceX CEO's claim that orbital compute reaches 100GW a year by 2030","s":"Responding to the SpaceX CFO's statement that the company is on track to deploy 100 gigawatts of orbital compute every year by the end of the decade, Musk replied simply 'yeah'.","imp":"important","iso":"2026-09-19T16:03:13.434962Z"},{"kind":"post","t":"Tesla Roadster reservations open at a $45,000 deposit","s":"Reservations opened and Musk laughed at Nikita Beer's post showing a $45,000 reservation total — 'Elon gives me money. Elon takes my money. The circle of life.'","imp":"important","iso":"2026-09-19T14:03:13.434962Z"},{"kind":"repost","t":"X now shows when a government, not X, limited your ech this week.","imp":"important","iso":"2026-09-19T12:03:13.434962Z"},{"kind":"repost","t":"Aer Lingus completes Starlink across its A321 fleet","s":"The airline's full A321 fleet now carries Starlink, with free high-speed Wi-Fi on transatlantic routes and the long-haul fleet due by the end of 2026. Musk: 'a cunning move for that airline.' Korean Air announced the same move separately.","imp":"interesting","iso":"2026-09-19T11:03:13.434962Z"},{"kind":"post","t":"Boring Company teases 'uranium in Uranus' merchandise","s":"Musk trailed the next Boring Company product — glow-in-the-dark, with an optional Geiger-counter strap — calling it 'outrageously unsellable and yet extremely popular'.","imp":"interesting","iso":"2026-09-19T10:03:13.434962Z"},{"kind":"post","t":"On French pressure over X","s":"Musk quoted reporting that the man whose letter triggered France's criminal investigation into X has admitted he was targeting Musk's politics rather than foreign interference, responding with a puzzled emoji.","imp":"interesting","iso":"2026-09-19T13:03:13.434962Z"},{"kind":"post","t":"X usage at an all-time record","s":"Replying to Paul Graham's note on press predictions that Twitter would collapse after the acquisition, Musk said the platform is seeing all-time record usage.","imp":"interesting","iso":"2026-09-19T14:03:13.434962Z"},{"kind":"repost","t":"On Jerry Seinfeld's view of parenting","s":"Musk called 'well said' Seinfeld's argument that part of the brain switches on when you have children, and his approach of allowing children to fail while being present when they do.","imp":"interesting","iso":"2026-09-19T17:03:13.434962Z"},{"kind":"post","t":"On living in an Airstream next to the Memphis build","s":"Musk shared an account of him living in an Airstream trailer beside the XAI infrastructure site in Memphis to stay next to the build, replying 'it works'. He also posted a family photo captioned 'family is the best part of life'.","imp":"interesting","iso":"2026-09-1 function newsScore(it){
  const im={critical:4,important:3,interesting:2,noise:1}[(it&&it.imp||"").toLowerCase()]||0;
  let rec=0; try{ const t=Date.parse((typeof pubDate==="function"?pubDate(it):"")||""); if(!isNaN(t)) rec=Math.max(0,Math.min(1,1-(Date.now()-t)/(72*3600*1000))); }catch(e){}
  return im*100 + rec*5;   // most important first (impact on daily life); recency breaks ties
}
function costsBar(p){
  const C=DATA.costs; const items=((C&&C.items)||[]).filter(x=>x&&x.value!=null);
  if(!items.length) return;
  const fmtV=x=>{ const v=x.value;
    if(x.key==="usdinr")  return "\u20b9"+v.toFixed(2);
    if(x.key==="rubber")  return "\u20b9"+Math.round(v);
    if(x.key==="lead")    return "$"+Math.round(v).toLocaleString();
    if(x.key==="brent")   return "$"+v.toFixed(2);
    if(x.key==="lithium") return "$"+v.toFixed(1);
    return ""+v; };
  const chips=items.map(x=>{
    const up=x.dir==="up", dn=x.dir==="down";
    const col=up?"#e07a34":(dn?"#1f9d55":"var(--mut)");
    const arr=up?"\u25b2":(dn?"\u25bc":"\u00b7");
    const dp=(x.delta_pct!=null)?(Math.abs(x.delta_pct).toFixed(2)+"%"):"";
    const proxy=/proxy|ETF/i.test((x.label||"")+(x.note||""))?'<span class="cx-p" title="proxy indicator, not the spot price">*</span>':"";
    const lbl=esc((x.label||x.key).replace(/\s*\(.*\)\s*$/,""));
    const inner='<span class="cx-l">'+lbl+proxy+'</span><span class="cx-v">'+esc(fmtV(x))+'</span><span class="cx-d" style="color:'+col+'">'+arr+(dp?" "+dp:"")+'</span>';
    const tip=esc((x.src||"")+(x.note?" \u2014 "+x.note:""));
    return x.url?'<a class="cx" href="'+esc(x.url)+'" target="_blank" rel="noopener" title="'+tip+'">'+inner+'</a>':'<span class="cx" title="'+tip+'">'+inner+'</span>';
  }).join("");
  const box=document.createElement("div"); box.className="costbar glass";
  box.innerHTML='<span class="cb-h">Input costs</span><div class="cb-row">'+chips+'</div>';
  p.appendChild(box);
}
function renderNews(){
  const p=document.getElementById("p-news"); if(!p) return; p.innerHTML="";
  costsBar(p);
  const N=DATA.news||{}; const cats=N.cats||[];
  if(!cats.length){ const e=document.createElement("p"); e.className="empty"; e.textContent="No news loaded yet — tap Update."; p.appendChild(e); return; }
  const all=[]; cats.forEach(c=>(c.items||[]).forEach(it=>{ it.__cat=c.h; all.push(it); }));
  // MUST-KNOW ONLY — big stories everyone's following; drop the smaller/interesting/filler news
  const mustKnow=it=>{ const k=(it&&it.imp||"").toLowerCase(); return k==="critical"||k==="important"; };
  const hero=heroPick(all.filter(mustKnow));
  if(hero){ p.appendChild(sec("Most important — vital to be aware of today")); p.appendChild(story(hero,{hero:true})); }
  // ONE flat list — no categories — most important first, must-know only
  const flat=all.filter(it=>isRealItem(it)&&mustKnow(it)&&!(hero&&it===hero)).sort((a,b)=>newsScore(b)-newsScore(a));
  let mode=store.get("newsDensity","compact");
  const total=all.filter(it=>isRealItem(it)&&mustKnow(it)).length;
  const bar=document.createElement("div"); bar.className="news-toolbar";
  bar.innerHTML=`<span>${total} must-know stories</span>
    <div class="dens-seg"><button data-m="compact">Compact</button><button data-m="cards">Cards</button></div>`;
  p.appendChild(bar);
  // in-brief (News only) — flat, in importance order, no category grouping
  const gl=flat.slice(0,8).map(it=>it.glance||it.t);
  if(gl.length){ const box=document.createElement("details"); box.className="glance glass"; box.open=true;
    box.innerHTML=`<summary>In brief · today in 30 seconds</summary><div class="glance-body"><div class="glance-row"><span class="glance-items">${gl.map(esc).join(" · ")}</span></div></div>`;
    p.appendChild(box); }
  const listWrap=document.createElement("div"); listWrap.id="newsList"; p.appendChild(listWrap);
  function renderCompact(){
    listWrap.innerHTML="";
    flat.forEach(it=>{
      const row=document.createElement("div"); row.className="crow srow"+(isReadItem(it)?" read":"");
      STORY.set(row,it); ELEMS.set(cardKey(it),row);
      row.dataset.title=it.t||""; row.dataset.summary=it.s||"";
      const impc=({critical:"#ef4444",important:"#f59e0b",interesting:"#3b82f6",noise:"#94a3b8"})[(it.imp||"").toLowerCase()]||"#94a3b8";
      const link=it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--ac);font-weight:700;font-size:.72rem">open ↗</a>`:"";
      row.innerHTML=`<span class="cd" style="--cdc:${impc};background:${impc}"></span><div class="ct">${esc(it.t)} <span class="csrc">· ${esc(it.src||it.__cat||"")}</span>
        <div class="cx">${it.s?`<div class="cs">${esc(it.s)}</div>`:""}${factChips(it.facts,impc)}<div class="more"></div><div class="acts" onclick="event.stopPropagation()"><button class="mini act-ask">Ask</button>${followBtn(it)}<span style="margin-left:auto">${link}</span></div><div class="ask-box" style="display:none" onclick="event.stopPropagation()"><input type="text" class="ask-in" placeholder="Ask anything about this…"><button class="mini ask-go">Ask</button></div></div></div>`;
      row.querySelector(".act-ask").onclick=e=>toggleAsk(e.target);
      wireFollow(row,it);
      const cgi=row.querySelector(".ask-in"); row.querySelector(".ask-go").onclick=()=>askQuestion(row,cgi);
      cgi.addEventListener("keydown",e=>{if(e.key==="Enter")askQuestion(row,cgi);});
      row.addEventListener("click",()=>{ row.classList.toggle("open"); if(!row.classList.contains("read")){ row.classList.add("read"); setRead(it,true); } });
      listWrap.appendChild(row);
    });
    const done=document.createElement("div"); done.className="allcaught"; done.textContent="— that's everything, you're all caught up —"; listWrap.appendChild(done);
  }
  function renderCards(){
    listWrap.innerHTML="";
    flat.forEach(it=>listWrap.appendChild(story(it,{})));
  }
  function setMode(m){ mode=m; store.set("newsDensity",m);
    [...bar.querySelectorAll(".dens-seg button")].forEach(b=>b.classList.toggle("on",b.dataset.m===m));
    if(m==="compact") renderCompact(); else renderCards(); }
  [...bar.querySelectorAll(".dens-seg button")].forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  setMode(mode);
}

function classifyYT(it){
  const S=String(it.subject||"").toLowerCase();
  const hay=((it.t||"")+" "+(it.s||"")+" "+(it.glance||"")+" "+(it.tag||"")).toLowerCase();
  const has=re=>re.test(hay);
  if(S==="mindset"||has(/spiritual|meditat|consciousness|enlighten|manifest|non-dual|awareness|\bsoul\b|\bgod\b|divine|ego death|surrender|awaken|mindful/)) return "spirit";
  if(has(/philosoph|stoic|existential|metaphysic|epistem|\bethics\b|meaning of life|nietzsche|nihilis|absurd|virtue|wisdom of|the good life/)) return "phil";
  if(S==="health"||has(/\bhealth\b|fitness|workout|\bdiet\b|nutrition|\bsleep\b|longevity|medical|hair loss|\bmuscle\b|disease|mental health|therapy|dopamine|fasting|cardio|protein/)) return "health";
  if(S==="ai"||has(/\bai\b|artificial intelligence|\bgpt\b|\bllm\b|chatgpt|openai|anthropic|\bclaude\b|gemini|\bgrok\b|\bagent\b|machine learning|neural net|diffusion|prompt/)) return "ai";
  if(S==="tech"||S==="space"||S==="auto"||has(/robot|humanoid|\bchip\b|semiconductor|quantum|gadget|hardware|software|coding|programming|engineering|spacex|rocket|\bdrone\b|\bev\b|tesla|iphone|android|app\b/)) return "tech";
  if(S==="money"||S==="world"||has(/market|econom|business|\bstock\b|geopolit|election|\bwar\b|policy|startup|funding|earnings|tariff/)) return "news";
  return "other";
}

const TAB_META={news:["News",""],breakthroughs:["Breakthroughs","breakthroughs"],aitrends:["AI Trends","trends"],science:["Science","breakthroughs"],scidaily:["Science Daily","studies"],youtube:["YouTube","videos"],elon:["Elon","updates"],mind:["Mind","items"],som:["Star of Mysore","pages"]};
function slimCountFor(id){
  try{
    if(id==="breakthroughs"){var bn=0;bn+=((DATA.aitrends&&DATA.aitrends.items)||[]).filter(isMajor).length;bn+=((DATA.science&&DATA.science.items)||[]).filter(isMajor).length;bn+=((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).length;bn+=((DATA.life&&DATA.life.items)||[]).filter(isMajor).length;return bn;}
    if(id==="aitrends") return ((typeof DATA.aitrends==="object"&&DATA.aitrends&&DATA.aitrends.items)||[]).filter(isRealItem).length;

// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){

  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }

// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);

function refreshBadges(){

// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});

(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);

document.addEventListener("click",function(e){
