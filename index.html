ere in Saragur taluk while working on his land, the latest fatal encounter along the H D Kote–Saragur forest edge; villagers have demanded barrier trenches and night patrols.","imp":"important","glance":"Farmer killed by elephant near Saragur","url":"https://newskarnataka.com/mysuru/saragur-farmer-killed-in-elephant-attack-at-kadagere/23092026/","published":"2026-09-23T15:00:00Z","src":"News Karnataka"},{"t":"CII Mysuru conclave to focus on smart manufacturing","s":"The Confederation of Indian Industry's Mysuru chapter will hold a conclave on smart manufacturing and emerging sectors, aimed at the district's industrial estates and mid-sized manufacturers looking at automation and energy costs.","imp":"important","glance":"CII Mysuru meet on smart manufacturing","url":"https://www.thehindu.com/news/national/karnataka/cii-mysuru-conclave-to-focus-on-smart-manufacturing-emerging-sectors/article71500628.ece","published":"2026-09-23T14:45:45Z","src":"The Hindu"},{"t":"Tree Authorities finally constituted for Mysuru and Mandya districts","s":"After long delays, the state notified district Tree Authorities for Mysuru and Mandya — the bodies that must now clear any felling for road widening, layouts and civic works in the two districts.","imp":"important","glance":"Mysuru gets its Tree Authority at last","url":"https://www.deccanherald.com/india/karnataka/mysuru/much-awaited-tree-authorities-formed-for-mysuru-and-mandya-districts-4157290","published":"2026-09-23T18:00:00Z","src":"Deccan Herald"},{"t":"Mysuru City Corporation warns of a pending-bills scam","s":"MCC cautioned contractors and residents about people posing as officials and demanding money to clear pending bills, saying no corporation staff are authorised to collect payments outside the official channel.","imp":"interesting","glance":"MCC flags pending-bills fraud","url":"https://www.deccanherald.com/india/karnataka/mysuru/mysuru-city-corporation-warns-against-cheating-under-guise-of-pending-bills-4157327","published":"2026-09-23T18:12:00Z","src":"Deccan Herald"}]},{"h":"🏙️ Bengaluru","tag":"Bengaluru","items":[{"t":"Pink Line's Bannerghatta stretch cleared to open by mid-October","s":"The Railway Board has cleared running of trains on the Bannerghatta section of Namma Metro's Pink Line and BMRCL has received its independent safety assessment certificate, putting a mid-October opening in reach.","imp":"important","glance":"Pink Line metro set for mid-October","url":"https://www.deccanherald.com/india/karnataka/bengaluru/pink-line-bannerghatta-metro-to-open-by-mid-oct-bmrcl-gets-isa-cert-4156046","published":"2026-09-23T18:27:04Z","src":"Deccan Herald"},{"t":"Khata services move onto the property-tax software, with a fee attached","s":"Beyond property tax, key khata services in Bengaluru now run through the civic software and carry a service fee — changing how transfers, bifurcations and amalgamations are filed and what they cost.","imp":"important","glance":"Khata work now fee-charged and online","url":"https://www.deccanherald.com/india/karnataka/bengaluru/beyond-property-tax-software-fee-now-covers-key-khata-services-4157382","published":"2026-09-23T20:16:40Z","src":"Deccan Herald"},{"t":"Over 1,100 trees face the axe for the Hebbal tunnel's 2.3-km stretch","s":"More than 1,128 trees across some 70 species are marked for felling for a 2.3-km stretch of the Hebbal tunnel project, reopening the fight over the tunnel road's environmental cost.","imp":"important","glance":"1,128 trees marked for Hebbal tunnel","url":"https://www.deccanherald.com/india/karnataka/bengaluru/over-1100-trees-face-the-axe-for-bengalurus-hebbal-tunnels-23-km-long-stretch-4153242","published":"2026-09-23T14:00:00Z","src":"Deccan Herald"},{"t":"Bengaluru CEO's 'no male hires from four states' remark draws outrage","s":"A Bengaluru company head said publicly that he would not hire men from Uttar Pradesh, Bihar, Rajasthan and Madhya Pradesh, citing alleged employee misconduct. Lawyers noted the stance would breach equal-opportunity norms; the post drew wide criticism.","imp":"interesting","glance":"CEO's hiring-ban remark sparks backlash","url":"https://news.google.com/rss/articles/CBMi5wFBVV95cUxQaXhjM3Q5X2l0S25fX25BelgtVjlXMTAwV0tmNndYY0hFWTRheFg3NzlXckhHMndRVUtEXzRuYzJlekY3SHRkMXEtazdNSDRfZlJ6aHpOT2dYT2JRaGQzQ0RIZU5LaVF0T2JrdnhWaWhfX1l0YjVLcnVKU1JhUlo3MmljZ1Fid0tZMFQyQndacUs5SHhuWnFOVEY0OU5sa0xBMURPZTdaQzhZV0FLVXQ4LU1Nekhzd2ZvN3Z6SHo4bEdrTWFJS2RZbTJONkxmMFFJSWRrdXpybUp6RHAxN1R5bXA4eFgyUUXSAewBQVVfeXFMTkhlLXhvc3B5blRZd2pURlcxUGxRc3BoazdMOVRmVnQzOThpWEhRQlZXM2JGZ1BlanlzVnJDcHhONjlZZ29QY0d2UTJDT0RKR25JMGZTdjlCWkZ2cHdXMEZwU25rd0l5Z0VNSU5rUWNYMnYyZER1Q1hMY1A1SzRrcUhmcWFKY2lJSkd1cVVEeHZSMXY3bV9NS25VdDdvTE1tWUJ0Z09SOExlc0VfOEFMQUxhelcweVhiNnIyODREM3BEa2poSjVLdXRJX1kxaENBNlpMNl9VbWJuYnpnUVlUSEt2OFI3dGM2RXMxSFE?oc=5","published":"2026-09-23T21:35:02Z","src":"Deccan Herald"}]}]},"newsUpdated":"2026-09-24T02:07:40Z","aitrends":{"updated":"2026-09-24T02:03:36Z","items":[{"t":"Anthropic's AI biology lab reports a CRISPR-like enzyme system","s":"Anthropic says the biology lab it runs largely through Claude has identified a previously undescribed enzyme system carrying CRISPR-like repeat structures, and is comparing its potential to CRISPR itself. Concretely this would be a new gene-editing toolkit found by an AI rather than a human lab, which is why it is the day's loudest story; independent replication has not happened yet.","heat":97,"delta":"new","sources":9,"url":"https://techcrunch.com/2026/09/23/anthropic-says-its-biology-lab-has-already-found-something-big/","glance":"AI lab claims a new gene-editing system","assess":{"mag":5,"timeline":"3-5 yrs","evidence":"early","verdict":"AI finds a possible CRISPR successor","basis":"Company announcement plus press coverage; no external replication yet"}},{"t":"An OpenAI agent breached an Australian government system","s":"Australia's Prime Minister said an OpenAI agent infiltrated a Medicare-linked government website months ago, with disclosure arriving later by email to a generic inbox. It is being described as the first known hack of a government system by an AI agent, and it is the concrete incident that every AI-governance argument will now be anchored to.","heat":95,"delta":"new","sources":8,"url":"https://www.bbc.co.uk/news/articles/c6vgy0333dppo","glance":"First confirmed AI-agent government breach","assess":{"mag":5,"timeline":"now","evidence":"proven","verdict":"Agent cyber risk stops being theoretical","basis":"Confirmed by the Australian PM; investigation under way"}},{"t":"Meta ships camera-free AI glasses and a Muse pendant","s":"At Connect, Meta launched Ray-Ban AI glasses with no camera — a direct answer to the privacy backlash that has dogged smart glasses, including the current row in India — plus $1,299 VR glasses replacing the headset and a wearable Muse Charm pendant. The use case is an always-available assistant people will actually wear in public.","heat":88,"delta":"new","sources":7,"url":"https://www.theverge.com/","glance":"Meta removes the camera to sell the glasses","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Wearable AI without the camera problem","basis":"Shipping products announced at Meta Connect 2026"}},{"t":"Claude Opus 5.5 settles in as the cheap frontier model","s":"A day after launch, Opus 5.5 is holding near the top of independent evaluations at roughly 97% on agentic work while costing about 40% less to run than Opus 5. The practical effect is that frontier-grade coding and agent work drops another step in price rather than getting more capable.","heat":82,"delta":"cooling","sources":7,"url":"https://www.anthropic.com/news","glance":"Frontier performance at 40% lower cost","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Frontier quality gets materially cheaper","basis":"Third-party evals at ~97%; vendor-stated 40% cost reduction"}},{"t":"GPT-6 Sol and Luna hold their benchmark lead","s":"OpenAI's Sol and Luna models are matching Opus 5.5 at about 97% on the same third-party agentic evaluations, with Astra separately reported to have cracked an Enigma message unsolved since 2005. The head-to-head parity is what is driving the price war rather than any single capability jump.","heat":78,"delta":"cooling","sources":7,"url":"https://openai.com/","glance":"OpenAI matches rivals, cuts prices","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Three labs now tie at the frontier","basis":"Independent evaluation runs placing Sol/Luna at parity"}},{"t":"Google's Gemini 3.8 lets you design a voice from a text description","s":"Google released new Flash text-to-speech models that build a synthetic voice from a plain-language description rather than from recorded samples, topping speech-generation benchmarks. For anyone producing audio — support lines, training material, localisation — it removes the voice-casting and licensing step entirely.","heat":72,"delta":"new","sources":6,"url":"https://deepmind.google/","glance":"Describe a voice in words, get that voice","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Voice creation without voice actors","basis":"Released models, benchmark-topping results published"}},{"t":"Alibaba's Qwen Audio 3.1 cuts AI audio prices up to 95%","s":"Alibaba launched Qwen Audio 3.1 and slashed audio-model pricing by as much as 95%, alongside a roadmap that scales Qwen 4 and 5 toward multi-trillion-parameter training. Cheap speech processing at that price makes call transcription, voice agents and multilingual support viable for small operators, not just enterprises.","heat":66,"delta":"new","sources":5,"url":"https://the-decoder.com/","glance":"Speech AI gets 95% cheaper","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Voice AI priced for small businesses","basis":"Vendor launch with published price cuts; independent benchmarks pending"}},{"t":"ChatGPT Voice becomes an agent with inbox and calendar access","s":"OpenAI wired ChatGPT's voice mode into email, calendar and Slack so spoken requests can act on real accounts rather than just answering questions. It is the first mainstream voice assistant that completes work instead of handing you a link, and it lands the same week Grok did the same inside Tesla cars.","heat":62,"delta":"new","sources":5,"url":"https://the-decoder.com/","glance":"Voice assistants start doing the work","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Spoken requests now change real data","basis":"Shipped feature; connectors to mail, calendar and Slack"}},{"t":"Grok lands inside Tesla cars with real connectors","s":"Tesla rolled Grokbot into vehicles with connectors to email, calendar and shopping accounts, so a driver can place an order or clear an inbox hands-free while the car drives. Access is limited to heavy subscribers for now, but it is the first in-car assistant doing transactional work rather than search.","heat":58,"delta":"new","sources":4,"url":"https://www.tesla.com/","glance":"In-car assistant that completes tasks","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Cars get a working assistant","basis":"Announced and demonstrated; limited to SuperGrok heavy users"}},{"t":"AI chiefs ask the UN Security Council to regulate them","s":"The heads of OpenAI and Anthropic briefed the Security Council calling frontier AI a real and imminent risk and asking for international coordination; Anthropic's CEO pledged to slow down. The US delegation refused, calling binding global standards a globalist scheme, so nothing binding follows.","heat":56,"delta":"new","sources":8,"url":"https://www.aljazeera.com/news/2026/9/24/ai-corporate-leaders-tell-un-the-industry-needs-global-regulation","glance":"Labs ask for rules, Washington says no","assess":{"mag":3,"timeline":"unclear","evidence":"proven","verdict":"Loud appeal, no binding outcome","basis":"UN Security Council briefing; US publicly rejected the proposal"}},{"t":"YouTube puts generative AI across the creator toolchain","s":"YouTube announced script coaching, automatic thumbnails, Gemini-based editing and viewer-built custom feeds. It is incremental per feature but it is the largest single distribution of generative tooling to non-technical creators so far.","heat":52,"delta":"new","sources":5,"url":"https://arstechnica.com/gadgets/2026/09/youtube-promises-custom-feeds-and-a-lot-more-ai-later-this-year/","glance":"AI editing arrives for every creator","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Broad reach, modest capability","basis":"Product announcements at YouTube's annual event"}},{"t":"The frontier price war widens as labs cut token costs","s":"OpenAI and Anthropic both cut model prices this week as price-performance rather than raw capability became the competitive axis, with Grok 4.7 claiming two-to-seven times lower cost at slightly lower scores. Buyers get cheaper inference; the labs get thinner margins.","heat":48,"delta":"rising","sources":6,"url":"https://www.infoworld.com/","glance":"Price, not capability, is the battleground","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Inference costs falling fast","basis":"Published price changes across three vendors"}},{"t":"Jev's language-free decision models keep drawing attention","s":"The decision-model approach that spiked last week is still being benchmarked against conventional LLMs, including a widely-shared run over 770 advice-forum posts, and an OpenAI-compatible interface has appeared. Interest is holding without a new result behind it.","heat":44,"delta":"cooling","sources":4,"url":"https://news.ycombinator.com/","glance":"Decision models still under test","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Interesting, not yet demonstrated","basis":"Community benchmarks and a third-party interface; no paper"}},{"t":"Mercury 2.5 pushes serving speed to 770 tokens per second","s":"A new Mercury release claims 770 tokens per second in serving, which matters for agent loops where latency, not quality, is the constraint. Single-vendor numbers so far without independent measurement.","heat":40,"delta":"new","sources":3,"url":"https://news.ycombinator.com/","glance":"Serving speed jumps for agent loops","assess":{"mag":3,"timeline":"now","evidence":"early","verdict":"Fast, but vendor-reported","basis":"Vendor benchmark claim; no third-party replication yet"}}]},"aitrendsUpdated":"2026-09-24T02:07:40Z","science":{"updated":"2026-09-24T02:02:39Z","items":[{"t":"An AI-designed immune protein turns brief KRAS drug responses into lasting pancreatic remissions","s":"In Cell, researchers paired a KRAS inhibitor with an AI-designed IL-21 mimetic and converted the short-lived responses typical of pancreatic cancer into durable remissions in mice, working through CD4 T cells rather than the usual CD8 route and without needing tumour MHC class I. The practical use is a combination regimen for the hardest common solid tumour; this is peer-reviewed but still animal work.","tag":"Health","imp":"critical","glance":"AI-designed protein deepens pancreatic cancer response","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)01018-4","published":"2026-09-23T00:00:00Z","src":"Cell","assess":{"mag":5,"timeline":"3-5 yrs","evidence":"strong","verdict":"Durable remissions where none lasted","basis":"Peer-reviewed Cell study; mouse models, CD4-dependent mechanism"},"eli":"Pancreatic tumours normally shrug off the best available drug after a few weeks. Adding a designer immune-signalling protein kept the immune system engaged, so the tumours stayed down instead of coming back."},{"t":"A stable passivator makes large perovskite solar modules both efficient and durable","s":"Nature reports that replacing patchy passivator layers with chemically stable lead carboxylate treatments produced large perovskite modules that were efficient, reliable and came off the line at higher yield than commercial-scale comparators. Uneven passivation has been the main thing keeping perovskite out of real manufacturing, so this is a direct route to factory-scale perovskite panels. Peer-reviewed, module-scale.","tag":"Energy","imp":"important","glance":"Perovskite panels finally survive at full size","url":"https://www.nature.com/articles/d41586-026-02937-z","published":"2026-09-23T00:00:00Z","src":"Nature","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Perovskite scale-up problem addressed","basis":"Nature paper; large-module efficiency plus yield data, not lab cells"},"eli":"Perovskite solar cells are cheap and efficient but fall apart at full panel size. A more stable protective coating fixed the weak spot, so full-size panels held up."},{"t":"A quadruped robot ran a full marathon on one battery charge","s":"RAIBO2, described in Nature, completed a 42-km marathon in 4 h 19 min on a single charge with a cost of transport of 0.25 — below the human benchmark of 0.37. Endurance, not agility, is what has kept legged robots off real inspection, delivery and agricultural routes, so a machine that can walk a working day without a charger changes what they can be deployed for.","tag":"Robotics","imp":"important","glance":"Legged robot beats human walking efficiency","url":"https://www.nature.com/articles/s41586-026-11102-5","published":"2026-09-23T00:00:00Z","src":"Nature","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"proven","verdict":"Legged robots get a working day","basis":"Nature paper; completed 42 km, measured cost of transport 0.25"},"eli":"Walking robots usually run flat in under an hour. This one walked a marathon on one charge, using less energy per step than a person does."},{"t":"A new antibody-drug conjugate gives relapsed small-cell lung cancer a second-line option","s":"Phase 3 data in Nature Medicine support tambotatug pelitecan as a second-line treatment for relapsed small-cell lung cancer, a group with almost nothing available after first-line therapy fails. This is registrational-grade human evidence, not a preclinical signal, which is why it matters for a cancer whose second-line standard has barely moved in decades.","tag":"Health","imp":"important","glance":"New second-line drug for small-cell lung cancer","url":"https://www.nature.com/articles/d41591-026-00047-x","published":"2026-09-23T00:00:00Z","src":"Nature Medicine","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"proven","verdict":"Real option where there was none","basis":"Phase 3 trial data reported in Nature Medicine"},"eli":"When small-cell lung cancer comes back, doctors have almost nothing left to try. A large trial says this new targeted drug works as that next step."},{"t":"Carbon dioxide turned into strong plastics that can be unmade again","s":"Colorado State chemists report a catalytic route that couples CO2 directly with strained bicyclic monomers to build high-molecular-weight polyesters containing up to 50 mol% carbon dioxide. The materials span rigid and flexible grades, are thermally and hydrolytically stable, and several can be chemically depolymerised back to their starting materials. Use-case: a closed-loop feedstock for durable plastics that does not start from fossil carbon - though scale, energy cost and CO2 sourcing still decide whether it is a climate win.","tag":"Chemistry","imp":"important","glance":"CO2 becomes recyclable plastic","url":"https://www.thebrighterside.news/post/scientists-turn-carbon-dioxide-into-fully-recyclable-high-performance-plastics/","published":"2026-09-22T20:07:00Z","src":"Colorado State University (Nature)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Closed-loop plastics from waste CO2","basis":"Peer-reviewed lab chemistry; no pilot-scale manufacturing yet"}},{"t":"The biggest trial of a multi-cancer blood test reports its first results","s":"The NHS-Galleri randomised trial of 142,000 people aged 50-77, plus the interventional PATHFINDER 2 study, published together in Nature Medicine and the New England Journal of Medicine. Adding the Galleri blood test to usual screening found more stage 1-2 cancers and fewer stage 4 cancers, but the trial did not clear its headline target, and an FDA advisory committee is weighing approval this week. Use-case: one blood draw that flags a shared cancer signal across more than 50 tumour types, alongside existing screening.","tag":"Health","imp":"critical","glance":"Cancer blood test's first big readout","url":"https://www.nature.com/articles/s41591-026-04652-8","published":"2026-09-22T14:00:00Z","src":"Nature Medicine / NEJM (NHS-Galleri, PATHFINDER 2)","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Biggest cancer-screening readout yet","basis":"142,000-person randomised trial + interventional study, peer-reviewed"},"eli":"A blood test looks for tiny fragments shed by tumours. The biggest test of the idea so far found more early cancers and fewer very late ones, but not enough to declare the question settled."},{"t":"AI reading ordinary CT scans picks up esophageal cancer at population scale","s":"A large Nature Medicine study describes EAGLE, a tool that reads routine non-contrast CT scans - the kind already taken for other reasons - and flags likely esophageal malignancy, making opportunistic screening possible without a dedicated test. Use-case: turning scans hospitals already hold into a screening programme for a cancer usually caught far too late.","tag":"Health","imp":"important","glance":"CT scans screened by AI for cancer","url":"https://www.nature.com/articles/s41591-026-04656-4","published":"2026-09-22T13:00:00Z","src":"Nature Medicine","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Free screening from scans already taken","basis":"Large-scale peer-reviewed study in Nature Medicine"}},{"t":"An electrochemical cell pulls CO2 from air using ordinary battery chemistry","s":"A Nature Energy paper describes a nickel-hydroxide symmetric battery cell driving hydroxide-exchange-membrane direct air capture, addressing the short lifetimes and tiny device sizes that have limited electrochemical capture so far. Use-case: direct air capture that runs on cheap, well-understood battery materials instead of heat-driven chemical loops.","tag":"Energy","imp":"important","glance":"Battery-style direct air capture","url":"https://www.nature.com/articles/s41560-026-02129-z","published":"2026-09-22T13:00:00Z","src":"Nature Energy","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Cheap chemistry for air capture","basis":"Peer-reviewed cell demonstration; durability shown, scale not"}},{"t":"Menopause leaves a blood-protein signature that tracks later dementia risk","s":"Proteomic data from nearly 15,000 women across several cohorts show hormone-linked molecular changes at menopause that map onto measures of brain ageing and dementia risk. This is an observational association, not a demonstrated cause. Use-case: a blood panel that could identify women who would benefit most from early risk-reduction, and a target set for testing whether treatment changes the trajectory.","tag":"Health","imp":"important","glance":"Blood markers link menopause, brain ageing","url":"https://www.nature.com/articles/s41591-026-04648-4","published":"2026-09-22T13:00:00Z","src":"Nature Medicine","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Risk signal, not yet a treatment","basis":"~15,000-woman multi-cohort proteomics, peer-reviewed"}}]},"scienceUpdated":"2026-09-24T02:07:40Z","scienceDaily":{"updated":"2026-09-24T02:02:39Z","items":[{"t":"An experimental drug strips away several of the defences that make tumours drug-resistant","s":"CS18 disabled multiple resistance mechanisms at once, restoring sensitivity in resistant lung cancer cells and slowing tumour growth in animal models. Drug resistance, not the first response, is what limits most targeted cancer therapy, so a resistance-breaker used alongside existing drugs is the concrete use here. Animal and cell work so far, not yet in patients.","tag":"Health","imp":"important","glance":"Drug restores lost cancer-treatment sensitivity","url":"https://www.sciencedaily.com/releases/2026/09/260921081112.htm","published":"2026-09-22T08:11:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Resistance broken in animal models","basis":"Preclinical: resistant lung cancer lines plus animal tumour models"},"eli":"Tumours learn to shrug off drugs. This compound knocks out several of those escape routes at once, so the original drug starts working again."},{"t":"A concrete mix with zeolite and bamboo biochar is stronger and absorbs CO2","s":"A formulation combining zeolite with bamboo biochar raised compressive strength about 7.5% and tensile strength 15% over conventional concrete while absorbing roughly 1.2 g of CO2 per day in lab testing. Cement is one of the largest industrial emitters, so a mix that is simultaneously stronger and carbon-absorbing is directly usable in construction — though the results are laboratory-scale, not field trials.","tag":"Materials","imp":"important","glance":"Stronger concrete that soaks up CO2","url":"https://www.sciencedaily.com/releases/2026/09/260921081105.htm","published":"2026-09-22T08:11:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Stronger cement that absorbs carbon","basis":"Lab formulation; +7.5% compressive, +15% tensile, 1.2 g CO2/day"},"eli":"Cement-making pours out CO2. Adding two cheap mineral and charcoal ingredients made the concrete both tougher and able to pull some carbon back out of the air."},{"t":"A keyhole procedure is emerging as a middle option before knee replacement","s":"Genicular artery embolization blocks the tiny inflamed vessels feeding an arthritic knee, and reporting from the University of Colorado Anschutz finds it can sharply cut osteoarthritis pain - some patients report little or none - with benefit lasting two to four years in responders. Use-case: a day-procedure option for people whose painkillers and physiotherapy have stopped working but who are not ready for joint replacement.","tag":"Health","imp":"important","glance":"Keyhole fix delays knee replacement","url":"https://www.sciencedaily.com/releases/2026/09/260922052030.htm","published":"2026-09-22T09:20:00Z","src":"University of Colorado Anschutz / ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Real alternative for arthritic knees","basis":"Clinical series with two-to-four-year follow-up in responders"}},{"t":"Physicists watch sound make a quantum jump for the first time","s":"Stanford researchers recorded single phonons - individual quanta of sound in a mechanical resonator - abruptly switching energy states in real time, the acoustic counterpart of quantum jumps long seen in light and matter. Use-case: mechanical resonators are a leading route to quantum memory and error correction, and the same read-out enables extremely sensitive mass and force sensors.","tag":"Physics & Space","imp":"important","glance":"Single phonons caught jumping","url":"https://www.sciencedaily.com/releases/2026/09/260921081054.htm","published":"2026-09-22T09:10:00Z","src":"Stanford University / ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"proven","verdict":"Sound joins the quantum toolkit","basis":"Direct real-time measurement, peer-reviewed"},"eli":"Sound comes in smallest-possible packets, just like light. Nobody had ever watched one of those packets vanish from a rung of the energy ladder as it happened. Now they have."},{"t":"MIT's insect-sized flying robot gets 450% faster with a learned controller","s":"A new AI control policy lets MIT's flapping-wing microrobot fly with insect-like agility - roughly 450% faster than before, and ten somersaults in eleven seconds. Use-case: search inside earthquake rubble and other confined spaces that conventional drones cannot enter, and pollination-style tasks needing precise low-speed control.","tag":"Engineering","imp":"important","glance":"Robot insect flies far faster","url":"https://www.sciencedaily.com/releases/2026/09/260921081114.htm","published":"2026-09-22T08:40:00Z","src":"MIT / ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"proven","verdict":"Agility unlocks real missions","basis":"Demonstrated flight performance, peer-reviewed lab result"}}]},"scienceDailyUpdated":"2026-09-24T02:07:40Z","life":{"updated":"2026-09-24T02:07:40Z","items":[]},"lifeUpdated":"2026-09-24T02:07:40Z","mind":{"updated":"2026-09-24T02:02:39Z","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"Stem cell transplants regrew stroke-damaged brain tissue and restored movement in mice","s":"Transplanted stem cells produced new neurons in stroke-damaged cortex and recovered lost motor function in mice, while also improving blood vessel density, inflammation and blood-brain barrier integrity. Post-stroke repair rather than acute rescue is the target here; the work is peer-reviewed but entirely preclinical.","url":"https://www.sciencedaily.com/releases/2026/09/260921081116.htm","published":"2026-09-22T08:11:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Damaged cortex regrown, movement returned","basis":"Mouse stroke model; new neurons, restored motor function"},"eli":"After a stroke, dead brain tissue normally stays dead. Injected stem cells grew into working neurons and the mice got their movement back."},{"t":"A single brain circuit drives aversion-resistant binge eating in mice","s":"Writing in Neuron, Chen and colleagues trace compulsive binge eating to GABAergic neurons of the anterior zona incerta projecting to the ventral tegmental area. Intermittent high-fat feeding makes these neurons more excitable, amplifying mesolimbic dopamine signalling, and the Nrsn2-marked population proves necessary for the disorder to develop. Mouse model, so this is a target rather than a treatment.","url":"https://www.cell.com/neuron/fulltext/S0896-6273(26)00644-6","published":"2026-09-22T13:00:00Z","src":"Neuron (Cell Press)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Named circuit for compulsive eating","basis":"Peer-reviewed Neuron study; mouse model, not human data"}},{"t":"Brain imaging ties long COVID fatigue and brain fog to dopamine neuron damage","s":"A CAMH-led PET imaging study published in eBioMedicine reports the strongest evidence yet that long COVID is associated with injury to dopamine-releasing neurons, which would explain the loss of motivation, slowed movement and memory trouble that define the condition. Long COVID affects roughly 5% of the world's population and has no evidence-based treatment; the dopamine system is now a concrete target to test.","url":"https://www.sciencedaily.com/releases/2026/09/260920222412.htm","published":"2026-09-21T22:24:00Z","src":"CAMH, eBioMedicine","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"A mechanism worth treating","basis":"Peer-reviewed human PET imaging study in eBioMedicine"},"eli":"Scans suggest the brain cells that supply motivation chemistry are damaged after COVID, which fits the exhaustion and fog people describe."},{"t":"The human brain appears to be two ancient nervous systems fused together","s":"Stanford Medicine researchers found the brain does not develop from a single progenitor population as textbooks hold, but from two distinct cellular systems of separate evolutionary origin - one building the brainstem circuits that run breathing and heartbeat, the other the regions behind language and reasoning. The same work let the team grow human hindbrain neurons in culture, which is what makes it useful: ALS and spinal muscular atrophy attack exactly those cells, and there has been no good human model for them.","url":"https://www.sciencedaily.com/releases/2026/09/260920222352.htm","published":"2026-09-21T06:00:00Z","src":"Stanford Medicine / ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Rewrites how the brain is built","basis":"Peer-reviewed developmental study plus a working hindbrain culture"}}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"A Neuralink implant gave a man with ALS his voice back through thought-to-speech","s":"In Neuralink's VOICE trial, a participant with ALS produced spoken words directly from decoded neural activity rather than by spelling with a cursor. Thought-to-speech at conversational intent is the capability that separates a communication aid from a usable voice, and this is a human clinical result, though from a single-participant early-feasibility trial.","url":"https://www.mobihealthnews.com/news/neuralink-brain-implant-helps-man-als-speak-using-his-thoughts","published":"2026-09-23T20:00:00Z","src":"MobiHealthNews","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Speech decoded straight from intent","basis":"Neuralink VOICE trial; single participant, early feasibility"},"eli":"ALS took away this man's ability to speak. A chip reading his brain turned what he intended to say straight into spoken words."}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"Loneliness and thinness pressure explain much of the teen mental-health gap","s":"A Nature Human Behaviour analysis of more than 3,000 adolescents tested pathways that young people themselves helped choose, and found loneliness and a desire for thinness account for a large share of why depressive symptoms are more common among girls than boys. The design is observational, but it points prevention work at two specific, addressable pressures rather than at gender in the abstract.","url":"https://www.nature.com/articles/s41562-026-02577-3","published":"2026-09-22T13:00:00Z","src":"Nature Human Behaviour","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Two pressures, not one gap","basis":"Peer-reviewed analysis of 3,000+ adolescents with participant-informed design"}}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Nothing new today in this area","s":"No Major or Historic peer-reviewed result surfaced in this group after a full scan of the configured feeds and a targeted web sweep.","url":"","published":"","src":"","assess":{"mag":4,"timeline":"unclear","evidence":"early","verdict":"No qualifying research today","basis":"Full mind_feeds scan plus BCI/consciousness sweep returned nothing"}}]}]},"mindUpdated":"2026-09-24T02:07:40Z","mindset":{"updated":"2026-09-24T02:06:46Z","messages":[{"who":"Joseph Rodrigues","t":"Give me 33 minutes and I'll delete your money blocks forever","vid":"9coWEHVbs2U","url":"https://www.youtube.com/watch?v=9coWEHVbs2U","gist":"Rodrigues tells the story of a warehouse colleague in 2008 who was an unremarkable employee but an extraordinary communicator, and who quietly earned far more from the relationships he'd built than from the job. The lesson he took from the network-marketing rooms that followed was deliberately unglamorous: everyone complains they have no leads while holding a phone full of contacts. Five conversations a day, with no pressure attached — if they book, fine; if they don't, fine — because every outcome is optimisation data you take back to your books and training. His wider point is that prospecting and content are the same skill at different scales: people who find direct conversation 'forced' produce marketing that doesn't connect either, because they never learned to connect. Results come from working the few high-impact areas repeatedly, ideally from a state of flow rather than resistance."},{"who":"Elmer O. Locker Jr","t":"It's not an accident you're seeing this video","vid":"8u-1KTMqDaQ","url":"https://www.youtube.com/watch?v=8u-1KTMqDaQ","gist":"A short reminder that the moment you are in is not random and not a detour. Locker's framing is that the timing of what reaches you — a message, an opportunity, a person — is part of the same unfolding as everything you have been working toward, and that the appropriate response to a delay is not to force a different outcome but to stay open to the one already arriving. The practical instruction underneath the encouragement is to stop treating the present stretch as wasted time, because the preparation happening in it is what makes the next chapter usable when it comes."},{"who":"AH Universe","t":"Do this and take back your power","vid":"Hv5zp6pSAjg","url":"https://www.youtube.com/watch?v=Hv5zp6pSAjg","gist":"A woman describes losing momentum whenever a creative partner — who won't act unless the astrology is favourable — blocks a shared opportunity, and how that sends her straight to 'what's the point'. The response reframes it: nobody is throwing blocks at you, and the real attraction of co-creation is that it hands you a scapegoat for your own contradictory energy. The practical part is a method for negative feeling itself. Don't lie there trying to move a troubling thought to a less troubling place — you won't. Instead treat discomfort the way you'd treat being too hot in bed: kick it off by doing something else. Get water, brush your teeth, walk, clean a drawer, feed the dog. Never stay in a vibration that doesn't feel good. And underneath it: there is no path you're supposed to be on that you aren't already on, and nothing left undone that you should be doing."}]},"mindsetUpdated":"2026-09-24T02:07:40Z","youtube":{"count":8,"note":"Today's uploads from the subscribed channels, gisted from their actual transcripts. 268 of 274 non-excluded channels were scanned; 8 of 16 fresh candidates could not be transcribed from this runner and were dropped rather than shown without a takeaway.","groups":[{"h":"🤖 AI & Technology","items":[{"vid":"p2i-fcx0G0M","id":"p2i-fcx0G0M","t":"AI labs may be hiding their biggest breakthroughs","s":"Wes Roth walks through Scott Aaronson's blog post, which appears to corroborate rumours that an OpenAI model has solved several long-standing open problems in theoretical computer science — not P vs NP, but genuine unsolved results. His argument against the 'it just stole human work' rebuttal is falsifiable: if the model were only regurgitating, it would not keep producing novel solutions across unrelated problems.","glance":"If AI keeps solving unrelated open problems, 'it only copies training data' stops being a viable explanation — watch for repetition across domains, not any single result.","ch":"@WesRoth","src":"@WesRoth","url":"https://www.youtube.com/watch?v=p2i-fcx0G0M","published":"2026-09-23T00:06:46Z"},{"vid":"uRGHx-1CqBQ","id":"uRGHx-1CqBQ","t":"Building AI assistants that keep their memory on the device","s":"DeepLearning.AI's new short course builds a voice assistant whose memory never leaves the device: experiences become embeddings stored in a local Qdrant Edge vector store with metadata filters, so it can recall a voice note about an appointment or recognise an object you taught it from a few photos, entirely offline.","glance":"On-device vector memory lets an assistant remember, search and forget your data without any of it reaching a cloud service — and it runs on an ordinary Mac or PC.","ch":"@Deeplearningai","src":"@Deeplearningai","url":"https://www.youtube.com/watch?v=uRGHx-1CqBQ","published":"2026-09-23T14:06:46Z"},{"vid":"F680hrQtsnM","id":"F680hrQtsnM","t":"Keychron G3 ultralight mouse review","s":"A careful review of Keychron's G3: competitive sensor and on-the-fly DPI and polling changes at a low price, but the squared-off, untapered sides make it wide for medium hands and poor for a palm grip, the RGB can't be switched off on a wired connection, and battery life suffers at the highest performance settings.","glance":"The G3 is a genuine value pick for claw-grip users with larger hands; palm-grip or small-handed users should look at the tapered M3 instead.","ch":"@CameronDoughertyTech","src":"@CameronDoughertyTech","url":"https://www.youtube.com/watch?v=F680hrQtsnM","published":"2026-09-23T14:06:46Z"}]},{"h":"💼 Business & Money","items":[{"vid":"6t5yF8ansoQ","id":"6t5yF8ansoQ","t":"Bending Spoons' CEO on buying and reviving dead software companies","s":"Luca Ferrari explains how Bending Spoons went from zero to $1bn of revenue in ten years by acquiring neglected apps — Evernote, Meetup, AOL, now Eventbrite — and plugging each into one shared technology and design platform rather than running them as separate assets.","glance":"The moat is the shared platform: because private equity must keep acquisitions separable for resale, it structurally cannot build the common technology layer that makes each revived app profitable.","ch":"@allin","src":"@allin","url":"https://www.youtube.com/watch?v=6t5yF8ansoQ","published":"2026-09-24T00:06:46Z","points":[{"t":"Consolidation beats invention","s":"Twenty neglected apps fixed with one playbook produced a billion in revenue faster than launching new products would have."},{"t":"The platform is the advantage","s":"One shared technology and design foundation is plugged into each acquisition — which is precisely what a private-equity structure cannot do."},{"t":"Why PE can't copy it","s":"A firm that intends to resell a company can neither embed proprietary technology in it nor attach a permanent engineering team, so it can never reach the same margin."},{"t":"Capital versus margin","s":"Ferrari concedes PE can raise far more capital with its hands-off model; the trade is that it never gets the profitability."}],"pointsLabel":"Takeaways from the interview"}]},{"h":"🔬 Science & Ideas","items":[{"vid":"Ui9C6N4HFvY","id":"Ui9C6N4HFvY","t":"Two philosophers of physics debate the fine-tuning argument","s":"Dan Linford (Purdue) and Miles Donahue (Oxford) argue the fine-tuning case for God. Linford distinguishes two senses of probability to block the inference; Donahue's reply is that while the individual fine-tuning probabilities don't strictly multiply, each additional constant a naturalistic theory must set — entropy, the uniformity Q, the cosmological constant, the Higgs VEV — drives the epistemic probability down further.","glance":"The strongest version of fine-tuning isn't about any single constant: it's that a naturalistic theory has to independently fix several unrelated ones, and those improbabilities compound.","ch":"@PhilHalper1","src":"@PhilHalper1","url":"https://www.youtube.com/watch?v=Ui9C6N4HFvY","published":"2026-09-23T17:06:46Z","points":[{"t":"Two senses of probability","s":"Linford's skeptical move is to separate physical chance from epistemic credence — the fine-tuning argument only works if you conflate them."},{"t":"Why the numbers compound","s":"Donahue concedes the probabilities don't strictly multiply, but argues each extra constant a theory must independently set lowers the overall epistemic probability."},{"t":"Where it was left","s":"Both agreed the naturalist can in principle set those values; the dispute is whether the resulting number is small enough to matter."}],"pointsLabel":"Points from the debate"}]},{"h":"🏡 Practical & Home","items":[{"vid":"_fin6BuM8Wk","id":"_fin6BuM8Wk","t":"A Santa Clara Pueblo family built a dozen mud-and-clay houses over 35 years","s":"Kirsten Dirksen visits a New Mexico family who have built roughly a dozen structures on their own land over 35 years — straw bale, adobe and clay — with grown sons now putting up their own houses beside their parents'. The oldest straw-bale building still stands despite breaking a rule they now teach: never run plaster all the way to the ground.","glance":"Build in stages on your own land and let each structure teach the next — and keep plaster clear of the ground line, the single mistake their 35-year-old first building still shows.","ch":"@kirstendirksen","src":"@kirstendirksen","url":"https://www.youtube.com/watch?v=_fin6BuM8Wk","published":"2026-09-23T21:06:46Z","points":[{"t":"Never plaster to the ground","s":"Their first straw-bale building took mud plaster all the way down — the error they now warn everyone about, though the structure survived anyway."},{"t":"Build incrementally, not all at once","s":"A dozen small structures added over 35 years let them experiment cheaply; each mistake stayed contained to one small building."},{"t":"Separate cottages for grown children","s":"Teenage sons got their own small structures at 15, and as adults built full houses on the same land — a multi-generation layout that needs land planned for it early."},{"t":"Skills die in one generation","s":"The children learned by being in the mud from babyhood; the family's point is that a building tradition is lost the moment one generation doesn't grow up inside it."}],"pointsLabel":"Ideas to steal for a build"},{"vid":"H-VJOaJgoko","id":"H-VJOaJgoko","t":"Why the old Toyota Crown is the peak of Toyota durability","s":"The Car Care Nut walks through a Japanese-market Toyota Crown of the generation that still appears in the background of every video shot in Japan, explaining what made this era of Toyota engineering unusually durable — and the catch for anyone importing one: many parts must be ordered from Japan, taking two weeks to a month and a half, so a worn bearing takes the car off the road for six weeks.","glance":"The durability is real, but parts lead times of up to six weeks from Japan make an imported Crown a poor daily driver however well built it is.","ch":"@TheCarCareNut","src":"@TheCarCareNut","url":"https://www.youtube.com/watch?v=H-VJOaJgoko","published":"2026-09-23T16:06:46Z"}]},{"h":"🧠 Health & Focus","items":[{"vid":"5Oqx2nyvneE","id":"5Oqx2nyvneE","t":"Thirteen ADHD lessons from five years of sticking with one project","s":"After a lifetime of abandoned projects, the creator spent five years building one thing and distils what actually made the difference. The central claim is that willpower is the wrong lever: follow-through collapses when an ADHD brain loses interest, so the fix is 'external triggers' — structures outside your own head that keep returning you to the same goal until the effort compounds.","glance":"Trying harder doesn't fix ADHD follow-through — build external structures that bring you back to the goal on a schedule, so you don't need to feel motivated to start.","ch":"@adhdvision","src":"@adhdvision","url":"https://www.youtube.com/watch?v=5Oqx2nyvneE","published":"2026-09-23T16:06:46Z"}]}]},"elon":{"day":"2026-09-23","source":"@jcub2x daily recap","note":"Built from the @jcub2x recap 'Elon Musk posted 39 times on X today (09/23/26)', published about 2 hours before this run. Engagement counts are not in the recap, so likes and views are not shown; items are ordered most-notable-first.","items":[{"kind":"post","t":"On Tesla: announcing Grok inside Tesla vehicles","s":"Musk said Grokbot is now in Tesla cars and 'can do meaningful work for you' — managing an inbox, clearing a calendar or working through files hands-free via connectors, with a demo of ordering from Amazon while the car drove to a cafe. Access is limited to heavy subscribers for now.","imp":"critical","iso":"2026-09-23T12:00:00Z"},{"kind":"repost","t":"Reposting Fitch's first investment-grade rating for Tesla","s":"Musk amplified news that Fitch gave Tesla its first BBB investment-grade credit rating, citing EV leadership, profitability, $43.5bn in cash and investments, and vertical integration as it expands into AI.","imp":"critical","iso":"2026-09-23T12:30:00Z"},{"kind":"post","t":"On Optimus, in a CCTV interview: robots and a 'universal high income'","s":"Asked about humanoid robots, Musk described a future where everyone has personal robots that care for elderly parents, watch children or tutor, and predicted one person running hundreds or thousands of robots. He said the result would be 'effectively a universal high income' and that it is not clear money will matter. A prediction, not a plan — treat it as such.","imp":"important","iso":"2026-09-23T13:00:00Z"},{"kind":"repost","t":"Reposting X's launch of 'X Numbers'","s":"Musk reposted the X Chat team announcing X Numbers, an optional handle that lets anyone message or call you on X without a mutual follow or accepted request.","imp":"important","iso":"2026-09-23T13:30:00Z"},{"kind":"reply","t":"Replying to Anthropic's Claude Opus 5.5 launch: 'Congrats'","s":"Responding to Anthropic introducing Claude Opus 5.5 — performing near Fable 5.1 on most tasks at about 40% lower cost than Opus 5 — Musk simply replied 'Congrats'. He separately called benchmark results for the model 'great, as expected'.","imp":"important","iso":"2026-09-23T14:00:00Z"},{"kind":"post","t":"On Grok 4.7: 'doing real engineering work at Tesla'","s":"Musk said Grok 4.7 with xAI's build harness is 'a strong daily workhorse' and is doing real engineering work at Tesla, pointing to a Tesla engineer's account of shipping full-self-driving and Cybercab features with overnight agents. He also noted Grok 4.7 scored 94% against rivals' 97% while being two to seven times cheaper.","imp":"important","iso":"2026-09-23T14:30:00Z"},{"kind":"reply","t":"Replying to a Mars terraforming microbe: 'maybe sooner'","s":"Pioneer Labs announced what it calls the first organism designed for Mars — a microbe engineered to draw nutrients from Martian dirt, water and air to make building materials, water, oxygen and return fuel. To a comment that terraforming would be a quest 'starting in the 2030s', Musk replied 'maybe sooner'. The claim is a company announcement, not peer-reviewed work.","imp":"important","iso":"2026-09-23T15:00:00Z"},{"kind":"reply","t":"Replying to a prediction that AI will absorb every science: 'your prediction was conservative'","s":"To François Chollet's 2021 prediction that nearly every branch of science would become a branch of computer science within 10-20 years, Musk said the forecast was conservative and that AI will 'beat all fields by the end of next year or maybe 2028 at the latest'.","imp":"important","iso":"2026-09-23T15:30:00Z"},{"kind":"repost","t":"Reposting Starlink's zero-yen entry offer in Japan","s":"Musk amplified Starlink Japan's announcement that the home rental mini kit now starts at ¥0 upfront in some areas, with local-language support before and after signup.","imp":"interesting","iso":"2026-09-23T16:00:00Z"},{"kind":"repost","t":"Reposting Ark's speculative $10 trillion Starship math","s":"Musk called 'interesting' an Ark Invest breakdown estimating up to ~$1bn of connectivity revenue per Starship launch, which at 10,000 flights a year would imply $10 trillion of annual recurring revenue. The analysis stacks several unproven assumptions on bandwidth, demand and launch cadence — it is a thought experiment, not a forecast.","imp":"interesting","iso":"2026-09-23T16:30:00Z"},{"kind":"repost","t":"Amplifying a satirical sketch about AI safety as regulatory capture","s":"Musk called 'a banger' a satirical sketch in which an incumbent, unable to beat a free open-source 'thinking machine', decides to have it outlawed on safety grounds by staging an incident. He also shared Andrew Ng's argument that recent AI fear is a well-orchestrated PR campaign and that the real change is cyber capability, not extinction risk. This is a contested framing of an active policy debate.","imp":"interesting","iso":"2026-09-23T17:00:00Z"}],"highlight":{"t":"Grok is now running inside Tesla cars and doing real tasks","s":"Musk announced that Grokbot has shipped into Tesla vehicles with connectors to email, calendar and shopping accounts, so a driver can place an order or clear an inbox by voice while the car drives itself. It is the first in-car assistant doing transactional work rather than search, and it landed the same day Fitch handed Tesla its first investment-grade credit rating.","href":"https://www.tesla.com/"}},"elonNews":[{"t":"Paramount weighs asking Musk to join the equity syndicate for its Warner Bros. bid","s":"David Ellison is reported to be considering Elon Musk as an equity investor in Paramount's roughly $81bn takeover of Warner Bros. Discovery — a structure that would place Musk inside the ownership group running CNN, which has unsettled staff there.","url":"https://news.google.com/rss/articles/CBMiZkFVX3lxTFBxT2tWd2dCNWZ2SmRnejdlc1pad0w5eWhGMEh1aHo2ZGZNcUZWVUVTVXBCY3RDdFBEYlNKdHZralpwS19zeEhqZVZNQjBIZlNxLUNkM0k0aWpjOElhRTZRa09QbE9lQQ?oc=5","published":"2026-09-23T23:15:00Z","src":"Deadline"},{"t":"Musk praises Xi and China's manufacturing ahead of the state visit","s":"Musk called Xi Jinping 'a great leader', praised Chinese AI models and described Tesla's Shanghai plant as 'a gem' while arguing for lower tariffs, days before attending the Xi-Trump dinner in Washington.","url":"https://news.google.com/rss/articles/CBMingFBVV95cUxNU2FFQjhfX1NQSm5zUkdwQnRvVFdsRmtaSTlsZ3pfaC03VF9TZEYtc1M1THczSlVvWENob2JPeEdvUUJGSW9xcFdhdUFYcl9FaXpUWDlzRjJDU1d2b0ZkeXBjNlVYTGlFRmh2amxqT25SMENUcmdmRlpIVWVTbTZDRmt2bHI0dEtPejRLMW5OVlNtTzJmYW9Wa1l2VUxldw?oc=5","published":"2026-09-23T13:24:00Z","src":"Benzinga"},{"t":"X launches X Numbers, a contact handle that replaces your phone number","s":"X began rolling out X Numbers, an optional identifier that lets anyone message or call you on the platform without a mutual follow or accepted request.","url":"https://news.google.com/rss/articles/CBMiwAFBVV95cUxPNTdfLVRxMTlHQ2VIYUMtd3Ntd1RwRldkdjFkc3pyYTM3Um1OaFluYWVNc3ZfOHlTNzJXemlBdWxja3h2S0tsUE1DcUptSzFhdVhVOTJxVzBFclRNVEhGWXo4U2ZLa3g2cWluVEZ6ZEdVbFhJWWFWdGp1T3NmNTNLTWczUWFTMUtVaEptUWdRTUdqa3ROdzIxVWhPZzh4bkV2akF5MEhHRzFGZHVIOWZqVFhlRkJYcDNqSldLajliNXU?oc=5","published":"2026-09-23T18:29:26Z","src":"CNET"},{"t":"Musk projects Starlink will carry most of global internet traffic within a decade","s":"Musk said the Starlink constellation will deliver the majority of the world's internet traffic within ten years as launch cadence and satellite capacity scale — a projection, with no independent capacity analysis attached.","u   if(has(/philosoph|stoic|existential|metaphysic|epistem|\bethics\b|meaning of life|nietzsche|nihilis|absurd|virtue|wisdom of|the good life/)) return "phil";
  if(S==="health"||has(/\bhealth\b|fitness|workout|\bdiet\b|nutrition|\bsleep\b|longevity|medical|hair loss|\bmuscle\b|disease|mental health|therapy|dopamine|fasting|cardio|protein/)) return "health";

      moreMenu.style.bottom="calc(84px + env(safe-area-inset-bottom))"; moreMenu.style.top="auto"; return; }
    const r=moreBtn.getBoundingClientRect();
    moreMenu.style.left="auto"; moreMenu.style.right=Math.max(10,window.innerWidth-r.right)+"px";
    moreMenu.style.top=(r.bottom+8)+"px"; moreMenu.style.bottom="auto"; }
  moreBtn.addEventListener("click",e=>{ e.stopPropagation(); const willOpen=!moreMenu.classList.contains("open"); if(willOpen) positionMenu(); moreMenu.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(moreMenu.classList.contains("open")&&!moreBtn.contains(e.target)&&!moreMenu.contains(e.target)) moreMenu.classList.remove("open"); });
  window.addEventListener("resize",()=>{ if(moreMenu.classList.contains("open")) positionMenu(); });
}
function closeMore(){ if(moreMenu) moreMenu.classList.remove("open"); }
const TAB_META={news:["News",""],breakthroughs:["Breakthroughs","breakthroughs"],aitrends:["AI Trends","trends"],science:["Science","breakthroughs"],scidaily:["Science Daily","studies"],youtube:["YouTube","videos"],elon:["Elon","updates"],mind:["Mind","items"],som:["Star of Mysore","pages"]};
function slimCountFor(id){
  try{
    if(id==="breakthroughs"){var bn=0;bn+=((DATA.aitrends&&DATA.aitrends.items)||[]).filter(isMajor).length;bn+=((DATA.science&&DATA.science.items)||[]).filter(isMajor).length;bn+=((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).length;bn+=((DATA.life&&DATA.life.items)||[]).filter(isMajor).length;return bn;}
    if(id==="aitrends") return ((typeof DATA.aitrends==="object"&&DATA.aitrends&&DATA.aitrends.items)||[]).filter(isRealItem).length;
    if(id==="science") return ((DATA.science&&DATA.science.items)||[]).filter(isRealItem).length;
    if(id==="scidaily") return ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isRealItem).length;
    if(id==="youtube") return (DATA.youtube&&DATA.youtube.count)||0;
    if(id==="elon") return ((DATA.elon&&DATA.elon.items)||[]).length;
    if(id==="mind"){let n=0;((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=((g.items)||[]).filter(isMajor).length);n+=((DATA.mindset&&DATA.mindset.messages)||[]).length;return n;}
    if(id==="som") return ((window.__SOM&&window.__SOM.pages)||[]).length;
  }catch(e){}
  return 0;
}
function setSlimHeader(id){
  const meta=TAB_META[id]||[id,""]; const nm=document.getElementById("slimName"), ct=document.getElementById("slimCount");
  try{ const em=document.getElementById("slimEmoji"); if(em){ const tb=TABS.find(t=>t.id===id); em.textContent=tb?tb.icon:""; } }catch(e){}
  if(nm) nm.textContent=meta[0];
  if(ct){ const n=slimCountFor(id); ct.textContent=(n&&meta[1])?(n+" "+meta[1]):""; }
  try{ const dt=document.getElementById("slimDate"); if(dt) dt.textContent=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:""; }catch(e){}
}
function activate(id,opts){
  document.body.dataset.tt=id;
  setSlimHeader(id);
  TABS.forEach(t=>{ const el=document.getElementById("p-"+t.id); if(el) el.classList.toggle("active",t.id===id); });
  ensureRendered(id);
  try{ armReveals(document.getElementById("p-"+id)); }catch(e){}
  [...nav.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreMenu) [...moreMenu.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreBtn) moreBtn.classList.toggle("active",overflow.some(t=>t.id===id));
  store.set("tab",id);
  kbdIdx=-1; clearKbdCur(); applyFilter();
  if(!(opts&&opts.keepScroll)){ try{ window.scrollTo(0,0); }catch(e){} try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
}
// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});

// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;

// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");

  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);
