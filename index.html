<!doctype html><!--
  TEMPLATE for Rohit's Daily Dashboard  ·  "STUDIO" edition (NuPhy Kick75 product-page look
  + Glass light/dark). Three themes total — the pixel-keycap "Kick75" theme was removed 2026-07-11.
  The Cowork daily task ONLY replaces the three marked regions each morning:
    /*DATA_START*/ ... /*DATA_END*/       (the JSON data)
    /*THUMBS_START*/ ... /*THUMBS_END*/   (inline video thumbnails)
    /*SOM_START*/ ... /*SOM_END*/         (Star of Mysore page images)
  Everything else (tabs, CSS, render functions, freshness guard) is the template - edit freely,
  but KEEP those six markers intact. Current tab row: News · Breakthroughs · YouTube · Elon · Mind · SOM. Do NOT re-add Audio/Tools/Science/Science-Daily/AI-Trends/Watch/Following tabs.
  The placeholders here are just sample data so the page renders in a browser while you edit.

  STUDIO EDITION notes (data contract and localStorage keys are unchanged):
  - TWO themes only (2026-08-15; Studio and Glass removed at Rohit's request): ◍ Clean (default, pure white,
    document layout) and 🌙 Dark (its true-black counterpart). Any older stored value falls back to clean.
    Stored in dash_theme; DEFAULT is "studio" (any old stored "retro" value falls back to studio).
    The "t" key still cycles all three.
  - STUDIO theme = the NuPhy Kick75 product-page look: real sampled colours (#ededed grey,
    #e7c353 mustard, #cf3327 red, #68b3f8 sky, RGB gradient #5796d0→#af5092→#d54c8e→#de7954)
    and two real keyboard-free WebP crops (cloud band drifting on the masthead top, RGB waveform
    washing the hero); white cards + product shadows + black Archivo headlines + black CTA pills;
    glossy floating objects (#blob1-3 restyled); animated RGB accents (active-tab underglow, hero
    rail + sheen, bottom-edge glow via #skyGround). Retro is kept to two popping accents only:
    the cloud band and the pixel "all caught up" sign-off (Press Start 2P stays loaded for it).
  - The masthead TITLE was removed on purpose (no "Daily Dashboard" heading) — do not re-add it.
    The masthead is: Mysuru chip + date pill, grade pills, and the signal ring.
  - Renders the optional per-item fields when present: assess{mag,timeline,evidence,verdict,basis},
    kind, facts[], stage, stageDay, forYou (news), subject (youtube). Older data renders fine without them.
  - Save button and Mark-read buttons are intentionally ABSENT (per Rohit). Opening a story still
    silently marks it read (dash_read) and powers unread badges. "In brief" box exists on News ONLY.
  - If you redesign again, update the daily task's STRUCTURE LOCK section in the SAME edit.
-->
<html lang="en" data-theme="clean">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Dashboard</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#eef1f8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%232563eb'/%3E%3Cstop%20offset='1'%20stop-color='%235b46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='512'%20height='512'%20rx='110'%20fill='%23080b13'/%3E%3Ccircle%20cx='256'%20cy='230'%20r='120'%20fill='none'%20stroke='url(%23g)'%20stroke-width='34'/%3E%3Crect%20x='140'%20y='388'%20width='232'%20height='30'%20rx='15'%20fill='url(%23g)'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html{font-size:16px}
html,body{margin:0}
body{font:400 .95rem/1.55 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Hind Mysuru",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;position:relative;overflow-x:clip}
:root{color-scheme:light;--shadowc:rgba(30,40,90,.14);
  --bg:#eef1f8;--ink:#12151f;--ink2:#3c4155;--mut:#868da2;
  --glassA:rgba(255,255,255,.66);--glassB:rgba(255,255,255,.45);
  --topline:rgba(255,255,255,.85);--edge:rgba(255,255,255,.55);--edge2:rgba(30,40,90,.06);
  --grid:rgba(60,90,200,.10);
  --shadow:0 14px 34px rgba(30,40,90,.12),0 2px 8px rgba(30,40,90,.06);
  --crit:#ef4444;--impt:#f59e0b;--gold:#f2b705;--good:#22c55e}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#000000;--ink:#f5f5f7;--ink2:#d1d1d6;--mut:#8e8e93;
  --glassA:#1c1c1e;--glassB:#1c1c1e;
  --topline:rgba(255,255,255,.06);--edge:rgba(255,255,255,.12);--edge2:rgba(255,255,255,.10);
  --grid:rgba(255,255,255,.04);
  --shadow:0 1px 2px rgba(0,0,0,.6),0 12px 30px -14px rgba(0,0,0,.8)}
@media (prefers-color-scheme:dark){:root[data-theme="__never__"]{color-scheme:dark;
  --bg:#080b13;--ink:#eef0f8;--ink2:#c2c7d8;--mut:#7d8399;
  --glassA:rgba(24,29,46,.62);--glassB:rgba(24,29,46,.44);
  --topline:rgba(255,255,255,.2);--edge:rgba(255,255,255,.13);--edge2:rgba(255,255,255,.05);
  --grid:rgba(120,150,255,.10);
  --shadow:0 16px 40px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.32)}}
/* ===== per-tab themes (accent, hero gradient, glow trio) ===== */
body[data-tt="news"]{--ac:#2563eb;--ac2:#7c8cff;--hA:#2563eb;--hB:#5b46e5;--g1:rgba(37,99,235,.55);--g2:rgba(124,58,237,.38);--g3:rgba(56,189,248,.36)}
body[data-tt="aitrends"]{--ac:#06b6d4;--ac2:#a78bfa;--hA:#0891b2;--hB:#7c3aed;--g1:rgba(6,182,212,.55);--g2:rgba(139,92,246,.42);--g3:rgba(236,72,153,.3)}
body[data-tt="science"]{--ac:#0d9488;--ac2:#34d399;--hA:#0d9488;--hB:#059669;--g1:rgba(13,148,136,.55);--g2:rgba(52,211,153,.38);--g3:rgba(34,211,238,.32)}
body[data-tt="scidaily"]{--ac:#7c3aed;--ac2:#c084fc;--hA:#7c3aed;--hB:#c026d3;--g1:rgba(124,58,237,.55);--g2:rgba(192,38,211,.38);--g3:rgba(99,102,241,.32)}
body[data-tt="youtube"]{--ac:#e11d48;--ac2:#fb7185;--hA:#e11d48;--hB:#d946ef;--g1:rgba(225,29,72,.5);--g2:rgba(217,70,239,.36);--g3:rgba(251,146,60,.28)}
body[data-tt="elon"]{--ac:#9aa7c7;--ac2:#e2e8f0;--hA:#1e293b;--hB:#475569;--g1:rgba(148,163,184,.38);--g2:rgba(100,116,139,.32);--g3:rgba(226,232,240,.16)}
body[data-tt="mind"]{--ac:#c026d3;--ac2:#e879f9;--hA:#c026d3;--hB:#7c3aed;--g1:rgba(192,38,211,.5);--g2:rgba(124,58,237,.38);--g3:rgba(244,114,182,.32)}
body[data-tt="loa"]{--ac:#f59e0b;--ac2:#fbbf24;--hA:#f59e0b;--hB:#ea580c;--g1:rgba(245,158,11,.5);--g2:rgba(234,88,12,.36);--g3:rgba(251,113,133,.26)}
body[data-tt="som"]{--ac:#b45309;--ac2:#d6a354;--hA:#92400e;--hB:#b45309;--g1:rgba(180,83,9,.46);--g2:rgba(214,163,84,.36);--g3:rgba(120,53,15,.3)}
/* ===== aurora + grid ===== */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.4px);background-size:26px 26px;
  -webkit-mask:linear-gradient(#000 45%,transparent 90%);mask:linear-gradient(#000 45%,transparent 90%)}
.blob{position:fixed;border-radius:50%;filter:blur(78px);pointer-events:none;z-index:0;animation:drift 14s ease-in-out infinite;transition:background .5s ease}
@keyframes drift{50%{transform:translate(16px,12px) scale(1.06)}}
#blob1{width:420px;height:420px;top:-150px;right:-100px;background:radial-gradient(circle,var(--g1),transparent 70%)}
#blob2{width:340px;height:320px;top:70px;left:-140px;background:radial-gradient(circle,var(--g2),transparent 70%);animation-delay:-4s}
#blob3{width:280px;height:280px;top:460px;right:-80px;background:radial-gradient(circle,var(--g3),transparent 72%);animation-delay:-8s}
#skyGround{display:none}
/* ===== layout ===== */
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px 18px 64px}
a{color:inherit}
:where(a,button,input,summary):focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
button{font-family:inherit}
::selection{background:var(--ac);color:#fff}
/* ===== glass panels ===== */
.glass,.gcard{position:relative;border:1px solid transparent;border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 var(--topline)}
.glass{background:linear-gradient(var(--glassA),var(--glassA)) padding-box,linear-gradient(165deg,var(--edge) 0%,var(--edge2) 45%,color-mix(in srgb,var(--ac) 35%,transparent) 100%) border-box;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
.gcard{background:linear-gradient(var(--glassB),var(--glassB)) padding-box,linear-gradient(165deg,var(--edge) 0%,var(--edge2) 50%,color-mix(in srgb,var(--ac) 26%,transparent) 100%) border-box}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.glass{background:var(--glassA)}}
/* ===== pills ===== */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.02em;
  background:color-mix(in srgb,var(--pc,#868da2) 15%,transparent);color:var(--pc,#868da2);
  border:1px solid color-mix(in srgb,var(--pc,#868da2) 34%,transparent);
  box-shadow:0 0 16px color-mix(in srgb,var(--pc,#868da2) 24%,transparent),inset 0 1px 0 rgba(255,255,255,.16);white-space:nowrap}
button.pill{cursor:pointer;font-size:.68rem;font-weight:800}
button.pill:active{transform:scale(.96)}
@keyframes pulse{50%{box-shadow:0 0 28px color-mix(in srgb,var(--pc) 58%,transparent)}}
.pill.live{animation:pulse 1.7s ease-in-out infinite}
/* ===== slim per-tab header + FAB options ===== */
.slim-head{display:none;padding:6px 6px 2px;margin-bottom:10px}
body:not([data-tt="news"]) #mastFull{display:none}
body:not([data-tt="news"]) .slim-head{display:block}
.slim-title{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
#slimName{font-size:1.85rem;font-weight:850;letter-spacing:-.03em;background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.slim-count{font-size:.82rem;font-weight:800;letter-spacing:.02em;color:var(--mut)}
.fab-menu{position:fixed;top:14px;right:14px;z-index:55;width:40px;height:40px;border:none;border-radius:14px;cursor:pointer;font-size:1.3rem;line-height:1;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));box-shadow:0 5px 16px color-mix(in srgb,var(--ac) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.fab-menu:active{transform:scale(.94)}
.fab-sheet{position:fixed;top:60px;right:14px;z-index:56;display:none;flex-direction:column;gap:3px;padding:8px;min-width:200px;border-radius:20px}
.fab-sheet.open{display:flex}
.fab-item{display:flex;align-items:center;gap:8px;border:none;background:none;color:var(--ink);font:700 .82rem/1 inherit;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left}
.fab-item:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.fab-row{display:flex;align-items:center;gap:7px;padding:8px 12px;border-top:1px solid var(--edge2);margin-top:3px}
.fab-lbl{flex:1;font-size:.72rem;font-weight:700;color:var(--mut)}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:2px 4px 6px}
.theme-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:12px;cursor:pointer;border:1px solid var(--edge2);background:color-mix(in srgb,var(--mut) 8%,transparent);color:var(--ink2);font:800 .58rem/1 inherit;letter-spacing:.03em;transition:transform .08s ease,box-shadow .08s ease}
.theme-opt .em{font-size:1.05rem;line-height:1}
.theme-opt:active{transform:translateY(1px)}
.theme-opt.on{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
/* ===== masthead ===== */
.mast{padding:16px 18px;margin-bottom:12px;display:flex;gap:15px;align-items:center;flex-wrap:wrap;position:sticky;top:8px;z-index:20;transform-origin:top center;transition:opacity .32s ease,transform .32s ease,filter .32s ease,margin .32s ease}
.mast.mast-hide{opacity:0;transform:translateY(-22px) scale(.965);filter:blur(6px);pointer-events:none;margin-bottom:-88px}
.ring{position:relative;flex:0 0 92px;width:92px;height:92px;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ac) 42%,transparent))}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rn{font-size:1.65rem;font-weight:850;letter-spacing:-.04em;line-height:1;background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ring .rl{font-size:.54rem;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.m-right{flex:1;min-width:210px}
.m-date{font-size:.68rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 9px}
.m-sub{display:flex;gap:6px;flex-wrap:wrap}
.m-tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.tool{border:1px solid var(--edge2);background:color-mix(in srgb,var(--mut) 8%,transparent);color:var(--mut);border-radius:12px;padding:5px 9px;cursor:pointer;font-size:.74rem;font-weight:700;line-height:1}
.tool:hover{color:var(--ink)}
.update-all{border:none;border-radius:12px;padding:6px 13px;cursor:pointer;font-size:.74rem;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.update-all:disabled{opacity:.55;cursor:default}
.update-status{color:var(--mut);font-size:.74rem;margin:2px 4px 8px}
.update-status:empty{display:none}
/* ===== tabs ===== */
nav.tabs{position:sticky;top:10px;z-index:30;display:flex;gap:4px;padding:5px;margin:0 0 14px;border-radius:999px}
.tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:none;background:none;padding:8px 4px;border-radius:999px;font-size:.64rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);cursor:pointer;position:relative;white-space:nowrap}
.tab .ico{display:none;font-size:1.05rem;line-height:1}
.tab.active{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 5px 18px color-mix(in srgb,var(--ac) 48%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.tab .ub{position:absolute;top:-2px;right:2px;background:var(--crit);color:#fff;font-size:.56rem;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab .ub:empty{display:none}
.more-menu{position:fixed;z-index:1000;padding:8px;display:none;flex-direction:column;gap:3px;min-width:180px;border-radius:20px}
.more-menu.open{display:flex}
.more-menu .tab{flex-direction:row;justify-content:flex-start;gap:9px;padding:11px 13px;font-size:.72rem;letter-spacing:.06em}
.more-menu .tab .ico{display:inline}
/* ===== sections / heroes / cards ===== */
.sec{font-size:.64rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:18px 6px 10px;display:flex;align-items:center;gap:8px}
/* ===== animated panel headings, section breakers & stickers (added 2026-07-11) ===== */
.phead{display:flex;align-items:center;gap:12px;margin:4px 4px 14px;flex-wrap:wrap}
.ph-badge{font-size:2rem;line-height:1;display:inline-block;transform-origin:50% 80%;animation:ph-pop .55s cubic-bezier(.34,1.56,.64,1) both,bob 3.2s ease-in-out 1s infinite}
.ph-ttl{font-size:1.95rem;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1;background:linear-gradient(100deg,var(--ac),var(--ac2,#8b5cf6));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ph-badge,.sp,.brk-emo,.sec-emo{will-change:transform}
.sp{display:inline-block;font-size:1.35rem;line-height:1}
.sp.spin{animation:spin 4.5s linear infinite}
.sp.float{animation:floaty 3s ease-in-out infinite}
.brk{display:flex;align-items:center;gap:14px;margin:24px 6px 4px}
.brk-line{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 45%,transparent),transparent)}
.brk-emo{font-size:1.75rem;line-height:1;display:inline-block;filter:drop-shadow(0 4px 7px rgba(0,0,0,.22))}
.brk-emo.bob{animation:bob 2.4s ease-in-out infinite}
.brk-emo.beat{animation:beat 1.6s ease-in-out infinite}
.brk-emo.spin{animation:spin 6s linear infinite}
.sec-emo{font-size:1.05rem;display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes ph-pop{0%{opacity:0;transform:scale(.4) rotate(-16deg)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1)}42%{transform:scale(1.14)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(9deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ph-badge,.sp,.brk-emo,.sec-emo{animation:none}}
.panel{display:none;animation:fade .22s ease}
.panel.active{display:block}
.reveal,.reveal.in{opacity:1!important;transform:none!important;transition:none!important}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.empty{color:var(--mut);font-size:.84rem;font-style:italic;margin:6px}
.hero{border-radius:24px;padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--hA) 20%,var(--glassA)),color-mix(in srgb,var(--hB) 12%,var(--glassA))) padding-box,
    linear-gradient(165deg,var(--edge),color-mix(in srgb,var(--hA) 42%,transparent)) border-box;
  border:1px solid transparent;backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 16px 40px color-mix(in srgb,var(--hA) 20%,var(--shadowc,rgba(0,0,0,.28))),inset 0 1px 0 var(--topline)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;top:-110px;right:-64px;background:radial-gradient(circle,color-mix(in srgb,var(--hA) 26%,transparent),transparent 70%);pointer-events:none}
.hero .pill{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac2);border-color:color-mix(in srgb,var(--ac) 34%,transparent)}
.hero .st-t,.hero .st-t a{color:var(--ink)}
.hero .st-s{color:var(--ink)}
.hero .why{margin-top:9px;padding:8px 12px;border-radius:13px;font-size:.78rem;font-weight:600;color:var(--ink2);background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px solid color-mix(in srgb,var(--ac) 26%,transparent)}
.hero .meta{color:var(--mut)}
.hero .heat{background:color-mix(in srgb,var(--mut) 16%,transparent)}
.hero .heat i{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.hero .trank{opacity:1}
.story{padding:14px 16px;margin-bottom:11px;display:flex;gap:12px}
.tile{flex:0 0 42px;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.08rem;
  background:linear-gradient(135deg,color-mix(in srgb,var(--kc,var(--ac)) 30%,transparent),color-mix(in srgb,var(--kc,var(--ac)) 9%,transparent));
  border:1px solid color-mix(in srgb,var(--kc,var(--ac)) 40%,transparent);
  box-shadow:0 5px 16px color-mix(in srgb,var(--kc,var(--ac)) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.sbody{flex:1;min-width:0}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.st-t{font-size:.98rem;font-weight:800;letter-spacing:-.01em;margin:0 0 3px;line-height:1.4}
.st-t a{text-decoration:none}
.st-t a:hover{text-decoration:underline;text-decoration-color:var(--ac);text-underline-offset:3px}
.st-s{color:var(--ink);font-size:.85rem;margin:0}

.mag i::before{left:3px}.mag i::after{right:3px}

/* ===== LEGO brick drop-in animation (added 2026-07-11) ===== */
@keyframes lego-drop{0%{opacity:0;transform:translateY(-10px) scale(.7)}55%{opacity:1;transform:translateY(2px) scale(1.05)}75%{transform:translateY(-1px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}

.mag i:nth-child(1){animation-delay:.03s}.mag i:nth-child(2){animation-delay:.11s}.mag i:nth-child(3){animation-delay:.19s}.mag i:nth-child(4){animation-delay:.27s}.mag i:nth-child(5){animation-delay:.35s}

.basis{font-size:.65rem;color:var(--mut);margin-top:5px}

.heat{position:relative;height:10px;border-radius:6px;background:color-mix(in srgb,var(--mut) 16%,transparent);overflow:hidden;margin-top:9px}

.heat i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:shine 2.4s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.hero .heat{background:rgba(255,255,255,.22)}

.hero .heat i::after{background:linear-gradient(110deg,transparent 30%,rgba(6,182,212,.5) 50%,transparent 70%)}
.d-new{--pc:#22c55e}.d-rising{--pc:#f97316}.d-steady{--pc:#94a3b8}.d-cooling{--pc:#3b82f6}
/* since yesterday (memory strip) */

.srow2{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--edge2);font-size:.82rem;line-height:1.5;align-items:flex-start}

.cat{margin-bottom:6px;overflow:hidden}

.ovl{position:fixed;inset:0;z-index:60;background:rgba(5,8,18,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;padding:16px}

kbd{font-size:.7rem;font-weight:800;background:color-mix(in srgb,var(--mut) 15%,transparent);border:1px solid var(--edge2);border-radius:6px;padding:1px 7px;color:var(--ink)}

.panel.dense .story,.panel.dense .crow,.panel.dense .trend,.panel.dense .hero,.panel.dense .gcard,.panel.dense .cat{break-inside:avoid;-webkit-column-break-inside:avoid}
.panel.dense .story:not(.xopen) .sbody>:not(.st-t),
.panel.dense .trend:not(.xopen) .sbody>:not(.st-t),
.panel.dense .hero:not(.xopen)>:not(.st-t){display:none!important}
.panel.dense .story .tile{display:none}
.panel.dense .story:not(.xopen),.panel.dense .trend:not(.xopen),.panel.dense .hero:not(.xopen){cursor:pointer}
.panel.dense .story.xopen,.panel.dense .trend.xopen,.panel.dense .hero.xopen{column-span:all;-webkit-column-span:all;outline:1px solid color-mix(in srgb,var(--ac) 45%,transparent);max-width:860px;margin:4px 0 12px!important;padding:14px 16px!important}
.panel.dense .story.xopen .st-t,.panel.dense .trend.xopen .st-t{font-size:1.02rem!important;line-height:1.4}
.panel.dense .story.xopen .st-s,.panel.dense .story.xopen .cs,.panel.dense .trend.xopen .st-s{font-size:.92rem!important;line-height:1.6}
.panel.dense .story.xopen .tile{display:inline-flex}
.panel.dense .legend,.panel.dense .phead,.panel.dense .brk,.panel.dense .glance,.panel.dense .news-toolbar,.panel.dense .since{display:none!important}
.panel.dense .sec{margin:9px 4px 4px;column-span:all;-webkit-column-span:all}
.panel.dense .story,.panel.dense .gcard,.panel.dense .trend,.panel.dense .crow{padding:8px 11px!important;margin:0 0 8px!important}
.panel.dense .st-t{font-size:.84rem!important;line-height:1.34;font-weight:700}
.panel.dense .hero .st-t{font-size:.92rem!important}
.panel.dense .cat>summary{font-size:.82rem}
.panel.dense .trank{transform:scale(.82)}
.reader{position:fixed;inset:0;z-index:85;display:none;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.reader.open{display:block}
.reader .more{margin-top:14px}
.slim-date{display:block;flex-basis:100%;font-size:.72rem;font-weight:700;letter-spacing:.02em;color:var(--mut);margin-top:1px;text-transform:uppercase}
#p-news[data-fit="2"],#p-news[data-fit="3"],#p-news[data-fit="4"]{column-count:auto!important}
#p-news[data-fit="2"] #newsList{display:block}
#p-news[data-fit="3"] #newsList,#p-news[data-fit="4"] #newsList{display:grid;gap:0 12px;align-items:start;grid-template-columns:repeat(2,minmax(0,1fr))}
.panel.dense .hero:not(.xopen)::before,.panel.dense .hero:not(.xopen)::after{display:none!important;content:none!important}
.panel.dense .gcard:hover,.panel.dense .story:hover,.panel.dense .trend:hover,.panel.dense .hero:hover{transform:none!important}
.story.read.xopen,.story.read:hover,.story.read:focus-within,.nbrow.read:hover{opacity:1}
.crow.read.open .ct,.crow.read:hover .ct{opacity:1}
.panel.active[data-fit="2"]:not(#p-news){display:grid;grid-template-columns:1fr;gap:6px 10px;align-items:start}
.panel.active[data-fit="3"]:not(#p-news),
.panel.active[data-fit="4"]:not(#p-news){display:grid;gap:7px 10px;align-items:start;grid-auto-flow:row dense;grid-template-columns:repeat(2,minmax(0,1fr))}
.panel.active[data-fit="3"]:not(#p-news)>.sec,.panel.active[data-fit="4"]:not(#p-news)>.sec{display:none!important}
.panel.active[data-fit="2"]:not(#p-news) .story.xopen,.panel.active[data-fit="3"]:not(#p-news) .story.xopen,.panel.active[data-fit="4"]:not(#p-news) .story.xopen{grid-column:1/-1}
.panel.dense .story:not(.xopen) .sbody>.assess,
.panel.dense .trend:not(.xopen) .sbody>.assess,
.panel.dense .hero:not(.xopen)>.assess{display:block!important;margin-top:5px}
.panel.dense .story:not(.xopen) .assess .verdict,.panel.dense .story:not(.xopen) .assess .basis,
.panel.dense .trend:not(.xopen) .assess .verdict,.panel.dense .trend:not(.xopen) .assess .basis,
.panel.dense .hero:not(.xopen) .assess .verdict,.panel.dense .hero:not(.xopen) .assess .basis{display:none!important}
.panel.dense .assess .as-row{gap:6px}
.panel.dense .assess .as-lbl{font-size:.55rem}
.panel.dense .assess .as-tier{font-size:.62rem}
.panel.dense .assess .mag{transform:scale(.82);transform-origin:left center}
.panel.dense .story:not(.xopen) .sbody>.acts,
.panel.dense .trend:not(.xopen) .sbody>.acts,
.panel.dense .hero:not(.xopen)>.acts{display:flex!important;margin-top:6px;border-top:none;padding-top:2px;gap:6px}
.panel.dense .acts .mini{font-size:.6rem;padding:3px 9px}
.panel.dense .story:not(.xopen) .sbody>.ask-box,
.panel.dense .trend:not(.xopen) .sbody>.ask-box{display:none!important}
.slim-head::before{content:"";position:absolute;inset:-70% -25%;z-index:-1;background:conic-gradient(from 0deg,var(--ac),var(--ac2),#8b5cf6,var(--ac2),var(--ac));filter:blur(48px);opacity:.22;animation:slimspin 14s linear infinite}
.slim-head::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 8%,transparent),transparent 60%)}
.slim-emoji{font-size:2.5rem;line-height:1;flex:0 0 auto;display:inline-block;filter:drop-shadow(0 5px 11px rgba(0,0,0,.2));animation:bob 3s ease-in-out infinite}
.slim-emoji:empty{display:none}
.slim-count:empty{display:none}
.costbar{padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;gap:11px}
.costbar .cb-h{flex:0 0 auto;font-weight:850;font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
.cb-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cb-row::-webkit-scrollbar{display:none}
.cb-row .cx{flex:0 0 auto;display:inline-flex;align-items:baseline;gap:5px;padding:5px 10px;border-radius:11px;background:color-mix(in srgb,var(--mut) 12%,transparent);text-decoration:none;white-space:nowrap}
.cb-row .cx-l{font-size:.66rem;font-weight:750;color:var(--ink2)}
.cb-row .cx-v{font-size:.79rem;font-weight:850;color:var(--ink)}
.cb-row .cx-d{font-size:.63rem;font-weight:800}
.cb-row .cx-p{color:var(--mut);font-size:.58rem;vertical-align:super}
.crow .cx,.crow .cx .cs,.more .exp{overflow-wrap:anywhere;word-break:break-word;white-space:normal;min-width:0}
/* ---- READER base CSS restored 2026-08-15 (it was lost with the FIXES v2 block,
   which is why tapping a card did nothing — .open had no styling). ---- */
body.reader-lock{overflow:hidden}
.reader-inner{max-width:720px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 22px calc(56px + env(safe-area-inset-bottom))}
.reader-x{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:86;width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;font-size:1.1rem;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));box-shadow:0 5px 16px color-mix(in srgb,var(--ac) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.reader-x:active{transform:scale(.94)}
.reader-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.reader-chip{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:color-mix(in srgb,var(--pc,var(--ac)) 16%,transparent);color:var(--pc,var(--ac));border:1px solid color-mix(in srgb,var(--pc,var(--ac)) 34%,transparent)}
.reader-h1{font-size:1.6rem;line-height:1.28;font-weight:900;letter-spacing:-.01em;margin:2px 0 10px;color:var(--ink)}
.reader-meta{font-size:.76rem;font-weight:700;color:var(--mut);margin-bottom:16px}
.reader-glance{font-size:1.02rem;line-height:1.6;font-weight:700;color:var(--ink);margin:0 0 14px}
.reader-s{font-size:1.08rem;line-height:1.75;color:var(--ink);margin:0 0 18px}
.reader-why{font-size:.95rem;line-height:1.6;color:var(--ink);background:color-mix(in srgb,var(--ac) 9%,transparent);border-left:3px solid var(--ac);border-radius:10px;padding:11px 14px;margin:0 0 16px}
.reader-why b{display:block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:4px}
.reader-fy{font-size:.94rem;line-height:1.55;color:var(--ink);background:color-mix(in srgb,var(--gold,#e7c353) 16%,transparent);border-radius:10px;padding:10px 13px;margin:0 0 16px;font-weight:600}
.reader-pts{margin:4px 0 18px;border:1px solid var(--edge2);border-radius:16px;overflow:hidden}
.reader-pts-h{padding:10px 14px;font-size:.64rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.reader-pt{padding:11px 14px;border-top:1px solid var(--edge2);font-size:.95rem;line-height:1.55;color:var(--ink)}
.reader-pt b{display:block;font-weight:800;margin-bottom:2px;color:var(--ink)}
.reader-pt span{color:var(--ink)}
.reader-open{display:inline-block;margin-top:6px;padding:11px 20px;border-radius:14px;font-weight:800;font-size:.85rem;color:#fff;text-decoration:none;background:linear-gradient(120deg,var(--ac),var(--ac2));box-shadow:0 5px 16px color-mix(in srgb,var(--ac) 40%,transparent)}
.reader-ask{margin-top:22px;border-top:1px solid var(--edge2);padding-top:16px}
.reader-askrow{display:flex;gap:8px}
.reader-askrow input{flex:1;border:1px solid var(--edge2);background:color-mix(in srgb,var(--mut) 8%,transparent);border-radius:12px;padding:11px 13px;font:600 .92rem/1.4 inherit;color:var(--ink);outline:none}
.reader-askrow input:focus{border-color:var(--ac)}
.reader-askrow button{border:none;border-radius:12px;padding:0 20px;font-weight:800;font-size:.85rem;color:#fff;cursor:pointer;background:linear-gradient(120deg,var(--ac),var(--ac2))}
.reader-askrow button:active{transform:scale(.96)}
/* =========================================================================
   CLEAN (Apple-inspired) + its DARK counterpart — rebuilt 2026-08-15.
   DESIGN RULE: Clean is a DOCUMENT, not a dashboard. No cards, no shadows,
   no radii on content, no emoji, no per-tab colour. Rows are separated by a
   single hairline and whitespace. Greyscale only; the one accent is used for
   links and the active tab and nowhere else. Hierarchy = size/weight/value.
   Studio and Glass are untouched — do not merge these rules into them.
   ========================================================================= */
:root[data-theme="clean"]{color-scheme:light;
  --bg:#ffffff;--ink:#1d1d1f;--ink2:#4a4a4f;--mut:#8a8a8f;
  --glassA:#ffffff;--glassB:#ffffff;
  --topline:transparent;--edge:rgba(0,0,0,.09);--edge2:rgba(0,0,0,.07);--grid:transparent;
  --shadow:none;--line:rgba(0,0,0,.08);--sub:#f6f6f7;
  --crit:#6e6e73;--impt:#8a8a8f;--gold:#8a8a8f;--good:#6e6e73;
  --ac:#0071e3;--ac2:#0071e3;--hA:#0071e3;--hB:#0071e3;
  --rgbA:#1d1d1f;--rgbB:#1d1d1f;--rgbC:#1d1d1f;--rgbD:#1d1d1f}
:root[data-theme="dark"]{
  --line:rgba(255,255,255,.11);--sub:#161618;
  --crit:#98989d;--impt:#8a8a8f;--gold:#8a8a8f;--good:#98989d;
  --ac:#0a84ff;--ac2:#0a84ff;--hA:#0a84ff;--hB:#0a84ff;
  --rgbA:#f5f5f7;--rgbB:#f5f5f7;--rgbC:#f5f5f7;--rgbD:#f5f5f7}
:root[data-theme="clean"] body[data-tt]{--ac:#0071e3;--ac2:#0071e3;--hA:#0071e3;--hB:#0071e3}
:root[data-theme="dark"]  body[data-tt]{--ac:#0a84ff;--ac2:#0a84ff;--hA:#0a84ff;--hB:#0a84ff}

/* ---- canvas: flat, nothing floating ---- */
:root[data-theme="clean"] body{background:#fff}
:root[data-theme="dark"]  body{background:#000}
:root[data-theme="clean"] body::before,:root[data-theme="dark"] body::before{background:none!important;background-image:none!important;-webkit-mask:none;mask:none;opacity:0}
:root[data-theme="clean"] .blob,:root[data-theme="dark"] .blob,
:root[data-theme="clean"] #skyGround,:root[data-theme="dark"] #skyGround,
:root[data-theme="clean"] .brk,:root[data-theme="dark"] .brk,
:root[data-theme="clean"] .ring,:root[data-theme="dark"] .ring,
:root[data-theme="clean"] .tile,:root[data-theme="dark"] .tile,
:root[data-theme="clean"] .sec-emo,:root[data-theme="dark"] .sec-emo,
:root[data-theme="clean"] .slim-emoji,:root[data-theme="dark"] .slim-emoji,
:root[data-theme="clean"] .bigflag,:root[data-theme="dark"] .bigflag,
:root[data-theme="clean"] .allcaught,:root[data-theme="dark"] .allcaught{display:none!important}

/* ---- type ---- */
:root[data-theme="clean"] body,:root[data-theme="dark"] body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,"Hind Mysuru",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.011em;font-size:.96rem;line-height:1.62}
:root[data-theme="clean"] .wrap,:root[data-theme="dark"] .wrap{max-width:760px}


/* ---- THE core move: cards become document rows ---- */
:root[data-theme="clean"] .glass,:root[data-theme="clean"] .gcard,:root[data-theme="clean"] .hero,
:root[data-theme="clean"] .story,:root[data-theme="clean"] .trend,:root[data-theme="clean"] .q,
:root[data-theme="clean"] .mast,:root[data-theme="clean"] .som-head,:root[data-theme="clean"] .costbar,
:root[data-theme="dark"] .glass,:root[data-theme="dark"] .gcard,:root[data-theme="dark"] .hero,
:root[data-theme="dark"] .story,:root[data-theme="dark"] .trend,:root[data-theme="dark"] .q,
:root[data-theme="dark"] .mast,:root[data-theme="dark"] .som-head,:root[data-theme="dark"] .costbar{
  background:none!important;background-color:transparent!important;border:0!important;border-radius:0!important;
  box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  padding:22px 0 24px!important;margin:0!important;border-bottom:1px solid var(--line)!important}
:root[data-theme="clean"] .panel>*:last-child,:root[data-theme="dark"] .panel>*:last-child{border-bottom:0!important}
@media (hover:hover){
 :root[data-theme="clean"] .story:hover,:root[data-theme="clean"] .trend:hover,
 :root[data-theme="dark"] .story:hover,:root[data-theme="dark"] .trend:hover{
   transform:none!important;box-shadow:none!important;outline:0!important;background:none!important}
 :root[data-theme="clean"] .story:hover .st-t,:root[data-theme="dark"] .story:hover .st-t{color:var(--ac)!important}}
:root[data-theme="clean"] .st-t,:root[data-theme="dark"] .st-t{font-size:1.06rem;font-weight:600;line-height:1.32;letter-spacing:-.021em;color:var(--ink)}
:root[data-theme="clean"] .st-s,:root[data-theme="dark"] .st-s{font-size:.93rem;line-height:1.66;color:var(--ink2);margin-top:7px}
:root[data-theme="clean"] .meta,:root[data-theme="clean"] .src,:root[data-theme="dark"] .meta,:root[data-theme="dark"] .src{
  font-size:.76rem;color:var(--mut);font-weight:400;letter-spacing:0;margin-top:9px}

/* ---- hero is just a bigger first paragraph ---- */
:root[data-theme="clean"] .hero .st-t,:root[data-theme="dark"] .hero .st-t{font-size:1.48rem;line-height:1.22;letter-spacing:-.026em;font-weight:600}
:root[data-theme="clean"] .hero .st-s,:root[data-theme="dark"] .hero .st-s{font-size:1rem}

/* ---- section headings: small grey label, no rule, no emoji ---- */
:root[data-theme="clean"] .sec,:root[data-theme="dark"] .sec{
  font-size:.72rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--mut);
  margin:38px 0 4px;padding:0;background:none;border:0}
:root[data-theme="clean"] .sec::before,:root[data-theme="dark"] .sec::before,
:root[data-theme="clean"] .sec::after,:root[data-theme="dark"] .sec::after{display:none!important}

/* ---- strip the colour signalling: dots, heat, pills, badges ---- */
:root[data-theme="clean"] .dot,:root[data-theme="dark"] .dot,
:root[data-theme="clean"] .heat,:root[data-theme="dark"] .heat,
:root[data-theme="clean"] .trank,:root[data-theme="dark"] .trank,
:root[data-theme="clean"] .glance-tag,:root[data-theme="dark"] .glance-tag{display:none!important}
:root[data-theme="clean"] .pill,:root[data-theme="clean"] .mag,:root[data-theme="clean"] .as-tier,:root[data-theme="clean"] .chiprow>*,
:root[data-theme="clean"] .reader-chip,:root[data-theme="clean"] .cx,:root[data-theme="clean"] .lbl{
  background:var(--sub)!important;color:var(--ink2)!important;border:0!important;border-radius:6px!important;
  box-shadow:none!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important}
:root[data-theme="dark"] .pill,:root[data-theme="dark"] .mag,:root[data-theme="dark"] .as-tier,:root[data-theme="dark"] .chiprow>*,
:root[data-theme="dark"] .reader-chip,:root[data-theme="dark"] .cx,:root[data-theme="dark"] .lbl{
  background:var(--sub)!important;color:var(--ink2)!important;border:0!important;border-radius:6px!important;
  box-shadow:none!important;font-weight:500!important;letter-spacing:0!important;text-transform:none!important}
:root[data-theme="clean"] .as-lbl,:root[data-theme="dark"] .as-lbl{color:var(--mut)!important;font-weight:400!important}
:root[data-theme="clean"] .as-row,:root[data-theme="dark"] .as-row{border:0!important;background:none!important;padding-left:0!important}

/* ---- glance / "in 30 seconds" box: indented note, not a panel ---- */
:root[data-theme="clean"] .glance-body,:root[data-theme="dark"] .glance-body{background:none!important;border:0!important;padding:0!important}
:root[data-theme="clean"] .glance-row,:root[data-theme="dark"] .glance-row{padding:4px 0!important;border:0!important}

/* ---- navigation: text only ---- */
:root[data-theme="clean"] nav,:root[data-theme="clean"] .dock{background:rgba(255,255,255,.94)!important;border-color:var(--line)!important;box-shadow:none!important;backdrop-filter:saturate(1.8) blur(14px)}
:root[data-theme="dark"] nav,:root[data-theme="dark"] .dock{background:rgba(0,0,0,.94)!important;border-color:var(--line)!important;box-shadow:none!important;backdrop-filter:saturate(1.8) blur(14px)}
:root[data-theme="clean"] .tab,:root[data-theme="dark"] .tab{
  background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;
  color:var(--mut)!important;font-weight:500!important;letter-spacing:-.01em!important;padding:9px 2px!important;margin:0 9px!important}
:root[data-theme="clean"] .tab.on,:root[data-theme="dark"] .tab.on{
  color:var(--ink)!important;font-weight:600!important;box-shadow:inset 0 -2px 0 var(--ac)!important}

/* ---- masthead: date + count, nothing else ---- */
:root[data-theme="clean"] .mast,:root[data-theme="dark"] .mast{padding:26px 0 18px!important}
:root[data-theme="clean"] .mast::before,:root[data-theme="dark"] .mast::before{display:none!important}
:root[data-theme="clean"] #dateLbl,:root[data-theme="dark"] #dateLbl{
  background:none!important;color:var(--ink)!important;padding:0!important;font-weight:600!important;letter-spacing:-.02em!important;box-shadow:none!important;font-size:1.3rem}
:root[data-theme="clean"] .m-date,:root[data-theme="dark"] .m-date{color:var(--mut)!important;letter-spacing:0!important}
:root[data-theme="clean"] .m-date span[lang="kn"],:root[data-theme="dark"] .m-date span[lang="kn"]{background:none!important;border:0!important;padding:0!important;color:var(--mut)!important}
:root[data-theme="clean"] #slimName,:root[data-theme="dark"] #slimName,
:root[data-theme="clean"] .slim-title,:root[data-theme="dark"] .slim-title{
  background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;
  -webkit-text-fill-color:currentColor!important;color:var(--ink)!important;font-weight:600!important;letter-spacing:-.024em!important}
:root[data-theme="clean"] .slim-head,:root[data-theme="dark"] .slim-head{background:none!important;border:0!important;box-shadow:none!important;animation:none!important;padding:22px 0 6px!important}
:root[data-theme="clean"] .slim-count,:root[data-theme="clean"] .slim-date,
:root[data-theme="dark"] .slim-count,:root[data-theme="dark"] .slim-date{color:var(--mut)!important;background:none!important;border:0!important}
:root[data-theme="clean"] .legend>summary,:root[data-theme="dark"] .legend>summary,
:root[data-theme="clean"] .since .sh,:root[data-theme="dark"] .since .sh{
  background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;
  -webkit-text-fill-color:currentColor!important;color:var(--mut)!important;font-weight:500!important}

/* ---- controls: quiet grey capsules ---- */
:root[data-theme="clean"] .tool,:root[data-theme="clean"] .fit-seg,:root[data-theme="clean"] .dens-seg,
:root[data-theme="clean"] .more-btn,:root[data-theme="clean"] .act-ask,:root[data-theme="clean"] .ask-go,:root[data-theme="clean"] .fab-item{
  background:var(--sub)!important;border:0!important;color:var(--ink2)!important;box-shadow:none!important;border-radius:8px!important;font-weight:500!important}
:root[data-theme="dark"] .tool,:root[data-theme="dark"] .fit-seg,:root[data-theme="dark"] .dens-seg,
:root[data-theme="dark"] .more-btn,:root[data-theme="dark"] .act-ask,:root[data-theme="dark"] .ask-go,:root[data-theme="dark"] .fab-item{
  background:var(--sub)!important;border:0!important;color:var(--ink2)!important;box-shadow:none!important;border-radius:8px!important;font-weight:500!important}
:root[data-theme="clean"] .fab-sheet,:root[data-theme="clean"] .sheet,:root[data-theme="clean"] .more-menu,:root[data-theme="clean"] .kbd-card,:root[data-theme="clean"] #reader{
  background:#fff!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:0 20px 60px -30px rgba(0,0,0,.35)!important}
:root[data-theme="dark"] .fab-sheet,:root[data-theme="dark"] .sheet,:root[data-theme="dark"] .more-menu,:root[data-theme="dark"] .kbd-card,:root[data-theme="dark"] #reader{

/* ---- FIT MODES (restored 2026-08-15; they were lost with the Studio block).
   Clean is a row/hairline layout, so multicol is wrong — fit 2-4 use CSS grid.
   Only the ACTIVE panel is ever displayed: .panel{display:none}/.panel.active{display:block}
   must never be overridden, or every tab stacks into one endless scroll. ---- */
:root[data-theme="clean"] .panel,:root[data-theme="dark"] .panel{column-count:auto!important;column-gap:0!important}
:root[data-theme="clean"] .panel.active,:root[data-theme="dark"] .panel.active{display:block}
@media (min-width:760px){
  :root[data-theme="clean"] .panel.active[data-fit="4"],:root[data-theme="dark"] .panel.active[data-fit="4"]{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:34px;align-items:start}
  :root[data-theme="clean"] .panel.active[data-fit="4"],:root[data-theme="dark"] .panel.active[data-fit="4"]{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:26px}
  :root[data-theme="clean"] .panel[data-fit="4"]>.sec,:root[data-theme="dark"] .panel[data-fit="4"]>.sec,
  :root[data-theme="clean"] .panel[data-fit]>.fitbar,:root[data-theme="dark"] .panel[data-fit]>.fitbar,
  :root[data-theme="clean"] .panel[data-fit]>.mast,:root[data-theme="dark"] .panel[data-fit]>.mast,
  :root[data-theme="clean"] .panel[data-fit]>.hero,:root[data-theme="dark"] .panel[data-fit]>.hero,
  :root[data-theme="clean"] .panel[data-fit]>.glance,:root[data-theme="dark"] .panel[data-fit]>.glance,
  :root[data-theme="clean"] .panel[data-fit]>.slim-head,:root[data-theme="dark"] .panel[data-fit]>.slim-head,
  :root[data-theme="clean"] .panel[data-fit]>.legend,:root[data-theme="dark"] .panel[data-fit]>.legend,
  :root[data-theme="clean"] .panel[data-fit]>.costbar,:root[data-theme="dark"] .panel[data-fit]>.costbar,
  :root[data-theme="clean"] .panel[data-fit]>.som-head,:root[data-theme="dark"] .panel[data-fit]>.som-head{grid-column:1/-1}
}
/* wider measure when densified so grid columns aren't cramped */
/* Condensed / Dense / Max tighten the row rhythm — visibly, at every width */
:root[data-theme="clean"] .panel[data-fit="4"] .story,:root[data-theme="dark"] .panel[data-fit="4"] .story,
:root[data-theme="clean"] .panel[data-fit="4"] .trend,:root[data-theme="dark"] .panel[data-fit="4"] .trend{padding:9px 0 10px!important}
:root[data-theme="clean"] .panel[data-fit="4"] .st-t,:root[data-theme="dark"] .panel[data-fit="4"] .st-t{font-size:.9rem;line-height:1.28}
:root[data-theme="clean"] .panel .st-s,:root[data-theme="dark"] .panel .st-s{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.87rem!important;line-height:1.5!important;margin-top:6px!important}
:root[data-theme="clean"] .panel[data-fit="4"] .meta,:root[data-theme="dark"] .panel[data-fit="4"] .meta{margin-top:5px}
:root[data-theme="clean"] .panel[data-fit="4"] .sec,:root[data-theme="dark"] .panel[data-fit="4"] .sec{margin:22px 0 2px}
:root[data-theme="clean"] .panel[data-fit="4"] .hero .st-t,:root[data-theme="dark"] .panel[data-fit="4"] .hero .st-t{font-size:1.18rem}
/* fit bar: readable, not a floating card */
:root[data-theme="clean"] .fitbar,:root[data-theme="dark"] .fitbar{display:none!important;
  background:none!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;
  box-shadow:none!important;padding:10px 0 12px!important;margin:0 0 4px!important;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
:root[data-theme="clean"] .fb-ic,:root[data-theme="dark"] .fb-ic{display:none}
:root[data-theme="clean"] .fb-lbl,:root[data-theme="dark"] .fb-lbl{font-size:.74rem;color:var(--mut);font-weight:500}
:root[data-theme="clean"] .fit-seg,:root[data-theme="dark"] .fit-seg{display:flex;gap:2px;padding:2px;border-radius:9px}
:root[data-theme="clean"] .fit-seg button,:root[data-theme="dark"] .fit-seg button{
  border:0;background:none;color:var(--ink2);font:500 .74rem/1 inherit;padding:7px 11px;border-radius:7px;cursor:pointer}
:root[data-theme="clean"] .fit-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
:root[data-theme="dark"]  .fit-seg button.on{background:#3a3a3c;color:#fff}

/* ---- BOTTOM DOCK: solid surface, clearly legible tabs ---- */
:root[data-theme="clean"] nav.tabs,:root[data-theme="dark"] nav.tabs{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
:root[data-theme="clean"] nav.tabs{background:#f5f5f7!important;border:1px solid rgba(0,0,0,.10)!important;box-shadow:0 6px 24px -12px rgba(0,0,0,.25)!important}
:root[data-theme="dark"]  nav.tabs{background:#1c1c1e!important;border:1px solid rgba(255,255,255,.12)!important;box-shadow:0 6px 24px -12px #000!important}
:root[data-theme="clean"] .tab,:root[data-theme="dark"] .tab{
  color:var(--mut)!important;font-size:.66rem!important;font-weight:600!important;letter-spacing:0!important;
  text-transform:none!important;padding:9px 4px!important;margin:0!important;border-radius:9px!important;box-shadow:none!important}
:root[data-theme="clean"] .tab .ico,:root[data-theme="dark"] .tab .ico{display:inline!important;font-size:1rem;line-height:1;opacity:.75}
:root[data-theme="clean"] .tab.on{background:#fff!important;color:#000!important;box-shadow:0 1px 2px rgba(0,0,0,.14)!important}
:root[data-theme="dark"]  .tab.on{background:#3a3a3c!important;color:#fff!important;box-shadow:none!important}
:root[data-theme="clean"] .tab.on .ico,:root[data-theme="dark"] .tab.on .ico{opacity:1}
@media (max-width:560px){
  :root[data-theme="clean"] nav.tabs,:root[data-theme="dark"] nav.tabs{left:0!important;right:0!important;bottom:0!important;border-radius:0!important;border-left:0!important;border-right:0!important;border-bottom:0!important;padding:5px 4px!important;padding-bottom:calc(5px + env(safe-area-inset-bottom))!important}
  :root[data-theme="clean"] .tab,:root[data-theme="dark"] .tab{font-size:.58rem!important;padding:6px 2px!important;gap:3px!important}
  :root[data-theme="clean"] .wrap,:root[data-theme="dark"] .wrap{padding-bottom:16px}
  body{padding-bottom:94px}
}
@media (min-width:1000px){
  :root[data-theme="clean"] nav.tabs,:root[data-theme="dark"] nav.tabs{border-radius:14px!important}
  :root[data-theme="clean"] .tab,:root[data-theme="dark"] .tab{justify-content:flex-start!important;padding:10px 12px!important;font-size:.8rem!important}
}

/* ---- the ⋯ button: small, quiet, opens view + settings ---- */
:root[data-theme="clean"] .fab-menu,:root[data-theme="dark"] .fab-menu{
  width:32px!important;height:32px!important;min-width:32px!important;padding:0!important;border-radius:50%!important;
  font-size:1rem!important;line-height:1!important;font-weight:600!important;letter-spacing:0!important;
  display:inline-flex;align-items:center;justify-content:center;border:0!important;box-shadow:none!important;opacity:.7}
:root[data-theme="clean"] .fab-menu{background:#f5f5f7!important;color:#1d1d1f!important}
:root[data-theme="dark"]  .fab-menu{background:#2c2c2e!important;color:#f5f5f7!important}
:root[data-theme="clean"] .fab-menu:hover,:root[data-theme="dark"] .fab-menu:hover{opacity:1}
:root[data-theme="clean"] .more-btn,:root[data-theme="dark"] .more-btn{
  width:30px!important;height:30px!important;min-width:30px!important;padding:0!important;border-radius:50%!important;

:root[data-theme="clean"] .more-btn:hover,:root[data-theme="dark"] .more-btn:hover{opacity:1}

/* ---- readability floor: nothing below AA on either canvas ---- */
:root[data-theme="clean"]{--ink2:#3f3f43;--mut:#6e6e73}
:root[data-theme="dark"]{--ink2:#d8d8dd;--mut:#98989d}

:root[data-theme="clean"] .sompage img,:root[data-theme="dark"] .sompage img{display:block;width:100%}



/* ---- MAX-ONLY (2026-08-15): there is no fit switcher any more. Every panel is
   data-fit="4" + .dense, and tapping any card opens the full-screen reader,
   which IS the comfortable view. Do not re-add fit levels 1-3. ---- */
:root[data-theme="clean"] .panel .story,:root[data-theme="dark"] .panel .story,
:root[data-theme="clean"] .panel .trend,:root[data-theme="dark"] .panel .trend{cursor:pointer}
@media (hover:hover){
 :root[data-theme="clean"] .panel .story:hover .st-t{color:var(--ac)!important}
 :root[data-theme="dark"]  .panel .story:hover .st-t{color:var(--ac)!important}}
/* reader = the comfortable reading view */
:root[data-theme="clean"] #reader,:root[data-theme="dark"] #reader{border-radius:0!important;border:0!important;box-shadow:none!important}
:root[data-theme="clean"] #reader{background:#fff!important}

  background:none!important;-webkit-text-fill-color:currentColor!important}

:root[data-theme="clean"] .reader-pts,:root[data-theme="dark"] .reader-pts{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
:root[data-theme="clean"] .reader-pts-h,:root[data-theme="dark"] .reader-pts-h{

:root[data-theme="dark"]  .reader-x{background:#2c2c2e;color:#f5f5f7}

/* ---- ONE title per tab (2026-08-15). The template renders TWO headings:
   .slim-head (#slimName, gradient-blue) and the in-panel .phead (plain h2).
   The rule that hid .phead was lost with the FIXES v2 block. Keep .phead
   hidden and let .slim-head be the single, ink-coloured tab title, closed
   with one hairline before the content starts. ---- */
:root[data-theme="clean"] .phead,:root[data-theme="dark"] .phead,

  display:flex!important;align-items:baseline;gap:10px;flex-wrap:wrap}
body:not([data-tt="news"]) :is(:root[data-theme="clean"],:root[data-theme="dark"]) .slim-head{display:flex!important}
:root[data-theme="clean"] #slimName,:root[data-theme="dark"] #slimName,
:root[data-theme="clean"] .slim-title,:root[data-theme="dark"] .slim-title{
  font-size:1.62rem!important;font-weight:600!important;letter-spacing:-.028em!important;

/* News keeps only the masthead date — no second heading */
:root[data-theme="clean"] .mast,:root[data-theme="dark"] .mast{border-bottom:1px solid var(--line)!important;margin-bottom:6px!important}

/* ---- ONE minimal footer line per card (2026-08-15): source · time · Ask,
   with basis folded in as the same small grey type. Card becomes a wrapping
   flex row; every child is full-width except the footer bits, and an EMPTY
   .more collapses so it can't break the line. ---- */
:root[data-theme="clean"] .story,:root[data-theme="dark"] .story,
:root[data-theme="clean"] .trend,:root[data-theme="dark"] .trend{
  display:flex!important;flex-wrap:wrap!important;align-items:baseline!important;column-gap:0}

:root[data-theme="clean"] .trend>*,:root[data-theme="dark"] .trend>*{flex:0 0 100%;min-width:0}
:root[data-theme="clean"] .story>.src,:root[data-theme="dark"] .story>.src,
:root[data-theme="clean"] .story>.meta,:root[data-theme="dark"] .story>.meta,
:root[data-theme="clean"] .story>.acts,:root[data-theme="dark"] .story>.acts,

:root[data-theme="clean"] .story>.meta::after,:root[data-theme="dark"] .story>.meta::after,

:root[data-theme="dark"]  .ask-go{background:#ff453a!important;color:#fff!important;border:0!important}

ada trade war goes live", "url": "https://www.bbc.co.uk/news/articles/cx272np7vgyo?at_medium=RSS&at_campaign=rss", "published": "2026-08-22T20:10:00+00:00", "src": "BBC News"}, {"t": "Magnitude 5.9 earthquake shakes northeastern Japan; at least five hurt", "s": "The Fire and Disaster Management Agency reported injuries in Ibaraki, Chiba and Saitama prefectures northeast of Tokyo. No tsunami warning was issued and no major structural damage has been reported so far.", "imp": "important", "glance": "5.9 quake hits near Tokyo, no tsunami", "url": "https://www.thehindu.com/news/international/japan-tokyo-earthquake-several-injured-latest-update/article71380017.ece", "published": "2026-08-23T06:23:43+05:30", "src": "The Hindu"}, {"t": "Iran says pilots it detained are in 'poor physical condition', asks Qatar to move them ashore", "s": "Tehran told Qatari mediators the detained crew had been held on water and needed hospital care on land, adding a humanitarian thread to an already tense standoff. The request is one of the few active channels of contact between the two sides.", "imp": "important", "glance": "Detained pilots become a bargaining thread", "url": "https://indianexpress.com/article/world/iran-urges-qatar-transfer-detained-pilots-hospital-land-10845440/", "published": "2026-08-23T00:29:12+00:00", "src": "The Indian Express"}]}, {"h": "🤖 Tech & AI", "tag": "Tech & AI", "items": [{"t": "OpenAI cuts developer pricing for its frontier GPT-5.6 Sol model by more than 20%", "s": "The company published lower per-token rates for its top model, its second cut this year, in a market where rivals have been undercutting frontier pricing. For anyone building on the API it is an immediate cost reduction rather than a promise.", "imp": "important", "glance": "Frontier model pricing drops again", "url": "https://www.reuters.com/technology/openai-cuts-developer-pricing-frontier-gpt-56-sol-model-by-more-than-20-2026-08-21/", "published": "2026-08-22T00:35:00+05:30", "src": "Reuters"}, {"t": "Nvidia is said to have warned big customers of a 15% AI server price rise", "s": "According to a report, Nvidia told several of its largest buyers that AI server prices will rise by about 15%, citing component and memory costs. If it holds, it raises the floor cost of building AI capacity for everyone downstream.", "imp": "important", "glance": "AI server costs set to rise 15%", "url": "https://www.livemint.com/companies/news/nvidia-reportedly-warns-some-of-its-biggest-customers-about-upcoming-price-hike-of-ai-servers-by-15-details-11787447183614.html", "published": "2026-08-23T06:49:20+05:30", "src": "Mint"}, {"t": "A 27B model from DeepMind alumni beat much larger rivals at reproducing research", "s": "British lab Inherent says its agent Faraday, built on a 27-billion-parameter model, outscored far larger OpenAI and Anthropic systems on replicating published scientific results. The claim is the lab's own benchmark and has not been independently reproduced yet.", "imp": "important", "glance": "Small agent tops big models on replication", "url": "https://techcrunch.com/2026/08/22/inherent-founded-by-deepmind-alumni-says-its-ai-teammate-just-outperformed-anthropic-and-openai-at-replicating-research/", "published": "2026-08-22T19:00:00+00:00", "src": "TechCrunch"}, {"t": "Amazon raises Echo, Fire TV and Kindle prices by up to 60%", "s": "The increases hit several generations of hardware at once, in some cases by more than half. Amazon has long sold these devices near cost to win the living room, so a rise of this size marks a shift in that strategy.", "imp": "interesting", "glance": "Amazon device prices jump sharply", "url": "https://www.theverge.com/tech/983598/amazon-price-increase-echo-kindle-fire-tv", "published": "2026-08-22T13:41:45-04:00", "src": "The Verge"}]}, {"h": "📈 Business & Markets", "tag": "Business", "items": [{"t": "RBI's concessional swap window has pulled in $72.85 billion of forex inflows", "s": "Authorised dealer banks reported inflows to the RBI up to August 21 of $72.85 billion, with FCNR(B) deposits accounting for roughly 90% at about $65.4 billion, plus $4.86 billion via overseas foreign currency borrowings and $2.59 billion through ECBs. The window was designed to shore up reserves and steady the rupee.", "imp": "important", "glance": "$72.85bn flows in via RBI swap window", "url": "https://www.thehindu.com/business/Economy/rbi-sees-forex-inflows-of-7285-billion-via-fcnr-b-ofcb-ecb-swap-facility/article71377108.ece", "published": "2026-08-22T15:14:30+05:30", "src": "The Hindu"}, {"t": "Gold on MCX rallies for a fifth straight week, up ₹19,000 per 10 grams in August", "s": "Domestic gold futures extended their run as safe-haven demand held up through the Iran sanctions escalation and a choppy equity tape. The August gain works out to a substantial move for anyone holding, buying or pledging gold this month.", "imp": "important", "glance": "Gold up ₹19,000/10g this month", "url": "https://www.livemint.com/market/commodities/mcx-gold-rallies-for-fifth-straight-week-gains-rs-19-000-per-10-grams-in-august-11787380646821.html", "published": "2026-08-23T06:01:00+05:30", "src": "Mint"}, {"t": "Monthly SIP flows hold above ₹30,000 crore as equity fund assets hit ₹48.5 lakh crore", "s": "Systematic investment plan contributions stayed above the ₹30,000 crore mark and total equity mutual fund assets reached a record ₹48.5 lakh crore, showing retail flows have not flinched despite two flat weeks on the index.", "imp": "important", "glance": "SIPs hold firm at record fund assets", "url": "https://www.livemint.com/market/sips-stay-above-rs-30-000-crore-equity-mutual-funds-smash-record-as-assets-hit-rs-48-5-lakh-crore-11787408860279.html", "published": "2026-08-22T20:06:55+05:30", "src": "Mint"}, {"t": "Centre clears 1,800 km of new LPG pipelines across six states with ₹7,000 crore of investment", "s": "The approval covers pipeline capacity meant to move bottling and bulk supply off road transport in six
