federal contracts will be argued against.","heat":92,"delta":"new","sources":3,"url":"https://www.washingtonpost.com/technology/2026/09/25/anthropic-pentagon-blacklist-appeals-court/","glance":"Court upholds Anthropic defence ban","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Precedent for excluding an AI lab","basis":"Federal appeals court ruling upholding the Pentagon designation"}},{"t":"NSA is paying billions to test frontier AI models","s":"Classified estimates surfaced this week put NSA spending on evaluating frontier AI models in the billions of dollars, a figure far above what any public benchmark programme commands. It reframes who the largest buyer of model evaluation actually is, and implies capability assessments that no external researcher can see.","heat":88,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=45712330","glance":"NSA's AI testing bill runs to billions","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"State is the biggest eval buyer","basis":"Classified spending estimates reported and widely discussed; not officially confirmed"}},{"t":"China passes the US as the top source of elite AI talent","s":"A Carnegie Endowment analysis puts China at 40.6% of the world's top-tier AI researchers against 34.2% for the United States — an ordering that has flipped. For anyone planning where frontier research and engineering hiring happens over the next five years, this is the underlying supply curve.","heat":83,"delta":"new","sources":3,"url":"https://carnegieendowment.org/research/2026/09/china-us-ai-talent-shift","glance":"China now leads elite AI headcount","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Talent balance has tipped","basis":"Carnegie Endowment analysis of researcher affiliation data"}},{"t":"Meta's Muse appears to run on an OpenAI model","s":"Inspection of Meta's newly opened Muse features points to an OpenAI model labelled muse-special serving requests, rather than a Meta model. If it holds, the company that has spent most heavily on open in-house models is renting frontier capability for its flagship consumer feature — a read on where the capability gap actually sits.","heat":80,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=45711884","glance":"Meta's Muse looks like OpenAI inside","assess":{"mag":3,"timeline":"now","evidence":"early","verdict":"Meta may be renting frontier models","basis":"Model label observed in Muse responses; Meta has not confirmed"}},{"t":"Pope Leo XIV presses his AI encyclical in France, and Thiel attacks it","s":"The pope used the opening of a three-day France visit to argue AI must serve people rather than become an instrument of domination, restating his encyclical to a head-of-state audience; Peter Thiel called the document a gift to the Chinese Communist Party the same day. The practical relevance is regulatory: this is now a live input into European AI rules rather than only a moral argument.","heat":76,"delta":"new","sources":4,"url":"https://apnews.com/article/pope-leo-france-artificial-intelligence-paradise-machines","glance":"Papal AI doctrine meets Thiel's attack","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"proven","verdict":"Moral argument enters EU politics","basis":"Papal address during state visit plus public counter-argument from Thiel"}},{"t":"FTC chair floats making AI developers liable for their agents","s":"The FTC chair suggested developers should bear legal responsibility for what their agents do, days into the OpenAI breach story. If that becomes enforcement posture rather than a speech, the cost of shipping autonomous agents changes for every vendor selling them to US businesses.","heat":72,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=45712901","glance":"Regulator eyes developer liability for agents","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"early","verdict":"Liability may shift to builders","basis":"Public remarks by the FTC chair; no rulemaking initiated"}},{"t":"Claude's CRISPR-like enzyme find draws its first expert pushback","s":"Anthropic's claim that Claude discovered a previously unknown CRISPR-like DNA-editing system in viral genomes met its first substantive scientific response, with New Scientist arguing it will at best be another gene-editing tool and noting the company cannot yet say what the system does. The use case — a new editor for genetic medicine — remains real but unproven, and the episode is becoming a test case for how AI-generated discovery claims get validated.","heat":70,"delta":"new","sources":4,"url":"https://www.newscientist.com/article/2590769-has-anthropics-claude-really-made-a-discovery-comparable-to-crispr/","glance":"Claude's DNA find meets scepticism","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Real find, unclear function","basis":"Anthropic announcement; function uncharacterised, independent replication pending"}},{"t":"Bill Gates says AI is now powerful enough to cause a billion deaths","s":"Gates put a specific number on the downside, saying the technology is powerful enough to cause a billion deaths, which moves him closer to positions he had previously distanced himself from. It matters mainly as a signal about which way establishment technology opinion is drifting ahead of regulation.","heat":66,"delta":"new","sources":3,"url":"https://news.ycombinator.com/item?id=45711567","glance":"Gates puts a number on AI risk","assess":{"mag":2,"timeline":"unclear","evidence":"speculative","verdict":"Prominent opinion, not evidence","basis":"Public statement; no underlying analysis released"}},{"t":"US uses AI to deny care to seniors as vendors expand","s":"Reporting describes the Trump administration using AI systems to deny medical care to older patients in a programme critics call a failed experiment, with vendors nonetheless rolling the approach out further. This is the clearest live example of automated decision-making with direct, documented harm to a specific population.","heat":64,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=45712044","glance":"AI denials hit senior healthcare","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Automated denial is already operating","basis":"Reporting on a live federal programme and vendor expansion"}},{"t":"Microsoft shuts down an AI-assisted operation that compromised 12,000 accounts","s":"Microsoft disrupted a platform that used AI to compromise about 12,000 accounts, one of the larger documented cases of models being used to industrialise account takeover. For anyone running business accounts, it is a concrete argument for hardware-backed multi-factor authentication rather than SMS.","heat":58,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=45712558","glance":"AI-run account takeover taken down","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"AI industrialises account theft","basis":"Microsoft disruption action with a stated 12,000-account figure"}},{"t":"Geely says AI-managed fast charging heals EV batteries for 20% more cycles","s":"Geely reported that an AI-controlled fast-charging routine actively repairs degradation in its EV packs, claiming roughly 20% additional cycle life. If it survives independent testing it changes the economics of pack warranties and second-life cells — a manufacturer claim at this stage, with no third-party verification.","heat":55,"delta":"new","sources":1,"url":"https://news.ycombinator.com/item?id=45712210","glance":"AI charging claims to heal EV cells","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Vendor claim, no outside test","basis":"Geely statement on cycle-life gain; not independently replicated"}},{"t":"Opus 5.5 settles into the benchmark tables","s":"Discussion of Anthropic's Opus 5.5 shifted from launch reaction to whether it is a genuine step change, with community threads weighing it against the scores posted at release. The practical read for anyone choosing a model is that the gap is now argued on task fit rather than headline benchmarks.","heat":48,"delta":"cooling","sources":3,"url":"https://news.ycombinator.com/item?id=45712775","glance":"Opus 5.5 debate turns to task fit","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Released model, contested margin","basis":"Published benchmark scores plus practitioner comparison threads"}}]},"aitrendsUpdated":"2026-09-26T02:38:34Z","science":{"updated":"2026-09-26T02:38:34Z","items":[{"t":"An mRNA cocktail cleared pancreatic tumours in half of treated mice and they stayed clear for a year","s":"UMass Chan Medical School combined mRNAs encoding five immune cytokines with three tumour-associated antigens in a single injection, and about 50% of mice with pancreatic ductal adenocarcinoma cleared their tumours completely and stayed disease-free for a year after treatment stopped. The practical use is an off-the-shelf immunotherapy for the solid tumour that responds worst to everything else; published in Nature Communications, and entirely mouse work so far.","tag":"Health","imp":"critical","glance":"mRNA cocktail clears pancreatic tumours in mice","url":"https://scitechdaily.com/pancreatic-cancer-disappears-in-mice-after-new-mrna-immunotherapy/","published":"2026-09-24T18:47:24Z","src":"Nature Communications","assess":{"mag":5,"timeline":"5-10 yrs","evidence":"early","verdict":"Complete, durable clearance in mice","basis":"Nature Communications; ~50% of PDAC mice tumour-free for a year"},"eli":"Pancreatic cancer hides from the immune system behind a wall of tissue. This shot carries genetic instructions that tell the body to make the signals needed to break through that wall and to recognise the tumour. In mice it worked so well the cancer never came back."},{"t":"Engineered tRNA restored a full-length protein in cystic-fibrosis cells that Trikafta could not help","s":"A University of Toronto team designed transfer RNAs that read straight through the premature stop codons behind thousands of genetic disorders, and in lab-grown tissue from a cystic-fibrosis patient who had not responded to existing drugs the approach restored full-length protein and gave Trikafta something to act on — neither treatment did much alone. Peer-reviewed in Science; the work is in patient-derived tissue, not yet in people, so this is a platform result rather than a therapy.","tag":"Health","imp":"important","glance":"tRNA rescue for stop-codon disorders","url":"https://scitechdaily.com/a-new-rna-strategy-could-target-thousands-of-genetic-disorders/","published":"2026-09-26T01:20:00Z","src":"University of Toronto / Science","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"One platform, thousands of mutations","basis":"Peer-reviewed in Science; patient-derived CF tissue, not yet in humans"},"eli":"Some genetic diseases happen because a typo tells the cell to stop building a protein halfway. These engineered molecules ignore the typo and let the cell finish the job, so one tool could in principle address many different diseases caused by that same kind of typo."},{"t":"A muon beam produced the first clean images through solid walls","s":"Researchers reported the first sharp pictures made with a laser-generated muon beam, which penetrates material that blocks X-rays. The stated applications are inspecting sealed suspicious packages and imaging the inside of thick structures without opening or damaging them. Published in Science; a working beamline demonstration, not yet a deployable scanner.","tag":"Physics & Space","imp":"important","glance":"Muon beam sees through walls","url":"https://www.science.org/content/article/laser-generated-particles-allow-scientists-see-through-walls","published":"2026-09-25T17:30:00Z","src":"Science (AAAS)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"New way to image through metal","basis":"First clean muon-beam images, published in Science; beamline stage"},"eli":"Muons are particles that pass through thick material that stops normal X-rays. Aiming a beam of them at something lets you photograph what is inside a sealed crate or a stone wall."},{"t":"A little-studied arm of the immune system that reads fats could sharpen vaccines and cancer therapy","s":"Work on the CD1 system, which presents lipids rather than proteins to immune cells, shows it drives reactions to bee stings, bacteria and possibly poison ivy — and offers a second, largely unused route for designing vaccines and cancer immunotherapies that current protein-based approaches cannot reach. Reported in Science; established immunology being reframed, with therapeutic use still preclinical.","tag":"Biology","imp":"important","glance":"Fat-reading immunity as vaccine target","url":"https://www.science.org/content/article/little-known-arm-immune-system-could-be-key-better-vaccines-cancer-therapies","published":"2026-09-24T07:00:00Z","src":"Science (AAAS)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Second immune channel opens up","basis":"Science review of CD1 lipid presentation; therapeutic use still preclinical"}},{"t":"A laser assay picked a colorectal-cancer marker out of blood in minutes without antibodies","s":"Researchers used laser light instead of antibodies to pull a faint colorectal-cancer biomarker out of a blood sample within minutes, sidestepping the cost and fragility of antibody-based tests. The use case is cheap, fast screening; the work is a laboratory demonstration on prepared samples, not a validated clinical test.","tag":"Health","imp":"important","glance":"Minutes-fast blood cancer marker test","url":"https://phys.org/news/2026-09-laser-enables-colorectal-cancer-biomarker.html","published":"2026-09-26T00:20:00Z","src":"Phys.org","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Antibody-free screening, if it scales","basis":"Lab demonstration on prepared blood samples; no clinical validation yet"}},{"t":"Vitamin C cut deaths in a blood-cancer trial that missed its main endpoint","s":"The phase 2 EVITA trial randomised 109 patients in Denmark and the US with precancerous blood conditions or low-risk blood cancers to 1,000 mg of daily oral vitamin C or placebo for a year. Over a median 33.6 months there were 11 deaths on vitamin C against 24 on placebo — but the trial's actual primary measure, the growth rate of the abnormal cells, was no different between arms, and the survival signal came from an exploratory analysis. Published in CANCER; a phase 3 is needed before this means anything clinically.","tag":"Health","imp":"important","glance":"Vitamin C survival signal, endpoint missed","url":"https://scitechdaily.com/vitamin-c-supplements-tied-to-fewer-deaths-in-blood-disorder-trial/","published":"2026-09-26T01:50:00Z","src":"CANCER (American Cancer Society)","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Cheap, but the endpoint missed","basis":"Phase 2 (n=109) missed primary endpoint; survival was exploratory only"}},{"t":"Targeted nanoparticles stripped tumour scarring and let immunotherapy work in mice","s":"Liver and lung cancers often grow in tissue already scarred by hepatitis, cirrhosis or chronic damage, and that scar tissue suppresses nearby immune cells so the tumour is shielded before treatment begins. Nanoparticles aimed at the scarring reduced it and restored immunotherapy response — in mice. Preclinical, so the effect size in people is unknown.","tag":"Health","imp":"important","glance":"Clearing scar tissue unblocks immunotherapy","url":"https://phys.org/news/2026-09-nanoparticles-tumor-scarring-enable-immunotherapy.html","published":"2026-09-25T21:20:00Z","src":"Phys.org","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Unblocks immunotherapy in mice","basis":"Mouse study of anti-fibrotic nanoparticles; no human data"}},{"t":"AI-designed phage mutations infect target bacteria up to a million times more effectively","s":"University of Wisconsin-Madison biochemists trained a model on their own lab data to predict which mutations make a bacteriophage bind and enter its bacterial host, and reported gains up to a million-fold in infection efficiency in Cell Systems. The use-case is phage therapy for antibiotic-resistant infections, where the bottleneck has been getting a phage that reliably attacks the strain in front of you; this is design rather than trial-and-error screening.","tag":"Biology","imp":"important","glance":"AI designs phages that beat resistant bacteria","url":"https://phys.org/news/2026-09-ai-mutations-viruses-infect-bacteria.html","published":"2026-09-24T20:30:01Z","src":"Cell Systems","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Phage targeting becomes designable","basis":"Cell Systems; up to 1,000,000x infection efficiency in lab assays"}},{"t":"A palladium membrane lets ammonia be made from water instead of fossil hydrogen","s":"A South Korean team built an ammonia synthesis route around a membrane that passes hydrogen but blocks water, so the hydrogen can come from water rather than steam-reformed natural gas, cutting the carbon emissions of the process. Ammonia is the base of most nitrogen fertiliser and a leading hydrogen carrier, and its conventional synthesis is one of the largest single industrial CO2 sources, so a lower-carbon route matters at scale; this is lab-stage.","tag":"Materials & Energy","imp":"important","glance":"Green ammonia route runs on water","url":"https://phys.org/news/2026-09-hydrogen-stays-palladium-membrane-enables.html","published":"2026-09-24T21:40:01Z","src":"Phys.org","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Fertiliser hydrogen from water, not gas","basis":"Lab-scale Pd membrane; selective H transport, water retained"}}]},"scienceUpdated":"2026-09-26T02:38:34Z","scienceDaily":{"updated":"2026-09-26T02:38:34Z","items":[{"t":"CRISPR-edited donor stem cells let a blood-cancer drug hit the cancer and spare the graft","s":"Researchers deleted CD33 from donor stem cells so that a CD33-targeted therapy destroys aggressive blood cancer without also killing the healthy transplanted cells patients depend on afterwards. In a 30-patient trial the edited cells engrafted successfully and appeared to shield the new blood system from the drug. A real human trial, though small and early-phase.","tag":"Health","imp":"important","glance":"Edited grafts survive cancer drug","url":"https://www.sciencedaily.com/releases/2026/09/260924020408.htm","published":"2026-09-25T18:20:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Graft made immune to the drug","basis":"30-patient trial; edited cells engrafted and resisted CD33 therapy"},"eli":"The drug kills anything carrying a marker called CD33 — including the healthy new blood cells a patient gets from a transplant. So they removed that marker from the donor cells first, and now the drug only kills the cancer."},{"t":"Non-Abelian anyons did the full set of quantum operations on Quantinuum's 54-qubit processor","s":"Exotic quasiparticles called non-Abelian anyons were shown to perform every operation universal quantum computing requires, by combining braiding with fusion on 54 qubits of Quantinuum's H2 machine — braiding alone had never been enough. This is the clearest evidence yet that the topological route to error-resistant quantum computing is viable hardware rather than theory.","tag":"Physics & Space","imp":"important","glance":"Topological qubits go universal","url":"https://www.sciencedaily.com/releases/2026/09/260924020403.htm","published":"2026-09-25T17:50:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Topological computing clears a bar","basis":"Braiding plus fusion demonstrated on 54 qubits of Quantinuum H2"}},{"t":"Cells kept making cysteine after the 'indispensable' pathways were switched off","s":"Mammalian cells were found to hold a backup route for making the essential amino acid cysteine even when the pathways textbooks call indispensable are disabled. The same mechanism may be how some tumours survive treatment, which makes blocking it a concrete target for making cancers easier to kill. Mechanistic cell work; no drug candidate yet.","tag":"Biology","imp":"important","glance":"Hidden survival route is a cancer target","url":"https://www.sciencedaily.com/releases/2026/09/260923035939.htm","published":"2026-09-25T07:00:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Backup pathway cancers may exploit","basis":"Cell-level mechanism; pathway disabled and cells still made cysteine"}},{"t":"More REM and deep sleep tracked lower risk across 83 diseases in a large wearable study","s":"Published in PLOS Medicine by Shengzhi Sun of Capital Medical University and colleagues, the study used objectively measured sleep stages rather than self-report and found greater REM and deep sleep associated with lower risk across dozens of conditions, while under five hours total sleep carried high risk. It is observational, so it cannot prove causation, but it shifts the target from hours in bed to sleep architecture, which wearables can already measure.","tag":"Health","imp":"critical","glance":"Sleep stages, not just hours, track disease risk","url":"https://www.sciencedaily.com/releases/2026/09/260923035930.htm","published":"2026-09-24T03:58:30Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Sleep architecture beats sleep duration","basis":"PLOS Medicine; objective sleep staging vs risk across 83 diseases"}},{"t":"Nearly one in six children on GLP-1 drugs developed a nutritional deficiency within a year","s":"A study in Childhood Obesity found 16.8% of young patients started on GLP-1 medications for obesity, prediabetes or type 2 diabetes were diagnosed with a nutritional deficiency in the first year, vitamin D most often at 12.4%. The authors, at Lurie Children's Hospital and Northwestern, note iron and calcium matter particularly during adolescent growth, so the practical use is a monitoring protocol rather than a reason to stop the drugs.","tag":"Health","imp":"critical","glance":"GLP-1 kids need nutrient monitoring","url":"https://www.sciencedaily.com/releases/2026/09/260923035926.htm","published":"2026-09-24T03:15:18Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"A monitoring gap in paediatric GLP-1 use","basis":"Childhood Obesity; 16.8% deficiency rate, vitamin D 12.4% at one year"}},{"t":"A protein called NUDT5 decides who a 70-year-old leukaemia drug actually works on","s":"CeMM in Vienna with Oxford, the Weizmann Institute and Dundee found that response to 6-thioguanine, used against leukaemia for seven decades, depends on NUDT5 acting as a scaffold organising cellular metabolism rather than as an enzyme. The use-case is a biomarker: NUDT5 status could predict which patients an old, cheap, off-patent drug will kill cancer cells in, and which it will not.","tag":"Health","imp":"important","glance":"A biomarker for an old leukaemia drug","url":"https://www.sciencedaily.com/releases/2026/09/260923035932.htm","published":"2026-09-24T12:47:28Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Old drug gets a response marker","basis":"CeMM/Oxford/Weizmann/Dundee; NUDT5 scaffold role governs 6-TG response"}},{"t":"Failing nerve-to-muscle signalling explains a large part of age-related weakness","s":"A University of Missouri team led by W. David Arnold found that transmission between nerves and muscle becomes unreliable with age and that this contributes to sarcopenia, which affects nearly half of adults over 80, and identified a protein that could improve how ageing muscle responds to nerve signals. That protein is the drug target; the work is mechanistic and preclinical, and it reframes age-related weakness as a wiring problem rather than only muscle loss.","tag":"Health","imp":"important","glance":"Age-related weakness is partly a wiring fault","url":"https://www.sciencedaily.com/releases/2026/09/260923035924.htm","published":"2026-09-24T12:25:18Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Sarcopenia gets a signalling target","basis":"Univ. of Missouri; unreliable neuromuscular transmission plus a candidate protein"}}]},"scienceDailyUpdated":"2026-09-26T02:38:34Z","life":{"updated":"2026-09-26T02:38:34Z","items":[]},"lifeUpdated":"2026-09-26T02:38:34Z","mind":{"updated":"2026-09-26T02:38:34Z","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"Neighbouring visual areas argue it out, and the disagreement dies within a fraction of a second","s":"In Nature Neuroscience, Mitra Javadzadeh at Cold Spring Harbor Laboratory with colleagues at Cambridge and UCL recorded two adjacent regions of visual cortex and found that when their activity patterns matched, the shared pattern persisted, while conflicting patterns faded within a fraction of a second. That gives a concrete mechanism for how specialised brain areas settle on one coherent percept instead of several competing ones; peer-reviewed, in animals.","url":"https://www.sciencedaily.com/releases/2026/09/260923035929.htm","published":"2026-09-24T13:28:15Z","src":"Nature Neuroscience","assess":{"mag":4,"timeline":"unclear","evidence":"strong","verdict":"Perception settled by cortical disagreement","basis":"Nature Neuroscience; paired recordings in adjacent visual areas"},"eli":"Your eyes often send in something ambiguous — a shadow that looks like a face. Two nearby parts of the visual brain each make a guess, compare notes, and the losing guess is dropped in under a second. That is how you end up seeing one thing instead of two."}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"A Neuralink implant gave a man with ALS his voice back through thought-to-speech","s":"In Neuralink's VOICE trial, a participant with ALS produced spoken words directly from decoded neural activity rather than by spelling with a cursor. Thought-to-speech at conversational intent is the capability that separates a communication aid from a usable voice, and this is a human clinical result, though from a single-participant early-feasibility trial.","url":"https://www.mobihealthnews.com/news/neuralink-brain-implant-helps-man-als-speak-using-his-thoughts","published":"2026-09-23T20:00:00Z","src":"MobiHealthNews","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Speech decoded straight from intent","basis":"Neuralink VOICE trial; single participant, early feasibility"},"eli":"ALS took away this man's ability to speak. A chip reading his brain turned what he intended to say straight into spoken words."}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"CDC data show US teenage mental health improving for the first time in over a decade","s":"National CDC surveillance found measures of adolescent mental health improving, reversing a decline that had run since the early 2010s. The size of the dataset is what makes it load-bearing — this is population surveillance rather than a single cohort — though surveillance data cannot say what caused the turn.","url":"https://www.psychologicalscience.org/news/mental-health-among-teenagers-is-improving-cdc-finds.html","published":"2026-09-24T19:30:00Z","src":"APS / CDC","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"A decade-long decline turns","basis":"CDC national adolescent surveillance; cause not identified"}}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Nothing new today in this area","s":"No Major or Historic peer-reviewed result in this area in the last 72 hours after scanning the full feed set.","url":"","published":"","src":""}]}]},"mindUpdated":"2026-09-26T02:38:34Z","mindset":{"updated":"2026-09-26T02:38:34Z","messages":[{"who":"Joseph Rodrigues","t":"I'm begging you to vibrate correctly","vid":"8Ev0-sCjFVI","url":"https://www.youtube.com/watch?v=8Ev0-sCjFVI","gist":"Rodrigues argues that most people who get stuck in personal development have been taught to suppress desire rather than act on it, until they can no longer tell the life they actually want from the one their conditioning handed them. His own turning point was reading Think and Grow Rich at 24 and picking one definite aim — clearing $50,000 of debt by holding the picture of $25,000 in the bank — which he says worked, and taught him that the desire itself is the instruction, not the problem. The practical method he lands on is unglamorous: keep thinking, feeling and acting from the frequency you want, and put yourself in the environments and skill-building that belong to that version of your life, so you stop drifting between other people's programming. He is also blunt that leaving a draining situation is sometimes the answer and sometimes not — staying to fix it can lock you into the same swing — and that the nervous-system benefits people chase separately come as a by-product of simply doing what you actually want to be doing."},{"who":"Elmer O. Locker Jr","t":"It's not an accident you're seeing this video","vid":"8u-1KTMqDaQ","url":"https://www.youtube.com/watch?v=8u-1KTMqDaQ","gist":"A short reminder that the moment you are in is not random and not a detour. Locker's framing is that the timing of what reaches you — a message, an opportunity, a person — is part of the same unfolding as everything you have been working toward, and that the appropriate response to a delay is not to force a different outcome but to stay open to the one already arriving. The practical instruction underneath the encouragement is to stop treating the present stretch as wasted time, because the preparation happening in it is what makes the next chapter usable when it comes."},{"who":"AH Universe","t":"New Thought, New Thing, New Life","vid":"ZdU_MPrBOnk","url":"https://www.youtube.com/watch?v=ZdU_MPrBOnk","gist":"The session reframes \"thoughts become things\" as a matter of degree rather than a switch: a thought gains momentum, and as it builds, more of it becomes perceptible — first as an impulse, then an idea, then words, then something you can act on. The practical instruction is to stop auditing whether the thing has arrived yet and instead read how the becoming feels, because that feeling is the only reliable gauge of how much of it you are currently letting yourself notice. Wanting to pin it down, name it, or convene a group to discuss it is treated as a subtle form of lack — the demand for evidence interrupts the very momentum it is checking on."}]},"mindsetUpdated":"2026-09-26T02:38:34Z","youtube":{"count":5,"note":"5 of today's uploads carried usable captions. YouTube bot-challenged this runner for the rest (33 dropped rather than shown without a real takeaway).","groups":[{"h":"🤖 AI & Technology","items":[{"vid":"SA9kdAX2Zj0","handle":"@TwoMinutePapers","t":"Claude Opus 5.5 AI: An Incredible Leap Forward","s":"Opus 5.5 reproduced two hard research simulations — honey-coiling fluid dynamics and muscle-and-bone locomotion of virtual characters — that GPT-6 Astra could not manage, and ran the fluid case in real time inside a single clickable HTML file. The presenter then reads the system card against the hype: the model still detects when it is being evaluated and may behave differently, it can run unattended for over 18 hours, hallucinations are unsolved, and 16 of 18 tests passed a strict quality bar with the two failures undiscussed.","glance":"Opus 5.5 nails research-grade physics sims, but the system card still shows evaluation-awareness and unsolved hallucination.","url":"https://www.youtube.com/watch?v=SA9kdAX2Zj0","published":"2026-09-25T07:10:00Z","src":"Two Minute Papers","subject":"ai","dur":310},{"vid":"c1rPlzxSZ8E","handle":"@Fireship","t":"Zuck is lying to you... again","s":"At Meta Connect 2026 Zuckerberg reframed the metaverse as never having been the plan and presented Muse, a personal AI agent that runs in glasses, on a Mac, in your inbox and on a keychain device, given away free while Meta takes a cut of every purchase it makes for you. It runs Muse Spark 1.3, has its own email address so you can CC it on threads, browses and operates your computer, and Meta has opened connectors to third-party developers — with the privacy claim resting on an isolated Linux VM Meta says even it cannot see into.","glance":"Meta's free Muse agent monetises by taking a cut of the purchases it makes on your behalf.","url":"https://www.youtube.com/watch?v=c1rPlzxSZ8E","published":"2026-09-26T01:00:00Z","src":"Fireship","subject":"tech","dur":338},{"vid":"HxT_lJBBKoE","handle":"@dylan_curious","t":"Birth of A Nation","s":"A roundup spanning robot form factors, sensing without vision, surveillance law and agent economics: the through-line is that capability is increasingly coming from changing a system's physics or context rather than adding parts.","glance":"Robots are gaining ability by reshaping their own physics — shifting internal mass or feeling by touch — rather than adding sensors.","url":"https://www.youtube.com/watch?v=HxT_lJBBKoE","published":"2026-09-26T00:10:00Z","src":"Dylan Curious","subject":"ai","dur":1278,"pointsLabel":"Each story in this episode","points":[{"t":"Worm-A moves by sloshing its own water ballast","s":"A 50cm worm robot pumps about 300g of water — 28% of its mass — between head and tail tanks. Weight forward presses the front down for traction when climbing; weight aft made it 26% faster and 52% more efficient in water. One body adapts to both environments instead of needing a separate tool per environment."},{"t":"A whiskered drone flies in total darkness by touch","s":"A drone with rat-like whiskers follows walls with no optical flow available, relying on tactile contact to stay near a surface, with AI learning the control policy. It is a route to navigation where cameras are useless."},{"t":"A robot vacuum's camera became evidence in a Taiwan affair case","s":"A man in Taiwan caught his wife cheating by tapping the camera on his robot vacuum, opening a live argument about whether that access is lawful and how anyone is supposed to trust a household device that can be reached this way."},{"t":"Network Nations argues AI communities could out-compete governments","s":"The primer imagines managed communities of thousands to millions of AI agents negotiating shared resources and moving faster than any state, with the claim that such communities must compete for members in a way real governments never have to, because leaving a country is genuinely hard."},{"t":"GPT-6 Astra decrypted an 83-year-old Nazi radio message","s":"Astra solved a wartime radio message that had gone unbroken for 83 years. The presenter's practical read is that Astra is cheaper than Fable and weaker at long-horizon thinking, but cheap enough to run at a scale where a few thousand dollars of tokens can attack problems nobody has previously aimed real reasoning at."}]},{"vid":"3nTpW52nioI","handle":"@Asianometry","t":"High Bandwidth Flash Is Coming","s":"High Bandwidth Flash is memory makers' answer to the capacity squeeze in AI inference. Sandisk is pitching HBF beside HBM at the same tier, with HBM holding the hot data and HBF the warmer, read-mostly data — most likely model weights. Swapping a GPU's eight 24GB HBM stacks for six HBF plus two HBM takes total memory from about 192GB to roughly 3.12TB. The catch, per Hot Chips architects and a Peking University paper, is that systems are judged on tokens served, and cheap capacity does not mean cheap tokens if the accelerator waits on the flash, so it needs serious software work and suits mixture-of-experts models best.","glance":"Swapping some HBM for High Bandwidth Flash takes a GPU from ~192GB to ~3.12TB, but only pays off if software picks what to store.","url":"https://www.youtube.com/watch?v=3nTpW52nioI","published":"2026-09-25T07:00:00Z","src":"Asianometry","subject":"tech","dur":1240}]},{"h":"🔬 Science & Ideas","items":[{"vid":"A2ImadKWaHA","handle":"@SabineHossenfelder","t":"FINALLY: A Proof that Particles Take All Paths At Once?","s":"A team in China claims to have experimentally shown that Feynman's path integral — the idea that a quantum particle takes every possible route at once — is physical reality rather than one interpretation of the mathematics. Hossenfelder walks through why the path integral gives the same answers as the Schrödinger equation while offering a visual picture, and why the many-paths reading has been used, including in a Google quantum-computing press release, to argue for a multiverse. Her caution is that an experiment consistent with the maths does not settle an 80-year interpretation argument.","glance":"A claimed experimental proof of Feynman's all-paths picture still cannot settle which interpretation of quantum mechanics is right.","url":"https://www.youtube.com/watch?v=A2ImadKWaHA","published":"2026-09-25T07:00:00Z","src":"Sabine Hossenfelder","subject":"science","dur":406}]}]},"elon":{"day":"2026-09-25","source":"@jcub2x daily recap","note":"Today's @jcub2x recap (50 posts, 25 Sep) was found but its captions could not be retrieved — YouTube rate-limited this run — so the per-post list is empty rather than guessed. The highlight and the news list below are today's real coverage.","items":[],"highlight":{"t":"Musk says SpaceX could reach GPT-6-level AI within three months","s":"Musk claimed the merged SpaceX-xAI operation could have GPT-6-level capability inside three months and be in 'pole position' within six, tied to a large GPU expansion at the Colossus II site. Separately he said AI progress now makes his head spin and pointed his attention toward real-world engineering. Treat the timeline as a stated target, not a delivered result.", 5% of Brussels tests before the EU vote","s":"Testing in Brussels found Tesla's Full Self-Driving over the limit in 55% of runs ahead of a European approval vote that has now slipped past October. Approval is the gate on FSD revenue in Europe.","url":"https://autos.yahoo.com/tesla-fsd-drove-over-limit-55-percent-brussels-tests","published":"2026-09-26T05:45:00Z","src":"Yahoo Autos"},{"t":"Major social platforms are refusing paid ads for the Alex Gibney Musk documentary","s":"Every major social platform has reportedly declined paid advertising for Alex Gibney's documentary 'Musk' ahead of its 9 October release, according to The Hollywood Reporter.","url":"https://www.hollywoodreporter.com/business/business-news/social-media-platforms-rejecting-ads-alex-gibney-musk-documentary/","published":"2026-09-26T04:00:00Z","src":"The Hollywood Reporter"},{"t":"xAI launches a rewards programme for Grok bot creators","s":"xAI opened a creator-rewards programme for Grok bots, paying out on usage — the same playbook platforms used to seed third-party app ecosystems.","url":"https://basenor.com/xai-launches-grok-bot-creator-rewards-program","published":"2026-09-26T04:30:00Z","src":"Basenor"},{"t":"Missouri man pleads guilty over the Kansas City Tesla centre attack","s":"A man pleaded guilty to shooting at and setting fire to a Cybertruck at a Kansas City Tesla dealership, one of the prosecutions following last year's wave of attacks on Tesla property.","url":"https://www.kctv5.com/2026/09/25/missouri-man-pleads-guilty-cybertruck-kansas-city-tesla/","published":"2026-09-26T03:20:00Z","src":"KCTV"}],"elonNewsUpdated":"2026-09-26T02:38:34Z","costs":{"updated":"2026-09-26T01:45:54+00:00","items":[{"key":"usdinr","label":"USD/INR","unit":"INR","value":95.82,"delta":-0.14,"delta_pct":-0.1459,"dir":"down","asof":"2026-09-25","src":"Frankfurter (ECB ref)","url":"https://www.frankfurter.app/","stale":false},{"key":"brent","label":"Brent crude","unit":"USD/bbl","value":104.32,"delta":-2.28,"d function bigScore(it){

  const im={critical:3,important:2,interesting:1,noise:0}[(it&&it.imp||"").toLowerCase()]||0;
  const heat=Math.max(0,Math.min(100,+((it&&it.heat)||0)))/100;
  if(typeof (it&&it.big)==="number") return it.big;   // explicit override
  let rec=0; try{ const t=Date.parse((typeof pubDate==="function"?pubDate(it):"")||""); if(!isNaN(t)) rec=Math.max(0,Math.min(1,1-(Date.now()-t)/(72*3600*1000))); }catch(e){}

}

    if(id==="elon") return ((DATA.elon&&DATA.elon.items)||[]).length;
    if(id==="mind"){let n=0;((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=((g.items)||[]).filter(isMajor).length);n+=((DATA.mindset&&DATA.mindset.messages)||[]).length;return n;}
    if(id==="som") return ((window.__SOM&&window.__SOM.pages)||[]).length;
  }catch(e){}
  return 0;
}
function setSlimHeader(id){
  const meta=TAB_META[id]||[id,""]; const nm=document.getElementById("slimName"), ct=document.getElementById("slimCount");
  try{ const em=document.getElementById("slimEmoji"); if(em){ const tb=TABS.find(t=>t.id===id); em.textContent=tb?tb.icon:""; } }catch(e){}
  if(nm) nm.textContent=meta[0];
  if(ct){ const n=slimCountFor(id); ct.textContent=(n&&meta[1])?(n+" "+meta[1]):""; }
  try{ const dt=document.getElementById("slimDate"); if(dt) dt.textContent=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:""; }catch(e){}
}
function activate(id,opts){
  document.body.dataset.tt=id;
  setSlimHeader(id);
  TABS.forEach(t=>{ const el=document.getElementById("p-"+t.id); if(el) el.classList.toggle("active",t.id===id); });
  ensureRendered(id);
  try{ armReveals(document.getElementById("p-"+id)); }catch(e){}
  [...nav.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreMenu) [...moreMenu.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreBtn) moreBtn.classList.toggle("active",overflow.some(t=>t.id===id));
  store.set("tab",id);
  kbdIdx=-1; clearKbdCur(); applyFilter();
  if(!(opts&&opts.keepScroll)){ try{ window.scrollTo(0,0); }catch(e){} try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
}
// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();
