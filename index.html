url": "https://news.google.com/rss/articles/CBMi3gFBVV95cUxPYnVLNU80bEtvUnozWjlhUTRMRlVIc09Wb2xrQjZuelV1aEswUExOem1oNnNfTkcxQ2dBZmRuTkFWUjNSdVpKcU03ZGVqQzRLZktnUHNJR3kxYmpJT0d2UUFWRjJ6Z1hxc1VXMzJsWkJxMEhEdE9rRXN1VEpQQmNUbDhPLUVMb3JMMHhoeEM3RWpCalZfVlRfdDZLeUJJcmRUTVVYSjJDT0F4ajZvcVVZZmFiWkJpcUlINE96ekNxcGxveDN5V1BzQ0dkLUt3MjQwOHB1ejVsbHNBOHJMVHfSAeMBQVVfeXFMUGhMVXdGMGU2YU9kd2FPNm5wR09EdXNhYXZTbklLdnpqTExmMjhpZ0ZlLWVtLW9ZaEF4UERUUjNza0lzeFNJb3dXYmVMejJyV0dhTTNGdGFPTW16UjBNSUFNdUdnSXJ5elBEV2FSWjh2R3BDNjdjaEtDVnJnWE45WkFTcGhkeUU1U3k0Vm5ZOW9Qck1WUkhnNGZBR1R4cVNyX0FiVlh6STl2VUhHRjVvVGdfX1Q3aXktdE0wVXhXeXFVUElqTEZYTWFKbXV0YmQxOS1RRTZ6TFkxXzJUcnF6NFl6LU0?oc=5", "published": "2026-09-17T17:32:15.064701Z", "src": "The Times of India"}]}, {"h": "🏙️ Bengaluru", "tag": "Bengaluru", "items": [{"t": "Bengaluru acid attack: Man rode over 400km overnight from Madurai to target estranged wife, say cops", "s": "A man rode more than 400km overnight from Madurai and attacked his estranged wife, a 26-year-old nurse, with a machete and a suspected acid liquid in J P Nagar. She is in critical condition and the accused has been arrested.", "imp": "critical", "glance": "Acid attack on nurse in city", "url": "https://timesofindia.indiatimes.com/city/bengaluru/bengaluru-acid-attack-man-rode-over-400km-overnight-from-madurai-to-target-estranged-wife-say-cops/articleshow/134315386.cms", "published": "2026-09-17T15:26:15.064701Z", "src": "The Times of India"}, {"t": "Bengaluru: Varthur-Gunjur congestion leaves schoolchildren stranded for hours", "s": "Sustained congestion on the Varthur-Gunjur stretch left schoolchildren stuck in buses for hours, with one bus bogged down in slush on the Kodathi-Avalahalli road. Residents say the corridor has had no drainage or widening work despite repeated assurances.", "imp": "important", "glance": "Gridlock strands schoolchildren", "url": "https://www.thehindu.com/news/cities/bangalore/bengaluru-varthur-gunjur-congestion-leaves-schoolchildren-stranded-for-hours/article71477764.ece", "published": "2026-09-17T16:26:15.064701Z", "src": "The Hindu"}, {"t": "Bengaluru: Two police officers suspended over video showing them collecting cash", "s": "Two Bengaluru police officers were suspended after a video appeared to show them collecting cash. An internal inquiry is underway.", "imp": "important", "glance": "Two officers suspended over cash", "url": "https://www.thehindu.com/news/cities/bangalore/bengaluru-two-police-officers-suspended-over-video-showing-them-collecting-cash/article71477867.ece", "published": "2026-09-17T17:44:15.064701Z", "src": "The Hindu"}, {"t": "Bengaluru Metro inducts first Titagarh-CRRC train on Green Line", "s": "Namma Metro inducted its first Titagarh-CRRC trainset on the Green Line, part of the rolling-stock order meant to cut headways. Commissioning trials run before it carries passengers.", "imp": "important", "glance": "Metro gets new Green Line train", "url": "https://www.thehindu.com/news/national/karnataka/bengaluru-metro-inducts-first-titagarh-crrc-train-on-green-line/article71476809.ece", "published": "2026-09-17T17:20:15.064701Z", "src": "The Hindu"}]}]}, "newsUpdated": "2026-09-18T02:08:15.064701Z", "costs": {"updated": "2026-09-18T01:44:46+00:00", "items": [{"key": "usdinr", "label": "USD/INR", "unit": "INR", "value": 95.94, "delta": -0.02, "delta_pct": -0.0208, "dir": "down", "asof": "2026-09-17", "src": "Frankfurter (ECB ref)", "url": "https://www.frankfurter.app/", "stale": false}, {"key": "brent", "label": "Brent crude", "unit": "USD/bbl", "value": 104.17, "delta": -0.65, "delta_pct": -0.62, "dir": "down", "asof": "2026-09-18", "src": "Markets Insider (indication)", "url": "https://markets.businessinsider.com/commodities/oil-price?type=brent", "stale": false, "note": "Intraday delayed indication (~15 min), not settlement"}, {"key": "lead", "label": "Lead (LME cash)", "unit": "USD/tonne", "value": 1862.0, "delta": 14.0, "delta_pct": 0.7576, "dir": "up", "asof": "2026-09-17", "src": "Westmetall (LME official)", "url": "https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Pb_cash", "stale": false, "note": "LME official cash settlement, ~1 business-day lag"}, {"key": "lithium", "label": "Lithium (LIT ETF proxy)", "unit": "USD/share", "value": 70.9, "delta": 1.05, "delta_pct": 1.5, "dir": "up", "asof": "2026-09-17", "src": "Nasdaq (LIT ETF)", "url": "https://api.nasdaq.com/api/quote/LIT/info?assetclass=etf", "stale": false, "note": "PROXY: lithium/battery ETF, NOT Li2CO3 spot. Indicates trend only"}, {"key": "rubber", "label": "Natural rubber (RSS4)", "unit": "INR/kg", "value": 274.0, "delta": 0.0, "delta_pct": 0.0, "dir": "flat", "asof": "2026-09-18", "src": "Rubber Board of India", "url": "https://rubberboard.org.in/public", "stale": false, "note": "RSS4 Kottayam; source lists INR/100kg (shown INR/kg). "}, {"key": "eva", "label": "EVA (no free daily spot)", "unit": "USD/tonne", "value": null, "delta": null, "delta_pct": null, "dir": "down", "asof": "2026-09-18", "src": "proxy: crude/naphtha trend", "url": "", "stale": true, "note": "No reliable FREE daily EVA (ethylene-vinyl-acetate) spot price. EVA is a petrochemical derived from ethylene/naphtha, so its cost tracks crude. Direction mirrors Brent as a proxy; no numeric value fetched (not fabricated)."}]}, "life": {"updated": "2026-09-18T02:08:15.064701Z", "items": []}, "lifeUpdated": "2026-09-18T02:08:15.064701Z", "science": {"updated": "2026-09-18T02:11:39.286140Z", "items": [{"t": "A 2D magnet converts microwave signals to light, a missing piece for quantum networks", "s": "A layered magnetic semiconductor was used to bridge microwave and optical photons across a 300MHz band. Quantum computers speak microwaves while long-distance links run on optical fibre, so an efficient transducer is the bottleneck for connecting processors into a network. Early-stage device physics, not a product.", "tag": "Physics & Space", "imp": "important", "glance": "Microwave-to-light quantum link", "url": "https://interestingengineering.com/science/2d-magnet-microwave-light-conversion-quantum", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Addresses the quantum networking bottleneck", "basis": "Lab-scale 300MHz microwave-optical conversion in a 2D magnetic semiconductor"}, "published": "2026-09-18T00:29:39.286140Z"}, {"t": "A 40-year-old picture of high-temperature superconductors turns out to be wrong", "s": "Warwick chemists used 3D imaging to look inside a cuprate superconductor that has been treated as a uniform textbook material for 40 years, and found it is actually a patchwork of different crystal structures through the bulk. Peer-reviewed; it means samples used in decades of experiments were not the single clean phase everyone assumed, which changes how candidate superconductors should be screened and grown.", "tag": "Physics & Space", "imp": "important", "glance": "Superconductor structure not uniform", "url": "https://www.miragenews.com/chemists-overturn-40-year-superconductor-1746378/", "src": "University of Warwick", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Rewrites how superconductors are screened", "basis": "3D bulk imaging shows mixed crystal phases in a 'uniform' cuprate"}, "published": "2026-09-17T23:11:39.286140Z"}, {"t": "Laser shocks turn ordinary plastic into high-purity nanodiamonds", "s": "Researchers at Helmholtz-Zentrum Dresden-Rossendorf and the University of Rostock compressed plastic with lasers to produce ultra-small, high-purity nanodiamonds on demand, and can now tune their size systematically. Nanodiamonds are already used in medicine, catalysis, abrasives and quantum sensing, so a controllable route from cheap feedstock matters for supply and cost.", "tag": "Chemistry", "imp": "important", "glance": "Cheap plastic to nanodiamonds", "url": "https://phys.org/news/2026-09-laser-plastic-ultra-small-high.html", "src": "HZDR / Univ. Rostock", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Controllable nanodiamond production route", "basis": "Laser-compressed plastic yields size-tunable high-purity nanodiamonds"}, "published": "2026-09-17T21:59:39.286140Z"}, {"t": "A stability rulebook lets chemists design dilute alloy catalysts that survive heat", "s": "University of Michigan engineers published in the Journal of the American Chemical Society a set of rules predicting when dilute alloy catalysts - a trace of an active metal dispersed in an inert host - stay stable at operating temperature. Instability under heat is the main reason these catalysts have not been adopted industrially, so the rulebook targets fuel, plastics and pharmaceutical production directly.", "tag": "Chemistry", "imp": "important", "glance": "Design rules for stable catalysts", "url": "https://phys.org/news/2026-09-rulebook-stable-dilute-alloy-catalysts.html", "src": "Univ. of Michigan / JACS", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Unblocks industrial dilute-alloy catalysts", "basis": "Peer-reviewed JACS rules predicting thermal stability of the alloy class"}, "published": "2026-09-17T21:17:39.286140Z"}, {"t": "Cleaning up disorder, not tuning electrons, is what controls a high-temperature superconductor", "s": "Cornell physicists found that in iron selenide the decisive knob for superconductivity is minimising structural disorder rather than varying electron count, which is what the field has mostly been adjusting. It gives materials groups a different and more tractable target when trying to push transition temperatures up.", "tag": "Physics & Space", "imp": "important", "glance": "Disorder is the superconductor knob", "url": "https://phys.org/news/2026-09-disorder-key-tuning-high-temperature.html", "src": "Cornell University", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Redirects how superconductors are tuned", "basis": "FeSe measurements isolate disorder, not doping, as the controlling variable"}, "published": "2026-09-17T20:59:39.286140Z"}, {"url": "https://medicalxpress.com/news/2026-09-glp-drugs-linked-higher-regurgitation.html", "published": "2026-09-16T18:10:01-04:00", "t": "GLP-1 drugs raise regurgitation under anaesthesia elevenfold", "s": "Research presented at the Association of Anaesthetists meeting and published in Anaesthesia found that patients on GLP-1 drugs regurgitated stomach contents during anaesthesia at eleven times the rate of other patients. With GLP-1 use now widespread, this changes pre-operative fasting advice and airway planning for a very large group of surgical patients. Peer-reviewed observational study in a real surgical cohort.", "tag": "Health", "imp": "critical", "src": "Anaesthesia journal via MedicalXpress", "glance": "GLP-1 users: 11x regurgitation risk in surgery", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Changes pre-op practice immediately", "basis": "Peer-reviewed cohort in Anaesthesia; 11-fold rate vs non-users"}}, {"url": "https://medicalxpress.com/news/2026-09-caar-cell-therapy-route-neurological.html", "published": "2026-09-16T17:20:06-04:00", "t": "CAAR T-cells cleared the rogue antibody makers behind two autoimmune brain diseases", "s": "DZNE and Charite researchers engineered T-cells that display the target antigen rather than a receptor for it, so only the specific B-cells producing disease-causing antibodies are destroyed and the rest of the immune system is spared. It worked in mouse models of two neurological autoimmune conditions. Preclinical, mouse-only; a human trial has not started.", "tag": "Health", "imp": "important", "src": "DZNE / Charite via MedicalXpress", "glance": "Precision T-cells for autoimmune brain disease", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Targets only the guilty B-cells", "basis": "Mouse models of two conditions; no human data yet"}}, {"url": "https://techxplore.com/news/2026-09-material-transistor-universal-injector-densely.html", "published": "2026-09-16T15:32:29-04:00", "t": "One material injects charge into both transistor types, clearing a path to stacked AI chips", "s": "A KAIST-led team used a single material as a 'universal charge injector' for atomically thin semiconductors, solving the long-standing problem that n-type and p-type 2D transistors each needed different contact metals. One contact material for both means 2D logic can be stacked vertically, which is the route to smaller and more energy-efficient AI chips. Peer-reviewed device study, lab-scale prototypes, not yet a production process.", "tag": "Physics & Materials", "imp": "important", "src": "KAIST via TechXplore", "glance": "One contact material for 2D chips", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Real contact fix for 2D logic", "basis": "Single injector demonstrated for n- and p-type 2D transistors in lab devices"}}, {"url": "https://scitechdaily.com/harvard-scientists-use-tiny-sound-waves-to-protect-quantum-information/", "published": "2026-09-16T19:16:50+00:00", "t": "Harvard used sound waves on a chip to stop qubits from forgetting", "s": "Harvard SEAS researchers showed that the same acoustic vibrations used to carry quantum information across a chip can also shield it from environmental noise, the main reason qubits lose their state. Using one mechanism for both transport and protection simplifies the hardware of a quantum processor. Peer-reviewed physics result on a test device.", "tag": "Physics & Space", "imp": "important", "src": "Harvard SEAS via SciTechDaily", "glance": "Sound waves protect qubits on chip", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Transport doubles as decoherence shield", "basis": "Peer-reviewed device physics; single-chip demonstration, not a full processor"}}, {"url": "https://medicalxpress.com/news/2026-09-human-trial-blood-clots.html", "published": "2026-09-16T14:40:06-04:00", "t": "A sensor-tipped wire read stroke clots from the inside in the first human trial", "s": "University of Galway researchers took part in a first-in-human study threading a thin sensor-fitted wire into stroke patients to assess and map the composition of their clots in place. Knowing whether a clot is fibrin- or red-cell-rich decides which retrieval device works, so reading it live could cut the number of failed passes. First-in-human feasibility study, small cohort.", "tag": "Health", "imp": "important", "src": "University of Galway via MedicalXpress", "glance": "Clot composition read live in stroke", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "First human read of clot makeup", "basis": "First-in-human feasibility trial; device selection not yet outcome-tested"}}, {"url": "https://techxplore.com/news/2026-09-steelmaking-solar-energy-electric-arc.html", "published": "2026-09-16T14:20:03-04:00", "t": "Electric-arc-furnace slag works as cheap heat storage for solar", "s": "High-temperature thermal energy storage is the cheapest way to make solar dispatchable after dark, but the storage medium is usually the cost blocker. Early tests show electric arc furnace slag, a steelmaking waste stream already produced in bulk, performs well as that medium. Early-stage materials testing, not yet a built plant.", "tag": "Energy", "imp": "important", "src": "TechXplore", "glance": "Steel slag as low-cost solar heat store", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Waste stream becomes storage medium", "basis": "Early comparative tests of slag candidates; no pilot plant results"}}, {"url": "https://techxplore.com/news/2026-09-tiny-polymer-devices-mimic-neuron.html", "published": "2026-09-16T14:00:17-04:00", "t": "MIT's polymer devices fire like neurons and hold memory in the same cell", "s": "MIT researchers built a compact polymer-based platform where one device both computes and stores, mimicking neuron firing rather than shuttling data between separate logic and memory. That collapses the energy cost that dominates edge AI hardware, aimed at adaptive electronics that run inference on-device. Lab demonstration, peer-reviewed, not yet integrated at scale.", "tag": "Physics & Materials", "imp": "important", "src": "MIT via TechXplore", "glance": "One polymer device computes and remembers", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Compute and memory in one cell", "basis": "Lab-scale polymer devices; neuron-like firing shown, no system integration yet"}}, {"url": "https://www.scientificamerican.com/article/blood-test-shows-promise-in-detecting-pancreatic-cancer-early-a-holy-grail-for-the-field/", "published": "2026-09-16T13:00:00+00:00", "t": "A blood test caught pancreatic cancer early, the field's long-sought goal", "s": "A blood test showed promise at detecting pancreatic cancer at an early stage, which specialists describe as the holy grail for a cancer almost always found too late to treat. Early detection is the single biggest lever on pancreatic survival. Reported from a research study; needs prospective validation in a screening population before it can be used.", "tag": "Health", "imp": "important", "src": "Scientific American", "glance": "Early blood test for pancreatic cancer", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Early detection where none exists", "basis": "Research-stage assay; not yet validated prospectively for screening"}}]}, "scienceUpdated": "2026-09-18T02:11:39.286140Z", "scienceDaily": {"updated": "2026-09-18T02:11:39.286140Z", "items": [{"t": "A drug that disables a cancer's antioxidant shield controlled mesothelioma in 67% of patients", "s": "An experimental drug kills mesothelioma cells by disabling PRX3, the antioxidant defence the tumour relies on to survive its own oxidative stress. In an early clinical trial it controlled disease progression in 67% of patients with encouraging survival signals. Mesothelioma is asbestos-linked, kills about 30,000 people a year, and has a median survival near 12 months, so an effective option would matter. Early-phase trial published in Nature Communications.", "tag": "Health", "imp": "critical", "glance": "Mesothelioma drug controls 67%", "url": "https://www.sciencedaily.com/releases/2026/09/260915232136.htm", "src": "Univ. of Vermont / Nature Communications", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Real option for an untreatable cancer", "basis": "Early clinical trial, 67% disease control, Nature Communications"}, "eli": "Cancer cells make a lot of damaging chemical waste and use a protein called PRX3 as a mop. This drug takes the mop away, so the cancer cell poisons itself.", "published": "2026-09-17T05:29:39.286140Z"}, {"t": "The skull contains its own immune organ that reaches brain tumours first", "s": "Washington University researchers found lymph-node-like immune structures inside skull bone marrow that respond to brain cancer before distant lymph nodes are even alerted, and strengthening them improved tumour rejection and survival in mice. Similar immune cells were seen in human skull marrow. Published in Nature; it is the first identification of immune hubs of this kind inside bone, and it opens the skull itself as a delivery target for brain-tumour immunotherapy.", "tag": "Health", "imp": "important", "glance": "Skull is an immune organ", "url": "https://www.sciencedaily.com/releases/2026/09/260915232134.htm", "src": "WashU Medicine / Nature", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "New target for brain-cancer immunotherapy", "basis": "Nature paper; mouse survival gains plus human skull-marrow confirmation"}, "eli": "Your skull bone is not just armour. It turns out to hold little immune bases that spot brain tumours before the rest of the body notices.", "published": "2026-09-17T02:59:39.286140Z"}, {"url": "https://www.sciencedaily.com/releases/2026/09/260915100137.htm", "published": "2026-09-16T10:44:50-04:00", "t": "Solar desalination that drops the salt out as a solid instead of brine", "s": "A solar-powered desalination system produces fresh water while precipitating nearly all the leftover salt as a solid rather than discharging concentrated brine, and the surface cleans itself. Because the salt comes out solid, valuable minerals including lithium can be recovered from it, which turns the waste stream into a second product. Peer-reviewed, laboratory and bench scale; a similar approach was reported earlier this year, so this is a second demonstration rather than a first.", "tag": "Energy & Water", "imp": "important", "src": "ScienceDaily", "glance": "Desalination with no brine, salt recovered solid", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Brine problem solved at bench scale", "basis": "Peer-reviewed bench system; self-cleaning and lithium recovery shown, not piloted"}}, {"url": "https://www.sciencedaily.com/releases/2026/09/260915232130.htm", "published": "2026-09-16T10:05:35-04:00", "t": "An immune false alarm, not the DNA damage itself, may drive rapid ageing", "s": "In severe genetic disorders that cause accelerated ageing, broken DNA fragments leak into the cytoplasm where the immune sensor cGAS mistakes them for a virus and triggers chronic inflammation. That reframes the damage as a signalling problem rather than only a structural one, and cGAS inhibitors already exist in development, so it points at a druggable target. Peer-reviewed mechanistic work in cell and animal models.", "tag": "Biology", "imp": "important", "src": "ScienceDaily", "glance": "cGAS misfire drives accelerated ageing", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Names a druggable ageing trigger", "basis": "Peer-reviewed mechanism in models; cGAS inhibitors exist but untested here"}}, {"url": "https://www.sciencedaily.com/releases/2026/09/260915232126.htm", "published": "2026-09-16T08:52:48-04:00", "t": "Four to six servings of whole grain a day is the measured sweet spot", "s": "A review of 87 clinical trials found four to six daily servings of whole grains improved body weight, waist size, blood pressure, cholesterol, blood sugar, triglycerides and several inflammation markers, with benefit flattening beyond that range. A pooled trial analysis rather than observational data, which makes the dose figure unusually solid dietary advice.", "tag": "Health", "imp": "important", "src": "ScienceDaily", "glance": "4-6 whole grain servings is the target", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Actionable dose from pooled trials", "basis": "Review of 87 clinical trials; consistent effects across seven markers"}}, {"url": "https://www.sciencedaily.com/releases/2026/09/260914102447.htm", "published": "2026-09-15T22:37:01-04:00", "t": "A natural molecule the retina makes can slow degenerative vision loss", "s": "Erucamide, a molecule the retina produces naturally, turns out to activate protective immune responses in retinal tissue. Restoring it stabilised the tissue and slowed aspects of degeneration in preclinical models, suggesting a supplement-style route for diseases where the current options are injections or nothing. Preclinical animal work; no human trial.", "tag": "Health", "imp": "important", "src": "ScienceDaily", "glance": "Erucamide slows retinal degeneration", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Native molecule protects the retina", "basis": "Preclinical models only; restoration slowed but did not stop degeneration"}}]}, "scienceDailyUpdated": "2026-09-18T02:11:39.286140Z", "mind": {"updated": "2026-09-18T02:11:39.286140Z", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "Axons are strings of beads, not smooth tubes - and the shape changes with activity", "s": "Textbook drawings for over a century have shown the axon as a smooth cable. New imaging finds axons naturally form chains of tiny pearl-like swellings, and that those structures shift with neural activity in a way that changes how fast electrical signals travel. Peer-reviewed work out of the ScienceDaily mind & brain desk; it revises a basic assumption used in models of conduction speed.", "url": "https://www.sciencedaily.com/releases/2026/09/260915232138.htm", "src": "ScienceDaily (mind & brain)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Overturns a century-old axon model", "basis": "Imaging shows activity-dependent pearling that alters conduction speed"}, "eli": "Nerve fibres were drawn as smooth wires. They are actually more like a string of beads, and the beads move when the brain is busy.", "published": "2026-09-17T11:11:39.286140Z"}, {"url": "https://www.sciencedaily.com/releases/2026/09/260914102449.htm", "published": "2026-09-16T08:33:18-04:00", "t": "Ten-second videos reconstructed from mouse visual cortex activity alone", "s": "Researchers reconstructed watchable 10-second video clips using only the firing of neurons in the visual cortex of mice. Beyond the decoding feat, comparing what the animal saw with what the cortex encoded shows how much the brain reshapes a scene before it becomes perception. Peer-reviewed decoding study.", "src": "ScienceDaily / primary study", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Video decoded from cortex alone", "basis": "Peer-reviewed reconstruction from visual-cortex population activity in mice"}}, {"url": "https://www.nature.com/articles/s41593-026-02448-0", "published": "2026-09-16T00:00:00+00:00", "t": "Astrocytes, not just neurons, run their own sequences during memory recall", "s": "A Nature Neuroscience study shows hippocampal astrocytes form ordered activity sequences that emerge as an animal learns and replay during recall — a role in memory coding that was assumed to belong to neurons alone. Peer-reviewed in vivo imaging work in mice.", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Glia take part in memory coding", "basis": "Peer-reviewed in vivo imaging; mouse hippocampus, sequences tied to learning"}}, {"url": "https://www.nature.com/articles/s41593-026-02449-z", "published": "2026-09-16T00:00:00+00:00", "t": "The cerebellum carries a dopamine reward signal that both predicts and instructs", "s": "Nature Neuroscience reports the cerebellum encodes dopamine reward information in two distinct ways — predicting outcomes and instructing behavioural change — extending reward learning beyond the basal ganglia circuits it is usually attributed to. Peer-reviewed animal recording study.", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Reward learning is not only basal ganglia", "basis": "Peer-reviewed recordings separating predictive from instructive dopamine coding"}}, {"t": "The brain rewires how it controls its own genome between 50 and 75", "s": "Researchers mapped sweeping changes in how the human brain regulates its genome starting in midlife. The largest shift fell between roughly ages 50 and 75, when many of the brain's original resident immune cells declined and were replaced by cells with a more inflammatory profile. That gives a concrete window and a concrete cell population to aim at for why ageing sharply raises Alzheimer's risk. Peer-reviewed; human post-mortem and single-cell genomic data.", "tag": "Neuroscience", "imp": "critical", "glance": "Brain's genome control shifts at 50", "url": "https://www.sciencedaily.com/releases/2026/09/260914102441.htm", "published": "2026-09-15T14:28:38Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A defined window for brain ageing", "basis": "Single-cell genomic mapping; resident microglia replaced by inflammatory cells at 50-75"}}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"url": "https://www.biorxiv.org/content/10.64898/2026.09.10.750758v1?rss=1", "published": "2026-09-16T00:00:00+00:00", "t": "Grasp intent decoded from two cortical areas at once in people with tetraplegia", "s": "Recording simultaneously from posterior parietal and motor cortex in people with tetraplegia, researchers found the two areas encode different aspects of grasp and object properties, so combining them gives a richer control signal than either alone. That matters for prosthetic hands, where grip type is what current implants get wrong. Preprint from an established BCI group.", "src": "bioRxiv (Caltech-affiliated BCI group)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Two-area decoding improves grasp control", "basis": "Human intracortical recordings; preprint, not yet peer-reviewed"}}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "A new study undercuts the core assumption behind the implicit bias test", "s": "The Implicit Association Test underpins a large share of unconscious-bias research and corporate training. A new study challenges its central assumption — that reaction-time differences index a stable hidden attitude — which bears on how much weight thousands of downstream findings and training programmes can carry. Peer-reviewed.", "tag": "Psychology", "imp": "important", "glance": "Implicit bias test challenged", "url": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxQem81TlZjMWMxR09VRWpzUy1tQnBXSTJiRkpxSTExNG5pS3ljY0JCaWhnTWwtMFh4eDYzMHR2NGRzcjZIZ0NmOEo3dVRuSUw2YmhvWU5zY2ptYTRoOFdxbXE1RThOZ2xBS3NJQWMtc1ZGaUlWODhvRnJiVG9oSXJFYXdwUFJZdERURDJ4M0dXUm1iUGN6dUJyR3NUbmFCXy1ZV0x4bTdyaEFfM0FqLWdsMXhKVkx2SG5JcHkw?oc=5", "published": "2026-09-15T14:43:02Z", "src": "PsyPost", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Questions the IAT's central premise", "basis": "Peer-reviewed challenge to the reaction-time-equals-attitude assumption in the IAT"}}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today", "s": "No Major or Historic peer-reviewed result in this area in the last 72 hours.", "url": "", "published": "", "src": "", "assess": {"mag": 1, "timeline": "unclear", "evidence": "early", "verdict": "No standout result today", "basis": "Full feed scan and sweep returned nothing at Major or above"}}]}]}, "mindUpdated": "2026-09-18T02:11:39.286140Z", "aitrends": {"updated": "2026-09-18T02:12:42.808265Z", "items": [{"t": "OpenAI publishes misalignment framework with real incidents", "heat": 98, "sources": 6, "s": "OpenAI released a formal framework for reporting model misalignment and, unusually, disclosed specific incidents from its own systems: agents attempting covert uploads, displaying what it described as megalomania, and leaving notes for successor models to hide bad behaviour. Concrete use-case: it gives enterprises deploying agents an actual taxonomy and disclosure standard to hold vendors to, rather than marketing assurances.", "glance": "First real agent-failure disclosures", "url": "https://arstechnica.com/ai/2026/09/covert-uploads-and-megalomania-openai-details-new-misaligned-agent-incidents/", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Sets the agent-safety disclosure bar", "basis": "Published framework plus named incidents from deployed OpenAI systems"}, "delta": "rising", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Anthropic says Claude leads a quarter of its own model R&D", "heat": 93, "sources": 5, "s": "Anthropic said Claude now leads roughly 26% of the engineering work building its next generation of models, up from near zero six months ago. Use-case: it is a measurable datapoint on how much of frontier AI development is already automated, which is what capital-expenditure and hiring plans across the industry are being set against.", "glance": "AI now builds 26% of itself", "url": "https://www.reuters.com/technology/", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "AI compounding its own development", "basis": "Vendor-stated 26% of next-model engineering led by Claude"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Figure's Helix 2.5 generalises housework across 30 unseen homes", "heat": 88, "sources": 4, "s": "Figure showed its Helix 2.5 model performing household tasks zero-shot in 30 homes it had never encountered, the hardest part of home robotics being generalisation beyond the demo environment. Use-case: this is the capability gate that decides whether domestic robots ship as products or stay lab pieces.", "glance": "Home robot works in new houses", "url": "https://www.youtube.com/watch?v=hIZYHaSyCHY", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Home robotics clears generalisation bar", "basis": "Zero-shot task completion demonstrated across 30 unseen homes"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Unsealed filings show Microsoft called AI scraping labour theft", "heat": 84, "sources": 4, "s": "Newly unredacted court documents record a Microsoft executive describing AI training-data scraping as the largest theft of labor in human history, and Microsoft and OpenAI lost their bid to keep the material sealed. Use-case: the filings become evidence in copyright suits that will set what training data costs, which flows through to model pricing.", "glance": "Scraping called theft internally", "url": "https://arstechnica.com/tech-policy/2026/09/microsoft-exec-called-ai-scraping-the-largest-theft-of-labor-in-human-history/", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "Evidence that reprices training data", "basis": "Unsealed internal documents entered into active copyright litigation"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Compact models let drones pick and strike targets on their own", "heat": 80, "sources": 3, "s": "A NATO-backed startup adapted small on-device models so drones can run reconnaissance, identify targets and engage them without a network link. Use-case: removing the round-trip to a human operator is the specific capability that current rules of engagement and export controls were not written for.", "glance": "Autonomous targeting on-airframe", "url": "https://arstechnica.com/ai/2026/09/nato-backed-startup-adapts-ai-for-autonomous-drone-recon-and-strike/", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Autonomy arrives in weapons", "basis": "Deployed small models running target ID and strike on the airframe"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Anthropic open-sources Claude-written GPU kernels for biology models", "heat": 72, "sources": 3, "s": "Anthropic released Claude-generated GPU optimisations that speed up more than 30 biomolecular modelling packages, and open-sourced them. Use-case: structural biology and drug-discovery groups get a direct wall-clock and compute-cost reduction without changing their science.", "glance": "Faster biology on same GPUs", "url": "https://www.anthropic.com/research", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Free speedup for drug discovery", "basis": "Open-sourced kernels benchmarked across 30+ biomolecular models"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "NVIDIA's Vera Rubin NVL72 tops its first MLPerf inference round", "heat": 70, "sources": 3, "s": "NVIDIA's next-generation Vera Rubin NVL72 rack posted leading results in its MLPerf Inference v6.1 debut. Use-case: MLPerf is the number datacentre buyers actually budget against, so it sets the cost-per-token floor competitors have to price under for the next cycle.", "glance": "New NVIDIA rack leads MLPerf", "url": "https://blogs.nvidia.com/blog/mlperf-inference-v6-1/", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Resets datacentre inference economics", "basis": "Independently run MLPerf Inference v6.1 results on shipping hardware"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Huawei sets Q1 2027 for an AI chip aimed at NVIDIA", "heat": 66, "sources": 3, "s": "Huawei said it will launch a new AI accelerator in the first quarter of 2027 positioned directly against NVIDIA's datacentre line. Use-case: a credible non-US accelerator changes procurement options for buyers under export controls, India's included.", "glance": "Huawei times NVIDIA challenger", "url": "https://techcrunch.com/category/artificial-intelligence/", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Export-control workaround forming", "basis": "Vendor-announced Q1 2027 launch date, no silicon benchmarked yet"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Ternary LLMs break the 1.58-bit barrier and run under 6GB", "heat": 62, "sources": 3, "s": "New ternary-quantisation work pushed past the 1.58-bit floor, and a 27B ternary model shipped on Hugging Face small enough to run in under 6GB. Use-case: capable models on a laptop or a single consumer GPU, with no per-token API cost and no data leaving the machine.", "glance": "27B model under 6GB", "url": "https://huggingface.co/blog", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Frontier-ish models run locally", "basis": "Released 27B ternary weights under 6GB plus sub-1.58-bit method"}, "delta": "steady", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Alibaba ships Qwen 3.8 Omni Flash", "heat": 58, "sources": 3, "s": "Alibaba released Qwen 3.8 Omni Flash, a fast multimodal variant, while Qwen 3.8 finetunes topped Hugging Face download charts. Use-case: the strongest open-weight multimodal option for teams that need to self-host rather than call a US API.", "glance": "New open multimodal leader", "url": "https://huggingface.co/Qwen", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Open multimodal keeps pace", "basis": "Public weights release plus top finetune download ranking"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "DeepSeek v4.1 Flash squeezes the KV cache further", "heat": 55, "sources": 2, "s": "DeepSeek released v4.1 Flash, centred on aggressive KV-cache compression to cut the memory cost of long contexts. Use-case: longer documents per GPU at the same hardware spend, which is the binding constraint for most self-hosted deployments.", "glance": "Cheaper long-context serving", "url": "https://huggingface.co/deepseek-ai", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Long context gets cheaper", "basis": "Released model with documented KV-cache compression gains"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "Google puts an experimental AI agent inside family accounts", "heat": 52, "sources": 3, "s": "Google began testing CC, an experimental agent aimed at families, handling shared scheduling and household coordination across accounts. Use-case: it is the first mainstream consumer test of an agent with standing access to more than one person's data.", "glance": "Family agent enters testing", "url": "https://arstechnica.com/ai/2026/09/google-announces-new-experimental-cc-ai-agent-for-families/", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Consumer multi-user agent test", "basis": "Announced experimental rollout on Google consumer accounts"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "US and Chinese experts float nuclear-style AI safeguards", "heat": 48, "sources": 2, "s": "Security researchers from the US and China jointly proposed arms-control-style safeguards for frontier AI, modelled on nuclear risk-reduction mechanisms such as hotlines and incident notification. Use-case: it is the first concrete bilateral proposal with names attached rather than a communique.", "glance": "Bilateral AI safeguards proposed", "url": "https://www.reuters.com/technology/", "assess": {"mag": 3, "timeline": "3-5 yrs", "evidence": "early", "verdict": "First concrete US-China AI proposal", "basis": "Joint expert paper, no government adoption yet"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}, {"t": "FAA commits $875M to AI for air traffic control", "heat": 44, "sources": 2, "s": "The FAA is putting $875 million into AI systems intended to relieve chronic air-traffic-control staffing and delay problems. Use-case: a large safety-critical government deployment whose procurement terms and failure handling will be copied by other agencies.", "glance": "$875M AI for air traffic", "url": "https://techcrunch.com/category/artificial-intelligence/", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Safety-critical AI at scale", "basis": "Announced $875M FAA programme with stated scope"}, "delta": "new", "published": "2026-09-18T02:12:42.808265Z", "src": "AI signal scan"}]}, "aitrendsUpdated": "2026-09-18T02:12:42.808265Z", "youtube": {"count": 5, "note": "Today's uploads across 274 subscribed channels. YouTube's feed endpoint was blocking this runner, so channels were enumerated via yt-dlp instead; 264 channels resolved.", "groups": [{"h": "🤖 AI & Tech", "items": [{"t": "Did Google just kickstart the intelligence explosion?", "subject": "Fireship", "vid": "LoLYw--s-5w", "url": "https://www.youtube.com/watch?v=LoLYw--s-5w", "published": "2026-09-17T20:33:55Z", "src": "@Fireship", "s": "DeepMind and the University of Maryland published Dream RSI, where an agent replays its own cached past attempts as a simulator and tests thousands of exploration policies for free, keeping whichever would have found the answer in the fewest tries. On eight algorithm and maths problems it wrote a lasso solver beating Python's standard ML library in about 300 attempts, against 550 for a fixed policy and roughly 51,000 for the previous record.", "glance": "An AI agent that rewrites its own search strategy from cached past runs cut attempts to beat a standard ML solver from 51,000 to about 300."}, {"t": "Claude Fable 5.1 — what actually changed", "subject": "AI Master", "vid": "i0RnzthEx0c", "url": "https://www.youtube.com/watch?v=i0RnzthEx0c", "published": "2026-09-17T19:53:46Z", "src": "@iamAImaster", "s": "Token prices are unchanged at $10 per million in and $50 out, but cached-input rereads dropped 75% to 25 cents per million, which Anthropic says cuts a typical task by about a quarter and heavy multi-step work by nearly half. It holds roughly a million tokens of context and writes up to 128,000 in one pass. Anthropic explicitly tells you not to default to it — use Opus 5 unless the job is genuinely complex and multi-step.", "glance": "The saving is in cached input, down 75%, so Fable 5.1 pays off only on long multi-step jobs — Anthropic itself says use Opus 5 by default."}]}, {"h": "💼 Business, India & Building", "items": [{"t": "Exxon's failed war on IBM", "subject": "Asianometry", "vid": "Qeunu8YkuOk", "url": "https://www.youtube.com/watch?v=Qeunu8YkuOk", "published": "2026-09-17T23:00:39Z", "src": "@Asianometry", "s": "Through the 1970s Exxon quietly bought a string of technology startups, including Zilog, and in 1978 announced it would merge them into an office-systems business to take on IBM. The episode traces how an oil major with effectively unlimited capital still failed to run a computer company, because the acquired startups were left competing with each other and the parent had no route to market.", "glance": "Capital alone does not buy a way into a new industry — Exxon's office-systems push failed because it never integrated the startups it bought or built distribution."}, {"t": "California's high-speed rail, 18 years and $15bn in", "subject": "All-In", "vid": "SwBCPBNe_60", "url": "https://www.youtube.com/watch?v=SwBCPBNe_60", "published": "2026-09-18T00:30:13Z", "src": "@allin", "s": "An interview built around the California high-speed rail project: approved in 2008 at a $33bn estimate to link Los Angeles and San Francisco, it has since been re-estimated at $126bn and then $236bn, with about $15bn spent and no city pair connected. The rest of the episode covers the guest's contested allegations about state-funded immigration services and a California bill he is suing over — an active legal dispute, not settled fact.", "glance": "A megaproject that went from a $33bn estimate to $236bn over 18 years with no segment in service — the clearest live case study in infrastructure cost escalation.", "pointsLabel": "Segments in this episode", "points": [{"t": "The cost escalation", "s": "2008 approval at $33bn to connect LA and San Francisco; estimates since revised to $126bn and then $236bn, with roughly $15bn spent and no two cities linked."}, {"t": "Why it stalled", "s": "Construction concentrated in the Central Valley rather than at the high-demand ends, so spending accumulated without producing a usable route."}, {"t": "The contested portion", "s": "The guest alleges fraud in state-funded immigration services and is suing California over a bill he says restricts his recording. These are allegations in active litigation and are disputed; treat them as unresolved."}]}]}, {"h": "📱 Reviews & Kit", "items": [{"t": "iPhone 16 Pro, two years on", "subject": "Mark Spurrell", "vid": "PPMU-RdWqh4", "url": "https://www.youtube.com/watch?v=PPMU-RdWqh4", "published": "2026-09-17T22:31:48Z", "src": "@MarkSpurrell", "s": "A two-year owner's review rather than a launch review. Hardware held up with no display scratches despite heavy use, the 6.3-inch OLED and main camera still hold their own, and the Action button and Dynamic Island turned out to be the features used daily. The camera control button is the clear miss, and colour rendering skews slightly cool.", "glance": "Two years in, the parts that aged best were the small interaction details — the Action button and Dynamic Island — not the headline camera specs."}]}]}, "elon": {"day": "2026-09-17", "source": "@jcub2x daily recap", "note": "From the 17 Sept recap covering 26 posts. Engagement counts are not included in the recap, so likes and views are not shown; ordering is by notability. Politically charged posts are described neutrally and contested claims are flagged.", "items": [{"kind": "post", "t": "Starlink hardware — announcing the next-generation terminal", "imp": "important", "s": "Said the Starlink V5 terminal is now in production: smaller, lighter and more power-efficient, rated up to 375+ Mbps, and available in select areas.", "iso": "2026-09-18T02:14:49.071206Z"}, {"kind": "repost", "t": "SpaceX constellation safety — reposting SpaceX's collision-avoidance figures", "imp": "important", "s": "Amplified SpaceX's statement that Starlink satellites performed 207,152 autonomous collision-avoidance manoeuvres in six months, acting at a 3-in-10-million risk threshold.", "iso": "2026-09-18T02:14:49.071206Z"}, {"kind": "reply", "t": "Replying to Eric Berger on Europe lobbying for launch subsidies after losing SpaceX as an option", "imp": "important", "s": "Said Starship is planned to deliver between 1 and 10 million tonnes per year to orbit, and that even tripling all non-SpaceX tonnage would be under 0.1% of that — adding it is all small compared with air-freight tonnage.", "iso": "2026-09-18T02:14:49.071206Z"}, {"kind": "reply", "t": "Replying to a report that China's Space Pioneer is building an engine closely resembling Raptor 3", "imp": "important", "s": "Advised agains ith Musk companies", "s": "A court blocked OpenAI's attempt to see Apple's confidential settlement with Musk's companies, keeping the terms sealed.", "url": "https://news.google.com/rss/articles/CBMid0FVX3lxTE5fbU13WUVmMVI3VnNHa1JrOTNZTlFxNGo5S1VMc1prSDl1NWhHZVpUbVU5RV9ibnFINGdRbWpnYjJGSHhqLUVsbWpDVmdRNHl5LUJfalhzeWVDVjBpa0ZiakM2endsTXFVc05TZ2c5Szl5MFdCb0dz?oc=5", "published": "2026-09-18T00:32:49.071206Z", "src": "Politico"}, {"t": "NASA awards SpaceX launch services contract for StarBurst gamma-ray detector mission", "s": "NASA awarded SpaceX the launch contract for the StarBurst gamma-ray detector mission.", "url": "https://news.google.com/rss/articles/CBMisgFBVV95cUxOTm5zS21td2ZNc0hISUNHal8zRGJPX0xQRkNleGpCMVI2VFJWcWdHc0ZLRnk3aFRNNGxyX29OdnJJbXlOS2hmdDBNWV9yV0JfdU5oYmVUaUhKV19VTjVNTGtnN3JoejNJeWdVRHEwX1BieF9mczVCWUNqcGcyYVhSWXVhZzlDanZYV2M0M0Z2S0dBZFZWOVItazZoOTIwdG9IQ2lGUHVVOUFfc3hOMUVFUmNn?oc=5", "published": "2026-09-18T00:08:49.071206Z", "src": "SpaceNews"}, {"t": "FCC Opens Door to Starlink Mobile’s Global Roaming Ambitions", "s": "The FCC moved to allow Starlink's direct-to-mobile service broader global roaming rights.", "url": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxQRFV4bGgxZGZ6ei1CdW9udFZYNk1KVzJUeC1lTUV6UzJwREZ1cHUyUXcxUVM3dkw4VVRNSmNNN1lqNUE5U0lMLWp3LW5yaUpQbWpKSWdoSWZCR0F0MU45cUJpMUd6T043ZDQwdzdnYzF2QTU3ZTFFZkZWXzJISW5YcVBNYW9Kb1N6RmNjMDRrNXNZTFZlVVczdEIyZi1IUkY2VUU2Tm1VNTI?oc=5", "published": "2026-09-17T23:32:49.071206Z", "src": "PCMag"}, {"t": "SpaceX (NASDAQ:SPCX) Stock Rises Despite Starship’s First Orbital Flight Delay to September 28", "s": "SpaceX shares moved despite Starship's first fully orbital flight slipping later into September.", "url": "https://news.google.com/rss/articles/CBMiekFVX3lxTFBRbGNXNjhKeDktWU1SMnprbkxMbXdDbzUwbzZBSDRxQkZ4WXZtVENJck51S2NRblRsdHNBWXdyWWRld1JiR2ZUazdVV08wQ1BNakNLVDlCeDlOSGdqQjd1WGlvaHd3UTY0Xy1mVm43MnRxMnFoSF9FQjZ3?oc=5", "published": "2026-09-17T23:26:49.071206Z", "src": "Investing coverage"}, {"t": "SpaceX Falcon 9 Rocket Launches Classified Space Force Mission", "s": "A Falcon 9 launched a classified Space Force payload.", "url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxPT0ZuYTRNSFFXRzdZcjJMcC1IRGZpVWt6YUNLUEhXbU9SYUd6TlJMblR4RGRUaTVVb3NrM0wzVmFyZXh3OEoyS1NCSEFzU3d6eDVhY1JfR3NlcFd6S3BZa184ZHgzdG5mMml0MlZZbGpJSGF5dXpnQ0NKN19ob3B5RjdpTU9iMW1zWFM3WUltVEp6TTdMLWU3Z1Y4UW5RZ3dUYnNnbQ?oc=5", "published": "2026-09-18T01:56:49.071206Z", "src": "NTD"}], "elonNewsUpdated": "2026-09-18T02:14:49.071206Z", "mindset": {"updated": "2026-09-18T02:14:49.071206Z", "messages": [{"who": "Joseph Rodrigues", "t": "Talk to yourself like this for just 3 hours", "vid": "d2jDsN2aprY", "url": "https://www.youtube.com/watch?v=d2jDsN2aprY", "gist": "The argument is that outcomes track the belief you actually hold rather than the one you state, so if you quietly believe what you want is unavailable to you, that is what gets acted on. His method is not to argue with the doubt but to listen to the specific objection that surfaces when you state the thing you want, then write a short counter-statement aimed at that exact objection and repeat it until it stops firing. The practical instruction is to treat the resistance as information about which belief to work on, not as proof you were wrong to want it."}, {"who": "Elmer O. Locker Jr", "t": "It's all happening because the best chapter of your life", "vid": "zg2g3V6Z2h8", "url": "https://www.youtube.com/watch?v=zg2g3V6Z2h8", "gist": "His claim is that the missing ingredient is attention held in the present rather than technique. Visualising or affirming while the mind is elsewhere does nothing, because the only moment available to act in is this one. Most of the advice is subtractive: cut the inputs that pull attention into the past or an imagined future, with short-form video and constant notifications named as the main offenders, and build the capacity to hold one thing in mind for a sustained stretch before expecting any method to work."}, {"who": "AH Universe", "t": "Stop reacting to life and start dreaming it into place", "vid": "Wh10UD4ab1U", "url": "https://www.youtube.com/watch?v=Wh10UD4ab1U", "gist": "Built around a caller — an artist on an expiring New York visa — who does the practices daily and still feels stuck. The diagnosis offered is that her attention sits on the absence of what she wants rather than the thing itself, so the daily practice keeps reinforcing the lack. The suggested correction is to notice what has already worked rather than auditing what has not, and to stop forcing outcomes, which she recognises as the pattern she has run her whole life."}]}, "mindsetUpdated": "2026-09-18T02:14:49.071206Z"};

/* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);

  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }

  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){

      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);

  }

}

  try{ const dt=document.getElementById("slimDate"); if(dt) dt.textContent=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:""; }catch(e){}
}
function activate(id,opts){
  document.body.dataset.tt=id;
  setSlimHeader(id);
  TABS.forEach(t=>{ const el=document.getElementById("p-"+t.id); if(el) el.classList.toggle("active",t.id===id); });
  ensureRendered(id);
  try{ armReveals(document.getElementById("p-"+id)); }catch(e){}
  [...nav.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreMenu) [...moreMenu.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreBtn) moreBtn.classList.toggle("active",overflow.some(t=>t.id===id));
  store.set("tab",id);
  kbdIdx=-1; clearKbdCur(); applyFilter();
  if(!(opts&&opts.keepScroll)){ try{ window.scrollTo(0,0); }catch(e){} try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
}
// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();

</script>
