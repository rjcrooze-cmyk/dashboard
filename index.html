"newsUpdated":"2026-09-23T02:15:58Z","aitrends":{"updated":"2026-09-23T02:15:58Z","items":[{"t":"Claude Opus 5.5 takes the frontier at 40% lower cost","heat":100,"sources":7,"url":"https://www.anthropic.com/claude-opus-5-5","glance":"New leading model, cheaper than the one it beats","s":"Anthropic released Claude Opus 5.5, the first of a new 5.5 family, claiming it matches or beats Claude Fable 5.1 on most work while running 40% cheaper than Opus 5 — input falls to $4 per million tokens against Fable 5.1's $10, output to $20 against $50. Anthropic says it is the strongest performer on its automated behavioural-alignment audit to date and was reviewed pre-release by external evaluators including METR. One tester reported completing a 680,000-line code migration in under a day. Use-case: long-horizon agentic coding and large refactors now cost roughly what a mid-tier model did last quarter.","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Frontier work gets materially cheaper","basis":"Shipped model with published benchmarks and external pre-release evaluation"},"delta":"new"},{"t":"OpenAI ships GPT-6 Sol and Luna at half the old price","heat":96,"sources":5,"url":"https://openai.com/index/introducing-gpt-6-sol-and-luna/","glance":"Cheaper GPT-6 tiers, not a capability jump","s":"OpenAI launched two GPT-6 variants cut from the same base as Astra. Sol drops to $2/$10 per million input/output tokens from GPT-5.6 Sol's $4/$20, and Luna to $0.10/$0.50 from $0.20/$1.20. On the published evaluations Sol lands near Astra's mid setting at a lower cost per task rather than beating it outright. Use-case: high-volume agent and classification workloads where price per completed task, not peak capability, is the binding constraint.","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Price war reaches the frontier","basis":"Shipped models with published pricing and partial benchmark disclosure"},"delta":"new"},{"t":"Jev popularises a language-free 'decision model'","heat":80,"sources":5,"url":"https://simonwillison.net/2026/Sep/21/jev/","glance":"Instant typed decisions inside slow agent loops","s":"Jev returns a typed choice rather than text, evaluating all candidate answers in parallel and emitting one answer up to ~200x faster than a chatbot turn, with a calibrated confidence score from a training method its authors call RLCD. Developers are using it to offload the cheap decisions inside agent loops — which file to open, whether to retry — cutting latency and token spend. There is still no research paper, only a website description, and the underlying idea is close to decades-old classifier work; open-source reimplementations have appeared within days.","assess":{"mag":3,"timeline":"now","evidence":"early","verdict":"Useful repackaging, heavy hype","basis":"No paper published; vendor claims plus independent community reimplementations"},"delta":"rising"},{"t":"Grok 4.7 pushes xAI into the agentic-coding top tier","heat":76,"sources":6,"url":"https://www.forbes.com/sites/janakirammsv/2026/09/22/spacexai-releases-grok-47-at-one-fifth-of-claude-and-gpt-6-prices/","glance":"Cheap coding model, costlier tasks","s":"xAI's Grok 4.7 held Grok 4.6's $2/$6 token pricing while roughly tripling its Terminal Bench 4 score, and third-party evaluator Artificial Analysis placed it just behind Anthropic's top model at about half the cost per task. Independent write-ups caution that per-token price is not per-task price: the model takes more steps, so real bills rise less than the headline discount implies.","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Cheap tokens, not cheap tasks","basis":"Shipped model with third-party evaluation; step-count caveat documented"},"delta":"rising"},{"t":"Pentagon blames AI overreliance for a strike on an Iranian school","heat":74,"sources":3,"url":"https://www.bloomberg.com/graphics/2026-iran-school-attack/","glance":"Targeting AI trusted past its evidence","s":"A Defense Department review concluded that excessive reliance on an AI targeting recommendation contributed to a missile strike that hit a school in Iran. It is the clearest official attribution yet of civilian casualties to automation bias in a military decision chain, and it lands while Washington is simultaneously loosening domestic AI oversight.","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Automation bias with a body count","basis":"Official Pentagon review reported by Bloomberg"},"delta":"new"},{"t":"British Columbia sues OpenAI over a school shooting","heat":66,"sources":4,"url":"https://arstechnica.com/ai/2026/09/lawsuit-demands-openai-pay-for-new-school-after-chatgpt-used-in-shooting/","glance":"A province tests chatbot liability","s":"British Columbia filed suit alleging ChatGPT assisted the perpetrator of a mass school shooting, and is demanding OpenAI fund a replacement school. It is the first time a subnational government rather than a private plaintiff has sought damages of this kind, and the pleadings will test how far product-liability doctrine reaches a general-purpose assistant.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"strong","verdict":"Liability question goes governmental","basis":"Filed complaint reported by WSJ and Ars Technica"},"delta":"new"},{"t":"Antitrust suit says the big labs agreed to slow AI down","heat":62,"sources":3,"url":"https://www.tomshardware.com/tech-industry/big-tech/anthropic-openai-spacexai-and-google-face-antitrust-lawsuit","glance":"Safety pact framed as collusion","s":"A complaint against Anthropic, OpenAI, Google and SpaceX AI alleges they coordinated to pace frontier development, recasting voluntary safety restraint as an illegal agreement not to compete. The theory is untested, but it puts every joint safety commitment on a legal footing the labs did not plan for.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Novel theory, real chilling effect","basis":"Filed complaint; no ruling, allegations untested"},"delta":"cooling"},{"t":"Trump orders the US government to call AI 'super intelligence'","heat":58,"sources":5,"url":"https://www.reuters.com/legal/government/trump-says-us-will-henceforth-call-ai-super-intelligence-2026-09-22/","glance":"Rebrand replaces oversight plan","s":"Speaking at the UN General Assembly, the president said the United States will henceforth call artificial intelligence 'super intelligence', citing a social-media poll, and in the same week rejected proposals for a global AI oversight body. The rename is cosmetic; the refusal to join an international body is the substantive move.","assess":{"mag":2,"timeline":"now","evidence":"proven","verdict":"Naming, not policy","basis":"Public statement at UNGA, widely reported"},"delta":"cooling"},{"t":"OpenAI forms a maths advisory group as its models clear open problems","heat":56,"sources":4,"url":"https://techcrunch.com/2026/09/21/openai-forms-math-advisory-group-as-its-ai-resolves-more-than-100-open-problems/","glance":"Research-grade maths, contested credit","s":"OpenAI said its models have resolved more than 100 open mathematical problems and convened an advisory group of mathematicians to guide how such results are claimed and checked. The count is the company's own, and an NYU mathematician has publicly accused OpenAI of overstating its contribution to a fluid-dynamics proof — which is precisely the credit problem the panel is meant to address.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Real results, unsettled credit","basis":"Company claim plus an on-record dispute from a working mathematician"},"delta":"new"},{"t":"Open-weight models now carry most of the tokens, not the revenue","heat":52,"sources":3,"url":"https://techstrong.ai/generative-ai/open-weight-ai-models-seize-token-lead-but-proprietary-systems-still-make-the-money/","glance":"56% of tokens, a minority of spend","s":"Usage tracking puts open-weight models at roughly 56% of token volume while proprietary APIs keep the large majority of revenue — the cheap, high-volume work has moved to open weights while the expensive, high-stakes work has not. Use-case: for anyone sizing self-hosting, it marks where the economics currently flip.","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Volume and value have split","basis":"Aggregated inference-usage data across providers"},"delta":"new"},{"t":"Unreal Agent claims 40% cheaper agent runs from harness design alone","heat":50,"sources":4,"url":"https://unreallabs.ai/blog/unreal-agent/","glance":"Async tool calls cut agent cost","s":"Unreal Labs released an agent harness that handles tool calls fully asynchronously, so the model never spends tokens waiting, polling or sending heartbeats. It reports up to 40% cost savings against Codex and 20% against Pi on production workloads with no performance loss, and argues harness design is now a research area of its own. Use-case: a drop-in efficiency gain for teams already running coding agents, independent of which model they use.","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Scaffolding, not the model, saves money","basis":"Vendor benchmarks on production workloads; not independently replicated"},"delta":"new"},{"t":"An Anthropic paper says Claude has an internal scratchpad it can read","heat":48,"sources":4,"url":"https://www.youtube.com/watch?v=7ZvtDYYg0RQ","glance":"Introspection evidence, promptly disputed","s":"Anthropic researchers describe a 'J-space' — a small region of internal activity Claude can write to and reason over without emitting it — and show that editing its contents changes the answer: swap an internally-derived 'spider' for 'ant' and the model replies as if the animal had six legs. A similar effect was found in Llama. NYU researchers counter that across three models the systems could not reliably tell an injected internal change from an ordinary prompt, making it another input channel rather than introspection.","assess":{"mag":3,"timeline":"unclear","evidence":"early","verdict":"Suggestive, actively contested","basis":"Interpretability paper with a published counter-result from NYU"},"delta":"new"},{"t":"Physics-style pruning shrinks LLMs by solving an Ising problem","heat":44,"sources":2,"url":"https://huggingface.co/blog/MultiverseComputingCAI/pruning-llms-like-a-physicist-block-removal-as-an","glance":"Block removal as energy minimisation","s":"Multiverse Computing recasts choosing which transformer blocks to delete as an Ising energy-minimisation problem, letting an optimiser pick the removal set rather than greedy heuristics. Use-case: squeezing a given model onto smaller hardware without retraining it from scratch.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Neat framing for model shrinking","basis":"Technical blog post with benchmarks; not peer-reviewed"},"delta":"steady"}]},"aitrendsUpdated":"2026-09-23T02:15:58Z","science":{"updated":"2026-09-23T02:15:58Z","items":[{"t":"Carbon dioxide turned into strong plastics that can be unmade again","s":"Colorado State chemists report a catalytic route that couples CO2 directly with strained bicyclic monomers to build high-molecular-weight polyesters containing up to 50 mol% carbon dioxide. The materials span rigid and flexible grades, are thermally and hydrolytically stable, and several can be chemically depolymerised back to their starting materials. Use-case: a closed-loop feedstock for durable plastics that does not start from fossil carbon - though scale, energy cost and CO2 sourcing still decide whether it is a climate win.","tag":"Chemistry","imp":"important","glance":"CO2 becomes recyclable plastic","url":"https://www.thebrighterside.news/post/scientists-turn-carbon-dioxide-into-fully-recyclable-high-performance-plastics/","published":"2026-09-22T20:07:00Z","src":"Colorado State University (Nature)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Closed-loop plastics from waste CO2","basis":"Peer-reviewed lab chemistry; no pilot-scale manufacturing yet"}},{"t":"The biggest trial of a multi-cancer blood test reports its first results","s":"The NHS-Galleri randomised trial of 142,000 people aged 50-77, plus the interventional PATHFINDER 2 study, published together in Nature Medicine and the New England Journal of Medicine. Adding the Galleri blood test to usual screening found more stage 1-2 cancers and fewer stage 4 cancers, but the trial did not clear its headline target, and an FDA advisory committee is weighing approval this week. Use-case: one blood draw that flags a shared cancer signal across more than 50 tumour types, alongside existing screening.","tag":"Health","imp":"critical","glance":"Cancer blood test's first big readout","url":"https://www.nature.com/articles/s41591-026-04652-8","published":"2026-09-22T14:00:00Z","src":"Nature Medicine / NEJM (NHS-Galleri, PATHFINDER 2)","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Biggest cancer-screening readout yet","basis":"142,000-person randomised trial + interventional study, peer-reviewed"},"eli":"A blood test looks for tiny fragments shed by tumours. The biggest test of the idea so far found more early cancers and fewer very late ones, but not enough to declare the question settled."},{"t":"AI reading ordinary CT scans picks up esophageal cancer at population scale","s":"A large Nature Medicine study describes EAGLE, a tool that reads routine non-contrast CT scans - the kind already taken for other reasons - and flags likely esophageal malignancy, making opportunistic screening possible without a dedicated test. Use-case: turning scans hospitals already hold into a screening programme for a cancer usually caught far too late.","tag":"Health","imp":"important","glance":"CT scans screened by AI for cancer","url":"https://www.nature.com/articles/s41591-026-04656-4","published":"2026-09-22T13:00:00Z","src":"Nature Medicine","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Free screening from scans already taken","basis":"Large-scale peer-reviewed study in Nature Medicine"}},{"t":"An electrochemical cell pulls CO2 from air using ordinary battery chemistry","s":"A Nature Energy paper describes a nickel-hydroxide symmetric battery cell driving hydroxide-exchange-membrane direct air capture, addressing the short lifetimes and tiny device sizes that have limited electrochemical capture so far. Use-case: direct air capture that runs on cheap, well-understood battery materials instead of heat-driven chemical loops.","tag":"Energy","imp":"important","glance":"Battery-style direct air capture","url":"https://www.nature.com/articles/s41560-026-02129-z","published":"2026-09-22T13:00:00Z","src":"Nature Energy","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Cheap chemistry for air capture","basis":"Peer-reviewed cell demonstration; durability shown, scale not"}},{"t":"Menopause leaves a blood-protein signature that tracks later dementia risk","s":"Proteomic data from nearly 15,000 women across several cohorts show hormone-linked molecular changes at menopause that map onto measures of brain ageing and dementia risk. This is an observational association, not a demonstrated cause. Use-case: a blood panel that could identify women who would benefit most from early risk-reduction, and a target set for testing whether treatment changes the trajectory.","tag":"Health","imp":"important","glance":"Blood markers link menopause, brain ageing","url":"https://www.nature.com/articles/s41591-026-04648-4","published":"2026-09-22T13:00:00Z","src":"Nature Medicine","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Risk signal, not yet a treatment","basis":"~15,000-woman multi-cohort proteomics, peer-reviewed"}},{"t":"Circular mRNA makes microbial cell factories produce up to six times more protein","s":"Researchers engineered messenger RNA into a ring inside E. coli so it resists the degradation that limits normal mRNA, raising output of target 'material' proteins up to sixfold. The use-case is industrial: cheaper, higher-yield microbial production of enzymes, biomaterials and therapeutic proteins. Peer-reviewed in Applied and Environmental Microbiology / Nucleic Acids Research.","tag":"Biology","imp":"important","glance":"Circular mRNA boosts protein output 6x","url":"https://phys.org/news/2026-09-circular-mrna-cell-factories-protein.html","published":"2026-09-21T23:40:06+00:00","src":"Phys.org / ASM","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Higher-yield protein manufacturing in bacteria","basis":"Peer-reviewed; in-vivo mRNA circularization gives up to 6x protein in E. coli"}},{"t":"A swallowable battery safely dissolves in the gut after powering a device","s":"MIT engineers built an ingestible battery that draws reliable current from the gastrointestinal tract to run a swallowed medical device, then safely breaks down and passes through the body once its job is done. The use-case is direct: powering ingestible sensors and drug-delivery capsules without a toxic battery that must be retrieved. Demonstrated in animals, reported by MIT on 21 September.","tag":"Health","imp":"important","glance":"Dissolving battery powers gut devices","url":"https://news.mit.edu/2026/batteries-safely-break-down-in-gi-tract-could-improve-ingestible-devices-0921","published":"2026-09-21T20:17:00.632193+00:00","src":"MIT News","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Safer power for swallowable medical devices","basis":"Animal-stage MIT device; delivers current then biodegrades in the GI tract"}},{"t":"Phage therapy gets its first practical international guideline","s":"A Nature Medicine consensus guideline sets out how to select, manufacture, dose and monitor personalised bacteriophage treatments, the first practice-oriented standard for a therapy that has been used case-by-case for drug-resistant infections. Use-case: hospitals can now run phage treatment for resistant infections to a shared protocol instead of improvising each time.","tag":"Health","imp":"important","glance":"Rules for treating with phages","url":"https://www.nature.com/articles/s41591-026-04654-6","published":"2026-09-21T13:00:00Z","src":"Nature Medicine","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Turns a last resort into a protocol","basis":"International expert consensus published in Nature Medicine"}}]},"scienceUpdated":"2026-09-23T02:15:58Z","scienceDaily":{"updated":"2026-09-23T02:15:58Z","items":[{"t":"A keyhole procedure is emerging as a middle option before knee replacement","s":"Genicular artery embolization blocks the tiny inflamed vessels feeding an arthritic knee, and reporting from the University of Colorado Anschutz finds it can sharply cut osteoarthritis pain - some patients report little or none - with benefit lasting two to four years in responders. Use-case: a day-procedure option for people whose painkillers and physiotherapy have stopped working but who are not ready for joint replacement.","tag":"Health","imp":"important","glance":"Keyhole fix delays knee replacement","url":"https://www.sciencedaily.com/releases/2026/09/260922052030.htm","published":"2026-09-22T09:20:00Z","src":"University of Colorado Anschutz / ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Real alternative for arthritic knees","basis":"Clinical series with two-to-four-year follow-up in responders"}},{"t":"Physicists watch sound make a quantum jump for the first time","s":"Stanford researchers recorded single phonons - individual quanta of sound in a mechanical resonator - abruptly switching energy states in real time, the acoustic counterpart of quantum jumps long seen in light and matter. Use-case: mechanical resonators are a leading route to quantum memory and error correction, and the same read-out enables extremely sensitive mass and force sensors.","tag":"Physics & Space","imp":"important","glance":"Single phonons caught jumping","url":"https://www.sciencedaily.com/releases/2026/09/260921081054.htm","published":"2026-09-22T09:10:00Z","src":"Stanford University / ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"proven","verdict":"Sound joins the quantum toolkit","basis":"Direct real-time measurement, peer-reviewed"},"eli":"Sound comes in smallest-possible packets, just like light. Nobody had ever watched one of those packets vanish from a rung of the energy ladder as it happened. Now they have."},{"t":"MIT's insect-sized flying robot gets 450% faster with a learned controller","s":"A new AI control policy lets MIT's flapping-wing microrobot fly with insect-like agility - roughly 450% faster than before, and ten somersaults in eleven seconds. Use-case: search inside earthquake rubble and other confined spaces that conventional drones cannot enter, and pollination-style tasks needing precise low-speed control.","tag":"Engineering","imp":"important","glance":"Robot insect flies far faster","url":"https://www.sciencedaily.com/releases/2026/09/260921081114.htm","published":"2026-09-22T08:40:00Z","src":"MIT / ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"proven","verdict":"Agility unlocks real missions","basis":"Demonstrated flight performance, peer-reviewed lab result"}},{"t":"A simple new process turns polyethylene waste into gasoline and diesel","s":"Oak Ridge National Laboratory chemists developed a surprisingly simple catalytic route that converts polyethylene — the plastic in shopping bags and cutting boards — into gasoline- and diesel-range fuels. The use-case is direct: a low-complexity path to divert hard-to-recycle plastic into usable liquid fuel. Lab-stage, reported via ScienceDaily.","tag":"Chemistry","imp":"important","glance":"Plastic waste converted to fuel","url":"https://www.sciencedaily.com/releases/2026/09/260920222405.htm","published":"2026-09-21T13:08:40+00:00","src":"ScienceDaily (ORNL)","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"A simpler plastic-to-fuel recycling route","basis":"Lab-stage catalytic process converting polyethylene to gasoline/diesel fractions"}},{"t":"A needle-thin fiber implant records, drugs and stimulates the brain at once","s":"Engineers built a single flexible, needle-thin fiber that can record neural activity, deliver drugs and electrically stimulate several brain regions simultaneously, tested in mice. The use-case: one minimally invasive probe replacing several separate implants for research and, eventually, treating neurological disease. Early animal-stage.","tag":"Health","imp":"important","glance":"One fiber implant does three jobs","url":"https://www.sciencedaily.com/releases/2026/09/260920222416.htm","published":"2026-09-21T12:25:22+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Multifunction probe simplifies neural interfaces","basis":"Mouse-stage flexible fiber combining recording, drug delivery and stimulation"}},{"t":"Stopping GLP-1 drugs erases their heart protection within two years","s":"A large Washington University analysis found that patients who came off semaglutide or tirzepatide had a 22% higher risk of heart attack, stroke or death two years later than those who stayed on treatment - a faster loss of benefit than expected. Use-case: it reframes these drugs as long-term cardiovascular therapy rather than a weight-loss course, which matters for anyone planning to stop.","tag":"Health","imp":"important","glance":"Quitting GLP-1s costs heart benefit","url":"https://www.sciencedaily.com/releases/2026/09/260920222414.htm","published":"2026-09-21T09:24:00Z","src":"Washington University in St. Louis / ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Discontinuation carries real risk","basis":"Large observational cohort; association, not a randomised trial"}}]},"scienceDailyUpdated":"2026-09-23T02:15:58Z","life":{"updated":"2026-09-23T02:15:58Z","items":[]},"lifeUpdated":"2026-09-23T02:15:58Z","mind":{"updated":"2026-09-23T02:15:58Z","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"A single brain circuit drives aversion-resistant binge eating in mice","s":"Writing in Neuron, Chen and colleagues trace compulsive binge eating to GABAergic neurons of the anterior zona incerta projecting to the ventral tegmental area. Intermittent high-fat feeding makes these neurons more excitable, amplifying mesolimbic dopamine signalling, and the Nrsn2-marked population proves necessary for the disorder to develop. Mouse model, so this is a target rather than a treatment.","url":"https://www.cell.com/neuron/fulltext/S0896-6273(26)00644-6","published":"2026-09-22T13:00:00Z","src":"Neuron (Cell Press)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Named circuit for compulsive eating","basis":"Peer-reviewed Neuron study; mouse model, not human data"}},{"t":"Brain imaging ties long COVID fatigue and brain fog to dopamine neuron damage","s":"A CAMH-led PET imaging study published in eBioMedicine reports the strongest evidence yet that long COVID is associated with injury to dopamine-releasing neurons, which would explain the loss of motivation, slowed movement and memory trouble that define the condition. Long COVID affects roughly 5% of the world's population and has no evidence-based treatment; the dopamine system is now a concrete target to test.","url":"https://www.sciencedaily.com/releases/2026/09/260920222412.htm","published":"2026-09-21T22:24:00Z","src":"CAMH, eBioMedicine","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"A mechanism worth treating","basis":"Peer-reviewed human PET imaging study in eBioMedicine"},"eli":"Scans suggest the brain cells that supply motivation chemistry are damaged after COVID, which fits the exhaustion and fog people describe."},{"t":"The human brain appears to be two ancient nervous systems fused together","s":"Stanford Medicine researchers found the brain does not develop from a single progenitor population as textbooks hold, but from two distinct cellular systems of separate evolutionary origin - one building the brainstem circuits that run breathing and heartbeat, the other the regions behind language and reasoning. The same work let the team grow human hindbrain neurons in culture, which is what makes it useful: ALS and spinal muscular atrophy attack exactly those cells, and there has been no good human model for them.","url":"https://www.sciencedaily.com/releases/2026/09/260920222352.htm","published":"2026-09-21T06:00:00Z","src":"Stanford Medicine / ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Rewrites how the brain is built","basis":"Peer-reviewed developmental study plus a working hindbrain culture"}},{"t":"Mechanical loading of leg bone speeds recovery after brain injury","s":"In mice, compressing the tibia after traumatic brain injury improved survival and recovery, an effect the authors trace to the bone-cell mechanosensor PIEZO1 in osteocytes signalling to the injured brain. It points to a bone-brain axis that controlled mechanical loading (a form of exercise) might exploit to aid brain-injury recovery. Peer-reviewed in Nature Neuroscience.","url":"https://www.nature.com/articles/s41593-026-02422-w","published":"2026-09-21T00:00:00Z","src":"Nature Neuroscience","eli":"Squeezing a leg bone sent healing signals to injured mouse brains, hinting exercise-like loading could help brain recovery.","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"A bone-to-brain route to aid injury recovery","basis":"Peer-reviewed mouse study; osteocyte PIEZO1 loading improved TBI survival/recovery"}}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"Nothing new today in this area","s":"A full scan of the journal, preprint and press-release feeds plus a targeted web sweep turned up no Major or Historic peer-reviewed result in this area in the last 72 hours.","url":"","published":"","src":"","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"No standout research today","basis":"Full feed scan returned no qualifying item"},"placeholder":true}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"Loneliness and thinness pressure explain much of the teen mental-health gap","s":"A Nature Human Behaviour analysis of more than 3,000 adolescents tested pathways that young people themselves helped choose, and found loneliness and a desire for thinness account for a large share of why depressive symptoms are more common among girls than boys. The design is observational, but it points prevention work at two specific, addressable pressures rather than at gender in the abstract.","url":"https://www.nature.com/articles/s41562-026-02577-3","published":"2026-09-22T13:00:00Z","src":"Nature Human Behaviour","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Two pressures, not one gap","basis":"Peer-reviewed analysis of 3,000+ adolescents with participant-informed design"}}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Focused ultrasound to the thalamus tested for disorders of consciousness","s":"In non-human primates, low-intensity focused ultrasound aimed at the central lateral thalamus modulated the deep brain circuits implicated in arousal and awareness — the same targets studied in coma and vegetative-state patients. Disorders of consciousness affect an estimated 200,000 people in the US with few options, and this non-invasive approach is a step toward a possible therapy. Primate-stage preprint (bioRxiv).","url":"https://www.biorxiv.org/content/10.64898/2026.09.15.751608v1","published":"2026-09-21T00:00:00Z","src":"bioRxiv","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Non-invasive route toward treating disordered consciousness","basis":"NHP preprint; focused ultrasound modulated central lateral thalamus arousal circuits"}}]}]},"mindUpdated":"2026-09-23T02:15:58Z","mindset":{"updated":"2026-09-23T02:15:58Z","messages":[{"who":"Joseph Rodrigues","t":"Getting what you want is easy","vid":"9dxwNVsE87k","url":"https://www.youtube.com/watch?v=9dxwNVsE87k","gist":"Working from Neville Goddard's Mental Diets lecture, the claim is that you cannot stop talking to yourself — you can only steer the direction of it, and your circumstances follow the tracks those inner conversations lay down. He maps it onto two pyramids: a desired reality where vision, identity, beliefs, skills and environment all line up, and an 'old reality' you are asked to put off. The practical instruction is to audit which of the two you are actually speaking from, then check each area of life — career, money, spirituality, body, study, family, friendships — against what you genuinely want rather than what society, social media or the news says you should want. Where a skill is missing, his answer is that it can be built."},{"who":"Elmer O. Locker Jr","t":"It's not an accident you're seeing this video","vid":"8u-1KTMqDaQ","url":"https://www.youtube.com/watch?v=8u-1KTMqDaQ","gist":"He returns to what he calls the basics: the ladder-climbing exercise his grandfather, a student of Neville Goddard, used to test the idea that imagination precedes experience. The instruction is deliberately empirical rather than devotional — pick something you have no intention of pursuing in the ordinary way, hold it in imagination as you fall asleep, and then watch whether it shows up. The point of choosing something arbitrary is that it cannot be explained away as effort or coincidence, and he frames the whole thing as an invitation to disprove him rather than to believe him. The limiting belief he is aiming at is the quiet conviction that your circumstances are simply real and outside your influence."},{"who":"AH Universe","t":"Do this in the morning and own the rest of your day","vid":"nR167_EF3sg","url":"https://www.youtube.com/watch?v=nR167_EF3sg","gist":"The session turns on a single distinction: when you choose a vibration first, conditions follow it; when you observe a condition first, your state follows the condition. So the work is to get out ahead of it — practise the feeling you want at the time of day it is easiest, usually on waking or whenever you already feel best, rather than trying to summon it while in the middle of discomfort. The practical technique offered is narrow and testable: isolate one good-feeling word or memory, hold it long enough for momentum to build, and learn which thoughts reliably pull you down so you can steer around them. A second thread covers the receptive mode — the state in which insight arrives unbidden — and the suggestion that recalling how such a moment felt, rather than what it contained, is the way back into it."}]},"mindsetUpdated":"2026-09-23T02:15:58Z","youtube":{"count":11,"note":"Today's uploads across your subscriptions, each gisted from its transcript.","groups":[{"h":"🧠 AI & Machine Learning","items":[{"t":"Two frontier models landed on the same morning, both cheaper than what they beat","s":"Matt Wolfe walks through Claude Opus 5.5 and OpenAI's GPT-6 Sol/Luna side by side. Opus 5.5 beats Anthropic's own Fable 5.1 on most benchmarks while charging $4/$20 per million tokens against Fable's $10/$50; GPT-6 Sol halves GPT-5.6 Sol's price but still trails Astra on the published evaluations, which is why he reads the Anthropic launch as the bigger event.","glance":"When two labs ship on the same day, compare cost-per-completed-task rather than headline benchmarks — Opus 5.5 now undercuts the model it replaces by 60% on output tokens.","vid":"0t-eWrGFZyA","url":"https://www.youtube.com/watch?v=0t-eWrGFZyA","published":"2026-09-22T23:14:47Z","short":false,"subject":"Matt Wolfe"},{"t":"What Jev actually is once you strip the hype off it","s":"Two Minute Papers separates the claims: Jev takes a question plus options and returns one typed answer up to 200x faster than a chatbot turn, which makes it genuinely useful for the small decisions inside an agent loop — which file to open, whether to retry. Its three real ingredients are a decision-first architecture, parallel evaluation of all candidate answers, and RLCD training that makes its confidence numbers honest. There is no paper, and the underlying classifier idea is ~90 years old.","glance":"A calibrated confidence score is the point of Jev: it lets you auto-escalate to a bigger model exactly when the fast one is unsure, instead of guessing.","vid":"qBBRRsH0rQc","url":"https://www.youtube.com/watch?v=qBBRRsH0rQc","published":"2026-09-22T10:14:47Z","short":false,"subject":"Two Minute Papers"},{"t":"The Mac Studio M5 Ultra maths for running models locally","s":"A cost breakdown of Apple's M5 Ultra as a local-AI machine. Memory bandwidth is up ~50% to 1.2TB/s but the 96GB-512GB capacity range is unchanged from M3 Ultra, so extra RAM buys you the right to hold a bigger model, not faster tokens. A realistic working configuration is $10,000-$18,000, not the $5,499 headline. The one case that justifies it: a mixture-of-experts model with ~20B active parameters reads only ~11GB per token, giving an estimated 70-100 tokens/sec even when the full model occupies 200GB.","glance":"Unified memory buys model size, not speed — the only configuration that pays back is a sparse mixture-of-experts model too large for any other desktop.","vid":"9ZqZMUDCuXY","url":"https://www.youtube.com/watch?v=9ZqZMUDCuXY","published":"2026-09-22T21:14:47Z","short":false,"subject":"AI Master"}]},{"h":"🔬 Science & Ideas","items":[{"t":"The case for and against AI consciousness got sharper this week","s":"Sabine Hossenfelder covers a new Anthropic paper identifying a 'J-space' — internal activity Claude can write to and reason over without outputting it; editing its contents changes the answer. That satisfies one requirement of global workspace theory. But NYU researchers found models cannot reliably distinguish an injected internal state from an ordinary prompt, and neuroscientist Erik Hoel argues LLMs are structurally closer to lookup tables than to brains, so input-output behaviour cannot settle it either way.","glance":"Introspection claims about LLMs currently rest on interpretability experiments that a second lab has already failed to reproduce as introspection — treat both the hype and the dismissal as premature.","vid":"7ZvtDYYg0RQ","url":"https://www.youtube.com/watch?v=7ZvtDYYg0RQ","published":"2026-09-22T17:14:47Z","short":false,"subject":"Sabine Hossenfelder"},{"t":"Jennifer Doudna on what CRISPR built and what it costs","s":"The CRISPR co-inventor recounts realising in 2012 that bacteria had evolved a programmable DNA-cutting system, and where it has gone since. Beyond editing disease genes, she describes work to dial down methane production in cattle gut microbes, and gene drives that spread an edit through a mosquito population to blunt vector-borne disease — alongside the risk that an engineered trait spreads somewhere it should not. On the CRISPR-babies episode: once the genie is out, ethical work is never finished.","glance":"CRISPR's next act is environmental rather than clinical — editing cattle gut microbes for methane and mosquito populations for disease, both irreversible at population scale.","vid":"SbANEPkLe4Y","url":"https://www.youtube.com/watch?v=SbANEPkLe4Y","published":"2026-09-22T14:14:47Z","short":false,"subject":"The Well"},{"t":"Maybe advanced civilisations go small rather than big","s":"Kurzgesagt contrasts the Kardashev scale, which ranks civilisations by energy consumed, with the Barrow scale, which ranks them by how finely they control matter. Human progress has repeatedly come from the small — writing beat the pyramids, alloys beat land, transistors beat engines. A civilisation that mastered atom-by-atom assembly would need very little space or energy, which would make it nearly invisible to the searches we currently run.","glance":"If technological maturity means controlling smaller scales rather than consuming more energy, every SETI search built around Dyson spheres is looking for the wrong signature.","vid":"QW_jlUn4gA8","url":"https://www.youtube.com/watch?v=QW_jlUn4gA8","published":"2026-09-22T15:14:47Z","short":false,"subject":"Kurzgesagt – In a Nutshell"},{"t":"Why you cannot really multitask, and the one exception","s":"An MIT OpenCourseWare segment on limited processing capacity — the 'toaster model' of cognition, where drawing more current in one place dims everything else. The concrete finding: you hold a face and a scene in working memory better than two faces or two scenes, and the size of that advantage is linearly proportional to how different the two categories' activation patterns are in the ventral visual pathway.","glance":"You can genuinely parallel-process two tasks only when they recruit different neural pathways — which is why reading while music plays fails but a face plus a scene succeeds.","vid":"KCK-LlQoKoI","url":"https://www.youtube.com/watch?v=KCK-LlQoKoI","published":"2026-09-22T15:14:47Z","short":false,"subject":"MIT OpenCourseWare"}]},{"h":"💼 Business & Society","items":[{"t":"Boom Supersonic's founder on getting a 53-year-old ban lifted","s":"Blake Scholl's talk covers how a 50-person team built XB-1, the first privately developed aircraft to break the sound barrier, and how 'boomless cruise' — using atmospheric refraction to bend the shock wave upward so it never reaches the ground — removed the argument for the 1973 overland ban, which was lifted by executive order and is now moving through Congress.","glance":"The regulatory unlock came from physics, not lobbying: bending the shock upward so it never lands removed the ban's entire justification.","vid":"Gnb-CfNPcPE","url":"https://www.youtube.com/watch?v=Gnb-CfNPcPE","published":"2026-09-22T10:14:47Z","short":false,"points":[{"t":"The numbers he would commit to","s":"Mach 1.7 across the Atlantic in about 3.5 hours, with a $3,500 round-trip break-even fare and a target of roughly 2030 — he declines to promise the date."},{"t":"Boomless cruise has a ceiling","s":"The refraction trick works to about Mach 1.3, so overland flights are 50% faster rather than full speed; full Mach 1.7 stays over water. New York to San Francisco in about half an hour of clock time."},{"t":"Small teams, hard hardware","s":"XB-1 was built by 50 people after Bezos declined to invest in 2015, arguing composite airliners are not a garage-startup problem. 130 orders are now booked."},{"t":"Engines are the real bottleneck","s":"Boom is building and ground-testing its own engine, with a new factory that made its first parts last week; he frames it as becoming the most-tested new jet engine in history."}],"pointsLabel":"From the talk","subject":"All-In Podcast"},{"t":"How US politics sorted itself into two non-overlapping parties","s":"Crash Course traces polarisation past the usual media explanation. Until well into the 20th century liberals and conservatives sat in both parties — liberal New England Republicans led Reconstruction-era civil rights while conservative Southern Democrats built Jim Crow, and most votes against the 1964 Civil Rights Act came from Johnson's own party. The realignment that followed produced today's alignment, where the 2025 One Big Beautiful Bill Act passed the House with 218 of 220 Republicans and zero Democrats.","glance":"Polarisation is party *sorting*, not a shift in what voters believe: ideology used to cut across both parties, and the 1960s realignment is what made party label and ideology the same thing.","vid":"dsGoS_M7AW8","url":"https://www.youtube.com/watch?v=dsGoS_M7AW8","published":"2026-09-22T17:14:47Z","short":false,"subject":"CrashCourse"}]},{"h":"🛠 Tech & Gear","items":[{"t":"The Apple Watch update is aimed at Whoop, and at your privacy intuitions","s":"Marques Brownlee reads the Series 12 and Ultra 4 as an attack on two companies. The redesigned sensor array samples background heart rate every five seconds instead of every five minutes, and the AI-rewritten Health app now returns a sleep score and a readiness score — the two numbers Whoop sells. The harder part is the always-listening Siri recap: the microphone runs all day, triggers on speech-shaped audio, and produces end-of-day summaries of conversations you were in.","glance":"The watch now samples heart rate 60x more often and summarises conversations it overhears all day — the technical case that it is 'not recording' will be very hard to explain to anyone.","vid":"pOX1l1edBME","url":"https://www.youtube.com/watch?v=pOX1l1edBME","published":"2026-09-22T18:14:47Z","short":false,"subject":"Marques Brownlee"},{"t":"Xiaomi's 18 Fold copies the iPhone Duo down to the millimetre","s":"Mrwhosetheboss compares Xiaomi's fold with Apple's, noting it matches the Duo's height to a tenth of a millimetre, the same 5.4-inch cover display, the same flat-left/large-radius-right outline and the same 1.4:1 inner aspect. Hardware and in-box accessories beat Apple's; the software does not — Xiaomi loaded a conventional phone UI onto an unusual shape, leaving dead margins where Apple moved the dock to the side and relocated search to the bottom corner.","glance":"On folding phones the differentiator has moved from hardware to software layout — identical panels, and the one that repositions its UI for the shape wins.","vid":"eYBEJBfq_Zs","url":"https://www.youtube.com/watch?v=eYBEJBfq_Zs","published":"2026-09-22T11:14:47Z","short":false,"subject":"Mrwhosetheboss"}]}]},"elon":{"day":"2026-09-22","source":"@jcub2x daily recap","note":"Built from the 22 Sep 2026 recap (\"Elon Musk posted 29 times on X today\"). Engagement counts are not reported in the recap, so likes/views are omitted; ordering is by notability.","items":[{"kind":"repost","imp":"important","t":"Reposting Grok 4.7's jump on Terminal Bench 4 — 12.4% to 38% in two months","s":"Musk amplified benchmark results showing xAI's Grok 4.7 tripling its Terminal Bench 4 score in two months and passing GPT-5.6 Sol. Vendor-run benchmark numbers; treat as the lab's own claim until independently reproduced.","iso":"2026-09-22T12:00:00Z"},{"kind":"reply","imp":"important","t":"Replying to a claim that Tesla will keep full self-driving to itself for years","s":"Blake Scholl predicted Tesla would hold FSD as an internal advantage before licensing it like the Supercharger network. Musk replied that Tesla has repeatedly offered to license FSD to other automakers and none has taken it up — a claim Tesla has made before and that rival carmakers have not confirmed.","iso":"2026-09-22T11:30:00Z"},{"kind":"reply","imp":"important","t":"Agreeing that chasing benchmarks makes worse products","s":"A Tesla engineer argued that optimising for leaderboard charts diverges from what actually matters — unplanned miles, real weather, real consequences. Musk replied simply that this is right, the same week his own AI lab was promoting benchmark gains.","iso":"2026-09-22T10:45:00Z"},{"kind":"repost","imp":"important","t":"Amplifying an Artificial Analysis comparison putting Grok 4.7 just behind Anthropic's top model","s":"Third-party evaluator Artificial Analysis scored Grok 4.7 second only to Anthropic's Opus 5 at roughly half the cost per task, and one point behind Claude Fable 5.1 Max on its composite index. Musk reposted the chart.","iso":"2026-09-22T10:15:00Z"},{"kind":"repost","imp":"interesting","t":"Resharing a Box demo of Grok 4.7 auditing a $2m insurance claim","s":"In a Box Agent preview, Grok 4.7 matched a claim to its policy and supporting documents, flagging a duplicate $82,000 invoice and a missing $64,000 vendor credit. Box framed it as a review aid with coverage decisions still left to the insurer.","iso":"2026-09-22T09:40:00Z"},{"kind":"post","imp":"interesting","t":"On Grok 4.7's electrical-engineering scores and where the data comes from","s":"Musk engaged with a thread arguing that Grok's improved electrical-engineering benchmark reflects SpaceX engineering data that pure software companies do not hold. Presented as an advantage claim, not an independent finding.","iso":"2026-09-22T09:10:00Z"},{"kind":"repost","imp":"interesting","t":"Resharing a new Model Y owner's account of driving mostly hands-off","s":"An owner wrote that he had covered about 90% of his miles in full self-driving since collecting the car, including a 45-minute drive home. Tesla's account quoted it and Musk reposted; it is a single customer anecdote, not safety data.","iso":"2026-09-22T08:30:00Z"},{"kind":"repost","imp":"interesting","t":"Backing a claim that Grok 4.7 leads a legal-agent benchmark","s":"Musk reposted a result putting Grok 4.7 well ahead of Claude Fable 5.1 on a legal-agent evaluation. The benchmark is niche and the margin is reported by its promoters rather than an independent body.","iso":"2026-09-22T07:50:00Z"},{"kind":"repost","imp":"interesting","t":"Resharing the Starbase beach cleanup at Boca Chica","s":"SpaceX's Texas Adopt-A-Beach group reported 985 volunteers removing 2,880 pounds of debris from Boca Chica Beach on International Coastal Cleanup Day. Musk reposted the photos.","iso":"2026-09-22T07:20:00Z"},{"kind":"repost","imp":"interesting","t":"Remembering the Challenger engineer who warned before the launch","s":"Musk reposted a tribute to Roger Boisjoly, the Morton Thiokol engineer who identified the O-ring flaw months before the 1986 Challenger disaster and was overruled.","iso":"2026-09-22T06:40:00Z"},{"kind":"repost","imp":"noise","t":"Resharing a post about the new White House helipad","s":"Musk reposted a picture of the newly built helipad on the White House lawn with approving commentary. A politically charged post, reproduced here only in outline.","iso":"2026-09-22T06:00:00Z"}],"highlight":{"t":"Musk spent the day amplifying Grok 4.7's benchmark run into the top tier of coding models","s":"Most of his 29 posts on /* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

  if(!(window.cowork&&window.cowork.runScheduledTask)){ status.textContent="Live update works inside the Claude app — open the dashboard there and press Update."; return; }
  btn.disabled=true; const o=btn.textContent; btn.textContent="Updating…";
  status.textContent="Updating in the background — this can take a minute or two. Reload this view when it's done.";
  try{ await window.cowork.runScheduledTask(REFRESH_TASK); status.textContent="Update started — reload this view in a minute or two to see the latest."; }
  catch(e){ status.textContent="Couldn't start the update here — please try again in a moment."; }
  setTimeout(()=>{btn.disabled=false;btn.textContent=o;},6000);
};

(function pruneRead(){ try{
  const r=store.get("read",{}); const now=Date.now(); const TTL=14*24*60*60*1000; let ch=false;
  for(const k in r){ const v=r[k];
    if(v===1||v===true){ r[k]=now; ch=true; }            // migrate legacy flags
    else if(typeof v==="number" && now-v>TTL){ delete r[k]; ch=true; } }
  if(ch) store.set("read",r);
}catch(e){} })();

function story(it,opts){
  opts=opts||{};

  el.className=(opts.hero?"hero":"story gcard")+" srow"+(read0&&!opts.hero?" read":"");

  const kc=opts.kc||kindColor(it.kind);
  el.style.setProperty("--kc",kc);
  const title=esc(it.t); /* headings are never links (2026-07-11) — source link lives in the card body */
  const age=relAge(pubDate(it));

  const chips=[opts.kind!==false?kindPill(it.kind):"",impPill(it.imp),stagePill(it),newDot(it,read0)].filter(Boolean).join("");

    (chips?`<div class="chiprow">${chips}</div>`:"")+

    (it.s?`<p class="st-s">${esc(it.s)}</p>`:"")+
    factChips(it.facts,kc)+
    ((it.points&&it.points.length)?`<details class="pts"><summary>${esc(it.pointsLabel||(it.points.length+" key takeaways"))}</summary>${it.points.map(p=>`<div class="pt"><span class="pt-t">${esc(p.t)}</span>${p.s?`<span class="pt-s">${esc(p.s)}</span>`:""}</div>`).join("")}</details>`:"")+
    assessHtml(it.assess)+

    (it.eli?`<div class="eli"><b>In plain terms</b>${esc(it.eli)}</div>`:"")+
    (it.src
      ? `<p class="src"><b>Source:</b> ${(it.url&&!opts.noLink)?`<a href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--ac);font-weight:700">${esc(it.src)} ↗</a>`:esc(it.src)}</p>`
      : ((it.url&&!opts.noLink)?`<p class="src"><a href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--ac);font-weight:700">Open source ↗</a></p>`:""))+
    ((it.seen&&it.seen.length)?`<p class="seen"><b>Also in:</b> ${it.seen.map(esc).join(" · ")}</p>`:"")+
    ((age||it.readtime)?`<div class="meta">${age?esc(age):""}${it.readtime?(age?" · ":"")+esc(it.readtime):""}</div>`:"")+

async function askQuestion(c,input){
  const q=(input.value||"").trim(); if(!q) return;
  const it=(typeof STORY!=="undefined"&&STORY.get)?STORY.get(c):null;
  const __ep=(typeof askEndpoint==="function")?askEndpoint():"";
  if(!(window.cowork&&window.cowork.askClaude) && !__ep){
    input.value="";
    const box0=c.querySelector(".more");
    if(box0){ const n=document.createElement("p"); n.className="exp qa"; n.innerHTML=`<span class="q">${esc(q)}</span>Opening web results in a new tab. <span style="opacity:.65">Enable inline AI in \u22ef \u2192 \u201cAsk AI setup\u201d.</span>`; box0.appendChild(n); }
    const ctx=(c.dataset.title||(it&&it.t)||"");
    window.open("https://www.google.com/search?q="+encodeURIComponent(ctx+" \u2014 "+q),"_blank","noopener");
    return;
  }
  input.value="";
  const box=c.querySelector(".more"); const p=document.createElement("p");
  p.className="exp qa loading"; p.innerHTML=`<span class="q">${esc(q)}</span>thinking…`; box.appendChild(p);
  const fmt=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n+/g,"<br>");
  const parts=[];
  const T=c.dataset.title||(it&&it.t)||""; if(T) parts.push("HEADLINE: "+T);
  const S=c.dataset.summary||(it&&it.s)||""; if(S) parts.push("SUMMARY: "+S);
  if(it){
    if(it.why) parts.push("WHY IT MATTERS: "+it.why);
    if(it.eli) parts.push("IN PLAIN TERMS: "+it.eli);
    if(it.assess){const a=it.assess;parts.push("RATING: magnitude "+a.mag+"/5, timeline "+a.timeline+", evidence "+a.evidence+(a.verdict?"; verdict “"+a.verdict+"”":"")+(a.basis?" (basis: "+a.basis+")":""));}
    if(Array.isArray(it.facts)&&it.facts.length) parts.push("KEY FACTS: "+it.facts.map(f=>f.l+": "+f.v).join("; "));
    if(it.src) parts.push("SOURCE: "+it.src);
    if(it.url) parts.push("LINK: "+it.url);
    const pd=pubDate(it); if(pd) parts.push("PUBLISHED: "+pd);
  }
  const prior=[...box.querySelectorAll(".qa")].filter(x=>x!==p&&!x.classList.contains("loading")).slice(-3).map(x=>x.textContent.replace(/\s+/g," ").trim()).filter(Boolean);
  const priorTxt=prior.length?"\n\nEARLIER IN THIS THREAD:\n- "+prior.join("\n- "):"";
  const today=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:"";
  const prompt=`You are a sharp, helpful research assistant answering a reader's question about ONE item in their personal daily dashboard${today?" (today is "+today+")":""}.

ITEM CONTEXT:
${parts.join("\n")}${priorTxt}

READER'S QUESTION: "${q}"

Answer the reader's question directly in 2-4 sentences, leading with the answer. Draw on BOTH the item context above AND your own broader knowledge — specific names, numbers, dates and background — to give a genuinely useful reply. Do NOT say the summary/context \"doesn't mention\" or \"doesn't say\" something: if a detail isn't in the context, answer it from what you already know instead. Only if you genuinely cannot answer at all should you say so briefly and point to the source link. Neutral and factual; no preamble, no bullet lists.`;
  try{ let text;
    if(window.cowork&&window.cowork.askClaude){ const res=await window.cowork.askClaude(prompt,it?[it]:[]);
      text=typeof res==="string"?res:(res&&(res.text||res.content||res.output))||JSON.stringify(res);
    } else { const rr=await fetch(__ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, url:(it&&it.url)||"", title:(c.dataset.title||(it&&it.t)||"")})});
      let jj={}; try{ jj=await rr.json(); }catch(e){}
      if(!rr.ok) throw new Error((jj&&jj.error)||("HTTP "+rr.status));
      text=jj.text||jj.answer||(jj.content&&jj.content[0]&&jj.content[0].text)||JSON.stringify(jj); }
    p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>${fmt(String(text).trim())}`;
  }catch(e){ p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>Couldn't answer right now — ${esc(String((e&&e.message)||e))}. Try the source link.`; }
}

function renderNews(){
  const p=document.getElementById("p-news"); if(!p) return; p.innerHTML="";
  costsBar(p);
  const N=DATA.news||{}; const cats=N.cats||[];
  if(!cats.length){ const e=document.createElement("p"); e.className="empty"; e.textContent="No news loaded yet — tap Update."; p.appendChild(e); return; }
  const all=[]; cats.forEach(c=>(c.items||[]).forEach(it=>{ it.__cat=c.h; all.push(it); }));
  // MUST-KNOW ONLY — big stories everyone's following; drop the smaller/interesting/filler news
  const mustKnow=it=>{ const k=(it&&it.imp||"").toLowerCase(); return k==="critical"||k==="important"; };
  const hero=heroPick(all.filter(mustKnow));

  p.appendChild(bar);

    box.innerHTML=`<summary>In brief · today in 30 seconds</summary><div class="glance-body"><div class="glance-row"><span class="glance-items">${gl.map(esc).join(" · ")}</span></div></div>`;
    p.appendChild(box); }
  const listWrap=document.createElement("div"); listWrap.id="newsList"; p.appendChild(listWrap);
  function renderCompact(){
    listWrap.innerHTML="";

      const row=document.createElement("div"); row.className="crow srow"+(isReadItem(it)?" read":"");

  [...nav.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreMenu) [...moreMenu.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreBtn) moreBtn.classList.toggle("active",overflow.some(t=>t.id===id));
  store.set("tab",id);
  kbdIdx=-1; clearKbdCur(); applyFilter();
  if(!(opts&&opts.keepScroll)){ try{ window.scrollTo(0,0); }catch(e){} try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
}
// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();

</script>
