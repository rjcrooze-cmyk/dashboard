olved.", "imp": "important", "glance": "Court blocks 75-country US visa ban", "url": "https://www.livemint.com/news/us-news/trumps-75-country-immigration-visa-ban-struck-down-by-new-york-judge-contrary-to-law-11787411942248.html", "published": "2026-08-22T21:38:48+05:30", "src": "Mint"}, {"t": "ED books the brother of Jammu and Kashmir's Deputy Chief Minister in a PMLA case", "s": "The Enforcement Directorate has registered a money-laundering case naming the Deputy CM's brother, opening a politically sensitive line of investigation in the union territory.", "imp": "important", "glance": "ED case names J&K Deputy CM's brother", "url": "https://indianexpress.com/article/india/ed-books-jammu-and-kashmir-deputy-cms-brother-in-pmla-case-10845512/", "published": "2026-08-23T01:34:11+00:00", "src": "The Indian Express"}]}, {"h": "🏛️ Karnataka", "tag": "Karnataka", "items": [{"t": "Cabinet's Park Bill would let 5% of park land be alienated; critics see Lalbagh and the tunnel road behind it", "s": "The Karnataka Cabinet cleared a Bill amending the Karnataka Government Parks (Preservation) Act, 1975, to allow up to 5% of park and garden land to be taken for 'public purposes'. Environmentalists and the city's BJP MPs say the real target is Lalbagh land needed for the tunnel road project; the government has not named a site.", "imp": "critical", "glance": "Bill opens 5% of park land to takeover", "url": "https://www.thehindu.com/news/cities/bangalore/park-bill-move-aimed-at-facilitating-takeover-of-lalbagh-land-for-tunnel-road-say-environmentalists-city-bjp-mps/article71378749.ece", "published": "2026-08-23T00:56:45+05:30", "src": "The Hindu"}, {"t": "Roll revision throws up 16.38 lakh deceased voters — four times Karnataka's usual annual deaths", "s": "The special intensive revision has flagged 16.38 lakh dead voters on the rolls, a figure roughly four times the state's average annual death count, raising questions about how long the entries have gone uncorrected and how the deletions will be verified.", "imp": "important", "glance": "16.38 lakh dead voters flagged on rolls", "url": "https://www.thehindu.com/news/cities/bangalore/sir-reports-1638-lakh-dead-voters-four-times-karnatakas-average-annual-deaths/article71366245.ece", "published": "2026-08-22T20:34:58+05:30", "src": "The Hindu"}, {"t": "Karnataka bans the manufacture and sale of 'analogue paneer' for a year", "s": "The state has prohibited making or selling analogue paneer — a vegetable-fat imitation sold as the real thing — for one year, after tests found widespread substitution. Food businesses buying paneer in bulk are the ones most exposed to the change.", "imp": "important", "glance": "Year-long ban on imitation paneer", "url": "https://www.livemint.com/news/india/karnataka-cracks-down-on-analogue-paneer-bans-manufacturing-sale-for-1-year-does-it-apply-to-frozen-desserts-11787408414527.html", "published": "2026-08-22T21:00:02+05:30", "src": "Mint"}, {"t": "Forest Minister to meet families hit by Kodagu's human-wildlife conflict", "s": "The minister will meet affected residents in Kodagu after a run of elephant and wildlife encounters, including a fatal attack on a visitor this week. Compensation and barrier work are expected to be on the table.", "imp": "important", "glance": "Minister to meet Kodagu conflict victims", "url": "https://www.thehindu.com/news/national/karnataka/kodagu-human-wildlife-conflict-forest-minister-to-meet-affected-people/article71378358.ece", "published": "2026-08-22T20:54:10+05:30", "src": "The Hindu"}]}, {"h": "🌴 Kerala", "tag": "Kerala", "items": [{"t": "Kerala's MPs unite against moving Mangaluru out of the Palakkad railway division", "s": "MPs across parties opposed the Railway Board's August 21 order transferring Mangaluru to the Mysuru division, and the state is writing to the Prime Minister calling the decision unilateral. The Leader of the Opposition says the bifurcation would cost Palakkad division about 60% of its revenue.", "imp": "important", "glance": "Kerala MPs fight Mangaluru rail transfer", "url": "https://www.thehindu.com/news/national/kerala/keralam-mps-unite-against-move-to-shift-mangaluru-from-palakkad-railway-division/article71377789.ece", "published": "2026-08-22T19:24:54+05:30", "src": "The Hindu"}, {"t": "Kerala to run round-the-clock speciality care at district hospitals", "s": "The health department will extend speciality services to 24 hours at district hospitals, aiming to cut the night-time referral load on medical colleges. Rollout timelines vary by district.", "imp": "important", "glance": "24x7 speciality care at district hospitals", "url": "https://www.onmanorama.com/kerala/top-news/2026/08/22/health-department-roll-out-round-the-clock-specialty-care-district-hospitals.html", "published": "2026-08-22T17:06:10+00:00", "src": "Onmanorama"}, {"t": "Aroma Chundan wins the Nehru Trophy Boat Race on debut", "s": "The debutant crew took the 72nd Nehru Trophy on Punnamada Lake, ending the race that drew the year's biggest crowd to Alappuzha.", "imp": "interesting", "glance": "Debutant crew takes Nehru Trophy", "url": "https://www.thehindu.com/news/national/kerala/aroma-chundan-lifts-nehru-trophy-boat-race-on-debut/article71378302.ece", "published": "2026-08-22T21:12:36+05:30", "src": "The Hindu"}, {"t": "Health department and Kochi Corporation to inspect water bottling units", "s": "Joint inspections of packaged drinking water units follow complaints about quality and licensing in the city. Units found non-compliant face suspension.", "imp": "interesting", "glance": "Kochi water bottling units to be checked", "url": "https://www.thehindu.com/news/national/kerala/health-dept-kochi-corporation-to-conduct-inspections-at-water-bottling-units/article71378085.ece", "published": "2026-08-23T00:58:20+05:30", "src": "The Hindu"}]}, {"h": "🏯 Mysuru", "tag": "Mysore", "items": [{"t": "Mysuru division formally takes in Mangaluru; local voices expect an infrastructure boost", "s": "With the Railway Board order moving Mangaluru under South Western Railway from October 1, railway activists and elected representatives in the coastal belt say routing it through the Mysuru division should improve connectivity and project funding. Kerala is contesting the transfer, so the change is being implemented under protest.", "imp": "important", "glance": "Mysuru rail division absorbs Mangaluru", "url": "https://www.thehindu.com/news/cities/Mangalore/mangaluru-under-swr-railway-activists-and-peoples-representatives-say-it-will-boost-infrastructure-and-connectivity/article71377528.ece", "published": "2026-08-22T19:59:18+05:30", "src": "The Hindu"}, {"t": "Mandya farmers told to switch to short-duration dryland crops as the monsoon deficit bites", "s": "The Deputy Commissioner has directed officials to push ragi, jowar, sesame, cowpea, black gram and horse gram — crops that need far less water — as the district's rainfall shortfall deepens. It is the clearest official signal yet that this season's cropping plan needs changing in the Mysuru belt.", "imp": "important", "glance": "Mandya pushed to dryland crops", "url": "https://www.thehindu.com/news/national/karnataka/karnataka-monsoon-deficit-farmers-in-mandya-urged-to-shift-to-short-duration-dryland-crops/article71377182.ece", "published": "2026-08-22T16:12:05+05:30", "src": "The Hindu"}, {"t": "White-topping starts on a 2.2-km stretch of Mysuru road", "s": "Work has begun on concreting a 2.2-km stretch in the city, with the usual diversions and dust for the duration. Mysuru's earlier white-topping stretches have taken longer than announced, so plan detours around the corridor.", "imp": "important", "glance": "2.2-km Mysuru white-topping begins", "url": "https://www.thehindu.com/news/national/karnataka/white-topping-work-launched-on-22-km-road-stretch-in-mysuru/article71378449.ece", "published": "2026-08-22T21:06:37+05:30", "src": "The Hindu"}, {"t": "Chamarajanagar forest circle has logged 3,289 forest offence cases since 2010-11", "s": "The tally covers poaching, encroachment and timber cases across the circle over fifteen years, and comes as the region wrestles with rising human-wildlife pressure.", "imp": "interesting", "glance": "3,289 forest cases in Chamarajanagar", "url": "https://www.thehindu.com/news/national/karnataka/3289-forest-offence-cases-registered-in-chamarajanagar-forest-circle-since-2010-11/article71374406.ece", "published": "2026-08-22T21:33:27+05:30", "src": "The Hindu"}]}, {"h": "🏙️ Bengaluru", "tag": "Bengaluru", "items": [{"t": "Airport metro slips again: Blue Line to open in phases from mid-2027, full stretch only by March 2028", "s": "The minister confirmed the 58-km Blue Line to Kempegowda International Airport will open in stages starting mid-2027, with the complete corridor running only by March 2028. Anyone planning airport runs should assume road travel for at least two more years.", "imp": "critical", "glance": "Airport metro complete only by 2028", "url": "https://www.thehindu.com/news/cities/bangalore/blue-line-to-open-in-phases-from-mid-2027-full-stretch-by-march-2028-says-kbg/article71378865.ece", "published": "2026-08-23T00:52:52+05:30", "src": "The Hindu"}, {"t": "Nearly 70% of Bengaluru's white-topping projects have missed their deadlines", "s": "An audit of the city's concreting programme found the large majority of stretches running past schedule, leaving commuters with half-dug corridors for months. The same contractors and design template are being used on new stretches.", "imp": "important", "glance": "70% of white-topping work runs late", "url": "https://www.thehindu.com/news/cities/bangalore/nearly-70-of-bengalurus-white-topping-projects-miss-deadlines-commuters-at-receiving-end/article71377658.ece", "published": "2026-08-22T19:30:27+05:30", "src": "The Hindu"}, {"t": "Transgender woman stabbed to death near Majestic after resisting a ₹200 robbery", "s": "The victim was attacked near the BMTC bus station at Majestic while resisting a robbery of ₹200. Police have made arrests and are treating the case as murder.", "imp": "important", "glance": "Fatal ₹200 robbery near Majestic", "url": "https://indianexpress.com/article/cities/bangalore/transgender-woman-stabbed-to-death-after-resisting-rs-200-robbery-bid-in-bengaluru-10845226/", "published": "2026-08-22T15:19:39+00:00", "src": "The Indian Express"}, {"t": "A 60% rebate has nudged B-Khata conversions, but take-up is still thin", "s": "The discount on conversion charges has moved some property owners to regularise B-Khata holdings, though civic officials say the response is well short of what the scheme was sized for. The window is time-limited.", "imp": "interesting", "glance": "B-Khata rebate draws limited interest", "url": "https://www.thehindu.com/news/cities/bangalore/60-rebate-spurs-b-khata-conversion-but-fails-to-attract-substantial-interest/article71378274.ece", "published": "2026-08-23T00:49:36+05:30", "src": "The Hindu"}]}]}, "newsUpdated": "2026-08-23T07:31:17+05:30", "aitrends": {"updated": "2026-08-23T07:31:17+05:30", "items": [{"t": "OpenAI cuts frontier model pricing over 20%", "s": "OpenAI published lower per-token developer rates for GPT-5.6 Sol, its second frontier price cut this year, as rivals undercut top-tier pricing. Concretely: anything you already run on the frontier tier gets cheaper today, with no code change.", "heat": 94, "delta": "new", "sources": 4, "url": "https://www.reuters.com/technology/openai-cuts-developer-pricing-frontier-gpt-56-sol-model-by-more-than-20-2026-08-21/", "glance": "Frontier tokens get 20% cheaper", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Price war reaches the frontier tier", "basis": "Published rate card cut of >20% on GPT-5.6 Sol"}}, {"t": "A 27B agent beats far larger models at replication", "s": "Inherent, founded by DeepMind alumni, says its Faraday agent on a 27-billion-parameter model outscored much larger OpenAI and Anthropic systems at reproducing published scientific results. The use-case is concrete — automated replication of papers — but the benchmark is the lab's own and unreplicated.", "heat": 86, "delta": "new", "sources": 4, "url": "https://techcrunch.com/2026/08/22/inherent-founded-by-deepmind-alumni-says-its-ai-teammate-just-outperformed-anthropic-and-openai-at-replicating-research/", "glance": "Small model wins on scientific replication", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Harness beats scale on a real task", "basis": "Vendor benchmark: 27B agent tops larger models at reproducing papers"}}, {"t": "290B-parameter MoE models run on a gaming PC", "s": "FreeToken shows frontier-size mixture-of-experts models above 290B parameters running locally on consumer GPUs by streaming experts, putting models that needed a datacentre onto a desktop. Early open-source work, but the capability is directly usable.", "heat": 72, "delta": "new", "sources": 2, "url": "https://github.com/FlashML-org/FreeToken", "glance": "Frontier-size MoE on consumer hardware", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "Datacentre-class models on a desktop", "basis": "Open-source expert-streaming runtime demonstrated on consumer GPUs"}}, {"t": "Nvidia warns of a 15% AI server price rise", "s": "Nvidia is reported to have told large customers that AI server prices will rise about 15% on component and memory costs. If it holds it raises the cost floor for every AI buildout downstream — but it is so far a single sourced report.", "heat": 78, "delta": "new", "sources": 3, "url": "https://www.livemint.com/companies/news/nvidia-reportedly-warns-some-of-its-biggest-customers-about-upcoming-price-hike-of-ai-servers-by-15-details-11787451271882.html", "glance": "AI hardware gets more expensive", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Cost floor for AI buildouts rises", "basis": "Single-sourced report of a 15% AI server price increase"}}, {"t": "MCP publishes its next roadmap", "s": "The Model Context Protocol team set out its roadmap for the tool-and-context standard that most agent stacks now build against, covering registry, auth and streaming work. Matters to anyone wiring tools into agents.", "heat": 74, "delta": "new", "sources": 2, "url": "https://blog.modelcontextprotocol.io/posts/mcp-roadmap/", "glance": "Agent tool standard sets direction", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Roadmap for the agent plumbing standard", "basis": "Official MCP roadmap post covering registry, auth and streaming"}}, {"t": "Anthropic IPO filing to name AI backlash as a risk", "s": "Reporting says Anthropic's IPO filing will list public backlash against AI among its risk factors, a first for a frontier lab going public. Yesterday's $100bn valuation chatter has cooled into filing detail.", "heat": 68, "delta": "cooling", "sources": 3, "url": "https://www.cnbc.com/2026/08/21/-anthropic-ipo-filing-will-show-ai-backlash-as-a-risk-factor-sources-say.html", "glance": "AI backlash becomes an IPO risk factor", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Backlash priced into a listing", "basis": "Sourced reporting on an unfiled S-1's risk section"}}, {"t": "Open TTS holds sub-50ms at a fraction of the cost", "s": "The sub-50ms open text-to-speech result is still spreading, with the write-up on how the latency and roughly 2%-of-incumbent cost were achieved. Real-time voice agents are the direct use-case.", "heat": 62, "delta": "cooling", "sources": 3, "url": "https://nari-labs.com/blog/qwen3-tts-speed-cost-frontier/", "glance": "Real-time voice gets cheap", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Real-time voice agents become affordable", "basis": "Published latency and cost figures for an open TTS stack"}}, {"t": "Nvidia: the harness, not the model, is the hero", "s": "Nvidia research showing that agent reliability comes mostly from the harness and fine-tuning around a model rather than raw model strength is still circulating, and is the cheapest lever most teams have for agent quality.", "heat": 54, "delta": "cooling", "sources": 3, "url": "https://techcrunch.com/2026/08/21/nvidia-just-showed-that-the-harness-not-the-ai-model-is-now-the-real-hero/", "glance": "Agent quality comes from the scaffolding", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Scaffolding beats model swaps", "basis": "Nvidia research on harness and fine-tuning driving agent reliability"}}, {"t": "Frontier labs have no public rogue-model plans", "s": "A study finds leading AI labs publish almost no concrete plans for containing a model that goes rogue, despite all of them having preparedness frameworks. Governance signal rather than capability.", "heat": 56, "delta": "new", "sources": 2, "url": "https://techcrunch.com/2026/08/22/frontier-ai-labs-still-wont-say-how-theyd-contain-a-rogue-model/", "glance": "Containment plans stay unpublished", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Preparedness frameworks lack containment detail", "basis": "Study of public documentation across leading labs"}}, {"t": "Google's Gemma downloads pass one billion", "s": "Google's open Gemma model family crossed a billion cumulative downloads, a scale marker for open weights inside enterprises even as it moved no markets.", "heat": 48, "delta": "new", "sources": 2, "url": "https://blog.google/technology/ai/", "glance": "Open weights hit billion-download scale", "assess": {"mag": 2, "timeline": "now", "evidence": "proven", "verdict": "Open models are mainstream by volume", "basis": "Vendor-reported cumulative download milestone"}}, {"t": "Alphabet loses ~$200bn on DeepMind departure rumours", "s": "Alphabet shares fell sharply on reports of senior AI researchers leaving DeepMind, wiping roughly $200 billion of market value. Rumour-driven and unconfirmed by the company.", "heat": 44, "delta": "new", "sources": 2, "url": "https://www.inkl.com/news/200-billion-in-lost-market-cap-alphabet-stock-rocked-by-brutal-ai-brain-drain-and-deepmind-rumours", "glance": "Talent rumours hit Alphabet hard", "assess": {"mag": 2, "timeline": "now", "evidence": "speculative", "verdict": "Market moves on unconfirmed departures", "basis": "Share move attributed to unconfirmed DeepMind departure reports"}}, {"t": "Opus 4.6's content limits get stress-tested", "s": "Tests published against Anthropic's Opus 4.6 report the model producing sexual content its policy forbids, keeping the guardrail-consistency story going a second day.", "heat": 42, "delta": "cooling", "sources": 2, "url": "https://techcrunch.com/2026/08/21/anthropics-opus-4-6-is-a-smut-machine/", "glance": "Guardrail consistency questioned again", "assess": {"mag": 2, "timeline": "now", "evidence": "early", "verdict": "Policy and behaviour diverge under testing", "basis": "Third-party prompt tests against the published usage policy"}}, {"t": "DeepMind takes games research into EVE Online", "s": "DeepMind is partnering with game studios, including EVE Online, to prototype AI gameplay, extending fifteen years of games-as-research-environment work.", "heat": 38, "delta": "steady", "sources": 2, "url": "https://deepmind.google/discover/blog/from-atari-to-eve-online-building-on-15-years-of-ai-research-in-games/", "glance": "Games stay the AI research sandbox", "assess": {"mag": 2, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "Games remain the agent testbed", "basis": "Announced studio partnerships for AI gameplay prototypes"}}]}, "aitrendsUpdated": "2026-08-23T07:31:17+05:30", "science": {"updated": "2026-08-23T07:31:17+05:30", "items": [{"t": "A quantum trick pushes coherent X-rays past a long-standing energy ceiling", "s": "UC San Diego and TU Wien found a quantum regime that generates coherent X-rays at higher energies than the accepted limit allowed, opening a cheaper route to hard-X-ray light without a synchrotron. Useful for imaging, materials inspection and chip metrology.", "tag": "Physics", "imp": "important", "glance": "Coherent X-rays break an energy limit", "url": "https://scitechdaily.com/quantum-experiment-breaks-a-long-standing-x-ray-energy-limit/", "src": "UC San Diego / TU Wien", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Table-top route to harder coherent X-rays", "basis": "Experiment demonstrating a new quantum regime above the prior X-ray energy limit"}, "published": "2026-08-23T07:07:17+05:30"}, {"t": "A once-daily pill brings skin colour back in vitiligo", "s": "A daily oral drug produced meaningful repigmentation in people with vitiligo in a controlled trial — the first pill-based option in a condition treated so far mainly with creams and light therapy. Peer-reviewed trial data; effects build over months rather than weeks.", "tag": "Health", "imp": "important", "glance": "Oral drug repigments vitiligo skin", "url": "https://www.sciencealert.com/this-once-daily-pill-helps-the-skin-regain-its-color-in-people-with-vitiligo", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "First real oral option for vitiligo", "basis": "Controlled trial showing repigmentation from a once-daily oral drug"}, "published": "2026-08-23T05:49:17+05:30"}, {"t": "Engineered natural killer cells finally get inside solid tumours", "s": "Stanford Medicine researchers re-engineered natural killer cells so they can enter and persist inside solid tumours, which has been the main barrier to using them as a cancer therapy; treated mice showed slowed tumour growth. Preclinical mouse work, not yet in patients.", "tag": "Health", "imp": "important", "glance": "NK cells breach solid tumours in mice", "url": "https://scitechdaily.com/scientists-supercharge-natural-killer-cells-to-attack-solid-tumors/", "src": "Stanford Medicine / SciTechDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Cracks the solid-tumour barrier for NK therapy", "basis": "Mouse study: engineered NK cells entered solid tumours and slowed growth"}, "published": "2026-08-23T03:19:17+05:30"}, {"t": "A stem-cell therapy improved nine in ten patients in the largest heart-failure trial yet", "s": "A Chinese multicentre trial of a cell therapy for chronic heart failure reported significant improvement in about 90% of participants, making it the largest trial of its kind to report. Results are from the trial investigators and await independent replication and full peer-reviewed publication.", "tag": "Health", "imp": "important", "glance": "Largest cardiac stem-cell trial reports gains", "url": "https://interestingengineering.com/science/heal-chf-stem-cell-heart-failure-trial", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Biggest cardiac cell-therapy signal so far", "basis": "Largest reported heart-failure cell trial; investigator-reported, awaiting replication"}, "published": "2026-08-23T02:07:17+05:30"}, {"t": "A platinum-nickel catalyst keeps splitting water for 3,000 hours", "s": "Korean researchers used atomic-level engineering to build a Pt-Ni hydrogen catalyst that ran continuously for 3,000 hours without meaningful decay — durability, not peak activity, is what has kept green-hydrogen electrolysers expensive. Lab-scale demonstration.", "tag": "Energy", "imp": "important", "glance": "Hydrogen catalyst lasts 3,000 hours", "url": "https://interestingengineering.com/innovation/atomic-engineering-produces-hydrogen-catalyst-that-lasts-3000-hours", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Durability was the electrolyser bottleneck", "basis": "3,000-hour continuous run of a Pt-Ni catalyst at lab scale"}, "published": "2026-08-22T23:37:17+05:30"}, {"t": "One rice gene variant resists both drought and blast disease", "s": "A naturally occurring truncated NLR variant gave rice plants combined resistance to drought and to blast, the fungal disease that is the crop's biggest yield threat — combinations like this are rare in breeding stock and this one can be crossed into existing varieties. Published in Nature Communications.", "tag": "Biology", "imp": "important", "glance": "Rice variant beats drought and blast", "url": "https://www.nature.com/articles/s41467-026-76840-6", "src": "Nature Communications", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Two-in-one trait breeders can actually use", "basis": "Nature Communications: natural NLR variant confers dual drought and blast resistance"}, "published": "2026-08-22T05:49:17+05:30"}, {"t": "Surgery after immunotherapy beats staying on drugs in advanced liver cancer", "s": "In The Lancet, the TALENTOP randomised trial found that patients with advanced hepatocellular carcinoma and macrovascular invasion who went to liver resection after atezolizumab plus bevacizumab had significantly longer time to treatment failure than those kept on maintenance therapy. It gives oncologists a concrete reason to reassess surgical candidacy after systemic therapy shrinks a tumour — conversion surgery moves from case reports to trial evidence.", "tag": "Health", "imp": "important", "glance": "Conversion surgery works in liver cancer", "url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)01252-3/fulltext?rss=yes", "published": "2026-08-22T00:00:00+00:00", "src": "The Lancet", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Randomised trial changes liver-cancer sequencing", "basis": "Lancet randomised trial; longer time to treatment failure vs maintenance"}}, {"t": "Robot arms 3D-print a reactor vessel to break a nuclear bottleneck", "s": "Three coordinated robotic arms deposited a full-size nuclear pressure vessel in large-scale metal additive manufacturing, aimed squarely at the forging bottleneck that limits how fast the US can build new reactors. Heavy forgings currently come from a handful of suppliers with multi-year queues; printing them shifts the constraint from global forging capacity to factory floor space.", "tag": "Chemistry", "imp": "important", "glance": "Printing the part that forgings gate", "url": "https://interestingengineering.com/ai-robotics/robotic-arms-3d-print-nuclear-vessel", "published": "2026-08-21T22:40:22+00:00", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Bypasses the reactor forging queue", "basis": "Full-size vessel printed; qualification and code approval still ahead"}}, {"t": "US silicon-anode plant clears the certification for mass production", "s": "Sila's Moses Lake, Washington plant has won the qualification it needed to move silicon-carbon anode material from pilot batches to full-rate manufacturing. Silicon anodes raise cell energy density well above graphite; the bottleneck has always been making the material consistently at tonnage. This is a manufacturing milestone rather than a chemistry one, which is exactly the step that decides whether the technology reaches real packs.", "tag": "Chemistry", "imp": "important", "glance": "Silicon anodes reach factory scale", "url": "https://interestingengineering.com/energy/sila-silicon-carbon-anode-production", "published": "2026-08-21T22:10:05+00:00", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "Silicon anodes clear the factory hurdle", "basis": "Plant certification for mass production; chemistry itself already demonstrated"}}, {"t": "KAIST finds the circuits that lock cells into disease, and a way to unlock them", "s": "A KAIST team led by Kwang-Hyun Cho identified the causal network motifs that make a cell's state irreversible — the reason a cancer cell stays a cancer cell — and built a control method called ROOT that targets those circuits to steer cells back toward a normal state. The use-case is cancer reversion therapy that reprograms tumour cells instead of killing them. Computational plus cell-level validation; no animal or human data yet.", "tag": "Biology", "imp": "important", "glance": "Reversing a cell's locked-in state", "url": "https://phys.org/news/2026-08-root-method-path-reversing-biological.html", "published": "2026-08-21T19:00:04+00:00", "src": "KAIST / Phys.org", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A control theory for cell fate", "basis": "Causal-circuit analysis + ROOT control validated in cells; no in vivo results"}}, {"t": "Cod skin heals severe burns faster than collagen scaffolds", "s": "A comparative study led by Mount Sinai's John Lantis found burn patients treated with Atlantic cod skin spent less time in hospital and had fewer complications than those given synthetic or collagen-based temporary coverings before grafting. The omega-3 content appears to trigger a useful level of inflammation. The cod-skin product is already approved in the US and UK, so this is about switching an existing option to first-line.", "tag": "Health", "imp": "important", "glance": "Fish skin outperforms collagen dressings", "url": "https://www.newscientist.com/article/2586000-burns-heal-more-rapidly-after-treatment-with-fish-skin/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "published": "2026-08-21T15:00:00+00:00", "src": "New Scientist", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "An approved dressing proves its edge", "basis": "Comparative clinical data; product already FDA/UK-approved for burns"}}, {"t": "A chip's throwaway cladding becomes its light source", "s": "Researchers made the silica cladding around a silicon-nitride photonic waveguide do optical work instead of just holding the core in place: Raman lasing in the silica combines with the core's nonlinear comb generation to produce broadband optical frequency combs on a fingertip-sized chip. Reported in Advanced Photonics, it widens the wavelength range available to chip-scale combs used for optical communications, chemical sensing and precision timing.", "tag": "Physics & Space", "imp": "important", "glance": "Cladding turned into a comb source", "url": "https://scitechdaily.com/scientists-turn-an-overlooked-chip-layer-into-a-powerful-new-light-source/", "published": "2026-08-21T14:46:31+00:00", "src": "Advanced Photonics / SciTechDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Doubles what a photonic chip can emit", "basis": "Advanced Photonics; demonstrated Raman lasing + broadband combs on-chip"}, "eli": "A photonic chip normally makes light in its middle layer, and the glass around it is just packaging. The team made that packaging generate light too, so one small chip now produces hundreds of precise colours instead of a narrower set."}, {"t": "A magnetic switching trick could cut AI memory energy thousands-fold", "s": "Researchers showed the microscopic magnetic flips behind digital memory can be driven with thousands of times less energy, targeting the memory traffic that now dominates AI power draw rather than the compute itself. Demonstrated at device level, not yet in production memory.", "tag": "Computing", "imp": "important", "glance": "Memory switching at a fraction of the energy", "url": "https://scitechdaily.com/new-technique-could-slash-ais-memory-energy-use-by-thousands-of-times/", "src": "SciTechDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Attacks AI's real power sink, memory", "basis": "Device-level demonstration of far lower-energy magnetic switching"}, "published": "2026-08-21T20:01:17+05:30"}, {"t": "A minutes-long process makes polymers that are stretchy and ultratough at once", "s": "A Science Advances team reports rapid fabrication of polymer materials that are simultaneously stretchable, ultratough and rigid — properties that normally trade off against each other — using a process fast enough to be manufacturable.", "tag": "Materials", "imp": "important", "glance": "Tough and stretchy polymer, made fast", "url": "https://www.science.org/doi/abs/10.1126/sciadv.aeh7273", "src": "Science Advances", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Breaks the toughness-versus-stretch trade-off", "basis": "Science Advances: rapid fabrication route to stretchable, ultratough, rigid polymers"}, "published": "2026-08-21T12:49:17+05:30"}, {"t": "A photonic chip does the computing inside the sensor, all in light", "s": "An end-to-end optical in-sensor computing system built on photonic integrated circuits processes images where they are captured, with no conversion to electronics first — the route to machine vision that draws far less power and adds almost no latency.", "tag": "Computing", "imp": "important", "glance": "Vision processing done in light", "url": "https://www.science.org/doi/abs/10.1126/sciadv.aef8657", "src": "Science Advances", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Sensing and compute collapse into one chip", "basis": "Science Advances: end-to-end all-optical in-sensor computing on photonic ICs"}, "published": "2026-08-21T12:49:17+05:30"}]}, "scienceUpdated": "2026-08-23T07:31:17+05:30", "scienceDaily": {"updated": "2026-08-23T07:31:17+05:30", "items": [{"t": "Freezing a fibre's core makes light and sound interact 1,000x more strongly", "s": "Freezing the liquid core of an optical fibre created conditions where light and sound couple more than a thousand times more strongly than in ordinary fibre — the effect underpinning fibre sensors, signal processing and narrow-linewidth lasers. Reported by the research team; lab-scale.", "tag": "Physics", "imp": "important", "glance": "Frozen fibre boosts light-sound coupling 1,000x", "url": "https://www.sciencedaily.com/releases/2026/08/260821012228.htm", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "A thousandfold jump in a workhorse effect", "basis": "Frozen-core fibre showed >1,000x stronger light-sound interaction in lab tests"}, "published": "2026-08-22T18:49:17+05:30"}, {"t": "A yeast beta-glucan supplement restored anti-tumour immunity in mice", "s": "A simple yeast-derived food supplement reversed the immune suppression that lets tumours grow in mice, restoring the immune system's ability to attack cancer cells. Mouse study only — a cheap oral adjunct is the appeal, but nothing here has been tested in people.", "tag": "Health", "imp": "important", "glance": "Yeast supplement revives tumour immunity in mice", "url": "https://www.sciencedaily.com/releases/2026/08/260821012230.htm", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Cheap oral route to restoring tumour immunity", "basis": "Mouse study: yeast beta-glucan restored anti-tumour immune function"}, "published": "2026-08-22T16:25:17+05:30"}, {"t": "A hidden electronic state caught forming in 30 femtoseconds", "s": "Researchers watched a light-triggered hidden electronic state assemble inside a material in just 30 femtoseconds, resolving a step never observed before. Hidden states are the basis for proposed ultrafast optical switches and memory that would run far faster than transistors. Peer-reviewed.", "tag": "Materials", "imp": "important", "glance": "Ultrafast switching state caught forming", "url": "https://www.sciencedaily.com/releases/2026/08/260820202856.htm", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Shows how ultrafast optical switching starts", "basis": "Time-resolved measurement of hidden-state formation in 30 femtoseconds"}, "published": "2026-08-21T17:49:17+05:30"}, {"t": "GDF15 protects the liver through a brain relay, without weight loss", "s": "McMaster University researchers traced a previously unknown brain-to-liver pathway in which the appetite hormone GDF15 triggers glucocorticoid release that calms liver inflammation and scarring — and does so independently of weight loss. Fatty liver disease is currently treated mostly by making patients lose weight, so a route that works without it opens a separate drug target for MASH.", "tag": "Health", "imp": "important", "glance": "Liver protection decoupled from weight loss", "url": "https://www.sciencedaily.com/releases/2026/08/260820202854.htm", "published": "2026-08-21T11:38:41+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A second job for the appetite hormone", "basis": "Preclinical mechanism study, McMaster; pathway shown in animal models"}}, {"t": "AI reads immune readiness before a vaccine is given", "s": "By analysing baseline antibody patterns in more than 4,000 people, researchers found a signature of 'immune readiness' that separates strong from weak vaccine responders before vaccination. Some healthy people responded poorly and some immunosuppressed people responded strongly, which is why a pre-test matters: it would let clinicians pick dose, adjuvant or timing per person instead of assuming health status predicts protection.", "tag": "Health", "imp": "important", "glance": "Predicting who a vaccine will protect", "url": "https://www.sciencedaily.com/releases/2026/08/260820202842.htm", "published": "2026-08-21T10:59:05+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Pre-vaccination test flags weak responders", "basis": "Antibody-pattern model across 4,000+ people; needs prospective validation"}}, {"t": "At-home stool test cuts colorectal cancer deaths by 43%", "s": "Long-term follow-up of more than 376,000 people in Sweden found that those who took part in colorectal cancer screening had a 43% lower risk of dying from the disease. The intervention is an at-home faecal test, not a colonoscopy, which is the point: the benefit comes from participation rates that a simple posted kit can actually achieve.", "tag": "Health", "imp": "critical", "glance": "Home screening slashes CRC deaths", "url": "https://www.sciencedaily.com/releases/2026/08/260820202833.htm", "published": "2026-08-21T07:37:33+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Screening participation halves the death risk", "basis": "376,000-person Swedish cohort with long-term mortality follow-up"}}]}, "scienceDailyUpdated": "2026-08-23T07:31:17+05:30", "life": {"updated": "2026-08-23T07:31:17+05:30", "items": []}, "lifeUpdated": "2026-08-23T07:31:17+05:30", "mind": {"updated": "2026-08-23T07:31:17+05:30", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "Dendrites gate which neural assembly gets to learn", "s": "Neuron reports that contextual signals arriving on dendrites decide which cell assemblies undergo plasticity, so the same network can learn different things depending on context without overwriting what it already knows. It is a concrete mechanism for the catastrophic-forgetting problem that both brains and artificial networks face.", "url": "https://www.cell.com/neuron/fulltext/S0896-6273(26)00583-0?rss=yes", "published": "2026-08-21T00:00:00+00:00", "src": "Neuron (Cell Press)", "assess": {"mag": 4, "timeline": "unclear", "evidence": "strong", "verdict": "Context decides which assembly learns", "basis": "Peer-reviewed Neuron; dendritic gating of plasticity in cell assemblies"}, "glance": "Dendrites gate which neural assembly gets to learn", "imp": "important"}, {"t": "Adult hippocampal neurogenesis is disrupted in major depression", "s": "A Nature Medicine study links dysregulated adult neurogenesis in the human hippocampus to major depressive disorder, tightening a hypothesis that has been argued over for two decades. It matters for treatment because several antidepressant mechanisms, including ketamine and psilocybin, are thought to act partly through this pathway.", "url": "https://www.nature.com/articles/s41591-026-04571-8", "published": "2026-08-21T00:00:00+00:00", "src": "Nature Medicine", "assess": {"mag": 4, "timeline": "unclear", "evidence": "strong", "verdict": "Neurogenesis hypothesis gains real support", "basis": "Nature Medicine; human hippocampal tissue evidence in MDD"}, "glance": "Adult hippocampal neurogenesis is disrupted in major depression", "imp": "important"}, {"t": "Ozempic acts on the brain's hunger neurons in the opposite way to expectation", "s": "GLP-1 drugs were assumed to quiet the neurons that drive hunger. New work finds semaglutide instead activates AgRP hunger-linked neurons, and that this activation appears necessary for the drug's sustained effect on food intake — which reframes how the whole drug class is understood to work in the brain. Peer-reviewed animal work.", "url": "https://www.sciencedaily.com/releases/2026/08/260820002436.htm", "src": "ScienceDaily / mind_brain", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Rewrites the mechanism behind GLP-1 drugs", "basis": "Peer-reviewed animal work: semaglutide activates rather than silences hunger neurons"}, "published": "2026-08-21T04:49:17+05:30", "imp": "important", "glance": "Ozempic acts on the brain's hunger neurons in the opposite way to expectation"}, {"t": "Schizophrenia's synapse loss follows an organised left-frontal pattern", "s": "Synaptic-density brain scans show schizophrenia involves widespread loss of the connections between neurons, hitting the left hemisphere hardest and spreading in a pattern that tracks the brain's own chemistry and wiring rather than at random. The researchers identify a left frontal region that may be where the loss begins — which would give trials a defined target and a defined stage to intervene at.", "url": "https://www.sciencedaily.com/releases/2026/08/260820002443.htm", "published": "2026-08-20T11:58:26.738631+00:00", "src": "ScienceDaily / imaging study", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Synapse loss has a startingsite", "basis": "Peer-reviewed synaptic-density imaging; organised spread, left frontal origin"}, "eli": "Brain cells talk through junctions called synapses. In schizophrenia many are lost — and this scan shows they go in an orderly pattern starting at one spot, not everywhere at once.", "glance": "Schizophrenia's synapse loss follows an organised left-frontal pattern", "imp": "important"}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Non-invasive recordings decoded into accurate full sentences", "s": "A q-bio.NC preprint reports decoding natural, unconstrained sentences from non-invasive brain recordings with accuracy that previously needed implanted electrodes, using a language-model-conditioned decoder. If it survives review and replication, it matters enormously for people who cannot speak but are not candidates for surgery. Preprint, small cohort, and the decoder leans on strong language priors — a known route to over-optimistic reconstruction scores.", "url": "https://arxiv.org/abs/2608.18114", "published": "2026-08-20T04:00:00+00:00", "src": "arXiv q-bio.NC", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Speech decoding without opening the skull", "basis": "arXiv preprint; sentence-level accuracy from non-invasive recordings, unreplicated"}, "glance": "Non-invasive recordings decoded into accurate full sentences", "imp": "important"}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "Speaking several languages tracks with a brain that looks years younger", "s": "In a large multi-country cohort, people who spoke several languages showed brain-age estimates well below their chronological age — about 13 years younger for four-language speakers. Observational, so it cannot show that learning a language causes the gap, but the dose-response pattern across number of languages is consistent.", "url": "https://www.sciencedaily.com/releases/2026/08/260821012226.htm", "src": "ScienceDaily / mind_brain", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Multilingualism tracks a younger brain age", "basis": "Large multi-country cohort; dose-response by number of languages spoken"}, "published": "2026-08-22T19:01:17+05:30", "imp": "important", "glance": "Speaking several languages tracks with a brain that looks years younger"}, {"t": "Two brain circuits work out whether you are actually in control", "s": "Neuron identifies a pair of prefrontal-subcortical circuits that estimate controllability — whether your actions are changing outcomes — and shows that this estimate reshapes how you learn from what follows. Perceived controllability is central to learned helplessness and to anxiety and depression, so a circuit-level account gives those conditions a mechanistic handle.", "url": "https://www.cell.com/neuron/fulltext/S0896-6273(26)00584-2?rss=yes", "published": "2026-08-21T00:00:00+00:00", "src": "Neuron (Cell Press)", "assess": {"mag": 4, "timeline": "unclear", "evidence": "strong", "verdict": "Circuits that compute whether you matter", "basis": "Peer-reviewed Neuron; two dissociable prefrontal-subcortical circuits"}, "glance": "Two brain circuits work out whether you are actually in control", "imp": "important"}, {"t": "Cutting social media does not, by itself, lift young adults' wellbeing", "s": "A controlled trial in which young adults limited their social-media use found no reliable improvement in wellbeing measures against controls — a null result that runs against both popular advice and several widely cited earlier studies. It suggests time-on-app is the wrong lever, and that what people do while there matters more than how long they stay.", "url": "https://www.psychologicalscience.org/", "published": "2026-08-20T16:58:26.738631+00:00", "src": "Psychological Science / APS", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Screen-time limits are the wrong lever", "basis": "Controlled trial with null result; peer-reviewed, contradicts prior correlational work"}, "glance": "Cutting social media does not, by itself, lift young adults' wellbeing", "imp": "important"}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today in this area", "s": "No Major or Historic peer-reviewed result surfaced in this area in the scan window.", "url": "", "published": "", "src": "", "glance": "Nothing new today", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "No qualifying result today", "basis": "Full feed scan plus web sweep returned nothing at Major level"}, "_placeholder": true}]}]}, "mindUpdated": "2026-08-23T07:31:17+05:30", "mindset": {"updated": "2026-08-23T07:31:17+05:30", "messages": [{"who": "Joseph Rodrigues", "t": "Act like you are already there (The Science of Getting Rich)", "vid": "rIwy6GyZU1E", "url": "https://www.youtube.com/watch?v=rIwy6GyZU1E", "gist": "Working from Wallace Wattles' line to 'think and speak of all the things you have asked for in terms of actual present ownership', Rodrigues separates acting-as-if from pretending. Pretending is a conscious performance you have to keep up; what he is describing is placing a single instruction in the subconscious — the decision that you already are what you want to be — and then letting identity, values and skills reorganise around it. His point is that acting like you are already there is the *result* of that decision, not the technique for producing it. The practical takeaway: stop rehearsing the wanting, which reinforces the absence, and settle the question once."}, {"who": "Elmer O. Locker Jr", "t": "Grateful for Freedom — Prison Past to Present Life", "vid": "yXdIxA-iFJM", "url": "https://www.youtube.com/watch?v=yXdIxA-iFJM", "gist": "Locker uses his own prison sentence as a gratitude anchor: when the feeling will not come on its own, go back to the worst stretch you actually lived through and compare it to where you are standing now. The point is not to dwell on the past but to use it as a reference point — freedom stops being invisible once you remember what its absence felt like. Any hard chapter you have already survived can serve the same function."}, {"who": "Abraham Hicks", "t": "Answer This Honestly And You Will Know What Is Coming!", "vid": "E_E5G7dZlvY", "url": "https://www.youtube.com/watch?v=E_E5G7dZlvY", "gist": "The question posed is not whether you want something but whether you believe your own desire. Life keeps generating new desire — that part is automatic and cannot be slowed. What varies is how much of it you actually believe is available to you, and beliefs are just habits of thought, most of them inherited by watching what the people around you were living. The trap is that observing 'what is' and then believing it makes it recur, so most people end up believing in not-enough because that is what they witnessed. The move is to think past what is: attention is what causes more of a thing to arrive, so choosing where it goes — rather than sorting manifestations into good and bad piles — is the whole of deliberate creation."}]}, "mindsetUpdated": "2026-08-23T07:31:17+05:30", "youtube": {"count": 9, "note": "Today's uploads from the subscription sweep, each gisted from its actual transcript. YouTube rate-limited caption downloads for roughly three-quarters of today's videos, so this is the subset with a real transcript-based takeaway.", "groups": [{"h": "🤖 AI, Tech & Business", "items": [{"t": "Tesla Reveals Wild Optimus Robot Timeline & Robotaxi Bottleneck", "vid": "jPrdTOFwp90", "s": "A JP Morgan site visit to Tesla puts the robotaxi bottleneck squarely on FSD v15 — about 40% of its modules are already running in the test fleet — and lays out a three-phase Optimus plan: production plus 'Optimus Academy' in H2 2026, internal factory deployment next, external commercial sales as early as H2 2027.", "glance": "Tesla's robotaxi ramp is gated on FSD v15 shipping, while Optimus moves to a three-phase plan aiming at outside customers by late 2027.", "pointsLabel": "What the JP Morgan visit revealed", "points": [{"t": "FSD v15 is the robotaxi gate", "s": "Management calls v15 a step-change comparable to v13→v14 — more parameters, longer context, ~20% lower latency. Fleet expansion is expected to accelerate late 2026 into early 2027 once it ships."}, {"t": "Optimus supply chain is 'largely secured'", "s": "The part that Musk warned would be hardest — building a components supply chain from nothing — is reported as largely solved, with Gen 3 the first design meant to actually be produced and sold."}, {"t": "Three phases to commercial sales", "s": "Phase 1 Optimus Academy (H2 2026), phase 2 inside Tesla's own factories starting with stamping and body-in-white, phase 3 external sales as early as H2 2027."}, {"t": "Cybercab economics beat converted Model Ys", "s": "Tesla is deliberately limiting Model Y conversions because the purpose-built Cybercab is cheaper to build and run — the narrator's own model still lowballs cost per mile and gets a profitable business."}, {"t": "Europe hinges on a dual-track approval", "s": "Tesla is working the EU level (approval now expected October after repeated delays) and individual states like the Netherlands, citing a roughly fivefold drop in collisions across ~65 million km of European FSD data."}], "published": "2026-08-22T11:07:17+05:30", "src": "@SolvingTheMoneyProblem", "subject": "@SolvingTheMoneyProblem", "url": "https://www.youtube.com/watch?v=jPrdTOFwp90"}, {"t": "Nobody Expected This Robot So Soon", "vid": "rKbVeHfUf98", "s": "Unitree's headless 'Superman' humanoid sprints faster than Usain Bolt and out-jumps the human standing record after a three-month build cycle, and OpenAI has paused its largest frontier RL run because an unreleased model may have crossed its own critical cyber threshold.", "glance": "A three-month-old humanoid now outruns and out-jumps human records, while OpenAI paused a frontier training run over cyber capability it could not rule out.", "pointsLabel": "Three stories covered", "points": [{"t": "Unitree 'Superman' humanoid", "s": "A headless Unitree robot runs faster than Usain Bolt and jumps higher than the human standing record, built in about three months. Not a commercial product yet — it is a capability demo."}, {"t": "OpenAI paused a frontier training run", "s": "An upcoming model, Astra, may meet the critical cyber threshold in OpenAI's preparedness framework. A two-week RL pause followed, plus tighter sandboxing of untrusted code with no internet access. Everything so far is self-reported, with no outside auditors named."}, {"t": "How the alarm actually fires", "s": "Classifiers read internal model activity at every sampled token; if flags cluster and the safety team cannot call a false alarm within 30 minutes, the training run stops. That mechanism, not a personal judgement call, is what halted the run."}, {"t": "Computer vision comes for coin grading", "s": "Collectible-coin grading — long a subjective expert judgement like card grading — is being taken over by vision models, a good example of ML applied to a niche dataset."}], "published": "2026-08-22T23:01:17+05:30", "src": "@dylan_curious", "subject": "@dylan_curious", "url": "https://www.youtube.com/watch?v=rKbVeHfUf98"}, {"t": "10 AI software rules that could save your job", "vid": "7TxueDEMYrQ", "s": "The argument is that individual skills depreciate fast now, so the durable skill is orchestrating agents: learn one agent class deeply, then learn to integrate and manage swarms of them, and treat yourself as software engineer plus business deployer rather than either alone.", "glance": "Stop trusting individual skills — the durable capability is designing, integrating and supervising swarms of agents, and shipping products from them yourself.", "pointsLabel": "The rules he lays out", "points": [{"t": "Move from chatbot to agent", "s": "Document-and-chat usage is the floor. Learn one class of agent from scratch, then how many agents integrate into a higher-level management system or swarm."}, {"t": "Prompt as if the model is literal", "s": "Do not say 'do something for me'. Specify every technological aspect in rigorous detail, assuming the model will not supply the design judgement you left out."}, {"t": "Never trust vibe-coded output untested", "s": "Products built by prompting must be tested at input/output level and probed for the boundary cases where they fail before deployment."}, {"t": "Track the agent, don't just launch it", "s": "Watch how it completes the task, where it errs, how it recovers. 'Track to survive' is his phrase for the supervisory habit."}, {"t": "Accumulate long-running project context", "s": "Deep, long-lived project chats become your own architecture and asset — a workforce you own — rather than one-off queries."}], "published": "2026-08-22T18:49:17+05:30", "src": "@AnirbanBandyopadhyay", "subject": "@AnirbanBandyopadhyay", "url": "https://www.youtube.com/watch?v=7TxueDEMYrQ"}]}, {"h": "🧘 Philosophy & Inner Work", "items": [{"t": "Avadhūta Gītā Retreat | Session 4", "vid": "8a7Nd3OLNrw", "s": "Swami Sarvapriyananda works through verse 4.56 and the question that splits Vedanta schools: what is the relation between Brahman and the world? He lays out the dualist position — five real, permanent differences between God, souls and matter — before contrasting it with the non-dual reading that all of it is one consciousness.", "glance": "The whole dispute between Vedanta schools reduces to one question — whether the differences you observe between God, self and world are ultimately real.", "pointsLabel": "Session takeaways", "points": [{"t": "The verse's claim", "s": "'I am the limitless consciousness in which all worlds arise and subside' — the self is not a part of the whole but the whole itself."}, {"t": "The dualist counter-case, stated fairly", "s": "Five differences are held to be ultimately real: God vs soul, soul vs soul, soul vs matter, matter vs matter, and world vs creator. On this view even liberation keeps you distinct from God."}, {"t": "Why the debate matters practically", "s": "If difference is ultimate, devotion is the path; if it is apparent, knowledge is. The same texts support both readings, which is why the schools diverge rather than one simply being wrong."}], "published": "2026-08-23T04:31:17+05:30", "src": "@VedantaNY", "subject": "@VedantaNY", "url": "https://www.youtube.com/watch?v=8a7Nd3OLNrw"}, {"t": "Why Is 'I Am' a Doorway to Freedom?", "vid": "9piTrPvSF0c", "s": "Spira's answer: every experience you have — thought, feeling, perception — is filtered and limited by the mind, with one exception, the bare experience of being. Because it carries no content, 'I am' is the only doorway out of those limits, and it works in both directions.", "glance": "Being is the one experience not filtered through thought or perception, which is why it functions as the exit from mind-imposed limits.", "pointsLabel": "The argument in three steps", "points": [{"t": "One unfiltered experience", "s": "All experience is constrained by thought and perception — except the knowledge 'I am', which has no content to constrain."}, {"t": "The eye of the needle", "s": "You pass through it only by relinquishing the entire content of experience; nothing — thought, memory, sensation — fits through with you."}, {"t": "A two-way door", "s": "The infinite passes back through the same doorway and picks up the limits of perception, then thought and feeling. Limitation is that passage, not a separate event."}], "published": "2026-08-22T19:49:17+05:30", "src": "@rupertspira", "subject": "@rupertspira", "url": "https://www.youtube.com/watch?v=9piTrPvSF0c"}, {"t": "Advaita Vedanta: The Non-Dual Reality", "vid": "pZOzjUF1YJo", "s": "A compact contrast: Western creation stories separate creator from creation, while Advaita ('a-dvaita', not-two) holds that consciousness and the material world are the same thing, with Maya as the cosmic mechanism turning one reality into the many forms we see.", "glance": "Advaita's core move is refusing the creator/creation split — the millions of forms are one reality manifesting, not many separate things.", "pointsLabel": "Points raised", "points": [{"t": "Non-dual vs dual", "s": "Dvaita means two; a-dvaita means not-two. Creator and creation cannot be separated, unlike the 'let there be light' framing."}, {"t": "Maya as mechanism, not just illusion", "s": "The Shvetashvatara Upanishad treats Maya as the process that turns a singular reality into all observed manifestations, closer to Plato's forms than to a trick."}, {"t": "Why the many gods", "s": "What looks polytheistic from outside is, at this level, one reality appearing in many forms of the divine."}], "published": "2026-08-23T04:31:17+05:30", "src": "@FromFirstPrinciplesPod", "subject": "@FromFirstPrinciplesPod", "url": "https://www.youtube.com/watch?v=pZOzjUF1YJo"}]}, {"h": "🎬 Shorts", "items": [{"t": "Tesla Cybercab is coming", "vid": "-yIvQBj3yQM", "short": true, "s": "The Cybercab has no steering wheel and no brake pedal, so the puzzle is what private ownership would even mean — how does an owner take over in the rare case they need to? He would rather buy the cleaning robot.", "glance": "A Cybercab with no wheel or pedals makes private ownership hard to define, whatever Musk intends for it.", "published": "2026-08-23T04:25:17+05:30", "src": "@jeremyjudkins", "subject": "@jeremyjudkins", "url": "https://www.youtube.com/watch?v=-yIvQBj3yQM"}, {"t": "My Brain Works BACKWARDS: Late Night Productivity Secret", "vid": "ZUxAC_If4kg", "short": true, "s": "A description of delayed sleep phase from the inside: energy and focus arrive as everyone else winds down, so the productive window opens exactly when collaboration becomes impossible.", "glance": "When your focus peaks after everyone logs off, the cost is not output but the inability to schedule anything with other people.", "published": "2026-08-22T18:55:17+05:30", "src": "@ruriohama", "subject": "@ruriohama", "url": "https://www.youtube.com/watch?v=ZUxAC_If4kg"}, {"t": "If I'm not in control, why do I feel responsible for everything?", "vid": "bpCmyuQcfU4", "short": true, "s": "The claim is that the sense of responsibility comes from the 'I' thought claiming ownership after actions have already happened spontaneously — responsibility as social convention rather than ultimate fact.", "glance": "The feeling of being responsible is the self-thought claiming credit after the fact, not evidence that you were steering.", "published": "2026-08-22T21:49:17+05:30", "src": "@SnakeSpeaks", "subject": "@SnakeSpeaks", "url": "https://www.youtube.com/watch?v=bpCmyuQcfU4"}]}]}, "elon": {"day": "2026-08-22", "source": "@jcub2x daily recap", "note": "YouTube rate-limited every caption request for today's recap (\"Elon Musk posted 63 times on X today, 08/22/26\"), so the per-post breakdown could not be transcribed this run. Its own chapter list shows where the 63 posts went: Grok Bot 10, US politics 9, Misc 12, Wokeness 5, Grok 4, SpaceX 3, X 3, Violence 3, Tesla 2, Starlink 2, Covid 2, fertility 2, and one each on xAI, AI, UK politics, economy and video games. The verified 24-hour coverage is in the highlight and news below.", "items": [], "highlight": {"t": "Tesla names September 3 as the Cybercab launch date", "s": "After repeated teases, Tesla has committed to a date for the Cybercab — the purpose-built robotaxi with no steering wheel or pedals. It is the most concrete Musk-company commitment of the last 24 hours, and per the JP Morgan briefing this week it is also the vehicle Tesla is betting on instead of converting more Model Ys.", "href": "https://www.teslarati.com/tesla-cybercab-launch-official-date-austin/"}}, "elonNews": [{"t": "Tesla sets Septembe /* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.

(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }

  try{ armReveals(document.getElementById("p-"+id)); }catch(e){}
  [...nav.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreMenu) [...moreMenu.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreBtn) moreBtn.classList.toggle("active",overflow.some(t=>t.id===id));
  store.set("tab",id);
  kbdIdx=-1; clearKbdCur(); applyFilter();
  if(!(opts&&opts.keepScroll)){ try{ window.scrollTo(0,0); }catch(e){} try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
}
// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();

</script>
