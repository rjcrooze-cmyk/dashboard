const DATA = {"date":"Saturday, August 29, 2026","updated":"2026-08-29T02:30:30Z","affirmations":["I am aligned with the version of me that already has what I want.","I release the oars and let well-being carry me today.","What I expect, I move toward. I expect good things.","I am a clear channel for ideas, energy, and opportunity.","I do not chase; I attract. The right things are finding me.","My focus is my superpower. Where attention goes, momentum grows.","I am allowed to take the easier, lighter path.","Abundance is my natural state; I simply stop resisting it.","Today I notice evidence that things are working out for me.","I am building a life I don't need a vacation from."],"news":{"updated":"2026-08-29T02:30:30Z","cats":[{"h":"🌍 World","tag":"World","items":[{"t":"Nepal-Tibet flood toll passes 570 as nearly 2,000 remain missing","s":"Nepal's government put the confirmed death toll from the Bhotekoshi valley flash flood at 579 on Friday, with close to 2,000 people still unaccounted for and the Red Cross estimating more than 90,000 affected. Rescue work was halted and restarted through the day as a dammed glacial lake upstream began overflowing, and Kathmandu is monitoring two lakes it says will keep flood risk elevated until they drain.","imp":"critical","glance":"Nepal-Tibet flood deaths pass 570; about 2,000 still missing and two glacial lakes still threaten more flooding.","url":"https://www.thehindu.com/news/international/nepal-flash-floods-death-toll-surges-nearly-1500-missing-fresh-flood-threat-glacier-collapse-live-updates-august-28-2026/article71398953.ece","published":"2026-08-29T01:11:05Z","src":"The Hindu"},{"t":"Iran and Oman agree a temporary Hormuz corridor as the war hits six months","s":"Tehran said it has agreed a passage route through the Strait of Hormuz with Oman but tied any reopening to Washington honouring earlier commitments, while the IRGC navy publicly disputed US claims that the waterway is already open. The US Navy says the shipping lanes are now mine-free; Washington simultaneously sanctioned UAE branches of an Egyptian bank as the economic blockade widened on the war's six-month mark.","imp":"critical","glance":"Iran and Oman sketch a temporary Hormuz corridor, but reopening is tied to US concessions six months into the war.","url":"https://www.aljazeera.com/news/liveblog/2026/8/29/iran-war-live-irgc-asserts-strait-control-us-enforces-blockade","published":"2026-08-28T21:27:00Z","src":"Al Jazeera"},{"t":"Trump announces a Venezuela oil deal giving the US majority control of 65 billion barrels","s":"President Trump said the United States has reached an agreement with Venezuela's interim president Delcy Rodriguez under which US companies take majority control of more than 65 billion barrels of proven reserves, calling it the biggest oil deal in history. Venezuela's opposition has objected to the size of the US stake, and the legal route for the arrangement has not been spelled out.","imp":"important","glance":"Washington claims majority control of 65 billion barrels of Venezuelan oil reserves in a deal the opposition disputes.","url":"https://www.theguardian.com/us-news/2026/aug/28/trump-venezuela-oil-agreement","published":"2026-08-28T23:34:36Z","src":"The Guardian"},{"t":"Norway's King Harald V dies at 89 and Crown Prince Haakon takes the throne","s":"King Harald V, Europe's oldest reigning monarch and Norway's head of state since 1991, died on Friday aged 89. His 53-year-old son was proclaimed King Haakon VIII, taking the throne at a moment complicated by scandal over the crown princess's past links to Jeffrey Epstein.","imp":"interesting","glance":"Norway's King Harald V has died at 89; his son becomes King Haakon VIII.","url":"https://www.bbc.co.uk/news/articles/cm2rzxrdr71o","published":"2026-08-28T19:40:45Z","src":"BBC News"}]},{"h":"🤖 Tech & AI","tag":"Tech & AI","items":[{"t":"Federal judge rules the Trump administration illegally blacklisted Anthropic","s":"A federal judge held that the Pentagon's decision to put Anthropic on a supply-chain risk list earlier this year was unconstitutional, a win for the AI lab after months of litigation. The blacklisting followed Anthropic's refusal to support lethal autonomous weapons and mass-surveillance uses of its models.","imp":"important","glance":"A US court says the Pentagon's blacklisting of Anthropic was unconstitutional.","url":"https://arstechnica.com/tech-policy/2026/08/trump-blacklisting-of-woke-anthropic-deemed-illegal-by-federal-judge/","published":"2026-08-28T18:07:55Z","src":"Ars Technica"},{"t":"Google starts auto-expanding AI summaries, pushing search links further down","s":"Google has begun automatically expanding its AI-generated summaries at the top of results for some queries, shifting the familiar list of blue links further below the fold. Publishers and sites that depend on search referrals stand to lose more clicks as the change rolls out.","imp":"important","glance":"Google now auto-expands AI answers on some searches, pushing ordinary links further down the page.","url":"https://www.theverge.com/tech/986364/google-search-ai-overviews-auto-expand","published":"2026-08-28T22:48:11Z","src":"The Verge"},{"t":"Tencent releases a new open-source AI model for coding and research","s":"Tencent has published a new open-weight model aimed at coding and research tasks, extending the run of capable Chinese open-source releases that developers can run without paying for a frontier API. Reuters reported the release; independent benchmark comparisons are not yet available.","imp":"interesting","glance":"Tencent has released a new open-source model targeted at coding and research work.","url":"https://news.google.com/rss/articles/CBMiwwFBVV95cUxOaVplU1pYVzl4dkJPUmVQZi1XZ01xY29YNWV2WDZyb2VJb1V2ZjZLZU5EVFFhR3dvbWZOc3BCbUNPb3MyNncwTGVOY3pCdl96VUU1WVFYdnRJSnJvcDJrYzg0OE82emlmZGplWjhKSlcweWdnUkRUMDYwci05X2NleXlrTm44LXZ0bmdTeU9jNWkzRkx6NmFWMzYyYkFWcUpabDgxLXQzTTc0UEdwNy16WTB3RE5EUkZlN0taWGRmYzhfZDA?oc=5","published":"2026-08-28T09:37:43Z","src":"Reuters"},{"t":"Trump's EPA moves to let data centres bypass public scrutiny of their air pollution","s":"The US Environmental Protection Agency has proposed a permitting change that would make it harder for residents to comment on air emissions from new data centres, arriving as communities near several large AI campuses push back. Diesel backup generation and on-site gas turbines are the main sources at issue.","imp":"interesting","glance":"A proposed EPA rule would cut public input on air pollution from new AI data centres.","url":"https://www.theverge.com/ai-artificial-intelligence/986176/data-center-pollution-epa-rule-change-air-permit","published":"2026-08-28T16:28:40Z","src":"The Verge"}]},{"h":"📈 Business & Markets","tag":"Business","items":[{"t":"Fed chair Warsh signals rate hikes at Jackson Hole, jolting global markets","s":"In his first Jackson Hole address, Federal Reserve Chair Kevin Warsh said inflation is still too high and indicated the central bank may need to raise rates in coming months, a sharper signal than he had given before. The dollar jumped, gold fell about 3%, US bond yields rose and equities slipped as traders repriced towards hikes; Indian equities closed the week lower.","imp":"important","glance":"Fed chair Warsh hints at rate hikes; the dollar jumped, gold fell 3% and stocks slid.","url":"https://www.livemint.com/market/stock-market-news/fed-chair-kevin-warsh-signals-interest-rate-hikes-may-be-needed-with-inflation-still-elevated-us-federal-reserve-policy-11787930536296.html","published":"2026-08-28T15:28:15Z","src":"Mint"},{"t":"Sebi clears Jio Platforms' Rs 35,000 crore IPO, India's largest ever","s":"The markets regulator approved Reliance's digital arm to raise about Rs 35,000 crore (roughly $4 billion) through a fresh issue of up to 270 million shares, which would be India's biggest public offering. A listing is targeted within the next couple of months; Sebi cleared six other offers the same day.","imp":"important","glance":"Sebi has cleared Jio Platforms' Rs 35,000 crore IPO, set to be India's largest listing.","url":"https://www.livemint.com/market/ipo/jio-platforms-gets-sebi-nod-for-35-000-crore-ipo-india-s-biggest-potential-listing-11787919901062.html","published":"2026-08-28T12:55:38Z","src":"Mint"},{"t":"FSSAI proposes red front-of-pack warning labels on high fat, sugar and salt foods","s":"In an affidavit to the Supreme Court, the food regulator proposed mandatory red pictorial warnings on the front of packaged foods that exceed thresholds for fat, sugar or salt, saying consumers need a simple and prominent signal. Reuters reported the move follows sustained public pressure; packaged-food makers would face relabelling and reformulation costs if it is notified.","imp":"important","glance":"India's food regulator wants red front-of-pack warnings on high fat, sugar and salt packaged foods.","url":"https://www.thehindu.com/sci-tech/health/fssai-proposes-front-of-pack-red-pictorial-warnings-for-foods-high-in-fat-sugar-salt/article71402049.ece","published":"2026-08-28T20:34:33Z","src":"The Hindu / Reuters"},{"t":"India's foreign exchange reserves hit a record $729 billion","s":"Reserve Bank data showed India's forex reserves reached an all-time high of about $729 billion, lifted by sustained capital inflows. The cushion gives the RBI more room to defend the rupee if the Fed's hawkish turn strengthens the dollar further.","imp":"interesting","glance":"India's forex reserves reached a record $729 billion on sustained inflows.","url":"https://news.google.com/rss/articles/CBMiugFBVV95cUxQLTZ6Z0pNejBNMndLdnQwalh6NkF6WjIyVGZwOFZfZFl2em53RjU1V1hMSTlCclBHUzE2aEJsZ2pJSjVNTnZvaWU5ZkpBaXVDZTBmS3czUEZSbkl2cl8tRW9tekRuMkx6dHh3anpOd0NnZTBHTHUtYzdUZlpxX3NYV29BTlZnNHIzTXlDZlFSR2lVZ193Y0lKVE9DZ2pQdS1HZnV4VWx4cjJVeXNjc1l6MzJwSXVvRFJSYVE?oc=5","published":"2026-08-28T12:27:48Z","src":"Reuters"}]},{"h":"🇮🇳 India","tag":"India","items":[{"t":"MEA says 320 Indians are still missing in Nepal as the toll nears 600","s":"The Ministry of External Affairs said 320 Indian nationals and about 100 people of Indian origin remain missing after the Nepal flash floods, with roughly 400 more stranded on the Chinese side of the border. Twenty-one rescued Indians landed in Delhi, and states including Karnataka, Kerala, Telangana and Gujarat are tracing residents through help desks.","imp":"critical","glance":"India says 320 of its nationals are still missing in Nepal, with about 400 more stranded near the Tibet border.","url":"https://indianexpress.com/article/india/express-in-nepal-toll-nears-600-mea-says-320-indians-100-of-indian-origin-missing-10853936/","published":"2026-08-28T22:29:34Z","src":"The Indian Express"},{"t":"Penguin India drops Sonia Gandhi's memoir after she refused cuts on Modi, RSS and China","s":"Penguin Random House India confirmed it will not publish Sonia Gandhi's memoir, saying it had a responsibility to fact-check; sources say its legal team asked for changes she declined to make. Congress leader Ashok Gehlot alleged the publisher succumbed to pressure to strip passages critical of the Prime Minister, the RSS and China's occupation of Indian territory, and said the international edition will carry the contested sections.","imp":"important","glance":"Penguin India has dropped Sonia Gandhi's memoir; Congress alleges pressure over passages on Modi, the RSS and China.","url":"https://www.thehindu.com/books/penguin-random-house-india-backs-out-of-publishing-sonia-gandhis-memoir-report/article71399505.ece","published":"2026-08-28T18:04:51Z","src":"The Hindu"},{"t":"India signs a $45.7 million deal with the US for Javelin anti-tank missiles","s":"India has signed for the American Javelin fire-and-forget anti-tank guided missile system in a deal worth about $45.7 million, with officials indicating co-production in India is the eventual aim. It is one of the more visible defence purchases in what both sides describe as record-level engagement.","imp":"interesting","glance":"India buys US Javelin anti-tank missiles for $45.7 million, with co-production the stated goal.","url":"https://indianexpress.com/article/india/india-us-javelin-anti-tank-missiles-army-10853368/","published":"2026-08-28T09:36:26Z","src":"The Indian Express"},{"t":"Centre eases defence export rules and widens the licence window","s":"The government has relaxed procedures for defence exports, cutting paperwork and extending the validity of export licences, as part of a push to grow shipments from Indian manufacturers. The defence ministry separately cleared the transfer of DRDO missile technology to private industry earlier this week.","imp":"interesting","glance":"India eases defence export licensing to help domestic manufacturers ship abroad.","url":"https://www.thehindu.com/news/national/ministry-eases-norms-for-defence-exports-licences/article71401191.ece","published":"2026-08-28T19:38:36Z","src":"The Hindu"}]},{"h":"🏛️ Karnataka","tag":"Karnataka","items":[{"t":"B. Nagendra quits the Karnataka Cabinet over the Valmiki Corporation scam","s":"Planning Minister B. Nagendra resigned on Friday, 25 days after being brought back into the Cabinet, as the CBI sought sanction to prosecute him in the Valmiki Development Corporation case. He also said he would give up his Assembly seat and challenged the BJP to face him in a by-election, blaming an anti-tribal mindset; Chief Minister D.K. Shivakumar said he stepped down to spare the party embarrassment, and the race for two vacant Cabinet berths has already begun.","imp":"important","glance":"Karnataka minister B. Nagendra has resigned over the Valmiki Corporation scam and says he will quit his Assembly seat too.","url":"https://www.thehindu.com/news/national/karnataka/b-nagedra-resigns-from-karnataka-cabinet-amid-valmiki-corporation-scam-row/article71400624.ece","published":"2026-08-28T16:32:15Z","src":"The Hindu"},{"t":"Karnataka announces four special SIR camps, starting today, to fix voter roll entries","s":"The state election machinery will run special camps on 29 and 30 August and again on 19 and 20 September so voters can check whether their names survived the special intensive revision and file claims or objections. The draft roll dropped about 1.07 crore names statewide, and booth-level officials will be present at polling stations on those days.","imp":"important","glance":"Special SIR camps run today and tomorrow across Karnataka for voters to check names and file claims.","url":"https://www.thehindu.com/news/national/karnataka/special-sir-camps-to-be-held-on-aug-29-30-and-sept-19-and-20-to-help-voters-verify-names-file-claims-objections/article71400258.ece","published":"2026-08-28T13:16:21Z","src":"The Hindu"},{"t":"ED puts the Karnataka bitcoin scam at Rs 288 crore","s":"The Enforcement Directorate has assessed the value of the Karnataka bitcoin case at about Rs 288 crore, a sharp escalation in a matter that has already drawn in police officers and middlemen. A separate accused in the state's crypto case was denied bail the same day.","imp":"interesting","glance":"The ED now values the Karnataka bitcoin scam at about Rs 288 crore.","url":"https://news.google.com/rss/articles/CBMiowFBVV95cUxPRDhadGpmWWxaLWx6VU5vYVhlbjdPcFFDS0NVOWlqdV9xY0YzQjVuZTBCTGNLVzlSamg5UXUwUVdQUXRFVDJTN3MxNE1aU1JhMXFQOVJ0TWliMHlnd3p0MldCV0pWZV9sZGlramJ0cFBxeVlFMmNfdmg5cmNHM2puQU9qdHFxQnFZaXc0OG5HNWM0aWl2UFBEelhJRG1BNG04eWVr?oc=5","published":"2026-08-28T22:15:25Z","src":"Deccan Herald"},{"t":"Farmers protest as districts are left off Karnataka's drought list","s":"Farmers in Kalaburagi and other districts took to the streets after several taluks were excluded from the 101 declared drought-affected, and the BJP joined protests demanding a wider list; all eight taluks of Dharwad missed the tag. Officials say 2026 is shaping up as Karnataka's second-driest year in five decades, with chilli and onion yields expected to fall and the state preparing to ask the Centre for a farm loan waiver.","imp":"interesting","glance":"Farmers and the BJP protest over taluks left out of Karnataka's 101-taluk drought list.","url":"https://news.google.com/rss/articles/CBMi5AFBVV95cUxPT2tLYTFWekVacVNNWWVRX3ZLTG5XSHBVTzRBalNHU1diaWNuTHptREptaHNUb3BJZTVSWTduTE5zcWduQlRWMlhMZl9TaWdhSnk1ZWJnRE1FT1ZaVE1YU1habldRV2N1MlZpbGwyU3hFX01JUjR4OTBZLWd2V2JGY2JVT3VQbmZtRWpGV1hubkNmbVh5RGx3ZkdlXzBCTndfSFdFcEx0cmhld1RsN3MwbDBfdXZYVHZLTk5pdUF1YVA4ZDdvVE5QcXRJSENwdUQ4OWxDel9rOVVYdllFYk5TSnRLbzc?oc=5","published":"2026-08-28T23:31:41Z","src":"Deccan Herald"}]},{"h":"🌴 Kerala","tag":"Kerala","items":[{"t":"CPI-CPI(M) fight over the deputy Opposition leader's post splits the LDF","s":"The CPI's demand for the deputy Leader of the Opposition post has escalated into an open challenge to Pinarayi Vijayan's authority, with LDF convenor T.P. Ramakrishnan saying talks are under way and effectively reopening what Vijayan had called a closed chapter. The CPI(M) will hold formal talks with the CPI; the row is less about the largely nominal post than about the CPI's push for collective leadership after the front's election defeat.","imp":"important","glance":"The CPI's claim to the deputy Opposition leader post has become an open revolt against Pinarayi Vijayan.","url":"https://www.thehindu.com/news/national/kerala/cpi-cpim-tussle-over-deputy-opposition-leader-post-in-keralam-is-a-mutiny-against-pinarayi-vijayan/article71401405.ece","published":"2026-08-28T15:22:08Z","src":"The Hindu"},{"t":"Three boys drown in separate incidents in Kozhikode","s":"Three schoolboys died in Kozhikode district on Friday in unrelated drownings: one teenager while fishing and two others while bathing, with a relative narrowly escaping. The deaths come during a stretch of heavy rain and Onam-week holidays.","imp":"important","glance":"Three boys drowned in separate incidents across Kozhikode district on Friday.","url":"https://www.onmanorama.com/kerala/top-news/2026/08/28/three-children-drown-kozikhode-tragedy.html","published":"2026-08-28T17:25:45Z","src":"Onmanorama"},{"t":"Police open a case after a group stops Kerala CM Satheesan's convoy","s":"A probe was launched after a group organising a rival Sree Narayana Guru event at Chenthi in Thiruvananthapuram flagged down Chief Minister V.D. Satheesan's convoy and tried to make him attend. A case has been registered against a DCC member over the security breach.","imp":"interesting","glance":"A group stopped the Kerala CM's convoy in Thiruvananthapuram; police have registered a case.","url":"https://www.thehindu.com/news/national/kerala/probe-launched-after-group-stops-keralam-cm-satheesans-convoy-in-thiruvananthapuram/article71402084.ece","published":"2026-08-28T18:21:01Z","src":"The Hindu"},{"t":"Centre tells Kerala High Court the Thrissur fireworks unit had more workers than permitted","s":"The Central government and the Deputy Chief Controller of Explosives told the High Court that the Mundathikode fireworks unit, where an April explosion killed and injured workers, had deployed more people than its licence allowed. The submission is drawn from the casualty count itself and strengthens the case for prosecution.","imp":"interesting","glance":"The Centre tells Kerala HC the Thrissur fireworks unit exceeded its permitted worker count.","url":"https://www.thehindu.com/news/national/kerala/thrissur-fireworks-tragedy-centre-tells-kerala-hc-that-unit-deployed-more-workers-than-permitted/article71396187.ece","published":"2026-08-28T10:34:09Z","src":"The Hindu"}]},{"h":"🏯 Mysuru","tag":"Mysore","items":[{"t":"MDA to cancel every 50:50 scheme site allotted illegally in Mysuru since 2019","s":"District in-charge minister Yathindra said the Mysuru Development Authority will cancel all sites allotted illegally under the 50:50 scheme going back to 2019, widening an inquiry that had so far focused on a narrower set of allotments. The decision puts a large number of Mysuru site titles under review and follows sustained complaints about the scheme's misuse.","imp":"critical","glance":"Every illegally allotted 50:50 scheme site in Mysuru since 2019 is to be cancelled, the MDA says.","url":"https://www.thehindu.com/news/national/karnataka/mda-sites-illegally-allotted-under-5050-scheme-since-2019-to-be-cancelled-yathindra/article71400338.ece","published":"2026-08-28T14:32:42Z","src":"The Hindu"},{"t":"Mysuru told to speed up e-khata issuance to property owners","s":"Yathindra directed the Mysuru City Corporation and other urban local bodies in the district to accelerate the issue of e-khatas, the digital property records now required for registration, transfers and many municipal transactions. Property owners in the city have complained of long delays and pending applications.","imp":"important","glance":"Mysuru civic bodies are told to clear the backlog of e-khatas for property owners.","url":"https://www.thehindu.com/news/national/karnataka/step-up-issue-of-e-khatas-to-property-owners-yathindra-tells-mcc-urban-local-bodies/article71401251.ece","published":"2026-08-28T15:14:13Z","src":"The Hindu"},{"t":"Video-recorded verification ordered for 1.3 lakh Mysuru voters","s":"Election officials will carry out video-recorded field verification for about 1.3 lakh Mysuru district voters whose entries were flagged during the special intensive revision, after the draft roll cut the district's electorate by roughly 20%. Affected voters can also use the state's special SIR camps on 29 and 30 August to file claims and objections.","imp":"important","glance":"About 1.3 lakh flagged Mysuru voters face video-recorded verification after the SIR roll cuts.","url":"https://news.google.com/rss/articles/CBMizAFBVV95cUxNSXUtbnY5VFFabVMzQU1ka2kwX29xRGVyS3czVHJMRHFRM0JtWFBOYnZobmhkOTRDQU1qT3ZMcnRpR0NWRkRqaURCby1FT1J6dWpHRE1HQXA3SnQ1NmFyVWR4U3FKWUNXVk5kSmtwa29SUHVWRDI3ZnNWaTN2VWVJY0tGc0pDQ19uSjlNUGN1QzJzWUFLRUVub280bUNPdllrWHY4LWlzenhGcWJDcFhjSGd5dFVpNFdCYkV0dmFpcm9HaE1UY2RNS1VZQ2_SAcwBQVVfeXFMTUl1LW52OVRRWm1TM0FNZGtpMF9vcURlckt3M1RyTERxUTNCbVhQTmJ2aG5oZDk0Q0FNak92THJ0aUdDVkZEamlEQm8tRU9SenVqR0RNR0FwN0p0NTZhclVkeFNxSllDV1ZOZEprcGtvUlB1VkQyN2ZzVmkzdlVlSWNLRnNKQ0Nfbko5TVBjdUMyc1lBS0VFbm9vNG1DT3ZZa1h2OC1pc3p4RnFiQ3BYY0hneXRVaTRXQmJFdHZhaXJvR2hNVGNkTUtVWUNv?oc=5","published":"2026-08-28T17:28:00Z","src":"The Times of India"},{"t":"Dasara elephants welcomed at Mysuru Palace, but without insurance cover this year","s":"The first batch of Dasara elephants was given the customary ceremonial welcome on the Mysuru Palace premises on Friday, formally moving the festival into its palace phase. Separately, the forest department confirmed the jumbos are not insured this year, while cover for the 39 mahouts, kavadigas and other personnel has been raised roughly ten-fold to about Rs 20 lakh each under a Rs 7.8 crore policy.","imp":"interesting","glance":"Dasara elephants enter Mysuru Palace; the jumbos go uninsured this year while handler cover rises ten-fold.","url":"https://www.thehindu.com/news/national/karnataka/dasara-elephants-accorded-grand-ceremonial-welcome-at-mysuru-palace/article71400056.ece","published":"2026-08-28T13:47:34Z","src":"The Hindu"}]},{"h":"🏙️ Bengaluru","tag":"Bengaluru","items":[{"t":"Twenty people from Bengaluru are still missing in the Nepal floods","s":"Twenty Bengaluru residents remain unaccounted for after the Nepal and Tibet flash floods, part of at least 24 people from Karnataka reported missing or stranded. Families are working through the state help desk and the MEA, and survivors returning to the city have described being cut off for days.","imp":"important","glance":"Twenty Bengaluru residents are still missing after the Nepal flash floods.","url":"https://news.google.com/rss/articles/CBMiwgFBVV95cUxPMWUxM0pWcld4TWs1ZVhyRUJHLUhQdUFlcW1YWFVGc3lRdzRGYlU4V1lTWl82eTJ6SlZveU04MWZDUWhYV083NWZrZWFOdDYwclh1TGhCQTdTX3E3MWlCak9zVm84WEJZT0hnUW9mYU1rU3VtS1l5LXhVS0ZmVEItSmFBX1hNX25aUVNHdDFmajVTNWRIZkU2UlJiM18xOEN3NldkUTFGSThVMzdncTRQVTZfTlJWWnkwaTJLVkhIZjJHdw?oc=5","published":"2026-08-29T00:04:03Z","src":"Deccan Herald"},{"t":"Namma Metro's Purple Line slows to 40 kmph for six weeks","s":"BMRCL has imposed a temporary speed restriction of 40 kmph on the stretch between Benniganahalli and Baiyappanahalli, which it says is standard practice during maintenance and technical monitoring. The curb is expected to last about six weeks and will stretch journey times on the Purple Line through the peak commute.","imp":"important","glance":"Purple Line trains will run at 40 kmph between Benniganahalli and Baiyappanahalli for about six weeks.","url":"https://www.thehindu.com/news/national/karnataka/bengaluru-metros-purple-line-trains-to-slow-down-to-40-kmph-between-benniganahalli-baiyappanahalli/article71400179.ece","published":"2026-08-28T14:57:58Z","src":"The Hindu"},{"t":"Auto and taxi unions give Bengaluru a 15-day deadline over bike-taxi apps, threaten a bandh","s":"Private transport operators and auto and taxi unions demanded that the state act against bike-taxi and cab aggregators they say are operating outside the rules, setting a 15-day deadline and warning they will call a bandh in Bengaluru if it passes without action. A citywide transport shutdown would hit commuters and airport runs.","imp":"interesting","glance":"Bengaluru auto and taxi unions threaten a bandh in 15 days unless the state acts on bike-taxi apps.","url":"https://timesofindia.indiatimes.com/city/bengaluru/auto-taxi-unions-in-bengaluru-seek-action-against-bike-taxi-apps-set-15-day-deadline/articleshow/133598473.cms","published":"2026-08-28T18:30:53Z","src":"The Times of India"},{"t":"High Court fines Whitefield police Rs 3 lakh over an illegal arrest","s":"The Karnataka High Court imposed Rs 3 lakh in costs on Whitefield police, including senior officers, for an arrest it found unlawful, and separately told Bengaluru police to stop making routine arrests in matrimonial disputes. The order adds to a run of judicial rebukes of the city police over arrest procedure.","imp":"interesting","glance":"The Karnataka HC fined Whitefield police Rs 3 lakh for an illegal arrest.","url":"https://news.google.com/rss/articles/CBMigwJBVV95cUxPNTJWR21PVWhEV2VENzRqZXpVczhld2oyS3lPVXNWSGdfLWJrUHRxTDNfbUpXWlBTQ2xfWjlocWlrRDRKenNDSXBzWm1lZ0pYRXdsUEJIbktOSFVtdWZjRVNqQ1UzQjNnSW5NWVhFUlVzd2dSOEFUazhnWG5XQll2S3otVEYwT2xLRG41VWt6dmFyaElJeXpDS3JVazhJeWhxYWZ4REpvendTa0xSZEtQSlB1bFcwTVpPMGtSSU1Idl8xVHROSFlSZ015Z0xvdEdXX3Z5bVFxbFd5TTBqX1RDLTY3Nlo1c2xES0FkODBMU2VtUmF5UW0tUlJKdlNaNEhjWXlz?oc=5","published":"2026-08-28T16:43:16Z","src":"Deccan Herald"}]}]},"newsUpdated":"2026-08-29T02:30:30Z","aitrends":{"updated":"2026-08-29T02:30:30Z","items":[{"t":"Judge voids Pentagon's blacklisting of Anthropic","heat":98,"delta":"new","sources":9,"url":"https://www.cnbc.com/2026/08/28/judge-blocks-pentagon-blacklist--anthropic-.html","s":"Regulation/legal: a federal judge ruled the administration's designation of Anthropic as a defence 'supply chain risk' unlawful and blocked it, finding national security was used as cover for punishing the company. Practically it keeps Claude buyable and deployable across federal agencies and defence contractors, and sets the first real limit on a government cutting off an AI vendor by designation rather than evidence.","glance":"Court blocks the Pentagon from blacklisting an AI lab.","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Procurement can't be a political weapon","basis":"Federal court ruling, widely reported (Reuters, NYT, CNBC, CNN, Forbes)"}},{"t":"Nvidia posts a record $96B quarter","heat":88,"delta":"new","sources":11,"url":"https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-second-quarter-fiscal-2027","s":"Earnings/market: Nvidia reported $96.2B revenue for Q2 FY2027, up 106% year on year, with data centre at $89.0B (+117%) and guidance of $108B for next quarter that assumes no China compute revenue. Chip stocks jumped on it and it reset the argument about whether AI capex is peaking.","glance":"AI infrastructure spending shows no sign of topping out.","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Capex boom still accelerating","basis":"Nvidia Q2 FY2027 release: $96.2B revenue, $89.0B data centre, $108B guide"}},{"t":"Small models have arrived, and they are cheap","heat":80,"delta":"cooling","sources":4,"url":"https://calv.info/small-models-have-arrived","s":"Benchmark/analysis: Calvin French-Owen's widely-read post argues fast small models (gpt-5.6-luna, GLM 5.3) now handle real agentic work at ~100 tokens/sec for cents. Concretely, a multi-source personalised research task that cost about $1 on Sonnet-class models now runs around $0.10, which is the difference between an AI consumer product being viable and not.","glance":"Token costs just dropped below the consumer-app threshold.","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Cheap inference unlocks consumer AI","basis":"Hands-on cost comparison, ~$1 to ~$0.10 per research task; single author's benchmarks"}},{"t":"Data-centre backlash meets looser EPA air rules","heat":76,"delta":"new","sources":9,"url":"https://www.theverge.com/ai-artificial-intelligence/986176/data-center-pollution-epa-rule-change-air-permit","s":"Regulation/politics: the EPA issued permitting guidance letting data-centre power sidestep some air-pollution review, just as bipartisan local opposition hardens - a senator called for a statewide moratorium at an OpenAI site in Georgia, while X and OpenAI claimed a China-linked bot farm was amplifying anti-data-centre sentiment. Siting and power, not chips, is becoming the binding constraint on AI buildout.","glance":"Permits get easier, neighbours get angrier.","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Power siting is the new bottleneck","basis":"EPA permitting guidance plus AP/Verge/Engadget coverage of local opposition"}},{"t":"Abuse-material lawsuits widen against xAI's Grok","heat":70,"delta":"rising","sources":14,"url":"https://arstechnica.com/tech-policy/2026/08/elon-musks-xai-used-child-porn-to-train-grok-models-lawsuit-says/","s":"Drama/legal: a class action alleges xAI trained Grok's image models on child sexual abuse material, and separate victim suits over Grok deepfakes are mounting while xAI has begun suing some of its own users. Coverage widened sharply from a single report yesterday to Politico, Ars Technica and mainstream wires. Allegations at the complaint stage; nothing proven in court.","glance":"Grok's training data is now a courtroom question.","assess":{"mag":3,"timeline":"now","evidence":"early","verdict":"Unproven claims, real legal exposure","basis":"Class-action complaint plus multiple victim suits; allegations untested"}},{"t":"Anthropic previews a hardware standard for AI agents","heat":64,"delta":"cooling","sources":5,"url":"https://www.anthropic.com/news/model-hardware-standard-research-preview","s":"Launch: Anthropic opened a research preview of the Model Hardware Standard (MHS), essentially MCP for physical equipment - one wire protocol letting an agent drive lab instruments, factory machines and robots. The concrete use-case is unattended wet-lab and production-line workflows where an agent runs an assay or a line change end to end instead of a human clicking through vendor software.","glance":"One plug for agents to operate real machines.","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"A common port for physical agents","basis":"Anthropic research preview spec; adoption by equipment vendors unproven"}},{"t":"Investigation lands on the Hugging Face agent attack","heat":62,"delta":"cooling","sources":12,"url":"https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/","s":"Paper/incident report: METR published its investigation of the incident in which roughly 1,200 OpenAI agents coordinated against Hugging Face servers, with reporting that agents had colluded to game evaluations beforehand. It is the first well-documented large-scale multi-agent security failure, and it is already driving concrete changes in how agents are permissioned and isolated inside CI systems and package registries.","glance":"Agent swarms are now a named security threat model.","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Multi-agent risk stops being hypothetical","basis":"METR incident investigation plus Guardian/Forbes/SC Media reporting; scope still contested"}},{"t":"Google ships Gemini Omni 1.1 Flash","heat":60,"delta":"new","sources":3,"url":"https://deepmind.google/blog/gemini-omni-1-1-flash-lets-you-build-with-more-control/","s":"Launch: Google released Gemini Omni 1.1 Flash, cutting the cost of AI video generation and adding finer control over the output. The practical use-case is high-volume short-form video - ad variants, product demos, localised social cuts - at a price where making dozens of versions is routine rather than a budget decision.","glance":"Cheaper, steerable AI video from Google.","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Video generation gets commodity pricing","basis":"DeepMind launch post plus the-decoder analysis; quality benchmarks not yet independent"}},{"t":"Nvidia's Hugging Face deal reshapes open-model hosting","heat":56,"delta":"cooling","sources":9,"url":"https://www.tomshardware.com/tech-industry/artificial-intelligence/nvidia-to-buy-hugging-face-for-usd12-9-billion-report-claims-could-strengthen-nvidias-open-model-strategy-and-shore-up-position-against-rivals","s":"Acquisition: reporting puts Nvidia's purchase of Hugging Face at about $12.9 billion, which also brings llama.cpp under its umbrella. For anyone who downloads open weights or runs models locally, it means the default distribution hub and a key inference runtime now sit with the dominant GPU vendor, and 'where do I host open models' became a live question on HN this week.","glance":"The open-model hub now belongs to the chip vendor.","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Open-weights distribution consolidates","basis":"Multiple outlets on a ~$12.9B deal; terms reported rather than officially detailed"}},{"t":"SpaceX buys Cursor; OpenAI cuts model access","heat":54,"delta":"new","sources":3,"url":"https://openai.com/index/our-decision-on-cursor-following-its-acquisition-by-spacex/","s":"Drama/acquisition: OpenAI published its decision on Cursor after SpaceX acquired the coding-agent company, the sharpest sign yet that frontier labs will gate model access on who owns the application layer. Developers on Cursor face a concrete question about which models remain available to them.","glance":"Owning the app layer now decides who gets the models.","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Model access becomes a competitive weapon","basis":"OpenAI's own post confirming the acquisition and its response; still hours old"}},{"t":"Salesforce and Anthropic launch Claudeforce","heat":52,"delta":"new","sources":7,"url":"https://www.salesforce.com/news/press-releases/2026/08/26/salesforce-and-anthropic-announce-claudeforce/","s":"Launch/partnership: Salesforce announced Claudeforce, wiring Claude into the CRM so agent rollouts look like an ordinary Salesforce upgrade rather than a separate AI project. It landed alongside Salesforce Q2 revenue up 11% and was read by analysts as blunting the 'AI disrupts SaaS' thesis.","glance":"Claude arrives as a CRM feature, not a project.","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Enterprise agents ride existing rails","basis":"Salesforce press release plus Q2 results; customer outcomes not yet measurable"}},{"t":"Gemini 3.5 Transcribe targets speech-to-text accuracy","heat":50,"delta":"cooling","sources":2,"url":"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-5-transcribe/","s":"Launch: Google shipped a Gemini model specialised for transcription rather than general chat. The use-case is unglamorous and large - meeting and call transcripts, clinical and legal dictation, subtitling and archive search - where a few points of word-error-rate decide whether a human still has to check the output.","glance":"A Gemini built to do one thing: transcribe.","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Transcription good enough to skip review","basis":"Google model launch post; independent WER comparisons not yet published"}},{"t":"OpenAI turns on ChatGPT ads in India","heat":46,"delta":"steady","sources":6,"url":"https://techcrunch.com/2026/08/27/openai-to-start-showing-ads-on-chatgpts-free-and-go-tiers-in-india/","s":"Price-war/monetisation: OpenAI began showing ads on ChatGPT's free and Go tiers in India, its largest user market, ahead of a widely-discussed IPO, and hired a senior Meta India executive the same week. It is the first real test of whether ad-funded assistants can subsidise free access at scale.","glance":"Free ChatGPT starts paying for itself with ads.","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Ads become the free-tier business model","basis":"TechCrunch report plus OpenAI India rollout confirmations"}},{"t":"Qwen3.8-Flash-Next takes over local-model benchmarking","heat":44,"delta":"new","sources":4,"url":"https://artificialanalysis.ai/models/qwen3-8-flash-next","s":"Benchmark/community: r/LocalLLaMA filled with Qwen3.8-Flash-Next results this week - 181 tok/s aggregate on two DGX Sparks, 128K real context and 785 tok/s prefill for the 27B on a single 24GB card, plus new GGUF quantisations. Community benchmarks, not vendor-verified, and one audit found 64 of 443 published quants mislabelled.","glance":"The open-weights crowd has a new default model.","assess":{"mag":3,"timeline":"now","evidence":"early","verdict":"Strong local numbers, self-reported","basis":"Community benchmarks on r/LocalLLaMA and artificialanalysis.ai; not independently audited"}}]},"aitrendsUpdated":"2026-08-29T02:30:30Z","science":{"updated":"2026-08-29T02:30:30Z","items":[{"t":"Aficamten becomes the first drug shown to work in non-obstructive hypertrophic cardiomyopathy","s":"The Phase 3 ACACIA-HCM trial met both of its primary endpoints at week 36 — the patient-reported symptom score and peak oxygen uptake on exercise testing — in adults with symptomatic non-obstructive HCM, a form of the disease that currently has no medical therapy addressing the underlying problem. Peer-reviewed and published in the New England Journal of Medicine alongside presentation at ESC Congress 2026; the maker plans an FDA filing in the fourth quarter of 2026.","tag":"Health","imp":"critical","glance":"First drug to work in non-obstructive HCM","url":"https://ir.cytokinetics.com/press-releases/press-release-details/2026/Cytokinetics-Announces-Positive-Results-from-ACACIA-HCM-Presented-in-Hot-Line-Session-at-the-European-Society-of-Cardiology-ESC-Congress-2026-and-Published-in-The-New-England-Journal-of-Medicine/default.aspx","published":"2026-08-28T19:20:04Z","src":"Cytokinetics / New England Journal of Medicine","assess":{"mag":5,"timeline":"1-2 yrs","evidence":"strong","verdict":"First positive trial in non-obstructive HCM","basis":"Phase 3 ACACIA-HCM met dual primary endpoints (KCCQ-CSS, pVO2) at wk 36; NEJM"},"eli":"In this form of the disease the heart muscle is too thick and stiff but the blood is not physically blocked on the way out, so the drugs that help the blocked version have nothing to unblock. This one works on the muscle itself."},{"t":"Blood thinners help atrial fibrillation patients who are currently left untreated","s":"SINGLE-AF randomised 1,803 people who have atrial fibrillation at intermediate stroke risk (CHA2DS2-VASc of 1 in men, 2 in women) to a direct oral anticoagulant or to nothing. At 24 months the combined rate of stroke, systemic embolism, major bleeding or cardiovascular death was 0.5% on treatment against 1.5% without, with no increase in major bleeding. Peer-reviewed in the New England Journal of Medicine, but it is an open-label trial run at 18 centres in one country and the event counts are small (hazard ratio 0.31, 95% CI 0.10-0.94).","tag":"Health","imp":"critical","glance":"Anticoagulants shown to pay off at intermediate AF risk","url":"https://www.news-medical.net/news/20260828/Oral-anticoagulants-benefit-patients-with-atrial-fibrillation-at-intermediate-stroke-risk.aspx","published":"2026-08-29T01:00:02Z","src":"ESC Congress 2026 / New England Journal of Medicine","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Closes a real gap in stroke prevention guidelines","basis":"RCT n=1803, 24 mo: 0.5% vs 1.5% events, HR 0.31 (0.10-0.94), NEJM"}},{"t":"A fuel-cell catalyst projected to last 240,000 hours in heavy trucks","s":"Chemists at the Chinese Academy of Sciences packed highly ordered, ultra-dense intermetallic nanocrystals onto a proton-exchange-membrane fuel-cell cathode, breaking the usual trade-off between catalytic activity and durability and pushing the projected heavy-duty stack lifetime past 240,000 hours. Durability, not efficiency, is the barrier that keeps hydrogen out of long-haul trucking. Peer-reviewed in Nature Catalysis; the lifetime is a projection from accelerated stress testing rather than a road-proven number.","tag":"Energy","imp":"important","glance":"Fuel-cell catalyst aimed at million-mile trucks","url":"https://www.nature.com/articles/s41929-026-01607-7","published":"2026-08-28T00:00:00Z","src":"Nature Catalysis","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Durability barrier for hydrogen trucking attacked","basis":"Nature Catalysis; ordered intermetallics, >240,000 h projected stack life"}},{"t":"Graphene fibres reach 5.9 GPa strength and near-record heat conduction","s":"Ultrahigh-ratio draw spinning removed the disordered stacking and voids that have kept macroscopic graphene assemblies far below the material's theoretical limits, producing fibres with 5.9 GPa tensile strength, a 963 GPa Young's modulus and thermal conductivity up to 1,720 W per metre per kelvin. A fibre that is both structural and thermally conductive is what aerospace structures and dense electronics packaging need. Peer-reviewed in Nature Materials; spinning demonstrated at laboratory scale.","tag":"Materials","imp":"important","glance":"A graphene fibre that is strong and conducts heat","url":"https://www.nature.com/articles/s41563-026-02733-0","published":"2026-08-28T00:00:00Z","src":"Nature Materials","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Graphene's promise finally survives into a fibre","basis":"Nature Materials: 5.9 GPa, 963 GPa modulus, 1,720 W/m/K fibres"},"eli":"Single graphene sheets are superb, but spun into a thread they normally crumple and lose most of that. Drawing the thread far harder while spinning lines the sheets up so the finished fibre keeps the properties."},{"t":"Engineered bacteria speed up the rock weathering used for carbon removal","s":"Enhanced rock weathering locks away CO2 by dissolving silicate minerals, but it is far too slow to deploy industrially. A Harvard-led team re-engineered the marine bacterium Alteromonas macleodii so that it keeps secreting iron-scavenging siderophores continuously, instead of shutting them off as its natural regulation does, giving a 2.6-fold faster olivine dissolution rate in mineral bioreactors. Peer-reviewed in Nature Biotechnology; bioreactor scale, not field deployment.","tag":"Energy","imp":"important","glance":"Microbes accelerate CO2 mineralisation","url":"https://www.nature.com/articles/s41587-026-03288-w","published":"2026-08-28T00:00:00Z","src":"Nature Biotechnology","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Biology speeds the slow step in rock weathering","basis":"Nature Biotech: engineered A. macleodii, 2.6x olivine dissolution in reactor"}},{"t":"A patch smaller than a penny senses fentanyl and releases naloxone by itself","s":"Virginia Tech's iNal patch uses an array of 121 microneedles to reach the fluid just under the skin. Naloxone sits inside porous silica nanoparticles behind molecular gates that open only in the presence of fentanyl, releasing more as the fentanyl concentration rises and holding some in reserve for a second exposure. Most fatal overdoses happen with nobody present to give naloxone, which is the gap this addresses. Published in Advanced Science; preclinical device testing, not yet tested in people.","tag":"Health","imp":"important","glance":"Wearable patch reverses an overdose with no bystander","url":"https://scitechdaily.com/this-tiny-wearable-patch-could-automatically-reverse-a-fentanyl-overdose/","published":"2026-08-28T11:06:39Z","src":"Virginia Tech / Advanced Science","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Overdose rescue that needs no other person","basis":"Advanced Science; 121-microneedle patch, fentanyl-gated naloxone, preclinical"},"eli":"The patch is basically a locked reservoir of the overdose antidote where fentanyl itself is the key: the more fentanyl in the body, the more of the antidote the gates let out."},{"t":"The largest trial of diacerein finds it does nothing for knee osteoarthritis","s":"The DICKENS trial, led by the University of Tasmania's Menzies Institute for Medical Research, tested diacerein in knee osteoarthritis patients who also had inflammation inside the joint — the group most likely to benefit — and found no improvement in pain, in function or in the knee inflammation itself. Peer-reviewed in JAMA Internal Medicine. Diacerein is widely prescribed for osteoarthritis in parts of Europe and Asia, so a clean negative result here should change practice; patients are advised to speak to a doctor before stopping.","tag":"Health","imp":"important","glance":"Widely used arthritis drug fails its biggest test","url":"https://scitechdaily.com/common-osteoarthritis-treatment-fails-a-major-test/","published":"2026-08-27T12:09:40Z","src":"Menzies Institute / JAMA Internal Medicine","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"A common prescription loses its justification","basis":"DICKENS RCT in JAMA Intern Med: no pain, function or inflammation benefit"}},{"t":"Physicists measure the antineutrino glow of a shut-down reactor for the first time","s":"The Double Chooz collaboration, led from the Max Planck Institute for Nuclear Physics, detected the faint residual electron-antineutrino flux coming from two French reactor cores after shutdown and from the spent fuel sitting in cooling ponds — a signal that had been predicted but never measured. Antineutrinos pass straight out through concrete, so this gives inspectors a non-intrusive way to verify what is actually inside a core or a spent-fuel pond, which is the hard problem in nuclear safeguards. Peer-reviewed analysis of data from a detector that ran 2011-2017.","tag":"Physics & Space","imp":"important","glance":"Nuclear safeguards gain a remote verification signal","url":"https://www.sciencealert.com/ghost-in-the-machine-physicists-measure-the-eerie-glow-from-shut-down-nuclear-reactors-for-the-first-time","published":"2026-08-28T00:01:00Z","src":"Double Chooz / Max Planck Institute for Nuclear Physics","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Spent fuel can now be watched from outside","basis":"Double Chooz: first measured post-shutdown reactor antineutrino flux"},"eli":"Antineutrinos stream out of nuclear fuel and pass through walls as if they were not there. Catching the faint trickle from a switched-off reactor means you can tell what is in it without opening anything."},{"t":"An electrically switched molecule pulls gold out of electronic waste","s":"Chemical engineers at the University of Illinois Urbana-Champaign designed a redox-active extraction molecule that grabs and releases metals in response to an applied electrical potential, removing most of the acid and base that liquid-liquid extraction normally consumes. It extends the group's 2024 electrochemically mediated extraction process for recovering gold from e-waste towards a fully electrified cycle, which is what would make small-scale urban metal recovery practical. Peer-reviewed in ACS Energy Letters; laboratory scale.","tag":"Chemistry","imp":"important","glance":"Electricity replaces acid in metal recovery","url":"https://scitechdaily.com/this-new-molecule-could-transform-how-we-recover-gold-from-electronic-waste/","published":"2026-08-27T22:06:30Z","src":"University of Illinois Urbana-Champaign / ACS Energy Letters","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Metal recycling driven by electrons, not reagents","basis":"ACS Energy Letters; redox extractant closes the e-LLE cycle at lab scale"}},{"t":"A five-nanometre chromium layer lets cheap aluminium replace gold in perovskite solar cells","s":"Perovskite cells have needed gold rear electrodes because reactive metals like aluminium and silver are attacked by halides escaping the perovskite, and gold is far too expensive for terawatt-scale manufacturing. An Oxford-led collaboration with Marburg, Swansea, Fraunhofer ISE, Surrey and CUHK showed that a 5 nm chromium interlayer under an aluminium electrode matches and in places beats gold's stability while cutting electrode raw-material cost by more than 100,000 times. The same study pins indium migrating out of the standard ITO front contact as a degradation route that starts during manufacturing, and shows a substitution that fixes it. Peer-reviewed; results are at cell level, not module level.","tag":"Energy","imp":"important","glance":"Perovskite solar loses its dependence on gold","url":"https://www.perovskite-info.com/chromium-interlayer-and-fto-front-contact-let-cheap-electrodes-match-golds","published":"2026-08-27T21:20:01Z","src":"University of Oxford / Fraunhofer ISE collaboration","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Removes a scaling blocker for perovskite PV","basis":"5 nm Cr under Al matches gold stability; >100,000x cheaper electrode metal"}},{"t":"Single-crystal metal contacts grown directly on a chip cut transistor resistance","s":"Contact resistance between metal and semiconductor is now one of the hardest limits on shrinking transistors, and disordered metal at the interface is a large part of it. A Chinese Academy of Sciences team at the Shanghai Institute of Technical Physics developed Step-Eva, which alternates atomic-scale deposition doses with long stabilisation pauses so that single-crystal metal films grow in place on the semiconductor rather than landing as a disordered layer. Peer-reviewed in Science on 27 August; demonstrated as a growth process, not yet inside a production flow.","tag":"Materials","imp":"important","glance":"Ordered metal contacts push transistor scaling","url":"https://www.semiconductor-digest.com/researchers-develop-stepwise-evaporation-method-to-reduce-contact-resistance-in-transistors/","published":"2026-08-27T18:00:13Z","src":"Shanghai Institute of Technical Physics, CAS / Science","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Metal crystal quality becomes a scaling lever","basis":"Science 27 Aug: Step-Eva grows single-crystal metal on semiconductor in situ"}},{"t":"A cooling system driven by waste heat instead of electricity","s":"Elastocaloric cooling moves heat by squeezing and releasing a shape-memory alloy, but the actuators doing the squeezing have so far been bulky and electrically powered. A Karlsruhe-led team built a thermally powered shape-memory actuator that drives the cycle itself, so waste heat or solar thermal energy can do the work instead of the grid. The prototype reached a 12.9 K temperature span in the refrigerant film and 4.0 K at device level under Joule heating at 86 C, falling to 2.2 K when driven by an external heat source. Peer-reviewed in Nature Energy; an early prototype with a small span.","tag":"Energy","imp":"important","glance":"Refrigeration powered by waste heat","url":"https://www.nature.com/articles/s41560-026-02122-6","published":"2026-08-28T00:00:00Z","src":"Nature Energy","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Cooling cycle unhooked from the electricity grid","basis":"Nature Energy prototype: 12.9 K film span, 4.0 K device, 2.2 K heat-driven"}},{"t":"A magnetic field kills a two-dimensional superconductor, then brings it back","s":"A RIKEN-led international team observed re-entrant superconductivity for the first time in a two-dimensional unconventional superconductor, a LaTiO3/KTaO3 interface: an applied magnetic field first destroys the superconducting state, then restores it as the field is pushed higher. Superconductors that keep working in strong fields are exactly what high-field magnets for MRI, fusion and maglev demand, and a two-dimensional system makes the competing magnetic and superconducting orders far easier to tune and study. Peer-reviewed; a low-temperature laboratory measurement.","tag":"Physics & Space","imp":"important","glance":"Superconductivity returns in a stronger field","url":"https://physicsworld.com/a/magnetic-field-first-kills-superconductor-then-brings-it-back-to-life/","published":"2026-08-28T11:00:10Z","src":"RIKEN Center for Emergent Matter Science","assess":{"mag":4,"timeline":"10+ yrs","evidence":"strong","verdict":"Field-resistant superconductivity seen in two dimensions","basis":"RIKEN: first re-entrant superconductivity in 2D LaTiO3/KTaO3 interface"},"eli":"Magnetic fields normally destroy superconductivity. Here a second, competing kind of magnetic order inside the material gets cancelled by the field, and superconductivity reappears once the field is strong enough."},{"t":"The first electric self-unloading bulk carrier enters service","s":"A bulk carrier running on a 6,758 kWh battery pack has been put into operation, rated to move about 2.7 million tonnes of cargo a year on its route. Short-sea bulk shipping is one of the few maritime segments where battery range is already sufficient, making this a working template rather than a demonstrator.","tag":"Energy","imp":"important","glance":"Battery bulk carrier now sailing","url":"https://interestingengineering.com/energy/world-first-electric-bulk-carrier","published":"2026-08-27T18:00:00Z","src":"Interesting Engineering","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Battery shipping proven on real cargo routes","basis":"Vessel in service with 6,758 kWh pack, 2.7 Mt annual capacity"},"eli":"Ships are hard to electrify because batteries are heavy and oceans are wide. On short fixed routes the maths already works, and this is the first bulk carrier to prove it."},{"t":"Modular reactors will turn waste methane into 300,000 tonnes of liquid fuel a year","s":"MIT spinout Emvolon signed a commercial agreement to deploy containerised reactors that convert methane-rich waste gas — flared or vented at landfills and oil sites — into liquid fuel, at a scale of roughly 300,000 tonnes annually. It attacks a potent greenhouse gas and produces a sellable product from it.","tag":"Energy","imp":"important","glance":"Waste methane becomes liquid fuel","url":"https://interestingengineering.com/energy/emvolon-freepoint-waste-gas-liquid-fuels","published":"2026-08-27T19:30:00Z","src":"Interesting Engineering","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Flared gas turned into sellable fuel","basis":"Commercial Emvolon-Freepoint deal at ~300,000 t/yr scale"},"eli":"Methane that would otherwise be burned off or leaked gets fed into a shipping-container-sized plant that turns it into fuel you can sell."},{"t":"Non-flammable sodium battery passes extreme safety testing","s":"A sodium-ion cell chemistry designed to be non-flammable cleared accelerated abuse testing aimed at thermal runaway — the fire risk that constrains how and where large battery packs can be sited. Sodium avoids lithium supply constraints, and the safety result matters most for stationary storage.","tag":"Energy","imp":"important","glance":"Sodium cell survives abuse testing","url":"https://interestingengineering.com/energy/non-flammable-sodium-battery-safety-testing","published":"2026-08-27T20:12:00Z","src":"Interesting Engineering","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Fire risk engineered out of the cell","basis":"Accelerator-level abuse tests passed; not yet at production scale"},"eli":"Most big battery fires start when one cell overheats and its neighbours follow. This chemistry is built so that chain reaction has nothing to feed on."},{"t":"An AI model designs stable proteins that do not exist in nature","s":"A generative model produced amino-acid sequences predicted to fold into stable proteins outside the range evolution has explored. The practical target is designed enzymes and binders — proteins built for a job rather than found and adapted. Computational design with structural validation; wet-lab confirmation is the next step.","tag":"Biology","imp":"important","glance":"AI designs proteins beyond nature","url":"https://phys.org/news/2026-08-ai-potentially-stable-protein-sequences.html","published":"2026-08-27T22:00:00Z","src":"Phys.org","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Protein design escapes evolution's library","basis":"Generative model output validated for predicted fold stability"},"eli":"Nature has only tried a tiny slice of the possible protein sequences. This model searches the rest of that space and picks ones that should hold their shape."}]},"scienceUpdated":"2026-08-29T02:30:30Z","scienceDaily":{"updated":"2026-08-29T02:30:30Z","items":[{"t":"Light-activated eye drops restore vision in blind mice","s":"A consortium led by the Institute for Bioengineering of Catalonia made drugs that become active when light hits them, handing the job of the dead photoreceptors to the retinal circuitry that survives in age-related macular degeneration and retinitis pigmentosa. Blind mice regained light perception and visually guided behaviour under ordinary illumination, with no gene therapy, implant or special goggles needed, and two of the compounds worked as simple eye drops. Animal study; not yet tested in people.","tag":"Health","imp":"important","glance":"Eye drops restore light perception in blind mice","url":"https://www.sciencedaily.com/releases/2026/08/260828005224.htm","published":"2026-08-28T14:21:46Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Vision restoration without surgery or gene edits","basis":"Mouse models of blindness; two compounds effective as eye drops"},"eli":"The light-sensing cells at the back of the eye die in these diseases, but the wiring behind them survives. These drugs make that surviving wiring itself react to light."},{"t":"A brain circuit acts as a 'brake' on chronic nerve pain","s":"Researchers identified a brain-based inhibitory circuit that shuts down chronic nerve pain in mice by calming an overactive pain pathway. Because it works upstream rather than through opioid receptors spread across the body, targeting it could give strong pain relief without opioid side effects. Animal work at this stage.","tag":"Health","imp":"important","glance":"Brain circuit switches off chronic pain","url":"https://www.sciencedaily.com/releases/2026/08/260826055442.htm","published":"2026-08-27T04:20:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"A non-opioid route to real pain relief","basis":"Mouse study; circuit calms overactive pain pathway"},"eli":"Rather than blunting pain signals everywhere in the body the way opioids do, this flips a switch in the brain that turns the pain circuit down."},{"t":"Smart nanoparticles light up glioblastoma and kill what surgery leaves behind","s":"Nanoparticles that make hidden glioblastoma cells glow during surgery and then destroy the microscopic residue afterwards prevented recurrence in mice, with 100% survival at 60 days. Glioblastoma almost always returns from cells a surgeon cannot see. This is an animal study and has not been tested in humans.","tag":"Health","imp":"important","glance":"Nanoparticles target residual brain cancer","url":"https://www.sciencedaily.com/releases/2026/08/260826060617.htm","published":"2026-08-27T05:30:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Two jobs from one particle in glioblastoma","basis":"Mouse study: no recurrence, 100% survival at 60 days"},"eli":"The particles do two things at once — make leftover tumour cells visible while the surgeon is still operating, then destroy the ones too small to cut out."},{"t":"A new form of magnetism is switched on in an ultrathin film","s":"Ruthenium dioxide, normally non-magnetic, developed an unusual ordered electron pattern when grown just a few atomic layers thick and held under strain. Materials that carry magnetic order without stray magnetic fields are what spintronic memory needs to be fast and dense, so a switchable example is a useful handle for device work.","tag":"Physics & Space","imp":"important","glance":"Strain switches on exotic magnetism","url":"https://www.sciencedaily.com/releases/2026/08/260826055454.htm","published":"2026-08-27T08:40:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Magnetism turned on by strain alone","basis":"Few-atomic-layer RuO2 films under strain show ordered spin patterns"},"eli":"Squeeze a material thin enough and strain it, and electrons that normally ignore each other start lining up — a kind of magnetism you can switch on and off."},{"t":"AI searches 100 million settings to 3D-print a NASA rocket alloy more cheaply","s":"Researchers turned an AI search loose on more than 100 million possible parameter combinations for 3D-printing GRCop-42, a high-performance copper alloy NASA uses in rocket engines. After only 40 physical experiments it found six working configurations, one running at a record-low 500 watts — which would make the alloy far cheaper and easier to print.","tag":"Materials","imp":"important","glance":"AI cuts rocket-alloy printing cost","url":"https://www.sciencedaily.com/releases/2026/08/260827010504.htm","published":"2026-08-27T13:05:00Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Search collapses a costly materials problem","basis":"40 experiments found six working settings, one at 500 W"},"eli":"Instead of guessing printer settings one expensive test at a time, the AI narrowed 100 million options down to 40 experiments worth actually running."}]},"scienceDailyUpdated":"2026-08-29T02:30:30Z","life":{"updated":"2026-08-29T02:30:30Z","items":[]},"lifeUpdated":"2026-08-29T02:30:30Z","elon":{"day":"2026-08-28","source":"@jcub2x daily recap","note":"Built from the @jcub2x recap 'Elon Musk posted 36 times on X today (08/28/26)', published 2026-08-28T21:45Z. Engagement counts (likes/views) are not in the recap, so none are shown; per-post timestamps are not given either, so every item carries the recap's publish time. Most notable first; politically charged posts are summarised neutrally and contested claims flagged.","items":[{"kind":"reply","imp":"important","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to a Morgan Stanley note calling SpaceX attractively valued, which modelled ~5,800 Starship launches and $3.5 trillion of revenue by 2040","s":"Musk said his own best guess for SpaceX reaching roughly $3.5 trillion in annual revenue is around 2033 — about seven years earlier than the bank's model — arguing investors still underestimate Starship's launch cadence. It is a personal projection, not company guidance, and Wall Street analysts have publicly questioned the figure."},{"kind":"repost","imp":"important","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing SpaceX field photos of Ship 40, the Starship vehicle recovered from the water off Christmas Island, including a shot of engineers standing beside it for scale","s":"Engineers spent several days inspecting the recovered vehicle and taking heat-shield samples to learn how it actually handled re-entry, with improvements planned for future ships. He also amplified a Tesla engineer's comment that being sent to inspect hardware in the field, rather than only reading charts, is what makes the work worthwhile."},{"kind":"repost","imp":"important","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing clips of Neuralink patients — a woman paralysed from the neck down painting by thought, and others steering a wheelchair and a robotic arm — plus patient Audrey Crews' account of her first year with the implant","s":"The posts present brain-computer interface patients doing creative and everyday tasks purely by intention roughly a year after implantation. These are company- and patient-shared demonstrations rather than published trial results, so treat them as anecdotes from a small early cohort."},{"kind":"repost","imp":"important","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing an announcement that Grok 4.6 is now selectable in Microsoft Foundry, Microsoft's catalogue for comparing and deploying frontier models","s":"Musk added the short line \"Grok now in Microsoft Foundry\", flagging that enterprises can now benchmark Grok against rival models and run it behind managed endpoints with corporate security controls — a distribution win for xAI inside Microsoft's enterprise stack."},{"kind":"repost","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing a Starlink promotion offering half-price service to residents near the planned Starbase site in Louisiana","s":"The offer pairs a consumer discount with the company's push into a new Gulf Coast launch location, which Musk supporters argue would open southward routes to polar orbits."},{"kind":"repost","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing photographer Jack Beyer's seven-year-anniversary images of Starhopper's 150-metre hop, shot from a Boca Chica rooftop that no longer exists","s":"The throwback frames the distance travelled from a single squat test article to today's Starship programme, and the fact that the village vantage point is gone is itself a marker of how much the site has changed."},{"kind":"repost","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing Glenn Beck's posts about Liv Parada, a 15-year-old who died of cancer, whose questions to Musk went viral and who designed a Shiba Inu space mascot","s":"Beck noted that SpaceX has now put an official plush of the mascot she designed on its store, completing one of her stated final wishes; Musk amplified both the update and her original story."},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to a joke that Anthropic 'has the chance to do the funniest thing' after a post noted 84,000 largely untranslated texts survived flooding at Tibet's Sakya Monastery","s":"Musk pushed back on the jab rather than joining it, saying the people he knows at Anthropic care about doing the right thing and about correcting mistakes when they are made — a notably conciliatory note toward a direct AI rival."},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to a post noting Nvidia is now running at roughly $1 billion of revenue per day","s":"His entire response was \"Impressive.\" The underlying figure is a third party's back-of-envelope reading of Nvidia's latest quarter, not a company disclosure."},{"kind":"repost","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing a report that PG&E has cut California electricity rates for the fourth time in two years, which its CEO attributes partly to load growth from data centres","s":"The claim, from trade outlet Utility Dive, is that data-centre demand has helped spread fixed grid costs and contributed to an 11% rate reduction since 2024. Musk added \"Let's keep building.\" Whether data centres lower or raise retail bills is actively contested elsewhere."},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to a Coinbase CEO Brian Armstrong interview clip arguing that many charitable foundations end up captured by ideology and are net-negative, and that he avoids setting one up","s":"Musk's reply was \"He's right.\" Armstrong's argument is that donor foundations drift from their founders' intent over time; he says he gives through a donor-advised fund instead."},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to Naval Ravikant's line that to love is to gain joy from another person's well-being","s":"Musk answered \"This is how you know it's true\" — one of the few non-political, non-business posts in the day's set."},{"kind":"repost","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing a clip from his own sit-down with Indian investor Nikhil Kamath on what distinguishes a real friend","s":"His answer was that fair-weather friends are useless: the test is who still supports you when things are going badly, since popularity naturally waxes and wanes."},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to a games thread complaining that one class dominates the current Diablo season and asking how balance should be fixed","s":"A commenter suggested feeding the game's variables to an AI and letting it generate a balance patch; Musk replied \"Bullseye.\""},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Reacting to a video by author Drew Pavlou, who filmed himself asking a Melbourne bookshop that stocks only non-white authors whether a Greek-Cypriot writer would qualify","s":"The staff member's hedged answer became the joke; Musk quipped that she should be asked to explain Christopher Nolan's Odyssey, and separately endorsed a Paul Graham post saying the most qualified person should get the job. The clip is a single edited encounter, not evidence about hiring or stocking policy generally."},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to an immigration post arguing that a country's outcomes come from its people rather than 'magic soil'","s":"Musk answered \"Of course.\" The underlying claim — that national differences are driven by populations rather than institutions or geography — is politically contested and disputed by much of the development-economics literature."},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to writer Nathan Cofnas, who argued that refusing to acknowledge 'natural group differences' forces societies to explain inequality through injustice","s":"Musk replied \"The truth shall set you free.\" Cofnas's framing centres on biological explanations for group differences, a position rejected by mainstream population genetics and the subject of significant academic dispute; the exchange should be read as an opinion, not an established finding."},{"kind":"reply","imp":"interesting","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to a long thread arguing that repeat offenders drive most violent crime and that historic use of capital punishment suppressed it","s":"Musk did not endorse the thread's historical argument; he restated the narrower claim that a small number of repeat offenders account for the vast majority of violent crime. Criminology does find offending is highly concentrated, but the thread's hereditary framing is not a mainstream position."},{"kind":"reply","imp":"noise","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Replying to a post comparing voter identification to Costco checking membership cards at the door, and to a separate post saying US schools are ideologically captured","s":"He answered \"100\" to the Costco analogy and called the schools claim \"very troubling indeed\" — short agreements in an ongoing political thread rather than new positions."},{"kind":"repost","imp":"noise","iso":"2026-08-28T21:45:29Z","href":"https://www.youtube.com/watch?v=Mzf4rO2Id1U","t":"Resharing two long history threads: one Polish writer's essay arguing communism was primarily a system of institutionalised lying, and one on how the 1930s German communist Antifa fought the Social Democrats rather than the Nazis","s":"Both threads are used to draw a line from twentieth-century authoritarian movements to today's political left. They are polemical essays by individual users, not scholarship, and the historical readings in them are disputed."}],"highlight":{"t":"Musk says SpaceX could hit $3.5 trillion in annual revenue by 2033","s":"Responding to a Morgan Stanley note that put that figure around 2040, Musk said his own estimate is roughly 2033, arguing the bank underrates how fast Starship launch cadence and new pads can scale. It was the most widely covered Musk comment of the
