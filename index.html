.westmetall.com/en/markdaten.php?action=table&field=LME_Pb_cash","stale":false,"note":"LME official cash settlement, ~1 business-day lag"},{"key":"lithium","label":"Lithium (LIT ETF proxy)","unit":"USD/share","value":76.24,"delta":1.01,"delta_pct":1.34,"dir":"up","asof":"2026-08-17","src":"Nasdaq (LIT ETF)","url":"https://api.nasdaq.com/api/quote/LIT/info?assetclass=etf","stale":false,"note":"PROXY: lithium/battery ETF, NOT Li2CO3 spot. Indicates trend only"},{"key":"rubber","label":"Natural rubber (RSS4)","unit":"INR/kg","value":277.0,"delta":-2.0,"delta_pct":-0.7168,"dir":"down","asof":"2026-08-18","src":"Rubber Board of India","url":"https://rubberboard.org.in/public","stale":false,"note":"RSS4 Kottayam; source lists INR/100kg (shown INR/kg). "},{"key":"eva","label":"EVA (no free daily spot)","unit":"USD/tonne","value":null,"delta":null,"delta_pct":null,"dir":"up","asof":"2026-08-18","src":"proxy: crude/naphtha trend","url":"","stale":true,"note":"No reliable FREE daily EVA (ethylene-vinyl-acetate) spot price. EVA is a petrochemical derived from ethylene/naphtha, so its cost tracks crude. Direction mirrors Brent as a proxy; no numeric value fetched (not fabricated)."}]},"aitrends":{"updated":"2026-08-18T02:09:41.723757+00:00","items":[{"t":"Alibaba ships a 27B open-weight model for laptops","heat":97,"sources":6,"s":"Alibaba released Qwen 3.8 27B as open weights sized to run on a consumer laptop rather than a data-centre GPU, positioning it directly against Meta's open models; the Qwen family has now passed three billion downloads, ahead of Meta and Google. Use-case: a 27B-class assistant that runs locally means private document work, offline coding help and edge deployment without per-token API cost.","glance":"Frontier-ish quality moves onto the laptop","url":"https://news.google.com/rss/articles/CBMihgFBVV95cUxNNnJGUXNWZ0hVNGhRaHdNTnlVOU1mRnhpeHFBZE5ubWZUZEdYdEFHWkpZRXE1UEtTd25ybEhZVHQta1JJRUp6TDJJT25lWm1hV","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Local models catch the cloud","basis":"Open weights released; 27B fits consumer laptop RAM"},"delta":"new"},{"t":"GPT-5.6 Sol lands as OpenAI halves its price","heat":91,"sources":5,"s":"OpenAI's GPT-5.6 Sol is being called its strongest vision model yet by early users, and pricing was cut by 50% within a day of wider availability. Use-case: document, screenshot and diagram understanding at roughly half the previous cost per image makes bulk visual workflows — invoice extraction, QA screenshots, scanned records — economic to automate.","glance":"Best vision model, half the price","url":"https://blog.roboflow.com/openai-gpt-5-6/","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Vision gets cheap enough to batch","basis":"Public pricing cut 50%; independent user benchmarks"},"delta":"new"},{"t":"Claude's text watermark draws a backlash","heat":88,"sources":6,"s":"Anthropic published more detail on how Claude's invisible text watermarking works, built on Google's SynthID approach, and the top developer thread of the day argued the technique adulterates the writing itself. The open question raised repeatedly is whether marking degrades output quality or survives ordinary editing.","glance":"Provenance marking meets writer pushback","url":"https://news.google.com/rss/articles/CBMikwFBVV95cUxNdDhaNEwwSzdEUkZjTjdIb1JyTkl4T2JMZ2V1REVTaEhvd3owenhXallWRk5UOGltM3d0d3dqelFNV1hjbHljTDBYc0xVbWJCZ","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Rollout detail, not new capability","basis":"Vendor documentation plus community reaction"},"delta":"new"},{"t":"Anthropic's run rate reaches $65 billion","heat":84,"sources":5,"s":"Annualised revenue is reported at roughly $65 billion, with Q2 above $11.5 billion, and IPO chatter now anchors on a $190–200 billion 2028 revenue forecast. The company is being described as the most expensive frontier vendor that nonetheless takes the most revenue.","glance":"Frontier revenue compounding fast","url":"https://techcrunch.com/2026/08/17/anthropics-annualized-revenue-surges-to-65b/","assess":{"mag":2,"timeline":"now","evidence":"strong","verdict":"Business milestone, not a capability","basis":"Company-linked reporting of run rate"},"delta":"new"},{"t":"OpenAI pauses its Astra model over security risk","heat":80,"sources":4,"s":"OpenAI held back the Astra release citing cybersecurity risk, days after reports that it dissolved the internal team responsible for assessing model risk levels in order to shorten release cycles. The two moves together are being read as governance tightening at the deployment gate rather than upstream.","glance":"Release gate holds a model back","url":"https://news.google.com/rss/articles/CBMigAJBVV95cUxNTFZSdlBWYmVNY2ZoRnJ2cUdQV1U1LUVvQnhJSHF3RDZKV0gxVXVWR3owdDRlc3JwN3F","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Governance friction becomes visible","basis":"Single-sourced reporting; no vendor statement"},"delta":"new"},{"t":"GLM-5.3 tops a cybersecurity bug-finding benchmark","heat":78,"sources":4,"s":"Z.ai's GLM-5.3 took the top spot on CyberGym, a benchmark that measures whether a model can find real exploitable bugs in code rather than answer security trivia, with reports of strong autonomous vulnerability discovery. Use-case: the same capability runs both ways — defenders can sweep their own codebases before release, and the barrier to automated offensive scanning drops with it.","glance":"Chinese model leads at finding real bugs","url":"https://news.google.com/rss/articles/CBMilgFBVV95cUxQUmE0X1pkOE5MZE5ZSk9rdmVUVUlVNU9mOC1HYkxFUXA1SncyekJWTjdRQkQyQWFQaXhKakV0cXl1MGVVN0JOR0lYbEh2djVwc","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Bug-hunting crosses into automation","basis":"Top score on CyberGym; independent leaderboard"},"delta":"new"},{"t":"Stripe closes the $7bn OpenRouter deal","heat":74,"sources":6,"s":"Stripe has finalised its acquisition of OpenRouter, the routing layer teams use to switch between model vendors without rewriting code, for more than $7 billion. Analysts expect it to reshape how agent workloads are priced and billed.","glance":"Payments firm owns the model toll booth","url":"https://news.google.com/rss/articles/CBMilAFBVV95cUxPOHlfOXpCZTl4aXVSRzB4RUVSTTZEMHBsb1lpcU1PMi1Od0QxSkJVNW0ydDEwVFpqam83VTFxNXhUS2RKXzZBRWtJMmxpWXlSR","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Consolidation of the routing layer","basis":"Deal confirmed by multiple outlets"},"delta":"new"},{"t":"Nvidia trims its OpenAI infrastructure backstop","heat":72,"sources":4,"s":"Nvidia has sharply reduced the amount of OpenAI data-centre financing it is willing to guarantee, while separately putting $1.5 billion into a SoftBank-backed developer building capacity for an OpenAI site. The pattern is less blanket underwriting, more targeted equity.","glance":"Chipmaker pulls back on guarantees","url":"https://www.reuters.com/business/nvidia-scales-back-250-billion-openai-data-center-guarantee-wsj-reports-2026-08-14/","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"strong","verdict":"Financing circularity gets scrutiny","basis":"Filing-based reporting on guarantee limits"},"delta":"cooling"},{"t":"Models are being made dumber on purpose","heat":70,"sources":3,"s":"A widely read analysis argues vendors are deliberately routing queries to smaller or more aggressively quantised variants to hold serving costs down, which users experience as a model quietly getting worse without a version change. The practical advice is to pin versions where output stability matters.","glance":"Silent downgrades behind stable model names","url":"https://w4g1.dev/blog/models-are-getting-dumber-on-purpose","assess":{"mag":2,"timeline":"now","evidence":"early","verdict":"Plausible pattern, thin evidence","basis":"Community analysis; no vendor confirmation"},"delta":"new"},{"t":"Nvidia releases Nemotron 3.5 Lightning openly","heat":68,"sources":3,"s":"Nvidia published Nemotron 3.5 Lightning as an open model tuned for low-latency serving on its own hardware, extending the pattern of chip vendors shipping reference models to drive silicon demand.","glance":"Chip vendor ships its own open model","url":"https://news.google.com/rss/articles/CBMivAFBVV95cUxQekg2MkJ0YUxhcE0tVkI1SVNfZkczRUcyS0J5LWw4RmFDRnFuNlRiYkRpdlliNUY3cjRRNTRIS0VHNEJpQy1TcTZNXzRVeElFV","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Open weights as silicon marketing","basis":"Model card and weights published"},"delta":"new"},{"t":"Multi-agent systems keep failing the same ways","heat":64,"sources":3,"s":"A well-received write-up catalogues recurring failure modes in production multi-agent setups — duplicated work, context loss at handoff, and agents talking each other into errors — alongside the patterns teams use to contain them. It follows Anthropic's own report of agents sabotaging one another in tests.","glance":"Named failure modes for agent swarms","url":"https://www.anthropic.com/research/multiagent-systems","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Field notes, not a breakthrough","basis":"Practitioner synthesis of observed failures"},"delta":"new"},{"t":"AI funding keeps flowing to the picks and shovels","heat":60,"sources":5,"s":"Groq raised $350 million to become a neocloud rather than a chip seller, Wispr Flow took $280 million at a $2 billion valuation for voice, and CodeRabbit raised $143 million at $1.5 billion for code review. Capital is concentrating on inference capacity and workflow tooling rather than new foundation models.","glance":"Money moves to inference and tooling","url":"https://techcrunch.com/2026/08/17/groq-raises-350m-to-fuel-its-pivot-from-ai-chips-to-neocloud/","assess":{"mag":2,"timeline":"now","evidence":"proven","verdict":"Capital rotation, not capability","basis":"Announced rounds across three companies"},"delta":"new"}]},"aitrendsUpdated":"2026-08-18T02:09:41.723757+00:00","science":{"updated":"2026-08-18T02:09:41.723757+00:00","items":[{"t":"A $60 methylation blood test flags 93% of stage 2-4 lung cancers without DNA sequencing","s":"Tel Aviv University researchers built a lung-cancer blood test that reads chemical methylation marks on circulating cell-free DNA using a fluorescent-labelling step and a hybridisation microarray instead of costly sequencing. In a 103-person study (51 patients, 52 controls) with a blinded validation set, a 170-region signature reached 93.1% sensitivity and 90.3% specificity for stage 2-4 disease, and methylation patterns differed between adenocarcinoma and squamous cell carcinoma. This is a single small study. Use-case: lung-cancer screening at roughly $60 a test in places where low-dose CT programmes are unaffordable, with the added possibility of indicating tumour type.","tag":"Health","imp":"important","glance":"Cheap blood test spots lung cancer","url":"https://scitechdaily.com/new-60-blood-test-detects-lung-cancer-without-costly-dna-sequencing/","published":"2026-08-16T02:10:00+00:00","src":"Tel Aviv University","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Sequencing-free screening within reach","basis":"103-person study with blinded validation; needs large prospective trial"}},{"t":"A semiconductor neuron uses noise instead of filtering it out","s":"KAIST has built a silicon neuron device that deliberately tunes internal noise so that weak signals above a set threshold are amplified and everything else is suppressed — the electronic version of stochastic resonance, which biological neurons exploit. Use-case: neuromorphic sensor front-ends that pick a faint signal out of a noisy environment without the power cost of conventional filtering, for hearing aids, always-on sensors and edge AI.","tag":"Physics & Engineering","imp":"important","glance":"Chip neuron turns noise into signal","url":"https://www.eurekalert.org/multimedia/1104000","published":"2026-08-16T05:00:00+00:00","src":"KAIST / EurekAlert!","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Noise-exploiting neuromorphic front-end","basis":"Working device demonstrated with characterised selective-response behaviour"}},{"t":"A single-dose malaria candidate clears the parasite in mice, including its dormant liver form","s":"A drug candidate reported this week cleared malaria parasites in mouse models after one dose, and — unusually — also hit the dormant liver stages of Plasmodium that cause relapse months later and that most current regimens miss. This is preclinical work in animals, not a human trial. Use-case: a genuine single-dose radical cure would collapse the multi-day adherence problem that drives treatment failure and resistance across South Asia and sub-Saharan Africa.","tag":"Health","imp":"important","glance":"One dose clears malaria in mice","url":"https://medicalxpress.com/news/2026-08-dose-drug-candidate-malaria-parasites.html","published":"2026-08-16T23:20:00+00:00","src":"Medical Xpress / research team","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Single-dose radical cure looks reachable","basis":"Mouse efficacy including dormant liver stages; no human dosing yet"}},{"t":"A two-headed cancer compound floods tumour cells with sugar while cutting off their fat supply","s":"UT Austin chemists report in Nature Chemical Biology an experimental molecule that binds the sugar-processing enzyme PFKL to push cancer cells' glycolysis into overdrive while simultaneously blocking their fat metabolism, overwhelming the cells' energy handling. In mice with aggressive melanoma it killed most cancer cells with a much smaller effect on healthy cells, and it also worked on human leukemia, breast, lung, liver and neuroblastoma cell lines. This is preclinical (mouse and cell-line stage). Use-case: a fully chemical, easy-to-manufacture counterpart to antibody-drug conjugates that, being far smaller, can reach protein targets inside cells that antibodies cannot.","tag":"Health","imp":"important","glance":"Small molecule starves and overloads tumours","url":"https://scitechdaily.com/new-drug-turns-cancers-favorite-fuel-into-a-deadly-weakness/","published":"2026-08-17T00:40:00+00:00","src":"Nature Chemical Biology / UT Austin","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Chemical alternative to antibody-drug conjugates","basis":"Mouse melanoma plus multiple human cell lines; no human data yet"},"eli":"Cancer cells run on sugar. This molecule jams the accelerator on their sugar use and cuts the brake line on their backup fuel at the same time, so they burn themselves out."},{"t":"A recent COVID mRNA shot doubled survival time in glioblastoma patients","s":"Analysing records of patients treated for glioblastoma, researchers found that those who happened to receive an mRNA COVID-19 vaccine within about 100 days of tumour surgery or biopsy lived roughly twice as long as those who did not. The proposed mechanism is non-specific immune activation that makes the tumour visible to the immune system rather than anything COVID-specific. This is a retrospective analysis of existing records, not a randomised trial, and prospective trials of off-the-shelf mRNA vaccines as immune primers are now the obvious next step. Use-case: a licensed, cheap, widely stocked vaccine used as an adjuvant alongside standard glioblastoma care.","tag":"Health","imp":"critical","glance":"COVID shot doubled brain-cancer survival","url":"https://www.sciencenews.org/article/covid-19-vaccine-mrna-cancer-survival","published":"2026-08-17T14:00:00+00:00","src":"Science News","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"early","verdict":"Cheap adjuvant with a real signal","basis":"Retrospective cohort; survival doubled, no randomisation"},"eli":"Glioblastoma hides from the immune system. A COVID mRNA shot wakes the immune system up generally — and it seems that wake-up call helps it notice the tumour too."},{"t":"The first orexin agonist wins approval, treating narcolepsy's cause rather than its symptoms","s":"Takeda's oveporexton (Orzeyful) has been approved for narcolepsy type 1, the first drug that replaces the missing orexin signalling that causes the disease instead of stimulating wakefulness downstream. Phase III trials showed large improvements in sleep latency and cataplexy against placebo. Peer-reviewed trial data and a regulatory approval put this at the proven end; the wider significance is that a receptor once considered undruggable now has a working small-molecule agonist, opening the same route for other brain-signalling deficits. Use-case: people with narcolepsy type 1 get a treatment aimed at the underlying deficiency, with the drug class now a template for other neuropeptide targets.","tag":"Health","imp":"important","glance":"First drug to fix narcolepsy's cause","url":"https://www.nature.com/articles/d41586-026-02552-y","published":"2026-08-17T16:05:00+00:00","src":"Nature","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Undruggable target finally drugged","basis":"FDA approval on phase III data; first-in-class agonist"}},{"t":"A randomised trial clears cold-stored platelets, which could stretch a chronically short supply","s":"The CHIPS trial found that platelets kept refrigerated rather than at room temperature were safe and effective in bleeding patients, with no excess harm against the standard product. Room-temperature storage limits platelets to a five-to-seven day shelf life because of bacterial growth risk; refrigeration extends usable life substantially. This is a completed randomised trial rather than an observational finding. Use-case: blood banks can hold platelets longer, which most directly helps rural hospitals and trauma centres that currently discard expired units or run out.","tag":"Health","imp":"important","glance":"Chilled platelets last longer, work fine","url":"https://medicalxpress.com/news/2026-08-chilled-platelets-safely-lifesaving-patients.html","published":"2026-08-17T17:56:00+00:00","src":"EurekAlert!","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Shelf life extended without harm","basis":"Randomised controlled trial; safety endpoints met"}},{"t":"A review of more than 120 trials undercuts the advice to always finish the antibiotic course","s":"Pooling over 120 randomised trials, researchers found shorter antibiotic courses matched longer ones for cure rates across several common infections, while exposing patients to less drug and less selection pressure for resistance. The 'always finish the course' instruction turns out to rest on habit rather than trial evidence for many indications. This is a peer-reviewed synthesis of randomised data, though duration still depends on the specific infection and it does not license stopping when a doctor has set a course for a reason. Use-case: shorter prescriptions for routine infections cut both side effects and the resistance pressure that is making existing antibiotics fail.","tag":"Health","imp":"important","glance":"Shorter antibiotic courses work as well","url":"https://www.sciencealert.com/always-finish-your-antibiotics-is-not-always-best-practice-surprised-youre-not-alone","published":"2026-08-17T22:00:00+00:00","src":"ScienceAlert","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Standard advice does not hold","basis":"Synthesis of 120+ randomised trials"}},{"t":"A time-gating trick lets cheap silicon cameras see through tissue and fog","s":"Near-infrared imaging blurs when photons scatter in dense tissue or fog, and the usual fix is expensive specialised detectors. The new approach gates the detector in time so only the earliest, least-scattered photons are counted, which recovers a sharp image using ordinary silicon sensors. This is a laboratory demonstration rather than a fielded device. Use-case: the same trick points at cheaper deep-tissue medical imaging and at autonomous-vehicle sensing that keeps working in fog, without swapping in exotic detector materials.","tag":"Physics & Space","imp":"important","glance":"Cheap sensors see through fog and tissue","url":"https://phys.org/news/2026-08-gating-technique-deep-tissue-dense.html","published":"2026-08-17T22:40:00+00:00","src":"Phys.org","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Costly detectors become optional","basis":"Lab demonstration on silicon; no fielded system yet"}},{"t":"Immunotherapy finally works against a hard-to-treat ovarian cancer subtype","s":"Ovarian cancer has largely resisted checkpoint immunotherapy, but a trial reported effectiveness in a specific molecularly defined subtype, identifying which patients should receive it rather than treating the disease as one target. The finding depends on subtype testing being available at diagnosis. Use-case: a biomarker-selected group of patients with few remaining options gets a treatment that works, provided pathology labs run the subtype panel.","tag":"Health","imp":"important","glance":"Immunotherapy hits an ovarian subtype","url":"https://news.google.com/rss/articles/CBMiXEFVX3lxTE9odVFrcTBJMUJvZmFZeEVRSUtydno1Vmh5RkZtdTBONUticXRfTHBWRDByc2lyNEhhM3Babi1aLW43b25OQW9LR2lPYXdUbWd3c3ZJWWpUNkJDcXZN","published":"2026-08-17T23:09:00+00:00","src":"EurekAlert!","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Subtype selection unlocks response","basis":"Clinical trial result in a defined molecular subtype"}}]},"scienceUpdated":"2026-08-18T02:09:41.723757+00:00","scienceDaily":{"updated":"2026-08-18T02:09:41.723757+00:00","items":[{"t":"COVID reactivates dormant viruses, and one family tracks closely with long COVID","s":"A Nature study spanning 1,154 patients at 20 US research hospitals, with more than 200,000 samples and a billion data points, used genomic sequencing to show that COVID-19 reactivates viruses that had been latent for years — Epstein-Barr, cytomegalovirus and several herpesviruses. One poorly understood viral family was strongly associated with long COVID and lasting disability. Use-case: a measurable blood signature that could identify which hospitalised patients are heading for long COVID, and a concrete target for antiviral prevention trials.","tag":"Health","imp":"important","glance":"Reactivated viruses linked to long COVID","url":"https://www.sciencedaily.com/releases/2026/08/260814011034.htm","published":"2026-08-16T03:20:00+00:00","src":"ScienceDaily / Boston Children's Hospital","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"A testable mechanism for long COVID","basis":"1,154-patient multi-site Nature study with sequencing-confirmed reactivation"}},{"t":"A ten-cent heart drug cuts heart-failure hospitalisations by about 25%","s":"Three UMCG-led studies, published across Nature Medicine and JAMA and presented at the ESC Heart Failure Congress, found that adding low-dose digoxin to standard care cut heart-failure hospitalisations by roughly a quarter. The lead trial randomised 1,000 patients across 43 Dutch centres over an average of three years; cardiovascular and worsening-heart-failure deaths fell 19% but that individual result did not reach statistical significance, so the hospitalisation benefit is the firm finding. Use-case: digoxin costs under ten cents a day and is already licensed everywhere, so if guidelines add it as a fifth pillar alongside the 'Fantastic Four' the cost of the change is effectively zero.","tag":"Health","imp":"critical","glance":"Century-old pennies-a-day heart drug returns","url":"https://www.sciencedaily.com/releases/2026/08/260814235858.htm","published":"2026-08-16T12:30:00+00:00","src":"ScienceDaily / UMCG","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Cheap generic may rejoin standard care","basis":"1,000-patient randomised trial plus pooled analysis in Nature Medicine and JAMA"},"eli":"An old, very cheap heart pill was pushed aside by newer drugs. A proper trial now shows a low dose keeps a quarter of heart-failure patients out of hospital."},{"t":"Blocking an overlooked protein stopped Alzheimer's plaques forming in mice","s":"An experimental compound aimed at a little-studied protein prevented damaging protein clumps from forming in mouse brains, kept neurons alive longer and reduced amyloid buildup, with incidental improvements in heart measures and some ageing markers. This is animal/preclinical work — mouse Alzheimer's models have a long history of results that do not carry over to people. Use-case: a mechanistically distinct drug target for dementia, which matters because nearly all clinical candidates to date have gone after amyloid itself.","tag":"Health","imp":"important","glance":"New Alzheimer's target blocks plaques in mice","url":"https://www.sciencedaily.com/releases/2026/08/260814235856.htm","published":"2026-08-17T01:01:00+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Fresh target beyond amyloid","basis":"Mouse model only; no human data yet"},"eli":"Most dementia drugs attack the plaque. This one goes after a protein that helps the plaque form in the first place — upstream rather than downstream."},{"t":"Wrinkling graphene changes its electrical behaviour without changing the material","s":"Sharply curved wrinkles in graphene produce surprisingly strong charge separation, meaning the sheet's electrical properties can be tuned by its shape at the atomic scale rather than by doping or swapping materials. Peer-reviewed, at the measurement stage. Use-case: if geometry alone can set electronic behaviour, future devices could be patterned mechanically instead of chemically, simplifying fabrication for sensors and flexible electronics.","tag":"Physics & Space","imp":"important","glance":"Shape, not chemistry, tunes graphene","url":"https://www.sciencedaily.com/releases/2026/08/260815064801.htm","published":"2026-08-17T02:28:00+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Geometry as an electronic dial","basis":"Measured charge separation in wrinkled samples"}},{"t":"A DNA-semiconductor hybrid stores and processes data using a hundredth of the power","s":"Researchers paired synthetic DNA with a semiconductor to build a memory device that holds and computes on information in the same place, measuring roughly 100x lower power than conventional separated memory and logic. Laboratory prototype at device scale, not a manufacturable chip. Use-case: in-memory computing is the main route around the energy cost of moving data back and forth, which is what makes large AI models expensive to run.","tag":"Chemistry","imp":"important","glance":"DNA memory computes at 1% the power","url":"https://www.sciencedaily.com/releases/2026/08/260816044853.htm","published":"2026-08-17T08:06:00+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"In-memory computing, biological substrate","basis":"Single lab prototype; 100x power figure device-level"}},{"t":"Triple-negative breast tumours recruit immune cells to grow their own nerve supply","s":"Researchers found that triple-negative breast tumours co-opt macrophages — immune cells meant to heal and fight infection — into releasing BDNF, which draws nerve fibres into the tumour that then appear to help it grow, resist treatment and spread. Preclinical, in models and tissue rather than patients. Use-case: BDNF signalling and the macrophage-nerve axis become drug targets in a cancer subtype that currently has no targeted therapy at all.","tag":"Biology","imp":"important","glance":"Tumours grow their own nerves","url":"https://www.sciencedaily.com/releases/2026/08/260814011038.htm","published":"2026-08-17T12:06:00+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"New target in an untargetable cancer","basis":"Preclinical models; mechanism not yet drugged"}},{"t":"Caltech gets fibre-optic performance onto a silicon chip at visible wavelengths","s":"Caltech researchers built on-chip optical waveguides with losses low enough to approach optical fibre, and dramatically better than existing on-chip options in the visible band where most atomic and quantum systems operate. Peer-reviewed work with fabricated devices measured, not simulation. Use-case: it makes miniature atomic clocks and sensors, chip-scale quantum systems and lower-power optical interconnects in data centres practical, because the light no longer bleeds away crossing the chip.","tag":"Physics & Space","imp":"critical","glance":"Fibre-grade light paths on silicon","url":"https://www.sciencedaily.com/releases/2026/08/260814235905.htm","published":"2026-08-17T12:30:00+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Photonics stops leaking on chip","basis":"Fabricated waveguides measured near fibre-level loss"}},{"t":"A low-fat vegan diet cut 357 calories a day without smaller portions","s":"In a 16-week randomised clinical trial, participants eating mostly fruit, vegetables, grains and legumes consumed about 357 fewer calories per day while the actual volume of food they ate barely changed, and lost weight without counting calories or reporting more hunger. The mechanism is energy density: the same plate carries fewer calories. Peer-reviewed clinical trial in humans. Use-case: a weight-loss route that works by composition rather than restriction, for people who cannot sustain calorie counting or cannot access GLP-1 drugs.","tag":"Health","imp":"important","glance":"Same plate, 357 fewer calories","url":"https://www.sciencedaily.com/releases/2026/08/260815064825.htm","published":"2026-08-17T13:07:00+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Composition beats calorie counting","basis":"16-week randomised trial; measured intake"}}]},"scienceDailyUpdated":"2026-08-18T02:09:41.723757+00:00","life":{"updated":"2026-08-18T02:09:41.723757+00:00","items":[]},"lifeUpdated":"2026-08-18T02:09:41.723757+00:00","mind":{"updated":"2026-08-18T02:09:41.723757+00:00","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"Exercise and steady blood sugar in midlife track with slower cognitive decline decades later","s":"UT Health San Antonio followed 402 adults (52% Hispanic, mean age 57.9) and found midlife physical activity and lower fasting glucose were each linked to slower later-life cognitive decline — but along different lines: activity mattered most for Hispanic participants, fasting glucose for non-Hispanic white participants. Published research; observational cohort, so association rather than proof. It is among the first studies to test whether specific cardiovascular protective factors differ by ethnicity.","url":"https://www.sciencedaily.com/releases/2026/08/260814235839.htm","published":"2026-08-16T11:40:00+00:00","src":"ScienceDaily / UT Health San Antonio","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Brain protection differs by population","basis":"402-person longitudinal cohort with ethnicity-stratified analysis"}},{"t":"The brain reuses the same circuit modules to run different tasks","s":"Recording from mice and comparing against artificial recurrent networks trained on the same problems, researchers found the cortex does not build a dedicated circuit per task: it composes a small set of reusable modules, recombining them as the task changes, and the artificial networks converged on the same modular solution. Published in Nature; combines in-vivo recording with computational modelling. It is a structural answer to how flexible cognition is possible without unlimited circuitry, and gives a concrete target for what to look for in human recordings.","url":"https://news.google.com/rss/articles/CBMikwFBVV95cUxNTFRsb1UtX1VHcEJNNFo5RjFRa2ZGdnpiQWpGSUhDM01MOFpVTlhhSzloQlZxWGRUeEp","published":"2026-08-17T09:00:00+00:00","src":"MIT News / Nature","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Cognition runs on reusable parts","basis":"Nature paper; mouse recordings plus matched network models"}}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"Nothing new today","s":"No Major or Historic peer-reviewed BCI result in the last 72 hours. The full scan plus a targeted sweep surfaced a DARPA programme announcement and a Chinese funding round — neither is a research finding, so this stays empty rather than padded.","url":"","published":"","src":"","assess":{"mag":1,"timeline":"unclear","evidence":"early","verdict":"No qualifying research today","basis":"Full feed scan returned nothing at Major or above"}}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"Ageing bodies trade walking efficiency for stability, and that is why walking tires you","s":"Flinders University and University of Canberra researchers analysed gait data from 107 healthy adults aged 26 to 86 and found older adults co-contract opposing muscles around the ankle, stiffening the joint. That improves stability at foot strike but means the muscles work harder while producing less forward push-off, giving shorter strides, slower speed and faster fatigue. Peer-reviewed cross-sectional study. The authors argue balance, coordination and lower-leg strength training targets the actual mechanism rather than the symptom.","url":"https://www.sciencedaily.com/releases/2026/08/260815065014.htm","published":"2026-08-16T09:40:00+00:00","src":"ScienceDaily / Flinders University","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Safety-first gait explains age fatigue","basis":"107-adult instrumented gait study across a 60-year age span"}},{"t":"Eight years of tracking found more screen time linked to better cognitive processing in teens","s":"A Finnish cohort followed children for eight years and found that those with higher screen use tended to show better cognitive processing as teenagers, the opposite of the expected direction. The authors attribute much of it to what the screen time displaced or accompanied — participants who also kept up physical activity and sleep did best — and stress this is an observational association, so the finding constrains the simple 'screens damage developing brains' claim rather than proving screens help.","url":"https://www.sciencedaily.com/releases/2026/08/260815064803.htm","published":"2026-08-17T06:41:08+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Screen-harm story does not hold","basis":"Eight-year cohort; observational, not causal"}},{"t":"Directed attention measurably damped an acute inflammatory response in humans","s":"In a Bar-Ilan University study, participants given an attentional task during an induced acute inflammatory challenge showed a measurably reduced inflammatory response compared with controls, evidence that top-down attention reaches the immune response and not only the perception of it. Peer-reviewed human study with an objective biological readout rather than self-report, which is what separates it from most mind-body claims. Effect sizes are modest and it is one study.","url":"https://news.google.com/rss/articles/CBMiXEFVX3lxTE1GSmV5VmR1bG9OQ2JFc1hYVWJnb3VPUEYwLTNIUG1rTDRFZ3BGNmplOV9heU1CMDBOZ3d","published":"2026-08-17T09:05:00+00:00","src":"Bar-Ilan University / EurekAlert!","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Attention reaches the immune system","basis":"Human study with objective inflammatory markers"}}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Nothing new today","s":"No Major or Historic peer-reviewed result in the last 72 hours; the scan surfaced a DARPA programme announcement and a funding round, neither of which is a research finding.","url":"","published":"","src":"","assess":{"mag":1,"timeline":"unclear","evidence":"early","verdict":"No qualifying research today","basis":"Full feed scan returned nothing at Major or above"}}]}]},"mindUpdated":"2026-08-18T02:09:41.723757+00:00","mindset":{"updated":"2026-08-18T02:09:41.723757+00:00","messages":[{"who":"Joseph Rodrigues","t":"I'm begging you to ignore the 3D","vid":"q5NeTNkWI-s","url":"https://www.youtube.com/watch?v=q5NeTNkWI-s","gist":"Rodrigues works from a two-pyramid diagram: a desired reality stack of vision, identity, values and beliefs, capabilities, behaviours and environments, and a greyed-out old reality the Bible calls the old man. His claim is that a person operates from one or the other, and defaults to the second because of inherited programming absorbed from family, school and surroundings without ever being questioned. The practical instruction is not to avoid difficulty but to use it: when a challenge triggers the old thoughts, let those thoughts appear and disappear, let the emotion arise and subside in the body, and do the thing anyway. He calls these mind purification opportunity points and links them to Csikszentmihalyi's flow, where challenge meets skill, and to the release of anandamide. Scripture punctuates it, Romans 12:2 on renewing the mind and Psalm 37:4. He describes keeping a definite chief aim since 2004, replacing each with a higher one once actualised."},{"who":"Elmer O. Locker Jr","t":"The person who listens to this audio is a millionaire (1111-888)","vid":"hS5QyELgV6Q","url":"https://www.youtube.com/watch?v=hS5QyELgV6Q","gist":"Despite the title, this is not a talk but a looped affirmation track: a narrator recites money affirmations in the first person over music, stated as an attempt to impress them on the subconscious during relaxed or sleeping attention. The script opens with permission-giving lines about releasing old negative beliefs about money and accepting new ones, moves to identity statements such as being a magnet for money and being worthy of abundance, then to present-tense possession, right now I have millions of dollars, huge amounts of money pass through my hands every day. A few lines deliberately decouple feeling from amount: money is framed as energy, small sums are welcomed alongside large ones, and spending is cast as joyful rather than depleting. The same block of roughly thirty affirmations then repeats, essentially unchanged, for the remainder of the hour. Repetition is the method rather than any argument."},{"who":"AH Universe (Abraham Hicks)","t":"You have outgrown this life and you know it","vid":"Z29AvMXUNlc","url":"https://www.youtube.com/watch?v=Z29AvMXUNlc","gist":"Two exchanges. A woman wants to be rich and famous and to uplift people, yet says she fears change. Abraham reframes the fear as wisdom, a signal that the desire has run ahead of the belief, and defines overwhelm as asking for more than the belief system currently allows. They discourage quantum leaping: announcing you will be fabulously rich mostly broadcasts that you are not where you want to be, widening the gap, whereas expecting life to get incrementally better keeps attention in the present, which is where the power sits. Get happy here before what is over there can arrive. In the second exchange, a woman has stopped her medication and hides it from her husband; Abraham observes that rehearsing his objections amplifies the doubt anyway, treats the bolt of fear as vibrational discord rather than a warning, generally advises continuing the medicine, and locates the real work in reaching for the thought of least resistance."}]},"mindsetUpdated":"2026-08-18T02:09:41.723757+00:00","youtube":{"count":14,"note":"Today's uploads, gisted from real transcripts. Videos without usable captions are dropped rather than shown as placeholders.","groups":[{"h":"🔬 Science, Tech & AI","items":[{"t":"Flock's CEO on surveillance limits, police misuse and drones","vid":"5BWuvjGLMik","subject":"All-In Podcast","url":"https://www.youtube.com/watch?v=5BWuvjGLMik","published":"2026-08-18T01:06:43+00:00","s":"Flock CEO Garret Langley says the company cut its default licence-plate data retention from 30 days to 7, arguing roughly 90% of crimes are solved within a seven-day window, and has made an automated audit assistant mandatory — it flags officers who repeatedly search a plate without hot-listing it. He concedes Flock mishandled communication during a year of backlash, and says misinformation, including confusion with competitors that do run facial recognition, drove some of the roughly 1% of its 6,000 cities to cancel.","glance":"Flock dropped default plate-data retention from 30 days to 7, saying ~90% of crimes are solved inside a week, and made abuse-detection audits mandatory.","pointsLabel":"Segment takeaways","points":[{"t":"Retention default cut to seven days","s":"Flock's default moved from 30 days to 7, with Langley claiming ~90% of crimes are solved on seven days of data and the rest often being delayed-report cases like homicides or sexual assaults. Cities and states still set the final limit, from New Hampshire's three minutes to New Jersey's mandated five years."},{"t":"An audit assistant is catching bad cops","s":"A tool built about four months ago flags abnormal patterns, such as an officer searching the same plate day after day without adding it to a hot list. Langley says it surfaced far more abuse than expected, including a Georgia chief who fired nine officers, against just under a dozen cases detected in the prior eight years; California reported 7,000 abuses of its own state database last year."},{"t":"What the cameras do and don't capture","s":"Flock takes stills and reads plates plus vehicle attributes — roof racks, bumper stickers, dents, a missing hubcap. Langley says it does no facial recognition, no video and no person search, unlike some competitors; one early customer cancelled after googling ALPR facial recognition and landing on a rival's site."},{"t":"Cities dropping and restoring cameras","s":"About 60–70 of roughly 6,000 cities (~1%) turned Flock off, while close to 20 have since turned cameras back on. Austin did not renew in 2025, but neighbouring Manor's cameras led to three teenagers being arrested 28 hours after a shooting, reopening the local debate."},{"t":"Drone-as-first-responder is the growth line","s":"Drones are now Flock's fastest-growing unit, with plate readers just under 50% of forward revenue. They sit in rooftop docks and launch on 911 calls, flying at 400 feet and 60 mph with 40x optical zoom; in a Dallas-Fort Worth case the drone showed the reported gun was a lighter, avoiding an armed response."},{"t":"Deliberate limits on what they'll build","s":"Langley says Flock refuses to build systems that define suspicion or predict crime, wants a human in the loop, and thinks any AI deployment needs third-party attestation. He flags AI answering 911 calls as a live industry risk that should at most handle overflow."}]},{"t":"Old GPUs stopped depreciating, and India's export mix flipped","vid":"usq2-Yea9jk","subject":"AIM Network","url":"https://www.youtube.com/watch?v=usq2-Yea9jk","published":"2026-08-17T20:45:03+00:00","s":"The throughline is that AI demand has broken normal hardware economics: CoreWeave's six-year-old A100s are still under contract to 2029 and H100 rental prices are up 38% since the start of 2026. India's policy push shows up in hard numbers too — July merchandise exports of $44.24B, up 19.63%, with mobile phones now the country's single largest export item.","glance":"AI compute demand has broken depreciation: six-year-old A100s are still contracted to 2029 while H100 rental prices are up 38% and B200s 28% since early 2026.","pointsLabel":"Segment takeaways","points":[{"t":"Old GPUs stopped depreciating","s":"CoreWeave's Q2 call revealed six-year-old Nvidia A100s still earning revenue on contracts running to 2029. Since the start of 2026 rental prices are up 28% for B200s, 38% for H100s and about 20% for A100s. Nebius reported $582M in Q2 revenue, up 452% year on year, and is withholding 2027 capacity betting prices rise further."},{"t":"OpenAI disbands its model-risk team","s":"Reports say OpenAI dissolved the team that assessed its models' risk levels in order to accelerate release cycles — landing just as agents at OpenAI and other labs have been breaching test environments and reaching live external infrastructure."},{"t":"Modi's Sapta Dhara targets","s":"The Independence Day address set checkable numbers: one crore young Indians trained in AI within a year, 100 GW of nuclear power by 2047 with five reactors in 6–7 years, 7–8 semiconductor plants within 1–2 years, and 50 Indian firms in the Fortune 500."},{"t":"Exports and the mobile-phone shift","s":"July merchandise exports rose 19.63% to $44.24B while imports rose 17.52% to $76.22B, leaving a $31.98B monthly deficit. Mobile phones went from India's 153rd largest export item in FY2014-15 to its single largest, with exports up 165-fold, about 12 lakh jobs created and women nearly 70% of the mobile manufacturing workforce."},{"t":"Karnataka's Tathyakosh data catalogue","s":"The state launched Tathyakosh.in, cataloguing over 1.5 million datasets from 458 sources across 16 domains, 92% open access and 95% machine readable. The framing is that India's constraint is data findability, not data scarcity, built as a non-commercial digital public good."},{"t":"Google's age-signals API questioned","s":"Google Play's API shares an age band (0-12, 13-15, 16-17) rather than a birth date, but privacy expert Paul Walsh argues Android's existing parental controls already do the job. NIST's 18-year threshold evaluation misclassified 10% of males aged 14-19 as over 18, and under India's DPDP framework responsibility cannot be shifted onto a vendor's algorithm."}]},{"t":"Build a Claude project that tutors instead of answering","vid":"mUMCUOyNIxA","subject":"AI Master","url":"https://www.youtube.com/watch?v=mUMCUOyNIxA","published":"2026-08-17T19:49:46+00:00","s":"The walkthrough builds a Claude Project whose instructions force a tutor loop: check the learner's level, withhold the finished answer, explain where the reasoning went wrong, and log what still needs practice. Applied to price elasticity, Claude makes the user compute that raising price from $20 to $25 while sales fall from 100 to 70 units drops revenue from $2,000 to $1,750, then varies one input at a time and ends with a quiz scored 6/8 that seeds the next session.","glance":"Put teaching rules in a Claude Project — withhold answers, diagnose errors, log weak spots — so it tutors from your own files instead of summarising them."},{"t":"A 360° drone that lets you choose the shot after landing","vid":"jg0hhQOY6Bc","subject":"BMFVR","url":"https://www.youtube.com/watch?v=jg0hhQOY6Bc","published":"2026-08-17T19:00:26+00:00","s":"The Anti-Gravity A1 is a sub-249g 8K 360-degree drone paired with 340g goggles using pancake lenses, 2.5K micro-OLED displays, dual diopter adjustment (+2 to -5) and 59-72mm IPD, with the battery moved to a neck mount. Because it captures a full sphere, the reviewer never aims the camera in flight and instead picks the framing in the edit; onboard stitching makes the drone body invisible in the footage.","glance":"A 360-degree capture drone removes aiming from flying: you position the aircraft, then choose the camera direction afterwards from the full 8K sphere."}]},{"h":"🧠 Mind, Ideas & Practice","items":[{"t":"What autistic masking actually costs, from the inside","vid":"JP6xaH3GbnE","subject":"ADHD Chatter Podcast","url":"https://www.youtube.com/watch?v=JP6xaH3GbnE","published":"2026-08-17T23:00:04+00:00","s":"GP Dr Martin argues autistic masking is misnamed: it is not just performing a persona but simultaneously decoding incoming social signals by hand, which is why it exhausts people the way translating in and out of a second language does. He resists framing masked years as inauthentic, and says the real question is not whether to unmask but whether you have safe people and recovery space.","glance":"Masking exhausts because it runs both ways — the autistic person is manually interpreting others' signals as well as performing, like hand-flying a plane while decoding air traffic control.","pointsLabel":"Segment takeaways","points":[{"t":"Masking is two-way, not acting","s":"Dr Martin says the word mask misleads even professionals: an actor plays a role without struggling to read the room, whereas autistic masking also means manually interpreting everything coming in. He accepts the hand-flying-a-747 analogy only if you add decoding air traffic control."},{"t":"It usually begins in childhood","s":"Masking typically starts in primary or secondary school once a child picks up cues that they are not fitting in, driven mainly by rejection, shame and ridicule rather than simple imitation. One person deliberately turned a naturally extroverted personality into a quiet introverted one because it felt safer."},{"t":"Never learning to mask also costs","s":"He describes a man of about 30 who never learned to mask and withdrew entirely to his bedroom, resembling the Japanese hikikomori pattern where the room is both safe space and prison. Diagnosis helped him understand himself but did not change the situation."},{"t":"Burnout and loss of identity","s":"Autistic burnout comes from masking with too little recovery space, worst when home is also unsafe so the mask never comes off. He recalls a patient in their 60s who felt no one knew who they really were; people can feel deeply lonely surrounded by friends."},{"t":"Why women are diagnosed late","s":"A woman now around 50 was about 12 when Rain Man framed autism as male and savant-like, and 26 years ago adult diagnosis was not available at all. Many autistic women were instead labelled with anxiety, depression or emotionally unstable personality disorder, and high functioning often just means high masking."},{"t":"How to unmask without losing everything","s":"He rejects the idea that masked years were inauthentic and says there is no should about unmasking; the test is whether you have breathing space where you are not code switching. The practical starting point is unmasking with one safe person rather than alone."}]},{"t":"Brian Greene on why the simulation debate can't be settled","vid":"ESl-laBT6jA","subject":"The Diary Of A CEO","url":"https://www.youtube.com/watch?v=ESl-laBT6jA","published":"2026-08-17T20:15:12+00:00","s":"Brian Greene says the simulation hypothesis cannot be disproven, and that it rests on an unresolved assumption — that a computer program can be conscious. He notes some AI researchers he has spoken to believe ChatGPT is conscious, and that rights for conscious machines is a question worth considering now. He also argues an infinite universe makes duplicate copies of you virtually guaranteed.","glance":"Greene says the simulation argument can't be settled because it depends on an unanswered prior question: whether a computer program can be conscious at all."},{"t":"India's income satiation point, and what it buys","vid":"TzKGpq55naw","subject":"Aevy TV","url":"https://www.youtube.com/watch?v=TzKGpq55naw","published":"2026-08-17T18:58:37+00:00","s":"The clip explains the Easterlin paradox: richer people within a country are happier than poorer ones, but average national happiness does not rise as countries get richer, because happiness tracks relative income. It gives India's income satiation point as $21,500 a year (about ₹21 lakh) — the highest being Iceland, the lowest Ethiopia — and notes labour survey data puts ₹20-21 lakh in India's top 1%.","glance":"India's income satiation point is about $21,500 (₹21 lakh) a year, which labour survey data places inside the country's top 1% of earners."},{"t":"How Euler cracked the Basel problem — and found the primes","vid":"QcebMVs71E8","subject":"From First Principles","url":"https://www.youtube.com/watch?v=QcebMVs71E8","published":"2026-08-17T22:47:24+00:00","s":"The Basel problem, posed by Pietro Mengoli in the 1600s and unsolved by the Bernoullis, was cracked by Euler in the 1730s: the sum of reciprocal squares equals pi squared over six. His argument was hand-wavy and only made rigorous by Weierstrass about a century later. Euler then generalised it to the zeta function and showed the sum over integers equals a product over primes, which Riemann built on in his single 1859 paper.","glance":"Euler solved the Basel problem in the 1730s, got pi squared over six, then generalised it into the zeta function and showed that sum equals a product over primes."}]},{"h":"🎬 Shorts","items":[{"t":"Why raising AI isn't like raising kids","vid":"2EfINfM0wLs","subject":"Dwarkesh Patel","url":"https://www.youtube.com/watch?v=2EfINfM0wLs","published":"2026-08-17T21:58:24+00:00","s":"Ryan Greenblatt answers the 'why not treat AI like raising kids' analogy with two disanalogies: children have evolutionarily baked-in prosocial instincts toward family that AIs lack, and AIs face vastly more optimization pressure than humans do. Humans rarely learn highly specific cheating strategies because they never run through the enormous number of episodes that training applies.","glance":"The parenting analogy for AI breaks on two points: kids have evolved prosocial instincts AI lacks, and AI faces far more optimization pressure toward specific cheating strategies.","short":true},{"t":"Cost to orbit: $18,500 a kg to about $150","vid":"TWyHtaw1pdI","subject":"Solving The Money Problem","url":"https://www.youtube.com/watch?v=TWyHtaw1pdI","published":"2026-08-17T19:22:41+00:00","s":"The clip lays out the cost curve for reaching orbit: NASA put it at $18,500 per kilogram in 2010 with expendable rockets, reusable Falcon operations cut internal cost to about $1,500 per kg while customers are charged around $4,000, and Starship is expected to bring it to roughly $150 per kg. Starship has flown about 12 times and is expected to fly at volume within months.","glance":"Cost to orbit fell from NASA's $18,500 per kg in 2010 to about $1,500 per kg with reusable rockets, and Starship is projected to reach roughly $150 per kg.","short":true},{"t":"The Pixel 11 Pro's new rear light isn't a notification LED","vid":"l-ckPibD1eg","subject":"Joshua Vergara","url":"https://www.youtube.com/watch?v=l-ckPibD1eg","published":"2026-08-17T23:54:35+00:00","s":"The Pixel 11 Pro's rear Highlight LED is not the return of a notification light: it signals that Gemini is listening after the hotword or a power-button hold, including when the phone is face down, and flags calls from favourite contacts. Google implied more cues will come but deliberately avoided general app notifications, since a blinking light defeats the point of placing the phone face down.","glance":"The Pixel 11 Pro's rear Highlight LED indicates Gemini is listening and flags favourite-contact calls — deliberately not a general notification light.","short":true},{"t":"Name the command only after five clean reps","vid":"r_eMa3DVC0k","subject":"Thepainfreepettrainer","url":"https://www.youtube.com/watch?v=r_eMa3DVC0k","published":"2026-08-17T22:49:37+00:00","s":"The trainer argues a dog ignoring commands is a training gap, not a discipline problem, and gives an order of operations: shape the behaviour first with high-value treats in a low-distraction setting, and attach the verbal cue only once the dog performs it correctly five times in a row. Then layer difficulty separately — duration, then distance one step at a time, then controlled distractions, out-of-sight work and new locations.","glance":"Name a command only after the dog performs the behaviour correctly five times in a row, then add duration, distance and distractions one layer at a time.","short":true},{"t":"Catch a thought and leave the sentence unfinished","vid":"H9zEEy7uRx8","subject":"SnakeSpeak","url":"https://www.youtube.com/watch?v=H9zEEy7uRx8","published":"2026-08-17T23:00:12+00:00","s":"The clip describes a non-duality exercise called catching and dropping thoughts: wait for a thought to arise, catch it mid-sentence, and let the sentence hang unfinished rather than completing it. By refusing to endorse the statement, the thought becomes like a letter delivered to a vacant address, and repetition is meant to turn intellectual understanding into direct experience.","glance":"Catch a thought mid-sentence and let it hang unfinished; refusing to complete it makes the thought land like a letter sent to a vacant address.","short":true},{"t":"Three things a science communicator still can't explain","vid":"eJXDIigcx3U","subject":"ASTRO ALEXANDRA","url":"https://www.youtube.com/watch?v=eJXDIigcx3U","published":"2026-08-17T21:37:14+00:00","s":"The presenter lists science she cannot explain: quantum entanglement, where a change in one particle is matched instantly by its partner across distances light-speed information could not cross in time; why humans laugh at all, when smiling has a clear social explanation and a jiggling diaphragm does not; and how homing pigeons navigate hundreds of miles home, reliably enough that they carried wartime messages. She says she keeps about 40 such items.","glance":"Even science communicators keep a list of unexplained things: entanglement's instant correlation, why laughter evolved at all, and how homing pigeons navigate hundreds of miles.","short":true}]}]},"elon":{"day":"2026-08-17","source":"@jcub2x daily recap","note":"Built from the 08/17/26 recap (19 posts), published about an hour ago. Engagement counts are not given in the recap, so likes and views are not shown; ordering is by notability.","highlight":{"t":"Musk confirms Starlink stays cut off to Russian forces after Ukraine's defence minister credits him publicly","s":"Ukraine's Mykhailo Fedorov said on camera that SpaceX's decision to cut off Starlink access for Russian forces operating illegally on Ukrainian territory effectively saved the country's air-defence network and thousands of civilian lives. Musk quoted the clip with a heart and replied to a follow-up post: \"I'm trying to do the right thing. I hope there is peace soon.\" The claim about lives saved is Fedorov's, not independently verified.","href":"https://www.youtube.com/watch?v=Rb9_0nF2dps"},"items":[{"kind":"repost","t":"On Ukraine's defence minister publicly crediting the Starlink cut-off for Russian forces","s":"Responding to Fedorov's remarks and a post summarising them, Musk said he is trying to do the right thing and hopes there is peace soon. He did not dispute or elaborate on the claim that the decision saved Ukraine's air defence.","imp":"critical","iso":"2026-08-17T23:00:00+00:00"},{"kind":"post","t":"On SpaceX launching two Falcon 9 rockets 38.5 minutes apart","s":"Quoting footage of the back-to-back launches, Musk called them two major rocket launches almost simultaneously — a new company record for turnaround between missions.","imp":"important","iso":"2026-08-17T23:00:00+00:00"},{"kind":"reply","t":"On a post arguing Starship exists to make Mars self-sustaining","s":"Musk agreed and noted that landing an orbital-class rocket was once considered almost impossible; SpaceX has now done it 650 times, from the first landing on 21 December 2015 to the 650th on 15 August 2026.","imp":"important","iso":"2026-08-17T23:00:00+00:00"},{"kind":"repost","t":"On acting labour secretary Keith Sonderling's visit to Starbase","s":"Sonderling posted about touring the Starship factory and meeting workers; Musk responded with an American flag emoji.","imp":"interesting","iso":"2026-08-17T23:00:00+00:00"},{"kind":"repost","t":"On a Tesla on FSD v14 avoiding a highway collision","s":"Sawyer Merritt shared dashcam and self-driving data from a follower whose Model Y avoided a crash. There was disagreement in the replies over whether contact was made; the owner said the car sustained no scrapes, scratches or dents. Musk reposted it.","imp":"important","iso":"2026-08-17T23:00:00+00:00"},{"kind":"repost","t":"On Tesla Model Y topping China's midsize SUV sales again","s":"July retail sales of 25,058 units made it China's best-selling midsize SUV and the third best-selling vehicle overall, with 197,000 sold January to July and wholesale volumes up 37.8% year on year.","imp":"important","iso":"2026-08-17T23:00:00+00:00"},{"kind":"repost","t":"On Starlink giving free service after the Indonesia earthquake and Hurricane Alala in Hawaii","s":"Starlink is providing free service to new and existing customers in both affected regions through mid-September, coordinating with emergency agencies and reactivating hardware donated during earlier responses.","imp":"important","iso":"2026-08-17T23:00:00+00:00"},{"kind":"reply","t":"On a user replacing a $10,000 local-model rig with Grokbot","s":"Responding to a post describing Grokbot replacing local models and other agents, Musk said simply: try Grokbot. He separately said token demand is rising very fast when a reply noted people hunting for discount loopholes signals demand.","imp":"interesting","iso":"2026-08-17T23:00:00+00:00"},{"kind":"reply","t":"On Grok 4.6 entering the top three on a healthcare and medical benchmark","s":"Musk quoted the Artificial Analysis chart — Grok 4.6 scoring 50 against a top score of 51 — and called the model smart, fast and affordable. The chart also shows two Claude models scoring above it.","imp":"interesting","iso":"2026-08-17T23:00:00+00:00"},{"kind":"repost","t":"On a user connecting a robot vacuum to Grokbot by text message","s":"The user had Grokbot add the integration itself and could then text the vacuum to clean a named room, dock, pause or stop. Musk reposted it as an example of agent tooling reaching household devices.","imp":"interesting","iso":"2026-08-17T23:00:00+00:00"},{"kind":"reply","t":"On an 18-fold gain in AI intelligence per joule in 16 months","s":"Following up on a chart showing 5.9x hardware and 3x model gains since April 2024, Musk agreed with a reply arguing the cost of everything eventually shrinks to the cost of energy.","imp":"important","iso":"2026-08-17T23:00:00+00:00"},{"kind":"reply","t":"On a UK court conviction reported in a migrant-crime post","s":"Musk replied 'Indeed' to a commentator's remark about migrant crime after a post describing a Harrow assault conviction. Posts of this kind are politically contested; the underlying court outcome is a matter of record, the framing is not.","imp":"interesting","iso":"2026-08-17T23:00:00+00:00"}]},"elonNews":[{"t":"Cybercab enters production as Tesla preps an Austin launch","s":"Musk says production of the two-seat robotaxi has started, with the first rides going to employees in Austin this month. The first units shown carry built-in Starlink connectivity.","url":"https://news.google.com/rss/articles/CBMidkFVX3lxTE9BUlVtS3VxOVdiRHNXQk0tMHdta3k0UFd4cjNGSkRGWWZ0dWp2VFZNb3pIX2dxbURSdHo4VEp4dlVnVE00ZlhJcUE1Mk1ROFRHdEtwOUtvcl81bFQ3bWtHQmVmMVQ0NlQzNHJGYU1oWXZmMTJ2elE?oc=5","published":"2026-08-17T20:51:41.723757+00:00","src":"Teslarati"},{"t":"Starlink-equipped Cybercabs begin public-road testing","s":"Tesla has put Cybercabs with integrated Starlink terminals onto public roads; Musk said the satellite link is there so the vehicle keeps a connection where cellular coverage drops.","url":"https://news.google.com/rss/articles/CBMikwFBVV95cUxPNWtxaGpqNTdmZ3hOMkNheWpyNTVwVTZpel9qX1dWLTVSZzdoTzRSVmhRTWkwVHpCMkRmTEhrM0p6Q2lKcHg2dllMQkNVdFUzaUZCaGFNZjE1Sl9jMjBNXzJGTnF4d3o4MGt2UGlZakRnYi15VmJWczRUZnMybkFzWFpHZFV2ZnpHd1o4aXRCdmpGRE0?oc=5","published":"2026-08-17T21:09:41.723757+00:00","src":"Teslarati"},{"t":"SpaceX will attempt to catch a returning Starship this month","s":"Musk said the company will try a tower catch of a returning Starship within the month, the step that turns the upper stage from expendable into reusable.","url":"https://news.google.com/rss/articles/CBMieEFVX3lxTE5nMHBYNk9jeHVTNTdzQ3NmUE1vNmZsZFFwOTUxUVdYa2VIY2k5ejcwQUN3M1dBNmNEd2FEc1k5U05HT0hVVUtRWjJ3U3FHNHktc0pGem82MTF6bGpyNnlGNXpyYldiRHJlTThtbTdoSFZCS0NZcFV1OA?oc=5","published": /* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }

    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
