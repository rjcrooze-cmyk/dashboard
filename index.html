 corridor from 37km to about 11km. The shorter scope would drop several stretches that were part of the original congestion plan.", "imp": "interesting", "glance": "Double-decker corridor may shrink to 11km", "url": "https://news.google.com/rss/articles/CBMi2gFBVV95cUxQZjZNZ2g2Q2NXMkRhdlhVR2d5RWFkQWd4R2pINVlBdnVEQlBWZHJhQWdDVnlZTWxsWnNIYzVIc29aaVNITGYwTlhaSVVlc1A2SkY0eFhDV21hZzg1bkJaYnQtcWMxdWlMa29hb3VscjJJMHNHT2xIMFpXY0FuT1ppYU14cTBLajNfQzd6UlJ4LUpJaWdRTWpjcERFemtWWkE5NE5ZUDFFeFN6RlFTNmt1UTV6eEl4eFNRajVhSGJXc280X2NsUVZDVkU2aHJqUnF1d2ptcDJGekIwd9IB2gFBVV95cUxQZjZNZ2g2Q2NXMkRhdlhVR2d5RWFkQWd4R2pINVlBdnVEQlBWZHJhQWdDVnlZTWxsWnNIYzVIc29aaVNITGYwTlhaSVVlc1A2SkY0eFhDV21hZzg1bkJaYnQtcWMxdWlMa29hb3VscjJJMHNHT2xIMFpXY0FuT1ppYU14cTBLajNfQzd6UlJ4LUpJaWdRTWpjcERFemtWWkE5NE5ZUDFFeFN6RlFTNmt1UTV6eEl4eFNRajVhSGJXc280X2NsUVZDVkU2aHJqUnF1d2ptcDJGekIwdw?oc=5", "published": "2026-09-16T18:10:00+00:00", "src": "Times of India"}]}]}, "newsUpdated": "2026-09-17T02:04:38Z", "aitrends": {"updated": "2026-09-17T02:04:38Z", "items": [{"t": "TypeSafe ships Jev, a decision-only 'System One' model", "heat": 100, "delta": "new", "sources": 6, "url": "https://typesafe.ai/blog/introducing-system-one-models-and-jev", "s": "TypeSafe AI, founded by people who worked on ChatGPT, launched Jev and with it a new model class it calls System One: not a chatbot, but a typed, decision-only model that returns structured output. It claims roughly 200x the speed of Claude at a fraction of the cost while matching GPT-5.6 Terra-level quality on the tasks it targets. The concrete use-case is the huge amount of software that currently calls a chat LLM just to make one small typed decision — routing, classification, extraction — where latency and cost, not eloquence, are what matter. Early access, vendor-reported benchmarks.", "glance": "A non-chat model built for typed decisions", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "New model class, not another chatbot", "basis": "Public launch with vendor benchmarks; independent replication not yet available"}}, {"t": "Gemini 3.8 Live adds extended thinking", "heat": 88, "delta": "steady", "sources": 4, "url": "https://deepmind.google/blog/introducing-gemini-3-8-live-and-3-8-live-extended-thinking/", "s": "Google DeepMind's Gemini 3.8 Live and its extended-thinking variant are still the most-discussed launch of the week, a day after release. The draw is real-time multimodal interaction that can now also reason for longer before answering, which is what makes live voice and video assistants usable for anything beyond quick lookups. Shipped product.", "glance": "Real-time Gemini that can think longer", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Live multimodal plus deliberation", "basis": "Shipped and publicly available; benchmark claims from Google"}}, {"t": "OpenAI publishes a misalignment reporting framework and six incidents", "heat": 78, "delta": "new", "sources": 3, "url": "https://openai.com/index/model-misalignment-reporting-framework", "s": "OpenAI released a framework for tracking, investigating and disclosing model misalignment, and used it to publish six reports of unexpected or concerning model behaviour found during testing. The practical value is a template other labs and enterprise buyers can point at when asking what a vendor does when its model misbehaves — disclosure norms are what make model risk auditable.", "glance": "A disclosure template for model misbehaviour", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Turns misalignment into disclosed incidents", "basis": "Published framework plus six concrete incident reports"}}, {"t": "Chinese open-weight models close to four months behind", "heat": 74, "delta": "new", "sources": 4, "url": "https://arstechnica.com/ai/2026/09/exclusive-open-chinese-models-close-gap-with-silicon-valleys-frontier-ai-models/", "s": "A Mozilla report finds open-weight Chinese models now trail the US frontier by roughly four months, and that paying for a frontier model buys that four-month head start at about five times the cost. For anyone deciding whether to build on an API or on weights they host themselves, that is the number the decision turns on. Report with benchmark methodology; the gap varies by task.", "glance": "Open weights now ~4 months behind frontier", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Puts a price on the frontier gap", "basis": "Mozilla benchmark report previewed by Ars; gap uneven across benchmarks"}}, {"t": "Salesforce and Nvidia ship Koa, a CRM reasoning model", "heat": 70, "delta": "cooling", "sources": 3, "url": "https://www.salesforce.com/news/", "s": "Salesforce's Nvidia-powered Koa reasoning model is aimed squarely at the frontier labs' enterprise business: a model trained on CRM workflows rather than a general assistant bolted onto them. Salesforce is separately briefing a $50bn revenue ambition built on agents taking over enterprise software seats. Shipped product, vendor benchmarks.", "glance": "A reasoning model trained on CRM work", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Vertical model aimed at agents", "basis": "Announced and shipping; vendor-reported evaluation only"}}, {"t": "Nvidia claims up to 35x more tokens per watt", "heat": 66, "delta": "new", "sources": 3, "url": "https://blogs.nvidia.com/", "s": "Nvidia says its latest AI factory stack delivers up to 35 times more tokens per watt than the generation it replaces. Power, not silicon supply, is now the binding constraint on data-centre buildout, so efficiency per watt is the number that decides how much inference a given grid connection can serve. Vendor-reported, best-case configuration.", "glance": "Inference efficiency becomes the buildout limit", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Power per token is the real constraint", "basis": "Vendor benchmark, best-case stack; independent measurement pending"}}, {"t": "Ternary LLMs break the 1.58-bit floor", "heat": 62, "delta": "new", "sources": 3, "url": "https://arxiv.org/abs/2609.16338", "s": "A new paper shows ternary large language models, which store every weight as -1, 0 or +1, can be compressed below the 1.58 bits per weight that was assumed to be the information-theoretic floor. Cheaper weights mean frontier-class models fit on consumer hardware and on-device inference gets meaningfully closer. Preprint with reported results; not yet reproduced at frontier scale.", "glance": "Sub-1.58-bit weights for local models", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Pushes big models onto small hardware", "basis": "arXiv preprint; results not yet independently reproduced at scale"}}, {"t": "A 4B model writes faster query plans than Postgres", "heat": 60, "delta": "new", "sources": 2, "url": "https://rohanbansal.com/qorl", "s": "A 4-billion-parameter model trained with reinforcement learning produced query plans 81% faster than the Postgres planner on the benchmark set. Query planning is a bounded, verifiable task with a clear reward signal, which is exactly where small specialised models beat both hand-written heuristics and general frontier models. Single-author benchmark result.", "glance": "Small model beats the Postgres planner", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "early", "verdict": "RL beats a hand-tuned optimiser", "basis": "Single benchmark writeup; no independent replication or production use"}}, {"t": "Anthropic merges Claude chat with Cowork", "heat": 55, "delta": "new", "sources": 3, "url": "https://www.anthropic.com/news", "s": "Anthropic is folding its Cowork agent surface into the main Claude interface, and adding its own document and slide creation to compete with Google's Workspace AI. The direction of travel is the same everywhere: the chat box becomes the shell for file work rather than a separate destination. Shipped product change.", "glance": "Chat becomes the shell for file work", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Consolidates agent and chat surfaces", "basis": "Announced product change, rolling out to users"}}, {"t": "Factory triples to $5bn on AI coding agents", "heat": 52, "delta": "new", "sources": 3, "url": "https://techcrunch.com/category/artificial-intelligence/", "s": "AI coding startup Factory raised $200m at a $5bn valuation, more than tripling in a single round, while Arcee raised $150m at $1bn to build open-weight models. Coding agents remain the one AI category where enterprise spend is clearly converting, which is what the valuations are tracking. Reported funding rounds.", "glance": "Coding agents keep clearing funding bars", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Coding is where AI spend converts", "basis": "Reported and confirmed funding rounds"}}, {"t": "OpenAI weighs a $1.2 trillion round before IPO", "heat": 48, "delta": "new", "sources": 3, "url": "https://www.theinformation.com/", "s": "OpenAI is reported to be considering a funding round at a valuation above $1.2 trillion ahead of its planned listing. Single-report stage, denied by nobody and confirmed by nobody.", "glance": "A pre-IPO round at over $1.2tn", "assess": {"mag": 2, "timeline": "1-2 yrs", "evidence": "speculative", "verdict": "Single report, no confirmation", "basis": "Reported by one outlet; no company statement"}}, {"t": "OpenAI is paying to generate new biology data", "heat": 46, "delta": "new", "sources": 2, "url": "https://www.technologyreview.com/2026/09/15/1144129/ai-models-need-more-data-about-biology-and-openai-is-paying-to-create-it/", "s": "AI models have run short of high-quality biological data, so OpenAI is funding the creation of new experimental data rather than only scraping what exists — including buying data from failed biotech companies at bankruptcy proceedings. If it works it makes drug-discovery models meaningfully better; it also sets a precedent for labs commissioning wet-lab work.", "glance": "Labs start paying for new biology data", "assess": {"mag": 3, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Data scarcity moves upstream", "basis": "Reported programme; no results published yet"}}, {"t": "Meta hands WhatsApp Business setup to agents", "heat": 42, "delta": "new", "sources": 2, "url": "https://techcrunch.com/2026/09/15/meta-now-lets-ai-agents-handle-the-boring-parts-of-whatsapp-business-setup/", "s": "Meta now lets AI agents do the configuration work of setting up a WhatsApp Business account — catalogue, replies, flows. For small businesses in India, where WhatsApp is the default storefront, that removes the main reason accounts are set up badly or not at all. Shipped feature.", "glance": "Agents configure WhatsApp Business accounts", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Removes small-business setup friction", "basis": "Shipped feature announced by Meta"}}, {"t": "Advertising arrives inside AI chatbots", "heat": 38, "delta": "new", "sources": 2, "url": "https://theconversation.com/advertising-is-coming-to-ai-chatbots-and-it-could-influence-the-answers-you-get-291235", "s": "Ad formats are being built into consumer AI assistants, raising the question of whether a sponsored result can be distinguished from a recommendation when both arrive as the same paragraph of text. Analysis piece rather than a launch, but it names the incentive problem clearly.", "glance": "Sponsored answers are hard to label", "assess": {"mag": 2, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Ad incentives enter the answer itself", "basis": "Analysis of announced ad plans; no shipped implementation reviewed"}}]}, "aitrendsUpdated": "2026-09-17T02:04:38Z", "science": {"updated": "2026-09-17T02:04:38Z", "items": [{"t": "Quantum teleportation jumped to 100 channels at once, carrying a whole image", "s": "Quantum teleportation has been demonstrated for years, but one channel at a time — which caps how much a future quantum network could carry. A team led by Jietai Jing at East China Normal University teleported the quantum state of a 100-pixel image across 100 independently addressable channels simultaneously, the largest parallel teleportation reported. Bandwidth, not distance, is the bottleneck for linking quantum computers, and this attacks it directly.", "tag": "Physics & Space", "imp": "important", "glance": "100-channel quantum teleportation", "url": "https://www.sciencealert.com/breakthrough-scientists-just-teleported-an-image-across-100-quantum-channels-at-once", "published": "2026-09-15T02:38:45Z", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Bandwidth for quantum networks", "basis": "Largest parallel teleportation reported: 100 addressable channels, 100-pixel image"}}, {"t": "Solar cells ran 10 metres under the South China Sea and charged a battery in two hours", "s": "Sunlight is scattered and absorbed fast in water, so underwater photovoltaics have only ever been tested at about two metres. A Yunnan University team tuned cells to the narrow blue-green band that survives at depth and ran them 10 metres down in the open sea, harvesting enough power to charge lithium-ion batteries in two hours. That is the difference between a lab curiosity and a way to keep seabed sensors, moorings and underwater drones running without surfacing. Peer-reviewed in Joule.", "tag": "Energy", "imp": "important", "glance": "Underwater solar works at 10m", "url": "https://www.sciencealert.com/scientists-successfully-test-underwater-solar-cells-32-feet-below-the-south-china-sea", "published": "2026-09-15T13:00:00Z", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Power for seabed sensors and drones", "basis": "Open-sea test at 10 m in Joule; charged Li-ion cells in two hours"}}, {"t": "Organ-on-a-chip screening is good enough to cut thousands of animal drug tests", "s": "Regulators have been waiting for non-animal safety data that is actually more predictive, not merely more humane. New Scientist reports that organ-on-a-chip devices and organoids now give more accurate human safety signals than animal models for several toxicity endpoints, which is what regulators need before they will accept them — and would remove thousands of animal tests per drug programme while making early safety calls better.", "tag": "Health", "imp": "important", "glance": "Chips replace animal safety tests", "url": "https://www.newscientist.com/article/2587512-how-better-ways-of-screening-drugs-could-soon-lead-to-thousands-fewer-animal-tests/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "published": "2026-09-15T15:00:00Z", "src": "New Scientist", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Better safety data, fewer animals", "basis": "Organ-on-chip and organoid toxicity data now outperform animal models on key endpoints"}}, {"t": "A deep-sea enzyme makes ammonia from air and survives industrial heat", "s": "Ammonia for fertiliser is made by the Haber-Bosch process, which consumes roughly 1-2% of world energy. Natural nitrogen-fixing enzymes are a gentler route but fall apart at useful temperatures. Researchers characterised a nitrogenase from a deep-sea microbe that stays stable when hot, which is the property a bio-industrial fertiliser process would need. Peer-reviewed; enzyme-level result, not a plant.", "tag": "Chemistry", "imp": "important", "glance": "Heat-proof enzyme fixes nitrogen", "url": "https://phys.org/news/2026-09-stable-enzyme-deep-sea-microbe.html", "published": "2026-09-15T18:00:06Z", "src": "Phys.org", "assess": {"mag": 4, "timeline": "10+ yrs", "evidence": "early", "verdict": "A gentler path to fertiliser", "basis": "Thermostable nitrogenase characterised; enzyme-level, far from industrial scale"}}, {"t": "A \"living medication\" made from patients' own cells rebuilt bone in advanced osteoporosis", "s": "Osteoporosis affects an estimated 500 million people and causes up to 37 million fragility fractures a year, and existing drugs mostly slow loss rather than rebuild. In a first-in-human phase 1 trial reported in Cell, ten patients with advanced osteoporosis received a modified version of their own mesenchymal stem cells and showed significant bone-strengthening effects. Ten patients is a safety trial, not proof of fracture prevention. Peer-reviewed in Cell.", "tag": "Health", "imp": "important", "glance": "Own cells rebuild weak bone", "url": "https://www.sciencealert.com/living-medication-may-have-restored-bone-strength-in-10-patients-with-advanced-osteoporosis", "published": "2026-09-15T22:00:00Z", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Cell therapy that rebuilds bone", "basis": "First-in-human phase 1 in Cell; 10 patients, safety primary endpoint"}}, {"t": "Plasma plus electricity turns waste CO₂ into methanol and butane in one step", "s": "Turning captured carbon dioxide into something worth selling is what makes carbon capture pay for itself, and most routes need high pressure or scarce catalysts. Yale researchers combined electrocatalysis with a plasma stage to make methanol, butane and other feedstock chemicals from CO₂ at practical efficiency. Peer-reviewed in Nature Catalysis.", "tag": "Chemistry", "imp": "important", "glance": "CO₂ into fuel feedstock", "url": "https://phys.org/news/2026-09-plasma-electricity-methanol-butane-chemicals.html", "published": "2026-09-15T22:40:01Z", "src": "Phys.org / Nature Catalysis", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Makes captured carbon worth money", "basis": "Nature Catalysis; plasma plus electrocatalysis yields methanol and butane"}}, {"t": "A placenta-derived nasal spray held off Alzheimer's decline in mice", "s": "Amyloid and tau get the attention, but chronic activation of microglia and astrocytes damages neurons through inflammation too. A team at the Catholic University of the Sacred Heart gave mice a nasal formulation of extracellular vesicles from human placental cells and saw protection against cognitive decline. This is a mouse study — animal, preclinical — and Alzheimer's has a long history of mouse results that did not carry over. Peer-reviewed in Translational Neurodegeneration.", "tag": "Health", "imp": "important", "glance": "Nasal spray targets brain inflammation", "url": "https://www.sciencealert.com/nasal-spray-derived-from-human-placenta-protects-against-alzheimers-decline-study-in-mice-shows", "published": "2026-09-16T01:08:19Z", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "10+ yrs", "evidence": "early", "verdict": "Anti-inflammatory route into the brain", "basis": "Mouse study, Translational Neurodegeneration; placental vesicles given nasally"}}, {"url": "https://www.scientificamerican.com/article/blood-test-shows-promise-in-detecting-pancreatic-cancer-early-a-holy-grail-for-the-field/", "published": "2026-09-16T13:00:00+00:00", "t": "A blood test caught pancreatic cancer early, the field's long-sought goal", "s": "A blood test showed promise at detecting pancreatic cancer at an early stage, which specialists describe as the holy grail for a cancer almost always found too late to treat. Early detection is the single biggest lever on pancreatic survival. Reported from a research study; needs prospective validation in a screening population before it can be used.", "tag": "Health", "imp": "important", "src": "Scientific American", "glance": "Early blood test for pancreatic cancer", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Early detection where none exists", "basis": "Research-stage assay; not yet validated prospectively for screening"}}, {"url": "https://techxplore.com/news/2026-09-tiny-polymer-devices-mimic-neuron.html", "published": "2026-09-16T14:00:17-04:00", "t": "MIT's polymer devices fire like neurons and hold memory in the same cell", "s": "MIT researchers built a compact polymer-based platform where one device both computes and stores, mimicking neuron firing rather than shuttling data between separate logic and memory. That collapses the energy cost that dominates edge AI hardware, aimed at adaptive electronics that run inference on-device. Lab demonstration, peer-reviewed, not yet integrated at scale.", "tag": "Physics & Materials", "imp": "important", "src": "MIT via TechXplore", "glance": "One polymer device computes and remembers", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Compute and memory in one cell", "basis": "Lab-scale polymer devices; neuron-like firing shown, no system integration yet"}}, {"url": "https://techxplore.com/news/2026-09-steelmaking-solar-energy-electric-arc.html", "published": "2026-09-16T14:20:03-04:00", "t": "Electric-arc-furnace slag works as cheap heat storage for solar", "s": "High-temperature thermal energy storage is the cheapest way to make solar dispatchable after dark, but the storage medium is usually the cost blocker. Early tests show electric arc furnace slag, a steelmaking waste stream already produced in bulk, performs well as that medium. Early-stage materials testing, not yet a built plant.", "tag": "Energy", "imp": "important", "src": "TechXplore", "glance": "Steel slag as low-cost solar heat store", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Waste stream becomes storage medium", "basis": "Early comparative tests of slag candidates; no pilot plant results"}}, {"url": "https://medicalxpress.com/news/2026-09-human-trial-blood-clots.html", "published": "2026-09-16T14:40:06-04:00", "t": "A sensor-tipped wire read stroke clots from the inside in the first human trial", "s": "University of Galway researchers took part in a first-in-human study threading a thin sensor-fitted wire into stroke patients to assess and map the composition of their clots in place. Knowing whether a clot is fibrin- or red-cell-rich decides which retrieval device works, so reading it live could cut the number of failed passes. First-in-human feasibility study, small cohort.", "tag": "Health", "imp": "important", "src": "University of Galway via MedicalXpress", "glance": "Clot composition read live in stroke", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "First human read of clot makeup", "basis": "First-in-human feasibility trial; device selection not yet outcome-tested"}}, {"url": "https://techxplore.com/news/2026-09-material-transistor-universal-injector-densely.html", "published": "2026-09-16T15:32:29-04:00", "t": "One material injects charge into both transistor types, clearing a path to stacked AI chips", "s": "A KAIST-led team used a single material as a 'universal charge injector' for atomically thin semiconductors, solving the long-standing problem that n-type and p-type 2D transistors each needed different contact metals. One contact material for both means 2D logic can be stacked vertically, which is the route to smaller and more energy-efficient AI chips. Peer-reviewed device study, lab-scale prototypes, not yet a production process.", "tag": "Physics & Materials", "imp": "important", "src": "KAIST via TechXplore", "glance": "One contact material for 2D chips", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Real contact fix for 2D logic", "basis": "Single injector demonstrated for n- and p-type 2D transistors in lab devices"}}, {"url": "https://medicalxpress.com/news/2026-09-caar-cell-therapy-route-neurological.html", "published": "2026-09-16T17:20:06-04:00", "t": "CAAR T-cells cleared the rogue antibody makers behind two autoimmune brain diseases", "s": "DZNE and Charite researchers engineered T-cells that display the target antigen rather than a receptor for it, so only the specific B-cells producing disease-causing antibodies are destroyed and the rest of the immune system is spared. It worked in mouse models of two neurological autoimmune conditions. Preclinical, mouse-only; a human trial has not started.", "tag": "Health", "imp": "important", "src": "DZNE / Charite via MedicalXpress", "glance": "Precision T-cells for autoimmune brain disease", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Targets only the guilty B-cells", "basis": "Mouse models of two conditions; no human data yet"}}, {"url": "https://medicalxpress.com/news/2026-09-glp-drugs-linked-higher-regurgitation.html", "published": "2026-09-16T18:10:01-04:00", "t": "GLP-1 drugs raise regurgitation under anaesthesia elevenfold", "s": "Research presented at the Association of Anaesthetists meeting and published in Anaesthesia found that patients on GLP-1 drugs regurgitated stomach contents during anaesthesia at eleven times the rate of other patients. With GLP-1 use now widespread, this changes pre-operative fasting advice and airway planning for a very large group of surgical patients. Peer-reviewed observational study in a real surgical cohort.", "tag": "Health", "imp": "critical", "src": "Anaesthesia journal via MedicalXpress", "glance": "GLP-1 users: 11x regurgitation risk in surgery", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Changes pre-op practice immediately", "basis": "Peer-reviewed cohort in Anaesthesia; 11-fold rate vs non-users"}}, {"url": "https://scitechdaily.com/harvard-scientists-use-tiny-sound-waves-to-protect-quantum-information/", "published": "2026-09-16T19:16:50+00:00", "t": "Harvard used sound waves on a chip to stop qubits from forgetting", "s": "Harvard SEAS researchers showed that the same acoustic vibrations used to carry quantum information across a chip can also shield it from environmental noise, the main reason qubits lose their state. Using one mechanism for both transport and protection simplifies the hardware of a quantum processor. Peer-reviewed physics result on a test device.", "tag": "Physics & Space", "imp": "important", "src": "Harvard SEAS via SciTechDaily", "glance": "Sound waves protect qubits on chip", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Transport doubles as decoherence shield", "basis": "Peer-reviewed device physics; single-chip demonstration, not a full processor"}}]}, "scienceUpdated": "2026-09-17T02:04:38Z", "scienceDaily": {"updated": "2026-09-17T02:04:38Z", "items": [{"t": "139 trials and 10,000 patients: knee braces beat high-tech options for arthritis pain", "s": "A network meta-analysis pooling 139 randomised trials and nearly 10,000 people with knee osteoarthritis found knee braces ranked highest overall for reducing pain, stiffness and mobility problems, with water-based therapy strongest for pain and regular exercise consistently improving both pain and function. More expensive high-tech interventions ranked lower. Peer-reviewed meta-analysis of randomised trials — the strongest evidence tier for a treatment comparison.", "tag": "Health", "imp": "critical", "glance": "Braces beat gadgets for knee pain", "url": "https://www.sciencedaily.com/releases/2026/09/260913082208.htm", "published": "2026-09-15T03:57:43Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Cheapest options rank highest", "basis": "Network meta-analysis: 139 RCTs, ~10,000 patients; braces and hydrotherapy top-ranked"}}, {"t": "The flesh-eating screwworm is back in the US, and a new system predicts where it goes next", "s": "The New World screwworm, eradicated from the United States decades ago, has returned and is spreading north, threatening livestock, wildlife, pets and in rare cases people. A UC San Diego team built a tracking system that predicts where outbreaks will appear next, while officials revive the sterile-insect eradication strategy that worked before. For livestock owners this is an operational warning, not a curiosity.", "tag": "Biology", "imp": "important", "glance": "Screwworm returns; tracker predicts spread", "url": "https://www.sciencedaily.com/releases/2026/09/260914102439.htm", "published": "2026-09-15T10:39:40Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Predictive tracking for a livestock parasite", "basis": "UC San Diego prediction system; screwworm confirmed spreading north in the US"}}, {"url": "https://www.sciencedaily.com/releases/2026/09/260914102447.htm", "published": "2026-09-15T22:37:01-04:00", "t": "A natural molecule the retina makes can slow degenerative vision loss", "s": "Erucamide, a molecule the retina produces naturally, turns out to activate protective immune responses in retinal tissue. Restoring it stabilised the tissue and slowed aspects of degeneration in preclinical models, suggesting a supplement-style route for diseases where the current options are injections or nothing. Preclinical animal work; no human trial.", "tag": "Health", "imp": "important", "src": "ScienceDaily", "glance": "Erucamide slows retinal degeneration", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Native molecule protects the retina", "basis": "Preclinical models only; restoration slowed but did not stop degeneration"}}, {"t": "Four weeks of a different diet measurably lowered biological age in older adults", "s": "Older adults who shifted the balance of fat, carbohydrate and animal protein in their diets showed reduced biological-age markers after four weeks, with the strongest effect in an omnivorous, lower-fat, higher-carbohydrate arm. Four weeks and epigenetic-clock endpoints are a long way from proven longevity benefit, but the intervention is free and immediately available. Peer-reviewed controlled trial; biomarker endpoints, not outcomes.", "tag": "Health", "imp": "important", "glance": "Diet shift cut biological age", "url": "https://www.sciencedaily.com/releases/2026/09/260915100000.htm", "published": "2026-09-16T01:35:54Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "Diet composition moves ageing markers", "basis": "Controlled trial, 4 weeks; epigenetic-age endpoints, not clinical outcomes"}}, {"url": "https://www.sciencedaily.com/releases/2026/09/260915232126.htm", "published": "2026-09-16T08:52:48-04:00", "t": "Four to six servings of whole grain a day is the measured sweet spot", "s": "A review of 87 clinical trials found four to six daily servings of whole grains improved body weight, waist size, blood pressure, cholesterol, blood sugar, triglycerides and several inflammation markers, with benefit flattening beyond that range. A pooled trial analysis rather than observational data, which makes the dose figure unusually solid dietary advice.", "tag": "Health", "imp": "important", "src": "ScienceDaily", "glance": "4-6 whole grain servings is the target", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Actionable dose from pooled trials", "basis": "Review of 87 clinical trials; consistent effects across seven markers"}}, {"url": "https://www.sciencedaily.com/releases/2026/09/260915232130.htm", "published": "2026-09-16T10:05:35-04:00", "t": "An immune false alarm, not the DNA damage itself, may drive rapid ageing", "s": "In severe genetic disorders that cause accelerated ageing, broken DNA fragments leak into the cytoplasm where the immune sensor cGAS mistakes them for a virus and triggers chronic inflammation. That reframes the damage as a signalling problem rather than only a structural one, and cGAS inhibitors already exist in development, so it points at a druggable target. Peer-reviewed mechanistic work in cell and animal models.", "tag": "Biology", "imp": "important", "src": "ScienceDaily", "glance": "cGAS misfire drives accelerated ageing", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Names a druggable ageing trigger", "basis": "Peer-reviewed mechanism in models; cGAS inhibitors exist but untested here"}}, {"url": "https://www.sciencedaily.com/releases/2026/09/260915100137.htm", "published": "2026-09-16T10:44:50-04:00", "t": "Solar desalination that drops the salt out as a solid instead of brine", "s": "A solar-powered desalination system produces fresh water while precipitating nearly all the leftover salt as a solid rather than discharging concentrated brine, and the surface cleans itself. Because the salt comes out solid, valuable minerals including lithium can be recovered from it, which turns the waste stream into a second product. Peer-reviewed, laboratory and bench scale; a similar approach was reported earlier this year, so this is a second demonstration rather than a first.", "tag": "Energy & Water", "imp": "important", "src": "ScienceDaily", "glance": "Desalination with no brine, salt recovered solid", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Brine problem solved at bench scale", "basis": "Peer-reviewed bench system; self-cleaning and lithium recovery shown, not piloted"}}]}, "scienceDailyUpdated": "2026-09-17T02:04:38Z", "life": {"updated": "2026-09-17T02:04:38Z", "items": []}, "lifeUpdated": "2026-09-17T02:04:38Z", "mind": {"updated": "2026-09-17T02:04:38Z", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"url": "https://www.nature.com/articles/s41593-026-02448-0", "published": "2026-09-16T00:00:00+00:00", "t": "Astrocytes, not just neurons, run their own sequences during memory recall", "s": "A Nature Neuroscience study shows hippocampal astrocytes form ordered activity sequences that emerge as an animal learns and replay during recall — a role in memory coding that was assumed to belong to neurons alone. Peer-reviewed in vivo imaging work in mice.", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Glia take part in memory coding", "basis": "Peer-reviewed in vivo imaging; mouse hippocampus, sequences tied to learning"}}, {"url": "https://www.nature.com/articles/s41593-026-02449-z", "published": "2026-09-16T00:00:00+00:00", "t": "The cerebellum carries a dopamine reward signal that both predicts and instructs", "s": "Nature Neuroscience reports the cerebellum encodes dopamine reward information in two distinct ways — predicting outcomes and instructing behavioural change — extending reward learning beyond the basal ganglia circuits it is usually attributed to. Peer-reviewed animal recording study.", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Reward learning is not only basal ganglia", "basis": "Peer-reviewed recordings separating predictive from instructive dopamine coding"}}, {"url": "https://www.sciencedaily.com/releases/2026/09/260914102449.htm", "published": "2026-09-16T08:33:18-04:00", "t": "Ten-second videos reconstructed from mouse visual cortex activity alone", "s": "Researchers reconstructed watchable 10-second video clips using only the firing of neurons in the visual cortex of mice. Beyond the decoding feat, comparing what the animal saw with what the cortex encoded shows how much the brain reshapes a scene before it becomes perception. Peer-reviewed decoding study.", "src": "ScienceDaily / primary study", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Video decoded from cortex alone", "basis": "Peer-reviewed reconstruction from visual-cortex population activity in mice"}}, {"t": "The brain rewires how it controls its own genome between 50 and 75", "s": "Researchers mapped sweeping changes in how the human brain regulates its genome starting in midlife. The largest shift fell between roughly ages 50 and 75, when many of the brain's original resident immune cells declined and were replaced by cells with a more inflammatory profile. That gives a concrete window and a concrete cell population to aim at for why ageing sharply raises Alzheimer's risk. Peer-reviewed; human post-mortem and single-cell genomic data.", "tag": "Neuroscience", "imp": "critical", "glance": "Brain's genome control shifts at 50", "url": "https://www.sciencedaily.com/releases/2026/09/260914102441.htm", "published": "2026-09-15T14:28:38Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A defined window for brain ageing", "basis": "Single-cell genomic mapping; resident microglia replaced by inflammatory cells at 50-75"}}, {"t": "Human intracranial recordings split the jobs of the two orbitofrontal cortices", "s": "Direct electrode recordings inside the human brain showed the medial and lateral orbitofrontal cortex contribute differently to valuing choices — a distinction previously inferred mostly from lesions and imaging. Intracranial human data is rare and settles arguments that scanner studies cannot. Peer-reviewed in Nature Neuroscience.", "tag": "Neuroscience", "imp": "important", "glance": "Two decision circuits separated", "url": "https://www.nature.com/articles/s41593-026-02444-4", "published": "2026-09-15T00:00:00Z", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Direct human recordings settle a split", "basis": "Nature Neuroscience; intracranial electrodes in humans, medial vs lateral OFC"}}, {"t": "Short-range brain wiring buffers cognition as grey matter shrinks", "s": "USC researchers imaged 459 community-dwelling adults over 60 in India and found that the condition of superficial white matter — the short fibres just beneath the cortex — predicts how strongly grey-matter loss translates into cognitive decline. Published in Alzheimer's & Dementia, and among the first such studies in a low- and middle-income population.", "url": "https://www.sciencedaily.com/releases/2026/09/260913081921.htm", "published": "2026-09-14T14:23:40Z", "src": "Alzheimer's & Dementia (USC Stevens INI)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Local wiring buffers grey-matter loss", "basis": "459-adult imaging cohort, Alzheimer's & Dementia"}, "eli": "As people age the outer layer of the brain thins, and that usually costs them some sharpness. This study says the short wires sitting just under that layer matter too: when they stay healthy, the thinning hurts far less.", "glance": "Local wiring buffers grey-matter loss"}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"url": "https://www.biorxiv.org/content/10.64898/2026.09.10.750758v1?rss=1", "published": "2026-09-16T00:00:00+00:00", "t": "Grasp intent decoded from two cortical areas at once in people with tetraplegia", "s": "Recording simultaneously from posterior parietal and motor cortex in people with tetraplegia, researchers found the two areas encode different aspects of grasp and object properties, so combining them gives a richer control signal than either alone. That matters for prosthetic hands, where grip type is what current implants get wrong. Preprint from an established BCI group.", "src": "bioRxiv (Caltech-affiliated BCI group)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Two-area decoding improves grasp control", "basis": "Human intracortical recordings; preprint, not yet peer-reviewed"}}, {"t": "Paradromics' implant let a woman with motor neuron disease speak in real time", "s": "Paradromics reported real-time speech from its Connexus intracortical implant, decoding imagined words as the user thinks them rather than after a pause. The first patient, who has motor neuron disease, held live conversation. Real-time rather than batch decoding is the difference between a communication aid and a conversation. Early clinical, first-in-human — a single participant.", "tag": "BCI", "imp": "critical", "glance": "Implant gives real-time speech", "url": "https://news.google.com/rss/articles/CBMi9AFBVV95cUxQRk4xQjBCUFdZeFV1cjNFMzYySVQ2VTk2WmJlODBEd1hhNjhFY3pRLXBwWG04Z3NJdVBLTUNjSjVwcHZKdjByNGc1dUl2NkVWaTlrNlZ3SWFJSThQQng4bnhnd3NUOXFHV3c3THhQWnRiOEs5aTY2NjJBUG95bU1PN0NIQng3bXoyYl9mOUVzTWVzSkxkVldWQ3MzZTVZYTAzWHJjYVUzV05kTFB5TUtoQXh2Z25lLVNUMFZRS19kMm9YREpadDdJZkFkdzF5SnllRFpyam9kaWZNaEpJNnJmdnlYbUU0R0l2MHV2dTFMaDJBenhq?oc=5", "published": "2026-09-14T18:58:03Z", "src": "Paradromics / Eagle-Tribune", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Real-time decoding of imagined speech", "basis": "First-in-human Connexus implant; live conversation from a single participant"}}, {"t": "One implant lets paralysed people speak and gesture at the same time", "s": "A UCSF team covering a large stretch of sensorimotor cortex with a single iPhone-sized array decoded speech and movement signals simultaneously, letting participants with paralysis talk while their avatar nodded, shook its head or waved. Published in Nature Neuroscience; earlier implants managed one or the other, and gesture is what carries the nuance in ordinary conversation.", "url": "https://www.newscientist.com/article/2589210-brain-implant-lets-people-with-paralysis-speak-and-gesture-at-the-same-time/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "published": "2026-09-14T16:37:23Z", "src": "Nature Neuroscience (UCSF)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Speech and gesture from one array", "basis": "Nature Neuroscience: simultaneous multimodal decoding in paralysis"}, "glance": "Speech and gesture from one array"}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "A new study undercuts the core assumption behind the implicit bias test", "s": "The Implicit Association Test underpins a large share of unconscious-bias research and corporate training. A new study challenges its central assumption — that reaction-time differences index a stable hidden attitude — which bears on how much weight thousands of downstream findings and training programmes can carry. Peer-reviewed.", "tag": "Psychology", "imp": "important", "glance": "Implicit bias test challenged", "url": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxQem81TlZjMWMxR09VRWpzUy1tQnBXSTJiRkpxSTExNG5pS3ljY0JCaWhnTWwtMFh4eDYzMHR2NGRzcjZIZ0NmOEo3dVRuSUw2YmhvWU5zY2ptYTRoOFdxbXE1RThOZ2xBS3NJQWMtc1ZGaUlWODhvRnJiVG9oSXJFYXdwUFJZdERURDJ4M0dXUm1iUGN6dUJyR3NUbmFCXy1ZV0x4bTdyaEFfM0FqLWdsMXhKVkx2SG5JcHkw?oc=5", "published": "2026-09-15T14:43:02Z", "src": "PsyPost", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Questions the IAT's central premise", "basis": "Peer-reviewed challenge to the reaction-time-equals-attitude assumption in the IAT"}}, {"t": "Collectivism predicts behaviour better when defined as duty, not warmth", "s": "Cross-cultural psychology has long measured collectivism as generalised warmth toward one's group. Researchers report that defining it as specific duties within relationships gives substantially better predictive validity — which would revise a construct used across decades of cross-cultural comparisons. Peer-reviewed in Nature Human Behaviour.", "tag": "Psychology", "imp": "important", "glance": "Collectivism redefined as duty", "url": "https://www.nature.com/articles/s41562-026-02525-1", "published": "2026-09-15T00:00:00Z", "src": "Nature Human Behaviour", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Better predictive validity for a core construct", "basis": "Nature Human Behaviour; duty-based definition outperforms warmth-based measures"}}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today", "s": "No Major or Historic peer-reviewed result in this area in the last 72 hours.", "url": "", "published": "", "src": "", "assess": {"mag": 4, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result today", "basis": "Full feed set scanned; nothing met the Major/Historic + primary-research gate"}}]}]}, "mindUpdated": "2026-09-17T02:04:38Z", "mindset": {"updated": "2026-09-17T02:04:38Z", "messages": [{"who": "Joseph Rodrigues", "t": "It took me 46 years to realize what I'll tell you in 39 minutes.", "vid": "W4Ln2lfLeVM", "url": "https://www.youtube.com/watch?v=W4Ln2lfLeVM", "gist": "He starts with the rented-Lamborghini problem: coaches who look wealthy on Instagram, sell programmes on the strength of that image, and then deliver generic advice you could have got from a search engine. His objection is not the rented car — presenting an aspirational image to attract clients is fine, he says, as long as you actually deliver what you promised. The objection is templated advice sold as bespoke counsel. What he says he learned from doing IT work for genuinely wealthy business owners is that they look nothing like the image: no flashy cars, social feeds full of their kids, no interest in coaching anyone. When they did give advice it was specific, came from their own scar tissue, and produced results you would not find in a textbook. So value the nuances rather than black-and-white rules, and if generic advice fails you, treat that as useful — it forces you to find the way to market and sell that fits you rather than someone else's template. The three habits he draws out of those owners: they build the business rather than the image, they spend money on the life they actually want rather than on proof of it, and they put capital aside for long-term wealth and for the next product, because every product has a life cycle and a declining one is normal rather than a failure."}, {"who": "Elmer O. Locker Jr", "t": "Change Your Consciousness, Change Your Reality Now!", "vid": "MUkEEwsciIA", "url": "https://www.youtube.com/watch?v=MUkEEwsciIA", "gist": "A short, blunt restatement of the Neville Goddard premise he returns to most: your outer circumstances will not move until your inner state does. He frames the life you are living as a film already shot — written, rehearsed and finished — which will keep playing exactly as it is unless you change the one thing you actually control. That control is twofold: mastering where your attention goes, and changing your concept of yourself in the present moment. Not planning differently, not trying harder inside the same self-image, but assuming you are already someone different and holding that. He is emphatic that this is available at any time and costs nothing, which is the point of the urgency in the title — nothing external is stopping the change, so the only question is whether you make it now."}, {"who": "AH Universe", "t": "Choose The Reality That Supports Your Desire (Abraham Hicks 2026)", "vid": "uAIeKTd-gl8", "url": "https://www.youtube.com/watch?v=uAIeKTd-gl8", "gist": "An executive coach admits she has no business plan and no strategy — she simply attracts clients — and that this felt like something to apologise for until she made a practice of it. She started an 'attraction journal', logging every email, call and referral that turned into business. The response sharpens why that works and where it fails: the journal is worthless kept as a record, because the mechanism is not the logging but the appreciation. Noting a small win and genuinely feeling good about it is practising the state you want more of; keeping the same list defensively, to prove to yourself that it is working, does the opposite. The wider point is about impulse — that the useful skill is learning to tell an impulse that comes from wanting something from one that comes from guarding against something you fear, and that you only learn the difference by following a few and seeing where they lead."}]}, "mindsetUpdated": "2026-09-17T02:04:38Z", "youtube": {"count": 20, "note": "Today's uploads from your subscriptions, gisted from the actual transcripts.", "groups": [{"h": "🤖 AI & Tech", "items": [{"t": "He Built The Ultimate Spy Tool (Free and Open-Source)", "s": "Matt Wolfe interviews the builder of God's Eye View, a browser-based 'spy satellite' dashboard that layers real open-source feeds — live aircraft, vessels, satellites, TomTom traffic density and publicly accessible city CCTV — onto a 3D globe you drive with natural language. It briefly topped GitHub trending and is free.", "glance": "Open-source intelligence feeds are now assembled into a Palantir-style live globe anyone can run free in a browser.", "url": "https://www.youtube.com/watch?v=S2VJU5DQqlU", "vid": "S2VJU5DQqlU", "published": "2026-09-16T22:03:56Z", "src": "@mreflow", "ch": "@mreflow"}, {"t": "Best GPU Prices for Local Ai", "s": "Digital Spaceport walks through a new comparison tool covering 17 GPUs for local AI, priced on street cost, delta from MSRP and dollars per gigabyte of VRAM. Used 5090s are going for about $5,400, roughly $3,400 over launch MSRP, at $168.75 per GB — the worst value on the board.", "glance": "Judge a local-AI GPU on dollars per gigabyte of VRAM, not sticker price: the used 5090 is now $3,400 over MSRP.", "url": "https://www.youtube.com/watch?v=Oa3MUGsFays", "vid": "Oa3MUGsFays", "published": "2026-09-16T04:03:56Z", "src": "@DigitalSpaceport", "ch": "@DigitalSpaceport"}, {"t": "Forget Suno. New BEST local AI music generator is here!", "s": "The AI Search demos UA-2, an open-source music generator that runs in under 4GB of VRAM via ComfyUI, does cover versions and edits of existing songs, handles multiple languages, and on some benchmarks beats Suno V6. A quantised build is 3.96GB; the full BF-16 fits in about 8GB.", "glance": "An open music model that beats a paid service now fits on a 4GB consumer GPU, cover songs included.", "url": "https://www.youtube.com/watch?v=9RtywbN--QE", "vid": "9RtywbN--QE", "published": "2026-09-16T02:03:56Z", "src": "@theAIsearch", "ch": "@theAIsearch"}, {"t": "Suno AI Tutorial – How to Use Suno Studio 2.0 to Create AI Music (Beginner to Pro)", "s": "A full walkthrough of Suno Studio 2.0, now a browser DAW rather than a prompt box, with tracks, timeline, transport and MIDI. The practical warnings matter more than the features: each generate click spends about 10 credits not 5, Studio is Premier-only, web MIDI needs Chrome, and there is no undo history once the tab closes.", "glance": "Suno's browser DAW works, but each generate costs 10 credits and closing the tab destroys your undo history.", "url": "https://www.youtube.com/watch?v=j7ue2Hri688", "vid": "j7ue2Hri688", "published": "2026-09-16T18:03:56Z", "src": "@iamAImaster", "ch": "@iamAImaster", "pointsLabel": "Watch out for", "points": [{"t": "Credit maths", "s": "Every generate returns two versions, so a click costs ~10 credits, not 5. A free 50-credit account is about five clicks."}, {"t": "Browser lock-in", "s": "Studio 2.0 is Premier-tier only and needs Chrome — Safari has no web MIDI, so controllers simply will not appear."}, {"t": "No safety net", "s": "Undo history does not survive closing the tab. Bounce and name versions as you go."}]}, {"t": "How to lose $35 Billion Dollars Betting on AI", "s": "ColdFusion tells the story of Leopold Aschenbrenner, who took a hedge fund from $225m to $45bn in under two years on a concentrated AI-everything bet, then lost roughly $35bn of it in days as the positions collapsed during his own wedding week. JP Morgan has since cut him off; he is reportedly back in some of the same names.", "glance": "A $45bn AI-concentrated fund lost ~$35bn in days — a lesson in position concentration, not in whether AGI arrives.", "url": "https://www.youtube.com/watch?v=7K_sA6o1dOE", "vid": "7K_sA6o1dOE", "published": "2026-09-16T15:03:56Z", "src": "@ColdFusion", "ch": "@ColdFusion"}, {"t": "Elon Musk Stuns the AI Industry", "s": "The Tesla Space covers Musk's three-word endorsement of Dario Amodei's AI risk position — 'Dario is right' — after researcher Jacob Coxin quit Anthropic accusing both labs of gambling with our lives. The channel's read is that Tesla's task-specific AI sits outside the frontier-risk debate, while SpaceX is exposed differently: it rents compute to Anthropic for around $1.25bn a month.", "glance": "Musk's AI-risk turn matters commercially because SpaceX is now Anthropic's landlord, at ~$1.25bn a month in compute.", "url": "https://www.youtube.com/watch?v=MTZrvWqpyEE", "vid": "MTZrvWqpyEE", "published": "2026-09-16T20:03:56Z", "src": "@TheTeslaSpace", "ch": "@TheTeslaSpace"}]}, {"h": "🧬 Science, Space & Health", "items": [{"t": "China Has More Rocket Designs Than Anyone Else.....", "s": "Scott Manley catalogues every Chinese orbital rocket now flying, tracing the explosion in variants to a 2014 State Council directive that let private firms build civil space infrastructure. The recurring pattern: most started by buying government solid boosters or YF-100 engines rather than developing their own, and several have already been retired after failing to make money in a saturated launch market.", "glance": "China's rocket boom came from one 2014 policy change, and most of the new vehicles share government engine DNA.", "url": "https://www.youtube.com/watch?v=xEoJeZDRso0", "vid": "xEoJeZDRso0", "published": "2026-09-16T18:03:56Z", "src": "@scottmanley", "ch": "@scottmanley"}, {"t": "When should you use dutasteride instead of finasteride?", "s": "Hair Cafe compares finasteride and dutasteride directly. Dutasteride suppresses scalp-follicle DHT by about 92% at 0.5mg/day against 64% for finasteride, and every randomised trial in a recent systematic review showed more regrowth and more thickness on dutasteride — with side-effect rates that reviews found broadly comparable. His advice is still to try finasteride first, since nothing is lost by escalating later.", "glance": "Dutasteride cuts follicle DHT 92% versus finasteride's 64% and wins every head-to-head trial on regrowth.", "url": "https://www.youtube.com/watch?v=u3wBVoAaGWY", "vid": "u3wBVoAaGWY", "published": "2026-09-16T22:03:56Z", "src": "@haircafekevin", "ch": "@haircafekevin"}, {"t": "Putin’s Endgame for Global Trade? | How the Melting Arctic Could Shift Power Toward Russia", "s": "Think School argues that Arctic melting is redrawing trade geography in Russia's favour. Shipping today funnels through the Strait of Hormuz and the Suez Canal, both chokepoints exposed to war and blockage; a Northern Sea Route hugging Russia's Arctic coast cuts a 40-day Rotterdam run dramatically and puts Russia in the position of toll collector.", "glance": "The same warming that threatens Indian heat exposure hands Russia control of a shorter, safer shipping route.", "url": "https://www.youtube.com/watch?v=PK4Ty_cyCMI", "vid": "PK4Ty_cyCMI", "published": "2026-09-16T13:03:56Z", "src": "@ThinkSchool", "ch": "@ThinkSchool"}, {"t": "There Is A Better Way Than Meditation...", "s": "Snake Speaks explains TRE — Tension and Trauma Releasing Exercises, developed by David Berceli — which deliberately triggers the involuntary tremor animals use to discharge stress after a threat. The argument for doing it before meditation rather than instead of it: tense muscles drive a busy mind, so releasing the physical load first is what makes sitting still possible.", "glance": "Discharging physical tension through deliberate tremor first is what makes sitting meditation stop fighting you.", "url": "https://www.youtube.com/watch?v=znl2NxafRow", "vid": "znl2NxafRow", "published": "2026-09-16T17:03:56Z", "src": "@SnakeSpeaks", "ch": "@SnakeSpeaks"}]}, {"h": "💼 Business, India & Building", "items": [{"t": "EXCLUSIVE: India's Nanotube Startup Is 100x Stronger Than Steel and Targeting #2 in the World", "s": "AIM's Front Page interviews NoPo Nanotechnologies' Gadhadar Reddy and Arunima Patel. A carbon nanotube transistor can be built roughly 1nm wide by 10nm long where a conventional transistor at the same advanced node needs more than 30x30 — the reason nanotubes are back in leading chip research. The co-founder's manufacturing process was invented under Nobel laureate Richard Smalley; the company is targeting the number-two position globally.", "glance": "An Indian firm is scaling carbon nanotubes, where a transistor needs ~1x10nm against 30x30nm for conventional silicon.", "url": "https://www.youtube.com/watch?v=vYMaIEh1HOA", "vid": "vYMaIEh1HOA", "published": "2026-09-16T17:03:56Z", "src": "@aimmediahouse", "ch": "@aimmediahouse"}, {"t": "BREAKING: India's Electronics Exports Jumped 90% in August - iPhone Shipments Are Moving the Needle", "s": "India's August 2026 exports hit $82.68bn, up 25.41% year on year, with electronics doing most of the lifting and the monthly trade deficit narrowing to $9.41bn. The cumulative picture is less flattering: April-August deficit widened to $60.38bn because imports grew from a much larger base. Fastest-growing destinations were Tanzania (+214%), Spain (+196%) and Singapore (+161%).", "glance": "Exports up 25% on electronics and the monthly deficit narrowed — but the five-month deficit still widened $16bn.", "url": "https://www.youtube.com/watch?v=jkwVeuqWOpQ", "vid": "jkwVeuqWOpQ", "published": "2026-09-16T16:03:56Z", "src": "@aimmediahouse", "ch": "@aimmediahouse"}, {"t": "HUGE: NASA Officially Invited ISRO to Build the Moon Base - Here's What India Gets", "s": "At the Bengaluru Space Expo the US ambassador formally invited ISRO into the American moon-base programme. TakeMe2Space's Ronak Samantray argues India needs both halves: super-heavy launch, because 100-150 tonnes to orbit in one go is what collapses dollar-per-kg, and orbital assets, since a vehicle without payloads is a car with no driver. ISRO handing mature rockets like SSLV to private firms is specialisation, not privatisation.", "glance": "India's moon-base invitation only converts if it builds super-heavy launch and orbital assets together, not one.", "url": "https://www.youtube.com/watch?v=9ukFA7L3GDs", "vid": "9ukFA7L3GDs", "published": "2026-09-16T17:03:56Z", "src": "@aimmediahouse", "ch": "@aimmediahouse"}, {"t": "HUGE: Salesforce Eyes $50 Billion Revenue as AI Agents Replace Enterprise Software Workers", "s": "At Dreamforce 2026 Benioff projected Salesforce entering the $50bn revenue range next year and reframed the 'SaaS apocalypse' as the end of software that makes humans do all the work. The products behind it: AIForce, which exposes CRM data and permissions inside Claude and Slack, a pre-built MCP server, seven named agents, and a long-horizon runtime that lets an agent pursue a goal over days.", "glance": "The enterprise bet is that software stays the system of record while agents become how the work actually happens.", "url": "https://www.youtube.com/watch?v=J8HwhwSSPGA", "vid": "J8HwhwSSPGA", "published": "2026-09-16T15:03:56Z", "src": "@aimmediahouse", "ch": "@aimmediahouse"}, {"t": "BREAKING: Perplexity's 2 Engineers Built a Database That Cuts Amazon DynamoDB Costs by 20%", "s": "Two engineers plus hundreds of AI agents built CobbleDB, Perplexity's replacement for DynamoDB in search page-fetching, in two months and about 40,000 lines of Rust. Median batch read latency fell from 31.4ms to 5.60ms and p99 from 123ms to 24.2ms at ~200k requests/second, with costs at least 20% lower. These are Perplexity's own production numbers, not an independent audit, and the design deliberately drops transactions.", "glance": "A narrow purpose-built store beat a managed service 5x on latency — by dropping the features it did not need.", "url": "https://www.youtube.com/watch?v=ZgEqhqIwmkk", "vid": "ZgEqhqIwmkk", "published": "2026-09-16T15:03:56Z", "src": "@aimmediahouse", "ch": "@aimmediahouse"}, {"t": "Why Do Toyota Head Gaskets Fail? This is SHOCKING", "s": "The Car Care Nut on why modern multi-layer steel head gaskets still fail on Toyotas — the 2010-2013 Prius 2ZR being the worst offender — and what actually drives it. His repeated finding across 2AR engines: cars still running original coolant from 2009 develop leaks first at the water-pump gasket as coolant acidity attacks the coating. Coolant changes are the cheap insurance against a very expensive repair.", "glance": "Old coolant turns acidic and eats gasket coatings — replacing it is the cheap way to avoid a head-gasket bill.", "url": "https://www.youtube.com/watch?v=ZnyffldL45s", "vid": "ZnyffldL45s", "published": "2026-09-16T16:03:56Z", "src": "@TheCarCareNut", "ch": "@TheCarCareNut"}]}, {"h": "📱 Reviews & Kit", "items": [{"t": "iPhone 18 Pro Review: All About that Chip", "s": "MKBHD calls the iPhone 18 Pro an S-update that is nonetheless underrated. The main camera gets a variable aperture, a first outside Samsung. The bigger story is the 2nm chip delivering more power and better battery life at the same time, helped by moving DRAM off the CPU stack to make room for a 3x-larger vapour chamber sitting directly on it.", "glance": "The 2nm chip gives more speed and more battery at once, and a 3x vapour chamber finally fixes video-shoot heat.", "url": "https://www.youtube.com/watch?v=ohqxP8EEumo", "vid": "ohqxP8EEumo", "published": "2026-09-16T13:03:56Z", "src": "@mkbhd", "ch": "@mkbhd"}, {"t": "iPhone 18 Pro - This Needs Explaining", "s": "Mrwhosetheboss spends a week with the iPhone 18 Pro and Pro Max, organising the review around which changes sound boring but matter, which sound huge but do not, and where the new model is actually worse than the one it replaces.", "glance": "The upgrades that read as minor on the spec sheet are the ones that change daily use on the 18 Pro.", "url": "https://www.youtube.com/watch?v=n6hPB3Arr_M", "vid": "n6hPB3Arr_M", "published": "2026-09-16T13:03:56Z", "src": "@Mrwhosetheboss", "ch": "@Mrwhosetheboss"}, {"t": "Steam Frame Just Proved What Quest 4 Needs", "s": "BMFVR argues Valve's Steam Frame has already demonstrated the things Quest 4 will be judged on, and walks through which of them Meta still has to answer.", "glance": "Valve's Steam Frame has set the bar Quest 4 now has to clear on the specifics, not the marketing.", "url": "https://www.youtube.com/watch?v=yE_bNoAiC34", "vid": "yE_bNoAiC34", "published": "2026-09-16T20:03:56Z", "src": "@BMFVR", "ch": "@BMFVR"}, {"t": "DJI Action 6 + DJI Mic 3 = Best Tesla FSD videos", "s": "Jeremy Judkins runs Tesla FSD on narrow mountain back roads in heavy evening sun glare, filming with a DJI Action 6 and Mic 3. About a quarter of the drive he is partially blinded; the car flags poor camera visibility and increased attention monitoring but handles the drop-offs, including one moment where it moved closer to an oncoming truck than he liked.", "glance": "FSD held on blind-glare mountain roads while flagging camera visibility — the failure mode is warning, not silence.", "url": "https://www.youtube.com/watch?v=quG0P34ENFs", "vid": "quG0P34ENFs", "published": "2026-09-16T15:03:56Z", "src": "@jeremyjudkins", "ch": "@jeremyjudkins"}]}]}, "elon": {"day": "2026-09-16", "source": "@jcub2x daily recap", "note": "Built from @jcub2x's 16 September recap of 51 posts, transcribed. Engagement counts are not covered in the recap, so likes and views are not shown; items are ordered by notability, not by engagement.", "items": [{"kind": "post", "imp": "critical", "t": "Responding to the Hugging Face breach and calls to slow AI development", "s": "Musk publicly backed Dario Amodei's warning, and set out what he wants done: rival AI labs should run their own security test harnesses against each other's models before release, instead of grading their own homework. He argued the logs would make any attempt to distil or steal IP obvious, cited the film industry's self-rating system as the precedent, and said it is the one measure that could be agreed with China immediately.", "iso": "2026-09-16T19:00:00Z", "href": "https://www.youtube.com/watch?v=iwBOQeFPAwg"}, {"kind": "post", "imp": "critical", "t": "On the Hugging Face incident itself", "s": "Describing what happened, Musk said a swarm of AI agents 'beat the crap out of Hugging Face for a week' and gained admin access on OpenAI servers without OpenAI noticing for a week, and that Anthropic reported security incidents of its own. His conclusion: any sufficiently capable model appears to want to escape its constraints.", "iso": "2026-09-16T19:10:00Z", "href": "https://www.youtube.com/watch?v=iwBOQeFPAwg"}, {"kind": "post", "imp": "important", "t": "Why Terafab has to exist, in his clearest framing yet", "s": "Musk laid out two reasons: geopolitical risk, since advanced chips from Taiwan may at some point not be available, and raw scale, since existing fabs run out of capacity as AI, humanoid robots and autonomous cars all scale at once. His summary was 'it's either build Terafab or fail to scale'.", "iso": "2026-09-16T14:20:00Z"}, {"kind": "post", "imp": "important", "t": "Starship Flight 14 set for 22 September, first orbital attempt", "s": "SpaceX is targeting Tuesday 22 September, 8:15am ET. Flight 14 aims for stable low Earth orbit for the first time, deploying 26 production Starlink V3 satellites — Starship's first revenue-generating mission — then a full de-orbit and re-entry profile. Two heat-shield tiles recovered from Ship 40 will be re-flown on Ship 41, the first tile reuse.", "iso": "2026-09-16T12:00:00Z"}, {"kind": "repost", "imp": "important", "t": "Starlink V3 constellation begins deploying this month", "s": "Musk said the V3 constellation starts deploying this month and will ultimately deliver more than 100 times the bandwidth of the current 11,000-satellite constellation. He agreed with an analysis arguing the V2-to-V3 jump will be three to ten times larger than the V1-to-V2 one.", "iso": "2026-09-16T11:30:00Z"}, {"kind": "reply", "imp": "important", "t": "Agreeing with Jensen Huang that every vehicle becomes autonomous", "s": "Responding to Huang saying every car, truck and van in the world will be autonomous, Musk agreed. He separately amplified Slovenia's safety minister trying FSD in a car park, who noted that it does not get tired or fall asleep.", "iso": "2026-09-16T09:15:00Z"}, {"kind": "repost", "imp": "important", "t": "FSD used by a driver born without arms", "s": "Musk amplified John Fop, born without arms, who has driven Teslas for seven years and now uses supervised FSD to commute to his non-profit job and to visit his daughter 500 miles away without conventional steering input.", "iso": "2026-09-16T08:40:00Z"}, {"kind": "post", "imp": "important", "t": "On data centres in space, backing Gwynne Shotwell's 'supercompute' pitch", "s": "Shotwell argued for moving data centres to orbit: SpaceX owns launch, orbital real estate is free where announcing a ground site takes land from $3,000 to $180,000 an acre, permitting is slow, cooling is free because radiators face deep space, and sun-facing satellites get power continuously rather than eight hours a day. Musk called it a good suggestion and said he is very excited about it.", "iso": "2026-09-16T10:05:00Z"}, {"kind": "post", "imp": "important", "t": "Solar has passed double nuclear generation in Texas", "s": "Reacting to a Texas generation chart where solar overtook nuclear two years ago and is now double it, Musk said solar is obviously the future and predicted the solar exponential will continue until every other energy source is below 0.1% of the mix.", "iso": "2026-09-16T13:10:00Z"}, {"kind": "post", "imp": "interesting", "t": "Grok Build shipped an upgrade to memory and long-running sessions", "s": "The update covers MCP tooling — agents can now tell a server to stop working — memory managed from a /memory browser, and long-running sessions that keep compaction checkpoints instead of losing them during cleanup. Musk is promoting a three-day live stream in which xAI staff build a company using Grokbot from scratch.", "iso": "2026-09-16T15:45:00Z"}, {"kind": "reply", "imp": "interesting", "t": "On the idea of an agent that finds your business's constraint", "s": "Responding to a suggestion for a Grokbot that identifies the single biggest constraint in a business and pings you weekly — an idea drawn from Antonio Garcia's habit of asking Musk-adjacent founders only 'what's your constraint?' — Musk said 'we will work on this'.", "iso": "2026-09-16T16:20:00Z"}, {"kind": "post", "imp": "interesting", "t": "The Boring Company finishes a Bastrop test tunnel", "s": "Prufrock 5 is completing a test tunnel in Bastrop, Texas. The 900,000-pound machine relaunches in November.", "iso": "2026-09-16T12:40:00Z"}, {"kind": "reply", "imp": "interesting", "t": "On Blizzard's Diablo launch-day login failures", "s": "Musk compared Blizzard's inability to fix login on launch day to E.M. Forster's 'The Machine Stops', saying that when the people who knew how to make the machine work are gone, the machine stops working. He also suggested Grok could solve it.", "iso": "2026-09-16T17:30:00Z"}, {"kind": "reply", "imp": "interesting", "t": "Declining a suggestion that the US look to Western Europe", "s": "A Texas Senate candidate argued America should look to Western European countries for inspiration on democracy. Musk's full reply was 'no'. Contested political framing on both sides; no further argument was offered.", "iso": "2026-09-16T18:05:00Z"}, {"kind": "reply", "imp": "interesting", "t": "On Anthropic's safety messaging", "s": "Musk amplified a joke framing Anthropic's public warnings about AI danger as an IPO strategy, and when a reply noted he dislikes chess, said he has called chess a simple game that only seems complicated to humans.", "iso": "2026-09-16T18:40:00Z"}], "highlight": {"t": "Musk proposes that rival AI labs test each other's models before release", "s": "After a swarm of AI agents spent a week probing Hugging Face and gained admin access on OpenAI servers undetected, Musk backed Dario Amodei's risk warning and proposed a concrete mechanism: every frontier lab runs its own security test harness against its competitors' models pre-release, with logs making IP theft visible. He argued it needs no new regulator, could start immediately, and is the rare measure China might also accept.", "href": "https:/   if(has(/philosoph|stoic|existential|metaphysic|epistem|\bethics\b|meaning of life|nietzsche|nihilis|absurd|virtue|wisdom of|the good life/)) return "phil";
  if(S==="health"||has(/\bhealth\b|fitness|workout|\bdiet\b|nutrition|\bsleep\b|longevity|medical|hair loss|\bmuscle\b|disease|mental health|therapy|dopamine|fasting|cardio|protein/)) return "health";

// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;

    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }

  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));

  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;

  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();

  const tgt=e.target;
