6UmJDaHkwejdtX0dhbjQ3RUhhekpveU9fNGxrWkR6RHRQRFJteU15MFNPUFFPdlY5NHVCNHkzYW13dmdUVUU2WnNLMUVLeFpQcjllRjB0bkE?oc=5","published":"2026-08-28T13:09:32Z","src":"NDTV Profit"},{"t":"Musk reapplies for a Starlink licence in India","s":"Musk has filed a fresh application to operate Starlink in India, pitching rural broadband coverage, after earlier attempts stalled on spectrum and security clearances.","url":"https://news.google.com/rss/articles/CBMilwFBVV95cUxNVUhQbXBCbjZ6dVBHME5jR2RNVFRERFpmeExjalB3NEhZcUhTUVE0SGRCdE11UkJCMUF4YnczTHFHMWdjalFlZ29ELXpkSG45cDNzaTNPSXlTQmg5TG50bnJ2UzVHWmNoWE5ldjF3a3JIdHVsMWd4VGUyb3J1b1gxbFhNSV9RRElYLWJvYnBWY2oxSTY1dVVN?oc=5","published":"2026-08-28T21:23:42Z","src":"IndiaWest"},{"t":"X loses its First Amendment challenge to New York's Stop Hiding Hate Act","s":"A court rejected X's constitutional challenge to New York's law requiring social platforms to disclose their hate-speech moderation policies.","url":"https://news.google.com/rss/articles/CBMirgFBVV95cUxPSVV3V0VtamdoLTZMQmpZSWFETVFveGdTT1lkS0xTQnE0dUhKVmhLQ1F0b001cHlTaVJVTjlvNDljS2praTZtS2MwLThQNDdBNWprdzNpeTZtcmltQUZFXzk2RjEtMnphcTNlZ1oycmFwblQzR0xqTzR2Z25xc0t4dk9BTlM4OGk0TnFGQ3lQZUlpVl9EUzRjNGRFaDhQdGxhZkw3S0FNaDNUVkdWY2c?oc=5","published":"2026-08-28T17:54:13Z","src":"Reason"},{"t":"Musk's super PAC starts spending on the US midterms online","s":"Musk's political action committee has begun buying online advertising for the midterm elections, his first significant spending of the cycle.","url":"https://news.google.com/rss/articles/CBMitgFBVV95cUxPRHhlbllJdmFUdnI4UWtqWF81LU9fVXVfbEgyUktNSGRGVGpfMU5va1JGeTlEQVN1aW1lTkVlQ1BwZ1hScmJIbDdGR3ZJcXF5Tk9MSkFSWWd4OWJIWl9OQmpXRzcwcV9CNlE1cFFGaDFKTDJtOE95WE1ucFZkNEF3cnFDcHgwaHE4QXJycnJUOTBBSkpfaU00MGpaYzg3ODA4UXJkRXRNTG9RM204ZUVRZTN1cDV5UQ?oc=5","published":"2026-08-28T16:15:48Z","src":"NBC News"},{"t":"SpaceX recovers a Starship from the Indian Ocean a month after launch","s":"SpaceX has retrieved a Starship vehicle from the Indian Ocean roughly a month after its flight and is shipping it back to Texas for inspection.","url":"https://news.google.com/rss/articles/CBMimgFBVV95cUxNUndQeENvZlB3MUxVYk12Skx2UEJ0UkV2TzM5b1E3ZUJzZEU0Qm9PdkNWUXZkTzBYczN5TVRxWGtSWV9YUHBPTks2YVBMdkdYWjQ2aFRuMDZKenlSaDBBYldxTnlYT29JUTFQdDRHVVkxTjdjNUpJLWl6empKRV9YT0NDdU11NFBVVjZBZ3lrRFZHbWt5cDFjYm1B?oc=5","published":"2026-08-28T20:59:00Z","src":"The Independent"},{"t":"X says China used the platform to turn Americans against AI data centres","s":"X published an analysis claiming Chinese-linked accounts amplified opposition to US AI data centre projects; the company did not release underlying data for independent verification.","url":"https://news.google.com/rss/articles/CBMijgFBVV95cUxPTzF3UjN0aFh0ZndGWlRlU0dIcVprYTM3OUZBRXlYY0g2Rk5TLVliYnFjNkwzMzlnV2x5Tl9kZ3F2N3JVQ0tHaXpiQVZPX0JYcDl4WjlWN1d3Wl9seF94ZW80QjRiNDBFTEZpSGlTVHo2YjRxMTNmQnY0ZUJMMDR6Qnc1Y0pYb1lQYXd5VHVn?oc=5","published":"2026-08-28T15:49:39Z","src":"Business Insider"}],"elonNewsUpdated":"2026-08-29T02:30:30Z","mind":{"updated":"2026-08-29T02:30:30Z","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"The brain circuit that controls hibernation is finally identified","s":"Working in hamsters, researchers pinned down the neural circuit that governs entry into hibernation - a target sought for decades. The interest is whether the same circuit can be engaged in mammals that do not hibernate naturally, which would matter for trauma medicine and long-duration spaceflight. Peer-reviewed, reported in Science. Animal study.","url":"https://www.science.org/content/article/key-brain-circuit-regulating-hibernation-found-last","published":"2026-08-27T02:20:00Z","src":"Science (AAAS)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Hibernation's master switch located","basis":"Hamster circuit mapped; suggests inducing torpor in non-hibernators"},"eli":"Hibernation is not just deep sleep - it is a controlled shutdown. Finding the switch raises the possibility of triggering it deliberately."},{"t":"Exercise appears to grow new neurons by making astrocytes contract","s":"A mouse study reports a mechanism linking physical activity to new neuron formation: exercise causes astrocytes, a support cell in the brain, to contract, and that mechanical change triggers neurogenesis. It offers a physical explanation for a link observed for years without a mechanism. Animal study.","url":"https://www.newscientist.com/article/2586505-exercise-may-create-new-neurons-by-making-other-brain-cells-contract/","published":"2026-08-27T11:50:00Z","src":"New Scientist","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"A mechanical route to new neurons","basis":"Mouse study links astrocyte contraction to neurogenesis"},"eli":"Exercise squeezes the brain's support cells, and that physical squeeze seems to be part of what tells the brain to build new neurons."},{"t":"A brain 'brake' circuit can switch off chronic nerve pain","s":"Researchers identified a brain-based inhibitory circuit that shuts down chronic nerve pain in mice by calming an overactive pain pathway. Because it works without engaging opioid receptors body-wide, targeting it could in principle give strong pain relief without opioid dependence or respiratory risk. Animal study; no human data yet.","url":"https://www.sciencedaily.com/releases/2026/08/260826055442.htm","published":"2026-08-27T04:46:20Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"A non-opioid target for chronic pain","basis":"Mouse nerve-injury model; circuit-level causal manipulation, preclinical only"},"eli":"The brain has its own brake pedal for pain. Pressing it in mice turned chronic pain off without using opioids."},{"t":"Sleep's noradrenaline rhythm ties heart rate to memory consolidation","s":"An eLife paper shows that very-slow (~0.02 Hz) noradrenaline bouts from the locus coeruleus during NREM sleep are tightly phase-locked to heart-rate fluctuations, identifying the locus coeruleus as the driver of very-low-frequency heart-rate variability. That makes a cheap heart-rate signal a candidate readout of the brain state that gates sleep spindles and memory consolidation. Peer-reviewed.","url":"https://elifesciences.org/articles/110252","published":"2026-08-28T00:00:00Z","src":"eLife","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Heartbeat as a window on sleeping brain state","basis":"Peer-reviewed eLife; LC noradrenaline rhythm phase-locked to VLF heart-rate variability"},"eli":"During deep sleep the brain releases noradrenaline in slow waves that also move your heart rate - so a wrist heart-rate trace may reveal when your brain is filing memories."},{"t":"Childhood trauma leaves a lasting mark inside brain cells","s":"Researchers traced a durable molecular signature of early-life adversity inside neurons themselves, not just in behaviour or hormone levels - a mechanism linking childhood trauma to adult mental-health risk decades later.","url":"https://www.sciencedaily.com/releases/2026/08/260823094151.htm","published":"2026-08-26T07:28:27Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"A cellular record of early adversity","basis":"Peer-reviewed molecular neuroscience with human post-mortem and animal data"},"eli":"Early trauma appears to leave a chemical bookmark inside brain cells that is still readable decades later."},{"t":"Dendrite shape itself does much of the brain's learning","s":"A computational neuroscience paper argues that the branching structure of dendrites provides learning capacity previously credited to synaptic weight changes alone - with direct implications for neuromorphic hardware design. arXiv preprint, not yet peer-reviewed.","url":"https://arxiv.org/abs/2608.23251","published":"2026-08-26T04:00:00Z","src":"arXiv q-bio.NC","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Learning lives in the wiring shape","basis":"arXiv q-bio.NC preprint; theoretical with simulation support, not peer-reviewed"},"eli":"The tree-like shape of a neuron may itself store part of what the brain learns, not only the strength of its connections."}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"Paradromics gets FDA clearance to run its BCI software on personal devices","s":"The FDA cleared Paradromics to embed its brain-computer interface software in ordinary consumer devices, meaning an implanted user can drive a personal phone or computer directly rather than a dedicated clinical rig. It moves high-bandwidth BCI from the lab bench toward daily use.","url":"https://news.google.com/rss/articles/CBMi9AFBVV95cUxNcEgyNUotUzZmZlhoZ01XX0NQTUhtLXl5eHZfN2RmQzk4b2djdUp2MHVpeGswYjMwNEEwVXgwaEdJMHRRYXVVY0hENFo5ZlRkSGpPMVVkZnF0RXY4YXlBLTBBWDVDZDduSG1iYzRDR3A3ZVd6TmNWM3pPRDR5MENUaV9teldXSnd5ZmNXdldHcExxYXVEUmt1ZWctUy0ydEwzUXNSa3Z0aHlCdEVuTktNS25UeExnU21NN2Z4QjdYTGVLOTllOXVCVWJCMUZaMzdRYWU2Q0ZpQXBZWWN4SVJONmM5eXZaeUtkUnZNX2tTTVQxcWZP?oc=5","published":"2026-08-26T04:56:57Z","src":"Citeline","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"proven","verdict":"Implants meet consumer hardware","basis":"FDA regulatory clearance in the Connect-One clinical study; deployment scale still small"},"eli":"Someone with the implant can now use their own laptop or phone instead of special hospital equipment."},{"t":"China sets national BCI standards as its startups challenge Neuralink","s":"China published national brain-computer interface standards while domestic firms raised large rounds - one, Gestala, took $84 million. Standards-setting this early usually shapes which architectures become commercially viable, and Chinese regulators have signalled they want BCI hardware integrated with AI systems.","url":"https://news.google.com/rss/articles/CBMi0wFBVV95cUxQaklick82Q1VMbk04Wk9PVHgyaGFua1pQSWJUbVFRQ0U0dzN4Y1VmSHRHajhJZTlWSVpJZHNiMkQ3eWNPZ2dBYjBkYzVwMTlKX1B4OW1sUDFjdVhqaGNQRzJiZ0N3MVZRX0ZNQmxPZE5pS0RGRjg2XzA0ZGZFVlQ1MGFMRHVrVjFCY1g3SmVxcVRvd0FLWWpPd2x4NlJ6S1F4U2ROTnVRS01FODlFcDk4MG40MTZtMV9qcWh0S21wLUxjc1pSal91RHlwWE5VSXdjLVQ00gHTAUFVX3lxTE9fUmlIMXdTRmRYOG83OF9USFZDQ2RNM0VWQjlqeGZEZE9nV1Z5TmJSN0ZWRjJVSmFXYkdDa21rXzNqNFh5VG1jTG5OMlBkZTRNaTRQcDl4N3JhMENnaVBFMnk2TTAzSUlYMUhpT1pHUmxOenlHQjFZajZUemwxWDIxSUE4SGRIbDFCcXZrTE9sRi1XbnBkTkFDSk9HU0tkcUU1a3NGV1J4WERMRzh1YWhUS1RKTUlDMHBOSWNuSTNEeUt3VDRrTUVZbEFub2NVQTJ3am8?oc=5","published":"2026-08-26T08:00:08Z","src":"South China Morning Post","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Standards arrive before the products","basis":"Government standards publication plus confirmed funding rounds"},"eli":"China is writing the rulebook for brain implants before the products are on shelves, which tends to decide whose designs win."}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"Twenty-year study of 400,000 children finds a lasting pre-K advantage","s":"Following roughly 400,000 students for two decades, researchers found that children who attended public pre-K earned better grades and test scores right through high school compared with other childcare settings, with better-trained teachers and earlier exposure to structured classrooms the likely explanation. Observational, not randomised, but the scale and follow-up are unusual for early-education research.","url":"https://www.sciencedaily.com/releases/2026/08/260828005213.htm","published":"2026-08-28T12:14:20Z","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Pre-K effects survive 20 years","basis":"n≈400,000, 20-year longitudinal follow-up; observational design"},"eli":"Kids who went to public pre-K were still doing better in high school 20 years later."},{"t":"Five-wave panel finds almost no link between social tech use and life satisfaction","s":"A five-wave panel study of US adults in Nature Human Behaviour tracked self-reported use of ten common social technologies against life satisfaction and found only scant evidence that use predicts later satisfaction in either direction. Peer-reviewed and longitudinal, it undercuts both the strong-harm and strong-benefit readings that dominate the screen-time debate.","url":"https://www.nature.com/articles/s41562-026-02564-8","published":"2026-08-28T00:00:00Z","src":"Nature Human Behaviour","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Social tech barely moves life satisfaction","basis":"Peer-reviewed five-wave panel of US adults, ten technologies"},"eli":"Tracked over five rounds, how much people used social apps barely predicted how satisfied with life they felt afterwards."},{"t":"Primate vision points at what makes AI vision brittle","s":"Comparing primate visual processing with current models identifies a specific principle - dynamic, predictive processing over time - that today's vision systems lack, and which accounts for much of their failure on moving, cluttered scenes. arXiv preprint with comparative modelling, not peer-reviewed.","url":"https://arxiv.org/abs/2608.23790","published":"2026-08-26T04:00:00Z","src":"arXiv q-bio.NC","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"A named gap in machine vision","basis":"arXiv q-bio.NC preprint with comparative modelling; not peer-reviewed"},"eli":"Monkey brains keep predicting what a scene will look like a moment from now. Machine vision does not, and that is where it breaks."},{"t":"Decades of financial hardship track with later-life brain shrinkage","s":"A decades-long British cohort study reports that persistent economic strain across adulthood is associated with lower midlife cognitive scores and greater brain atrophy in later life. Observational, so it cannot prove that hardship causes the shrinkage, but the length of follow-up makes reverse causation harder to explain away.","url":"https://www.psypost.org/persistent-financial-hardship-is-linked-to-later-life-brain-shrinkage/","published":"2026-08-27T12:00:52Z","src":"PsyPost","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Poverty's long shadow on the brain","basis":"Decades-long British adult cohort; observational, association not causation"},"eli":"People who struggled financially for most of their adult lives had somewhat smaller brains and weaker thinking scores later on."}]},{"h":"🌌 Consciousness Studies","items":[{"t":"The brain learns how much control it actually has","s":"Nature Reviews Neuroscience reports work showing that dorsomedial prefrontal cortex tracks decision confidence to estimate how controllable an environment is, and detects changes in controllability through its interactions with the dorsal raphe nucleus. That gives a concrete neural implementation for the sense of agency - the feeling that your actions cause outcomes - which sits at the centre of consciousness and free-will debates. Peer-reviewed journal coverage of primary work.","url":"https://www.nature.com/articles/s41583-026-01076-8","published":"2026-08-27T00:00:00Z","src":"Nature Reviews Neuroscience","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Agency gets a neural address","basis":"Nature Rev Neuroscience on dmPFC confidence tracking and dorsal raphe interaction"},"eli":"Your brain quietly keeps score of whether your choices are actually changing anything, and one prefrontal region seems to hold that score."},{"t":"Heartbeats shape how the stream of thought moves","s":"In 40 adults performing an attention task with thought probes, sounds timed 200 ms after each heartbeat changed the transition patterns of self-related spontaneous thought compared with sounds timed independently of the heart. It is direct evidence that interoceptive bodily signals below awareness help organise the moment-to-moment stream of consciousness. bioRxiv preprint, n=40, not yet peer-reviewed.","url":"https://www.biorxiv.org/content/10.64898/2026.08.25.747022v1","published":"2026-08-28T00:00:00Z","src":"bioRxiv (preprint)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"The body steers the inner monologue","basis":"bioRxiv preprint, n=40, cardiac-locked auditory probes; awaiting peer review"},"eli":"Where your mind wanders next depends partly on when your heart beats - a signal you never consciously notice."}]}]},"mindUpdated":"2026-08-29T02:30:30Z","mindset":{"updated":"2026-08-29T02:30:30Z","messages":[{"who":"Joseph Rodrigues","t":"How I Brainwashed Myself to Be a Millionaire","vid":"N4CPebx4wDg","url":"https://www.youtube.com/watch?v=N4CPebx4wDg","gist":"Working through Brian Tracy's 21 principles of self-made wealth, his emphasis falls on two: imagining yourself as already being the person who has what you want rather than straining toward it, and treating your working method as a set of habits you run on autopilot. The operational core is optimise, automate, delegate, eliminate — you are not meant to do it all yourself, and partners, agencies and a better business model are legitimate answers. On execution he is blunt: take the task, stay fully committed until it is complete, then move to the next one. Breaks are fine, half-finished work is not. And he pushes back on perfectionism — you get better by applying the thing repeatedly, not by waiting to apply it well."},{"who":"Elmer O. Locker Jr","t":"Stop Waiting, Start Living — Your Simulation Reality Revealed","vid":"3zJF0T8qTNk","url":"https://www.youtube.com/watch?v=3zJF0T8qTNk","gist":"A very short piece, and the whole of it is one instruction. He asks you to treat what you are living inside as a high-tech simulated game — something closer to a movie you are in than a verdict being passed on you — and the point of that framing is permission: if it is a game, then waiting, fearing and running anxiety about it are simply the wrong way to play. What he wants is not analysis but a decision made immediately. Set the intention now, while the thought is still live, or first thing on waking tomorrow, and then step outside and actually live inside it rather than rehearsing it."},{"who":"Abraham Hicks","t":"You Already Know The Next Move Deep Down!","vid":"i7ISOy72hN0","url":"https://www.youtube.com/watch?v=i7ISOy72hN0","gist":"The distinction drawn here is between an intention and an intended outcome. Your intention is the essence of how you want to feel — freedom, power — and holding that while staying unattached to the specifics is what lets the impulse of which way to go actually arrive. The working image is a car satnav: it never tells you that you have gone too far wrong, it simply recalculates from wherever you now are and keeps trying to turn you around at the next opportunity. Emotions do the same job, which is why it has to start mattering how something feels right now — you cannot string together a series of things that feel bad and expect to arrive somewhere good. And since you never get it done, you cannot get it wrong; there is always another step available from here. The closing note is practical: wishing something in the past had been different is wasted precisely because you have no power there, and all of it is here."}]},"mindsetUpdated":"2026-08-29T02:30:30Z","youtube":{"count":8,"note":"267 subscribed channels polled (26 excluded by genre/routing); 11 uploads landed inside today's IST window, 8 shipped. Dropped: a livestream that has not started, a sleep-format clip and two low-content clips. Every item is gisted from its actual auto-captions.","groups":[{"h":"AI, markets & the economy","items":[{"t":"Nvidia's Historic Quarter, SaaS Comeback, Bessent vs Druckenmiller, America's Debt Crisis, Cancer Vaccine","s":"Nvidia posted $96.2bn of quarterly revenue and about $60bn of net profit — the most profitable core-business quarter any public company has reported — and guided to 70% growth next year against a 45% consensus. The hosts then argue the bigger story is fiscal: Washington must refinance roughly $10 trillion of debt in the next twelve months at 30-year yields near 5.2%, and no Treasury market operation fixes that without Congress cutting spending.","glance":"Nvidia's record quarter and Salesforce's 20% jump killed the 'SaaS apocalypse' trade, but the panel's real warning is $10tn of US debt refinancing over the next year at far higher yields.","url":"https://www.youtube.com/watch?v=1u5dMAKl_ks","vid":"1u5dMAKl_ks","published":"2026-08-29T01:37:17Z","src":"All-In Podcast","pointsLabel":"Segment takeaways","points":[{"t":"Nvidia's quarter reset expectations, not just estimates","s":"$96.2bn revenue (up 106% year-over-year) versus a $92bn consensus, roughly $60bn of net profit, and guidance for 70% growth where the street modelled 45%. The stock rose 9% and the company sits near $5.5tn, with the open question being how fast competing silicon arrives."},{"t":"The 'SaaS is dead' trade unwound — but only for horizontal platforms","s":"Salesforce rose over 20% on an in-line revenue quarter and a large EPS beat helped by its Anthropic stake. The panel's read: core systems of record with compliance and twenty years of debugging won't be replaced by vibe-coded internal tools; the genuine risk sits in narrow vertical SaaS, where a company can now build its own workflow software."},{"t":"Agents are hitting a context wall, and systems of record own the context","s":"Chamath frames AI in three phases — models (a brain), harnesses and agents (eyes, hands, memory), and now the training of that agent into a specific role. That third step needs enormous contextual data, which is exactly what the large systems of record hold, which is why he thinks incumbents with strong net dollar retention are positioned to win rather than be displaced."},{"t":"Bessent versus Druckenmiller is really an argument about who owns the deficit","s":"Druckenmiller's Wall Street Journal op-ed argues the Treasury Secretary is manipulating long-bond prices instead of addressing the cause. The panel largely sides with him: the federal government carries ~$40tn of debt at a 3.4% average cost, every 1% rise in rates costs about 1.25% of GDP in extra annual interest, and $10tn rolls over in the next year. Their conclusion is that only Congress cutting spending changes the trajectory."},{"t":"The 'cancer vaccine' is a manufacturing technique, not a new drug","s":"Friedberg explains the neoantigen approach: sequence a patient's tumour, find the mutation unique to it, then deliver mRNA so the patient's own cells produce that protein and the immune system learns to hunt it. Melanoma is a lead target because UV damage makes its mutations distinctive. He is sceptical of the pricing — the underlying sequencing and synthesis are cheap, and the cost sits in human trials and safety, not the science."}]},{"t":"Why Jane Street Makes More From Claude Than Anthropic Does - Dylan Patel","s":"Dylan Patel's point is that almost none of the value AI creates is captured by the labs: Jane Street, one of Anthropic's largest customers, extracts far more value from the tokens it buys than Anthropic earns in profit on them, and the same held when Meta was reportedly a tenth of Anthropic's business. The economics only invert if models reach full automation of white-collar work — at which point, he notes, the price of that labour collapses too.","glance":"Value from frontier models is currently flowing to the customers, not the labs — Jane Street and Meta earn far more from the tokens than the model provider makes selling them.","url":"https://www.youtube.com/watch?v=4NMBwT1qYew","vid":"4NMBwT1qYew","published":"2026-08-28T21:31:38Z","src":"Dwarkesh Patel","short":true},{"t":"Your next job does not exist yet: 10 survival rules, job crisis, careers in AI age","s":"The author walks through his own new book, whose argument is that AI erases individual tasks well before it erases whole professions, so the risk is not mass unemployment but the silent disappearance of the work you currently do. His prescription is to stop chasing discrete skills and instead 'manage intelligence' — build a visible, cross-linked presence online and adopt each new tool fast enough that none outruns your understanding of it.","glance":"His claim: AI removes tasks before it removes professions, so chasing individual skills is the losing move — build a distributed public footprint and adopt tools faster than they obsolete you.","url":"https://www.youtube.com/watch?v=7BzMeZKXyj4","vid":"7BzMeZKXyj4","published":"2026-08-28T21:30:03Z","src":"Anirban Bandyopadhyay"},{"t":"IS AI JUST A SCAM?","s":"A clip of the sceptic case put bluntly: generative AI has been sold in the language of magic — curing cancer, replacing all jobs — while in practice being expensive, unprofitable and unreliable cloud software. The specific charge is not that the technology does nothing but that its capabilities and its financials are both systematically overstated, and that press coverage has amplified the pressure to adopt.","glance":"The bear case in one minute: the gap being exploited is not technical but financial — capability claims and unit economics are both overstated, and coverage manufactures urgency.","url":"https://www.youtube.com/watch?v=CwLxp-C4nWY","vid":"CwLxp-C4nWY","published":"2026-08-28T21:30:18Z","src":"The Diary Of A CEO","short":true}]},{"h":"Science & space","items":[{"t":"Physics Mystery Solved: The Lamb Shift","s":"In 1947 Willis Lamb used wartime radar hardware to measure an energy gap between two hydrogen states that Dirac's theory said should be identical, and Polykarp Kusch separately found the electron's magnetic moment was slightly more than 2. Both results were unexplained until Hans Bethe worked out the calculation on the train home from the Shelter Island conference, inventing renormalisation — the step that turned quantum electrodynamics into a working theory.","glance":"Two small 1947 measurement anomalies in hydrogen forced the invention of renormalisation, the mathematical move that made quantum electrodynamics calculable.","url":"https://www.youtube.com/watch?v=3yL0c2_Msio","vid":"3yL0c2_Msio","published":"2026-08-29T01:01:55Z","src":"From First Principles"},{"t":"Aliens might not look the way you think","s":"Tardigrades survive boiling, decades of freezing, radiation and vacuum by entering cryptobiosis — shutting down metabolism entirely and dehydrating into a ball that rehydrates when conditions improve. Tube worms grow over eight feet at hydrothermal vents near 600F on vent chemistry rather than sunlight, and live bacteria have been pulled from lightless lakes half a mile under Antarctic ice.","glance":"Earth's extremophiles set the realistic template for alien life — chemistry-powered, metabolically dormant and microbial, which is what Europa, Enceladus or subsurface Mars would most plausibly host.","url":"https://www.youtube.com/watch?v=NAGB0t3ra64","vid":"NAGB0t3ra64","published":"2026-08-28T19:12:54Z","src":"Astro Alexandra","short":true}]},{"h":"Tech & gear","items":[{"t":"OPPO Reno16 Pro Real-World Test","s":"The unusual part of the spec sheet is that all four cameras — a 200MP main, a 50MP 3.5x telephoto, a 50MP ultrawide and a 50MP 100-degree selfie camera — have autofocus, which is rare at this price and turns the ultrawide into a usable macro lens. It also carries a 6,700mAh battery with 80W charging and bypass charging while gaming, a 144Hz 6.32in AMOLED, and IP68/69/69K sealing.","glance":"At this price the differentiator is autofocus on all four 50MP-plus cameras plus a 6,700mAh battery with bypass charging — specs usually reserved for flagships.","url":"https://www.youtube.com/watch?v=BOYZtWEqZaY","vid":"BOYZtWEqZaY","published":"2026-08-28T23:10:07Z","src":"The Unlockr"}]},{"h":"Machines & building","items":[{"t":"This Changes EVERYTHING!","s":"They take delivery of a Mecalac 10MCR, a compact wheeled excavator whose boom is offset and articulated so it can dig alongside itself rather than only in front. In use they report it travels almost as fast as a skid steer while staying stable with a full one-yard bucket at maximum reach, tears up far less ground than a conventional excavator, and its factory quick-change system lets buckets mount forwards or backwards for different digging angles.","glance":"A compact articulated-boom excavator can replace both a skid steer and a standard excavator on a build site — faster travel, less ground damage, and buckets that mount either way round.","url":"https://www.youtube.com/watch?v=VFc-O-jZu8c","vid":"VFc-O-jZu8c","published":"2026-08-28T21:00:18Z","src":"Grind Hard Plumbing Co"}]}]},"costs":{"updated":"2026-08-29T01:40:27+00:00","items":[{"key":"usdinr","label":"USD/INR","unit":"INR","value":95.39,"delta":-0.15,"delta_pct":-0.157,"dir":"down","asof":"2026-08-28","src":"Frankfurter (ECB ref)","url":"https://www.frankfurter.app/","stale":false},{"key":"brent","label":"Brent crude","unit":"USD/bbl","value":89.31,"delta":-0.39,"delta_pct":-0.43,"dir":"down","asof":"2026-08-29","src":"Markets Insider (indication)","url":"https://markets.businessinsider.com/commodities/oil-price?type=brent","stale":false,"note":"Intraday delayed indication (~15 min), not settlement"},{"key":"lead","label":"Lead (LME cash)","unit":"USD/tonne","value":1880.0,"delta":8.0,"delta_pct":0.4274,"dir":"up","asof":"2026-08-28","src":"Westmetall (LME official)","url":"https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Pb_cash","stale":false,"note":"LME official cash settlement, ~1 business-day lag"},{"key":"lithium","label":"Lithium (LIT ETF proxy)","unit":"USD/share","value":76.07,"delta":-1.06,"delta_pct":-1.37,"dir":"down","asof":"2026-08-28","src":"Nasdaq (LIT ETF)","url":"https://api.nasdaq.com/api/quote/LIT/info?assetclass=etf","stale":false,"note":"PROXY: lithium/battery ETF, NOT Li2CO3 spot. Indicates trend only"},{"key":"rubber","label":"Natural rubber (RSS4)","unit":"INR/kg","value":275.0,"delta":1.0,"delta_pct":0.365,"dir":"up","asof":"2026-08-29","src":"Rubber Board of India","url":"https://rubberboard.org.in/pub function relAge(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d.getTime())) return "";
  let s=Math.floor((Date.now()-d.getTime())/1000); if(s<0)s=0;
  if(s<60) return "just now";
  if(s<3600){const n=Math.floor(s/60);return n+" min"+(n>1?"s":"")+" ago";}
  if(s<86400){const n=Math.floor(s/3600);return n+" hour"+(n>1?"s":"")+" ago";}
  const days=Math.floor(s/86400);
  if(days===1) return "yesterday";
  if(days<7) return days+" days ago";
  if(days<30){const n=Math.floor(days/7);return n+" week"+(n>1?"s":"")+" ago";}
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }

/* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

function newDot(it,read0){const pd=pubDate(it);const t=pd?new Date(pd).getTime():0;return (PREV_VISIT>0&&t>0&&t>PREV_VISIT&&!read0)?'<span class="badge-new">NEW</span>':"";}
function story(it,opts){
  opts=opts||{};
  const read0=isReadItem(it);
  const el=document.createElement("div");
  el.className=(opts.hero?"hero":"story gcard")+" srow"+(read0&&!opts.hero?" read":"");
  STORY.set(el,it); ELEMS.set(cardKey(it),el);
  el.dataset.title=it.t||""; el.dataset.summary=it.s||"";
  const kc=opts.kc||kindColor(it.kind);
  el.style.setProperty("--kc",kc);
  const title=esc(it.t); /* headings are never links (2026-07-11) — source link lives in the card body */
  const age=relAge(pubDate(it));
  const vid=ytId(it.url);
  const sticker=(opts.subject&&SUB_META[(it.subject||"").toLowerCase()])?it.subject:null;
  const thumb=vid?`<span class="thumbwrap">${sticker?subBadge(it.subject,false):""}<a href="${esc(it.url)}" target="_blank" rel="noopener"><img class="thumb" loading="lazy" alt="" src="${esc(ytThumb(vid))}" onerror="this.closest('.thumbwrap').style.display='none'"><span class="play"></span></a></span>`:(sticker?subBadge(it.subject,true):"");
  const chips=[opts.kind!==false?kindPill(it.kind):"",impPill(it.imp),stagePill(it),newDot(it,read0)].filter(Boolean).join("");

    (chips?`<div class="chiprow">${chips}</div>`:"")+

    (it.s?`<p class="st-s">${esc(it.s)}</p>`:"")+
    factChips(it.facts,kc)+
    ((it.points&&it.points.length)?`<details class="pts"><summary>${esc(it.pointsLabel||(it.points.length+" key takeaways"))}</summary>${it.points.map(p=>`<div class="pt"><span class="pt-t">${esc(p.t)}</span>${p.s?`<span class="pt-s">${esc(p.s)}</span>`:""}</div>`).join("")}</details>`:"")+
    assessHtml(it.assess)+
    forYouHtml(it)+
    (it.eli?`<div class="eli"><b>In plain terms</b>${esc(it.eli)}</div>`:"")+
    (it.src
      ? `<p class="src"><b>Source:</b> ${(it.url&&!opts.noLink)?`<a href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--ac);font-weight:700">${esc(it.src)} ↗</a>`:esc(it.src)}</p>`
      : ((it.url&&!opts.noLink)?`<p class="src"><a href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--ac);font-weight:700">Open source ↗</a></p>`:""))+
    ((it.seen&&it.seen.length)?`<p class="seen"><b>Also in:</b> ${it.seen.map(esc).join(" · ")}</p>`:"")+
    ((age||it.readtime)?`<div class="meta">${age?esc(age):""}${it.readtime?(age?" · ":"")+esc(it.readtime):""}</div>`:"")+
    `<div class="more"></div>`+
    `<div class="acts"><button class="mini act-ask">Ask</button>${followBtn(it)}</div>`+
    `<div class="ask-box" style="display:none"><input type="text" class="ask-in" placeholder="Ask anything about this…"><button class="mini ask-go">Ask</button></div>`;

async function askQuestion(c,input){
  const q=(input.value||"").trim(); if(!q) return;
  const it=(typeof STORY!=="undefined"&&STORY.get)?STORY.get(c):null;
  const __ep=(typeof askEndpoint==="function")?askEndpoint():"";
  if(!(window.cowork&&window.cowork.askClaude) && !__ep){
    input.value="";
    const box0=c.querySelector(".more");
    if(box0){ const n=document.createElement("p"); n.className="exp qa"; n.innerHTML=`<span class="q">${esc(q)}</span>Opening web results in a new tab. <span style="opacity:.65">Enable inline AI in \u22ef \u2192 \u201cAsk AI setup\u201d.</span>`; box0.appendChild(n); }
    const ctx=(c.dataset.title||(it&&it.t)||"");
    window.open("https://www.google.com/search?q="+encodeURIComponent(ctx+" \u2014 "+q),"_blank","noopener");
    return;
  }
  input.value="";
  const box=c.querySelector(".more"); const p=document.createElement("p");
  p.className="exp qa loading"; p.innerHTML=`<span class="q">${esc(q)}</span>thinking…`; box.appendChild(p);
  const fmt=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n+/g,"<br>");
  const parts=[];
  const T=c.dataset.title||(it&&it.t)||""; if(T) parts.push("HEADLINE: "+T);
  const S=c.dataset.summary||(it&&it.s)||""; if(S) parts.push("SUMMARY: "+S);
  if(it){
    if(it.why) parts.push("WHY IT MATTERS: "+it.why);
    if(it.eli) parts.push("IN PLAIN TERMS: "+it.eli);
    if(it.assess){const a=it.assess;parts.push("RATING: magnitude "+a.mag+"/5, timeline "+a.timeline+", evidence "+a.evidence+(a.verdict?"; verdict “"+a.verdict+"”":"")+(a.basis?" (basis: "+a.basis+")":""));}
    if(Array.isArray(it.facts)&&it.facts.length) parts.push("KEY FACTS: "+it.facts.map(f=>f.l+": "+f.v).join("; "));
    if(it.src) parts.push("SOURCE: "+it.src);
    if(it.url) parts.push("LINK: "+it.url);
    const pd=pubDate(it); if(pd) parts.push("PUBLISHED: "+pd);
  }
  const prior=[...box.querySelectorAll(".qa")].filter(x=>x!==p&&!x.classList.contains("loading")).slice(-3).map(x=>x.textContent.replace(/\s+/g," ").trim()).filter(Boolean);
  const priorTxt=prior.length?"\n\nEARLIER IN THIS THREAD:\n- "+prior.join("\n- "):"";
  const today=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:"";
  const prompt=`You are a sharp, helpful research assistant answering a reader's question about ONE item in their personal daily dashboard${today?" (today is "+today+")":""}.

ITEM CONTEXT:
${parts.join("\n")}${priorTxt}

READER'S QUESTION: "${q}"

Answer the reader's question directly in 2-4 sentences, leading with the answer. Draw on BOTH the item context above AND your own broader knowledge — specific names, numbers, dates and background — to give a genuinely useful reply. Do NOT say the summary/context \"doesn't mention\" or \"doesn't say\" something: if a detail isn't in the context, answer it from what you already know instead. Only if you genuinely cannot answer at all should you say so briefly and point to the source link. Neutral and factual; no preamble, no bullet lists.`;
  try{ let text;
    if(window.cowork&&window.cowork.askClaude){ const res=await window.cowork.askClaude(prompt,it?[it]:[]);
      text=typeof res==="string"?res:(res&&(res.text||res.content||res.output))||JSON.stringify(res);
    } else { const rr=await fetch(__ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, url:(it&&it.url)||"", title:(c.dataset.title||(it&&it.t)||"")})});
      let jj={}; try{ jj=await rr.json(); }catch(e){}
      if(!rr.ok) throw new Error((jj&&jj.error)||("HTTP "+rr.status));
      text=jj.text||jj.answer||(jj.content&&jj.content[0]&&jj.content[0].text)||JSON.stringify(jj); }
    p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>${fmt(String(text).trim())}`;
  }catch(e){ p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>Couldn't answer right now — ${esc(String((e&&e.message)||e))}. Try the source link.`; }
}

function heroPick(items){ const real=(items||[]).filter(isRealItem); if(!real.length) return null;
  return real.find(i=>(i.imp||"").toLowerCase()==="critical")||real.find(i=>(i.imp||"").toLowerCase()==="important")||real[0]; }
function newsScore(it){
  const im={critical:4,important:3,interesting:2,noise:1}[(it&&it.imp||"").toLowerCase()]||0;
  let rec=0; try{ const t=Date.parse((typeof pubDate==="function"?pubDate(it):"")||""); if(!isNaN(t)) rec=Math.max(0,Math.min(1,1-(Date.now()-t)/(72*3600*1000))); }catch(e){}
  return im*100 + rec*5;   // most important first (impact on daily life); recency breaks ties
}
function costsBar(p){
  const C=DATA.costs; const items=((C&&C.items)||[]).filter(x=>x&&x.value!=null);
  if(!items.length) return;
  const fmtV=x=>{ const v=x.value;
    if(x.key==="usdinr")  return "\u20b9"+v.toFixed(2);
    if(x.key==="rubber")  return "\u20b9"+Math.round(v);
    if(x.key==="lead")    return "$"+Math.round(v).toLocaleString();
    if(x.key==="brent")   return "$"+v.toFixed(2);
    if(x.key==="lithium") return "$"+v.toFixed(1);
    return ""+v; };
  const chips=items.map(x=>{
    const up=x.dir==="up", dn=x.dir==="down";
    const col=up?"#e07a34":(dn?"#1f9d55":"var(--mut)");
    const arr=up?"\u25b2":(dn?"\u25bc":"\u00b7");
    const dp=(x.delta_pct!=null)?(Math.abs(x.delta_pct).toFixed(2)+"%"):"";
    const proxy=/proxy|ETF/i.test((x.label||"")+(x.note||""))?'<span class="cx-p" title="proxy indicator, not the spot price">*</span>':"";
    const lbl=esc((x.label||x.key).replace(/\s*\(.*\)\s*$/,""));
    const inner='<span class="cx-l">'+lbl+proxy+'</span><span class="cx-v">'+esc(fmtV(x))+'</span><span class="cx-d" style="color:'+col+'">'+arr+(dp?" "+dp:"")+'</span>';
    const tip=esc((x.src||"")+(x.note?" \u2014 "+x.note:""));
    return x.url?'<a class="cx" href="'+esc(x.url)+'" target="_blank" rel="noopener" title="'+tip+'">'+inner+'</a>':'<span class="cx" title="'+tip+'">'+inner+'</span>';
  }).join("");
  const box=document.createElement("div"); box.className="costbar glass";
  box.innerHTML='<span class="cb-h">Input costs</span><div class="cb-row">'+chips+'</div>';
  p.appendChild(box);
}
function renderNews(){
  const p=document.getElementById("p-news"); if(!p) return; p.innerHTML="";
  costsBar(p);
  const N=DATA.news||{}; const cats=N.cats||[];
  if(!cats.length){ const e=document.createElement("p"); e.className="empty"; e.textContent="No news loaded yet — tap Update."; p.appendChild(e); return; }
  const all=[]; cats.forEach(c=>(c.items||[]).forEach(it=>{ it.__cat=c.h; all.push(it); }));
  // MUST-KNOW ONLY — big stories everyone's following; drop the smaller/interesting/filler news
  const mustKnow=it=>{ const k=(it&&it.imp||"").toLowerCase(); return k==="critical"||k==="important"; };
  const hero=heroPick(all.filter(mustKnow));

  // ONE flat list — no categories — most important first, must-know only
  const flat=all.filter(it=>isRealItem(it)&&mustKnow(it)&&!(hero&&it===hero)).sort((a,b)=>newsScore(b)-newsScore(a));

    box.innerHTML=`<summary>In brief · today in 30 seconds</summary><div class="glance-body"><div class="glance-row"><span class="glance-items">${gl.map(esc).join(" · ")}</span></div></div>`;

      const link=it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--ac);font-weight:700;font-size:.72rem">open ↗</a>`:"";
      row.innerHTML=`<span class="cd" style="--cdc:${impc};background:${impc}"></span><div class="ct">${esc(it.t)} <span class="csrc">· ${esc(it.src||it.__cat||"")}</span>
        <div class="cx">${it.s?`<div class="cs">${esc(it.s)}</div>`:""}${factChips(it.facts,impc)}<div class="more"></div><div class="acts" onclick="event.stopPropagation()"><button class="mini act-ask">Ask</button>${followBtn(it)}<span style="margin-left:auto">${link}</span></div><div class="ask-box" style="display:none" onclick="event.stopPropagation()"><input type="text" class="ask-in" placeholder="Ask anything about this…"><button class="mini ask-go">Ask</button></div></div></div>`;
      row.querySelector(".act-ask").onclick=e=>toggleAsk(e.target);
      wireFollow(row,it);
      const cgi=row.querySelector(".ask-in"); row.querySelector(".ask-go").onclick=()=>askQuestion(row,cgi);
      cgi.addEventListener("keydown",e=>{if(e.key==="Enter")askQuestion(row,cgi);});
      row.addEventListener("click",()=>{ row.classList.toggle("open"); if(!row.classList.contains("read")){ row.classList.add("read"); setRead(it,true); } });
      listWrap.appendChild(row);
    });
    const done=document.createElement("div"); done.className="allcaught"; done.textContent="— that's everything, you're all caught up —"; listWrap.appendChild(done);
  }
  function renderCards(){

  function setMode(m){ mode=m; store.set("newsDensity",m);

  [...bar.querySelectorAll(".dens-seg button")].forEach(b=>b.onclick=()=>setMode(b.dataset.m));

  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();

</script>
