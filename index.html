ctive workloads, tested on GPT-OSS 120B, DeepSeek R1 670B and Kimi K2.5 1T. Use case: it is a general-purpose LLM inference accelerator, not tuned to OpenAI's own models, so cheaper tokens for anyone serving large models. OpenAI supplied the numbers; SemiAnalysis verified some runs on-site.","glance":"OpenAI's own chip claims 1.5-1.9x better perf-per-watt than Nvidia","assess":{"mag":5,"timeline":"now","evidence":"strong","verdict":"First credible non-Nvidia inference lead","basis":"Vendor-run InferenceX benchmarks, partly verified on-site by SemiAnalysis"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"important"},{"t":"Nvidia puts Groq 3 LPX into full production","heat":88,"delta":"new","sources":5,"url":"https://blogs.nvidia.com/blog/vera-rubin-lpx-spectrum-x-nvlink-fusion/","s":"Nvidia announced Groq 3 LPX is in full production and extends Vera Rubin NVL72 for long-context agent workloads. On an Artificial Analysis benchmark running the open Gemma 4 31B agentic model it delivered 3,400 output tokens per second on 100,000-token contexts, which Nvidia says is 4x the nearest alternative platform. Use case: agent systems that reason over very long contexts get cheaper per token. SpaceXAI will use Vera CPUs, CoreWeave has deployed Spectrum-X Multiplane in production and Nebius is the first AI cloud to adopt LPX.","glance":"Nvidia answers with a long-context inference chip in production","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Shipping silicon for long-context agents","basis":"Vendor benchmark on Gemma 4 31B; named production customers"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"important"},{"t":"Alibaba readies Qwen 3.8-Flash-Next, 125B with 6B active","heat":80,"delta":"new","sources":3,"url":"https://modelscope.cn/models/Qwen/Qwen3.8-Flash-Next","s":"Model cards appeared on ModelScope for Qwen 3.8-Flash-Next, a 125B-parameter mixture-of-experts model activating about 6B parameters per token, with release signalled as imminent. Use case: a sparse open-weight model at that ratio runs on far less memory than a dense equivalent, which is what makes frontier-ish quality practical on single-node or on-prem hardware.","glance":"A 125B open MoE that only activates 6B per token","assess":{"mag":4,"timeline":"now","evidence":"early","verdict":"Open sparse model sized for on-prem","basis":"Model card live on ModelScope; weights not yet released at time of writing"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"important"},{"t":"4-bit compressed model beats its full-precision original","heat":72,"delta":"new","sources":3,"url":"https://huggingface.co/blog/MultiverseComputingCAI/quantization-aware-healing","s":"Multiverse Computing published Quantization-Aware Healing, a recovery recipe applied after a model has been both structurally compressed and quantized. Applied to GPT-OSS 120B cut to 60B parameters and quantized to MXFP4, the resulting model beats its own bfloat16 checkpoint on 7 of 9 benchmarks. Use case: it inverts the usual accuracy tax on 4-bit deployment, so the cheap model to serve is also the more accurate one.","glance":"4-bit model that outperforms the 16-bit one it came from","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Compression tax inverted, not just reduced","basis":"Paper plus benchmark table on 9 tasks; single vendor's result, not yet replicated"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"important"},{"t":"Anthropic tells investors it sees $30T potential revenue","heat":66,"delta":"new","sources":4,"url":"https://www.wsj.com/tech/ai/anthropic-expected-to-tell-investors-it-sees-over-30-trillion-in-potential-revenue","s":"Anthropic is expected to present investors with a total-addressable-market case exceeding $30 trillion, according to a WSJ report, framed around AI substituting for labour rather than software spend. Separately the company told San Francisco staff to work from home over a possible security-team strike.","glance":"Anthropic pitches a labour-sized market to investors","assess":{"mag":3,"timeline":"5-10 yrs","evidence":"speculative","verdict":"TAM projection, not booked revenue","basis":"Single-outlet report of an investor deck; no financials disclosed"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"},{"t":"OpenAI ships an Admin plugin for ChatGPT Work and Codex","heat":60,"delta":"new","sources":5,"url":"https://openai.com/index/introducing-admin-plugin","s":"OpenAI released an Admin plugin letting workspace administrators analyse usage, manage members and permissions, adjust limits and act on admin requests from inside ChatGPT Work and Codex. Use case: it removes the console round-trip for the IT teams actually rolling these tools out across an org.","glance":"Admin controls move inside ChatGPT Work","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Useful but incremental enterprise plumbing","basis":"Shipped product per OpenAI's own release note"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"},{"t":"OpenAI disrupts a Russian covert influence network","heat":57,"delta":"new","sources":4,"url":"https://openai.com/index/disrupting-malicious-uses-of-ai-influence-campaign-russia","s":"OpenAI banned a cluster of Russia-origin accounts that used its models to promote a fabricated Israel-based think tank and a 'sovereignty index' praising Russia and criticising the West. The report is part of the company's periodic threat disclosures.","glance":"AI-run fake think tank taken down","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Documented takedown of a live operation","basis":"First-party threat report with named tactics"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"},{"t":"Meta plans a 'Hatch' AI agent platform","heat":54,"delta":"new","sources":3,"url":"https://news.google.com/rss/search?q=Meta+Hatch+AI+agent+platform","s":"Reports say Meta will launch an agent platform codenamed Hatch within weeks, letting developers build and deploy agents across its surfaces. Details are secondhand and Meta has not confirmed the timing.","glance":"Meta's agent platform said to be imminent","assess":{"mag":3,"timeline":"0-2 yrs","evidence":"early","verdict":"Unconfirmed platform launch report","basis":"Secondary reporting only; no Meta announcement"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"},{"t":"Samsung shows LPDDR5X with logic in memory","heat":52,"delta":"new","sources":3,"url":"https://www.tomshardware.com/pc-components/dram/hot-chips-2026-samsung-lpddr5x-pim","s":"At Hot Chips, Samsung presented LPDDR5X-PIM, which puts a processing unit inside the memory die. Samsung reports it is 3.01x faster than standard LPDDR5X on AI inference with eight times the effective bandwidth. Use case: moving compute next to memory is the direct attack on the bandwidth wall that limits on-device and edge inference.","glance":"Processing-in-memory triples inference speed","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"early","verdict":"Real silicon demo of processing-in-memory","basis":"Conference presentation with vendor-reported figures; not yet in shipping parts"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"important"},{"t":"Dylan Patel: two labs will take half of new compute","heat":50,"delta":"new","sources":2,"url":"https://www.youtube.com/watch?v=RtRxA_qCUpM","s":"SemiAnalysis founder Dylan Patel told the Dwarkesh Podcast that OpenAI and Anthropic together took about 30% of compute added in 2026 and, on contracts already signed, will take 40-50% next year. He says both labs crossed into profitability as revenue per megawatt climbed from below the roughly $10-15m build cost to as high as $50m for Anthropic.","glance":"Two labs to absorb half of new compute","assess":{"mag":3,"timeline":"0-2 yrs","evidence":"early","verdict":"Well-sourced analyst projection","basis":"Analyst estimates from signed contracts; not audited disclosures"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"},{"t":"OpenAI restores 5-hour Codex limits for Plus users","heat":44,"delta":"new","sources":2,"url":"https://9to5mac.com/2026/08/24/openai-restores-5-hour-codex-and-work-limits-for-chatgpt-plus-users/","s":"OpenAI reinstated the five-hour Codex and Work usage windows for ChatGPT Plus subscribers after a period of tighter caps, easing a constraint that had pushed heavier coding users toward higher tiers.","glance":"Codex limits loosened again on Plus","assess":{"mag":2,"timeline":"now","evidence":"proven","verdict":"Quota change, not a capability change","basis":"Confirmed by OpenAI docs and secondary coverage"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"},{"t":"IBM releases Granite 4.2 open models","heat":41,"delta":"new","sources":2,"url":"https://huggingface.co/blog/ibm-granite/granite-4-2","s":"IBM published Granite 4.2 with a build write-up on Hugging Face, continuing its Apache-licensed enterprise model line aimed at on-prem and regulated deployments.","glance":"IBM refreshes its open enterprise models","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Incremental open-weight refresh","basis":"Weights and technical write-up published on Hugging Face"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"},{"t":"AI agents tested on reproducing 6,000 conference papers","heat":38,"delta":"new","sources":2,"url":"https://www.science.org/content/article/researchers-presented-6000-papers-major-meeting-could-ai-reproduce-their-findings","s":"A hackathon reported in Science tried AI agents against the findings of roughly 6,000 papers from a major meeting, suggesting automated verification of published results could become routine. Use case: cheap reproducibility checks at conference scale would change peer review economics.","glance":"Agents put to work checking published science","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Promising but hackathon-grade evidence","basis":"Single hackathon reported by Science; no formal accuracy audit"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"},{"t":"Sonar: 40% AI-written code is creating a security backlog","heat":35,"delta":"new","sources":2,"url":"https://www.youtube.com/watch?v=g0RXwGnGnBw","s":"Sonar's general manager argued in an interview that with roughly 40% of new code now machine-generated, review capacity rather than generation is the bottleneck, and that vulnerability classes are re-entering codebases faster than teams retire them.","glance":"AI code volume outruns review capacity","assess":{"mag":3,"timeline":"now","evidence":"early","verdict":"Vendor-framed but plausible bottleneck","basis":"Vendor interview; the 40% figure is not independently audited"},"published":"2026-08-25T20:06:25.363452+00:00","src":"AI trend cluster","imp":"interesting"}]},"aitrendsUpdated":"2026-08-26T02:10:27.578737+00:00","science":{"updated":"2026-08-26T02:06:25.363452+00:00","items":[{"t":"Mexico approves the world's first RNA-based fungicide","s":"Mexican regulators cleared Oifirax, made by GreenLight Biosciences, the first RNA-based fungicide approved anywhere. It uses double-stranded RNA molecules to silence genes in the fungus that causes powdery mildew on grapes, rather than a broad-spectrum chemical. Use case: a crop protection product that targets one pathogen species and degrades quickly, which matters where resistance to conventional fungicides is spreading. Maturity qualifier: this is a regulatory approval of a commercial product, not a lab result.","tag":"Biology","imp":"important","glance":"First RNA fungicide cleared for use","url":"https://www.science.org/content/article/global-first-mexico-approves-use-rna-based-fungicide","published":"2026-08-25T02:30:00+00:00","src":"Science (AAAS)","assess":{"mag":5,"timeline":"now","evidence":"proven","verdict":"RNA pesticides become a real product class","basis":"National regulatory approval of a commercial RNA fungicide"}},{"t":"A personalised mRNA cancer vaccine keeps melanoma from returning","s":"Moderna and Merck reported that in a large randomised trial, high-risk melanoma patients given the personalised mRNA vaccine intismeran alongside Keytruda stayed cancer-free longer than those on Keytruda alone. Each dose is built to attack the mutations in that specific patient's tumour. An earlier trial of the same combination halved the risk of recurrence or death. Use case: a post-surgery treatment that lowers the chance the cancer comes back. Maturity qualifier: the companies announced results on 19 August but have not yet released the trial data, and the vaccine is not approved.","tag":"Health","imp":"critical","glance":"Personalised mRNA vaccine cuts melanoma recurrence","url":"https://www.sciencenews.org/article/cancer-vaccine-melanoma-treatment-mrna","published":"2026-08-25T16:00:00+00:00","src":"Science News / Moderna-Merck","assess":{"mag":5,"timeline":"1-2 yrs","evidence":"strong","verdict":"Personalised cancer vaccines clear a phase-3 bar","basis":"Large randomised trial reported by sponsors; full data not yet published"},"eli":"Doctors read the DNA of your own tumour, then build a vaccine that trains your immune system to hunt down exactly those cells, so the cancer is less likely to come back after surgery."},{"t":"Superconductivity boosted by vacuum fluctuations for the first time","s":"A team has strengthened superconductivity in a material without changing its chemistry, instead placing it in an optical cavity so that the vacuum's own quantum fluctuations couple to the electrons. Peer-reviewed in Nature (19 Aug 2026). Use-case: if cavity engineering can lift a transition temperature, superconducting magnets, sensors and power components could be tuned by their environment rather than by inventing new compounds.","tag":"Physics & Space","imp":"critical","glance":"Cavity boosts superconductivity","url":"https://phys.org/news/2026-08-vacuum-fluctuation-superconductivity.html","published":"2026-08-24T20:50:01+00:00","src":"Phys.org","assess":{"mag":5,"timeline":"5-10 yrs","evidence":"strong","verdict":"Real effect, tiny margin so far","basis":"Peer-reviewed in Nature; first demonstration, laboratory scale only"},"eli":"Empty space is never truly empty — it jitters. Put a superconductor inside a mirrored box tuned to the right size and that jitter pushes on its electrons, helping them pair up more easily."},{"t":"Nature Energy quantifies what cell mismatch costs an EV battery pack","s":"Researchers built a diagnostic framework from real operating data on 116 passenger cars and 17 buses covering more than three years and up to 300,000 km per vehicle, estimating individual cell capacity and resistance in the field. Six metrics capture variability in cell health, pack capacity retention, lifetime degradation, state-of-charge utilisation, power capability and energy utilisation, showing how much usable pack performance cell-to-cell inconsistency actually destroys. Use case: pack designers and fleet operators get field-derived numbers for how much matching and balancing is worth. Maturity qualifier: peer-reviewed in Nature Energy.","tag":"Energy","imp":"important","glance":"Field data prices the cost of mismatched cells","url":"https://www.nature.com/articles/s41560-026-02131-5","published":"2026-08-25T00:00:00+00:00","src":"Nature Energy","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Turns pack mismatch into design numbers","basis":"Peer-reviewed Nature Energy study on 133 real vehicles over 3+ years"}},{"t":"IBM's 2 nm mainframe chip puts Arm cores next to its own architecture","s":"IBM unveiled a 2-nanometre processor that brings Arm computing directly inside the mainframe, so a single machine can run both its traditional workloads and the Arm-native software that most cloud and AI tooling now targets. Use-case: banks and insurers running core systems on Z hardware can add modern containerised and AI workloads without a second estate.","tag":"Technology","imp":"important","glance":"2nm dual-architecture mainframe","url":"https://interestingengineering.com/innovation/ibm-2nm-dual-architecture-arm-mainframe-processor","published":"2026-08-25T00:07:44+00:00","src":"Interesting Engineering","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Shipping silicon, not a research claim","basis":"Vendor announcement of a fabricated 2nm part; independent benchmarks pending"}},{"t":"Massive review finds vaping the most effective way to quit smoking","s":"A large evidence review concluded that nicotine e-cigarettes produce higher quit rates than nicotine gum, patches or behavioural counselling for people who already smoke regularly. Use case: it changes what a clinician can offer a smoker who has failed other methods, against 7 million tobacco deaths a year. Maturity qualifier: the review carries substantial caveats, chiefly that the long-term harms of sustained vaping are still not established, so the trade-off between a higher quit rate and an unknown tail risk remains open.","tag":"Health","imp":"important","glance":"Vaping beats patches and gum for quitting","url":"https://www.sciencealert.com/massive-study-says-vaping-really-is-the-most-effective-way-to-quit-smoking-but-theres-a-catch","published":"2026-08-26T00:00:00+00:00","src":"ScienceAlert","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Best quit rates, unresolved long-term risk","basis":"Systematic review of randomised trials; long-term harm data still absent"}},{"t":"Lithium-sulfur cells with twice the energy density enter US Army drone testing","s":"Australian developer Li-S Energy has delivered lithium-sulfur cells to the US Army for evaluation in drones. Li-S chemistry roughly doubles the energy stored per kilogram versus lithium-ion and uses no cobalt or nickel — the trade-off has always been cycle life, which is why the first real customers are aircraft that need endurance more than thousands of recharges. Use-case: longer-flying drones now, lighter packs later.","tag":"Energy","imp":"important","glance":"Li-S cells hit army testing","url":"https://interestingengineering.com/energy/lithium-sulfur-batteries-us-army-drone-testing","published":"2026-08-24T20:20:48+00:00","src":"Interesting Engineering","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Working cells, in a customer's hands","basis":"Delivered hardware under military evaluation; cycle life still the open question"}},{"t":"AI narrows 100 million print settings to six that make rocket-grade alloy printable","s":"Washington State University researchers used machine learning to search a space of more than 100 million parameter combinations and surface six workable recipes for 3D-printing a high-performance metal alloy on commercial printers rather than specialist industrial machines. Use-case: parts that previously needed a bespoke printer become reachable for ordinary workshops.","tag":"Materials","imp":"important","glance":"AI cracks rocket-alloy printing","url":"https://phys.org/news/2026-08-ai-ways-rocket-grade-alloy.html","published":"2026-08-24T21:30:04+00:00","src":"Phys.org","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Method works, needs shop-floor proof","basis":"University release; validated experimentally, not yet in production use"}},{"t":"Adding one organic molecule during melting makes a tunable new class of glass","s":"TU Dortmund, Paderborn, Duisburg-Essen and Oxford report in Nature Materials that introducing an organic molecule during melting rearranges the chemical bonds, lowering the processing temperature, preventing decomposition and letting magnetic and optical properties be dialled in. Use-case: these glasses already go into gas storage, batteries, optics and catalysis, so a cheaper, more controllable route matters commercially.","tag":"Materials","imp":"important","glance":"Cooler-melt tunable glass","url":"https://phys.org/news/2026-08-molecular-door-generation-glass.html","published":"2026-08-24T22:10:01+00:00","src":"Phys.org","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Cleaner route to a useful material","basis":"Nature Materials; lab-scale synthesis, no manufacturing pilot yet"}},{"t":"Ultra-processed food intake tracks with 30% higher prostate cancer risk","s":"A Florida Atlantic University-led analysis adds prostate cancer to the list of outcomes linked to ultra-processed foods, which now supply close to 60% of calories for US adults and about 70% for children. Observational, so it cannot prove causation, but the exposure is enormous and the direction is consistent across a growing body of work.","tag":"Health","imp":"important","glance":"UPFs and prostate cancer risk","url":"https://scitechdaily.com/ultra-processed-foods-linked-to-30-higher-prostate-cancer-risk/","published":"2026-08-24T15:32:08+00:00","src":"SciTechDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Consistent signal, observational design","basis":"Peer-reviewed epidemiology; association only, residual confounding likely"}},{"t":"Mitochondria taken from a woman's leg are injected into her eyes","s":"Doctors extracted mitochondria from cells in a leg biopsy and injected them into the vitreous fluid of both eyes of a young woman with severe vision loss, the first time mitochondrial transplantation has been tried in a human eye. Nothing adverse happened, which is the primary signal a first-in-human safety report is looking for, and the team recorded hints of benefit although her vision was not restored. Use case: if it holds up, transplanting mitochondria could give failing cells in the retina and elsewhere a fresh energy supply. Maturity qualifier: a single-patient case report posted as a preprint on Research Square, led by Mount Sinai.","tag":"Health","imp":"important","glance":"First mitochondrial transplant into a human eye","url":"https://www.sciencealert.com/world-first-mitochondria-from-a-womans-leg-were-injected-into-her-eyes","published":"2026-08-25T11:00:00+00:00","src":"ScienceAlert / Mount Sinai","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"First human test of a bold repair idea","basis":"Single-patient preprint case report; safety signal only, no efficacy"}},{"t":"Metformin use tracks with roughly half the later dementia risk","s":"Long-horizon data links the common type 2 diabetes drug to substantially lower dementia incidence decades on. The association is not conclusive — people prescribed metformin differ systematically from those who are not, and no randomised trial has tested it for prevention — but the drug is cheap, off-patent and well characterised, which is why the finding keeps drawing trial interest.","tag":"Health","imp":"important","glance":"Metformin linked to less dementia","url":"https://www.newscientist.com/article/2586113-diabetes-drug-metformin-may-halve-the-risk-of-dementia/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS","published":"2026-08-24T13:25:10+00:00","src":"New Scientist","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Strong signal, confounding unresolved","basis":"Observational cohort analysis; no randomised prevention trial yet"}}]},"scienceUpdated":"2026-08-26T02:10:27.578737+00:00","scienceDaily":{"updated":"2026-08-26T02:06:25.363452+00:00","items":[{"t":"Shingles vaccine tracks with 24% lower dementia risk in 500,000 adults","s":"Brown University researchers analysed Medicare records for more than 500,000 adults aged 66 and over admitted to skilled nursing facilities, and found those who received at least one dose of the recombinant shingles vaccine Shingrix had a 24% lower risk of a dementia diagnosis over the following four years. They estimate roughly one dementia case avoided for every 17 people vaccinated. Use case: a vaccine already on the shelf and already recommended for this age group may carry a second benefit, which is directly actionable for anyone weighing whether to get it. Maturity qualifier: observational cohort study, not a randomised trial, so residual confounding by who chooses vaccination cannot be excluded.","tag":"Health","imp":"critical","glance":"Shingles shot linked to 24% less dementia","url":"https://www.sciencedaily.com/releases/2026/08/260823015013.htm","published":"2026-08-25T13:09:21+00:00","src":"ScienceDaily / Brown University","assess":{"mag":5,"timeline":"now","evidence":"strong","verdict":"A shelf-ready vaccine with a brain dividend","basis":"500,000-person Medicare cohort; observational, not randomised"},"eli":"People who got the shingles jab were about a quarter less likely to be diagnosed with dementia over the next four years — roughly one case avoided for every 17 people vaccinated."},{"t":"An atomic-scale catalyst cracks lignin into petrochemical replacements","s":"A University of Manchester-led international team built a catalyst that breaks lignin, the stubborn polymer that gives plants their structural strength, into useful aromatic chemicals under relatively mild conditions, and resolved how it works at the atomic level. Lignin can make up as much as 35% of agricultural and forestry waste and is the largest renewable source of aromatic chemicals in nature, but its tangled structure has kept it out of industrial use. Use case: forestry and crop waste becomes feedstock for fuels, plastics and materials now made from petroleum. Maturity qualifier: peer-reviewed in ACS Catalysis; laboratory scale.","tag":"Chemistry","imp":"important","glance":"Plant waste becomes petrochemical feedstock","url":"https://www.sciencedaily.com/releases/2026/08/260824065601.htm","published":"2026-08-25T10:09:15+00:00","src":"ScienceDaily / University of Manchester","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Lignin finally becomes usable feedstock","basis":"Peer-reviewed in ACS Catalysis with atomic-level mechanism; lab scale"}},{"t":"Medications you stopped years ago are still shaping your gut","s":"In a study of more than 2,500 people, researchers found lasting shifts in gut microbiome composition tied not only to past antibiotic courses but to several other common drug classes, persisting long after the last dose. Use case: it argues for treating drug history, not just current prescriptions, as an input when interpreting microbiome tests or planning treatments that depend on gut bacteria. Maturity qualifier: observational cohort.","tag":"Health","imp":"important","glance":"Old prescriptions still shape gut bacteria","url":"https://www.sciencedaily.com/releases/2026/08/260824065602.htm","published":"2026-08-24T13:35:00+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Drug history outlives the prescription","basis":"2,500-person cohort; association only, mechanism unresolved"}},{"t":"A rice-grain microcomb chip generates a whole 'rainbow' of 6G carriers at once","s":"Loughborough University researchers built a microcomb about the size of a grain of rice that emits many precisely spaced frequencies of light simultaneously, letting one chip generate multiple high-frequency signals instead of needing a separate source per band. Use-case: cheaper 6G base stations, and the same precision serves quantum timing, navigation and radar.","tag":"Technology","imp":"important","glance":"One chip, many 6G carriers","url":"https://www.sciencedaily.com/releases/2026/08/260823014946.htm","published":"2026-08-24T12:07:31+00:00","src":"ScienceDaily computers","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Clean lab result, long road to kit","basis":"Peer-reviewed photonics result; laboratory device, no field trial"},"eli":"A prism splits white light into a rainbow. This chip does the opposite trick on purpose: it makes a comb of perfectly spaced colours, and each tooth can carry its own radio channel."},{"t":"Both short and long sleep track with faster ageing across the whole body","s":"Researchers ran 23 biological ageing clocks and found the slowest ageing clustered around 6.4 to 7.8 hours of sleep, with both ends of the range linked to faster ageing in brain, heart, lung, immune and metabolic measures — and to a broad range of diseases. Use-case: it puts a specific, narrow target on a habit most people can actually adjust.","tag":"Health","imp":"important","glance":"Sleep's sweet spot: 6.4-7.8h","url":"https://www.sciencedaily.com/releases/2026/08/260823094156.htm","published":"2026-08-24T11:31:44+00:00","src":"ScienceDaily top","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Many clocks, one consistent window","basis":"Peer-reviewed multi-clock analysis; observational, direction of causation unproven"}},{"t":"Engineered natural killer cells get inside solid tumours","s":"Stanford Medicine and collaborators re-engineered natural killer cells into a tissue-resident state so they can penetrate solid tumours and keep working once inside, the two barriers that have kept cell therapy effective in blood cancers but not solid ones. In mice the modified cells slowed growth of several tumour types including melanoma and head and neck cancers, and worked better still when paired with the antibody drug cetuximab. Use case: NK cells can be made from donor material, so this points at an off-the-shelf solid-tumour cell therapy rather than a bespoke one. Maturity qualifier: mouse study, preclinical.","tag":"Health","imp":"important","glance":"Off-the-shelf cell therapy reaches solid tumours","url":"https://www.sciencedaily.com/releases/2026/08/260824065546.htm","published":"2026-08-25T12:56:22+00:00","src":"ScienceDaily / Stanford Medicine","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Solid tumours cracked, so far in mice","basis":"Mouse tumour models plus cetuximab combination; no human data yet"}}]},"scienceDailyUpdated":"2026-08-26T02:10:27.578737+00:00","life":{"updated":"2026-08-26T02:10:27.578737+00:00","items":[]},"lifeUpdated":"2026-08-26T02:10:27.578737+00:00","elon":{"day":"2026-08-25","source":"@jcub2x daily recap","note":"Built from @jcub2x's 08/25/26 recap of 48 Musk posts, grouped by subject. Engagement counts are not carried in the recap, so likes and views are not shown; items are ordered by significance.","items":[{"kind":"post","t":"Tesla Semi rollout date","s":"Musk said the Tesla Semi rollout starts 24 September 2026, and reposted the Tesla Semi account's note that the new Semi factory in Nevada is inaugurated next month.","imp":"important","iso":"2026-08-25T12:00:00+00:00"},{"kind":"post","t":"SpaceX and Nvidia designing a space-optimised Vera Rubin rack","s":"Responding to Nvidia's announcement that SpaceX is deploying Vera to orchestrate its agentic AI, Musk said SpaceX and Nvidia have designed a space-optimised Vera Rubin NVL72 system for launch to orbit in Q4 next year, scaling significantly in 2028. He added that their design is 'significantly simpler, lower cost, denser and lighter than a traditional rack'.","imp":"critical","iso":"2026-08-25T13:00:00+00:00"},{"kind":"post","t":"Grok Voice is running Starlink support at scale","s":"Musk said Grok Voice is used by Starlink at scale for support and sales, after the xAI account stated Starlink resolves over 15,000 inbound support and sales calls a day with it, shipping replacements and fulfilling more than 3,000 orders a week. Separately, Grok Voice 'Think Fast 2' was reported top of the Artificial Analysis speech-to-speech index.","imp":"critical","iso":"2026-08-25T11:00:00+00:00"},{"kind":"repost","t":"Starlink's constellation size versus everyone else","s":"He reposted a chart showing Starlink at roughly 11,040 working satellites in orbit, against about 2,100 for the next nine largest low-Earth-orbit constellations combined — more than five times all nine together.","imp":"important","iso":"2026-08-25T10:00:00+00:00"},{"kind":"repost","t":"NASA's Roman Space Telescope encapsulated for launch","s":"He reposted images of the Roman Space Telescope being encapsulated in Falcon Heavy's fairing ahead of a 30 August launch from pad 39A in Florida.","imp":"important","iso":"2026-08-25T09:30:00+00:00"},{"kind":"repost","t":"Jensen Huang on what xAI built in 19 days","s":"He reposted Nvidia CEO Jensen Huang saying xAI 'did in 19 days what everyone else needs one year to accomplish', referring to the speed of the Colossus build-out.","imp":"important","iso":"2026-08-25T08:30:00+00:00"},{"kind":"post","t":"Grok Build gains a browser-use plugin","s":"xAI added a browser-use plugin to Grok Build, giving it a real browser — either the user's own Chrome session or an isolated cloud browser — so it can browse, scrape and extract data, fill forms, test web apps, take screenshots and automate multi-step web workflows. Musk amplified several user demonstrations of the agent cutting video clips, building shopping carts and cancelling subscriptions unaided.","imp":"important","iso":"2026-08-25T07:30:00+00:00"},{"kind":"post","t":"On why the Roadster was the payload","s":"Asked about the original Falcon Heavy demo flight, Musk said few people know the reason they launched his old Tesla Roadster toward Mars orbit was that the probability of failure was very high and they did not want to risk anything valuable.","imp":"interesting","iso":"2026-08-25T06:30:00+00:00"},{"kind":"post","t":"Singapore's fertility rate hits a record low","s":"Responding to news that Singapore's fertility rate fell to a record 0.87 in 2025, Musk wrote 'humans are disappearing', and endorsed a long post arguing that population-pyramid inversion is an existential problem obscured by the fact that GDP per capita can keep rising while a population shrinks. Demographers dispute how far current fertility trajectories can be extrapolated.","imp":"important","iso":"2026-08-25T05:30:00+00:00"},{"kind":"repost","t":"Epoch AI on GDP understating Nvidia's contribution","s":"He shared Epoch AI research arguing that US GDP statistics miss most of the value Nvidia adds to the economy, understating GDP growth by roughly 0.3 percentage points over the last year.","imp":"interesting","iso":"2026-08-25T04:30:00+00:00"},{"kind":"reply","t":"On the Derek Chauvin appeal and the George Floyd case","s":"Musk replied 'true' to commentary supporting Derek Chauvin's third attempt to overturn his murder conviction, in which Chauvin's lawyers are challenging the legitimacy of the prosecution and seeking dismissal. The claims circulating in that thread about toxicology and culpability are contested and were addressed at trial; the conviction currently stands.","imp":"interesting","iso":"2026-08-25T03:30:00+00:00"},{"kind":"repost","t":"European polling for AfD and RN","s":"He reposted a claim that Germany's AfD reached 29% and France's RN 38% in national polling, both described as record highs. Single-poll figures vary by pollster and should be read against polling averages rather than one release.","imp":"interesting","iso":"2026-08-25T02:30:00+00:00"}],"highlight":{"t":"SpaceX unveils a $100 billion 'Starbase Louisiana', the world's largest spaceport","s":"SpaceX and Governor Jeff Landry announced Starbase Louisiana on Pecan Island in Vermilion Parish, a clean-sheet Starship spaceport with its own propellant production, power generation, deep-water shipping and vehicle processing, aiming at a launch cadence Musk has framed as up to 30 a day. Louisiana received about 130,000 acres from ExxonMobil for the project; SpaceX commits to at least 3,000 permanent jobs and says the figure is likely closer to 10,000. Wildlife groups have warned against waiving coastal protections, and SpaceX says it will fund shoreline and marsh restoration in a parish losing 3 to 23 feet of coast a year.","href":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE0zWU9HNUtmVGt6TDhqUUxxX3ZYVmpaVUhpMi1PSkVMbEluWEdqUXV1RGVJSjMtY0NUS1FRTng4ZXhTeTJSRkJKSEZIRThtbWc5bEo2THdfVzlpQQ?oc=5"}},"elonNews":[{"t":"SpaceX to build a $100bn Starbase in Louisiana","s":"SpaceX announced a $100 billion Starship launch complex on the Louisiana coast, its largest single infrastructure commitment and a bet that Starship cadence needs a purpose-built, self-sufficient spaceport rather than more pads at existing sites.","url":"https://news.google.com/rss/articles/CBMiWkFVX3lxTE0zWU9HNUtmVGt6TDhqUUxxX3ZYVmpaVUhpMi1PSkVMbEluWEdqUXV1RGVJSjMtY0NUS1FRTng4ZXhTeTJSRkJKSEZIRThtbWc5bEo2THdfVzlpQQ?oc=5","src":"BBC","published":"2026-08-26T01:27:40.114320+00:00"},{"t":"SpaceX wants to turn Louisiana marshland into a Starship hub","s":"The Pecan Island site sits in coastal wetlands in Vermilion Parish. SpaceX says it will develop only the portion needed for launch operations and fund marsh restoration; local residents and wildlife groups have raised concerns at parish meetings.","url":"https://news.google.com/rss/articles/CBMipgFBVV95cUxQUkp2cGZJWUJNeGJIb0pKUWVCVVF1WjA0ZHlJYWZGTGUwYTRKRUZnYWEtT3ZxUXlfTHptd3lwNHhoYTY3dFl2V25xeTJOYjZMU1B4MkJjQTBvek55QWdZREFhWG5WcDZzazR3RHM3SHdxYVJlUy1MLW9NVzRPaE1nSG9jU3I1YV9YbXdwOVBuQXY5bWNtQXN4SjJTNzlrQXZzVkg3Vmxn?oc=5","src":"NBC News","published":"2026-08-26T02:03:40.114320+00:00"},{"t":"Wisconsin prosecutor will not charge Musk over $1m voter checks","s":"A Wisconsin prosecutor declined to bring charges over Musk's offer of $1 million cheques to voters during a state supreme court race, closing an election-bribery investigation without a filing.","url":"https://news.google.com/rss/articles/CBMixAFBVV95cUxPS3lZVm1rNjZtWF85OE5RVkg4Yk5SQ19CZDF1dEM1RURyeHRCMHNKVGlxb2VtS25jM01RMHF3emtwS2x LVc5Q3NHQ1R2U1dTU1NtenJOY1JCYg?oc=5","src":"KLFY","published":"2026-08-25T23:39:40.114320+00:00"},{"t":"Starlink offers discounted service to residents near the new site","s":"Starlink is offering steeply discounted service to households near the Louisiana site, part of the community package SpaceX outlined alongside coastal restoration commitments.","url":"https://news.google.com/rss/articles/CBMiowFBVV95cUxPejFlamtRaVpyWnFXU1hLdTN0anNNcW9TZU1NWC15TGo3S0o3UnBINHl4eDJRenRnSkVWSk1ubDVRNnNKQVh4YWdTc1dBQXhPb01nRkk2VVFhMW5QU21QNWFjM19JejdneTZ2RnozZ0ktRlF4bXRfMkZEcFJCS0JTSVBCdDJOQWR3U3hjalM0Qkt0SHhUOE5RRWFtS3c5WkhLNmpN?oc=5","src":"PCMag","published":"2026-08-25T22:57:40.114320+00:00"}],"elonNewsUpdated":"2026-08-26T02:10:27.578737+00:00","mind":{"updated":"2026-08-26T02:06:25.363452+00:00","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"A PIEZO2 variant reveals how the body's touch sensor fails","s":"Nickolls and colleagues identified an inherited hypomorphic variant in PIEZO2 in patients with impaired touch and body awareness, then showed structurally how the variant stops the channel opening under membrane deformation. Peer-reviewed in Neuron.","url":"https://www.cell.com/neuron/fulltext/S0896-6273(26)00612-4","published":"2026-08-24T00:00:00+00:00","src":"Neuron (Cell Press)","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"proven","verdict":"Mechanotransduction resolved down to structure","basis":"Clinical variant plus structural and electrophysiological characterisation"}},{"t":"Depression disrupts the birth of new neurons in the hippocampus","s":"A large study found that adults with depression show disrupted production of new neurons in the hippocampus, the region that separates new experiences from stored ones. The authors argue that weakened neurogenesis could be why depressed people struggle to keep a fresh experience distinct from a painful memory rather than collapsing the two together. Peer-reviewed human work, reported via ScienceDaily.","url":"https://www.sciencedaily.com/releases/2026/08/260824065533.htm","published":"2026-08-25T05:24:00+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Depression shown to blunt neurogenesis","basis":"Large human study of hippocampal neurogenesis markers in depression"},"eli":"In depression the brain seems to make fewer new cells in the area that keeps memories separate, which may be why old painful memories bleed into new experiences."},{"t":"The clinical SMA gene-therapy cassette shows no sensorimotor toxicity","s":"Nature Neuroscience reports that the SMN expression cassette used in the approved scAAV9 spinal muscular atrophy therapy does not produce the sensorimotor toxicity seen with some experimental constructs — an important safety result for a gene therapy already given to infants.","tag":"Neuroscience","imp":"important","glance":"SMA gene therapy safety confirmed","url":"https://www.nature.com/articles/s41593-026-02411-z","published":"2026-08-24T00:00:00+00:00","src":"Nature Neuroscience","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Reassuring safety data on a live therapy","basis":"Peer-reviewed Nature Neuroscience; preclinical models of the clinical construct"}},{"t":"Alzheimer's biggest risk gene shrinks neurons years before memory fails","s":"Researchers found that APOE4 raises levels of a protein called Nell2, which shrinks neurons and degrades memory circuits well before any symptom appears — offering a mechanism for why the gene is so damaging rather than just a statistical association. Peer-reviewed, but the work is in mice, so the human timeline is unestablished.","url":"https://www.sciencedaily.com/releases/2026/08/260823014945.htm","published":"2026-08-23T20:30:00+05:30","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"A mechanism behind the biggest risk gene","basis":"APOE4 to Nell2 to neuronal shrinkage shown in mice, peer-reviewed"},"eli":"One gene, APOE4, makes Alzheimer's far more likely. Nobody knew quite why. It turns out it raises a protein that makes brain cells physically shrink, and that starts long before anyone notices memory trouble — which is exactly when a treatment would need to arrive."},{"t":"The brain signals a coming relapse before the drinking restarts","s":"Mice that developed compulsive drinking after a period of abstinence showed more than double the normal activity in a stress-and-addiction region — and crucially the signal appeared before they drank again, not after. Animal work, but a pre-relapse marker is a different kind of target from treating relapse once it has happened.","url":"https://www.sciencedaily.com/releases/2026/08/260823014820.htm","published":"2026-08-23T08:00:00+05:30","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Relapse announces itself in advance","basis":"Doubled activity in stress-addiction region preceded relapse drinking in mice"}}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"Nothing new today in this area","s":"No Major or Historic peer-reviewed result surfaced in this area after scanning the full mind feed set and a targeted web sweep.","url":"","published":"","src":"","assess":{"mag":4,"timeline":"unclear","evidence":"proven","verdict":"No qualifying result today","basis":"Placeholder after a full fresh scan of config/mind_feeds.txt"}}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"Causal overclaiming found in 46% of social science papers","s":"An analysis of 194,631 social science articles found language asserting causation where the design supports only association in 46% of cases, with knock-on effects on how findings are cited and reported. Peer-reviewed in Nature Human Behaviour.","url":"https://www.nature.com/articles/s41562-026-02553-x","published":"2026-08-24T00:00:00+00:00","src":"Nature Human Behaviour","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Half of social science overstates causation","basis":"Systematic analysis of 194,631 articles with citation follow-through"}},{"t":"AI writing assistants shrink linguistic diversity and blur identity","s":"Two linked Nature Human Behaviour papers report that large language models used as writing assistants homogenise style, and that measured variance in writing complexity has dropped across social media, news and scientific text. The effect is not only aggregate: individual authorial identity becomes harder to distinguish once assistants are in the loop. Peer-reviewed in Nature Human Behaviour.","url":"https://www.nature.com/articles/s41562-026-02549-7","published":"2026-08-24T00:00:00+00:00","src":"Nature Human Behaviour","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Measurable flattening of how people write","basis":"Two peer-reviewed studies with corpus-level variance measurements"}},{"t":"Screen time at ages 1 and 6 tracks with weaker memory and school performance later","s":"A longitudinal cohort followed children from age 1 to age 8 and found that heavier viewing during infancy and around school entry was associated with lower academic performance at 9 and weaker working memory at 10.5 — while screen time at other ages mattered less. The finding is about timing, not just totals: some windows appear more sensitive than others.","tag":"Psychology","imp":"important","glance":"When screen time lands matters most","url":"https://www.sciencedaily.com/releases/2026/08/260823094152.htm","published":"2026-08-24T10:31:15+00:00","src":"ScienceDaily top","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Longitudinal, but still observational","basis":"Peer-reviewed cohort tracked ages 1-10.5; association, families differ in other ways"}}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Nothing new today in this area","s":"No Major or Historic peer-reviewed result surfaced in this area after scanning the full mind feed set and a targeted web sweep.","url":"","published":"","src":"","assess":{"mag":4,"timeline":"unclear","evidence":"proven","verdict":"No qualifying result today","basis":"Placeholder after a full fresh scan of config/mind_feeds.txt"}}]}]},"mindUpdated":"2026-08-26T02:10:27.578737+00:00","mindset":{"updated":"2026-08-26T02:09:40.114320+00:00","messages":[{"who":"Joseph Rodrigues","t":"21 Secrets of Self-Made Millionaires, Applied","vid":"N4CPebx4wDg","url":"https://www.youtube.com/watch?v=N4CPebx4wDg","gist":"He walks through Brian Tracy's 1990s '21 Secrets of Self-Made Millionaires' as a programme he actually ran on himself, from $50,000 of debt in 2004 to three businesses. The framing that matters is what he did with the material rather than the list itself: he refuses to take any programme on authority, running each claim through critical thought and his own intuition before adopting it, and treats the ideas as something to install by repetition rather than agree with once. The 'brainwashing' in the title is deliberate self-conditioning — choosing which inputs get to repeat until they become the default assumption you operate from."},{"who":"Elmer O. Locker Jr","t":"The Millionaire Mindset Is Wholeness, Not Acquisition","vid":"Zq0qbt8975E","url":"https://www.youtube.com/watch?v=Zq0qbt8975E","gist":"The claim is that the inner world creates the outer one, so a disturbance in your circumstances is not something to attack directly — it points back at what you have consented to be true about yourself. His practical instruction is Neville Goddard's: catch yourself through the day in a relaxed, unhurried state, notice your mood, and notice the inner dialogue producing it, because moods are forecasts rather than reactions. When something unwanted happens, the move is to meet it calmly with 'this is happening for my benefit' before the reflex judgement lands. He grounds this in an observer framing — that how you look at a thing shapes what you then experience of it — and says the honest starting point is simply to notice your moods before trying to change anything larger."},{"who":"Abraham Hicks","t":"This Is How You Break The Rules & Create Your Own","vid":"pTGPedUpYTE","url":"https://www.youtube.com/watch?v=pTGPedUpYTE","gist":"The core claim is that you never ask through words. A questioner describes a serpentine belt snapping during fast driving — and is walked through noticing it broke close to the dealership that sold the car, which had the part in stock. The reframe is that what manifests tells you which of your desires are actually active, rather than the other way round. The session closes with a caution about the 'virtual reality' exercise: if you go there to fix something that is going wrong, you carry the vibration of the problem in with you, and the tool stops working."}]},"mindsetUpdated":"2026-08-26T02:10:27.578737+00:00","youtube":{"count":24,"note":"24 of today's uploads across 267 subscribed channels, each with a takeaway pulled from its actual transcript. Ordered by what's most useful to know.","groups":[{"h":"🤖 AI & Technology","items":[{"t":"Dylan Patel – Two labs will soon control most of the world's workforce","s":"SemiAnalysis founder Dylan Patel argues compute is centralising fast: OpenAI and Anthropic took about 30% of compute added in 2026 and, on contracts already inked, will take 40-50% next year. Both labs crossed into profit because revenue per megawatt now runs far above the roughly $10-15m it costs to build, reaching about $50m for Anthropic, so inference profit funds training directly.","glance":"Revenue per megawatt now exceeds build cost by 3-5x, which is why the labs flipped from venture-funded losses to self-funding their own training runs.","vid":"aV26V1UvkJw","url":"https://www.youtube.com/watch?v=aV26V1UvkJw","published":"2026-08-25T15:57:53+00:00","src":"@DwarkeshPatel","chan":"@DwarkeshPatel","subject":"AI","short":false,"pointsLabel":"Segment takeaways","points":[{"t":"Compute centralisation","s":"Two labs went from ~2GW each at the start of 2026 to over 5GW, taking ~30% of all compute added this year and a contracted 40-50% next year."},{"t":"The economics flipped","s":"Serving GPT-4 on Hopper was gross-margin negative; today a megawatt costing $10-15m to build generates up to $50m in revenue, so inference funds training."},{"t":"CapEx trajectory","s":"About $1 trillion of AI capex this year, projected above $2 trillion by 2028, with labs taking a rising share of it."},{"t":"Supply chain bullwhip","s":"Memory and substrate vendors are raising prices fast while TSMC moves slowly, so costs rebalance unevenly across the chain."},{"t":"Who funds it","s":"By 2028 hyperscalers and their suppliers are raising hundreds of billions in debt; ordinary investors end up buying data-centre and lab debt instead of mortgages or government paper."},{"t":"Regulation as the brake","s":"Patel's view is that governments will restrict even internal deployment of frontier models, and that political constraint, not capability, is the likeliest slowdown."}]},{"t":"Mac Studio M5 Ultra is a DGX Spark Killer for Local AI","s":"The reviewer argues the 512GB M5 Ultra Mac Studio is the first Apple machine that makes hard economic sense for local AI: getting 512GB at roughly 1.2TB/s effective bandwidth any other way is drastically more expensive, and he expects text generation faster than a 4090 with prefill around double a DGX Spark.","glance":"For local AI the number that matters is 96GB of usable VRAM — past that you can run serious models, and everything above is about how cheaply you reach the bandwidth.","vid":"UYluMX7UznE","url":"https://www.youtube.com/watch?v=UYluMX7UznE","published":"2026-08-25T23:17:17+00:00","src":"@DigitalSpaceport","chan":"@DigitalSpaceport","subject":"AI","short":false},{"t":"EXCLUSIVE: Sonar's GM on Why 40% AI-Written Code Is Creating a Security Crisis in Enterprises","s":"Sonar's general manager argues the bottleneck has moved from writing code to reviewing it: with roughly 40% of new code machine-generated, familiar vulnerability classes are re-entering codebases faster than teams can retire them, and review capacity has not scaled with generation.","glance":"When AI writes 40% of your code, the scarce resource stops being engineering hours and becomes review capacity — that is where the security debt accumulates.","vid":"-l9g4LcmZhI","url":"https://www.youtube.com/watch?v=-l9g4LcmZhI","published":"2026-08-25T12:30:32+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"AI","short":false},{"t":"ALERT: Anthropic's Hiring Test Asks If You'd Destroy Billions to Make AI Safer","s":"Axios reports every Anthropic candidate goes through a culture interview asking, in effect, what they would do if a safety decision destroyed shareholder value — including a version where the company's stock goes to zero. The video notes the tension is real: employees hold equity, and Anthropic has already withheld an internal model that showed clear gains.","glance":"Anthropic screens candidates on whether they would accept a safety decision that wipes out their own equity — a test of mission over money.","vid":"kHN0krQ6IBo","url":"https://www.youtube.com/watch?v=kHN0krQ6IBo","published":"2026-08-25T10:00:37+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"AI","short":false},{"t":"How to Make AI Receptionist & Sell It for $497 Per Client","s":"A costed walkthrough of building and reselling an AI phone receptionist. Real all-in cost is roughly 7-23 cents a minute once you unbundle voice engine, text-to-speech, model tokens and telephony; the market pays 25-48 cents. The margin only exists on the $497 agency tier, because lower plans can only pass usage through at cost.","glance":"The business is the spread between a 7-23 cent true cost per minute and the 25-48 cents the market pays — but only the $497 plan lets you mark it up at all.","vid":"v741K7gBIq8","url":"https://www.youtube.com/watch?v=v741K7gBIq8","published":"2026-08-25T10:28:02+00:00","src":"@iamAImaster","chan":"@iamAImaster","subject":"AI","short":false}]},{"h":"🇮🇳 India, Business & Money","items":[{"t":"HUGE: UPI Hits 10 Years and Half the World's Real-Time Payments Now Run Through India","s":"UPI turned ten on 25 August. Annual transaction volume went from 1.78 crore in FY2017 to over 24,162 crore in FY2026, an almost 13,000-fold rise, across 741 live banks averaging 66 crore transactions a day. Person-to-merchant payments are 63% of volume, and 86% of merchant transactions are under ₹500.","glance":"UPI now carries close to half of the world's real-time digital payments, and 86% of its merchant transactions are under ₹500 — micro-commerce is what it actually digitised.","vid":"ZnwNHX4NAkE","url":"https://www.youtube.com/watch?v=ZnwNHX4NAkE","published":"2026-08-25T16:00:29+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"India","short":false},{"t":"ALERT: India Hands DRDO's Akash and Pinaka Missile Tech to Private Companies","s":"Rajnath Singh approved transferring the proven technology behind every DRDO-developed conventional missile system — Akash, Pinaka, Pralay and QRSAM among them — to Indian private firms for domestic production, subject to qualification and certification. The stated aim is getting MSMEs into the defence supply chain, against production targets of ₹1.75 lakh crore this year and ₹3 lakh crore by 2029.","glance":"This hands over field-proven missile technology rather than just opening the door to future private development — the test is whether Indian industry can scale it.","vid":"_XP-S_jjp-U","url":"https://www.youtube.com/watch?v=_XP-S_jjp-U","published":"2026-08-25T14:00:35+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"India","short":false},{"t":"BREAKING: TCS Acquires Porsche's MHP in €320M Deal to Build AI Mobility Empire","s":"TCS is acquiring 100% of Porsche's IT consultancy MHP at an enterprise value of €320 million, inside a five-year, €1.25 billion strategic partnership under which TCS builds a dedicated AI mobility centre of excellence for Porsche. MHP brings 4,500 specialists and €742 million of 2025 turnover and keeps its own brand.","glance":"TCS is betting €320m that Indian IT can out-engineer European auto consultancies on their own turf, with Porsche as the anchor client.","vid":"Zs8PwfPLyeE","url":"https://www.youtube.com/watch?v=Zs8PwfPLyeE","published":"2026-08-25T09:30:02+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"India","short":false},{"t":"BREAKING: Amit Shah Mandates AI Across All Indian Security Agencies to Fight Terror","s":"At the ninth National Security Strategy Conference, Amit Shah directed all security agencies to deploy AI for data analysis on the Multi-Agency Centre platform and to write standard operating procedures governing its use, alongside a zero-tolerance line on infiltration. Over 850 officers attended; day two covered drone threats, information warfare and a national biosecurity framework.","glance":"Indian counter-terrorism is being pushed from reactive policing toward predictive intelligence — and predictive models are only as good as district-level data discipline.","vid":"BdYiyPLPLNA","url":"https://www.youtube.com/watch?v=BdYiyPLPLNA","published":"2026-08-25T12:00:00+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"India","short":false},{"t":"ALERT: Gujarat Bets Factories and GIFT City Can Steal India's GCC Crown From Bengaluru","s":"Gujarat wants 250 global capability centres by 2030, up from fewer than 100, pitching GIFT City's decade-long income tax exemption and Dholera's semiconductor and data-centre build-out — 7.5GW of planned data-centre capacity, ₹6 lakh crore over three years, at least 51% renewable. The weak point it admits is talent depth.","glance":"Gujarat's GCC pitch is industrial: put the compute next to the factories so manufacturing simulation and automation run with low latency.","vid":"pEXRF6LV3n4","url":"https://www.youtube.com/watch?v=pEXRF6LV3n4","published":"2026-08-25T15:00:23+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"India","short":false},{"t":"EXPOSED: India's Data Center Boom Is Now So Crowded It May Be Its Own Biggest Risk","s":"CtrlS raised another ₹250 crore from two investors, two months after CPPIB committed up to ₹7,000 crore at a ₹44,824 crore pre-money valuation. CtrlS runs 19 data centres with 370MW live and 4.4GW in development. The wider rush includes Nxtra's $1.2 billion round, Sify's $5 billion plan and Yotta's mooted IPO — with analysts expecting Indian capacity to more than double this year.","glance":"India's data-centre capacity is set to more than double in a year, which raises the real question of whether power and demand arrive at the same time as the concrete.","vid":"ckvYjKH47Sk","url":"https://www.youtube.com/watch?v=ckvYjKH47Sk","published":"2026-08-25T15:30:06+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"India","short":false},{"t":"PM Modi Meets 20 Space Startup Founders | ISRO Structural Pivot | Front Page","s":"A wide-ranging front-page round-up: Modi met 20 space startup founders as ISRO restructures, alongside segments on India's semiconductor push, defence production and AI policy.","glance":"ISRO is restructuring around a private launch ecosystem, with the prime minister meeting 20 startup founders directly rather than through the agency.","vid":"rtL3dGchWas","url":"https://www.youtube.com/watch?v=rtL3dGchWas","published":"2026-08-25T03:44:44+00:00","src":"@aimmediahouse","chan":"@aimmediahouse","subject":"India","short":false,"pointsLabel":"Segment takeaways","points":[{"t":"Modi and the space startups","s":"The prime minister met 20 space startup founders as ISRO undergoes a structural pivot toward supporting private launch and satellite firms."},{"t":"ISRO restructuring","s":"The agency is reorganising to hand more operational launch work to industry while retaining deep-tech development."},{"t":"Domestic chips in orbit","s":"SCL Mohali chips are already flying — a camera chip on Chandrayaan-3's lander, radiation-hardened ADCs on Aditya-L1 and the Vikram processor in launch vehicles."},{"t":"The caveat","s":"The government's own PIB note says this does not mean every component is domestically made; it is specific hard-to-source parts that are proven and flying."}]}]},{"h":"🔬 Science & Space","items":[{"t":"Quantum Computing Failure Now Obvious","s":"Hossenfelder walks through a new paper by philosopher Amit Hagar showing that within 18 months, essentially every claimed quantum-advantage demonstration has been reproduced or shown reproducible on classical hardware — the exception being random-sampling tasks with no known use. She catalogues NISQ commercial-value predictions from Google (2017), IBM (2018), IonQ (2021) and BCG that all failed.","glance":"Every quantum-advantage claim so far has been matched classically within 18 months, and the only profitable quantum application to date has been forecasting quantum applications.","vid":"DX_oIQ-tA6M","url":"https://www.youtube.com/watch?v=DX_oIQ-tA6M","published":"2026-08-25T16:00:38+00:00","src":"@SabineHossenfelder","chan":"@SabineHossenfelder","subject":"Science","short":false},{"t":"SpaceX Announces $100 Billion Starbase Louisiana (full replay from today)","s":"Full replay of the SpaceX and Louisiana announcement. Starbase Louisiana in Vermilion Parish is designed clean-sheet for very high launch cadence, with its own propellant production, power generation, deep-water shipping, vehicle processing and probably an airport, using local natural gas as fuel feedstock. SpaceX commits to at least 3,000 permanent jobs, says the real number is likely closer to 10,000, and 60-80% of Texas hires have been local.","glance":"The site is designed for cadence, not for a pad: own propellant, own power, deep-water shipping — because thousands of Starship launches need a self-sufficient spaceport.","vid":"9vtD7uZYqKk","url":"https://www.youtube.com/watch?v=9vtD7uZYqKk","published":"2026-08-26T00:25:06+00:00","src":"@SolvingTheMoneyProblem","chan":"@SolvingTheMoneyProblem","subject":"Space","short":false},{"t":"Deploying Megapack At Scale","s":"A walkthrough of installing a 133MW / 266MWh Megapack project at Gigafactory Texas. Driven pier foundations speed placement, above-grade medium-voltage cable trays cut about 20% off the civil work, and Controller-Hardware-in-the-Loop testing compresses months of field commissioning into days of lab validation. The next-gen Megablock combines Megapack 3 with its medium-voltage transformer on a flexible bus bar.","glance":"Tesla treats the whole project as the product: hardware-in-the-loop simulation replaces months of on-site commissioning, which is how battery storage keeps pace with data-centre demand.","vid":"32C0_8_296k","url":"https://www.youtube.com/watch?v=32C0_8_296k","published":"2026-08-25T17:06:56+00:00","src":"@tesla","chan":"@tesla","subject":"Energy","short":false},{"t":"Why Australia’s Solar Is So Cheap (And Ours Isn’t)","s":"About one in three Australian homes have rooftop solar versus fewer than one in ten American ones, and a 7kW system costs a US median of $28,000 against a fraction of that in Australia. The gap is almost entirely non-hardware: Permit Power puts design, project management, sales, permitting, inspection and interconnection at 78% of US installed cost, spread across roughly 15,000 separate permitting jurisdictions.","glance":"Solar's cost problem in America is paperwork, not panels — 78% of installed cost is soft cost, and Australia's fix was making the credit automatic and the permit boring.","vid":"R3eEzdpi12I","url":"https://www.youtube.com/watch?v=R3eEzdpi12I","published":"2026-08-25T12:16:57+00:00","src":"@UndecidedTechnology","chan":"@UndecidedTechnology","subject":"Energy","short":false}]},{"h":"🧠 Health & Mind","items":[{"t":"Why Kids Can't Read Anymore","s":"A look at the reading crisis that pushes back on the headline numbers. On the US Nation's Report Card, advanced and proficient readers have barely moved; it is the basic-level readers who are collapsing, and the same divergence shows up across OECD countries. The argument lands on standardised testing incentivising narrow test-prep — up to 113 tests before graduation — plus the handwriting-versus-typing evidence that writing by hand activates memory and encoding regions typing does not.","glance":"The reading crisis is not a general decline but a widening gap: top readers hold steady while below-average readers fall away, which points at test-driven narrowing rather than screens alone.","vid":"tj7ckn8WhEM","url":"https://www.youtube.com/watch?v=tj7ckn8WhEM","published":"2026-08-25T15:16:06+00:00","src":"@ColdFusion","chan":"@ColdFusion","subject":"Learning","short":false},{"t":"Gurudev Sri Sri Ravi Shankar | This Past Weekend w/ Theo Von #677","s":"A long conversation with the Art of Living founder covering his childhood recitation of the Bhagavad Gita, what meditation is actually doing, and his account of chartering a plane to Cuba to sit with FARC commanders during the Colombian peace process after a meeting with President Santos ran 40 minutes over its scheduled five.","glance":"His practical claim is that peace work and meditation share a mechanism: you cannot negotiate with anyone, including yourself, from an agitated state.","vid":"_gfPQsRkacI","url":"https://www.youtube.com/watch?v=_gfPQsRkacI","published":"2026-08-25T14:11:47+00:00","src":"@TheoVon","chan":"@TheoVon","subject":"Mind","short":false,"pointsLabel":"Conversation takeaways","points":[{"t":"The Gita as handbook","s":"He frames the Bhagavad Gita as a practical manual on yoga and living rather than scripture to be revered, the way Gandhi used it."},{"t":"Colombia peace process","s":"After a five-minute handshake with President Santos ran to 50 minutes, he chartered a plane to Cuba to meet 15 FARC commandos who initially refused to talk to a spiritual leader."},{"t":"Meeting ideology with practice","s":"The commanders' objection was that their philosophy was Marxist; his approach was to offer breathing and meditation practice rather than argue doctrine."},{"t":"Attention as a young prodigy","s":"Asked about reciting ancient text at four and the attention that followed, he says it simply felt normal at the time."}]},{"t":"The mind is not the problem. The way you use is... | Satya Speaks| Unleash the Power of Mind","s":"The argument is that spiritual practice does not mean discarding the mind but separating the functional mind from the psychological one. Functional thoughts are practical sparks telling you to act; psychological thoughts are fantasies and fears about past and future that interrupt them. The prescribed exercise is to write your thoughts down daily and sort them into the two columns.","glance":"Write your thoughts down and sort them: the practical ones name an action you can take today, and everything else is the psychological mind interrupting.","vid":"BclSghF0BTw","url":"https://www.youtube.com/watch?v=BclSghF0BTw","published":"2026-08-25T13:30:39+00:00","src":"@Satya_Speaks","chan":"@Satya_Speaks","subject":"Mind","short":false},{"t":"The living world is forcing scientists to rethink purpose | Alan Love: Full Interview","s":"Philosopher of science Alan Love on why biology censored purpose-talk for a century — teeth 'for' chewing sounded like an argument for design — and why it is coming back with a rigorous grounding. He works through the plover's broken-wing display, cancer as cells taking on independent agency that has lost its organisational context, and whether AI agents are agents in the sense organisms are.","glance":"Cancer read as agency is not a metaphor with no cash value: it reframes the disease as cells that lost the organisational context telling them what they are for.","vid":"zmmAxAgVExU","url":"https://www.youtube.com/watch?v=zmmAxAgVExU","published":"2026-08-25T13:00:29+00:00","src":"@The-Well","chan":"@The-Well","subject":"Ideas","short":false},{"t":"Business of writing books from your heart will bring the greatest earning in coming days","s":"The pitch is that AI makes genuinely original books more valuable, not less. Because AI-written books recombine existing material, a book built from your own recorded experience becomes scarce. His practical method is to speak the ideas out, transcribe them, then edit into text — and his filter is Tagore's, that you should not write novels before forty because you lack the accumulated feeling.","glance":"His concrete method: record yourself talking through an idea, transcribe it, then edit — originality comes from the experience being yours, not from the writing being slow.","vid":"FER1ZFWMcpk","url":"https://www.youtube.com/watch?v=FER1ZFWMcpk","published":"2026-08-25T13:00:30+00:00","src":"@AnirbanBandyopadhyay","chan":"@AnirbanBandyopadhyay","subject":"Ideas","short":false}]},{"h":"🛠️ Gear & Reviews","items":[{"t":"reMarkable Paper Pure review: a flawless pad-and-pen experience","s":"The Paper Pure is reMarkable's cheapest e-notebook at $399 with the standard marker, or $449 with the Marker Plus that has an eraser end. It keeps the 226 PPI monochrome E Ink panel and 21ms stylus latency but drops to a plastic chassis and, critically, has no front light. At 360g and 6mm it is more portable than both the Paper Pro and the reMarkable 2.","glance":"Writing feel is unchanged from pricier models, but there is no front light — so it is a daylight-and-desk device, and the Marker Plus eraser is the upgrade worth paying for.","vid":"Hefg6kYga3g","url":"https://www.youtube.com/watch?v=Hefg6kYga3g","published":"2026-08-25T20:18:32+00:00","src":"@techradar","chan":"@techradar","subject":"Gear","short":false},{"t":"Lucid’s Lawyers Called Me After I Bought Their $140,000 Car for $4,100","s":"After buying a wrecked $140,000 Lucid Air for $4,100, Rich found the car was not software-locked as expected, but its high-voltage battery had sat at effectively zero — the state lithium packs often do not recover from. Lucid's legal team responded to his earlier video about another owner told his car needed a full reshell: 187 hours of labour and over $20,000 in parts, quoted before Lucid had seen the vehicle.","glance":"The right-to-repair question here is concrete: a manufacturer quoted a $20,000 reshell on a car it had never inspected, and the independent repair path turns on whether a dead pack will take a charge.","vid":"-_yQfj0g2zw","url":"https://www.youtube.com/watch?v=-_yQfj0g2zw","published":"2026-08-25T19:31:40+00:00","src":"@RichRebuilds","chan":"@RichRebuilds","subject":"Gear","short":false},{"t":"FERRARI PRICES HAVE GONE INSANE!","s":"A discussion of the collector market spike, anchored on a $40 million charity sale. The sharpest move is in gated manual cars: a manual F430 that was $90,000-$110,000 a year ago now trades near $300,000, and a 355 that could be had under $100,000 is around $250,000.","glance":"The premium has concentrated in gated manual transmissions specifically — the same cars in paddle-shift trim have not moved anywhere near as far.","vid":"E8WneBs7XR8","url":"https://www.youtube.com/watch?v=E8WneBs7XR8","published":"2026-08-25T15:00:34+00:00","src":"@ProducerMichael","chan":"@ProducerMichael","subject":"Gear","short":false}]}]},"costs":{"updated":"2026-08-26T01:39:41+00:00","items":[{"key":"usdinr","label":"USD/INR","unit":"INR","value":95.42,"delta":-0.34,"delta_pct":-0.3551,"dir":"down","asof":"2026-08-25","src":"Frankfurter (ECB ref)","url":"https://www.frankfurter.app/","stale":false},{"key":"brent","label":"Brent crude","unit":"USD/bbl","value":86.33,"delta":-2.25,"delta_pct":-2.54,"dir":"down","asof":"2026-08-26","src":"Markets Insider (indication)","url":"https://markets.businessinsider.com/commodities/oil-price?type=brent","stale":false,"note":"Intraday delayed indication (~15 min), not settlement"},{"key":"lead","label":"Lead (LME cash)","unit":"USD/tonne","val /* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

function story(it,opts){

    ((it.points&&it.points.length)?`<details class="pts"><summary>${esc(it.pointsLabel||(it.points.length+" key takeaways"))}</summary>${it.points.map(p=>`<div class="pt"><span class="pt-t">${esc(p.t)}</span>${p.s?`<span class="pt-s">${esc(p.s)}</span>`:""}</div>`).join("")}</details>`:"")+

async function askQuestion(c,input){
  const q=(input.value||"").trim(); if(!q) return;
  const it=(typeof STORY!=="undefined"&&STORY.get)?STORY.get(c):null;
  const __ep=(typeof askEndpoint==="function")?askEndpoint():"";
  if(!(window.cowork&&window.cowork.askClaude) && !__ep){
    input.value="";
    const box0=c.querySelector(".more");
    if(box0){ const n=document.createElement("p"); n.className="exp qa"; n.innerHTML=`<span class="q">${esc(q)}</span>Opening web results in a new tab. <span style="opacity:.65">Enable inline AI in \u22ef \u2192 \u201cAsk AI setup\u201d.</span>`; box0.appendChild(n); }
    const ctx=(c.dataset.title||(it&&it.t)||"");
    window.open("https://www.google.com/search?q="+encodeURIComponent(ctx+" \u2014 "+q),"_blank","noopener");
    return;
  }
  input.value="";
  const box=c.querySelector(".more"); const p=document.createElement("p");
  p.className="exp qa loading"; p.innerHTML=`<span class="q">${esc(q)}</span>thinking…`; box.appendChild(p);
  const fmt=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n+/g,"<br>");
  const parts=[];
  const T=c.dataset.title||(it&&it.t)||""; if(T) parts.push("HEADLINE: "+T);
  const S=c.dataset.summary||(it&&it.s)||""; if(S) parts.push("SUMMARY: "+S);
  if(it){
    if(it.why) parts.push("WHY IT MATTERS: "+it.why);
    if(it.eli) parts.push("IN PLAIN TERMS: "+it.eli);
    if(it.assess){const a=it.assess;parts.push("RATING: magnitude "+a.mag+"/5, timeline "+a.timeline+", evidence "+a.evidence+(a.verdict?"; verdict “"+a.verdict+"”":"")+(a.basis?" (basis: "+a.basis+")":""));}
    if(Array.isArray(it.facts)&&it.facts.length) parts.push("KEY FACTS: "+it.facts.map(f=>f.l+": "+f.v).join("; "));
    if(it.src) parts.push("SOURCE: "+it.src);
    if(it.url) parts.push("LINK: "+it.url);
    const pd=pubDate(it); if(pd) parts.push("PUBLISHED: "+pd);
  }
  const prior=[...box.querySelectorAll(".qa")].filter(x=>x!==p&&!x.classList.contains("loading")).slice(-3).map(x=>x.textContent.replace(/\s+/g," ").trim()).filter(Boolean);
  const priorTxt=prior.length?"\n\nEARLIER IN THIS THREAD:\n- "+prior.join("\n- "):"";
  const today=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:"";
  const prompt=`You are a sharp, helpful research assistant answering a reader's question about ONE item in their personal daily dashboard${today?" (today is "+today+")":""}.

ITEM CONTEXT:
${parts.join("\n")}${priorTxt}

READER'S QUESTION: "${q}"

Answer the reader's question directly in 2-4 sentences, leading with the answer. Draw on BOTH the item context above AND your own broader knowledge — specific names, numbers, dates and background — to give a genuinely useful reply. Do NOT say the summary/context \"doesn't mention\" or \"doesn't say\" something: if a detail isn't in the context, answer it from what you already know instead. Only if you genuinely cannot answer at all should you say so briefly and point to the source link. Neutral and factual; no preamble, no bullet lists.`;
  try{ let text;
    if(window.cowork&&window.cowork.askClaude){ const res=await window.cowork.askClaude(prompt,it?[it]:[]);
      text=typeof res==="string"?res:(res&&(res.text||res.content||res.output))||JSON.stringify(res);
    } else { const rr=await fetch(__ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, url:(it&&it.url)||"", title:(c.dataset.title||(it&&it.t)||"")})});
      let jj={}; try{ jj=await rr.json(); }catch(e){}
      if(!rr.ok) throw new Error((jj&&jj.error)||("HTTP "+rr.status));
      text=jj.text||jj.answer||(jj.content&&jj.content[0]&&jj.content[0].text)||JSON.stringify(jj); }
    p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>${fmt(String(text).trim())}`;
  }catch(e){ p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>Couldn't answer right now — ${esc(String((e&&e.message)||e))}. Try the source link.`; }
}

function heroPick(items){ const real=(items||[]).filter(isRealItem); if(!real.length) return null;
