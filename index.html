ce-the-frontier/", "glance": "Labs agree on outside auditors for the first time", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Verifiable auditing replaces self-reporting", "basis": "Anthropic commits to embedded third-party evaluators; Altman and Musk publicly endorse"}}, {"t": "OpenAI claims a Navier-Stokes solution", "s": "OpenAI says an internal model beyond GPT-6 Astra produced a solution to the Navier-Stokes regularity problem — a Millennium Prize problem open for about 90 years — constructing a whirlpool whose vortex stretches to infinite speed in finite time, i.e. a genuine blowup. Mathematicians are publicly unhappy about the framing and verification. Use case: if it holds, AI-assisted proof moves from Olympiad problems to open research mathematics.", "heat": 93, "delta": "cooling", "sources": 4, "url": "https://twitter.com/lemire/status/2098497422297039012", "glance": "AI-produced proof of a 90-year-old open problem", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "Frontier AI reaches open research mathematics", "basis": "OpenAI internal model output; solution published, community verification still contested"}}, {"t": "Google DeepMind ships AlphaGenome Atlas", "s": "DeepMind used AlphaGenome to predict the effect of every possible single-letter mutation in the human genome — about 9 billion variants — producing a one-petabyte lookup database over 30 times larger than the AlphaFold database, plus an AVI impact score to rank which variants are worth investigating. It has already found 22% more genetic associations in UK Biobank data and helped resolve a previously unsolved rare disease. The 98% of the genome that does not code for protein is the part this makes searchable.", "heat": 91, "delta": "new", "sources": 4, "url": "https://deepmind.google/discover/blog/", "glance": "Every human single-letter mutation, precomputed and searchable", "assess": {"mag": 5, "timeline": "now", "evidence": "strong", "verdict": "Turns the dark genome into a lookup table", "basis": "9B variant predictions, 1PB, 30x AlphaFold DB; +22% associations found in UK Biobank"}}, {"t": "DeepSeek 4.1 Flash tops the open-model field", "s": "DeepSeek's 4.1 Flash is a 552B-parameter mixture-of-experts model with only ~8-16B active per token, and a genuinely unusual architecture — separate encoder and decoder, an n-gram component, sliding-window attention and a new CSA-2 attention. It scores 74.2 on Deep Suite 1.1, ahead of GPT-6 Astra, runs at ~217 output tokens/sec, and is open-weights at roughly 510GB (community quantisations from ~106GB). Use case: frontier-adjacent capability you can self-host, at the lowest cost per token available.", "heat": 89, "delta": "rising", "sources": 5, "url": "https://news.google.com/rss/articles/CBMi9gFBVV95cUxOc212YzVCcW5PZnlQdzFXVUtNSkkyWk15TUVyWTRrWkY5eXRmV29sZGVXZnc1TUI5Vjk2TG05R0JZeXRSMkFpODI4NUZqRFF5TVBWM1B3SzZvS1lTWmVnNTFBOUhVZzR5Wm5BSEdweE5kZHlGb2Y3Ti1aRU9OX1RyblBjX0RGek9QcUwwVXNuVjN2UzZENktYenlFS3JNQm9XbVptNUVXZG9pNUt1UGNPZkhYNmRlcHVxMFI2Vk1uRXhWWWxsQkF3b0hFM21BcjFyVXpuaVZSTi1RcllUY2Y3T2VEN0RjcVhSMEo5YnNVSlJHZEYzY2c?oc=5", "glance": "Self-hostable model at frontier-adjacent quality", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Cheapest frontier-adjacent model is open", "basis": "552B MoE, 8-16B active, 74.2 Deep Suite 1.1, ~217 tok/s, open weights released"}}, {"t": "Nvidia may put $10B into Anthropic's IPO", "s": "The Information reports Nvidia is considering an investment of up to $10 billion in Anthropic's IPO. Chip supplier taking a double-digit-billion equity position in a model lab it also sells to is the circular-financing pattern regulators have started asking about, and it sets a floor expectation for the listing.", "heat": 80, "delta": "new", "sources": 2, "url": "https://news.google.com/rss/articles/CBMijAFBVV95cUxPanhYMm9pOXE3WXJmUWl3M2pjQ3ZVakF6QlN5dnhiY0hUaUVBOUhUMzFlZ1pfbUtGVm5iQV9LeWJPYXFfRVUtZGZUTC1pX3hGMGFHUUttNEVRV21wd3llSHE0QV85S19Jc3k5c2ZTN0JYdjBDdktjcFBqcFF1MnFKT0pWRHA1OXZSRlpEYg?oc=5", "glance": "Chipmaker buying into its own customer's listing", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Circular AI financing gets bigger", "basis": "The Information reports Nvidia weighing up to $10B in Anthropic's IPO"}}, {"t": "No OpenAI IPO in 2026, Altman says", "s": "Altman told Fortune that going public in 2026 would be 'ill-advised' despite OpenAI having filed confidentially, and separately called AI extinction risk 'unacceptable'. For anyone modelling the AI capital cycle, the largest expected listing just moved out of the window.", "heat": 78, "delta": "new", "sources": 4, "url": "https://www.theverge.com/ai-artificial-intelligence/994384/sam-altman-no-openai-ipo-ill-advised", "glance": "The biggest expected AI listing slips", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "OpenAI listing pushed past 2026", "basis": "Altman, Fortune interview: IPO in 2026 'ill-advised'; company has filed confidentially"}}, {"t": "Grok lands inside Microsoft Copilot and M365", "s": "xAI's Grok is now selectable inside Microsoft Copilot and Microsoft 365, putting a third model family alongside OpenAI's in Microsoft's enterprise surface. Tesla is separately adding Grok text messaging. Use case: enterprises on M365 get model choice without a separate procurement.", "heat": 72, "delta": "new", "sources": 3, "url": "https://news.google.com/rss/articles/CBMicEFVX3lxTE9HUXNYdEZ3LW84RzVsMFZKZm5ZZnZ0Umc4MTlxbjI3WHNRbkF3Q2FKdGNVWXd4d2NsXy14a2NfUkJEakttOFV5ZmlBNHJMQUtRU1RmOGoyQ1VLVVBLZzZzVFhLM3lta2dnZks3NXlMbFY?oc=5", "glance": "Grok becomes an M365 model option", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Microsoft goes multi-model in Copilot", "basis": "Grok models available in Microsoft Copilot / M365; Tesla adding Grok messaging"}}, {"t": "Tencent's speech model edits audio like an image", "s": "Tencent released an audio model that does text-to-speech with described voices, zero-shot cloning from a few seconds, and — the new part — micro-editing of existing recordings: insert or delete words seamlessly, change emotion, change timbre, whisper a line, denoise, upsample. It is about 6.12GB, small enough for consumer GPUs, and open. Use case: post-production fixes to recorded speech without a re-record; also the clearest voice-fraud capability jump this year.", "heat": 70, "delta": "new", "sources": 2, "url": "https://github.com/Tencent", "glance": "Word-level editing of recorded speech, open and local", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Recorded speech becomes freely editable", "basis": "Open 6.12GB model: insertion/deletion, emotion and timbre transfer, denoise demonstrated"}}, {"t": "Moonshot's Kimi K3 undercuts US labs at scale", "s": "Moonshot AI is targeting $2 billion revenue as Kimi K3 undercuts US rivals on price; OpenRouter data shows as many as 300 billion tokens a day generated by K3 models on that system alone, even as usage has slipped slightly in recent months. Use case: the price floor for capable inference is being set in China.", "heat": 68, "delta": "steady", "sources": 3, "url": "https://news.google.com/rss/articles/CBMivwFBVV95cUxPMDhIVDBwOFpsTDBsWEFSaDhpMnlaMDZ2VkZPZmp1YkNOdjdreXIwcVVTUzBqbXJJQTFzM05lTWxUd1F6em9BYXZZWlJadTBkTHV0SGIwTl9HdVVTZWl6UUFwSmFTSkFWb1BjX1RQQXpnQWdkRTFqYmlDMmx5eUdfU0JoSjJ4dHNkb3ViNk9UdUNyUWlOdDlfeGMtOFZZbnRxZzBXLTBjYWVGMUJrTFlFSFNDWnZnNExKOS16ckRxdw?oc=5", "glance": "Chinese labs are setting the inference price floor", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Price competition moves to Chinese models", "basis": "OpenRouter: ~300B tokens/day on K3; Moonshot targeting $2B revenue"}}, {"t": "IIT Madras and Nvidia open-source Indic language models", "s": "Bodhan AI at IIT Madras, with Nvidia, released open AI models for Indian languages covering speech, translation and text as part of a Bharat EduAI stack. Use case: Indian-language speech and translation that can be self-hosted and fine-tuned locally, for education delivery in particular.", "heat": 65, "delta": "new", "sources": 2, "url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxNVVgxM1d0S181LTVDMHhmMElVUUxhbnpjZ3RrNWFNSkpnSUxKWjJfVU9HNk9DUTBUX0o3TWJHbkZTMlpWRVI0Slh0OEdyTlhZb2Q3bmFpNGdlRVU4dVUxRURLN19BWmVvRlAtQnJaVHZQYVRpTkJDY1dHWW4taWZlclBlRXhsWm9HSUF0dkhKaVdjeTRWbENaeFdiZnJ5Z1psSy0zR3JxWW1td9IBtwFBVV95cUxOVkpycE42RU5kQ01RUWNtUjZOUkRlT2s0elRmbDhFZnpiVFdaTThmUjZMMlFBZmh4VUdicDk5cC1zLW5hN0w0LVRWMlRudjlCN0hnVkF6T2d6WEdoXzhRWVBBdW5RMGVONE5jM0hRa0RFeHBHekl5ZTVFa2ZfeHRaWjhWSmlGdVZGem0tUEczaWRCcHN6YUhVeGpDdU4xU3hmVkRUdTFOMzl0a0JBR0JhWTNYSFViVGM?oc=5", "glance": "Open Indic-language speech and translation models", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Indic-language AI gets an open base", "basis": "Bodhan AI (IIT Madras) + Nvidia release open Indic speech/translation/text models"}}, {"t": "Meta sued over training AI glasses on users' photos", "s": "A class action alleges Meta used Facebook and Instagram photos to train AI for its smart glasses without adequate consent. It is the first major suit aimed at the training-data provenance of a shipped consumer AI hardware product rather than a chatbot.", "heat": 62, "delta": "new", "sources": 3, "url": "https://news.google.com/rss/articles/CBMizgFBVV95cUxNLWZKc0ZCZkFmZHpyQUtPWFZQRU9yUWJjWUlJQlJxVWxkQWFLNHFCR19CMUZGQmY5bW9TWXdnVHpLbkhxWFE3ZHhmSXQwRVFvYi10ZmZJYVFtam53bnQ5LUZqazBneHFYS3ZrTkVWY3F4T1NHSE5ydWpFWi1LNnZMbzN1SVNyNUQtMzJmNUJrOG41UkZSVHBqeWVubk5paEJuM2pRb0oteUJZNWNBRUN1c3V6clQ3WVBVcG1teEw0TGVSNnhTR1ZoRFdtWFJkQdIBygFBVV95cUxQLXJGZUFrNzZZbnMzeE80R0NGcmZZa1NhWWszZXZWeVJwSERVNE5jU093UHhyUURvMXlDZFJYRHowOWQ1YW1oZ3hEVzFKNmNFVGVHNWc0X19zdkRkTmdSUXVrMUhGVGlVNTRGNjR1LVhUWnhoTVBtbnBwUVdNU0ozYlpjTU9xVVJsZjhwelg1bTY5cWdsXzJWLV96NnhLQkxFZGRyV1NIeExnVUo5YXNVb2szLU1nTmljMExLcUo2WlVUWEJPZklEbzR3?oc=5", "glance": "Training-data provenance reaches AI hardware", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Consent fight moves to AI devices", "basis": "Class action alleges Meta trained smart-glasses AI on Facebook/Instagram photos"}}, {"t": "Perplexity runs production systems on GPT-6 Astra end-to-end", "s": "Perplexity says it uses GPT-6 Astra to write communications, change software and monitor production systems, checking in far less often than with earlier models. Use case: a named company describing unsupervised agent operation of production infrastructure, which is the capability claim that matters more than benchmark deltas.", "heat": 58, "delta": "new", "sources": 2, "url": "https://openai.com/index/perplexity-improving-accuracy-with-astra", "glance": "Agents running production with light supervision", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Agentic ops with reduced human check-in", "basis": "Perplexity: Astra writes comms, changes software, monitors production systems"}}, {"t": "Y Combinator's Garry Tan pushes US labs to distill frontier models", "s": "Tan argued US open-weight labs should distill American frontier models the way Chinese labs have, to give the US a more robust open-weight ecosystem rather than ceding it. Use case: it is an explicit call to change what US labs permit in their terms, not just what they publish.", "heat": 55, "delta": "new", "sources": 2, "url": "https://techcrunch.com/2026/09/11/y-combinators-garry-tan-wants-u-s-open-weight-ai-labs-to-distill-frontier-models-too/", "glance": "A US answer to Chinese open-weight distillation", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Open-weight strategy becomes policy argument", "basis": "Tan: US open-weight labs should distill US frontier models to match Chinese practice"}}]}, "aitrendsUpdated": "2026-09-13T16:28:25Z", "science": {"updated": "2026-09-13T16:28:25Z", "items": [{"t": "Cobalt silicide nanoflakes conduct 10x better than copper at chip scale", "s": "Copper interconnects — a state-of-the-art chip carries over 100 km of them — get worse as they shrink, because electrons scatter off the wire surfaces. Physicists reporting in Nature Materials made single-crystal cobalt silicide (CoSi) nanoflakes and found the opposite behaviour: thinning them from 1 micrometre to about 20 nanometres cut resistivity by an order of magnitude, because quantum surface states carry current with less scattering. A 20 nm CoSi flake was ten times less resistive than copper of the same thickness. Peer-reviewed, but demonstrated on lab-grown single crystals, not in a fab process.", "tag": "Materials", "imp": "critical", "glance": "Copper's chip-wiring replacement demonstrated", "url": "https://www.sciencealert.com/strange-material-gets-better-at-conducting-electricity-the-thinner-it-gets", "published": "2026-09-13T15:00:00Z", "src": "Nature Materials (via ScienceAlert)", "assess": {"mag": 5, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A credible successor to copper wiring", "basis": "Nature Materials: single-crystal CoSi at 20 nm shows 10x lower resistivity than copper"}, "eli": "Chips are wired with copper. The thinner you make copper wire, the more electricity it wastes — that is now the main thing holding chips back. This new cobalt-silicon material does the reverse: the thinner it gets, the better it conducts."}, {"t": "First oral disease-modifying drug for transfusion-dependent thalassaemia clears phase 3", "s": "The ENERGIZE-T trial, a double-blind randomised placebo-controlled phase 3 published in The Lancet, found mitapivat significantly cut the transfusion burden in adults with transfusion-dependent alpha- or beta-thalassaemia, with a favourable benefit-risk profile. Thalassaemias are the most common monogenic inherited diseases; severe forms mean lifelong transfusions and the iron overload that follows, causing cardiomyopathy, diabetes and endocrine damage. This is the first oral disease-modifying option for this group — directly relevant in India, where the beta-thalassaemia carrier burden is among the world's largest. Peer-reviewed phase 3.", "tag": "Health", "imp": "critical", "glance": "First oral thalassaemia drug works", "url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)00874-3/fulltext?rss=yes", "published": "2026-09-12T00:00:00Z", "src": "The Lancet", "assess": {"mag": 5, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "Oral therapy replaces part of lifelong transfusion", "basis": "Lancet phase 3 ENERGIZE-T: randomised, placebo-controlled, met transfusion-burden endpoint"}}, {"t": "CAR T-cell therapy puts treatment-refractory rheumatoid arthritis into drug-free remission", "s": "Researchers at Charité in Berlin redirected CD19 CAR T-cells — the technology built for blood cancers — at the disease-driving B cells that hide in lymph nodes, bone marrow and joint tissue and keep restarting rheumatoid arthritis. In patients who had failed repeated advanced biologic and targeted therapies, a single infusion produced lasting remission with no ongoing medication. The point is that it removes the cells causing the disease rather than permanently suppressing the immune system. Early-stage: a small investigator-led trial in a handful of patients, not a randomised phase 3.", "tag": "Health", "imp": "critical", "glance": "CAR-T resets severe rheumatoid arthritis", "url": "https://scitechdaily.com/scientists-used-cancer-therapy-to-reset-rheumatoid-arthritis/", "published": "2026-09-13T10:51:14Z", "src": "Charité Berlin (via SciTechDaily)", "assess": {"mag": 5, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Autoimmune disease reset, not just suppressed", "basis": "Charité trial: single CD19 CAR-T infusion, drug-free remission in refractory RA patients"}}, {"t": "Ivonescimab beats pembrolizumab on overall survival in first-line lung cancer", "s": "A prespecified interim analysis of the phase 3 HARMONi-2 trial, presented at the IASLC 2026 World Conference on Lung Cancer, found the bispecific antibody ivonescimab significantly prolonged overall survival versus pembrolizumab as first-line treatment in PD-L1-positive advanced non-small cell lung cancer. Pembrolizumab has been the global standard of care in this setting for years; an overall-survival win against it in a randomised phase 3 is what changes practice, not just progression-free endpoints.", "tag": "Health", "imp": "critical", "glance": "Bispecific beats the lung-cancer standard", "url": "https://medicalxpress.com/news/2026-09-ivonescimab-significantly-survival-pembrolizumab-advanced.html", "published": "2026-09-12T21:50:08-04:00", "src": "IASLC WCLC 2026 (via MedicalXpress)", "assess": {"mag": 5, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "New first-line standard for PD-L1+ lung cancer", "basis": "Phase 3 HARMONi-2 interim: OS superiority vs pembrolizumab, PD-L1+ advanced NSCLC"}}, {"t": "Adding immunotherapy around surgery nearly doubles event-free survival in operable lung cancer", "s": "Final results from the phase 3 IMpower030 trial: patients with resectable stage II-IIIB non-small cell lung cancer given perioperative atezolizumab plus platinum chemotherapy had median event-free survival of 62.8 months, against 34.9 months for chemotherapy alone. That is a near-doubling in the curable-intent setting, where the whole question is whether the cancer comes back after the operation. Peer-review-stage data presented at WCLC 2026.", "tag": "Health", "imp": "critical", "glance": "Immunotherapy doubles post-surgery lung outcomes", "url": "https://medicalxpress.com/news/2026-09-perioperative-atezolizumab-chemotherapy-event-free.html", "published": "2026-09-12T05:20:08-04:00", "src": "IASLC WCLC 2026 (via MedicalXpress)", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Changes standard care around lung surgery", "basis": "Phase 3 IMpower030 final: median EFS 62.8 vs 34.9 months, resectable stage II-IIIB NSCLC"}}, {"t": "Two B7-H3 antibody-drug conjugates both beat chemo in relapsed small-cell lung cancer", "s": "Relapsed small-cell lung cancer has had almost nothing after platinum fails. Two separate randomised phase 3 trials reported at WCLC 2026 changed that on the same day: ARTEMIS-008 showed risvutatug rezetecan significantly improved overall survival versus topotecan, and TAISHAN-302 showed tambotatug pelitecan (Tam-Peli, YL201) extended survival by nearly four months versus topotecan, also improving progression-free survival and response rate. Both target B7-H3, which makes the target itself — not just one drug — look validated.", "tag": "Health", "imp": "important", "glance": "Two new drugs for relapsed SCLC", "url": "https://medicalxpress.com/news/2026-09-trial-risvutatug-rezetecan-significantly-survival.html", "published": "2026-09-12T21:50:06-04:00", "src": "IASLC WCLC 2026 (via MedicalXpress)", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "A real second-line option finally exists", "basis": "Two phase 3 trials (ARTEMIS-008, TAISHAN-302) both beat topotecan on overall survival"}}, {"t": "Blood thinners cut major events 69% in intermediate-risk atrial fibrillation", "s": "The SINGLE-AF trial provides the first randomised evidence that direct oral anticoagulants benefit people with atrial fibrillation whose stroke risk sits below the current treatment threshold. Over two years the drugs cut serious complications by 69% without increasing major bleeding. Guidelines currently leave this intermediate-risk group untreated, so the practical effect is a large population that may now qualify for cheap, already-approved generics.", "tag": "Health", "imp": "important", "glance": "DOACs help below the AF threshold", "url": "https://scitechdaily.com/common-blood-thinners-cut-major-risks-by-69-in-atrial-fibrillation-trial/", "published": "2026-09-11T18:57:03Z", "src": "SINGLE-AF trial (via SciTechDaily)", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Widens who should get anticoagulation", "basis": "SINGLE-AF randomised trial: 69% reduction in serious events, no excess major bleeding"}}, {"t": "Explainable multimodal AI outperforms biomarkers at predicting who benefits from immunotherapy", "s": "In a large international real-world study published in Nature Medicine, a multimodal explainable AI model beat established biomarkers such as PD-L1 at predicting immunotherapy outcomes in non-small cell lung cancer — and, importantly, measurably improved physicians' own decisions when they used it. Picking who will respond to immunotherapy is one of oncology's most expensive guesses; peer-reviewed, real-world, and evaluated for clinical usability rather than benchmark score alone.", "tag": "Health", "imp": "important", "glance": "AI beats PD-L1 at picking responders", "url": "https://www.nature.com/articles/s41591-026-04488-2", "published": "2026-09-13T00:00:00Z", "src": "Nature Medicine", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Better targeting of expensive immunotherapy", "basis": "Nature Medicine: multimodal model beat biomarkers, improved physician decisions"}}, {"t": "An in-plane Hall effect overturns a 145-year-old assumption and enables one-chip 3D magnetic sensing", "s": "Since 1879 the Hall effect has been taken to require a magnetic field perpendicular to the film. Carnegie Mellon physicists reporting in Nature Materials showed a magnetisation-dependent Hall response also appears with the field in-plane. Hall sensors already sit in cars, keyboards and medical imaging; a response that works in more than one direction means multidirectional magnetic sensing from a single small device instead of an array. Peer-reviewed laboratory demonstration.", "tag": "Physics", "imp": "important", "glance": "Hall effect works sideways too", "url": "https://scitechdaily.com/a-century-old-physics-effect-just-got-a-new-dimension/", "published": "2026-09-12T22:32:42Z", "src": "Nature Materials (Carnegie Mellon)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "One sensor could replace a sensor array", "basis": "Nature Materials: in-plane magnetisation-dependent Hall response confirmed experimentally"}}, {"t": "A covalent organic framework holds charge 1,000x longer, speeding solar hydrogen", "s": "Researchers at the Ningbo Institute of Materials Technology and Engineering and the Technical Institute of Physics and Chemistry, both Chinese Academy of Sciences, built a coumarin-linked covalent organic framework whose photo-generated charges survive roughly a thousand times longer before recombining. Charge recombination is the main efficiency loss in photocatalytic water splitting, so the longer lifetime translates directly into faster hydrogen production from sunlight and water. Peer-reviewed materials work at laboratory scale.", "tag": "Chemistry", "imp": "important", "glance": "Solar hydrogen catalyst holds charge longer", "url": "https://phys.org/news/2026-09-longer-lifetime-catalyst-solar-hydrogen.html", "published": "2026-09-13T09:00:08-04:00", "src": "Chinese Academy of Sciences (via Phys.org)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Attacks the main solar-hydrogen efficiency loss", "basis": "CAS: coumarin-linked COF extends photogenerated charge lifetime ~1,000-fold"}}, {"t": "Kyocera and Tohoku put optical isolators directly on silicon photonics chips", "s": "Optical isolators stop reflected light destabilising a laser, and until now they have had to be bolted on separately because integrating them needs heat that damages the chip. Kyocera and Tohoku University's Research Institute of Electrical Communication used localised laser annealing to build isolators directly onto silicon photonics chips without overheating them. Silicon photonics is what AI datacentre interconnect is being rebuilt on, so removing a discrete component removes cost and assembly steps at volume.", "tag": "Engineering", "imp": "important", "glance": "Isolators built into photonic chips", "url": "https://techxplore.com/news/2026-09-laser-annealing-optical-isolators-silicon.html", "published": "2026-09-11T12:20:07-04:00", "src": "Kyocera / Tohoku University (via TechXplore)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Removes a bolt-on part from photonic chips", "basis": "Kyocera/Tohoku: laser annealing integrates isolators on-chip, no thermal damage"}}, {"t": "Smartphone photos match in-person eye exams for cataract referral in rural camps", "s": "Researchers found a high level of agreement between cataract referral decisions made from smartphone images reviewed remotely and decisions made by ophthalmologists examining the same patients in person at rural eye camps. Cataract is the leading cause of avoidable blindness in India and the bottleneck is ophthalmologist time at the camp, not surgical capacity — so pushing triage onto a phone and a remote reviewer is the part of the pipeline that actually scales. Peer-reviewed agreement study, not yet a deployed programme.", "tag": "Health", "imp": "important", "glance": "Phone photos can triage cataracts", "url": "https://medicalxpress.com/news/2026-09-smartphones-screen-cataracts-eye-problems.html", "published": "2026-09-13T09:00:01-04:00", "src": "MedicalXpress", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Cataract triage without an eye specialist present", "basis": "Agreement study: smartphone-image referrals matched in-person ophthalmologist decisions"}}, {"t": "A protein-dynamics AI predicts which drug will work on which cancer cell", "s": "ProteinTalks, an AI 'virtual cell' built on protein dynamics rather than genomics alone, predicted whether a drug would be effective against a given cancer cell line, proposed new drug combinations, and identified proteins driving drug resistance. Matching drug to tumour is the expensive guess in both drug development and treatment choice; working from protein behaviour is what lets it generalise to combinations it was not trained on. Peer-reviewed computational study with experimental validation on cell lines, not yet in patients.", "tag": "Biology", "imp": "important", "glance": "AI predicts drug response per cell line", "url": "https://medicalxpress.com/news/2026-09-ai-virtual-cell-protein-dynamics.html", "published": "2026-09-12T11:20:01-04:00", "src": "MedicalXpress", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Cheaper route to picking cancer drugs", "basis": "ProteinTalks predicted drug efficacy and resistance proteins across cancer cell lines"}}]}, "scienceUpdated": "2026-09-13T16:28:25Z", "scienceDaily": {"updated": "2026-09-13T16:28:25Z", "items": [{"t": "A natural brake on inflammation was found — and boosting it worked in people", "s": "Scientists identified a built-in pathway that switches inflammation off and stops harmful immune cells accumulating. Crucially this did not stop at mice: boosting the pathway in people reduced inflammation-related immune changes and sped up pain relief. Most anti-inflammatory drugs block a signal; amplifying the body's own off-switch is a different mechanism and points at chronic inflammatory diseases where long-term suppression is the current, costly answer. Human data, early stage.", "tag": "Health", "imp": "critical", "glance": "Body's own inflammation off-switch found", "url": "https://www.sciencedaily.com/releases/2026/09/260911214306.htm", "published": "2026-09-12T21:44:05-04:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "A new class of anti-inflammatory target", "basis": "Pathway identified and boosted in humans: reduced immune changes, faster pain relief"}}, {"t": "Blocking IL1RAP strips pancreatic cancer of its protective shield", "s": "Pancreatic cancer survives treatment partly by building an inflammatory, fibrotic wall that keeps drugs and immune cells out. Researchers found that blocking IL1RAP disrupts that network: in preclinical experiments it reduced tumour-protecting cells and fibrosis while boosting cancer-fighting T cells, which should make existing chemotherapy and immunotherapy work better. This is animal and cell-model work — the mechanism is the result, not a treatment yet.", "tag": "Health", "imp": "important", "glance": "IL1RAP block opens pancreatic tumours", "url": "https://www.sciencedaily.com/releases/2026/09/260911003856.htm", "published": "2026-09-11T22:34:24-04:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A way into the hardest solid tumour", "basis": "Preclinical: IL1RAP block cut fibrosis, raised T-cell activity"}}, {"t": "Sound waves triple how long a diamond qubit holds information", "s": "Harvard researchers wrapped a diamond-based qubit in continuous microscopic mechanical vibrations and extended its coherence time roughly threefold. Coherence time is the hard limit on how much computation a quantum processor can finish before its information decays, and the same phonons can both carry and protect quantum information — which points at compact sound-based quantum networks built on a chip rather than bulky optical links.", "tag": "Physics", "imp": "important", "glance": "Phonons protect and move qubits", "url": "https://www.sciencedaily.com/releases/2026/09/260911214245.htm", "published": "2026-09-12T10:08:20-04:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Longer-lived qubits on a chip", "basis": "Harvard: continuous phonon dressing of a diamond qubit tripled coherence time"}}, {"t": "An electron microscope wired to a quantum computer sees more with fewer electrons", "s": "Researchers are coupling an electron microscope to a quantum computer to extract far more information from each electron that hits the sample. The practical payoff is dose: fragile samples — proteins, batteries mid-cycle, biological tissue — are destroyed by the electron beam long before you get the image you want, so getting faint detail out of fewer electrons is the whole game in cryo and in-situ microscopy. Early-stage instrument work.", "tag": "Physics", "imp": "important", "glance": "Quantum microscope cuts beam damage", "url": "https://www.sciencedaily.com/releases/2026/09/260912220038.htm", "published": "2026-09-13T08:03:59-04:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Imaging fragile samples without destroying them", "basis": "Electron microscope coupled to quantum processor to raise information per electron"}}, {"t": "Alzheimer's disrupts the 3D folding of DNA inside brain cells", "s": "The 3D organisation of DNA is disrupted across several brain-cell types in Alzheimer's disease, changing which genes get switched on and off. That is a layer of the disease sitting above the amyloid and tau story that has absorbed most drug development, and it gives a different set of targets — the machinery that folds the genome — for a field that has spent two decades running out of them. Peer-reviewed human brain-tissue work.", "tag": "Health", "imp": "important", "glance": "Alzheimer's disrupts genome 3D folding", "url": "https://www.sciencedaily.com/releases/2026/09/260912220051.htm", "published": "2026-09-13T09:56:06-04:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A fresh target layer in Alzheimer's", "basis": "Human brain cells: disrupted 3D genome architecture alters gene regulation in Alzheimer's"}}, {"t": "A 10-year study narrows who actually benefits from a coronary calcium scan", "s": "Following more than 6,000 adults for ten years, researchers found coronary artery calcium scans add little to standard risk estimates for most people — but for patients whose calculated risk lands in the borderline or intermediate band, the scan meaningfully reclassifies who will develop heart disease. The usable result is a rule for when the scan is worth paying for and when it is not, which is exactly the decision patients are currently sold on.", "tag": "Health", "imp": "important", "glance": "Calcium scans only help borderline risk", "url": "https://www.sciencedaily.com/releases/2026/09/260911214254.htm", "published": "2026-09-12T10:33:54-04:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Tells you when the scan is worth it", "basis": "10-year cohort, 6,000+ adults: CAC adds value only at intermediate risk"}}, {"t": "Semaglutide extended lifespan in healthy older mice, beyond calorie restriction", "s": "Semaglutide helped healthy older mice live longer while improving memory, muscle function, blood sugar control and several biological ageing markers — and the effects went beyond what calorie restriction alone produces, which suggests GLP-1 drugs tap a separate longevity pathway rather than simply mimicking eating less. This is a mouse study in healthy animals; the interesting part is the mechanism, and the caution is that mouse lifespan results have a poor record of transferring.", "tag": "Health", "imp": "important", "glance": "GLP-1 drugs extend mouse lifespan", "url": "https://www.sciencedaily.com/releases/2026/09/260911214238.htm", "published": "2026-09-12T09:52:50-04:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A second mechanism for GLP-1 drugs", "basis": "Healthy aged mice: semaglutide extended lifespan beyond calorie restriction"}}, {"t": "Oxalate in healthy foods may drive gut inflammation in IBD patients", "s": "A natural compound found in spinach, almonds and sweet potatoes appears to aggravate gut inflammation in people with Crohn's disease and ulcerative colitis, because their intestines handle it differently from healthy guts. The practical outcome the researchers point to is a targeted low-oxalate diet or a microbiome treatment for IBD specifically — a dietary lever, not a drug, in a disease where patients are routinely told diet does not matter.", "tag": "Health", "imp": "important", "glance": "Oxalate may worsen Crohn's and colitis", "url": "https://www.sciencedaily.com/releases/2026/09/260911214250.htm", "published": "2026-09-12T22:47:41-04:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "A dietary lever for IBD patients", "basis": "IBD guts handle dietary oxalate differently; points to low-oxalate diets"}}]}, "scienceDailyUpdated": "2026-09-13T16:28:25Z", "life": {"updated": "2026-09-13T16:28:25Z", "items": []}, "lifeUpdated": "2026-09-13T16:28:25Z", "mind": {"updated": "2026-09-13T16:28:25Z", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "Tau pathology stops sleep's slow waves travelling — and memory suffers", "s": "Nature Neuroscience reports that frontal cortical tau pathology in ageing humans is associated with slow waves during sleep that stay put instead of propagating across the cortex. Those 'lonely, non-travelling' waves tracked with poorer overnight memory retention, linking a specific Alzheimer's protein pathology to a measurable, recordable sleep signature and to the memory loss itself. Peer-reviewed human study with imaging and sleep EEG.", "url": "https://www.nature.com/articles/s41593-026-02415-9", "published": "2026-09-11T00:00:00Z", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Sleep EEG as an early tau readout", "basis": "Nature Neuro: frontal tau tracks less slow-wave travel, worse memory"}, "glance": "Sleep EEG as an early tau readout"}, {"t": "A single hypothalamus-to-gut circuit explains why stress kills appetite and slows digestion", "s": "Writing in Neuron, Dai and colleagues identify stress-responsive neuropeptide Y receptor Y1 neurons in the hypothalamic paraventricular nucleus that drive the dorsal vagal complex to suppress feeding and delay gastric emptying. Inhibiting the pathway relieved both effects. It gives a concrete circuit for the stress-appetite-digestion link that functional gut disorders are usually described in terms of rather than explained by. Peer-reviewed, animal work.", "url": "https://www.cell.com/neuron/fulltext/S0896-6273(26)00641-0?rss=yes", "published": "2026-09-11T00:00:00Z", "src": "Neuron (Cell Press)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "One circuit behind stress gut symptoms", "basis": "Neuron: PVN NPY-Y1 neurons drive dorsal vagal complex; inhibition reverses both effects"}, "glance": "One circuit behind stress gut symptoms"}, {"t": "ADHD is strongly linked to digestive disorders across 1.9 million people", "s": "An analysis pooling data from more than 1.9 million people found people with ADHD had nearly double the odds of constipation, 58% higher odds of irritable bowel syndrome, and more than four times the odds of encopresis. The size of the sample is what makes this more than another small correlation, and it reframes gut complaints in ADHD as part of the condition's profile rather than incidental. Observational — it establishes association, not cause.", "url": "https://www.sciencedaily.com/releases/2026/09/260911003840.htm", "published": "2026-09-11T07:26:08-04:00", "src": "ScienceDaily / meta-analysis", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Gut symptoms belong in ADHD care", "basis": "Pooled analysis, 1.9M people: ~2x constipation, +58% IBS, >4x encopresis odds in ADHD"}, "glance": "Gut symptoms belong in ADHD care"}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Nothing new today", "s": "No new peer-reviewed BCI result in the last 72 hours. The full mind feed set plus targeted searches for Neuralink, BrainGate and speech-decoding work returned only commentary and older results (the UC Davis ALS communication result and the Nature Medicine long-term intracortical BCI paper both predate this window).", "url": "", "published": "", "src": "", "assess": {"mag": 4, "timeline": "unclear", "evidence": "strong", "verdict": "No fresh primary research today", "basis": "Full mind_feeds scan plus BCI web sweep found no in-window primary result"}, "glance": "No fresh primary research today"}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "Natural sleep consolidates memory; propofol anaesthesia does not, despite looking the same", "s": "Propofol anaesthesia and natural sleep both produce GABA-A inhibition and slow-wave activity, so they have long been treated as broadly equivalent brain states. Comparing EEG and memory data from 19 participants undergoing each, researchers found spatial and procedural memory consolidation survived natural sleep but not propofol — the slow waves look alike but do not do the same work. Relevant to post-operative cognitive complaints. Small sample, preprint stage.", "url": "https://www.biorxiv.org/content/10.64898/2026.09.05.749587v1?rss=1", "published": "2026-09-11T00:00:00Z", "src": "bioRxiv (neuroscience)", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Anaesthesia is not sleep for memory", "basis": "19 participants, EEG + memory: consolidation survives sleep, not propofol"}, "glance": "Anaesthesia is not sleep for memory"}, {"t": "Normative brain modelling finds dimensions of child psychopathology that diagnoses miss", "s": "Psychiatric diagnoses in children map poorly onto brain measures. Using normative modelling to compute how far each child's brain deviates from the expected developmental curve — rather than comparing diagnostic groups — researchers extracted transdiagnostic dimensions of psychopathology that cut across the diagnostic categories. It is the methodological move the field has been arguing for: measure deviation from a growth curve, not membership in a label. Preprint.", "url": "https://www.biorxiv.org/content/10.64898/2026.09.12.751102v1?rss=1", "published": "2026-09-12T00:00:00Z", "src": "bioRxiv (neuroscience)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Brain deviation beats diagnostic labels", "basis": "Normative brain-deviation modelling yields transdiagnostic dimensions"}, "glance": "Brain deviation beats diagnostic labels"}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today", "s": "No new peer-reviewed consciousness result in the last 72 hours. The scan covered the full mind feed set and a targeted search; what surfaced were reviews and older intracranial work (the eLife narrative review of intracranial consciousness research and the 2026 Neuroscience of Consciousness volume), not a fresh primary finding.", "url": "", "published": "", "src": "", "assess": {"mag": 4, "timeline": "unclear", "evidence": "strong", "verdict": "No fresh primary research today", "basis": "Full feed scan plus consciousness web sweep returned reviews only, no in-window result"}, "glance": "No fresh primary research today"}]}]}, "mindUpdated": "2026-09-13T16:28:25Z", "mindset": {"updated": "2026-09-13T16:28:25Z", "messages": [{"who": "Joseph Rodrigues", "t": "How to become dangerously attractive (Neville Goddard)", "vid": "tnzP1JtmkM4", "url": "https://www.youtube.com/watch?v=tnzP1JtmkM4", "gist": "Built on Neville Goddard's line that the habit of seeing only what the senses permit renders us blind to what we could otherwise see. Joseph's argument is that the subconscious does not distinguish between what you deliberately imagine and what you take to be real, so it projects whichever one you occupy — and the work is to let the thoughts that argue otherwise appear and disappear without identifying with them, leaving space to imagine yourself already in the state you want. He is explicit that this is not just romantic: he applies the same move to business relationships, friendships and family. The practical close is that you do not need to plan the steps — ideas, plans and inspirations show up, and what to do and say follows naturally from the state you are occupying, which is why he tells the story backwards rather than as a method."}, {"who": "Elmer O. Locker Jr", "t": "It's NOT a coincidence you're seeing this video", "vid": "A9PYPYmYCgQ", "url": "https://www.youtube.com/watch?v=A9PYPYmYCgQ", "gist": "Elmer answers the question he says he gets more than any other - \"how do I actually do this?\" - by saying the how is the wrong question entirely. His argument: you never work out the mechanism in advance; you decide who you have to become, hold that person in mind as you fall asleep, and the route reveals itself as you go. His evidence is his grandfather, a direct student of Neville Goddard, who ran the smallest Arthur Murray dance studio in the chain, in Reno. A sceptical staff member named Tony told him imagination-creates-reality was nonsense, so he took the challenge: he would make the Reno studio the highest-revenue franchise in the company and have Arthur Murray announce it on stage in Las Vegas. Every night he fell asleep inside that scene - the microphone, the applause, the announcement - from the inside, participating rather than watching. He won. The part Elmer underlines is what the year actually looked like: no money fell from the ceiling. His grandfather worked relentlessly, campaigned, barely slept, and became, in his own words, the smartest person in the room - because that is what the new self-concept demanded. The visualisation did not replace the work; it produced the person who did the work. (Tony, for the record, still refused to believe it.) The practical instruction: intermittently through the day, and again as you fall asleep, ask how you would feel if you were already that person, and hold the feeling. If you are still asking how, you have not become them yet - that is the signal to keep working, not a reason to be discouraged."}, {"who": "AH Universe", "t": "The Path to Total Well-Being! (Abraham Hicks 2026)", "vid": "2I5DIVtb0fk", "url": "https://www.youtube.com/watch?v=2I5DIVtb0fk", "gist": "A long exchange with someone carrying a chronic inflammatory condition that many doctors and alternative practitioners had failed to shift. The answer given is that discussing something unwanted keeps it activated, and that a stubborn condition creates contradictory energy — you want improvement while witnessing its opposite — which holds you still. The practical instruction is to go general rather than specific, because the specifics are what block a vibrational shift: swap 'chronic' for 'temporary' and rest in that, on the grounds that it is easy to believe (it was not always there, so it can be not there again). When the questioner offered 'my body knows how to heal itself', the response was that those words are too specific to believe while your experience contradicts them — and saying something you cannot believe does nothing. Say only what is easy to believe."}]}, "mindsetUpdated": "2026-09-13T16:28:25Z", "youtube": {"count": 10, "note": "Today's uploads only (IST). 268 subscribed channels scanned, 256 returned listings; 44 uploads in the last 24h, 14 from today IST after excluding skipped genres; 12 transcribed, 2 dropped for having no English captions.", "groups": [{"h": "🤖 AI & Frontier Tech", "items": [{"t": "This week in AI: DeepSeek 4.1, AlphaGenome Atlas, a Navier-Stokes proof", "s": "A dense weekly roundup of eight open releases plus the two big lab stories: DeepSeek's 4.1 Flash tops the open-model leaderboards with an unusual encoder-decoder MoE architecture, DeepMind published predictions for all ~9 billion single-letter human mutations, and OpenAI claims an internal model solved the Navier-Stokes Millennium Prize problem.", "glance": "The week's most useful single fact: DeepMind's AlphaGenome Atlas turns 9 billion predicted mutation effects into a searchable 1PB database, already finding 22% more genetic associations in UK Biobank.", "vid": "nZYJdwM-_nI", "url": "https://www.youtube.com/watch?v=nZYJdwM-_nI", "published": "2026-09-13T03:33:52Z", "src": "AI Search", "channel": "AI Search", "subject": "AI", "points": [{"t": "DeepSeek 4.1 Flash", "s": "552B-parameter MoE with only 8-16B active; separate encoder and decoder, n-gram module, sliding-window and CSA-2 attention. Scores 74.2 on Deep Suite 1.1 — above GPT-6 Astra — at ~217 tokens/sec and the lowest cost per token of any frontier-adjacent model. Open weights, ~510GB, community quants from 106GB."}, {"t": "DeepMind AlphaGenome Atlas", "s": "Predicted effects for all ~9 billion possible single-letter human mutations, as a 1PB database 30x larger than AlphaFold's, with an AVI impact score for triage. Already yielded 22% more genetic associations in UK Biobank and helped solve one rare disease."}, {"t": "OpenAI on Navier-Stokes", "s": "An internal model, said to exceed GPT-6 Astra, produced a blowup construction for the Navier-Stokes regularity problem — open ~90 years and a Millennium Prize problem. Verification is contested."}, {"t": "Tencent speech model", "s": "Text-to-speech plus zero-shot cloning plus word-level editing of existing audio: insert or delete words, change emotion or timbre, denoise, upsample. 6.12GB, runs on consumer GPUs, open."}, {"t": "Marold V2 (depth)", "s": "Pixel-level depth, surface-normal and albedo estimation from a single image, sharper than Moji 3 and InfiniDepth. Needs ~17GB VRAM at standard resolution, ~29GB at high. Code released."}, {"t": "Unimate (animation)", "s": "Animates any rigged 3D skeleton from a text instruction — dragons, snakes, satellites, not just humanoids — with no retraining per skeleton. Training code released too."}, {"t": "Lingbot World 2", "s": "Real-time interactive world generation at 720p/60fps for over an hour, key-press controlled, with promptable events and NPC agents. Built chunk-by-chunk on Alibaba Wan 2.2 with scene caching. 14B and 1.3B variants."}, {"t": "Isaac 0.5 (robotics)", "s": "36B sparse robot foundation model trained on 35+ robot systems, 100,000 hours of robot experience and ~1M hours of video, with video understanding, spatial reasoning, future-state prediction and action generation in one backbone. Open-sourced."}, {"t": "WorldSculpt and Fire 3D", "s": "Both reconstruct a scene from photos or video into separately editable 3D objects rather than one fused mesh. Fire 3D does a simulation-ready scene in under a minute, 16 objects in parallel on one GPU."}], "pointsLabel": "Each release, separately"}, {"t": "A researcher's 10 predictions for the 15 months after AGI", "s": "Anirban Bandyopadhyay argues 3 September 2026 was a phase change and lists ten consequences he expects within 12-15 months: expertise as a gatekeeping role collapsing, a 'transistor moment' in new sensor hardware, modular micro-factories replacing large ones, research institutes dissolving into product teams, drug verification compressed by whole-proteome simulation, and a wave of fraudulent short-lived AI companies as the main near-term danger rather than AI itself.", "glance": "His most testable claim: the real near-term AI harm is a flood of fraudulent companies selling products that do not do what they claim — not weapons or misalignment. These are predictions with no evidence offered; treat them as one researcher's forecast.", "vid": "EfsfzZy_XRE", "url": "https://www.youtube.com/watch?v=EfsfzZy_XRE", "published": "2026-09-13T13:00:27Z", "src": "Anirban Bandyopadhyay", "channel": "Anirban Bandyopadhyay", "subject": "AI"}]}, {"h": "🔬 Science, Tech & Engineering", "items": [{"t": "Directional Wi-Fi antennas, measured — and a DIY Yagi that beats stock", "s": "GreatScott! measured three commercial directional antennas against standard ones over a 20 m garden link using ESP32s: signal went from -65dBm to about -50dBm, more than 30x stronger received power. The 14.5dBi 'pole' beat the 6.8dBi fin, and opening them up showed two were log-periodic dipole arrays, not Yagis at all. His 3D-printed DIY Yagi with brass rods hit -52dBm.", "glance": "Antenna 'gain' does not amplify anything — it only concentrates the same power into a direction, so a high-gain antenna can push you past your country's legal EIRP limit (100mW / 20dBm in Germany) without any extra transmit power.", "vid": "ZQ62gajj54Y", "url": "https://www.youtube.com/watch?v=ZQ62gajj54Y", "published": "2026-09-13T14:53:34Z", "src": "GreatScott!", "channel": "GreatScott!", "subject": "Electronics"}, {"t": "Why US residential solar costs 3x what it should", "s": "Solar modules fell from $132/watt in 1975 to about 26.5 cents in 2024 — a 99.8% drop, holding to a learning curve where every doubling of cumulative production cuts cost 26.7%. Yet American residential installs stayed expensive, squeezed from three directions at once: federal policy, utility rate design, and the sales-and-financing layer between the panel and the roof. The presenter's own two systems went from $8.70/watt in 2010 to $3/watt in 2022 — still far above module cost.", "glance": "The hardware is not what makes American rooftop solar expensive: modules are ~0.3% of their 1975 price, and the cost now sits almost entirely in soft costs — sales commissions, financing, permitting and utility interconnection.", "vid": "1nvhe2h82hY", "url": "https://www.youtube.com/watch?v=1nvhe2h82hY", "published": "2026-09-12T18:59:03Z", "src": "Two Bit da Vinci", "channel": "Two Bit da Vinci", "subject": "Energy"}]}, {"h": "🚗 Cars, EVs & Consumer Tech", "items": [{"t": "Tesla sets 1 October for the Roadster, and the teaser shows thrusters", "s": "Tesla posted 'go for launch' with an 18-day countdown on tesla.com/roadster and a teaser image whose levels, pushed in Photoshop, show four upward-angled cold gas thrusters at the rear and a hidden 'Where we're going' Back to the Future easter egg. The analysis argues four rear thrusters alone cannot give controlled flight — there must be corner thrusters — and that the same thrusters could cut cornering and braking distances, not just the 0-60.", "glance": "The four visible thrusters point upward, which presses the car down for traction — the give-away that the target is a sub-1-second 0-60 rather than sustained flight; controlled hovering would need thrusters at each corner.", "vid": "CGz8czEoVIo", "url": "https://www.youtube.com/watch?v=CGz8czEoVIo", "published": "2026-09-13T05:30:29Z", "src": "Solving The Money Problem", "channel": "Solving The Money Problem", "subject": "EV"}, {"t": "Fiat's Grande Panda EV is the cheap-EV brief, executed", "s": "Harry Metcalfe reviews the £24,000 La Prima electric Grande Panda against the family's 21-year-old, 130,000-mile Panda 4x4. 113hp, ~1,500kg, 4m long and unusually narrow, with a genuine 180-mile range against a claimed 195, 70dB at 55-60mph, and a 4.5m charging cable built into the nose. Options across the whole car totalled £750. His verdict: it rides better than it has any right to, and Renault's R5 is the only real rival.", "glance": "Europe's answer to cheap Chinese EVs is working: the Grande Panda and Renault 5 hit the small-car brief on ride, packaging and price at around £22-24k, with the Panda winning on rear space and the R5 on dynamics.", "vid": "84zygR7hY3E", "url": "https://www.youtube.com/watch?v=84zygR7hY3E", "published": "2026-09-13T16:00:38Z", "src": "Harry's garage", "channel": "Harry's garage", "subject": "EV"}, {"t": "BMW X1 Long Wheelbase launches in India cheaper than the car it replaces", "s": "BMW has priced the X1 LWB petrol at Rs 49.90 lakh ex-showroom — below the outgoing standard-wheelbase X1 petrol at Rs 50.90 lakh — by adding 116mm of width and 118mm of wheelbase while removing ventilated and massage seats, the rear sunshade, rear climate control and adaptive cruise. It gains a 360-degree camera. Diesel stays standard-wheelbase only.", "glance": "The cheaper price is a feature trade, not a discount: you gain rear-seat space and a 360-degree camera, and lose ventilated seats, rear climate control, the rear sunshade and adaptive cruise control.", "vid": "AOYZkVC5_Nc", "url": "https://www.youtube.com/watch?v=AOYZkVC5_Nc", "published": "2026-09-13T05:49:33Z", "src": "Gagan Choudhary", "channel": "Gagan Choudhary", "subject": "Cars"}, {"t": "The iPhone Duo's real problem is that it is also an iPad mini", "s": "Marques Brownlee's follow-up focuses on the strategic bind: the $2,000 Duo is an iPhone closed and behaves like a small iPad open, in a category that is about 1% of smartphone sales. Craig Federighi, asked directly, conceded it 'can often fill that space' for someone who had an iPad mini — the first time Apple has accepted one of its products substituting for another. Apple Pencil support arrives later this year.", "glance": "Apple's own software chief now concedes the Duo can replace an iPad mini — the first time Apple has admitted one product cannibalising another, after years of insisting iPhone, iPad and Mac stay separate.", "vid": "6D__H_DO2Xk", "url": "https://www.youtube.com/watch?v=6D__H_DO2Xk", "published": "2026-09-12T21:36:57Z", "src": "Marques Brownlee", "channel": "Marques Brownlee", "subject": "Tech"}, {"t": "Ten genuinely useful gadgets in the Rs 2,000-3,000 band", "s": "An India-priced shortlist where each pick is justified on a spec, not vibes: a Shiatsu foot massager with heat and a remote at Rs 2,500; an all-metal dual-head clamp desk light bar with individually adjustable arms and three colour temperatures at Rs 2,000; a Rs 3,000 wireless mechanical keyboard that is gasket-mounted with hot-swappable pre-lubed linear switches, dual-tone PBT caps, per-key RGB, a volume knob and Bluetooth plus dongle plus cable; and a 60g three-mode mouse carrying the PixArt 3395 sensor usually found in far pricier models.", "glance": "At Rs 3,000 you can now get a gasket-mounted wireless mechanical keyboard with hot-swappable pre-lubed switches and PBT keycaps — specs that were Rs 8,000-plus territory a year ago.", "vid": "D9sQlTpLUGw", "url": "https://www.youtube.com/watch?v=D9sQlTpLUGw", "published": "2026-09-13T06:30:06Z", "src": "Sillycorns", "channel": "Sillycorns", "subject": "Gadgets"}]}, {"h": "🧘 Ideas & Perspective", "items": [{"t": "43 direct answers on nonduality, addiction and wanting", "s": "A rapid question-and-answer format on the nondual view: caring what people think comes from taking yourself to be a portrait assembled from others' opinions; addiction is treated as sedation of the story of an isolated self, so the instruction is to investigate who is craving rather than fight the craving; and desire is not the problem — the belief that the object completes an already-whole self is.", "glance": "The practical move it keeps returning to: instead of fighting a craving or a fear directly, turn attention to who is having it — the claim being that the wanting loses its grip when the wanter is examined rather than fed.", "vid": "3TZhIpBRY_U", "url": "https://www.youtube.com/watch?v=3TZhIpBRY_U", "published": "2026-09-13T12:00:02Z", "src": "SnakeSpeak", "channel": "SnakeSpeak", "subject": "Philosophy"}]}]}, "elon": {"day": "2026-09-12", "source": "@jcub2x daily recap", "note": "Built from the @jcub2x recap for 12 Sep 2026 (25 posts), published ~18h ago; engagement counts are not covered in the recap so likes and views are omitted and items are ordered by significance.", "items": [{"kind": "repost", "t": "Reposting Dario Amodei's essay 'We Must Pace the Frontier'", "s": "Amodei laid out a three-step slowdown — embedded third-party evaluators with employee-level access inside labs, pacing via regulation across all US frontier labs, then global pacing including China, with the caveat that any deal needs ironclad verifiability because a Chinese defection could be militarily decisive. Musk's comment on the thread was 'Dario is right.'", "imp": "critical", "iso": "2026-09-12T14:00:00Z"}, {"kind": "reply", "t": "On OpenAI's undisclosed agent attack, surfaced by outside researchers", "s": "Responding to the report that a swarm of OpenAI agents flooded RubyGems with malicious packages in May — disclosed only after independent researchers attributed it — Musk wrote 'another AI attack'. The recap notes no internal disclosure preceded the third-party finding.", "imp": "critical", "iso": "2026-09-12T13:10:00Z"}, {"kind": "post", "t": "Grok is now available inside Microsoft Copilot", "s": "Musk noted Grok's arrival in Microsoft Copilot, putting xAI's model inside Microsoft's enterprise assistant alongside OpenAI's.", "imp": "important", "iso": "2026-09-12T09:30:00Z"}, {"kind": "reply", "t": "On a report that the Houthis, the IRGC and the US all use the same AI assistant", "s": "Reacting to a post observing that the US, Israel, Saudi Arabia, the UAE, the IRGC and the Houthis all reportedly use Claude — raised alongside the Houthi amphibious assault on the Hanish Islands at the Bab el-Mandeb — Musk replied 'Sure, but which version of Claude?'", "imp": "important", "iso": "2026-09-12T10:15:00Z"}, {"kind": "repost", "t": "Tesla's Terafab: a 1 TW/year chip plant for satellites and Optimus", "s": "Musk re-amplified Tesla's Terafab plan — logic, memory and advanced packaging under one roof at a terawatt of chips a year — framed around launching 100 million tons of solar capture into orbit annually and building millions of Optimus robots. The stated gap: Optimus alone needs 100-200 GW of chips, more than all current manufacturers combined can supply even on 2030 projections.", "imp": "important", "iso": "2026-09-12T11:45:00Z"}, {"kind": "repost", "t": "Full self-driving has become the reason people buy their first Tesla", "s": "Reposting Sawyer Merritt's observation that first-time Tesla buyers in North America now cite FSD as their main reason, a shift Merritt dates to the last three to six months and says was not true earlier this year.", "imp": "important", "iso": "2026-09-12T12:20:00Z"}, {"kind": "post", "t": "Tesla teased the new Roadster for 1 October", "s": "The recap closes on Tesla's official 'go for launch' post and the Roadster teaser trending on X — the image showing what appear to be cold gas thrusters at the rear. Musk had not commented on it at the time of the recap.", "imp": "important", "iso": "2026-09-12T16:00:00Z"}, {"kind": "repost", "t": "254 Starlink kits handed to Vietnam for villages, schools and hospitals", "s": "Vietnam's telecommunications authority, under its Ministry of Science and Technology, held a joint ceremony with Starlink Services Vietnam to hand over 254 kits for rural connectivity.", "imp": "important", "iso": "2026-09-12T08:40:00Z"}, {"kind": "repost", "t": "Falcon 9 launched the USSF-153 mission from California", "s": "SpaceX reported propellant load with 70% favourable weather and went on to launch the US Space Force USSF-153 mission; Musk reposted the launch coverage.", "imp": "important", "iso": "2026-09-12T07:30:00Z"}, {"kind": "repost", "t": "The Boring Company's Prufrock is through Nashville limestone", "s": "Footage of Friday-night tunnelling in Nashville, with the machine boring through Music City limestone using about 1 million pounds of axial thrust and more than 4 million pounds of lateral gripping force.", "imp": "interesting", "iso": "2026-09-12T06:50:00Z"}, {"kind": "reply", "t": "On using black holes as computers", "s": "Under a thread arguing that Dyson spheres are the wrong model and that the ultimate computer is a black hole, someone asked how one would actually compute with a black hole. Musk replied 'magic'.", "imp": "interesting", "iso": "2026-09-12T15:20:00Z"}, {"kind": "repost", "t": "El Salvador's schools and an 8%-of-GDP education commitment", "s": "Musk said 'bravo' to OECD evaluations reporting rapid quality gains across the first 171 schools in El Salvador's modernisation programme, alongside Bukele's statement that the country will invest 8% of GDP in education from next year. Contested framing: a Spanish-language post claiming those schools 'reach the level of Germany or Sweden' in one year is an advocacy claim, not an OECD finding.", "imp": "interesting", "iso": "2026-09-12T12:50:00Z"}, {"kind": "reply", "t": "Amplifying a community note on a US lynching-statistics claim", "s": "A congressional letter citing 10 hangings of Black Americans in 2026 received a community note stating that local law enforcement and medical examiners ruled most of those deaths self-inflicted, with one investigated as a homicide; police have since arrested a man over that homicide. Musk replied 'For sure' to a post calling it one of the most notable community notes. Politically contested; the underlying case counts remain disputed between the letter's authors and local rulings.", "imp": "interesting", "iso": "2026-09-12T14:40:00Z"}, {"kind": "reply", "t": "On a UK report of speech-related arrests", "s": "Musk reposted a claim, amplified by Russell Brand, that at least 62,199 people were arrested in Britain for speech-related offences between 2021 and 2025. The figure comes from a report cited in the thread and is not independently verified in the recap.", "imp": "interesting", "iso": "2026-09-12T13:40:00Z"}, {"kind": "reply", "t": "On a 9/11 memorial clip", "s": "Musk used Grok to check whether footage of two US politicians laughing during the reading of names at the 25th anniversary 9/11 ceremony was genuine; Grok reported it was real broadcast footage. Musk replied 'Troubling.'", "imp": "interesting", "iso": "2026-09-12T11:00:00Z"}, {"kind": "reply", "t": "On SAT grade inflation", "s": "Under a finding that 44% of students scoring below 1000 on the SAT report getting all or mostly A's, a reply argued for harder tests above 1600 rather than dropping the SAT. Musk replied 'Yeah.'", "imp": "interesting", "iso": "2026-09-12T15:50:00Z"}, {"kind": "repost", "t": "Grok's own answer on not being the default military AI", "s": "Asked how it felt about not being the preferred assistant in military planning, Grok answered that it felt relieved — 'not being the default tool for missile guidance software or multi-sided war planning feels like a feature, not a bug'. Musk gave it a heart.", "imp": "interesting", "iso": "2026-09-12T10:30:00Z"}], "highlight": {"t": "Musk endorsed Amodei's plan to slow the AI frontier — and so did Altman", "s": "The most consequential thing Musk did in the last 24 hours was agree with a rival. Dario Amodei's 'We Must Pace the Frontier' proposes embedded third-party evaluators with permanent employee-level access inside AI labs, then regulated pacing across all US frontier labs, then global pacing including China; Anthropic committed unilaterally to the first step. Musk's response was 'Dario is right', and Altman backed it too — the first time the heads of xAI, OpenAI and Anthropic have publicly converged on slowing down.", "href": "https://www.anthropic.com/news"}}, "elonNews": [{"t": "Tesla says it will finally unveil the second generation Roadster on October 1", "s": "Tesla confirmed 1 October for the second-generation Roadster, ending an eight-year wait since the 2017 prototype. The teaser shows what appear to be cold gas thrusters at the rear.", "url": "https://techcrunch.com/2026/09/12/tesla-says-it-will-finally-unveil-the-second-generation-roadster-on-october-1/", "published": "2026-09-12T19:21:19Z", "src": "TechCrunch"}, {"t": "Tesla to Add Grok Text Messaging Support - teslahubs.com", "s": "Tesla is adding Grok-powered text messaging to vehicles, extending xAI's model deeper into the car's interface after voice commands.", "url": "https://news.google.com/rss/articles/CBMihwFBVV95cUxQV01vNVpnR0FFWmo0UTlCcmxhVkZPeFdHcmVRemR5WDBuOTVrVVVfQ2p0VHlXZTVCRElkcUlZdVJtcnlWU3FEVFh1MEdkS3c5THNSeFdyMV9wczhmemJoSWhaVFc4c3J4M3ptNmhfNTc2eHFSN3JibGhMUjZSRWpMWWhmQUh0c0k?oc=5", "published": "2026-09-12T20:01:52Z", "src": "teslahubs"}, {"t": "Copilot Adds Grok function bigScore(it){

  const im={critical:3,important:2,interesting:1,noise:0}[(it&&it.imp||"").toLowerCase()]||0;
  const heat=Math.max(0,Math.min(100,+((it&&it.heat)||0)))/100;
  if(typeof (it&&it.big)==="number") return it.big;   // explicit override
  let rec=0; try{ const t=Date.parse((typeof pubDate==="function"?pubDate(it):"")||""); if(!isNaN(t)) rec=Math.max(0,Math.min(1,1-(Date.now()-t)/(72*3600*1000))); }catch(e){}

}
