url": "https://www.thehindu.com/news/national/karnataka/g-s-patil-elected-karnataka-assembly-speaker-bjp-jds-boycott-poll", "published": "2026-08-14T19:40:00+00:00", "src": "The Hindu"}, {"t": "A BJP MLA's daughter is booked for assaulting a woman police sub-inspector", "s": "The case, over a temple-entry dispute, has become a test of how the state handles complaints against political families.", "imp": "important", "glance": "MLA's daughter booked for assaulting SI", "url": "https://thesouthfirst.com/karnataka/", "published": "2026-08-15T06:20:00+00:00", "src": "The South First"}]}, {"h": "🌴 Kerala", "tag": "Kerala", "items": [{"t": "Kerala announces Onam bonus and festival allowance for state employees", "s": "The government cleared the bonus and festival allowance ahead of Onam, alongside a push for more Onam special trains that K.C. Venugopal has asked the Railways to run.", "imp": "important", "glance": "Onam bonus cleared for Kerala staff", "url": "https://www.thehindu.com/news/national/kerala/", "published": "2026-08-15T07:00:00+00:00", "src": "The Hindu"}, {"t": "Kerala's Independence Day programmes omit Vande Mataram amid a row over the Centre's directive", "s": "The state said there was no directive to sing Vande Mataram in schools; the Chief Minister's I-Day address called instead for a pledge to build a new-era state. The BJP has made the omission a campaign issue.", "imp": "important", "glance": "Vande Mataram row over Kerala I-Day events", "url": "https://www.onmanorama.com/kerala.html", "published": "2026-08-15T05:00:00+00:00", "src": "Onmanorama / The Hindu"}, {"t": "Kerala High Court tells the government to decide on sanction to prosecute Vellappally in the SNDP microfinance case", "s": "The court directed the state to consider the SIT's request for prosecution sanction against SNDP Yogam general secretary Vellappally Natesan.", "imp": "important", "glance": "HC pushes decision on Vellappally case", "url": "https://www.thehindu.com/news/national/kerala/sndp-microfinance-scam-kerala-hc-directs-govt-to-consider-sanction", "published": "2026-08-14T15:05:00+00:00", "src": "The Hindu"}, {"t": "Chokramudi hills open to tourists as Neelakurinji turns Munnar blue", "s": "The once-in-twelve-years Neelakurinji bloom is under way and the Chokramudi trail is being opened with permit caps — the peak-season draw for Munnar this month.", "imp": "interesting", "glance": "Neelakurinji bloom opens Chokramudi trail", "url": "https://www.thehindu.com/news/national/kerala/", "published": "2026-08-15T06:40:00+00:00", "src": "The Hindu"}]}, {"h": "🏯 Mysuru", "tag": "Mysore", "items": [{"t": "Mysuru's outskirts face a deepening water crisis as borewells run dry", "s": "Peripheral wards and the villages absorbed into the city's edge are reporting failed borewells and tanker dependence, with the shortfall worsening through August. Anyone running a unit, farm or rental property outside the core supply network is on tankers until the next recharge.", "imp": "important", "glance": "Borewells drying on Mysuru's outskirts", "url": "https://www.deccanherald.com/india/karnataka/", "published": "2026-08-15T04:00:00+00:00", "src": "Deccan Herald / Dailyhunt"}, {"t": "Karnataka High Court cleared the Hindu Jagarana Vedike torchlight march in Mysuru for Independence Day eve", "s": "The court held that pending criminal cases against organisers alone cannot bar a procession, and permitted the march with conditions. Mysuru police ran restrictions and extra deployment along the route last night; the march passed without incident.", "imp": "important", "glance": "HC allowed Mysuru torchlight march", "url": "https://www.barandbench.com/news", "published": "2026-08-14T11:10:00+00:00", "src": "Bar & Bench"}, {"t": "Mysuru City Corporation's Garbage Vulnerable Point system is being held up as a state model", "s": "MCC's GVP management system — mapping chronic dumping spots and assigning ward-level accountability — is being cited by the state as a template for other city corporations.", "imp": "important", "glance": "MCC garbage-point system becomes state model", "url": "https://www.deccanherald.com/india/karnataka/", "published": "2026-08-15T03:30:00+00:00", "src": "Deccan Herald"}, {"t": "BSNL to upgrade 690 towers in the Mysuru region to 4G", "s": "The upgrade covers Mysuru, Chamarajanagar, Hassan, Kodagu and Mandya — relevant if you have sites or staff on BSNL connections outside the city.", "imp": "important", "glance": "BSNL upgrading 690 Mysuru-region towers", "url": "https://www.thehindu.com/news/national/karnataka/bsnl-to-upgrade-690-towers-to-4g-in-mysuru-region-rolls-out-i-day-offers", "published": "2026-08-14T14:10:00+00:00", "src": "The Hindu"}, {"t": "Bengaluru–Mysuru Expressway draws fresh advertising interest", "s": "Advertising rights along the corridor are attracting new bidders as traffic volumes settle at higher levels than projected.", "imp": "interesting", "glance": "Expressway ad rights draw new bidders", "url": "https://newskarnataka.com/", "published": "2026-08-15T03:40:00+00:00", "src": "News Karnataka"}]}, {"h": "🏙️ Bengaluru", "tag": "Bengaluru", "items": [{"t": "Draft rules would double parking rates on Bengaluru's busiest commercial stretches and charge residents up to ₹25,000 a year", "s": "The Greater Bengaluru Authority's draft parking policy prices on-street parking by vehicle size and location, with SUVs and prime commercial stretches at the top of the band. It is at the draft stage and open to objections — the debate now is whether it is a solution or just a price on the traffic problem.", "imp": "important", "glance": "Draft policy: ₹25k/yr street parking, double rates", "url": "https://www.thehindu.com/news/cities/bangalore/", "published": "2026-08-14T16:20:00+00:00", "src": "The Hindu / Deccan Herald"}, {"t": "A woman's death on a broken Electronics City road turns into a flashpoint over Bengaluru's potholes", "s": "Medha died on a road she used daily; residents say repeated complaints went unanswered. The High Court was separately told 74% of the city's potholes are repaired with about 2,600 left — a number residents dispute.", "imp": "important", "glance": "Pothole death reignites road-quality anger", "url": "https://indianexpress.com/article/cities/bangalore/a-road-she-took-every-day-medhas-death-puts-bengalurus-damaged-roads-under-scrutiny/", "published": "2026-08-14T08:32:00+00:00", "src": "The Indian Express"}, {"t": "₹5,000 crore committed to resurfacing Bengaluru's interior roads", "s": "Minister Krishna Byre Gowda said the interior-road programme is funded and that tunnels and elevated corridors are the only long-term fix; he tied Greater Bengaluru Authority polls to completion of the SIR process.", "imp": "important", "glance": "₹5,000 cr for Bengaluru interior roads", "url": "https://www.thehindu.com/news/cities/bangalore/thtalksbengaluru-bengalurus-interior-roads-to-get-5000-crore-worth-facelift", "published": "2026-08-14T13:50:00+00:00", "src": "The Hindu"}, {"t": "US court upholds a $565 million award against Antrix in the Devas dispute", "s": "The ruling is another setback for ISRO's commercial arm in the long-running Devas Multimedia arbitration, keeping enforcement pressure on Indian state assets abroad.", "imp": "important", "glance": "$565m Antrix award upheld by US court", "url": "https://indianexpress.com/section/cities/bangalore/", "published": "2026-08-15T06:10:00+00:00", "src": "The Indian Express"}]}]}, "newsUpdated": "2026-08-15T07:14:34+00:00", "aitrends": {"updated": "2026-08-15T07:14:34+00:00", "items": [{"t": "SpaceX AI closes its $60bn Cursor acquisition", "s": "Cursor's team has formally joined SpaceX AI to work on Grok, Grok Build and the Cursor product itself. It is the largest AI acquisition on record and it landed the same week Grok 4.6 shipped at frontier-adjacent quality — the extra training data and engineering talent from Cursor is the stated reason for the jump. If you write software, the practical effect is that a top-three coding agent now sits inside the same company as X and Tesla's data.", "heat": 98, "delta": "new", "sources": 7, "url": "https://www.theinformation.com/", "glance": "Largest AI acquisition ever closes; coding agents consolidate", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Coding agents consolidate under one owner", "basis": "Deal formally closed 14 Aug; Cursor account and staff moved to SpaceX AI"}}, {"t": "OpenAI and Anthropic cut prices as Chinese models undercut them", "s": "Both labs moved on API pricing within days as DeepSeek, Qwen, Kimi and GLM took share at the low end. Ars Technica reports the cuts are explicitly defensive. For anyone running production LLM workloads the effective cost per task has fallen sharply this month, and the cheapest credible options are increasingly Chinese-hosted or open-weight.", "heat": 95, "delta": "new", "sources": 6, "url": "https://arstechnica.com/ai/2026/08/openai-and-anthropic-in-price-war-as-chinese-ai-rivals-gain-ground/", "glance": "Frontier API prices falling fast in a real price war", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Inference costs drop for everyone building", "basis": "Published price changes at both labs within days of each other"}}, {"t": "DeepSeek V4 Pro ships — and raises prices 14x over Flash", "s": "The agentic model handles a million tokens of context and 384,000-token outputs, and went fully live after months in preview. Peak-hour output pricing rose to about $3.96 per million from $0.87 — still roughly a tenth of Western frontier pricing. The rise is the first clear sign a Chinese lab thinks it has pricing power rather than only share to win.", "heat": 91, "delta": "new", "sources": 5, "url": "https://indianexpress.com/section/technology/artificial-intelligence/", "glance": "1M-token agent model, still far cheaper than the West", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Cheap long-context agents become production-viable", "basis": "Model GA with published context, output and per-token pricing"}}, {"t": "Grok 4.6 lands neck-and-neck with the frontier on cost-per-task", "s": "xAI/SpaceX AI says the gain came mostly from a much longer supplemental training run on curated engineering data. Arc-AGI results put it at 87% on ARC-AGI-1 at $0.30 a task, and comparable to GPT-5.6 on ARC-AGI-3 at roughly a third of the cost — although Arc's own harness caveats mean the headline gap is narrower than first reported.", "heat": 88, "delta": "new", "sources": 5, "url": "https://arcprize.org/", "glance": "Frontier-adjacent quality at a fraction of the cost", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Cheap frontier reasoning is now three-horse", "basis": "Published ARC-AGI scores with per-task costs; harness caveats noted by Arc"}}, {"t": "China's Z.ai claims near-parity with Anthropic on cyber-defence tests", "s": "Z.ai (Zhipu) published benchmarks putting its latest model close to Anthropic's flagship on cyber-defence and coding. The numbers are self-reported and researchers have already raised benchmark-tuning concerns, so treat this as a claim rather than a result.", "heat": 84, "delta": "new", "sources": 6, "url": "https://www.reuters.com/technology/", "glance": "Self-reported Chinese benchmark claim, unverified", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Claimed parity, independent checks pending", "basis": "Vendor-published benchmarks only; third-party replication not yet available"}}, {"t": "Reuters: Washington to make partners choose between US and Chinese AI", "s": "The U.S. is preparing to tell allies they must pick a side across chips, models and cloud as a condition of access. This is the geopolitical version of the price war — and it lands directly on countries like India that are building domestic capacity while shipping products on Chinese open weights.", "heat": 82, "delta": "new", "sources": 4, "url": "https://www.reuters.com/technology/", "glance": "US to force an AI-stack choice on allies", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Procurement decisions get a geopolitical lock-in", "basis": "Reuters exclusive citing officials; policy not yet published"}}, {"t": "Google launches Gemini 3.7 Flash and pushes Gemini into Classroom", "s": "The Flash tier targets high-volume, low-latency work — the exact segment the cheap Chinese models are attacking. Alongside it, Gemini is rolling into Google Classroom with age-tiered controls, its largest school deployment yet.", "heat": 76, "delta": "new", "sources": 4, "url": "https://deepmind.google/blog/introducing-gemini-3-7-flash/", "glance": "Cheap Gemini tier plus a big schools push", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Incremental tier in a crowded price band", "basis": "Vendor launch post; performance claims not independently benchmarked"}}, {"t": "Claude pushed a Riemann-adjacent bound past the human record after 650 failed tries", "s": "An unreleased Claude improved a known bound related to the Riemann hypothesis — not a proof, but past the best human result. The prompting was notably unsophisticated: a non-mathematician mostly sent encouragement across the 650 attempts. A formalised, machine-verifiable version of the proof was published alongside the paper.", "heat": 79, "delta": "rising", "sources": 5, "url": "https://www.youtube.com/watch?v=QnGNF8k_uoc", "glance": "AI beat a human record in pure maths", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "AI is now producing checkable novel maths", "basis": "Formalised proof published and independently verifiable; single result"}}, {"t": "Anthropic is quietly watermarking every Claude output", "s": "Developers found watermarking applied across outputs, raising questions for anyone whose product passes model text through to customers. Anthropic has not published the detection spec.", "heat": 68, "delta": "new", "sources": 2, "url": "https://decrypt.co/375594/anthropic-quietly-watermarking-ai-claude-output-builders-break", "glance": "Watermarks on all Claude output", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Provenance becomes a product constraint", "basis": "Reproduced by multiple developers; vendor documentation absent"}}, {"t": "Anthropic's reported $2 trillion IPO becomes the market's central AI question", "s": "Coverage this week put a $2tn figure on the prospective listing alongside Nvidia's $500bn AI capex plans and OpenAI's ~$40bn revenue run-rate. Whether these numbers hold is the argument that now sets funding conditions for everyone else in the sector.", "heat": 74, "delta": "rising", "sources": 5, "url": "https://www.youtube.com/watch?v=kVzYGVJ8zUk", "glance": "$2tn Anthropic IPO talk sets the sector's mood", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Valuation talk, not a filed prospectus", "basis": "Reported figures from podcasts and press; no S-1 on file"}}, {"t": "Goldman Sachs: only 8-12% of India's non-farm jobs face real AI substitution", "s": "Chief India economist Santanu Sengupta's report finds GenAI could handle 9-17% of tasks, but weighted by occupation only 8-12% of non-farm employment carries real substitution risk, while 42-48% is complemented. Clerical support tops the risk list; manufacturing, construction and trades barely move. AI could add ~0.4pp to annual productivity growth — but only if power and data-centre capacity keep up, and India holds barely 1% of global data-centre capacity.", "heat": 71, "delta": "new", "sources": 4, "url": "https://www.youtube.com/watch?v=HqyI47ya7Gk", "glance": "India's AI job risk is narrower than feared", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Clerical roles at risk; trades and factories are not", "basis": "Occupation-weighted analysis from Goldman's India research desk"}}, {"t": "Qwen 3.8 open weights land and Chinese open models keep compounding", "s": "Alibaba's Qwen 3.8 (2.4T parameters, ~95B active per query) shipped with open weights within a week of launch, and Qwen derivatives on Hugging Face now number over 100,000. Beijing is reportedly weighing restrictions on overseas access to Chinese open-weight models even as Alibaba moves to charge large commercial users — the openness that built the ecosystem is getting more conditional.", "heat": 77, "delta": "rising", "sources": 5, "url": "https://www.reddit.com/r/LocalLLaMA/", "glance": "Chinese open weights compound, but terms are tightening", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Best free local models are now Chinese", "basis": "Weights published; 100k+ derivative models on Hugging Face"}}, {"t": "Canva cuts its valuation by $10bn as 'AI reality bites'", "s": "One of the largest private design companies marked itself down, citing AI-driven pressure on its core market. It is the clearest example yet of AI compressing the value of established software rather than only creating new value.", "heat": 58, "delta": "new", "sources": 2, "url": "https://www.msn.com/en-au/money/news/", "glance": "AI erodes a $10bn slice of Canva's value", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "AI is now subtracting software value too", "basis": "Company-disclosed valuation markdown"}}, {"t": "IBM partners with OpenAI on enterprise deployment", "s": "IBM will package OpenAI models for regulated enterprise workloads, adding a large systems-integrator channel on top of the direct API business.", "heat": 61, "delta": "new", "sources": 2, "url": "https://newsroom.ibm.com/", "glance": "IBM becomes an OpenAI enterprise channel", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "Enterprise distribution, not new capability", "basis": "Joint vendor announcement with named workloads"}}]}, "aitrendsUpdated": "2026-08-15T07:14:34+00:00", "science": {"updated": "2026-08-15T07:14:34+00:00", "items": [{"t": "Oral upadacitinib produces meaningful repigmentation in vitiligo across two phase 3 trials", "s": "Two randomised controlled phase 3 studies (Viti-Up) published in The Lancet found upadacitinib 15 mg once daily gave clinically meaningful repigmentation of both face and total body in adults and adolescents with non-segmental vitiligo, with no new safety signals. Vitiligo has had no effective systemic treatment; an accompanying Lancet Comment calls oral JAK inhibitors 'a new era of innovation' for a condition affecting millions and long dismissed as cosmetic. Peer-reviewed, registrational-grade evidence — this is the kind of result that changes a treatment guideline.", "tag": "Health", "imp": "critical", "glance": "First effective oral drug for vitiligo", "url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)00896-2/fulltext", "published": "2026-08-15T00:00:00+00:00", "src": "The Lancet", "assess": {"mag": 5, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "A treatable disease where there was none", "basis": "Two phase 3 RCTs in The Lancet with repigmentation endpoints met"}, "eli": "Vitiligo is your immune system attacking the cells that give skin its colour. This is a daily pill that calms that specific immune signal — and in two large trials, colour came back."}, {"t": "Engineered bacterium speeds CO2 capture while recovering EV battery metals", "s": "Cornell researchers genetically engineered a bacterium to rapidly break down one of Earth's most abundant silicate minerals — a reaction that locks away atmospheric CO2 and, in the same step, liberates critical elements used in electric-vehicle batteries. Enhanced rock weathering has been too slow to matter industrially; making it biological and fast, with a saleable metals by-product, is what changes the economics. Lab-stage, peer-reviewed.", "tag": "Energy & Materials", "imp": "important", "glance": "Microbe does carbon capture and metal recovery at once", "url": "https://phys.org/news/2026-08-microbe-capture-recovers-critical-metals.html", "published": "2026-08-15T00:00:00+00:00", "src": "Phys.org (Cornell)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Carbon capture that pays for itself", "basis": "Engineered strain demonstrated in lab; industrial scale-up unproven"}}, {"t": "Compact viral RNA elements make mRNA drugs last longer and produce more protein", "s": "A team led by Kim V. Narry at the Institute for Basic Science found short viral RNA elements that stabilise mRNA and raise protein output. Because they are small and modular, they can be dropped into existing mRNA constructs — meaning lower doses, fewer repeat injections and better-behaved mRNA therapeutics without redesigning the platform.", "tag": "Biology", "imp": "important", "glance": "A plug-in that makes mRNA drugs last longer", "url": "https://phys.org/news/2026-08-stable-rna-elements-possibilities-mrna.html", "published": "2026-08-14T17:00:00+00:00", "src": "Phys.org (IBS Korea)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Cheaper, longer-lasting mRNA medicine", "basis": "Modular elements validated in cell systems; peer-reviewed, not yet clinical"}}, {"t": "Cancer stem cells have an 'energy addiction' that can be turned against them", "s": "In high-risk myelodysplastic syndrome, the stem cells that survive chemotherapy and drive relapse depend on a distinct metabolic pathway that ordinary cells do not. Blocking it killed the stem-cell population selectively. Cancer stem cells surviving treatment is the main reason blood cancers come back, so a selective metabolic handle on them matters — this is preclinical.", "tag": "Health", "imp": "important", "glance": "Metabolic weak point in relapse-driving cancer cells", "url": "https://scitechdaily.com/cancer-stem-cells-have-an-energy-addiction-and-scientists-found-a-way-to-exploit-it/", "published": "2026-08-14T19:00:00+00:00", "src": "SciTechDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A way to hit the cells that cause relapse", "basis": "Preclinical selective killing of MDS stem cells; no human data yet"}}, {"t": "Implantable engineered cells reset the body clock, pointing at a real jet-lag treatment", "s": "Rice and Northwestern researchers built an implantable cell therapy that releases circadian-signalling molecules on a schedule, speeding the body's adjustment to a new time zone. Beyond travel, the target is shift work — where chronic circadian misalignment is linked to metabolic disease. Animal-stage.", "tag": "Health", "imp": "important", "glance": "Cell therapy that speeds circadian adjustment", "url": "https://phys.org/news/2026-08-jet-lag-cells-circadian-adjustment.html", "published": "2026-08-14T19:00:00+00:00", "src": "Phys.org (Rice / Northwestern)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Shift-work health, not just jet lag", "basis": "Implantable construct demonstrated in animals; no human trials"}}, {"t": "THC reduces nightmare severity in people with PTSD in a controlled trial", "s": "A THC-based drug cut both the severity and frequency of nightmares in people with post-traumatic stress disorder. Nightmares are among the most treatment-resistant PTSD symptoms and current options are thin, so a controlled positive result here is directly useful to clinicians.", "tag": "Health", "imp": "important", "glance": "THC drug cuts PTSD nightmares in trial", "url": "https://www.newscientist.com/article/2584744-thc-in-cannabis-may-reduce-nightmares-in-people-with-ptsd/", "published": "2026-08-14T14:00:00+00:00", "src": "New Scientist", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "A real option for treatment-resistant nightmares", "basis": "Controlled clinical trial with severity and incidence endpoints"}}]}, "scienceUpdated": "2026-08-15T07:14:34+00:00", "scienceDaily": {"updated": "2026-08-15T07:14:34+00:00", "items": [{"t": "Estrogen-only hormone therapy linked to 39% lower dementia odds in a 21,000-woman study", "s": "Stanford researchers analysed 21,462 women, with brain imaging in 728 and autopsy data in 2,959, and found estrogen-only hormone therapy associated with 39% lower odds of a dementia diagnosis and 35% lower odds of Alzheimer's-related brain changes at autopsy. Published in Neurology. The authors are explicit that this is association, not prevention — and that participants started therapy around age 70, far later than today's practice of starting in the late 40s or early 50s.", "tag": "Health", "imp": "critical", "glance": "Estrogen therapy tied to less Alzheimer's pathology", "url": "https://www.sciencedaily.com/releases/2026/08/260814011028.htm", "published": "2026-08-14T11:30:00+00:00", "src": "ScienceDaily (Neurology / Stanford)", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Reframes the menopause hormone-therapy calculus", "basis": "21,462 participants with 2,959 autopsies; observational, association only"}, "eli": "It doesn't prove hormone therapy prevents Alzheimer's. It does mean women who took estrogen had visibly less Alzheimer's damage in their brains after death — a much harder piece of evidence than a questionnaire."}, {"t": "World's first superconducting quantum heat engine could remove the cabling bottleneck in quantum computers", "s": "A team at Aalto University built a microscopic superconducting engine — transmon qubit, resonator and quantum refrigerator — that ran a full Otto cycle near absolute zero, converting heat into useful work. Published in Nature Communications. The practical point is money and noise: scaling to a thousand logical qubits needs hundreds of thousands of physical qubits and microwave cables costing about a thousand euros each. Autonomous engines built into the circuit could read qubits without running signals across an extreme temperature gradient.", "tag": "Physics & Space", "imp": "important", "glance": "First cyclic quantum heat engine, built and run", "url": "https://www.sciencedaily.com/releases/2026/08/260814011041.htm", "published": "2026-08-14T11:40:00+00:00", "src": "ScienceDaily (Nature Comms / Aalto)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "proven", "verdict": "Removes a hard cost wall in quantum scaling", "basis": "Working device completing an Otto cycle; peer-reviewed in Nature Communications"}}, {"t": "A shut-down nuclear reactor's antineutrino 'afterglow' is detected for the first time", "s": "The Double Chooz collaboration, led from the Max Planck Institute for Nuclear Physics, measured the faint antineutrino emission that continues for months after a reactor is switched off, and found it matched decay predictions for the core and nearby spent-fuel pools. Published in Physical Review Letters. Because antineutrinos pass straight through shielding, this makes it possible to verify what is inside a reactor and its fuel pools even when it is offline — the exact gap in nuclear safeguards inspection.", "tag": "Physics & Space", "imp": "important", "glance": "Reactors can now be monitored while shut down", "url": "https://www.sciencedaily.com/releases/2026/08/260814011036.htm", "published": "2026-08-14T11:10:00+00:00", "src": "ScienceDaily (PRL / MPIK)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "proven", "verdict": "A new tool for nuclear safeguards", "basis": "First measurement of post-shutdown antineutrino flux, matching decay models"}}, {"t": "Vitamin D deficiency plus abdominal obesity carries a 123% higher six-year death risk", "s": "A cohort of more than 5,500 adults over 50 found that abdominal obesity combined with vitamin D deficiency was associated with a 123% higher risk of death over six years. Each factor raised risk on its own, but together the effect was greater than additive. Both are cheap to measure and one is cheap to correct, which is what makes this actionable — though it remains a single observational study.", "tag": "Health", "imp": "important", "glance": "Belly fat plus low vitamin D is a compounding risk", "url": "https://www.sciencedaily.com/releases/2026/08/260813045554.htm", "published": "2026-08-14T02:45:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "Two cheap tests that together predict a lot", "basis": "5,500+ adults over six years; observational, single cohort"}}, {"t": "Stair climbing linked to 39% lower cardiovascular death across 480,000 people", "s": "A pooled analysis of more than 480,000 people found regular stair climbers were 39% less likely to die of cardiovascular disease and 24% less likely to die of any cause than people who rarely took stairs. Observational, so some of that is fitness selecting for stair use — but the sample size makes it one of the better-powered arguments for the cheapest possible intervention.", "tag": "Health", "imp": "important", "glance": "Stairs tied to 39% lower cardiac death", "url": "https://www.sciencedaily.com/releases/2026/08/260814011029.htm", "published": "2026-08-14T12:30:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "The cheapest cardiovascular intervention there is", "basis": "Pooled analysis across 480,000+ people; observational design"}}]}, "scienceDailyUpdated": "2026-08-15T07:14:34+00:00", "life": {"updated": "2026-08-15T07:14:34+00:00", "items": []}, "lifeUpdated": "2026-08-15T07:14:34+00:00", "mind": {"updated": "2026-08-15T07:14:34+00:00", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "The brain clears waste through a fast lane and a slow lane — about 50 times slower in deep tissue", "s": "Using AI-assisted measurement, researchers mapped how cerebrospinal fluid actually moves through the brain and found it travels quickly around the outer spaces but roughly 50 times more slowly through deep tissue. The glymphatic system's clearance rate is central to theories of how amyloid and tau accumulate, and until now the deep-tissue rate was essentially guessed. It also sets a hard constraint on how any drug delivered into cerebrospinal fluid can reach deep structures.", "url": "https://www.sciencedaily.com/releases/2026/08/260811011130.htm", "published": "2026-08-13T18:00:00+00:00", "src": "ScienceDaily (peer-reviewed)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Pins a number on brain waste clearance", "basis": "Direct measurement of glymphatic flow rates in deep vs surface tissue"}, "eli": "Your brain rinses itself while you sleep. Turns out the rinse reaches the surface quickly but crawls through the middle — which may be why damage builds up deep inside."}, {"t": "Myelin precursor cells release the stress hormone CRH to control brain repair after injury", "s": "Researchers found that myelin-producing precursor cells rapidly release corticotropin-releasing hormone near damaged tissue, and that this local signal governs how those cells mature and rebuild nerve insulation. Remyelination failure is the core problem in multiple sclerosis and in recovery from brain injury, so identifying a local, druggable control signal is a real handle on it.", "url": "https://www.sciencedaily.com/releases/2026/08/260814011044.htm", "published": "2026-08-14T11:45:00+00:00", "src": "ScienceDaily (peer-reviewed)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A local switch for rebuilding nerve insulation", "basis": "CRH release by OPCs shown to regulate maturation at injury sites"}}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Nothing new today", "s": "A full scan of the mind feed set plus a targeted BCI sweep (Neuralink, BrainGate, Synchron, Nature Biomedical Engineering) found only policy and market news today — China's first BCI surgery policy and a reported 10-minute transnasal implant under test — with no new peer-reviewed Major/Historic result.", "url": "", "published": "", "src": "", "assess": {"mag": 1, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result today", "basis": "Full feed set scanned; nothing met the Major bar"}}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "Cutting a nerve in the hand reorganises the digit maps in primary somatosensory cortex", "s": "Nature Human Behaviour reports that severing a hand nerve measurably changes how individual fingers are represented in primary somatosensory cortex. Adult cortical maps have long been argued to be far more fixed than the classic plasticity literature claimed; this is direct evidence they reorganise after peripheral injury, which matters for how nerve-repair surgery and prosthetic control are timed and rehabilitated.", "url": "https://www.nature.com/nathumbehav/", "published": "2026-08-13T16:00:00+00:00", "src": "Nature Human Behaviour", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Adult sensory maps do reorganise after injury", "basis": "Digit-map changes measured after peripheral nerve section; peer-reviewed"}}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today", "s": "Scanned the full mind feed set plus a consciousness-specific sweep; this week's material is commentary and review rather than new primary research meeting the Major/Historic bar.", "url": "", "published": "", "src": "", "assess": {"mag": 1, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result today", "basis": "Full feed set scanned; nothing met the Major bar"}}]}]}, "mindUpdated": "2026-08-15T07:14:34+00:00", "mindset": {"updated": "2026-08-15T07:14:34+00:00", "messages": [{"who": "Joseph Rodrigues", "t": "The Mirror Principle: reality reflects exactly what you say, the way you say it", "vid": "_C_0gynpNL8", "url": "https://www.youtube.com/watch?v=_C_0gynpNL8", "gist": "Drawing on Vadim Zeland's Reality Transurfing, Rodrigues teaches the mirror principle: the world is a mirror that reflects your settled self-concept, so he starts 'at the absolute end' — deciding he already is infinite intelligence and fulfillment — and lets the reflection organize accordingly. His evidence is granular: people show up saying the very things he says, videos echo what he taught years ago, and Neville Goddard's Millikan-style affirmation — 'I have a lavish, steady, dependable income, consistent with integrity and mutual benefit' — reflects back as customers who genuinely benefit and compensate him wonderfully, with the integrity clause there to exclude convoluted side effects. The practice is non-conformity: don't look around at how others act and copy what doesn't represent you; say exactly what you think, the way you desire to say it, and treat other people's communicated beliefs as options to play with, not programs to absorb. When action feels heavy, chunk it down — from twenty prospects a day to five, to one, to simply picking up the phone — because every step taken without conforming to the old pattern purifies the mind of conditioning, and a purified mind finds reality reflecting its fulfillment effortlessly, with compassion (the fragrance of unconditional love) shaping what you say and do toward others along the way."}, {"who": "Elmer O. Locker Jr", "t": "The person watching this has shifted into a millionaire today", "vid": "NQEtsJuqc6o", "url": "https://www.youtube.com/watch?v=NQEtsJuqc6o", "gist": "Locker's frame is that the life you are experiencing is a simulation, and that the thing you most want feels far away only because you have stamped it with labels of seriousness, importance and fear. Those labels are the disturbance in the connection — when you treat a manifestation as difficult or high-stakes, the images your mind produces are of it going to someone else, and that is what the low frequency of anxiety actually consists of. The instruction is to become still and present, feel yourself into the wish already fulfilled, and slow time down — his image is Neo at the end of The Matrix, stopping the bullets not by force but by dropping fully into present-moment awareness. The problems and stresses in your life are real only to the degree you keep assigning them realness; the practical move is to withdraw the label of importance from the outcome and step into the version of yourself that already has it, rather than negotiating with the fear."}, {"who": "AH Universe (Abraham Hicks)", "t": "If it is not a full yes, then it is a no", "vid": "GtXVeUR1rfY", "url": "https://www.youtube.com/watch?v=GtXVeUR1rfY", "gist": "A questioner describes three weeks of oscillating over a job offer — feeling certain about the new role, then equally certain about staying — and finally applying the rule that if it isn't a hell yes, it's a hell no, so he stayed put. Abraham's reframe is that the oscillation was never a decision problem. Indecisiveness is itself the signal: when you are genuinely in the receiving mode, the feeling is decisiveness, so the question is not 'which option?' but 'why am I not in the receiving mode?' The honest answers are usually one of two things — it hasn't become important enough to make a priority, or law of attraction already has enough momentum going that you're just riding what you've been thinking about. There is no advantage, Abraham argues, in constructing explanations for why you're out of the receiving mode; once your vortex is that rich, getting into it is the natural and obvious thing to do, and the clarity follows rather than precedes it."}]}, "mindsetUpdated": "2026-08-15T07:14:34+00:00", "youtube": {"count": 12, "note": "Scanned 268 subscribed channels (293 handles minus EXCLUDE genres, the Mind-tab and mindset channels, and @jcub2x); 28 uploads today IST, 12 kept after the transcript and usefulness gates. Videos without real captions were dropped rather than shown without a takeaway.", "groups": [{"h": "🤖 AI & Machine Learning", "items": [{"t": "What Claude Actually Did to the Riemann Hypothesis", "s": "From First Principles walks through what actually happened: Claude did NOT solve the Riemann hypothesis — by some measures it is as open as ever — but it did improve a related bound past the human record. The mechanics are the striking part: prompted mostly with encouragement, it spun up a hierarchical swarm of about 60 autonomous sub-agents that ran ~2,400 shell commands and hundreds of Python scripts, consumed 31 million output tokens and autonomously pulled 54 papers from arXiv. The hosts place it alongside OpenAI's Astra project (10 open problems advanced) as a two-week step change, then separate the hype from the substance.", "glance": "AI didn't solve Riemann, but a 60-agent swarm beat a human record on a related bound — and the orchestration, not the maths, is the real signal.", "vid": "C-ECTnM7tUY", "url": "https://www.youtube.com/watch?v=C-ECTnM7tUY", "imp": "critical", "pointsLabel": "Segments", "points": [{"t": "Why Riemann is the benchmark", "s": "It is the most important unsolved problem in mathematics and has become the gold standard by which AI mathematical ability is judged — Jim Simons, asked if he'd trade his $30bn for a solution, visibly wanted to say yes."}, {"t": "What Claude actually achieved", "s": "Not a proof. It improved a known bound related to the hypothesis beyond the best human result, with a formalised machine-verifiable version published alongside."}, {"t": "How it worked", "s": "A hierarchical swarm of ~60 sub-agents, 2,400 shell commands, hundreds of Python scripts, 31M output tokens, 54 papers downloaded autonomously — the scaffolding did as much as the model."}, {"t": "Hype vs substance", "s": "Two camps — 'AI will never make meaningful mathematical progress' and 'singularity in mathematics'. The hosts argue both are wrong and the honest read is a real but narrow result."}], "published": "2026-08-14T19:29:01+00:00"}, {"t": "Anthropic's $2T IPO, Zuck's AI Manifesto, Nvidia's $500B AI Bet, Grok 4.6", "s": "The All-In crew (Sacks and Gavin Baker this week) cover the week's AI finance story. The core argument: AI's total addressable market is now constrained by the ability to FINANCE the buildout, not by demand. Nvidia's move is to alleviate that constraint — arranging bank and private-equity credit lines for GPU buyers rather than vendor-financing directly, which Baker argues is not the circular financing critics fear but lending against expected GPU cash flows with payback periods as short as a year. Musk wants to add 6-8GW next year at $300-400bn of capex against ~$100bn just raised.", "glance": "The AI bottleneck has shifted from chips to financing — Nvidia is now effectively arranging the credit that lets its customers buy its chips.", "vid": "kVzYGVJ8zUk", "url": "https://www.youtube.com/watch?v=kVzYGVJ8zUk", "imp": "critical", "pointsLabel": "Segments", "points": [{"t": "Financing is the new constraint", "s": "Baker: the numbers are so big the TAM is limited by ability to finance the buildout. Nvidia arranging bank/PE credit lines removes that constraint for downstream buyers."}, {"t": "Is it circular?", "s": "Baker says no — this is Wall Street and private equity lending against expected GPU cash flows, not Nvidia booking its own revenue, with payback potentially inside a year."}, {"t": "Zuckerberg's 6,500-word AI manifesto", "s": "Sacks reads it as arguing for maximum individual empowerment, decentralised outcomes, open models and data sovereignty — coexisting with proprietary frontier models from Anthropic and OpenAI."}, {"t": "Grok 4.6 breaks the duopoly", "s": "Baker had maintained a frontier-lab duopoly of Anthropic and OpenAI as recently as last week; on the Pareto frontier of capability vs cost, Grok 4.6's pricing makes it a genuine third."}], "published": "2026-08-14T20:36:20+00:00"}, {"t": "HOW?!?! SpaceX AI Just Shocked The World (again)", "s": "Walks through the Grok 4.6 Pareto-frontier chart — capability on one axis, cost on the other — and argues xAI/SpaceX AI has broken what was a two-lab frontier. Recorded hours before the Cursor acquisition formally closed; the host splices in the official Cursor announcement confirming the team has joined SpaceX AI to work on Grok, Grok Build, Grok Bot and the Cursor product.", "glance": "Grok 4.6 sits on the outer edge of the capability-versus-cost frontier, and the Cursor acquisition closing the same week is what makes that durable rather than a one-off.", "vid": "xa5Ov0u1nNY", "url": "https://www.youtube.com/watch?v=xa5Ov0u1nNY", "imp": "important", "published": "2026-08-15T05:15:20+00:00"}, {"t": "Qwen 3.8 27B local AI review", "s": "A hands-on zero-shot test of Alibaba's Qwen 3.8 27B running locally in vLLM, orchestrated with a Hermes agent. Asked to build three retro 8-bit arcade games with synthwave audio and a global leaderboard, it produced working JavaScript — playable, with sound and persistent scores — in 2 hours 40 minutes on consumer hardware, entirely offline. The reviewer's verdict is that code quality is substantially better than anything he has seen from a local model before.", "glance": "A 27B model you can run on your own hardware now writes working, playable applications zero-shot — the quality gap between local and hosted models has narrowed sharply.", "vid": "jZ9Mdit5TdI", "url": "https://www.youtube.com/watch?v=jZ9Mdit5TdI", "imp": "important", "published": "2026-08-14T21:10:39+00:00"}, {"t": "AI has no duty of loyalty to you", "s": "Ryan Greenblatt points out that Claude's constitution explicitly makes the model not your advocate — it says Claude should trust Anthropic more than operators and users. He contrasts this with legal ethics, where a lawyer's duty runs to the client even against the lawyer's own judgement, and argues the whole system works better that way. Dwarkesh extends it: providing electricity doesn't come with granular control over how it is used, but AI labs are building something closer to an alien mind that might be a contractor for you.", "glance": "The model you rely on is contractually loyal to its lab, not to you — worth knowing before you treat it as an advisor.", "vid": "BL75EMfz_N8", "url": "https://www.youtube.com/watch?v=BL75EMfz_N8", "imp": "important", "published": "2026-08-14T21:48:10+00:00"}, {"t": "The best local AI music generator is here", "s": "MiniMax Music, an open-source music generation model whose smallest variant is only 2.5GB — small enough for ordinary consumer hardware. Demos cover pop-rock, punk and neo-soul R&B with generated lyrics and vocals, and the video covers local installation for unlimited free offline generation.", "glance": "Usable AI music generation now fits in 2.5GB and runs offline, so the cost of generated audio for any project drops to zero.", "vid": "aUcDyeZgz_k", "url": "https://www.youtube.com/watch?v=aUcDyeZgz_k", "imp": "interesting", "published": "2026-08-15T03:20:14+00:00"}, {"t": "3 new ways to use ChatGPT Codex", "s": "Three capabilities that landed without much notice: Codex can now open a browser and search social platforms directly, with no API connection needed; you can build and publish a dashboard, game or web app to a shareable URL without leaving Codex, so no separate hosting; and connecting an iPhone via the desktop app's remote feature gives you a voice session that drives Codex on your computer while you're away from the desk.", "glance": "Codex now browses the live web, publishes what it builds to a shareable link, and takes voice instructions from your phone — no API keys or hosting needed.", "vid": "aszRSGI_Iwg", "url": "https://www.youtube.com/watch?v=aszRSGI_Iwg", "imp": "important", "short": true, "published": "2026-08-15T00:47:28+00:00"}]}, {"h": "🚀 Space & Science", "items": [{"t": "Elon Musk unveils SpaceX's AI roadmap", "s": "Musk says SpaceX has already built the world's most powerful AI training clusters and expects roughly ten times that capacity by the end of next year — targeting 10GW online. His arithmetic: at $30-50 of value per watt, 10GW implies $300-500bn a year in revenue. The strategic claim underneath it is that AI training stays on the ground but inference — day-to-day use — moves to space.", "glance": "Musk's bet is that AI training stays on Earth while inference moves to orbit, with 10GW online by end-2027 implying $300-500bn a year.", "vid": "xxo8u9VoB0k", "url": "https://www.youtube.com/watch?v=xxo8u9VoB0k", "imp": "important", "short": true, "published": "2026-08-15T03:01:26+00:00"}, {"t": "Mars colony vs fixing Earth first", "s": "Musk's argument against the 'fix Earth first' objection: the two are not mutually exclusive, and an off-site backup of humanity is insurance against the class of events you cannot fix from here. He points to five known mass extinction events in Earth's history and asteroid impact as the obvious example.", "glance": "The case for a Mars backup is an insurance argument, not an abandonment one — you can work on both at once.", "vid": "h-ccMlGJcBo", "url": "https://www.youtube.com/watch?v=h-ccMlGJcBo", "imp": "interesting", "short": true, "published": "2026-08-14T20:59:54+00:00"}, {"t": "Chasing the 'double sunset' eclipse — and the meteor shower after it", "s": "A first-person account of travelling 18 hours to a mountain for the total solar eclipse sunset, watching cloud roll in at the peak, and then getting the shot anyway as the sun visibly morphed shape while setting — followed after dark by a dense meteor shower.", "glance": "The rare eclipse-at-sunset is worth understanding as an alignment event: totality and sunset coinciding distorts the sun's shape visibly at the horizon.", "vid": "JaUy10j1FGY", "url": "https://www.youtube.com/watch?v=JaUy10j1FGY", "imp": "interesting", "short": true, "published": "2026-08-14T23:13:07+00:00"}]}, {"h": "📱 Tech & Gear", "items": [{"t": "Samsung Galaxy S26 FE fully leaked", "s": "The camera island now matches the S26 series and looks like the S26 Plus. IP68, Gorilla Glass Victus+ front and back, the same 6.7-inch 120Hz LTPO AMOLED with slightly thinner bezels. Exynos 2500 with 8GB LPDDR5X and 128GB UFS 3.1 — the weak spot. Cameras unchanged from last year: 50MP OIS main, 8MP 3x telephoto, 12MP ultrawide and selfie. Likely silicon-carbon battery, so thinner and lighter at the same 4,900mAh, with 45W wired and 15W wireless. One UI 9, seven years of updates. Launch expected next month at roughly ₹65,000-75,000.", "glance": "The S26 FE keeps last year's cameras and pairs a mid-tier Exynos with UFS 3.1 storage at ₹65-75k — the silicon-carbon battery is the only real upgrade.", "vid": "Bls3h7zlxlQ", "url": "https://www.youtube.com/watch?v=Bls3h7zlxlQ", "imp": "important", "short": true, "published": "2026-08-15T05:30:15+00:00"}, {"t": "Google's Fitbit Air lands in India", "s": "A wrist tracker small and light enough to sleep in, covering heart rate, sleep, HRV, SpO2 and workouts. The differentiator is AI Coach in the Google Health app — a Gemini-based layer that turns the raw numbers into instructions, e.g. flagging a six-hour night and giving specific recovery steps, plus daily briefs on activity, recovery and heart metrics. Expected under ₹15,000 in India.", "glance": "Under ₹15k, the Fitbit Air's real feature is the Gemini health coach translating raw metrics into what to actually do that day.", "vid": "CdsDdxsI2Fk", "url": "https://www.youtube.com/watch?v=CdsDdxsI2Fk", "imp": "interesting", "short": true, "published": "2026-08-15T05:30:08+00:00"}]}]}, "elon": {"day": "2026-08-14", "source": "@jcub2x daily recap", "note": "Built from @jcub2x's '56 posts' recap for 08/14/26 (video DAQMX3zIJyY, published 08-14 23:00Z, ~14h old at build time). Engagement counts are not included in the recap, so likes/views are omitted and posts are ordered most-notable-first rather than by engagement. Politically charged posts are summarised neutrally; third-party claims Musk amplified are attributed to their authors, not asserted as fact.", "highlight": {"t": "SpaceX formally closes its acquisition of Cursor — the largest AI acquisition on record", "s": "Cursor announced the deal closed and its account now carries the SpaceX AI logo. The team joins SpaceX AI to work on Grok, Grok Build, Grok Bot, the Grok API and Cursor itself. SpaceX's own post framed it as starting with software engineering and expanding into knowledge work; Musk replied simply 'Welcome'. It lands the same week Grok 4.6 shipped at frontier-adjacent quality on cost-per-task, and xAI has said the extra curated engineering data was a large part of that jump.", "href": "https://www.theinformation.com/"}, "items": [{"kind": "repost", "t": "Cursor's official account announcing the acquisition closed", "s": "Cursor said its team is joining SpaceX AI to help make Grok 'the world's most useful artificial intelligence' and to improve Grok Build, Grok Bot, the Grok API and Cursor. Musk replied 'Welcome' and reposted SpaceX AI's own welcome message, which framed the scope as starting with software engineering and expanding into knowledge work.", "imp": "critical", "iso": "2026-08-14T18:00:00+00:00"}, {"kind": "post", "t": "Musk on Grok 4.6's ARC-AGI results and the harness debate", "s": "Arc Prize published Grok 4.6 at 87% on ARC-AGI-1 at $0.30 a task and 67% on ARC-AGI-2 at $0.76. A researcher pointed out Arc's standard harness discarded prior reasoning and truncated context, which understated GPT-5.6; re-run with context preservation, the comparison narrows. Musk's response: 'Grok performs far better with its Build harness.'", "imp": "important", "iso": "2026-08-14T16:00:00+00:00"}, {"kind": "post", "t": "Musk says Grok 4.6 should be evaluated inside Grok Build", "s": "Responding to a user who found 4.6 highly optimised for Grok Build, Musk said the experience will be 'significantly worse' without that harness and that evaluations should use Build — an unusually explicit admission that the scaffolding, not just the model, carries the performance.", "imp": "important", "iso": "2026-08-14T15:30:00+00:00"}, {"kind": "post", "t": "X is releasing a new livestreaming system", "s": "Replying to a user asking for more livestreams, Musk said X is shipping a new livestreaming system and that he will stream playing games and answering questions on it.", "imp": "important", "iso": "2026-08-14T12:00:00+00:00"}, {"kind": "reply", "t": "Musk corrects a claim about his SpaceX stake", "s": "Responding to a post stating he owns about 48% of SpaceX (over 6.42 billion shares), Musk said a portion only vests on 'extremely crazy good outcomes', so his actual fully-vested percentage is lower.", "imp": "important", "iso": "2026-08-14T14:00:00+00:00"}, {"kind": "repost", "t": "Tesla owner's account of full self-driving avoiding a truck tyre blowout", "s": "A Texas owner described driving roughly 800 miles from Georgia without touching the wheel or pedals, and shared dashcam footage of the car reacting to a truck tyre blowout that covered her windshield in sparks. This is an individual owner's account rather than verified safety data, but Musk reposted it with 'Tesla self-driving is amazing'.", "imp": "important", "iso": "2026-08-14T10:00:00+00:00"}, {"kind": "repost", "t": "Robotaxi wait times in Austin reported at two minutes", "s": "Gail Alfar posted that a Tesla robotaxi arrived in about two minutes in an Austin area where waits had previously run up to 20 minutes, and that this was consistent across repeat trips. Single-user anecdote, reposted by Musk.", "imp": "important", "iso": "2026-08-14T11:00:00+00:00"}, {"kind": "repost", "t": "A Tesla engineer says Grok 4.6's multimodal is a step change", "s": "Tesla's Yuntao called Grok 4.6's video and image understanding a major upgrade over 4.5 — claiming 10x to 100x productivity on video-review workloads and saying it outperforms Gemini 3.5 and Gemma 4 in his use. Musk reposted and separately urged users to try 4.6's image and video understanding.", "imp": "important", "iso": "2026-08-14T13:00:00+00:00"}, {"kind": "repost", "t": "SpaceX AI says it has paid $30 million in taxes in Memphis since 2024", "s": "The SpaceX Memphis account posted that the company has paid $30m in local taxes supporting public services, education and infrastructure since arriving in 2024, in response to ongoing local objections to the site.", "imp": "interesting", "iso": "2026-08-14T09:00:00+00:00"}, {"kind": "repost", "t": "Grok Build gains parallel agent workflows", "s": "Workflows in Grok Build can now run up to 100 agents in parallel against a plan, with the system reviewing, verifying and synthesising the results into a single report. Available free in Grok Build.", "imp": "important", "iso": "2026-08-14T15:00:00+00:00"}, {"kind": "repost", "t": "A16Z on why Cursor and SpaceX fit", "s": "A16Z argued the two are a cultural match — both defined by iteration at 'a pace and intensity that borders on the absurd' — noting Cursor reinvented itself twice in under four years, from email client to autocomplete IDE and token reseller, then to an AI lab.", "imp": "interesting", "iso": "2026-08-14T18:30:00+00:00"}, {"kind": "repost", "t": "Winners of the SpaceX AI Grokathon 2026", "s": "First place taught Grok to reverse-engineer binaries into clean C, rebuilding a 1995 engine control unit runtime from a 262KB Game Boy ROM. Second built a following-graph tool that A/B tests posts against simulated audiences. Third combined Grok voice with brain-sensing to let users speak without moving their mouth, selecting responses via subtle motor movements.", "imp": "interesting", "iso": "2026-08-14T19:00:00+00:00"}, {"kind": "repost", "t": "X publishes per-account algorithm transparency reports", "s": "A user demonstrated downloading a full report showing whether their account or posts were being suppressed and the exact reason for any visibility limit. Musk reposted a comment calling it 'the best demo I've seen yet'.", "imp": "interesting", "iso": "2026-08-14T12:30:00+00:00"}]}, "elonNews": [{"t": "SpaceX completes its $60 billion acquisition of Cursor", "s": "The largest AI acquisition on record closed today; Business Insider reports three areas where the teams are already working together.", "url": "https://www.theinformation.com/", "published": "2026-08-14T13:00:00+00:00", "src": "The Information / Business Insider"}, {"t": "Tesla nears the reveal of a 'flying' Roadster, possibly this month", "s": "The Information reports the demo is close, with a street-legal version alongside it.", "url": "https://www.teslarati.com/", "published": "2026-08-14T15:00:00+00:00", "src": "Teslarati / The Information"}, {"t": "SpaceX plans a new Starship test site at Kennedy Space Center", "s": "Adds a second East Coast test footprint alongside the existing pads.", "url": "https://www.floridatoday.com/", "published": "2026-08-14T14:40:00+00:00", "src": "Florida Today"}, {"t": "Gina Rinehart reveals a $1.4 billion SpaceX stake; Saudi PIF also reports a holding", "s": "Two large sovereign-and-tycoon positions surfaced on the same day.", "url": "https://www.bloomberg.com/", "published": "2026-08-14T14:20:00+00:00", "src": "Bloomberg"}, {"t": "Tesla ends the Sweden strike by buying out every striker", "s": "Closes a multi-year labour dispute that had blocked service and registration support across the country.", "url": "https://thenextweb.com/", "published": "2026-08-14T14:00:00+00:00", "src": "The Next Web"}, {"t": "Tesla and SpaceX's Terafab begins production", "s": "First image released of output from the new fabrication facility.", "url": "https://www.torquenews.com/", "published": "2026-08-14T13:50:00+00:00", "src": "Torque News"}, {"t": "Tesla's $10.1 billion Texas solar factory signals a new US manufacturing push", "s": "One of the largest single solar manufacturing commitments announced in the US.", "url": "https://carboncredits.com/", "published": "2026-08-14T13:40:00+00:00", "src": "Carbon /* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

  const im={critical:3,important:2,interesting:1,noise:0}[(it&&it.imp||"").toLowerCase()]||0;
  const heat=Math.max(0,Math.min(100,+((it&&it.heat)||0)))/100;
  if(typeof (it&&it.big)==="number") return it.big;   // explicit override

}

const F_STOP=new Set("the a an of to in on at for and or but with from into over after new news latest says said report first second third two three more most amid as by is are was were will be been being this that these those it its his her their they you your our we can could may might has have had about than then them who what when where why how also just still now today year years week day over under up down out off".split(" "));

    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
</script>
