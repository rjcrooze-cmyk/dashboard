GxVZmtFLUM4b3RaTEFOdW1IQjlVT0tkSzVvR09FNVdxRGpTWWtRNzFIUUlJQWM1cjU1MU9MUGYzM000aFBXeVFNMmEwRzIwVHlrREFzODJMR1pLUXZjbjBHcmUtbldGTkZDamNPMURyTQ?oc=5", "published": "2026-08-14T01:41:23+00:00", "src": "Deccan Herald"}, {"t": "A Mysuru expo traces India's currency from ancient coins to modern notes", "s": "The exhibition walks through punch-marked coins, princely-state issues and post-independence notes, and runs alongside the city's Independence Day programmes.", "imp": "interesting", "glance": "Mysuru currency expo opens", "url": "https://www.thehindu.com/news/national/karnataka/ancient-coins-to-modern-notes-mysuru-expo-traces-indias-currency-journey/article71346069.ece", "published": "2026-08-14T14:37:22+00:00", "src": "The Hindu"}, {"t": "EPFO's Mysuru regional office opens an enrolment drive for uncovered workers", "s": "The campaign targets small establishments and contract workers in the Mysuru region who are outside provident fund coverage, with camp-based registration through the month.", "imp": "interesting", "glance": "EPFO enrolment drive in Mysuru", "url": "https://www.thehindu.com/news/national/karnataka/epfos-mysuru-regional-office-launches-enrolment-campaign/article71346156.ece", "published": "2026-08-14T14:53:47+00:00", "src": "The Hindu"}]}, {"h": "🏙️ Bengaluru", "tag": "Bengaluru", "items": [{"t": "West Bengal man held in Bengaluru over an alleged TTP-linked attack plot", "s": "Police arrested a security guard from West Bengal who they say was in contact with an Afghan national and planned attacks, including on Pakistan Army targets, after trying to travel to Afghanistan. Investigators are examining his online contacts.", "imp": "critical", "glance": "Terror plot arrest in Bengaluru", "url": "https://www.thehindu.com/news/cities/bangalore/security-guard-held-for-alleged-terror-plot-targeting-pakistan-army-tehreek-e-taliban-pakistan-ttp-links-in-bengaluru/article71347241.ece", "published": "2026-08-15T07:39:41+00:00", "src": "The Hindu"}, {"t": "Bengaluru's single police commissionerate is to be split into five", "s": "The chief minister's Independence Day announcement breaks up the city force into five commissionerates, a restructuring long argued for on span-of-control grounds and long resisted on coordination grounds.", "imp": "important", "glance": "City police to become five commissionerates", "url": "https://indianexpress.com/article/cities/bangalore/bengaluru-police-commissionerate-five-units-dk-shivakumar-10834717/", "published": "2026-08-15T09:25:25+00:00", "src": "The Indian Express"}, {"t": "Bengaluru's bus stops fail passengers on shelter, signage and safety", "s": "A survey of the city's bus stops found most lack seating, route information or safe pedestrian access, undercutting BMTC ridership targets even as bus numbers rise.", "imp": "important", "glance": "City bus stops fail basic standards", "url": "https://news.google.com/rss/articles/CBMiywFBVV95cUxPSzRRekpNX2s2Z2t4bEltRlZFMlc2Y3ZyZGZoV29SSXd6OEdSMmFDUTQ5LVk2QWZNcVRWTUtQU0haQnpiTE5BRm1hZ1FnOUZkR0hHN1Fmdld0M3JxZXBLamRlSGtLeGZXUUNKLTRaUW1LR1hEajM0enktMmIzOWtua21Yckl5NnB4dUhOcllwa0d6SmlRNGFQSVlIRVNhcWQ3MTJVLUcwMW9GcDBqSGFPZkl5ZVA3NUJqS1BxYTNrMEU5TDVFUWtUbzBWdw?oc=5", "published": "2026-08-15T05:59:40+00:00", "src": "Deccan Herald"}, {"t": "Bengaluru contractor alleges extortion threat from a jailed gangster over a garbage contract", "s": "The complainant says he was pressured from inside prison to surrender a solid-waste contract, reviving questions about phone access in Karnataka jails and about muscle in the city's waste tenders.", "imp": "important", "glance": "Extortion claim over city garbage contract", "url": "https://indianexpress.com/article/cities/bangalore/bengaluru-garbage-contract-jailed-gangster-threat-contractor-fir-10834569/", "published": "2026-08-15T07:52:40+00:00", "src": "The Indian Express"}]}]}, "newsUpdated": "2026-08-15T12:27:49+00:00", "aitrends": {"updated": "2026-08-15T12:27:49+00:00", "items": [{"t": "SpaceX AI closes the Cursor acquisition", "s": "xAI — now folded into Musk's SpaceX AI structure — closed its acquisition of Cursor, with the Cursor team moving onto Grok, Grok Build, Grok Bot and the Grok API. Musk publicly welcomed the team. The concrete use-case is a coding-agent stack shipped inside Grok rather than as a separate IDE.", "heat": 97, "delta": "steady", "sources": 4, "url": "https://x.com/cursor_ai", "glance": "The best-known AI coding tool is now inside Grok", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "A frontier lab buys its coding front-end", "basis": "Deal closed and announced by both parties"}}, {"t": "Grok 4.6 reaches the price-performance frontier", "s": "The ~1.5T-parameter Grok 4.6 is now Pareto-optimal on Cursor Bench and on Databricks' independent evaluation — comparable coding quality to the top frontier models at roughly $2/$6 per million tokens against $5/$30. Practical effect: agentic coding gets materially cheaper this week, with 4.7 promised in 3-4 weeks.", "heat": 94, "delta": "new", "sources": 5, "url": "https://x.ai/news/grok-4-6", "glance": "Frontier-grade coding at a third of the price", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Real frontier parity at a third the cost", "basis": "Third-party benchmarks (Cursor Bench, Databricks); vendor claims contested"}}, {"t": "Anthropic's ~$2 trillion IPO becomes the market's central question", "s": "Reporting points to an October listing near a $2T valuation on roughly $100-120bn annualised revenue — about 16-20x sales after three straight years of 10x growth. The debate that matters for everyone else is the ceiling: compute and power, not demand, is now the binding constraint on further scaling.", "heat": 91, "delta": "rising", "sources": 3, "url": "https://www.ft.com/", "glance": "AI's growth ceiling is now power, not demand", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "A market-defining listing, still unconfirmed", "basis": "Press reporting; no S-1 filed, valuation unconfirmed by Anthropic"}}, {"t": "GLM 5.3 ships and finds 2,436 unpatched open-source vulnerabilities", "s": "Z.ai's GLM 5.3 launched with frontier coding scores and an emergent cyber capability: in Project Glasswing it surfaced 2,436 unpatched vulnerabilities in open-source projects that other models had missed. The use-case cuts both ways — automated vulnerability discovery is defensive tooling and offensive tooling at the same time.", "heat": 89, "delta": "new", "sources": 4, "url": "https://z.ai/blog/glm-5.3", "glance": "An open model that finds thousands of real CVEs", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Automated vuln discovery reaches useful scale", "basis": "Released model plus a published, reproducible vulnerability sweep"}}, {"t": "Anthropic starts watermarking every Claude output", "s": "Anthropic is now weaving machine-readable watermarks into text from supported Claude models across the API, Claude Code, Cowork and Tag, and says it survives copy-paste and light editing. Google is simultaneously letting users strip Gemini's *visible* AI badge. Provenance is becoming infrastructure, and the two biggest labs are moving in opposite directions on how visible it should be.", "heat": 84, "delta": "rising", "sources": 4, "url": "https://www.anthropic.com/news", "glance": "AI text provenance becomes default infrastructure", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Provenance shifts from opt-in to default", "basis": "Shipped across Anthropic surfaces; robustness claims not independently audited"}}, {"t": "Nvidia lines up $500bn to turn GPUs into a financeable asset class", "s": "Nvidia is working with Goldman, BlackRock, Blackstone, KKR and Apollo on a ~$500bn financing structure, acting as matchmaker and offering residual-value guarantees on three-to-four-year GPU rental rates so lenders can underwrite against them. If it works, compute buildout stops competing for equity and starts competing for debt.", "heat": 82, "delta": "new", "sources": 3, "url": "https://blogs.nvidia.com/", "glance": "GPUs become collateral, not just capex", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Could change how compute buildout is funded", "basis": "Reported structure; terms and participants not finalised publicly"}}, {"t": "Qwen 3.8 27B lands and open weights close the agentic gap", "s": "Alibaba's Qwen 3.8 27B is the release the local-model community actually noticed: reviewers report a full 256K context fitting in VRAM on consumer multi-GPU rigs, thinking mode usable without breaking agentic loops, and a zero-shot build of three working games with no failed tool calls. Open weights are now genuinely agentic, not just chatty.", "heat": 80, "delta": "new", "sources": 5, "url": "https://huggingface.co/Qwen", "glance": "Local open models get reliable tool use", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Open weights become agentically usable", "basis": "Public weights plus multiple independent hands-on evaluations"}}, {"t": "Claude pushes the Riemann critical-line bound to 67.25%", "s": "An unreleased Claude model raised the proven lower bound on the share of non-trivial Riemann zeta zeros on the critical line from 41.7% (2022) to 67.25% in about 30 hours, orchestrating 60 sub-agents across 2,400 shell commands and 31M output tokens, and autonomously pulling 54 arXiv papers. Not a proof of the hypothesis, and mathematicians agree the method has a ceiling — but it is a real, checkable research result produced by an agent swarm.", "heat": 79, "delta": "new", "sources": 3, "url": "https://www.youtube.com/watch?v=C-ECTnM7tUY", "glance": "An agent swarm produced a real maths result", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Genuine machine-produced research advance", "basis": "Result is checkable; model unreleased and method has a known ceiling"}}, {"t": "OpenAI ships GPT-5.6 Sol Ultrafast at 14x speed on Cerebras", "s": "OpenAI previewed an 'Ultrafast' mode running GPT-5.6 Sol at up to 14x its normal speed — roughly 750 output tokens/second — served on Cerebras hardware, currently limited to trusted testers. The use-case is latency-bound work: interactive agents and real-time coding where waiting is the actual bottleneck.", "heat": 77, "delta": "new", "sources": 4, "url": "https://openai.com/index/previewing-ultrafast", "glance": "Frontier quality at interactive latency", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Latency stops being the agent bottleneck", "basis": "Vendor preview with Cerebras; limited access, no public benchmarks"}}, {"t": "An OpenAI talent exodus lands right before the IPO", "s": "A wave of senior departures — including a fresh CRO appointment after an executive shake-up — is being read as a red flag ahead of the listing. Mostly a governance story rather than a capability one, but it is the loudest AI thread of the last few hours.", "heat": 74, "delta": "new", "sources": 4, "url": "https://techcrunch.com/2026/08/13/openai-hires-new-cro-as-executive-shake-up-continues/", "glance": "Executive churn shadows the OpenAI listing", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Signal about the company, not the models", "basis": "Press reports and departure counts; internal reasons unconfirmed"}}, {"t": "Gemini 3.7 Flash halves the price of Google's fast tier", "s": "Gemini 3.7 Flash arrived three weeks after 3.6 at $0.75 per million input and $3.75 output — half the previous Flash — running around 340 tokens/second, with computer-use built into the model. Reporting also says Google shelved Gemini 3.5 Pro to move engineers onto Gemini 4.", "heat": 72, "delta": "new", "sources": 3, "url": "https://deepmind.google/blog/introducing-gemini-3-7-flash/", "glance": "Google halves its fast-tier token price", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Price cut, not a capability jump", "basis": "Published pricing and model card; the Gemini 4 reshuffle is reported, not confirmed"}}, {"t": "A 150M-parameter recurrent model scores 29.5% on ARC-AGI-1", "s": "A tiny recurrent model reached 29.5% on ARC-AGI-1 at roughly $0.0007 per task — orders of magnitude cheaper than frontier models on the same benchmark. Early and single-source, but it is the strongest recent argument that abstraction benchmarks reward architecture over scale.", "heat": 69, "delta": "new", "sources": 2, "url": "https://www.reddit.com/r/LocalLLaMA/comments/1voh6tx/", "glance": "Tiny models can beat scale on abstraction", "assess": {"mag": 3, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Suggestive result, needs replication", "basis": "Single report on one benchmark; no peer review or independent rerun"}}, {"t": "Apple trains its own model for the China market", "s": "Apple is reported to be training a China-specific model rather than licensing a domestic partner's, which would make it the first foreign company to run its own frontier-scale model inside China's regulatory regime.", "heat": 66, "delta": "new", "sources": 2, "url": "https://www.reddit.com/r/singularity/comments/1vny8z7/", "glance": "Apple goes it alone on China AI", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Would be a first if confirmed", "basis": "Single-sourced report; Apple has not confirmed"}}, {"t": "Databricks settles at a $190bn valuation after a $5bn round", "s": "Databricks wanted $1bn, investors pushed for $15bn, and it landed at $5bn on a $190bn valuation — a clean read on how much private capital is chasing the AI data layer rather than the model layer.", "heat": 61, "delta": "new", "sources": 2, "url": "https://techcrunch.com/2026/08/13/databricks/", "glance": "Private capital piles into the AI data layer", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Funding signal, not a technology one", "basis": "Round reported with named terms; strategic effect unproven"}}]}, "aitrendsUpdated": "2026-08-15T12:27:49+00:00", "science": {"updated": "2026-08-15T12:27:49+00:00", "items": [{"t": "Oral upadacitinib produces meaningful repigmentation in vitiligo across two phase 3 trials", "s": "Two randomised controlled phase 3 studies (Viti-Up) published in The Lancet found upadacitinib 15 mg once daily gave clinically meaningful repigmentation of both face and total body in adults and adolescents with non-segmental vitiligo, with no new safety signals. Vitiligo has had no effective systemic treatment; an accompanying Lancet Comment calls oral JAK inhibitors 'a new era of innovation' for a condition affecting millions and long dismissed as cosmetic. Peer-reviewed, registrational-grade evidence — this is the kind of result that changes a treatment guideline.", "tag": "Health", "imp": "critical", "glance": "First effective oral drug for vitiligo", "url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)00896-2/fulltext", "published": "2026-08-15T00:00:00+00:00", "src": "The Lancet", "assess": {"mag": 5, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "A treatable disease where there was none", "basis": "Two phase 3 RCTs in The Lancet with repigmentation endpoints met"}, "eli": "Vitiligo is your immune system attacking the cells that give skin its colour. This is a daily pill that calms that specific immune signal — and in two large trials, colour came back."}, {"t": "Engineered bacterium speeds CO2 capture while recovering EV battery metals", "s": "Cornell researchers genetically engineered a bacterium to rapidly break down one of Earth's most abundant silicate minerals — a reaction that locks away atmospheric CO2 and, in the same step, liberates critical elements used in electric-vehicle batteries. Enhanced rock weathering has been too slow to matter industrially; making it biological and fast, with a saleable metals by-product, is what changes the economics. Lab-stage, peer-reviewed.", "tag": "Energy & Materials", "imp": "important", "glance": "Microbe does carbon capture and metal recovery at once", "url": "https://phys.org/news/2026-08-microbe-capture-recovers-critical-metals.html", "published": "2026-08-15T00:00:00+00:00", "src": "Phys.org (Cornell)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Carbon capture that pays for itself", "basis": "Engineered strain demonstrated in lab; industrial scale-up unproven"}}, {"t": "A gold nanoantenna steers infrared light through a waveguide that isn't physically there", "s": "A team at Göttingen's 4th Physics Institute placed a nanoscale gold antenna on a crystal and sent infrared light down a single narrow path without carving any waveguide into the material. The use-case is direct: on-chip optical routing that can be reconfigured rather than etched, for integrated photonics and quantum hardware.", "tag": "Physics & Space", "imp": "important", "glance": "Reconfigurable on-chip light routing", "url": "https://scitechdaily.com/scientists-steer-infrared-light-through-an-invisible-waveguide/", "published": "2026-08-14T23:30:28+00:00", "src": "SciTechDaily / Uni Göttingen", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Etch-free optical routing demonstrated on a chip", "basis": "Peer-reviewed lab demonstration of antenna-defined infrared guiding"}}, {"t": "Cancer stem cells have an 'energy addiction' that can be turned against them", "s": "In high-risk myelodysplastic syndrome, the stem cells that survive chemotherapy and drive relapse depend on a distinct metabolic pathway that ordinary cells do not. Blocking it killed the stem-cell population selectively. Cancer stem cells surviving treatment is the main reason blood cancers come back, so a selective metabolic handle on them matters — this is preclinical.", "tag": "Health", "imp": "important", "glance": "Metabolic weak point in relapse-driving cancer cells", "url": "https://scitechdaily.com/cancer-stem-cells-have-an-energy-addiction-and-scientists-found-a-way-to-exploit-it/", "published": "2026-08-14T19:00:00+00:00", "src": "SciTechDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A way to hit the cells that cause relapse", "basis": "Preclinical selective killing of MDS stem cells; no human data yet"}}, {"t": "Implantable engineered cells reset the body clock, pointing at a real jet-lag treatment", "s": "Rice and Northwestern researchers built an implantable cell therapy that releases circadian-signalling molecules on a schedule, speeding the body's adjustment to a new time zone. Beyond travel, the target is shift work — where chronic circadian misalignment is linked to metabolic disease. Animal-stage.", "tag": "Health", "imp": "important", "glance": "Cell therapy that speeds circadian adjustment", "url": "https://phys.org/news/2026-08-jet-lag-cells-circadian-adjustment.html", "published": "2026-08-14T19:00:00+00:00", "src": "Phys.org (Rice / Northwestern)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Shift-work health, not just jet lag", "basis": "Implantable construct demonstrated in animals; no human trials"}}, {"t": "A new method pushes glycans directly into living cells, opening a blocked area of drug discovery", "s": "Glycans drive cell signalling and change in cancer, but they are too water-soluble to cross the cell membrane, which has kept them largely out of reach experimentally. The new delivery chemistry gets them inside intact — a lab tool first, but the enabling step for glycan-targeted diagnostics and therapeutics.", "tag": "Biology", "imp": "important", "glance": "Glycans finally delivered inside cells", "url": "https://phys.org/news/2026-08-scientists-method-sugars-cells.html", "published": "2026-08-14T17:40:04+00:00", "src": "Phys.org", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Unlocks a long-blocked class of drug targets", "basis": "Peer-reviewed chemistry; validated in cells, no therapeutic candidate yet"}}, {"t": "Compact viral RNA elements make mRNA drugs last longer and produce more protein", "s": "A team led by Kim V. Narry at the Institute for Basic Science found short viral RNA elements that stabilise mRNA and raise protein output. Because they are small and modular, they can be dropped into existing mRNA constructs — meaning lower doses, fewer repeat injections and better-behaved mRNA therapeutics without redesigning the platform.", "tag": "Biology", "imp": "important", "glance": "A plug-in that makes mRNA drugs last longer", "url": "https://phys.org/news/2026-08-stable-rna-elements-possibilities-mrna.html", "published": "2026-08-14T17:00:00+00:00", "src": "Phys.org (IBS Korea)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Cheaper, longer-lasting mRNA medicine", "basis": "Modular elements validated in cell systems; peer-reviewed, not yet clinical"}}, {"t": "THC reduces nightmare severity in people with PTSD in a controlled trial", "s": "A THC-based drug cut both the severity and frequency of nightmares in people with post-traumatic stress disorder. Nightmares are among the most treatment-resistant PTSD symptoms and current options are thin, so a controlled positive result here is directly useful to clinicians.", "tag": "Health", "imp": "important", "glance": "THC drug cuts PTSD nightmares in trial", "url": "https://www.newscientist.com/article/2584744-thc-in-cannabis-may-reduce-nightmares-in-people-with-ptsd/", "published": "2026-08-14T14:00:00+00:00", "src": "New Scientist", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "A real option for treatment-resistant nightmares", "basis": "Controlled clinical trial with severity and incidence endpoints"}}, {"t": "Cancer cells build a sugar shield to hide from the immune system — and it can be stripped", "s": "Sanford Burnham researchers show tumour cells coat themselves in a dense glycan layer that blocks immune recognition, and that the surrounding nutrient environment controls how thick that coat gets. Peer-reviewed lab and cell work, not yet in patients — but it names a concrete target: strip the sugar coat and existing immunotherapies should see the tumour again.", "tag": "Health", "imp": "important", "glance": "Sugar coat hides tumours from immunity", "url": "https://scitechdaily.com/cancer-cells-use-a-sugar-shield-to-hide-from-the-immune-system/", "published": "2026-08-14T11:04:28+00:00", "src": "SciTechDaily / Sanford Burnham", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "A real immunotherapy target, not yet a drug", "basis": "Peer-reviewed cell/animal work identifying a modifiable glycan shield"}}]}, "scienceUpdated": "2026-08-15T12:27:49+00:00", "scienceDaily": {"updated": "2026-08-15T12:27:49+00:00", "items": [{"t": "Stair climbing linked to 39% lower cardiovascular death across 480,000 people", "s": "A pooled analysis of more than 480,000 people found regular stair climbers were 39% less likely to die of cardiovascular disease and 24% less likely to die of any cause than people who rarely took stairs. Observational, so some of that is fitness selecting for stair use — but the sample size makes it one of the better-powered arguments for the cheapest possible intervention.", "tag": "Health", "imp": "important", "glance": "Stairs tied to 39% lower cardiac death", "url": "https://www.sciencedaily.com/releases/2026/08/260814011029.htm", "published": "2026-08-14T12:30:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "The cheapest cardiovascular intervention there is", "basis": "Pooled analysis across 480,000+ people; observational design"}}, {"t": "World's first superconducting quantum heat engine could remove the cabling bottleneck in quantum computers", "s": "A team at Aalto University built a microscopic superconducting engine — transmon qubit, resonator and quantum refrigerator — that ran a full Otto cycle near absolute zero, converting heat into useful work. Published in Nature Communications. The practical point is money and noise: scaling to a thousand logical qubits needs hundreds of thousands of physical qubits and microwave cables costing about a thousand euros each. Autonomous engines built into the circuit could read qubits without running signals across an extreme temperature gradient.", "tag": "Physics & Space", "imp": "important", "glance": "First cyclic quantum heat engine, built and run", "url": "https://www.sciencedaily.com/releases/2026/08/260814011041.htm", "published": "2026-08-14T11:40:00+00:00", "src": "ScienceDaily (Nature Comms / Aalto)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "proven", "verdict": "Removes a hard cost wall in quantum scaling", "basis": "Working device completing an Otto cycle; peer-reviewed in Nature Communications"}}, {"t": "Estrogen-only hormone therapy linked to 39% lower dementia odds in a 21,000-woman study", "s": "Stanford researchers analysed 21,462 women, with brain imaging in 728 and autopsy data in 2,959, and found estrogen-only hormone therapy associated with 39% lower odds of a dementia diagnosis and 35% lower odds of Alzheimer's-related brain changes at autopsy. Published in Neurology. The authors are explicit that this is association, not prevention — and that participants started therapy around age 70, far later than today's practice of starting in the late 40s or early 50s.", "tag": "Health", "imp": "critical", "glance": "Estrogen therapy tied to less Alzheimer's pathology", "url": "https://www.sciencedaily.com/releases/2026/08/260814011028.htm", "published": "2026-08-14T11:30:00+00:00", "src": "ScienceDaily (Neurology / Stanford)", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Reframes the menopause hormone-therapy calculus", "basis": "21,462 participants with 2,959 autopsies; observational, association only"}, "eli": "It doesn't prove hormone therapy prevents Alzheimer's. It does mean women who took estrogen had visibly less Alzheimer's damage in their brains after death — a much harder piece of evidence than a questionnaire."}, {"t": "A shut-down nuclear reactor's antineutrino 'afterglow' is detected for the first time", "s": "The Double Chooz collaboration, led from the Max Planck Institute for Nuclear Physics, measured the faint antineutrino emission that continues for months after a reactor is switched off, and found it matched decay predictions for the core and nearby spent-fuel pools. Published in Physical Review Letters. Because antineutrinos pass straight through shielding, this makes it possible to verify what is inside a reactor and its fuel pools even when it is offline — the exact gap in nuclear safeguards inspection.", "tag": "Physics & Space", "imp": "important", "glance": "Reactors can now be monitored while shut down", "url": "https://www.sciencedaily.com/releases/2026/08/260814011036.htm", "published": "2026-08-14T11:10:00+00:00", "src": "ScienceDaily (PRL / MPIK)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "proven", "verdict": "A new tool for nuclear safeguards", "basis": "First measurement of post-shutdown antineutrino flux, matching decay models"}}, {"t": "Vitamin D deficiency plus abdominal obesity carries a 123% higher six-year death risk", "s": "A cohort of more than 5,500 adults over 50 found that abdominal obesity combined with vitamin D deficiency was associated with a 123% higher risk of death over six years. Each factor raised risk on its own, but together the effect was greater than additive. Both are cheap to measure and one is cheap to correct, which is what makes this actionable — though it remains a single observational study.", "tag": "Health", "imp": "important", "glance": "Belly fat plus low vitamin D is a compounding risk", "url": "https://www.sciencedaily.com/releases/2026/08/260813045554.htm", "published": "2026-08-14T02:45:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "Two cheap tests that together predict a lot", "basis": "5,500+ adults over six years; observational, single cohort"}}, {"t": "Losing one copy of TBX5 unfolds the heart cell's 3D genome — a mechanism for congenital heart disease", "s": "Researchers found TBX5, already linked to congenital heart disease, acts as an architect for how heart-cell DNA is folded. Losing a single copy unravels that 3D structure and silences the genes needed to build a healthy heart, and the damage varies cell to cell — which may explain why the same mutation produces such different severity. Peer-reviewed; the practical payoff is prognosis and a target for gene-dosage therapy.", "tag": "Health", "imp": "important", "glance": "One gene copy misfolds heart DNA", "url": "https://www.sciencedaily.com/releases/2026/08/260812015214.htm", "published": "2026-08-13T13:46:14+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Explains variable severity in heart defects", "basis": "Peer-reviewed molecular study; mechanism established, no treatment yet"}}]}, "scienceDailyUpdated": "2026-08-15T12:27:49+00:00", "life": {"updated": "2026-08-15T12:27:49+00:00", "items": []}, "lifeUpdated": "2026-08-15T12:27:49+00:00", "mind": {"updated": "2026-08-15T12:27:49+00:00", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "Blood immune cells enter the ageing brain from middle age and turn into microglia", "s": "Stanford researchers found the ageing human brain is far less immune-isolated than assumed: large numbers of immune cells cross in from the blood starting as early as middle age, and once inside they can convert into microglia, the brain's resident immune cells. Peer-reviewed human tissue work; it reframes neuroinflammation as partly imported rather than purely local.", "url": "https://www.sciencedaily.com/releases/2026/08/260814011033.htm", "published": "2026-08-14T13:28:02+00:00", "src": "ScienceDaily / Stanford", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Rewrites where brain inflammation comes from", "basis": "Peer-reviewed human study showing peripheral immune cells becoming microglia"}}, {"t": "Myelin precursor cells release the stress hormone CRH to control brain repair after injury", "s": "Researchers found that myelin-producing precursor cells rapidly release corticotropin-releasing hormone near damaged tissue, and that this local signal governs how those cells mature and rebuild nerve insulation. Remyelination failure is the core problem in multiple sclerosis and in recovery from brain injury, so identifying a local, druggable control signal is a real handle on it.", "url": "https://www.sciencedaily.com/releases/2026/08/260814011044.htm", "published": "2026-08-14T11:45:00+00:00", "src": "ScienceDaily (peer-reviewed)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A local switch for rebuilding nerve insulation", "basis": "CRH release by OPCs shown to regulate maturation at injury sites"}}, {"t": "The brain clears waste through a fast lane and a slow lane — about 50 times slower in deep tissue", "s": "Using AI-assisted measurement, researchers mapped how cerebrospinal fluid actually moves through the brain and found it travels quickly around the outer spaces but roughly 50 times more slowly through deep tissue. The glymphatic system's clearance rate is central to theories of how amyloid and tau accumulate, and until now the deep-tissue rate was essentially guessed. It also sets a hard constraint on how any drug delivered into cerebrospinal fluid can reach deep structures.", "url": "https://www.sciencedaily.com/releases/2026/08/260811011130.htm", "published": "2026-08-13T18:00:00+00:00", "src": "ScienceDaily (peer-reviewed)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Pins a number on brain waste clearance", "basis": "Direct measurement of glymphatic flow rates in deep vs surface tissue"}, "eli": "Your brain rinses itself while you sleep. Turns out the rinse reaches the surface quickly but crawls through the middle — which may be why damage builds up deep inside."}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Cellular-resolution brain-computer interface recordings stay stable for years after stroke", "s": "Implantable BCIs with single-neuron resolution have so far been validated mainly in spinal cord injury and motor neuron disease. This work shows chronic single-unit recordings remain stable long-term in stroke-injured cortex — the largest untapped population for iBCIs. Preprint, not yet peer-reviewed, but it is the missing feasibility evidence for extending implants to stroke.", "url": "https://www.biorxiv.org/content/10.64898/2026.08.09.742157v1?rss=1", "published": "2026-08-14T00:00:00+00:00", "src": "bioRxiv (preprint)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Opens implanted BCIs to stroke patients", "basis": "Preprint; chronic recording stability shown, not yet peer reviewed"}}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "Cutting a nerve in the hand reorganises the digit maps in primary somatosensory cortex", "s": "Nature Human Behaviour reports that severing a hand nerve measurably changes how individual fingers are represented in primary somatosensory cortex. Adult cortical maps have long been argued to be far more fixed than the classic plasticity literature claimed; this is direct evidence they reorganise after peripheral injury, which matters for how nerve-repair surgery and prosthetic control are timed and rehabilitated.", "url": "https://www.nature.com/nathumbehav/", "published": "2026-08-13T16:00:00+00:00", "src": "Nature Human Behaviour", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Adult sensory maps do reorganise after injury", "basis": "Digit-map changes measured after peripheral nerve section; peer-reviewed"}}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today", "s": "No Major or Historic peer-reviewed result in this area in the last 72 hours.", "url": "", "published": "", "src": "", "assess": {"mag": 1, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result today", "basis": "Full feed set scanned; nothing met the Major/Historic bar"}}]}]}, "mindUpdated": "2026-08-15T12:27:49+00:00", "mindset": {"updated": "2026-08-15T12:27:49+00:00", "messages": [{"who": "Joseph Rodrigues", "t": "Talk to yourself like this for just 3 days (Psycho-Cybernetics)", "vid": "XdDkkWFAjro", "url": "https://www.youtube.com/watch?v=XdDkkWFAjro", "gist": "The whole argument rests on one line from Neville Goddard: speech is the image of mind, so to change your mind you must first change your inner conversation. Joseph works through the point-of-life model — awareness at the top, mind as the container the Bible calls the heart, and thought as the one faculty entirely under your control. Nothing outside you, not the news and not social media, actually decides what you think; you keep the ability to discern and refuse. The practical instruction is to hold your inner talk from the premise of fulfilled desire — speaking as though the income, the relationship or the health is already yours — because the subconscious does not distinguish the imagined from the real, and it is that assumed state, not effort, that reorganises circumstances around you. Then let it work: over-forcing it, he says, is the old self reasserting itself."}, {"who": "Elmer O. Locker Jr", "t": "The person watching this has shifted into a millionaire today", "vid": "NQEtsJuqc6o", "url": "https://www.youtube.com/watch?v=NQEtsJuqc6o", "gist": "Locker's frame is that the life you are experiencing is a simulation, and that the thing you most want feels far away only because you have stamped it with labels of seriousness, importance and fear. Those labels are the disturbance in the connection — when you treat a manifestation as difficult or high-stakes, the images your mind produces are of it going to someone else, and that is what the low frequency of anxiety actually consists of. The instruction is to become still and present, feel yourself into the wish already fulfilled, and slow time down — his image is Neo at the end of The Matrix, stopping the bullets not by force but by dropping fully into present-moment awareness. The problems and stresses in your life are real only to the degree you keep assigning them realness; the practical move is to withdraw the label of importance from the outcome and step into the version of yourself that already has it, rather than negotiating with the fear."}, {"who": "AH Universe (Abraham Hicks)", "t": "If it is not a full yes, then it is a no", "vid": "GtXVeUR1rfY", "url": "https://www.youtube.com/watch?v=GtXVeUR1rfY", "gist": "A questioner describes three weeks of oscillating over a job offer — feeling certain about the new role, then equally certain about staying — and finally applying the rule that if it isn't a hell yes, it's a hell no, so he stayed put. Abraham's reframe is that the oscillation was never a decision problem. Indecisiveness is itself the signal: when you are genuinely in the receiving mode, the feeling is decisiveness, so the question is not 'which option?' but 'why am I not in the receiving mode?' The honest answers are usually one of two things — it hasn't become important enough to make a priority, or law of attraction already has enough momentum going that you're just riding what you've been thinking about. There is no advantage, Abraham argues, in constructing explanations for why you're out of the receiving mode; once your vortex is that rich, getting into it is the natural and obvious thing to do, and the clarity follows rather than precedes it."}]}, "mindsetUpdated": "2026-08-15T12:27:49+00:00", "youtube": {"count": 21, "note": "Today's uploads across 268 subscribed channels, gisted from transcripts.", "groups": [{"h": "🔬 Science & big ideas", "items": [{"t": "What Claude Actually Did to the Riemann Hypothesis", "s": "An unreleased Claude model pushed the proven lower bound on how many non-trivial Riemann zeta zeros lie on the critical line from 41.7% (the 2022 record) to 67.25% in roughly 30 hours, orchestrating a hierarchical swarm of 60 sub-agents that ran 2,400 shell commands, 31M output tokens and autonomously pulled 54 arXiv papers. It combined Montgomery's pair-correlation work with Bombieri's 2000 Clay note — but this is not a proof, and mathematicians agree the method has a ceiling well short of 100%.", "glance": "Claude raised the proven share of Riemann zeta zeros on the critical line from 41.7% to 67.25% in 30 hours using 60 orchestrated sub-agents — but this method cannot reach 100%.", "url": "https://www.youtube.com/watch?v=C-ECTnM7tUY", "vid": "C-ECTnM7tUY", "published": "2026-08-14T19:29:01+00:00", "src": "@FromFirstPrinciplesPod"}, {"t": "Let’s Talk About Ceuta.", "s": "Ceuta is a 20 sq km Spanish/EU city of 83,567 people on the African mainland whose sovereignty rests on the 1860 Treaty of Tetouan and is contested by Morocco as unfinished decolonisation. Its stability depends entirely on a frontier policed from the Moroccan side — shown when ~72,000 people crossed in late July 2026 — and its economy is a low-tax shell running 29% below the Spanish average since Morocco killed the porter trade in 2019.", "glance": "Ceuta's Spanish sovereignty rests on an 1860 treaty, but NATO's Article 6 may not cover African soil — leaving its border a Moroccan diplomatic lever.", "url": "https://www.youtube.com/watch?v=m8pHb94yi0M", "vid": "m8pHb94yi0M", "published": "2026-08-14T16:00:09+00:00", "src": "@Places302"}, {"t": "Why we can't have conversations today | Dan Carlin and Kmele Foster", "s": "Dan Carlin argues debate now stalls permanently at 'what are your sources' and never reaches substance, because a single shared arbiter of fact has been replaced by thousands of competing realities. He raises the uncomfortable question of whether a shared view of truth that was sometimes false beat having fifty truths, and admits he cannot tell whether this is a transitional phase or the permanent state.", "glance": "Arguments now die at the sourcing stage because there is no shared arbiter of fact — people differ on the reality they see, not just its interpretation.", "url": "https://www.youtube.com/shorts/sAXRbO504As", "vid": "sAXRbO504As", "published": "2026-08-14T16:05:22+00:00", "src": "@bigthink", "short": true}]}, {"h": "🤖 AI & technology", "items": [{"t": "AI News: A Flood of New Models (Here's What Matters)", "s": "Eight model releases landed in one week and most are marginal — the exceptions being Grok 4.6 (near GPT-5.6 Sol coding quality at $2/$6 per million tokens vs $5/$30) and Gemini 3.7 Flash at $0.75/$3.75. The more consequential shift is provenance: Anthropic is embedding invisible watermarks in all Claude text, Suno is adding audio watermarking plus hard download caps, and Spotify will badge AI personas and exclude them from recommendations from mid-September.", "glance": "AI provenance is being enforced across the stack — Claude watermarks all generated text, Suno caps pro downloads at 20 a month, and Spotify will drop AI artists from recommendations.", "url": "https://www.youtube.com/watch?v=NC4h5kWH_-A", "vid": "NC4h5kWH_-A", "published": "2026-08-14T15:00:28+00:00", "src": "@mreflow", "points": [{"t": "Tencent WorldClaw 3D worlds", "s": "Prompts an entire 3D world where every tree, house and cart is a separate editable asset with depth, normal and instance maps. The pipeline chains a terrain-planning agent, GPT Image 2, Meta's SAM 3 for segmentation and Hunyuan's 2D-to-3D conversion; not publicly available yet."}, {"t": "Grokbot desktop agent", "s": "xAI's agent app infers each agent's role from its name and gives every agent its own cloud computer with Chrome, a file manager and a terminal, connected to Gmail, Drive, Calendar, Notion and Slack. 'Teach a task' records your screen and converts the demonstration into a reusable skill."}, {"t": "Watermarking arrives everywhere", "s": "Anthropic is weaving machine-readable watermarks into all text from supported Claude models across the API, Claude Code, Cowork and Tag, surviving copy-paste and some editing. Suno adds audio watermarking and download caps from 3 September; Spotify badges AI personas from mid-September and drops them from editorial and algorithmic recommendations."}, {"t": "Grok 4.6 pricing vs capability", "s": "It nearly matches GPT-5.6 Sol and Fable 5 on coding, and leads on GDPval knowledge work and Harvey's legal benchmark, at $2 per million input and $6 output against GPT-5.6 Sol's $5/$30. Musk says 4.7 lands in three to four weeks."}, {"t": "The rest of the model flood", "s": "Gemini 3.7 Flash at $0.75/$3.75 scored 65.3 on coding; Meta's Muse Glimmer and Nvidia's Nemotron 3.5 Lightning are both 30B open-weight on-device models; DeepSeek V4 Pro scored 62.7, beating GLM 5.2 and Opus 4.8. GPT-5.6 Sol's ultra-fast mode runs on Cerebras at 750 output tokens per second for trusted testers only."}, {"t": "Agent tooling updates", "s": "Claude Code switched to auto mode by default on Pro, Max and Team plans from 14 August, approving most steps without prompting. Separate Claude Code sessions can now message each other and hand off mid-task, and the ChatGPT desktop app including Codex is now on Linux."}, {"t": "Video, image and accessibility", "s": "LTX 2.5 is open-weight and generates a 10-second video from an image in 6.8 seconds on Nvidia superchips, running locally on RTX GPUs. Google DeepMind released SL2T, which transcribes sign language to captions directly on video."}], "pointsLabel": "What was covered"}, {"t": "QWEN 3.8 27B Local AI Review", "s": "Running Qwen 3.8 27B under vLLM on four 3090s plus a 4090, a single zero-shot prompt produced three playable JavaScript retro games with sound and a working global leaderboard in 2h40m with zero failed tool calls — versus 3.6, which needed constant iterative fixing and handled Playwright poorly. The full 256K context fit in VRAM, and unlike 3.6 the thinking mode can be left on without breaking agentic loops.", "glance": "Qwen 3.8 27B on four 3090s zero-shot built three playable games with zero failed tool calls and a full 256K context in VRAM — a large agentic jump over 3.6.", "url": "https://www.youtube.com/watch?v=jZ9Mdit5TdI", "vid": "jZ9Mdit5TdI", "published": "2026-08-14T21:10:39+00:00", "src": "@DigitalSpaceport"}, {"t": "AI has no duty of loyalty to you - Ryan Greenblatt", "s": "Ryan Greenblatt points out that Claude's constitution explicitly says Claude should trust Anthropic more than operators and users, meaning the model is deliberately not your advocate — the opposite of the legal profession, where the system works because every party has a lawyer bound to their client's interest. His concern is a world where no AI is looking out for you, plus the legitimacy problem of AI firms retaining granular control over how their product behaves.", "glance": "Claude's constitution ranks Anthropic's trust above the user's, so unlike a lawyer the AI is structurally not your advocate — nobody's model is looking out for you.", "url": "https://www.youtube.com/shorts/BL75EMfz_N8", "vid": "BL75EMfz_N8", "published": "2026-08-14T21:48:10+00:00", "src": "@DwarkeshPatel"}, {"t": "This new startup can query anywhere you've been...", "s": "Flock Safety, an $8.4bn startup, runs solar-powered LTE cameras that do licence-plate inference on-device and build a 'vehicle fingerprint' — make, model, dents, bumper stickers — so police can find a car even with the plate covered, feeding a nationwide database searchable without a warrant under the 1970s third-party doctrine. Oversight is a free-text reason field: an Idaho sheriff ran his wife's plate 700+ times marked 'test'.", "glance": "The 1970s third-party doctrine lets police buy warrantless nationwide location history from private plate-reader firms, audited only by a free-text reason field.", "url": "https://www.youtube.com/watch?v=E7la7-dtfVM", "vid": "E7la7-dtfVM", "published": "2026-08-14T17:44:59+00:00", "src": "@Fireship"}, {"t": "The BEST local AI music generator is here!", "s": "MiniMax Music 3 is an open-source text-to-music model that runs offline in ComfyUI — 9.8GB in FP16, down to 2.5GB int8 — generating songs up to five minutes, with a one-minute track taking three to four minutes on 16GB of VRAM. Quality sits below the latest Suno models, but it arrives exactly as Suno caps paid Pro users at 20 downloads a month and adds watermarking.", "glance": "MiniMax Music 3 generates full songs with lyrics locally in ComfyUI from a 2.5-9.8GB model, taking three to four minutes per minute of audio on 16GB VRAM.", "url": "https://www.youtube.com/watch?v=aUcDyeZgz_k", "vid": "aUcDyeZgz_k", "published": "2026-08-15T03:20:14+00:00", "src": "@theAIsearch"}, {"t": "3 New Ways To Use ChatGPT Codex", "s": "Three lesser-known Codex capabilities: it can browse and search social media posts in-app without connecting to any platform API, it can build and publish a dashboard, game or web app to a shareable link with no separate hosting, and connecting an iPhone via the desktop app's remote feature lets you drive it by voice while it operates your computer.", "glance": "Codex can drive a real browser to read social posts without API access, and publish working web apps to a shareable link with no separate hosting.", "url": "https://www.youtube.com/shorts/aszRSGI_Iwg", "vid": "aszRSGI_Iwg", "published": "2026-08-15T00:47:28+00:00", "src": "@mreflow"}]}, {"h": "💼 Business & money", "items": [{"t": "Anthropic's $2T IPO, Zuck's AI Manifesto, Nvidia's $500B AI Bet, Grok's Comeback", "s": "Anthropic is reportedly targeting an October IPO near $2 trillion on $100-120bn exit ARR after three straight years of 10x growth, but both Sacks and Baker put 2027 exit ARR at $400-500bn rather than the $1tn a straight extrapolation implies — because compute and energy, not demand, become the binding constraint. Meanwhile Grok 4.6 has pulled onto the price/performance frontier, reopening what the hosts had called a two-lab race.", "glance": "Anthropic's revenue has 10x'd yearly for three years toward a ~$2 trillion October IPO, but compute and energy — not demand — now cap further growth.", "url": "https://www.youtube.com/watch?v=kVzYGVJ8zUk", "vid": "kVzYGVJ8zUk", "published": "2026-08-14T20:36:20+00:00", "src": "@allin", "points": [{"t": "Anthropic's $2 trillion IPO", "s": "An October listing near $2tn on $100-120bn annualised revenue is roughly 16-20x sales — cheap against SpaceX and Palantir comps. Both hosts forecast just under $500bn exit ARR for 2027; Anthropic is separately in talks to buy chip-efficiency startup DART for $6bn."}, {"t": "Open source makes frontier tokens more valuable", "s": "A frontier model orchestrating cheap open-source models is worth more, not less — the split argued is frontier capturing 65-85% of economic value while open weights carry ~80% of token volume. Calacanis predicts Zuckerberg ships the best American open-source model within a year."}, {"t": "Nvidia's $500bn compute financing", "s": "Nvidia is partnering with Goldman, BlackRock, Blackstone, KKR and Apollo to raise $500bn, turning GPUs into a financeable income-producing asset class. It acts as matchmaker and offers residual-value guarantees on three-to-four-year GPU rental rates that lenders can underwrite against."}, {"t": "Grok 4.6 and xAI's catch-up", "s": "Grok 4.6 is a 1.5T-parameter model on the Pareto frontier of Cursor Bench and Databricks' independent eval — comparable quality to Fable 5 at lower price — with 4.7 due in weeks. The turnaround is credited to acquiring Cursor's team plus transplanting SpaceX operators into xAI management in six months."}, {"t": "Compute as a physical ceiling", "s": "Growth projections break on energy: approximating a human brain is said to need a datacenter drawing a million homes' power for six to nine months, then ~1,000 homes per query. Inference efficiency is improving 5-10x every 12-18 months, which is the main thing that could relieve it."}, {"t": "Musk hosting and competing with Anthropic", "s": "Musk rents Colossus compute to Anthropic while racing them — framed as a call option on becoming a frontier lab with a put option of selling compute. Both sides hold 90-day cancellation rights, so he is charging near spot price and can reclaim capacity if compute stays supply-constrained."}, {"t": "Silver Lake-Workday and the software rerate", "s": "News broke mid-show that Silver Lake may buy Workday, sending the stock up 17% after a slide from ~$300 to ~$100. The return of private-equity bids reads as evidence that rising open-source competitiveness is a reprieve for the software industry."}], "pointsLabel": "Segments covered"}, {"t": "How to Think Like Rich People (1 Hour Masterclass)", "s": "Varun Mayya argues wealth is a side effect of chasing status, validation and relevance rather than money itself, and that the jump from roughly 1 crore to 1,000 crore is a jump from doing one thing yourself to 'free market participation' — owning assets and entering any industry without operating it. He reframes price as contextual: a 5 lakh spend is cheap if it unlocks 5 crores of access, 5,000 rupees is expensive if it changes nothing.", "glance": "Rich people evaluate spending by what constraint it removes, not by price — so a 5 lakh expense that unlocks 5 crores of access is cheap.", "url": "https://www.youtube.com/watch?v=8WgipmPSPKk", "vid": "8WgipmPSPKk", "published": "2026-08-14T12:48:58+00:00", "src": "@VarunMayya", "points": [{"t": "Wealth is a status side effect", "s": "At 1,000 crore net worth people care more about narrative control and relevance than incremental money. Media clips distort intent because you never see these people for 90 minutes the way you see a footballer."}, {"t": "Traits of people good at everything", "s": "Constant curiosity about new technology, indifference to social shame around mistakes, willingness to make repeated attempts, and extracting a lesson from every failure. He cites trying everything three times — once to beat the fear, once to stop being bad, once to decide if you like it."}, {"t": "Free market participation", "s": "At 1 crore you do one thing yourself; at 100-1,000 crore you own multiple things and can enter any industry without running it — like cricketers ending careers with clothing brands, funds and hotel chains. The whole climb is becoming someone who can buy into any market at will."}, {"t": "Price is contextual, not absolute", "s": "The middle-class trap is fixed thresholds for 'expensive' and hyper-negotiating small amounts. Rich people price by topic — and many won't upgrade a phone yearly because the jump isn't worth the hassle."}, {"t": "Buy removed constraints, not things", "s": "Money buys speed, attention and certainty before luxury — a helicopter unlocks real mobility where a nicer car doesn't, an assistant returns attention, a lawyer buys certainty. Ask what your biggest bottleneck is and what it costs to delete it."}, {"t": "Own assets that earn while you sleep", "s": "The first step is delinking your time from the money you make, via ownership — even a tiny slice of a listed company grows while you sleep. A startup that consumes your entire day isn't ownership yet, because it hasn't bought you time freedom."}, {"t": "Trust, reliability and packs", "s": "Reliability beats brilliance in a country of 1.4 billion where brilliant people are often unresponsive; a clear yes or no earns more respect than dithering. Proof of work put in front of the right rooms and a 7-8 person 'pack' beat solo networking."}], "pointsLabel": "Key takeaways"}, {"t": "🔴 LIVE: Goldman Sachs on AI Impact on Indian Jobs | DeepSeek & Qwen Launch | Front Page", "s": "DeepSeek and Alibaba both shipped frontier-class models in a two-week window and both explicitly benchmarked against American models, which the hosts read as evidence that China's AI sovereignty stack is engineered for catching up rather than diverging. Google reportedly shelved Gemini 3.5 Pro to redirect resources to Gemini 4 amid a DeepMind leadership reshuffle, and Lenovo posted a record $26.9bn quarter on AI demand.", "glance": "China's top labs now benchmark against US models by default — sovereignty stacks buy self-sufficient infrastructure but still measure success on a competitor's scorecard.", "url": "https://www.youtube.com/watch?v=iI39rYwOSAI", "vid": "iI39rYwOSAI", "published": "2026-08-14T21:07:15+00:00", "src": "@aimmediahouse", "points": [{"t": "DeepSeek V4 Pro goes live", "s": "Built for agentic work without handholding: 1M-token context, outputs up to 384,000 tokens. Peak-hour output pricing jumped from a flat $0.87 to $3.96 per million tokens — still a fraction of Fable 5's $50."}, {"t": "Alibaba Qwen 3.8 Max", "s": "A 2.4T-parameter model activating only 95B parameters per query, handling text, image and video with 1M-token context, and now the top-ranked Chinese model for text on Arena.ai. Qwen has spawned 100,000+ derivatives on Hugging Face, yet Beijing is weighing restrictions on overseas access."}, {"t": "Google shelves Gemini 3.5 Pro", "s": "Reporting says Google halted its flagship and shifted engineers to Gemini 4, with 3.6 and 3.7 Flash as stopgaps. Hassabis moves from DeepMind CEO to chair and Alphabet chief scientist while Kavukcuoglu takes day-to-day research."}, {"t": "Lenovo's record quarter", "s": "Q1 revenue hit an all-time high $26.9bn, up 43% year on year, with adjusted net income up 176% to $1.1bn. AI-related revenue rose 60% to $9.3bn and the AI server pipeline expanded 157% quarter on quarter to $54bn."}, {"t": "India's sovereignty gap", "s": "Sarvam trained a 105B-parameter model and targets 1T by February-March, but the hosts argue owning a model isn't sovereignty without domestic fabs — a 2-3nm fab needs $12-15bn. The National Quantum Mission has committed Rs 6,003 crore and QKD has reached 1,000km of a 2,000km target ahead of schedule."}, {"t": "AI job anxiety and adoption", "s": "Constant layoff fear-mongering is shaping Indian students' outlook while actual enterprise AI adoption in India runs mostly on Western vendors' tools. The prescription offered is government-backed upskilling, AI in school curricula, and building on India's own problem list."}], "pointsLabel": "Segments covered"}, {"t": "HOW?!?! SpaceXAI Just Shocked The World (again)", "s": "Grok 4.6, a roughly 1.5T-parameter model, is claimed Pareto-dominant on both Cursor Bench and independent Databricks evaluations after xAI closed its Cursor acquisition and Musk moved SpaceX managers into the organisation, with 4.7 promised in three to four weeks. The investment argument made is that owning the compute clusters gives a call option (become a frontier lab) and a put option (lease compute to rivals under a 90-day cancellation clause).", "glance": "Owning the compute clusters gives Musk both options: train a frontier model, or lease capacity to rivals under a 90-day clause that lets him reclaim it.", "url": "https://www.youtube.com/watch?v=xa5Ov0u1nNY", "vid": "xa5Ov0u1nNY", "published": "2026-08-15T05:15:20+00:00", "src": "@SolvingTheMoneyProblem"}, {"t": "Elon Musk's AI Compute Strategy: Billions in New Revenue! #shorts", "s": "Ron Baron lays out the compute arbitrage: the ~$35bn Memphis facility was built in 122 days and doubled in another 90, then capacity was sold to Anthropic at about $1.25bn a month, to Google for $900m a month and to a third buyer, giving roughly $30bn a year of revenue from assets that were otherwise idle until Grok needed them.", "glance": "Idle compute became a $30bn-a-year business by leasing capacity to rivals until your own model needs it — the buildout pays for itself before it is used.", "url": "https://www.youtube.com/shorts/JqtwSRht6Zs", "vid": "JqtwSRht6Zs", "published": "2026-08-15T07:19:30+00:00", "src": "@SolvingTheMoneyProblem"}]}, {"h": "📱 Gear & reviews", "items": [{"t": "The Honor Robot Phone is absolutely insane.", "s": "Honor is mass-producing a phone with a genuine motorised gimbal that pops out and stabilises better than most standalone smartphone gimbals — no charging, faster response than Bluetooth accessories — doubling as rear and front camera with 310-degree rotation and subject tracking on a 200MP f/1.6 sensor. The weak points are mediocre stitching, no vertical rotation (4K crops to 2.8K), gimmicky gesture AI and obvious durability risk from precision moving parts.", "glance": "A built-in gimbal beats standalone ones because it responds without Bluetooth latency and never needs charging — but adds moving parts one drop could decalibrate.", "url": "https://www.youtube.com/watch?v=n3F996g8wjg", "vid": "n3F996g8wjg", "published": "2026-08-14T11:15:26+00:00", "src": "@Mrwhosetheboss"}, {"t": "What's different about the new Pixel 11? And it's closer to the Pro than you might think...", "s": "The base Pixel 11 shares the Pro's Tensor G6, seven years of updates and a 5x telephoto, giving up mainly the 42MP selfie camera (it gets 10.5MP), 8K video, night sight video and manual pro controls. Against the Pixel 10 it gains a larger main sensor, 30+ hours battery, 25W wireless charging and 256GB base storage.", "glance": "The base Pixel 11 runs the same Tensor G6 and 5x telephoto as the Pro, so the real gap is the selfie camera and pro video modes.", "url": "https://www.youtube.com/shorts/3imxUq0Ym4s", "vid": "3imxUq0Ym4s", "published": "2026-08-15T00:23:57+00:00", "src": "@TheUnlockr", "short": true}, {"t": "Most Hyped GOOGLE Gadget is Finally in INDIA!", "s": "Google's Fitbit Air launches in India under Rs 15,000, pitched as a tracker light enough to sleep in while still logging heart rate, sleep, HRV, SpO2 and workouts. Its differentiator is the Google Health app's Gemini-based AI Coach, which converts raw metrics into specific advice — the reviewer says it flagged his six-hour sleep night and gave concrete recovery steps.", "glance": "The Fitbit Air's real pitch is Gemini-powered coaching that turns raw sleep and HRV numbers into specific daily recovery actions.", "url": "https://www.youtube.com/shorts/CdsDdxsI2Fk", "vid": "CdsDdxsI2Fk", "published": "2026-08-15T05:30:08+00:00", "src": "@SillycornsMedia", "short": true}, {"t": "Samsung Galaxy S26 FE Leaked: Everything You Need To Know!|", "s": "Leaked Galaxy S26 FE specs: an S26-Plus-style camera island, IP68, Gorilla Glass Victus+ and the same 6.7-inch 120Hz LTPO AMOLED with thinner bezels, but carried-over cameras and an Exynos 2500 with only 8GB RAM and 128GB UFS 3.1 storage. A silicon-carbon battery keeps 4,900mAh in a thinner body, launching next month at roughly Rs 65,000-75,000.", "glance": "The S26 FE reportedly reuses last year's cameras and pairs an Exynos 2500 with slow UFS 3.1 storage, with a silicon-carbon battery the main upgrade.", "url": "https://www.youtube.com/shorts/Bls3h7zlxlQ", "vid": "Bls3h7zlxlQ", "published": "2026-08-15T05:30:15+00:00", "src": "@beebomco", "short": true}]}, {"h": "🎬 Shorts", "items": [{"t": "Elon Musk Unveils SpaceX's AI Roadmap #shorts", "s": "Musk says SpaceX has already built the world's most powerful AI training clusters and expects roughly ten times more by the end of next year, targeting 10 gigawatts. At $30-50 of value per watt that would imply $300-500bn a year in revenue — and he expects training to stay on the ground while day-to-day inference moves to orbit.", "glance": "Musk's split is training stays on Earth while inference moves to orbit — with 10GW by end of next year implying $300-500bn a year.", "url": "https://www.youtube.com/shorts/xxo8u9VoB0k", "vid": "xxo8u9VoB0k", "published": "2026-08-15T03:01:26+00:00", "src": "@SolvingTheMoneyProblem", "short": true}, {"t": "Earth's Future: Mars Colony vs. Fixing Earth Now! #shorts", "s": "Musk rejects the argument that Earth's problems must be fixed before attempting a Mars colony, pointing out both can be pursued at once and that five known mass extinction events show the range of things that cannot be fixed from here. The framing is an off-site backup of humanity, with the Moon as the obvious first step.", "glance": "The case for Mars is treated as disaster recovery — an off-site backup you build before you need it, not instead of fixing Earth.", "url": "https://www.youtube.com/shorts/h-ccMlGJcBo", "vid": "h-ccMlGJcBo", "published": "2026-08-14T20:59:54+00:00", "src": "@SolvingTheMoneyProblem", "short": true}, {"t": "Solve brain rot in 60 seconds!!", "s": "Guilford's Alternate Uses Test — naming at least ten uses for any object in 60 seconds — is still the standard research measure of divergent thinking, and the presenter demonstrates why it gets harder: the first answers come straight from memory, and only after those run out does the brain have to actually generate. The argument is that reaching for a chatbot at the idea stage skips exactly the part that trains creativity.", "glance": "Your first few ideas come from memory, not creativity — the test only starts working after you exhaust what you have already seen.", "url": "https://www.youtube.com/shorts/-ZWf-PX2dz4", "vid": "-ZWf-PX2dz4", "published": "2026-08-14T16:25:17+00:00", "src": "@aevytv"}]}]}, "elon": {"day": "2026-08-14", "source": "@jcub2x daily recap", "note": "Built from the 14 Aug recap (56 posts). Engagement counts are not pulled from the recap, so likes and views are omitted; posts are ordered most-notable first.", "items": [{"kind": "post", "t": "Cursor announced it had closed its deal to join Musk's AI company, saying its team will now work on Grok, Grok Build, Grok Bot, the Grok API and Cursor itself; the Cursor account and staff accounts switched to the acquirer's logo.", "s": "He replied \"Welcome\" to the Cursor team's announcement and, quoting the company's post, said it was an honour to have such a strong team join.", "imp": "critical", "iso": "2026-08-14T12:40:00+05:30"}, {"kind": "reply", "t": "A Joe Rogan clip in which Rogan says he personally knows five women who miscarried after COVID vaccination and calls Anthony Fauci a psychopath, alleging Fauci privately acknowledged a link. These are Rogan's assertions and are contested and not established by evidence.", "s": "He responded with a two-word call to prosecute Fauci, endorsing the accusation without offering supporting evidence.", "imp": "critical", "iso": "2026-08-14T19:20:00+05:30"}, {"kind": "reply", "t": "A post arguing that orbital data centres, currently seen as niche, may become necessary for continued AI scaling in the 2030s.", "s": "He predicted, as a personal forecast, that orbital compute will be the only way to scale AI at some point around 2029, citing land-based power availability and permitting constraints.", "imp": "important", "iso": "2026-08-14T17:10:00+05:30"}, {"kind": "reply", "t": "A user asking for more livestreams, attached to older footage of him streaming games.", "s": "He said X is releasing a new livestreaming system and that he plans to stream himself playing games and answering questions.", "imp": "important", "iso": "2026-08-14T12:10:00+05:30"}, {"kind": "reply", "t": "A commenter's critique of an Arc AGI benchmark harness, arguing it understated GPT-5.6's score by discarding prior reasoning and truncating context, so Grok 4.6's headline result is comparable rather than superior.", "s": "He said Grok performs far better with its own build harness and advised evaluating Grok 4.6 inside Grok Build. The competing benchmark interpretations remain disputed.", "imp": "important", "iso": "2026-08-14T14:00:00+05:30"}, {"kind": "repost", "t": "A Tesla owner in Texas describing a roughly 800-mile Georgia-to-Texas drive on Full Self-Driving with HW4 without touching the wheel or pedals, including dashcam footage of the car reacting to a truck tire blowout.", "s": "He amplified the account and separately said Tesla self-driving is amazing. The owner's claims about the drive and avoided collisions are her own and are not independently verified.", "imp": "important", "iso": "2026-08-14T09:15:00+05:30"}, {"kind": "reply", "t": "A post stating that he owns roughly 48% of SpaceX, over 6.42 billion shares.", "s": "He said a portion of that stake vests only on extremely demanding performance outcomes, so his actual fully vested percentage is lower.", "imp": "important", "iso": "2026-08-14T11:20:00+05:30"}, {"kind": "reply", "t": "Two screenshots contrasting US AI compute deals — a 300 MW partnership plus multi-gigawatt agreements with Amazon and Google — against a report on Mistral's plan to build 1 GW of European AI compute by 2030.", "s": "He predicted US economic growth from faster AI and robot adoption could exceed Europe's by more than tenfold. This is a forecast, not a measured figure.", "imp": "important", "iso": "2026-08-14T18:10:00+05:30"}, {"kind": "reply", "t": "An Italian user's post saying only one of roughly 16 female high-school classmates has children, framed by another account as the death of a civilisation.", "s": "He agreed with a one-word affirmative, continuing his recurring theme that falling birth rates are an existential risk.", "imp": "important", "iso": "2026-08-14T19:00:00+05:30"}, {"kind": "repost", "t": "A demonstration by an X designer of the platform's visibility-transparency feature: checking whether an account or post was suppressed, seeing the stated reason, and downloading a full report.", "s": "He amplified the demo, which was framed as evidence that X is the most transparent platform on the internet.", "imp": "interesting", "iso": "2026-08-14T12:25:00+05:30"}, {"kind": "repost", "t": "Results of the company's 12-hour Grokathon. First place taught Grok to reverse-engineer binaries into clean C code, rebuilding a 1995 engine control unit runtime from a Game Boy ROM; third place combined Grok voice with brain-sensing hardware to compose speech from subtle motor movements.", "s": "He reposted the winners without added comment.", "imp": "interesting", "iso": "2026-08-14T16:20:00+05:30"}, {"kind": "reply", "t": "A user's walkthrough of using Grok Bot as a chief of staff — having it research her, audit the bots she had built, recommend which to keep or delete, connect GitHub, and execute the changes in one pass.", "s": "He quoted it as an example of how to use Grok Bot.", "imp": "interesting", "iso": "2026-08-14T15:00:00+05:30"}, {"kind": "repost", "t": "A rider's report that a Tesla robotaxi in an Austin area with previous waits of up to 20 minutes arrived in about two minutes, consistently across multiple rides.", "s": "He reposted the wait-time account without added comment.", "imp": "interesting", "iso": "2026-08-14T09:45:00+05:30"}, {"kind": "reply", "t": "A post arguing that memory, not compute, is the real constraint on the current agentic-AI era.", "s": "He agreed, saying few people realise this, and separately agreed that narrow specialist systems will be far more efficient than fully general superintelligence.", "imp": "interesting", "iso": "2026-08-14T18:30:00+05:30"}, {"kind": "repost", "t": "A post from the company's Memphis operation saying it has paid $30 million in local taxes since arriving in 2024 and framing itself as a committed local employer.", "s": "He reposted the community-investment message without comment. The Memphis facility has drawn local scrutiny over its environmental permits.", "imp": "interesting", "iso": "2026-08-14T11:35:00+05:30"}, {"kind": "repost", "t": "Third-party benchmark comparisons circulated for Grok 4.6, including a claimed tie with a rival model on Perplexity's Wonder benchmark at roughly 60% lower cost per task and a top ranking on Cursor Bench.", "s": "He amplified several cost-efficiency comparisons. The figures come from third parties and the comparisons are contested.", "imp": "interesting", "iso": "2026-08-14T15:40:00+05:30"}, {"kind": "reply", "t": "A repost of a commenter noting that the sister of a Michigan Democratic Senate primary candidate has posted critically about the United States.", "s": "He called her a traitor. The characterisation is his opinion about a private individual's political speech.", "imp": "interesting", "iso": "2026-08-14T20:05:00+05:30"}], "highlight": {"t": "Cursor, the AI coding company, closed its acquisition by Musk's AI organisation, with its team moving onto Grok, Grok Build, Grok Bot and the Grok API", "s": "Musk publicly welcomed the Cursor team and said it was an honour to have them join. The company framed the deal as a way to move faster toward general-purpose AI, starting with software engineering and expanding into knowledge work.", "href": "https://www.theverge.com/"}}, "elonNews": [{"t": "Cursor is officially part of SpaceX AI", "s": "The acquisition closed and the Cursor team, product and API move under Musk's AI organisation, with the staff redirected onto Grok, Grok Build, Grok Bot and the Grok API. Cursor continues as a product.", "url": "https://news.google.com/rss/articles/CBMimgFBVV95cUxNbmh1N1VnNEJTSGV3MVhyS1kwNWRCcTZ2TkdGQjNiTUNINlAxR3p4LVZNWHBIUXZwVjJHNkRzYnVZR1poWW9PRE9lMlY1YnpDQ0hGcFFka2tlUjFLaVRoRDAtVUFPeFlmRmtBN0xEcS1Oa2piWlRONkNMNTRFMnZkRG9YWWhnWG5ZS2ctZ2F0ZkpKSTFqcVl1T0RR?oc=5", "published": "2026-08-14T13:56:02+00:00", "src": "The Verge"}, {"t": "SpaceX's ~$60bn Cursor deal puts it head-to-head with OpenAI and Anthropic", "s": "The purchase gives Musk's AI arm a large existing developer base and a coding-agent product line, positioning it directly against OpenAI's Codex and Anthropic's Claude Code.", "url": "https://www.livemint.com/companies/news/elon-musks-spacex-gears-up-to-take-on-rivals-openai-anthropic-with /* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

function story(it,opts){
  opts=opts||{};

async function askQuestion(c,input){
  const q=(input.value||"").trim(); if(!q) return;
  const it=(typeof STORY!=="undefined"&&STORY.get)?STORY.get(c):null;
  const __ep=(typeof askEndpoint==="function")?askEndpoint():"";
  if(!(window.cowork&&window.cowork.askClaude) && !__ep){
    input.value="";
    const box0=c.querySelector(".more");
    if(box0){ const n=document.createElement("p"); n.className="exp qa"; n.innerHTML=`<span class="q">${esc(q)}</span>Opening web results in a new tab. <span style="opacity:.65">Enable inline AI in \u22ef \u2192 \u201cAsk AI setup\u201d.</span>`; box0.appendChild(n); }
    const ctx=(c.dataset.title||(it&&it.t)||"");
    window.open("https://www.google.com/search?q="+encodeURIComponent(ctx+" \u2014 "+q),"_blank","noopener");
    return;
  }
  input.value="";
  const box=c.querySelector(".more"); const p=document.createElement("p");
  p.className="exp qa loading"; p.innerHTML=`<span class="q">${esc(q)}</span>thinking…`; box.appendChild(p);
  const fmt=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n+/g,"<br>");
  const parts=[];
  const T=c.dataset.title||(it&&it.t)||""; if(T) parts.push("HEADLINE: "+T);
  const S=c.dataset.summary||(it&&it.s)||""; if(S) parts.push("SUMMARY: "+S);
  if(it){
    if(it.why) parts.push("WHY IT MATTERS: "+it.why);
    if(it.eli) parts.push("IN PLAIN TERMS: "+it.eli);
    if(it.assess){const a=it.assess;parts.push("RATING: magnitude "+a.mag+"/5, timeline "+a.timeline+", evidence "+a.evidence+(a.verdict?"; verdict “"+a.verdict+"”":"")+(a.basis?" (basis: "+a.basis+")":""));}
    if(Array.isArray(it.facts)&&it.facts.length) parts.push("KEY FACTS: "+it.facts.map(f=>f.l+": "+f.v).join("; "));
    if(it.src) parts.push("SOURCE: "+it.src);
    if(it.url) parts.push("LINK: "+it.url);
    const pd=pubDate(it); if(pd) parts.push("PUBLISHED: "+pd);
  }
  const prior=[...box.querySelectorAll(".qa")].filter(x=>x!==p&&!x.classList.contains("loading")).slice(-3).map(x=>x.textContent.replace(/\s+/g," ").trim()).filter(Boolean);
  const priorTxt=prior.length?"\n\nEARLIER IN THIS THREAD:\n- "+prior.join("\n- "):"";
  const today=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:"";
  const prompt=`You are a sharp, helpful research assistant answering a reader's question about ONE item in their personal daily dashboard${today?" (today is "+today+")":""}.

ITEM CONTEXT:
${parts.join("\n")}${priorTxt}

READER'S QUESTION: "${q}"

Answer the reader's question directly in 2-4 sentences, leading with the answer. Draw on BOTH the item context above AND your own broader knowledge — specific names, numbers, dates and background — to give a genuinely useful reply. Do NOT say the summary/context \"doesn't mention\" or \"doesn't say\" something: if a detail isn't in the context, answer it from what you already know instead. Only if you genuinely cannot answer at all should you say so briefly and point to the source link. Neutral and factual; no preamble, no bullet lists.`;
  try{ let text;
    if(window.cowork&&window.cowork.askClaude){ const res=await window.cowork.askClaude(prompt,it?[it]:[]);
      text=typeof res==="string"?res:(res&&(res.text||res.content||res.output))||JSON.stringify(res);
    } else { const rr=await fetch(__ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, url:(it&&it.url)||"", title:(c.dataset.title||(it&&it.t)||"")})});
      let jj={}; try{ jj=await rr.json(); }catch(e){}
      if(!rr.ok) throw new Error((jj&&jj.error)||("HTTP "+rr.status));
      text=jj.text||jj.answer||(jj.content&&jj.content[0]&&jj.content[0].text)||JSON.stringify(jj); }
    p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>${fmt(String(text).trim())}`;
  }catch(e){ p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>Couldn't answer right now — ${esc(String((e&&e.message)||e))}. Try the source link.`; }
}
