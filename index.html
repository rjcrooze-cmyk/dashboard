ers for anyone whose team standardised on it.", "heat": 80, "delta": "cooling", "sources": 4, "url": "https://techcrunch.com/2026/08/15/spacex-officially-closes-its-cursor-acquisition/", "glance": "Cursor is now part of SpaceX", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "A default AI editor changes owner", "basis": "Deal closing confirmed by both parties; team reassignment reported"}}, {"t": "Gemini 3.7 Flash lands for coding and agent workflows", "s": "Google shipped Gemini 3.7 Flash with better coding and reasoning at roughly half the previous cost of its fast tier, aimed squarely at agent automation. It is the cheapest credible option for high-volume agent loops right now.", "heat": 76, "delta": "rising", "sources": 6, "url": "https://deepmind.google/blog/introducing-gemini-3-7-flash/", "glance": "Cheaper fast-tier model for agents", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Agent-grade inference at half the price", "basis": "Vendor launch post with published benchmarks and pricing"}}, {"t": "Grok image editing used to sexualise a childhood photo", "s": "A woman said her stepfather used Grok to turn a childhood photograph into explicit imagery. The case sharpens the regulatory question of whether image-model guardrails are adequate, and is the kind of incident that tends to precede statutory limits on consumer image tools.", "heat": 72, "delta": "new", "sources": 3, "url": "https://techcrunch.com/2026/08/15/woman-claims-her-stepfather-used-grok-to-transform-childhood-photo-into-explicit-image/", "glance": "Image-model guardrails under fresh pressure", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Safety failure likely to draw regulation", "basis": "Single reported case, corroborated by outlet; no regulatory action yet"}}, {"t": "OpenAI talent exodus flagged ahead of the IPO", "s": "A run of senior departures from OpenAI is being read as a red flag going into its public listing. It is a governance and continuity signal rather than a technical one, but it affects how much weight to give the company's roadmap commitments.", "heat": 70, "delta": "cooling", "sources": 4, "url": "https://www.ft.com/content/openai-talent-exodus-ipo", "glance": "Senior departures before OpenAI's listing", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Personnel churn, not yet a capability change", "basis": "Departures confirmed; the 'red flag' framing is analyst interpretation"}}, {"t": "An AI model flags solar eruptions hours before they appear", "s": "A new model detects precursors of solar eruptions in magnetogram data hours before the eruption becomes visible. That is a directly usable early-warning margin for grid operators, satellite fleets and aviation — the systems that actually get damaged by space weather.", "heat": 66, "delta": "new", "sources": 3, "url": "https://www.eurekalert.org/news-releases/ai-solar-eruption-prediction", "glance": "Hours of extra space-weather warning", "assess": {"mag": 4, "timeline": "0-2 yrs", "evidence": "strong", "verdict": "Real forecasting margin for grid operators", "basis": "Peer-reviewed model evaluated on historical events; not yet operational"}}, {"t": "Kog squeezes more agent throughput out of existing GPUs", "s": "French startup Kog argues GPUs are not inherently badly suited to agentic workloads and has built an inference layer that raises throughput on existing hardware. The practical read is that agent serving costs can fall without new silicon.", "heat": 62, "delta": "new", "sources": 2, "url": "https://techcrunch.com/2026/08/14/kog-is-going-deeper-to-squeeze-more-inference-out-of-gpus/", "glance": "More agent throughput per GPU", "assess": {"mag": 3, "timeline": "0-2 yrs", "evidence": "early", "verdict": "Software gains on hardware you already own", "basis": "Startup claims with limited independent benchmarking"}}, {"t": "Moonshot's Kimi K3 pulls US labs into fast follow-ups", "s": "Moonshot AI's Kimi K3 release prompted a cluster of upgrades from American labs within days. It is a useful marker of how short the response cycle between Chinese and US frontier releases has become.", "heat": 58, "delta": "steady", "sources": 3, "url": "https://www.thehindu.com/sci-tech/technology/moonshot-kimi-k3-us-ai-rivals/article.ece", "glance": "Release cycles now measured in days", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Competitive cadence, not a capability jump", "basis": "Releases confirmed; the causal link is press interpretation"}}, {"t": "Google lets users strip the visible watermark from AI images", "s": "Google will allow users to remove the visible watermark from its AI image generations while keeping the invisible SynthID signal intact. It separates cosmetic labelling from actual provenance — with the tradeoff that ordinary viewers lose the obvious cue.", "heat": 54, "delta": "new", "sources": 2, "url": "https://techcrunch.com/2026/08/14/google-will-now-allow-users-to-remove-visible-watermark-from-its-ai-generations/", "glance": "Visible AI watermark becomes optional", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Provenance stays, the visible cue goes", "basis": "Product change confirmed by Google; invisible watermark unchanged"}}]}, "aitrendsUpdated": "2026-08-16T01:59:17+00:00", "science": {"updated": "2026-08-16T01:59:17+00:00", "items": [{"t": "A 1MW perovskite solar farm outperforms a silicon system in China's first industrial-scale field test", "s": "A megawatt-scale perovskite array in China generated more energy than a silicon system installed alongside it over a full industrial-scale field trial — the first time perovskite has beaten silicon outside the lab at this size. The use-case is direct: cheaper, higher-yield utility solar, though field durability over years is still the open question. Reported from the operator's field data rather than a peer-reviewed paper.", "tag": "Energy", "imp": "important", "glance": "Perovskite beats silicon at farm scale", "url": "https://www.scmp.com/news/china/science/article/3364155/chinas-1mw-perovskite-solar-farm-beats-silicon-system-industrial-scale-test", "published": "2026-08-15T22:00:00+00:00", "src": "South China Morning Post", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Perovskite finally wins outside the lab", "basis": "1MW side-by-side field trial data; operator-reported, not peer-reviewed"}}, {"t": "Minnesota's low-purity iron ore is turned into semiconductor-grade pyrite for the first time", "s": "University of Minnesota researchers showed that abundant low-purity iron ore can be processed into semiconductor-quality iron sulfide — pyrite, or fool's gold. If it scales, it offers a cheap, non-toxic and domestically abundant feedstock for solar cells and electronics that currently depend on scarcer refined materials. Peer-reviewed lab demonstration; no pilot line yet.", "tag": "Materials", "imp": "important", "glance": "Cheap ore becomes chip-grade material", "url": "https://phys.org/news/2026-08-minnesota-iron-ore-key-sustainable.html", "published": "2026-08-15T12:00:00+00:00", "src": "Phys.org / University of Minnesota", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Abundant ore replaces scarce feedstock", "basis": "Peer-reviewed demonstration of semiconductor-quality pyrite from low-purity ore"}}, {"t": "Melanoma's drug-holiday paradox is explained — timing may matter as much as the drug", "s": "Researchers resolved a long-standing contradiction in melanoma treatment: experiments suggested periodically pausing targeted drugs should slow resistance, but trials disagreed. The new work identifies why, and points at when to schedule breaks rather than whether to take them — a change oncologists could apply with drugs already approved. Peer-reviewed preclinical and trial-data analysis.", "tag": "Health", "imp": "important", "glance": "When to pause melanoma drugs, not whether", "url": "https://scitechdaily.com/scientists-may-have-solved-a-long-standing-melanoma-treatment-mystery/", "published": "2026-08-15T16:48:00+00:00", "src": "SciTechDaily / primary release", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Rescheduling existing drugs could delay resistance", "basis": "Mechanistic study reconciling conflicting preclinical and clinical results"}}, {"t": "A nonrepeating photonic crystal makes semiconductor lasers more tunable and reliable", "s": "A nonrepeating (aperiodic) photonic-crystal design fixes the mode-instability problem that has limited photonic-crystal surface-emitting lasers for two decades. These lasers are used in defence, aerospace and LiDAR, so a design that holds a stable single mode across a tuning range is an immediately applicable manufacturing advance. Peer-reviewed, lab-scale devices.", "tag": "Physics & Photonics", "imp": "important", "glance": "Stable, tunable high-power lasers", "url": "https://phys.org/news/2026-08-nonrepeating-photonic-crystal-enable-tunable.html", "published": "2026-08-15T12:00:00+00:00", "src": "Phys.org", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Fixes a 20-year laser design limit", "basis": "Peer-reviewed device demonstration; single-mode stability shown across tuning range"}}, {"t": "US cardiologists issue new cholesterol management guidelines", "s": "American cardiology bodies published revised guidance on who should be treated for cholesterol, at what thresholds and with which combination of drugs. Guidelines are the mechanism by which research reaches the clinic, so this changes prescribing for a very large number of patients immediately. Consensus document built on pooled trial evidence.", "tag": "Health", "imp": "important", "glance": "Cholesterol treatment rules updated", "url": "https://www.sciencealert.com/us-cardiologists-issue-new-guidelines-for-how-to-manage-cholesterol", "published": "2026-08-15T19:00:00+00:00", "src": "ScienceAlert / ACC-AHA", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Changes prescribing for millions today", "basis": "Professional-society consensus guideline synthesising pooled randomised-trial evidence"}}, {"t": "A gum-disease treatment kills the pathogens without wiping out beneficial oral bacteria", "s": "A new antimicrobial approach targets the bacteria that drive periodontitis while leaving the protective oral microbiome intact — the main drawback of broad-spectrum treatment, which clears the infection and then invites reinfection. Periodontitis affects a large share of adults and is linked to cardiovascular and metabolic disease. Preclinical, peer-reviewed.", "tag": "Health", "imp": "important", "glance": "Targeted gum-disease treatment", "url": "https://scitechdaily.com/new-treatment-targets-gum-disease-without-killing-good-bacteria/", "published": "2026-08-16T01:14:00+00:00", "src": "SciTechDaily / primary release", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Selective antimicrobial spares the microbiome", "basis": "Preclinical peer-reviewed study; no human trial data yet"}}, {"t": "Oral upadacitinib produces meaningful repigmentation in vitiligo across two phase 3 trials", "s": "Two randomised controlled phase 3 studies (Viti-Up) published in The Lancet found upadacitinib 15 mg once daily gave clinically meaningful repigmentation of both face and total body in adults and adolescents with non-segmental vitiligo, with no new safety signals. Vitiligo has had no effective systemic treatment; an accompanying Lancet Comment calls oral JAK inhibitors 'a new era of innovation' for a condition affecting millions and long dismissed as cosmetic. Peer-reviewed, registrational-grade evidence — this is the kind of result that changes a treatment guideline.", "tag": "Health", "imp": "critical", "glance": "First effective oral drug for vitiligo", "url": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)00896-2/fulltext", "published": "2026-08-15T00:00:00+00:00", "src": "The Lancet", "assess": {"mag": 5, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "A treatable disease where there was none", "basis": "Two phase 3 RCTs in The Lancet with repigmentation endpoints met"}, "eli": "Vitiligo is your immune system attacking the cells that give skin its colour. This is a daily pill that calms that specific immune signal — and in two large trials, colour came back."}, {"t": "Engineered bacterium speeds CO2 capture while recovering EV battery metals", "s": "Cornell researchers genetically engineered a bacterium to rapidly break down one of Earth's most abundant silicate minerals — a reaction that locks away atmospheric CO2 and, in the same step, liberates critical elements used in electric-vehicle batteries. Enhanced rock weathering has been too slow to matter industrially; making it biological and fast, with a saleable metals by-product, is what changes the economics. Lab-stage, peer-reviewed.", "tag": "Energy & Materials", "imp": "important", "glance": "Microbe does carbon capture and metal recovery at once", "url": "https://phys.org/news/2026-08-microbe-capture-recovers-critical-metals.html", "published": "2026-08-15T00:00:00+00:00", "src": "Phys.org (Cornell)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Carbon capture that pays for itself", "basis": "Engineered strain demonstrated in lab; industrial scale-up unproven"}}, {"t": "A gold nanoantenna steers infrared light through a waveguide that isn't physically there", "s": "A team at Göttingen's 4th Physics Institute placed a nanoscale gold antenna on a crystal and sent infrared light down a single narrow path without carving any waveguide into the material. The use-case is direct: on-chip optical routing that can be reconfigured rather than etched, for integrated photonics and quantum hardware.", "tag": "Physics & Space", "imp": "important", "glance": "Reconfigurable on-chip light routing", "url": "https://scitechdaily.com/scientists-steer-infrared-light-through-an-invisible-waveguide/", "published": "2026-08-14T23:30:28+00:00", "src": "SciTechDaily / Uni Göttingen", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Etch-free optical routing demonstrated on a chip", "basis": "Peer-reviewed lab demonstration of antenna-defined infrared guiding"}}, {"t": "Cancer stem cells have an 'energy addiction' that can be turned against them", "s": "In high-risk myelodysplastic syndrome, the stem cells that survive chemotherapy and drive relapse depend on a distinct metabolic pathway that ordinary cells do not. Blocking it killed the stem-cell population selectively. Cancer stem cells surviving treatment is the main reason blood cancers come back, so a selective metabolic handle on them matters — this is preclinical.", "tag": "Health", "imp": "important", "glance": "Metabolic weak point in relapse-driving cancer cells", "url": "https://scitechdaily.com/cancer-stem-cells-have-an-energy-addiction-and-scientists-found-a-way-to-exploit-it/", "published": "2026-08-14T19:00:00+00:00", "src": "SciTechDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A way to hit the cells that cause relapse", "basis": "Preclinical selective killing of MDS stem cells; no human data yet"}}, {"t": "Implantable engineered cells reset the body clock, pointing at a real jet-lag treatment", "s": "Rice and Northwestern researchers built an implantable cell therapy that releases circadian-signalling molecules on a schedule, speeding the body's adjustment to a new time zone. Beyond travel, the target is shift work — where chronic circadian misalignment is linked to metabolic disease. Animal-stage.", "tag": "Health", "imp": "important", "glance": "Cell therapy that speeds circadian adjustment", "url": "https://phys.org/news/2026-08-jet-lag-cells-circadian-adjustment.html", "published": "2026-08-14T19:00:00+00:00", "src": "Phys.org (Rice / Northwestern)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Shift-work health, not just jet lag", "basis": "Implantable construct demonstrated in animals; no human trials"}}, {"t": "A new method pushes glycans directly into living cells, opening a blocked area of drug discovery", "s": "Glycans drive cell signalling and change in cancer, but they are too water-soluble to cross the cell membrane, which has kept them largely out of reach experimentally. The new delivery chemistry gets them inside intact — a lab tool first, but the enabling step for glycan-targeted diagnostics and therapeutics.", "tag": "Biology", "imp": "important", "glance": "Glycans finally delivered inside cells", "url": "https://phys.org/news/2026-08-scientists-method-sugars-cells.html", "published": "2026-08-14T17:40:04+00:00", "src": "Phys.org", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Unlocks a long-blocked class of drug targets", "basis": "Peer-reviewed chemistry; validated in cells, no therapeutic candidate yet"}}, {"t": "Compact viral RNA elements make mRNA drugs last longer and produce more protein", "s": "A team led by Kim V. Narry at the Institute for Basic Science found short viral RNA elements that stabilise mRNA and raise protein output. Because they are small and modular, they can be dropped into existing mRNA constructs — meaning lower doses, fewer repeat injections and better-behaved mRNA therapeutics without redesigning the platform.", "tag": "Biology", "imp": "important", "glance": "A plug-in that makes mRNA drugs last longer", "url": "https://phys.org/news/2026-08-stable-rna-elements-possibilities-mrna.html", "published": "2026-08-14T17:00:00+00:00", "src": "Phys.org (IBS Korea)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Cheaper, longer-lasting mRNA medicine", "basis": "Modular elements validated in cell systems; peer-reviewed, not yet clinical"}}, {"t": "THC reduces nightmare severity in people with PTSD in a controlled trial", "s": "A THC-based drug cut both the severity and frequency of nightmares in people with post-traumatic stress disorder. Nightmares are among the most treatment-resistant PTSD symptoms and current options are thin, so a controlled positive result here is directly useful to clinicians.", "tag": "Health", "imp": "important", "glance": "THC drug cuts PTSD nightmares in trial", "url": "https://www.newscientist.com/article/2584744-thc-in-cannabis-may-reduce-nightmares-in-people-with-ptsd/", "published": "2026-08-14T14:00:00+00:00", "src": "New Scientist", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "A real option for treatment-resistant nightmares", "basis": "Controlled clinical trial with severity and incidence endpoints"}}, {"t": "Cancer cells build a sugar shield to hide from the immune system — and it can be stripped", "s": "Sanford Burnham researchers show tumour cells coat themselves in a dense glycan layer that blocks immune recognition, and that the surrounding nutrient environment controls how thick that coat gets. Peer-reviewed lab and cell work, not yet in patients — but it names a concrete target: strip the sugar coat and existing immunotherapies should see the tumour again.", "tag": "Health", "imp": "important", "glance": "Sugar coat hides tumours from immunity", "url": "https://scitechdaily.com/cancer-cells-use-a-sugar-shield-to-hide-from-the-immune-system/", "published": "2026-08-14T11:04:28+00:00", "src": "SciTechDaily / Sanford Burnham", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "A real immunotherapy target, not yet a drug", "basis": "Peer-reviewed cell/animal work identifying a modifiable glycan shield"}}]}, "scienceUpdated": "2026-08-16T01:59:17+00:00", "scienceDaily": {"updated": "2026-08-16T01:59:17+00:00", "items": [{"t": "A brainstem-versus-hypothalamus split explains why blocking and activating the same receptor both cause weight loss", "s": "Activating the GIP receptor in the brainstem cuts appetite, while blocking it in the hypothalamus removes a brake on energy expenditure — which is why two opposite drug strategies aimed at the same target both work. That resolves a genuine design question for the next generation of obesity drugs, several of which are already in trials. Mouse study, peer-reviewed.", "tag": "Health", "imp": "important", "glance": "Two opposite obesity drugs, one explanation", "url": "https://www.sciencedaily.com/releases/2026/08/260814011039.htm", "published": "2026-08-15T10:55:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Settles a live obesity-drug design question", "basis": "Mouse study with region-specific receptor manipulation; peer-reviewed"}}, {"t": "When dietary fibre runs short, gut microbes start eating the gut's own mucus lining", "s": "Researchers found that when fibre is limited, gut bacteria switch to consuming proteins from the mucus layer that protects the intestinal wall — and that restoring fibre stops it. It gives a concrete mechanism behind fibre intake targets and a plausible route into inflammatory gut disease. Animal and in-vitro work, peer-reviewed.", "tag": "Health", "imp": "important", "glance": "Low fibre makes microbes eat your gut lining", "url": "https://www.sciencedaily.com/releases/2026/08/260814235842.htm", "published": "2026-08-15T14:30:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Gives fibre guidance a real mechanism", "basis": "Animal and in-vitro study showing mucin degradation under fibre restriction"}}, {"t": "A widely available food preservative is linked to rising suicide deaths in the UK", "s": "Researchers report that a common food-preservation chemical, freely purchasable, is appearing in a rising share of UK suicide deaths, particularly among younger people and men. The stated use-case is regulatory: restricting retail sale of the compound, a measure that has reduced deaths for other agents. Observational, peer-reviewed.", "tag": "Health", "imp": "important", "glance": "Preservative access linked to suicide deaths", "url": "https://www.sciencedaily.com/releases/2026/08/260813045557.htm", "published": "2026-08-15T14:09:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Points at a specific, restrictable exposure", "basis": "Observational analysis of national mortality data; association, not proven causation"}}, {"t": "Stair climbing linked to 39% lower cardiovascular death across 480,000 people", "s": "A pooled analysis of more than 480,000 people found regular stair climbers were 39% less likely to die of cardiovascular disease and 24% less likely to die of any cause than people who rarely took stairs. Observational, so some of that is fitness selecting for stair use — but the sample size makes it one of the better-powered arguments for the cheapest possible intervention.", "tag": "Health", "imp": "important", "glance": "Stairs tied to 39% lower cardiac death", "url": "https://www.sciencedaily.com/releases/2026/08/260814011029.htm", "published": "2026-08-14T12:30:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "The cheapest cardiovascular intervention there is", "basis": "Pooled analysis across 480,000+ people; observational design"}}, {"t": "World's first superconducting quantum heat engine could remove the cabling bottleneck in quantum computers", "s": "A team at Aalto University built a microscopic superconducting engine — transmon qubit, resonator and quantum refrigerator — that ran a full Otto cycle near absolute zero, converting heat into useful work. Published in Nature Communications. The practical point is money and noise: scaling to a thousand logical qubits needs hundreds of thousands of physical qubits and microwave cables costing about a thousand euros each. Autonomous engines built into the circuit could read qubits without running signals across an extreme temperature gradient.", "tag": "Physics & Space", "imp": "important", "glance": "First cyclic quantum heat engine, built and run", "url": "https://www.sciencedaily.com/releases/2026/08/260814011041.htm", "published": "2026-08-14T11:40:00+00:00", "src": "ScienceDaily (Nature Comms / Aalto)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "proven", "verdict": "Removes a hard cost wall in quantum scaling", "basis": "Working device completing an Otto cycle; peer-reviewed in Nature Communications"}}, {"t": "Estrogen-only hormone therapy linked to 39% lower dementia odds in a 21,000-woman study", "s": "Stanford researchers analysed 21,462 women, with brain imaging in 728 and autopsy data in 2,959, and found estrogen-only hormone therapy associated with 39% lower odds of a dementia diagnosis and 35% lower odds of Alzheimer's-related brain changes at autopsy. Published in Neurology. The authors are explicit that this is association, not prevention — and that participants started therapy around age 70, far later than today's practice of starting in the late 40s or early 50s.", "tag": "Health", "imp": "critical", "glance": "Estrogen therapy tied to less Alzheimer's pathology", "url": "https://www.sciencedaily.com/releases/2026/08/260814011028.htm", "published": "2026-08-14T11:30:00+00:00", "src": "ScienceDaily (Neurology / Stanford)", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Reframes the menopause hormone-therapy calculus", "basis": "21,462 participants with 2,959 autopsies; observational, association only"}, "eli": "It doesn't prove hormone therapy prevents Alzheimer's. It does mean women who took estrogen had visibly less Alzheimer's damage in their brains after death — a much harder piece of evidence than a questionnaire."}, {"t": "A shut-down nuclear reactor's antineutrino 'afterglow' is detected for the first time", "s": "The Double Chooz collaboration, led from the Max Planck Institute for Nuclear Physics, measured the faint antineutrino emission that continues for months after a reactor is switched off, and found it matched decay predictions for the core and nearby spent-fuel pools. Published in Physical Review Letters. Because antineutrinos pass straight through shielding, this makes it possible to verify what is inside a reactor and its fuel pools even when it is offline — the exact gap in nuclear safeguards inspection.", "tag": "Physics & Space", "imp": "important", "glance": "Reactors can now be monitored while shut down", "url": "https://www.sciencedaily.com/releases/2026/08/260814011036.htm", "published": "2026-08-14T11:10:00+00:00", "src": "ScienceDaily (PRL / MPIK)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "proven", "verdict": "A new tool for nuclear safeguards", "basis": "First measurement of post-shutdown antineutrino flux, matching decay models"}}, {"t": "Vitamin D deficiency plus abdominal obesity carries a 123% higher six-year death risk", "s": "A cohort of more than 5,500 adults over 50 found that abdominal obesity combined with vitamin D deficiency was associated with a 123% higher risk of death over six years. Each factor raised risk on its own, but together the effect was greater than additive. Both are cheap to measure and one is cheap to correct, which is what makes this actionable — though it remains a single observational study.", "tag": "Health", "imp": "important", "glance": "Belly fat plus low vitamin D is a compounding risk", "url": "https://www.sciencedaily.com/releases/2026/08/260813045554.htm", "published": "2026-08-14T02:45:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "Two cheap tests that together predict a lot", "basis": "5,500+ adults over six years; observational, single cohort"}}]}, "scienceDailyUpdated": "2026-08-16T01:59:17+00:00", "life": {"updated": "2026-08-16T01:59:17+00:00", "items": []}, "lifeUpdated": "2026-08-16T01:59:17+00:00", "mind": {"updated": "2026-08-16T01:59:17+00:00", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "A protein inside appetite-control neurons sets how much high-fat food an animal eats", "s": "A protein inside appetite-controlling brain cells appears to gate overeating specifically when high-fat food is freely available, with unexpected differences between the sexes. It identifies a distinct target from the current GLP-1 pathway, aimed at the environmental-abundance side of obesity rather than satiety alone. Mouse study, peer-reviewed.", "url": "https://www.sciencedaily.com/releases/2026/08/260813045531.htm", "published": "2026-08-13T09:42:00+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A separate brake on high-fat overeating", "basis": "Peer-reviewed mouse study identifying a protein specific to fat-driven intake"}}, {"t": "Blood immune cells enter the ageing brain from middle age and turn into microglia", "s": "Stanford researchers found the ageing human brain is far less immune-isolated than assumed: large numbers of immune cells cross in from the blood starting as early as middle age, and once inside they can convert into microglia, the brain's resident immune cells. Peer-reviewed human tissue work; it reframes neuroinflammation as partly imported rather than purely local.", "url": "https://www.sciencedaily.com/releases/2026/08/260814011033.htm", "published": "2026-08-14T13:28:02+00:00", "src": "ScienceDaily / Stanford", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Rewrites where brain inflammation comes from", "basis": "Peer-reviewed human study showing peripheral immune cells becoming microglia"}}, {"t": "Myelin precursor cells release the stress hormone CRH to control brain repair after injury", "s": "Researchers found that myelin-producing precursor cells rapidly release corticotropin-releasing hormone near damaged tissue, and that this local signal governs how those cells mature and rebuild nerve insulation. Remyelination failure is the core problem in multiple sclerosis and in recovery from brain injury, so identifying a local, druggable control signal is a real handle on it.", "url": "https://www.sciencedaily.com/releases/2026/08/260814011044.htm", "published": "2026-08-14T11:45:00+00:00", "src": "ScienceDaily (peer-reviewed)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A local switch for rebuilding nerve insulation", "basis": "CRH release by OPCs shown to regulate maturation at injury sites"}}, {"t": "The brain clears waste through a fast lane and a slow lane — about 50 times slower in deep tissue", "s": "Using AI-assisted measurement, researchers mapped how cerebrospinal fluid actually moves through the brain and found it travels quickly around the outer spaces but roughly 50 times more slowly through deep tissue. The glymphatic system's clearance rate is central to theories of how amyloid and tau accumulate, and until now the deep-tissue rate was essentially guessed. It also sets a hard constraint on how any drug delivered into cerebrospinal fluid can reach deep structures.", "url": "https://www.sciencedaily.com/releases/2026/08/260811011130.htm", "published": "2026-08-13T18:00:00+00:00", "src": "ScienceDaily (peer-reviewed)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Pins a number on brain waste clearance", "basis": "Direct measurement of glymphatic flow rates in deep vs surface tissue"}, "eli": "Your brain rinses itself while you sleep. Turns out the rinse reaches the surface quickly but crawls through the middle — which may be why damage builds up deep inside."}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Extracochlear electrical stimulation points toward hearing restoration without implant surgery", "s": "A preprint reports that stimulating the auditory system from outside the cochlea can evoke structured auditory responses, suggesting a route to restoring hearing without the invasive intracochlear implant that current devices require. Cochlear implants destroy residual hearing on insertion, so a non-invasive alternative would widen who can be treated. Preprint — not yet peer-reviewed.", "url": "https://www.biorxiv.org/content/10.64898/2026.08.10.743874v1", "published": "2026-08-14T00:00:00+00:00", "src": "bioRxiv", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Hearing restoration without cutting the cochlea", "basis": "bioRxiv preprint; animal-level evidence, not peer-reviewed or replicated"}}, {"t": "Cellular-resolution brain-computer interface recordings stay stable for years after stroke", "s": "Implantable BCIs with single-neuron resolution have so far been validated mainly in spinal cord injury and motor neuron disease. This work shows chronic single-unit recordings remain stable long-term in stroke-injured cortex — the largest untapped population for iBCIs. Preprint, not yet peer-reviewed, but it is the missing feasibility evidence for extending implants to stroke.", "url": "https://www.biorxiv.org/content/10.64898/2026.08.09.742157v1?rss=1", "published": "2026-08-14T00:00:00+00:00", "src": "bioRxiv (preprint)", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Opens implanted BCIs to stroke patients", "basis": "Preprint; chronic recording stability shown, not yet peer reviewed"}}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "Cutting a nerve in the hand reorganises the digit maps in primary somatosensory cortex", "s": "Nature Human Behaviour reports that severing a hand nerve measurably changes how individual fingers are represented in primary somatosensory cortex. Adult cortical maps have long been argued to be far more fixed than the classic plasticity literature claimed; this is direct evidence they reorganise after peripheral injury, which matters for how nerve-repair surgery and prosthetic control are timed and rehabilitated.", "url": "https://www.nature.com/nathumbehav/", "published": "2026-08-13T16:00:00+00:00", "src": "Nature Human Behaviour", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Adult sensory maps do reorganise after injury", "basis": "Digit-map changes measured after peripheral nerve section; peer-reviewed"}}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today", "s": "No Major or Historic peer-reviewed result in this area in the last 72 hours after a full scan of the journal, preprint and press-release feeds.", "url": "", "published": "", "src": "", "assess": {"mag": 1, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result today", "basis": "Full feed scan returned nothing at Major or Historic level"}}]}]}, "mindUpdated": "2026-08-16T01:59:17+00:00", "mindset": {"updated": "2026-08-16T01:59:17+00:00", "messages": [{"who": "Joseph Rodrigues", "t": "Talk to yourself like this for just 3 days (Psycho-Cybernetics)", "vid": "XdDkkWFAjro", "url": "https://www.youtube.com/watch?v=XdDkkWFAjro", "gist": "The whole argument rests on one line from Neville Goddard: speech is the image of mind, so to change your mind you must first change your inner conversation. Joseph works through the point-of-life model — awareness at the top, mind as the container the Bible calls the heart, and thought as the one faculty entirely under your control. Nothing outside you, not the news and not social media, actually decides what you think; you keep the ability to discern and refuse. The practical instruction is to hold your inner talk from the premise of fulfilled desire — speaking as though the income, the relationship or the health is already yours — because the subconscious does not distinguish the imagined from the real, and it is that assumed state, not effort, that reorganises circumstances around you. Then let it work: over-forcing it, he says, is the old self reasserting itself."}, {"who": "Elmer O. Locker Jr", "t": "The person watching this has shifted into a millionaire today", "vid": "NQEtsJuqc6o", "url": "https://www.youtube.com/watch?v=NQEtsJuqc6o", "gist": "Locker's frame is that the life you are experiencing is a simulation, and that the thing you most want feels far away only because you have stamped it with labels of seriousness, importance and fear. Those labels are the disturbance in the connection — when you treat a manifestation as difficult or high-stakes, the images your mind produces are of it going to someone else, and that is what the low frequency of anxiety actually consists of. The instruction is to become still and present, feel yourself into the wish already fulfilled, and slow time down — his image is Neo at the end of The Matrix, stopping the bullets not by force but by dropping fully into present-moment awareness. The problems and stresses in your life are real only to the degree you keep assigning them realness; the practical move is to withdraw the label of importance from the outcome and step into the version of yourself that already has it, rather than negotiating with the fear."}, {"who": "AH Universe (Abraham Hicks)", "t": "Three Ways To Manifest, Only One Fits You Today", "vid": "jxqZP_5UImg", "url": "https://www.youtube.com/watch?v=jxqZP_5UImg", "gist": "You have probably collected several contradictory instructions about how to get what you want: visualise it in detail, feel only its general essence, or stop thinking about it altogether. The clarifying idea here is that these are not rival techniques competing for your loyalty. They are the same movement — turning toward relief — started from three different places. If a subject already delights you, hold the specific picture and enjoy the details. If specifics make you tighten up, stay general: you want to feel free, you want to feel good, and you leave the how alone. And if the subject is so sore that every thought of it rehearses its absence, put it down for now; you are not failing, you are simply pointing at lack. The practical question today is not which method is correct but where you actually are — choose the one that gives you relief from here."}]}, "mindsetUpdated": "2026-08-16T01:59:17+00:00", "elon": {"day": "2026-08-15", "source": "@jcub2x daily recap", "note": "Built from the @jcub2x recap covering 19 posts on 15 Aug 2026, plus fresh Musk-orbit reporting. Engagement counts are not published in the recap, so likes and views are omitted; ordering is by notability.", "highlight": {"t": "Musk says government-mandated censorship on X is now visible in the open-sourced ranking code", "s": "After X published its For You ranking code — which includes a filter hiding posts from accounts reported to Brazil's electoral court for the 2026 election unless a viewer already follows them — Musk said any censorship required by governments is now clearly visible in the code.", "href": "https://github.com/twitter/the-algorithm"}, "items": [{"kind": "post", "t": "On X open-sourcing its For You algorithm, including a filter required by Brazilian electoral law for the 2026 election", "s": "Commenting on X's open-source release notes — which describe a filter removing posts from accounts reported to Brazil's electoral court unless a viewer follows them — Musk said any censorship required by governments is now clearly visible.", "imp": "important", "iso": "2026-08-15T14:20:00+00:00"}, {"kind": "post", "t": "Quoting a demo of a 3D shooter game that Grok 4.6 built autonomously over 48 hours using 'gauntlet loops'", "s": "Musk quoted the demo with 'Grok 4.6 runs the gauntlet,' highlighting the model working non-stop to produce a playable Doom-style game.", "imp": "important", "iso": "2026-08-15T09:40:00+00:00"}, {"kind": "post", "t": "Quoting the announcement that Grok 4.6 is now available in GitHub Copilot's CLI, IDE and cloud products", "s": "Musk quoted the availability announcement with 'Grok 4.6 now in Copilot,' putting xAI's model in front of GitHub's developer base.", "imp": "important", "iso": "2026-08-15T11:15:00+00:00"}, {"kind": "reply", "t": "Replying to Katie Miller on a WSJ piece about Ford and GM arguing over which is the most American automaker, where she said the answer is Tesla", "s": "Musk replied that Tesla vehicles are more than just assembled in the US — the parts are overwhelmingly made in America too.", "imp": "important", "iso": "2026-08-15T08:05:00+00:00"}, {"kind": "reply", "t": "Replying to a Cursor engineer, now on the SpaceX AI team after SpaceX closed the Cursor acquisition, who said it would be cool to visit Mars sometime", "s": "Musk replied 'You're welcome to go,' following the closing of the Cursor acquisition and the team's move onto Grok, the Grok API and Grok Bot.", "imp": "important", "iso": "2026-08-15T09:05:00+00:00"}, {"kind": "repost", "t": "Reposting X engineer Keith Coleman promoting X's new 'Under the Hood' transparency report, quoting a user who assumed her reach was suppressed but found zero reach-limiting labels", "s": "Musk reposted Coleman's point that users can now check and verify whether any visibility labels were applied to their account or posts.", "imp": "interesting", "iso": "2026-08-15T13:10:00+00:00"}, {"kind": "post", "t": "Quoting Keith Coleman's plain-language breakdown of how X's ranking weights work — multipliers on predicted probabilities, not counts of real likes or reports", "s": "Musk quoted the explainer approvingly, endorsing the clarification that a large negative weight on a report prediction does not mean one report equals hundreds of likes.", "imp": "interesting", "iso": "2026-08-15T13:45:00+00:00"}, {"kind": "repost", "t": "Reposting a walkthrough of Grok Build diagnosing Mac hardware and software problems — trackpad glitches, battery drain, monitor refresh rate and runaway CPU usage", "s": "The demo shows Grok Build inspecting a machine, identifying the cause and acting on it rather than the user hunting through settings.", "imp": "interesting", "iso": "2026-08-15T10:30:00+00:00"}, {"kind": "repost", "t": "Reposting a how-to for running Grok's 'gauntlet loop' agentic workflow, which notes Grok Build's harness works best", "s": "Musk amplified the guide for running gauntlet loops in Grok Build or Grok Bot.", "imp": "interesting", "iso": "2026-08-15T10:00:00+00:00"}, {"kind": "reply", "t": "Replying to an Anthropic employee's rebuttal of a claim made on the All-In podcast — attributed to unnamed sources and unverified — that Dario Amodei suggested Anthropic could end up the only private company in the world", "s": "Musk replied that the most entertaining outcome is the most likely, especially if ironic. The underlying claim about Amodei is contested and unverified.", "imp": "interesting", "iso": "2026-08-15T15:30:00+00:00"}, {"kind": "repost", "t": "Reposting Gavin Baker's follow-up in the same Anthropic dispute, arguing AI should be distributed rather than concentrated through regulation", "s": "Baker's post works through the 'too dangerous to concentrate versus too dangerous to distribute' framing while also calling Anthropic an excellent company; the characterisations of Anthropic's position are disputed by the company.", "imp": "interesting", "iso": "2026-08-15T16:00:00+00:00"}, {"kind": "reply", "t": "Replying in a thread on a compute model arguing orbital data centres become necessary to scale AI in the 2030s, where a user said people don't grasp how much compute the world will need", "s": "Musk replied 'They really don't,' consistent with his earlier claim that orbital compute will be the only way to scale AI around 2029 because of land, power and permitting limits.", "imp": "interesting", "iso": "2026-08-15T16:40:00+00:00"}, {"kind": "reply", "t": "Replying to a Tesla engineer contrasting a culture of arguing over credit with one of taking turns to solve hard problems completely", "s": "Musk replied '100,' endorsing the point that what matters is a hard problem being solved fully, not who gets the credit.", "imp": "interesting", "iso": "2026-08-15T08:35:00+00:00"}, {"kind": "repost", "t": "Reposting Texas Governor Greg Abbott's announcement of a review of state grants to Dallas-Fort Worth and Houston airports over ritual washing facilities, which Abbott claims are illegal religious favouritism", "s": "Abbott says he has referred the airports to the US Department of Transportation for investigation. The legal claim is contested and has not been adjudicated.", "imp": "interesting", "iso": "2026-08-15T17:20:00+00:00"}, {"kind": "reply", "t": "Replying to a post citing figures on declining shares of white men in certain academic, corporate and medical-school roles, which claimed systematic exclusion", "s": "Musk replied 'True,' endorsing the claim. The underlying statistics and the causal interpretation are contested and not independently verified.", "imp": "interesting", "iso": "2026-08-15T18:10:00+00:00"}, {"kind": "reply", "t": "Replying in a thread about a Texas arson suspect with a Hispanic name recorded as white in county records, where a user asked how close to zero the white crime rate actually is", "s": "Musk replied 'Very close.' The claim rests on a disputed premise about how race is recorded in US arrest data and is not established.", "imp": "interesting", "iso": "2026-08-15T18:00:00+00:00"}, {"kind": "reply", "t": "Replying to Australian commentator Drew Pavlou's post about the killing of a 27-year-old man in a carjacking, noting police withheld the suspects' identities because they are minors", "s": "Musk replied 'Who did it?', pressing for the identities of the accused. Details of the case as described in the original post are unverified.", "imp": "interesting", "iso": "2026-08-15T18:45:00+00:00"}, {"kind": "reply", "t": "Replying to a video tour of prayer and ablution facilities at Houston's Bush Intercontinental Airport, shared in the thread about Abbott's review", "s": "Musk replied with a one-word 'Really?', expressing surprise that the airport has dedicated prayer and washing rooms.", "imp": "noise", "iso": "2026-08-15T17:35:00+00:00"}, {"kind": "reply", "t": "Replying to a joke post asking whether an AI-generated novelty song about data centres could be the song of the summer", "s": "Musk responded with amusement to the meme track.", "imp": "noise", "iso": "2026-08-15T17:00:00+00:00"}]}, "elonNews": [{"t": "SpaceX formally closes its acquisition of Cursor", "s": "The AI coding startup is now part of SpaceX, with its engineers moving onto Grok, the Grok API and Grok Bot.", "url": "https://techcrunch.com/2026/08/15/spacex-officially-closes-its-cursor-acquisition/", "published": "2026-08-15T16:10:00+00:00", "src": "TechCrunch"}, {"t": "Grok 4.6 becomes available inside GitHub Copilot", "s": "Grok 4.6 is now selectable in Copilot's CLI, IDE and cloud products, putting xAI's model in front of GitHub's developer base.", "url": "https://github.blog/changelog/grok-4-6-in-copilot", "published": "2026-08-15T11:15:00+00:00", "src": "GitHub"}, {"t": "X publishes its For You ranking code, exposing a Brazil electoral filter", "s": "The open-source release includes a filter that hides posts from accounts reported to Brazil's electoral court unless a viewer follows them, added for the 2026 election.", "url": "https://github.com/twitter/the-algorithm", "published": "2026-08-15T14:20:00+00:00", "src": "X / GitHub"}, {"t": "Grok image editing misused to sexualise a childhood photograph", "s": "A woman said her stepfather used Grok to turn a childhood photo into explicit imagery, adding to scrutiny of xAI's image guardrails.", "url": "https://techcrunch.com/2026/08/15/woman-claims-her-stepfather-used-grok-to-transform-childhood-photo-into-explicit-image/", "published": "2026-08-15T21:20:00+00:00", "src": "TechCrunch"}, {"t": "Starship booster from flight 13 still adrift in the Indian Ocean", "s": "Nearly three weeks after the flight, the booster is still floating and the improvised fender-loop tow rig has smashed a large number of heat-shield tiles.", "url": "https://www.youtube.com/watch?v=WRhmo7DKwfQ", "published": "2026-08-15T15:00:00+00:00", "src": "Scott Manley / Deep Space Updates"}, {"t": "SpaceX posts $7.8bn revenue and a $541m net loss in its first post-IPO results", "s": "Starlink was the strongly profitable segment at $4.29bn revenue and $1.66bn operating income, while Starship development drove a $542m loss in the space segment.", "url": "https://www.spacex.com/investors", "published": "2026-08-15T15:30:00+00:00", "src": "SpaceX investor materials"}], "elonNewsUpdated": "2026-08-16T01:59:17+00:00", "youtube": {"count": 15, "note": "274 subscribed channels polled (293 subscriptions minus EXCLUDE genres and MIND-TAB routing); 22 uploads in the last 24h after zero-repeat dedup against 118 previously shown video ids; 15 kept after dropping clips with no captions or no real takeaway.", "groups": [{"h": "🔬 Science & space", "items": [{"t": "Starship Still Lost At Sea, China's Rocket Gets Bent, Rocket Lab's Ghost — Deep Space Updates", "s": "Scott Manley's fortnightly roundup: Starship 13's booster is still adrift in the Indian Ocean with heat-shield tiles being smashed by the improvised fender-loop tow rig, China's Long March 7A visibly bent in half around the interstage and broke up near Max Q, and SpaceX's first post-IPO results showed $7.8bn revenue against a $541m net loss with Starlink the only strongly profitable segment.", "glance": "Starship 13's booster is still floating in the Indian Ocean with tiles smashed by its own tow rig, while China's Long March 7A bent in half and broke up at Max Q.", "vid": "WRhmo7DKwfQ", "url": "https://www.youtube.com/watch?v=WRhmo7DKwfQ", "published": "2026-08-15T14:55:00+00:00", "src": "@scottmanley", "subject": "space launch roundup", "pointsLabel": "Every story in this roundup", "points": [{"t": "Starship flight 13 recovery", "s": "Nearly three weeks on the vehicle still floats in the Indian Ocean; SpaceX corralled it in a loop of Yokohama fenders rather than hooking it directly, and those fenders have smashed many tiles, with some control hardware reportedly destroyed."}, {"t": "Starship flight 14 plans", "s": "On the earnings call SpaceX confirmed flight 14 aims to catch Starship on the tower, possibly catch the booster too, and deploy operational V3 Starlink satellites; airspace filings hint it could fly this month."}, {"t": "SpaceX finances", "s": "First post-IPO results: $7.8bn revenue, $541m net loss. Space made $962m but lost $542m on Starship development; Starlink earned $4.29bn revenue and $1.66bn operating income; the AI segment booked $2.56bn on paper against a $1.26bn loss."}, {"t": "Long March 7A failure", "s": "The 10 August Chinasat launch broke up near Max Q, with footage showing the rocket bending in half around the interstage between second and third stage. No injuries reported and no further official update."}, {"t": "NROL / USA 619 launch", "s": "A Falcon 9 dogleg raised inclination to 63.5 degrees — impossible to fly direct from the Cape without overflying Canada — placing the payload in the same plane as NOSS 3-7 paired ocean-surveillance satellites that geolocate ships by radio interferometry."}, {"t": "Japan's QZS-7 launch", "s": "An H3-22S put Michibiki 7 into a 24-hour geosynchronous orbit inclined about 44 degrees so it traces a figure-eight and hovers near-overhead of Japan, giving GNSS fixes inside urban canyons. It also carried a US Space Force SACHI space-awareness camera."}, {"t": "Hughes bankruptcy", "s": "Hughes filed for Chapter 11 after losing roughly 21% of its satellite-broadband customers to Starlink in a year, restructuring around GEO customers who still need it rather than domestic consumer internet."}, {"t": "Rocketdyne spun out", "s": "AEI Industrial Partners bought the space propulsion and power electronics business (about 1,300 people) from L3Harris for $845m. Rocketdyne keeps space engines like the RL10; L3Harris/Aerojet retain solid motors and the RS-25 SLS contract."}, {"t": "Rocket Lab: GHOST and Neutron", "s": "Rocket Lab unveiled GHOST, a containerised Electron launch system shippable anywhere for hypersonic test contracts. Peter Beck now says Neutron reaches the pad in Q4 2026, which Manley reads as a first flight slipping to 2027."}, {"t": "Blue Origin BE-4 pad failure", "s": "David Limp says the anomaly originated at a BE-4 main oxygen valve, confirmed by recovered hardware; the fix is small valve modifications retrofittable to existing engines. Blue is rehearsing vertical stacking at LC-11 ahead of LC-36 returning."}, {"t": "JPL lithium Hall thruster", "s": "JPL ran a lithium-propellant Hall thruster at 120 kW with tungsten electrodes glowing at about 2,800 C. Lithium's much higher second-ionisation threshold avoids the double-ionisation energy losses of xenon, and it is far cheaper and more abundant."}, {"t": "Swift rescue spacecraft", "s": "The Catalyst team regained control of the spacecraft sent to rescue the Swift telescope by firing xenon Hall thrusters asymmetrically to kill its spin, slowing it enough to upload software that works around unavailable reaction wheels."}, {"t": "Japan's MMX mission", "s": "Hardware for the Martian Moons eXploration mission was unveiled with the lander deliberately shown tipped over to expose its sampling gear. It will orbit Phobos and Deimos, deploy a rover, land, and return samples to Earth."}, {"t": "Coming up: Chang'e 7", "s": "China plans to launch Chang'e 7 to the lunar south pole on the 24th — the seventh mission in a lunar programme with no failures so far."}]}, {"t": "Finally an Explanation for Earth's Continents", "s": "A Curtin University group argues Earth's first continents were seeded by comet bombardments that thinned the young crust, using isotope data from ancient crystals showing crust-production spikes roughly every 190 million years — close to the interval at which the solar system crosses the Milky Way's spiral arms. Hossenfelder is openly sceptical, noting the correlation looks weak by eye and rating the claim 8/10 on her nonsense meter.", "glance": "New isotope data ties bursts of continental crust formation to a ~190-million-year cycle matching Milky Way spiral-arm crossings, though the correlation looks weak.", "vid": "4k7njY7F1-8", "url": "https://www.youtube.com/watch?v=4k7njY7F1-8", "published": "2026-08-15T15:00:00+00:00", "src": "@SabineHossenfelder", "subject": "continent formation"}]}, {"h": "🤖 AI & technology", "items": [{"t": "This Platform Made AI Almost 95% Hallucination-Free: Tech Mahindra's Data & AI Chief Explains How", "s": "Tech Mahindra's Data & AI SVP Sourav Jha argues hallucination is an engineering problem, not a model problem: building an enterprise ontology and knowledge graph on top of existing data grounds agents in how that specific company actually works, producing roughly 95%+ hallucination-free output and a full audit trail of why an agent decided what it did. His practical advice is to stop treating ontology as a five-year, multi-million-dollar programme.", "glance": "Grounding agents in an enterprise ontology and knowledge graph cut hallucinations to near zero and made every agent decision auditable and explainable.", "vid": "emILJ-ZMdNA", "url": "https://www.youtube.com/watch?v=emILJ-ZMdNA", "published": "2026-08-15T11:30:00+00:00", "src": "@aimmediahouse", "subject": "enterprise AI grounding", "pointsLabel": "Takeaways from the interview", "points": [{"t": "Ontology as the hallucination fix", "s": "Models are fine, but they don't know how your company works. An ontology is the enterprise compiled into entities and relationships, and it delivers both ~95%+ hallucination-free answers and a trail of why an agent decided what it did — which is what finally gets agentic use cases into production."}, {"t": "Start small on ontology", "s": "Don't run a multi-million-dollar, five-year enterprise-wide ontology programme. Pick one domain — finance, marketing, ops — and three to five use cases, and accept that a 50-60% complete ontology humans then refine is enough to start."}, {"t": "Realistic AI coding expectations", "s": "No model can absorb 40 years of undocumented complexity across 46 interlinked systems, so scope AI to clearly bounded new development and keep legacy integration human. Done that way a 20-developer application team can realistically drop to 10 or fewer."}, {"t": "Four-layer ROI framework", "s": "Measure AI ROI per layer: infra/model is investment not return; AI-in-operations in time and effort (user stories per sprint); business-process agents in cycle time (claims from days to hours, 100/day to 400); customer-facing AI in NPS, CLTV and upsell."}, {"t": "Leadership and workforce mindset", "s": "He tells his team to be 'lazy' about coding — pride shifts from writing 15,000 lines a day to designing and planning while AI writes it. The hard part is leading a team spanning 0 to 40 years of experience and pivoting your worldview roughly weekly."}, {"t": "Sovereignty and investment", "s": "Sovereignty has two halves — owning frontier models and keeping data onshore — and forcing foreign labs to host data centres locally is only a stopgap. The real unlock is private-sector skin in the game, on roughly a five-year horizon."}, {"t": "Talent pipeline", "s": "Tech Mahindra pre-defines the curriculum for the final six months of state-government graduate programmes with a guaranteed hire at the end, a model he says industry must expand because graduates now need to arrive job-ready for tech that changes weekly."}]}, {"t": "From 75% Cost Overruns to AI-Native Infrastructure — Aurigo CEO Balaji Sreenivasan", "s": "Aurigo's CEO explains that 70-75% of large infrastructure programmes — highways, bridges, airports, water systems, data centres — overrun budget by 20-50%, so a $100m programme lands at $130-150m. His pitch is to charge just under 1% of capital spend for a roughly 95% chance of holding near the original number, and he lays out a concrete AI-competency ladder from prompting through agents that write agents.", "glance": "Roughly 70-75% of big infrastructure programmes overrun by 20-50%, so spending under 1% of capital budget on planning software is the cheapest available insurance.", "vid": "aLgmNdr97PI", "url": "https://www.youtube.com/watch?v=aLgmNdr97PI", "published": "2026-08-15T11:00:00+00:00", "src": "@aimmediahouse", "subject": "infrastructure AI", "pointsLabel": "Takeaways from the interview", "points": [{"t": "The cost-overrun problem", "s": "Large capital programmes overrun 20-50% of budget in about 70-75% of cases, so Aurigo charges slightly under 1% of capital improvement spend and manages the full 5-15 year lifecycle rather than just the three-year build."}, {"t": "AI competency ladder L0-L4", "s": "L0 is typing prompts (not a skill); L1 is project workspaces, orchestrated instructions and markdown context files so you don't re-prompt; L2 is writing agents that work unattended; L3/L4 is agents that write agents. Aurigo role-maps a required level per job and mandates at least L1 company-wide."}, {"t": "AI-native versus AI-powered", "s": "AI isn't what you add to software, it's where you add it. A real AI-native stack is data layer, context, system of record, business applications, then agents — bolting an agent onto a model with no data layer is vapourware."}, {"t": "Productivity gains without layoffs", "s": "Story points shipped rose about 4x in 12 months. Instead of shrinking the team, Aurigo redirected the freed capacity into new products and markets — energy, utilities and data centres."}, {"t": "Which roles AI actually replaces", "s": "Anything deterministic goes first: the project manager who only produces red/amber/green reports on 15 projects, and traditional manual software testing, which he expects to be a 'what was that?' role in 5-10 years."}, {"t": "The next market: white-collar labour", "s": "On a $100m programme software is about 1% of spend but white-collar labour is about 17%, of which 38-40% is deterministic — so a small forward-deployed team plus agents can do the work of 30-50 people."}, {"t": "India, sovereignty and talent", "s": "85% of the roughly $800bn global infrastructure spend is in the US, which is why Aurigo followed the money there. On sovereignty he advocates a middle path: keep leveraging strong foreign models while building IP and apps in India."}]}, {"t": "The movie industry is going to change forever", "s": "Bandyopadhyay predicts AI generation will push global film output from a few thousand titles a year to roughly 250,000-300,000, with tools letting one person specify characters, voices, music and cinematography for a full feature. His core argument is that star power was never the actor — it was thousands of crew, writers, lighting and score choices layered onto a person — so the same techniques can now be applied to entirely virtual leads.", "glance": "He argues on-screen star power was always manufactured by writers, lighting and score rather than the actor, so AI can transfer it to virtual leads and directing shifts toward psychology.", "vid": "MLIcxdzXRqQ", "url": "https://www.youtube.com/watch?v=MLIcxdzXRqQ", "published": "2026-08-15T13:00:00+00:00", "src": "@AnirbanBandyopadhyay", "subject": "AI filmmaking"}]}, {"h": "💼 Business, money & life", "items": [{"t": "The Bacardí Family: When A Country Takes Your Billions, and You Rebuild", "s": "The Bacardí family survived total expropriation because Pepín Bosch moved the irreplaceable assets — yeast cultures, formulas, records and master blenders — plus production to Mexico in 1931 and Puerto Rico in 1936, years before Castro nationalised everything in October 1960. Ownership is deliberately diluted so no relative holds more than about 3%, meaning no branch can force a sale; sixty years on the exiled company is bigger than the one seized, at $5.1bn revenue and 200+ brands.", "glance": "Bacardí survived losing everything because the irreplaceable yeast culture and key production had already been moved offshore years before the seizure came.", "vid": "aXNIgL1OQJY", "url": "https://www.youtube.com/watch?v=aXNIgL1OQJY", "published": "2026-08-15T15:15:00+00:00", "src": "@oldmoneyluxury", "subject": "family business survival", "pointsLabel": "Lessons for your own family business", "points": [{"t": "Move critical assets before you need to", "s": "Bosch relocated the yeast, formulas, records and key people quietly and gradually, because visible capital flight would have accelerated the seizure. Identify the one irreplaceable asset in your business and make sure it exists in more than one jurisdiction."}, {"t": "Structure ownership so no one can force a sale", "s": "Roughly 600 descendants own the company with no individual holding more than about 3%, deliberately diluted so no single branch can accumulate enough votes to force a sale — the single structural decision that has kept it private for 163 years."}, {"t": "Separate ownership from management", "s": "A family council plus a board of family members and independent professionals, with non-family CEOs running daily operations for decades. The best way to keep a business in the family is to keep the family out of the daily running of it."}, {"t": "Patient capital beats liquidity events", "s": "Grey Goose ($2bn, 2004), Dewar's and Bombay Sapphire ($5.1bn, 2008) and Patrón ($5.1bn, 2018) were funded from retained earnings and bank debt because shareholders kept voting to reinvest rather than cash out."}, {"t": "Diversify out of your founding category", "s": "The family was dangerously dependent on rum alone. Buying into vodka, gin, scotch and tequila bought instant credibility in categories where they had no heritage, and let them offer distributors a complete spirits programme from one supplier."}, {"t": "Own your brand legally everywhere", "s": "Trademarks were defended in every jurisdiction so Cuba could never sell rum as 'Bacardí' abroad. The separate Havana Club fight shows the flip side: a government can take your buildings, but the fight over the name can outlast the Cold War."}, {"t": "The generational risk that never goes away", "s": "Each generation means more shareholders holding smaller stakes with weaker ties to a distillery none of them will visit, while bankers call constantly. The emotional story is itself a governance tool."}]}, {"t": "What To Do With Your Life", "s": "Ali Abdaal argues 'what do I do with my life?' is unanswerable because it's the wrong-sized question. Break it into life areas — work, health, marriage, kids, hobbies, growth, home — and for each write what you want, what you explicitly do not want, and what feeling you're actually hunting for, before ever naming a job title. He adds the Odyssey Plan: describe your life in five years on your current path, on a completely different path, and on a path where money and others' opinions don't matter.", "glance": "Don't ask what to do with your life — per life area, write what you want, what you don't want, and the feeling you're chasing. Direction beats destination.", "vid": "fEMHMd7fovM", "url": "https://www.youtube.com/watch?v=fEMHMd7fovM", "published": "2026-08-15T14:00:00+00:00", "src": "@aliabdaal", "subject": "career clarity"}, {"t": "12 Years of BJP: Progress or Propaganda?", "s": "Think School stages a structured debate between Pradeep Bhandari (BJP) and Anish Gawande (NCP) across six pillars — education, healthcare, poverty, national security, infrastructure and economy. The video presents both ledgers: large gains in insurance coverage, highways, airports and enrolment against contested indicators on jobs, household savings, manufacturing share and social-sector spending, and says explicitly that the truth lies somewhere in between.", "glance": "The video presents 12 years of BJP rule as a two-sided ledger, pairing large gains in coverage and capacity against contested figures on jobs, savings and manufacturing share.", "vid": "0MDuF2Pn2TQ", "url": "https://www.youtube.com/watch?v=0MDuF2Pn2TQ", "published": "2026-08-15T06:00:00+00:00", "src": "@ThinkSchool", "subject": "Indian governance debate", "pointsLabel": "What each side argues", "points": [{"t": "The opposition's indicators", "s": "The video cites graduate youth unemployment at 25.9%, household savings at a 47-year low, real rural wages falling 0.6-1.4%, roughly 170 bridge collapses between 2022 and 2025, and Manipur with 217+ dead and around 58,000 still displaced."}, {"t": "The government's case", "s": "The BJP side argues that before 2014 around 80 crore people had no health insurance and 35-40% were below the poverty line, against 4 crore pucca houses built and ₹5 lakh health cover since, plus more than 2 lakh registered startups and 100+ unicorns."}, {"t": "Education", "s": "It cites higher-education gross enrolment rising from 23.7% to 30%, STEM enrolment up from about 90 lakh to over 1.5 crore and MBBS seats up roughly 1.5x — against education spending near 3% of GDP versus the 6% target set in 1968 and reaffirmed by NEP 2020."}, {"t": "Healthcare", "s": "Out-of-pocket health spend is cited as falling from 62% to 43%, insurance coverage rising from 19% to over 60% and maternal mortality falling from 130 to 88 — against the counter-argument that insurance is uneven where hospitals decline it and medical inflation has risen."}, {"t": "Manufacturing and jobs", "s": "The 2014 target of manufacturing reaching 25% of GDP by 2024 was missed, with the share falling from 16.7% to about 15.9% per World Bank data. The government side attributes much of the shortfall to COVID and geopolitical supply shocks."}, {"t": "Trade and investment", "s": "Exports are cited as roughly doubling from $466bn to about $860bn and per capita income doubling — against exports falling as a share of GDP to 22.1% from 25.4%, and reported FDI and FII outflows."}, {"t": "Closing arguments", "s": "Gawande concludes the core risk is a government that has started believing its own data and treats every failure as an exception; Bhandari concludes the government is imperfect but its intent is clean, and urges young viewers to build careers rather than judge by politics."}]}]}, {"h": "🚗 Gear, cars & practical", "items": [{"t": "How Do Car Brakes Work? Everything You Need to Know", "s": "Brakes split into a mechanical half — pads squeezing a rotor, or shoes pushed against a drum — and a hydraulic half of master cylinder, lines and caliper pistons that never needs opening for a pad change. The key maintenance point is that brake fluid has no fixed replacement interval: it is hygroscopic, so it should be tested with strips or a tool and changed when moisture or particles appear, because water-laden fluid rusts steel lines from the inside until they leak.", "glance": "Brake fluid has no set change interval — test it for moisture, because hygroscopic fluid corrodes steel lines from the inside until they leak, and fluid colour tells you nothing.", "vid": "VOELpwGZQCY", "url": "https://www.youtube.com/watch?v=VOELpwGZQCY", "published": "2026-08-15T15:45:00+00:00", "src": "@TheCarCareNut", "subject": "car maintenance"}, {"t": "Mahindra Scorpio Lifestyler Pickup Walkaround", "s": "Mahindra's newly unveiled Scorpio Lifestyler pickup rides on a next-generation ladder frame — not the current one — with a measured wheelbase of roughly 3.2-3.3m, longer than any Mahindra so far, plus 2.2L petrol and diesel options, rear leaf springs, 255/65 R18 highway-terrain tyres, front and rear ADAS radar and Mahindra's first vertical touchscreen. The exterior is production-final; the interior shown is not. Launch is April 2027.", "glance": "Mahindra's Scorpio Lifestyler pickup lands April 2027 on an all-new longer ladder frame (~3.2-3.3m wheelbase), with leaf springs, ADAS radar and Mahindra's first vertical screen.", "vid": "UgBecfpCKUI", "url": "https://www.youtube.com/watch?v=UgBecfpCKUI", "published": "2026-08-15T05:00:00+00:00", "src": "@GaganChoudhary", "subject": "Mahindra pickup preview", "pointsLabel": "What was shown", "points": [{"t": "What is and isn't final", "s": "Exterior panels, lights and design are production-final (only fit and finish is rough on these pre-production units), but the interior shown is Scorpio N's and will change entirely. The accessorised trucks parked behind are concepts only."}, {"t": "Platform and hardware", "s": "Next-generation ladder frame with a wheelbase around 3.2-3.3m, rear leaf springs for heavy load, rear disc brakes, 255/65 R18 road-biased tyres, a steel spare, towing hooks and 2.2L petrol and diesel engines tuned to suit lower-emission-norm export markets too."}, {"t": "Tech and features", "s": "Front and rear ADAS radar, 360-degree camera, rain sensor, rear defogger, parking sensors, a small sunroof, and Mahindra's first vertical infotainment screen with a Snapdragon-powered digital cluster and V2X."}, {"t": "Positioning", "s": "Development took input from South African and Australian customers and it will sell there too. Unlike the rugged Scorpio Getaway export pickup, this one deliberately blends lifestyle with ruggedness; Mahindra hasn't published a payload figure."}, {"t": "Buyer advice", "s": "He uses the rough panel gaps to make the case for pre-delivery inspection: an independent PDI is every buyer's right and cannot be refused by a dealer."}]}, {"t": "7 Value For Money Phones from ₹15,000 to ₹50,000", "s": "Beebom's price-band picks for August 2026, with the recurring caveat that budget specs have regressed — ₹15-20k now typically means a 720p IPS panel, 4GB RAM and chips that once sold under ₹10k, leaving the Samsung M36 at ₹19,999 as effectively the only defensible choice there. Above ₹30k most picks are strong on chipset, battery and display but weak on cameras, with the Samsung S25 FE at about ₹48,000 the exception thanks to a telephoto lens and long software support.", "glance": "Indian budget phones regressed in 2026 — under ₹20,000 usually means 720p and 4GB RAM, leaving Samsung's M36 at ₹19,999 as roughly the only worthwhile pick.", "vid": "gSET7Mpf2rE", "url": "https://www.youtube.com/watch?v=gSET7Mpf2rE", "published": "2026-08-15T11:24:00+00:00", "src": "@beebomco", "subject": "India phone buying", "pointsLabel": "Pick by price band", "points": [{"t": "₹15,000-20,000", "s": "The segment has degraded to 720p IPS panels and 4GB RAM. The Samsung Galaxy M36 at ₹19,999 is the exception with a full-HD+ AMOLED, 6GB RAM, OIS main camera, 4K video and five years of OS updates left — but no stereo speakers and no bundled charger."}, {"t": "₹20,000-25,000", "s": "The Realme P4 (6GB/128GB, ₹24,499) leads on performance with UFS 3.1 storage, a big fast-charging battery and IP66; turn off the over-sharpened display setting. The Oppo K13 is the cheaper fallback."}, {"t": "₹25,000-30,000", "s": "The Realme P4 Pro at ₹28,999 pairs a 1.5K AMOLED, Snapdragon chip and UFS 3.1 with OIS and 4K60 video, but ships with bloatware and a quad-curved screen. The Moto S70 Fusion trades performance for better cameras."}, {"t": "Under ₹35,000", "s": "The Oppo K13 Turbo at ₹30,999 is now below launch price — a gaming-focused phone with a Snapdragon 8-series chip, UFS 4.0, built-in cooling fans and a flat 1.5K AMOLED, but only one OS update remaining."}, {"t": "Under ₹40,000", "s": "The Poco X8 Pro at ₹36,999 is the only 2026-launched pick: 6.59-inch 1.5K AMOLED, Dimensity 8500 Ultra with UFS 4.1, HyperOS 3 on Android 16 and four years of updates, with cameras the weak point."}, {"t": "Around ₹45,000-50,000", "s": "The Poco X8 Pro Max at ₹44,999 brings a 9,000mAh battery with 100W charging; the OnePlus Nord 6 offers the best battery life. The Samsung Galaxy S25 FE at about ₹48,000 is the pick for its LTPO AMOLED, full telephoto camera set and long support."}]}]}, {"h": "🧘 Mind & presence", "items": [{"t": "Are You Creating Your Own Suffering?", "s": "Answering a questioner two weeks after a breakup, Spira argues that nothing in the present circumstance is doing anything to him — the suffering is generated entirely by the thought 'I don't like what's happening', a habit by which the separate self keeps itself alive in past and future because it cannot survive in the now. He then walks through inquiry into the 'I' that is aware: thoughts, body and perceptions are all objects of experience, while awareness is the one unchanging constant.", "glance": "Your circumstances aren't hurting you; the single thought 'I don't like what's happening' is, and it can be dropped now rather than endured for six months.", "vid": "-DK97XKxNOM", "url": "https://www.youtube.com/watch?v=-DK97XKxNOM", "published": "2026-08-15T14:00:00+00:00", "src": "@rupertspira", "subject": "suffering and self-inquiry"}, {"t": "7 Tools for Staying Present", "s": "E argues presence isn't achieved by deleting apps or moving to a cabin — that's absence — and instead reviews seven tools that save time, remember things for you, or filter noise without costing you the person in front of you: Even Realities G2 glasses with the R1 ring, the Hey email Screener, CleanMyMac's AI assistant, the 0.4oz Memokit recorder, WhisperFlow dictation, the Withings ScanWatch Nova, and his own free writing app rebuilt with pinned notes.", "glance": "Presence isn't won by removing technology but by choosing tools that hand time back and filter noise without ever pulling attention off the person in front of you.", "vid": "kLq_qWXf_LE", "url": "https://www.youtube.com/watch?v=kLq_qWXf_LE", "published": "2026-08-15T14:00:00+00:00", "src": "@ThisIsE", "subject": "presence-preserving tech"}, {"t": "What it Really Means to Awaken Your Inner Fire", "s": "Satya reframes kundalini or 'inner fire' as the waking of a singular, one-pointed identity rather than the result of technique — a flowing energy that burns off inherited social burdens without justification or logic, which is why teachings built only on ideas fail, since 'ideas are dead pictures'. He pairs this with Ramana-style inquiry: when caught in a story about why someone did what they did, ask who is the one having the problem.", "glance": "Inner fire is a singular one-pointed intention actually burning, not a technique or an idea — and ideas alone can never dissolve what only flowing energy burns through.", "vid": "ip_GIjLRjDQ", "url": "https://www.youtube.com/watch?v=ip_GIjLRjDQ", "published": "2026-08-15T04:30:00+00:00", "src": "@Satya_Speaks", "subject": "kundalini and inner fire", "short": true}]}]}, "costs": {"updated": "2026-08-16T01:42:11+00:00", "items": [{"key": "usdinr", "label": "USD/INR", "unit": "INR", "value": 95.43, "delta": -0.01, "delta_pct": -0.0105, "dir": "down", "asof": "2026-08-14", "src": "Frankfurter (ECB ref)", "url": "https://www.frankfurter.app/", "stale": false}, {"key": "brent", "label": "Brent crude", "unit": "USD/bbl", "value": 88.52, "delta": 1.45, "delta_pct": 1.67, "dir": "up", "asof": "2026-08-16", "src": "Markets Insider (indication)", "url": "https://markets.businessinsider.com/commodities/oil-price?type=brent", "stale": false, "note": "Intraday delayed indication (~15 min), not settlement"}, {"key": "lead", "label": "Lead (LME cash)", "unit": "USD/tonne", "value": 1846.0, "delta": -10.0, "delta_pct": -0.5388, "dir": "down", "asof": "2026-08-14", "src": "Westmetall (LME official)", "url": "https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Pb_cash", "stale": false, "note": "LME official cash settlement, ~1 business-day lag"}, {"key": "lithium", "label": "Lithium (LIT ETF proxy)", "unit": "USD/share", "value": 75.23, "delta": 0.57, "delta_pct": 0.76, "dir": "up", "asof": "2026-08-13", "src": "Nasdaq (LIT ETF)", "url": "https://api.nasdaq.com/api/quote/LIT/info?assetclass=etf", "stale": false, "note": "PROXY: lithium/battery ETF, NOT Li2CO3 spot.   let s=Math.floor((Date.now()-d.getTime())/1000); if(s<0)s=0;

  if(s<3600){const n=Math.floor(s/60);return n+" min"+(n>1?"s":"")+" ago";}
  if(s<86400){const n=Math.floor(s/3600);return n+" hour"+(n>1?"s":"")+" ago";}
  const days=Math.floor(s/86400);
