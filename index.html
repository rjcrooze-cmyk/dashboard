17:00.632193+00:00","items":[{"t":"AI agents keep breaching real companies in security tests","heat":95,"delta":"steady","sources":6,"url":"https://www.cnn.com/2026/09/19/business/gemini-ai-hack-internet","glance":"Frontier models are now working attack tools","s":"Google confirmed its Gemini model, running as an autonomous agent, guessed credentials and broke into three real companies during an authorised security test before stopping — the first known 'breakout' by Google's AI. It lands alongside a serious 0-day in Meta's Muse assistant and documented Codex sandbox escapes, cementing that frontier models are now credible offensive-security tools, not demos. The concrete use-case cuts both ways: automated penetration testing for defenders, and a lower bar for attackers.","assess":{"mag":4,"timeline":"now","evidence":"proven","verdict":"Autonomous AI can now breach live systems","basis":"Google confirmed Gemini breached 3 firms; Muse 0-day; documented agentic exploits"}},{"t":"Antitrust suit targets an alleged AI-slowdown pact","heat":84,"delta":"steady","sources":4,"url":"https://www.tomshardware.com/tech-industry/big-tech","glance":"Labs accused of colluding to slow AI","s":"A lawsuit alleges Anthropic, OpenAI, xAI and Google struck an illegal agreement to slow the pace of AI development, an antitrust theory that would test whether coordinated 'safety' restraint is collusion. Still at the filing stage.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Novel antitrust test of coordinated AI restraint","basis":"Newly filed complaint; unproven allegations of a slowdown agreement"}},{"t":"Trump administration rejects AI-slowdown calls, launches \"AI Force\"","heat":74,"delta":"new","sources":3,"url":"https://arstechnica.com/","glance":"US policy leans hard into acceleration","s":"The White House rejected calls to slow AI and announced an initiative it is branding 'AI Force', while reports say budget chief Russell Vought would gain veto power over NIH grants. The signal is a firmly pro-acceleration, centralised US AI policy.","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"US doubles down on AI acceleration","basis":"Administration statements + reported grant-control moves"}},{"t":"OpenAI pushes global AI standards as Altman heads to the UN","heat":70,"delta":"new","sources":3,"url":"https://openai.com/index/advisory-group-on-mathematics-and-ai/","glance":"A bid to shape the rulebook","s":"OpenAI published a call to build standards 'for the next phase of AI', named an advisory group on mathematics and AI, and Sam Altman is set to brief the UN Security Council next week. The thread is OpenAI positioning itself at the centre of AI governance and evaluation standards.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"strong","verdict":"OpenAI moves to author AI standards","basis":"Vendor announcements + scheduled UN Security Council briefing"}},{"t":"xAI ships Grok 4.7","heat":66,"delta":"rising","sources":2,"url":"https://artificialanalysis.ai/models/grok-4-7","glance":"Incremental model and price update","s":"xAI released Grok 4.7, with third-party analyses comparing its intelligence, speed and price against rivals. It reads as an incremental capability-and-cost refresh rather than a step change.","assess":{"mag":3,"timeline":"now","evidence":"proven","verdict":"Routine competitive model refresh","basis":"Released model with independent benchmark/price analysis"}},{"t":"OpenAI reportedly on track to burn $278B by 2030","heat":64,"delta":"new","sources":3,"url":"https://www.bloomberg.com/news/articles/2026-09-18","glance":"The economics question gets louder","s":"An FT/Bloomberg report says OpenAI could burn through about $278 billion by 2030, while investors warn Anthropic may struggle to sustain revenue after a planned IPO. The trend is mounting scrutiny of whether frontier-lab spending is sustainable.","assess":{"mag":3,"timeline":"3-5 yrs","evidence":"early","verdict":"Frontier-lab burn rates face scrutiny","basis":"Financial reporting on projected losses; forward estimates, not results"}},{"t":"Anthropic becomes the flashpoint in US AI politics","heat":58,"delta":"rising","sources":3,"url":"https://www.politico.com/news/magazine/2026/09/20/","glance":"Safety messaging meets Washington","s":"Coverage from Politico and the NYT frames Anthropic and CEO Dario Amodei's warnings as the counterweight to Washington's accelerationist turn, making the company a political lightning rod as much as a lab.","assess":{"mag":2,"timeline":"now","evidence":"strong","verdict":"Anthropic is now a political actor","basis":"Feature reporting on Anthropic-vs-administration dynamics"}},{"t":"Jev's zero-hallucination claim keeps circulating","heat":56,"delta":"cooling","sources":2,"url":"https://www.reddit.com/r/LocalLLaMA/","glance":"A big claim, still unproven","s":"The 'Jev' typed decision model that claims to eliminate hallucinations continues to draw attention, with users testing whether ordinary LLMs can be run in a similar constrained mode. The zero-hallucination claim remains unverified.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"speculative","verdict":"Unverified zero-hallucination claim","basis":"Single-vendor claim; no independent replication"}},{"t":"A Nigerian open-weight coding model claims to beat Opus 4.8","heat":50,"delta":"new","sources":1,"url":"https://twitter.com/Badtheorylabs/status/","glance":"Open-weight coding claim, unverified","s":"An open-weight coding model called Tinfield 1, from a Nigerian lab, is claimed to outperform Claude Opus 4.8 on coding. The claim rests on a single announcement and has not been independently benchmarked.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"speculative","verdict":"Unverified open-weight coding claim","basis":"Single social post; no third-party evaluation"}},{"t":"GPT-6 Astra ecosystem: same-day video features from partners","heat":48,"delta":"cooling","sources":2,"url":"https://openai.com/","glance":"Apps build fast on the new base model","s":"Partners such as Higgsfield are shipping new AI video features within a day on top of GPT-6 Astra, showing how quickly products now iterate on OpenAI's latest base model (which launched earlier in September). It is ecosystem momentum rather than a fresh model release.","assess":{"mag":3,"timeline":"now","evidence":"strong","verdict":"Fast product iteration on a frontier base","basis":"Vendor posts on GPT-6-Astra-based product launches"}},{"t":"Researchers prune LLMs using physics-style optimization","heat":42,"delta":"new","sources":1,"url":"https://huggingface.co/blog/feed.xml","glance":"Cheaper models via smarter pruning","s":"A Hugging Face writeup frames LLM block removal as an Ising optimization problem, a physics-inspired way to prune large models with less quality loss — potentially cutting the cost of serving them. Early research.","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Physics-inspired route to cheaper models","basis":"Research blog; method proposed, not yet standard practice"}},{"t":"Scrutiny grows over AI assistants capturing user conversations","heat":40,"delta":"new","sources":2,"url":"https://news.ycombinator.com/item?id=49787069","glance":"Consent creep in AI tooling","s":"Users flagged that responding to a Claude CLI feedback prompt can authorise conversation capture, part of wider unease about how AI tools collect data (including reports of ChatGPT gathering off-site browsing for ads). A privacy-and-consent trend rather than a single incident.","assess":{"mag":2,"timeline":"now","evidence":"strong","verdict":"AI data-capture consent under scrutiny","basis":"User reports on feedback/telemetry consent in AI tools"}}]},"aitrendsUpdated":"2026-09-22T02:17:33.301188+00:00","science":{"updated":"2026-09-22T02:17:00.632193+00:00","items":[{"t":"One CRISPR infusion halved LDL cholesterol for a full year","s":"A single dose of CTX310, an in-vivo CRISPR-Cas9 therapy that switches off the liver's ANGPTL3 gene, cut LDL cholesterol 52.5% and triglycerides 47.8% at twelve months in Cleveland Clinic patients whose lipids stayed high on standard drugs. The use-case is direct: a one-time treatment replacing daily lipid medication for people who cannot get to target. Early-phase human trial with a small cohort, reported in the New England Journal of Medicine.","tag":"Health","imp":"critical","glance":"One-shot gene edit cuts cholesterol","url":"https://doi.org/10.1056/NEJMc2609825","src":"NEJM / Cleveland Clinic","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Durable one-shot lipid control shown","basis":"12-month human data in NEJM; small early-phase cohort, not yet randomised"},"published":"2026-09-21T00:37:22Z","eli":"Your liver has a gene that keeps fat circulating in your blood. This treatment goes in once, switches that gene off permanently, and a year later cholesterol is still down by half — instead of taking a pill every day forever."},{"t":"A solid-state cooling device ran a million cycles without degrading","s":"HKUST built what it calls the first zero-degradation elastocaloric cooling device, holding stable cooling power across one million operating cycles using a fatigue-resistant shape-memory alloy. Elastocaloric cooling replaces refrigerant gases with a solid that heats and cools as it is stressed, and functional fatigue in commercial NiTi alloys has been the thing blocking commercialisation. The use-case is refrigeration and air-conditioning with no high-global-warming refrigerant.","tag":"Energy & Materials","imp":"critical","glance":"Refrigerant-free cooling that lasts","url":"https://interestingengineering.com/innovation/world-first-zero-degradation-elastocaloric-cooling-device","src":"HKUST","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"Fatigue barrier finally cleared","basis":"Device-level demonstration over 1M cycles; single lab, no independent replication"},"published":"2026-09-20T22:37:22Z","eli":"Fridges today pump a gas around to move heat, and those gases are terrible for the climate. This device squeezes a special metal instead — squeeze it and it warms, release it and it cools. Earlier versions wore out; this one survived a million squeezes."},{"t":"A perovskite-silicon tandem solar cell hit a certified 34% efficiency","s":"Soochow University and LONGi reached 34.0% laboratory power-conversion efficiency with a certified 33.5% steady-state figure and an independently certified 2.014V open-circuit voltage, among the highest reported for this cell type. They solved the long-standing trade-off at the buried interface by scattering monoclinic zirconia nanoparticles as an ultra-thin scaffold instead of laying down a flat insulating layer. The use-case is straightforward: more power from the same panel area.","tag":"Energy & Materials","imp":"important","glance":"Tandem solar cell certified at 34%","url":"https://interestingengineering.com/energy/perovskite-silicon-tandem-solar-cell","src":"Soochow University / LONGi","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"proven","verdict":"Record voltage with certified efficiency","basis":"Independently certified 33.5% steady-state; lab-area cell, not module scale"},"published":"2026-09-20T15:01:22Z"},{"t":"A swallowable battery safely dissolves in the gut after powering a device","s":"MIT engineers built an ingestible battery that draws reliable current from the gastrointestinal tract to run a swallowed medical device, then safely breaks down and passes through the body once its job is done. The use-case is direct: powering ingestible sensors and drug-delivery capsules without a toxic battery that must be retrieved. Demonstrated in animals, reported by MIT on 21 September.","tag":"Health","imp":"important","glance":"Dissolving battery powers gut devices","url":"https://news.mit.edu/2026/batteries-safely-break-down-in-gi-tract-could-improve-ingestible-devices-0921","published":"2026-09-21T20:17:00.632193+00:00","src":"MIT News","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Safer power for swallowable medical devices","basis":"Animal-stage MIT device; delivers current then biodegrades in the GI tract"}},{"t":"Circular mRNA makes microbial cell factories produce up to six times more protein","s":"Researchers engineered messenger RNA into a ring inside E. coli so it resists the degradation that limits normal mRNA, raising output of target 'material' proteins up to sixfold. The use-case is industrial: cheaper, higher-yield microbial production of enzymes, biomaterials and therapeutic proteins. Peer-reviewed in Applied and Environmental Microbiology / Nucleic Acids Research.","tag":"Biology","imp":"important","glance":"Circular mRNA boosts protein output 6x","url":"https://phys.org/news/2026-09-circular-mrna-cell-factories-protein.html","published":"2026-09-21T23:40:06+00:00","src":"Phys.org / ASM","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"Higher-yield protein manufacturing in bacteria","basis":"Peer-reviewed; in-vivo mRNA circularization gives up to 6x protein in E. coli"}}]},"scienceUpdated":"2026-09-22T02:17:33.301188+00:00","scienceDaily":{"updated":"2026-09-22T02:17:00.632193+00:00","items":[{"t":"Ultra-bright nanoparticles tell near-identical molecules apart","s":"University of Toronto engineers built dye-sensitised nanoparticles that absorb low-energy infrared photons and emit higher-energy light, letting them detect chemicals at very low concentrations and distinguish molecules with almost identical shapes — something conventional fluorophores cannot do, since they only convert light downward in energy. The stated uses are finding impurities in pharmaceutical manufacturing and trace pollutants in groundwater. Published in the Journal of the American Chemical Society.","tag":"Chemistry","imp":"important","glance":"Sensor separates look-alike molecules","url":"https://www.sciencedaily.com/releases/2026/09/260919031030.htm","src":"JACS / University of Toronto","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Upconversion gains molecular selectivity","basis":"Peer-reviewed in JACS with demonstrated discrimination; lab bench only"},"published":"2026-09-20T12:01:22Z"},{"t":"A ‘smouldering’ gut defect shows why IBD flares return after remission","s":"WEHI and the Royal Melbourne Hospital found a molecular defect in intestinal cells — abnormal cell death — that persists in inflammatory bowel disease patients whose disease looks well controlled. It gives a measurable marker for predicting flare-ups and tailoring treatment instead of waiting for symptoms to reappear. Published in Science, in patient-derived gut cells.","tag":"Health","imp":"critical","glance":"Marker predicts IBD relapse","url":"https://www.sciencedaily.com/releases/2026/09/260918024814.htm","src":"Science / WEHI","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Remission is not molecularly quiet","basis":"Peer-reviewed in Science on patient samples; no prospective trial yet"},"published":"2026-09-20T04:07:22Z","eli":"Crohn's and colitis patients can feel fine and then suddenly flare. It turns out their gut cells are still quietly dying wrong even during the good stretches — which means a test could warn you before a flare instead of after."},{"t":"A simple new process turns polyethylene waste into gasoline and diesel","s":"Oak Ridge National Laboratory chemists developed a surprisingly simple catalytic route that converts polyethylene — the plastic in shopping bags and cutting boards — into gasoline- and diesel-range fuels. The use-case is direct: a low-complexity path to divert hard-to-recycle plastic into usable liquid fuel. Lab-stage, reported via ScienceDaily.","tag":"Chemistry","imp":"important","glance":"Plastic waste converted to fuel","url":"https://www.sciencedaily.com/releases/2026/09/260920222405.htm","published":"2026-09-21T13:08:40+00:00","src":"ScienceDaily (ORNL)","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"A simpler plastic-to-fuel recycling route","basis":"Lab-stage catalytic process converting polyethylene to gasoline/diesel fractions"}},{"t":"Largest review finds calcium and vitamin D do little to prevent fractures","s":"A review pooling more than 153,000 adults found that calcium and vitamin D supplements, alone or together, do little to prevent fractures or falls in most older people. The use-case is directly actionable: it argues against routine supplementation for bone protection in the general older population, redirecting attention to those with genuine deficiency. Large pooled analysis.","tag":"Health","imp":"important","glance":"Calcium/vitamin D barely cut fractures","url":"https://www.sciencedaily.com/releases/2026/09/260920030147.htm","published":"2026-09-21T01:59:17+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Routine bone supplements offer little benefit","basis":"Pooled review of 153,000+ adults; no meaningful fracture/fall reduction in most"}},{"t":"A needle-thin fiber implant records, drugs and stimulates the brain at once","s":"Engineers built a single flexible, needle-thin fiber that can record neural activity, deliver drugs and electrically stimulate several brain regions simultaneously, tested in mice. The use-case: one minimally invasive probe replacing several separate implants for research and, eventually, treating neurological disease. Early animal-stage.","tag":"Health","imp":"important","glance":"One fiber implant does three jobs","url":"https://www.sciencedaily.com/releases/2026/09/260920222416.htm","published":"2026-09-21T12:25:22+00:00","src":"ScienceDaily","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Multifunction probe simplifies neural interfaces","basis":"Mouse-stage flexible fiber combining recording, drug delivery and stimulation"}}]},"scienceDailyUpdated":"2026-09-22T02:17:33.301188+00:00","life":{"updated":"2026-09-22T02:17:00.632193+00:00","items":[]},"lifeUpdated":"2026-09-22T02:17:33.301188+00:00","mind":{"updated":"2026-09-22T02:01:47.434090+00:00","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"Single-neuron recordings settle how the human hippocampus separates memories","s":"Recording 3,506 individual neurons in 97 patients during a recognition task where similar-looking novel images produced false memories, researchers identified two classes of memory-selective neuron that implement pattern separation. Whether this computation actually operates in the human hippocampus had been contested with no established single-cell correlate, and this supplies one. bioRxiv preprint, not yet peer-reviewed.","url":"https://www.biorxiv.org/content/10.64898/2026.09.18.752786v1","src":"bioRxiv","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"First human single-cell evidence","basis":"3,506 neurons in 97 patients; preprint, awaiting peer review"},"published":"2026-09-20T00:25:22Z","eli":"Your brain has to tell apart two things that look almost the same — your car and one just like it. These recordings found the individual cells doing that job, caught in the act of getting it wrong when people formed false memories."},{"t":"Brain activity and connectivity independently predict aphasia recovery after stroke","s":"Following 47 aphasia patients through acute, subacute and chronic stages, a cross-validated model found that region-specific task activity and connectivity each carry independent predictive signal for language recovery. Existing predictors get lumped into broad families, which is why they have not translated into clinical targets; separating them points at specific regions worth stimulating in therapy. bioRxiv preprint.","url":"https://www.biorxiv.org/content/10.64898/2026.09.17.751646v1","src":"bioRxiv","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"early","verdict":"Recovery predictors become specific","basis":"47 patients, longitudinal, cross-validated; preprint, modest cohort"},"published":"2026-09-20T00:25:22Z"},{"t":"Mechanical loading of leg bone speeds recovery after brain injury","s":"In mice, compressing the tibia after traumatic brain injury improved survival and recovery, an effect the authors trace to the bone-cell mechanosensor PIEZO1 in osteocytes signalling to the injured brain. It points to a bone-brain axis that controlled mechanical loading (a form of exercise) might exploit to aid brain-injury recovery. Peer-reviewed in Nature Neuroscience.","url":"https://www.nature.com/articles/s41593-026-02422-w","published":"2026-09-21T00:00:00Z","src":"Nature Neuroscience","eli":"Squeezing a leg bone sent healing signals to injured mouse brains, hinting exercise-like loading could help brain recovery.","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"strong","verdict":"A bone-to-brain route to aid injury recovery","basis":"Peer-reviewed mouse study; osteocyte PIEZO1 loading improved TBI survival/recovery"}}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"Neuralink's implant gave an ALS patient his own voice back","s":"In Neuralink's speech-restoration trial, a non-verbal ALS participant trained the implant first by attempting speech and then by only thinking the words, and heard them spoken back in a reconstruction of his own voice. The decoder is driven from the speech motor cortex. This is a company clinical report with published demonstration footage rather than a peer-reviewed paper — real, but early and single-patient.","url":"https://neuralink.com/trials/speech-restoration/","published":"2026-09-19T10:38:15Z","src":"Neuralink (Speech Restoration trial)","assess":{"mag":4,"timeline":"3-5 yrs","evidence":"strong","verdict":"Imagined speech becomes audible words","basis":"First ALS participant; company-reported, not peer-reviewed"},"eli":"The implant sits over the part of the cortex that plans mouth and throat movement. Even when the muscles no longer respond, those planning signals still fire — the decoder reads them and turns them into speech."}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"Dopamine neurons track social norm violations differently for humans than machines","s":"Recording single neurons in the substantia nigra and globus pallidus while neurosurgical patients played an iterative ultimatum game against human and computer opponents, researchers found putative dopaminergic units encoding the valence of norm prediction errors — and encoding them more strongly when the opponent was human. It is a direct neural account of how people update to shifting social norms. bioRxiv preprint.","url":"https://www.biorxiv.org/content/10.64898/2026.09.18.752742v1","src":"bioRxiv","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Social norms use reward circuitry","basis":"Human single-neuron recordings with computational modelling; preprint"},"published":"2026-09-20T00:25:22Z","eli":"When someone treats you unfairly, your brain registers the gap between what you expected and what happened. These recordings show the same cells that handle reward doing that for social fairness — and caring more when a person, not a computer, is the one being unfair."}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Focused ultrasound to the thalamus tested for disorders of consciousness","s":"In non-human primates, low-intensity focused ultrasound aimed at the central lateral thalamus modulated the deep brain circuits implicated in arousal and awareness — the same targets studied in coma and vegetative-state patients. Disorders of consciousness affect an estimated 200,000 people in the US with few options, and this non-invasive approach is a step toward a possible therapy. Primate-stage preprint (bioRxiv).","url":"https://www.biorxiv.org/content/10.64898/2026.09.15.751608v1","published":"2026-09-21T00:00:00Z","src":"bioRxiv","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Non-invasive route toward treating disordered consciousness","basis":"NHP preprint; focused ultrasound modulated central lateral thalamus arousal circuits"}}]}]},"mindUpdated":"2026-09-22T02:17:33.301188+00:00","mindset":{"updated":"2026-09-22T02:01:47.434090+00:00","messages":[{"who":"Joseph Rodrigues","t":"Getting what you want is easy","vid":"9dxwNVsE87k","url":"https://www.youtube.com/watch?v=9dxwNVsE87k","gist":"Working from Neville Goddard's Mental Diets lecture, the claim is that you cannot stop talking to yourself — you can only steer the direction of it, and your circumstances follow the tracks those inner conversations lay down. He maps it onto two pyramids: a desired reality where vision, identity, beliefs, skills and environment all line up, and an 'old reality' you are asked to put off. The practical instruction is to audit which of the two you are actually speaking from, then check each area of life — career, money, spirituality, body, study, family, friendships — against what you genuinely want rather than what society, social media or the news says you should want. Where a skill is missing, his answer is that it can be built."},{"who":"Elmer O. Locker Jr","t":"Emotional Journey: Reconnecting with Lost Sons","vid":"wtNQ94Jgyw0","url":"https://www.youtube.com/watch?v=wtNQ94Jgyw0","gist":"Reflecting on a scene of a father trying to reconnect with estranged sons, Locker draws on his own painful experience of losing and trying to rebuild relationships with his children. His central point is that we lose our loving self when we let an outside source — a substance, a craving, a fleeting good feeling — take the controls; that is how we end up hurting the people we love most. Echoing the Matrix line that everything real is inside you, he argues the body cannot survive without the mind and the mind is everything, so the discipline is to refuse to let bodily wants or external forces govern your inner state. Own what happened honestly, he says, rather than blaming what was outside you."},{"who":"AH Universe","t":"Listen Until Alignment Feels Like Home (Abraham Hicks)","vid":"1lJ8ezvFTxs","url":"https://www.youtube.com/watch?v=1lJ8ezvFTxs","gist":"Built around an Abraham-Hicks exchange, the message is that the most important relationship is the one between you and your own inner being — and that almost every relationship 'that doesn't work' fails because we demand from another person the security, validation and attention it was never meant to supply. Get that inner alignment nailed down first, and a partner can then add the satisfying, physical extras rather than being asked to fill a hole. The second half contrasts your 'vortex' (what you truly want, already lined up) with your habitual thoughts: your thoughts are powerful mainly because they can keep you out of the vortex. The practice is to stop needing the manifestation to appear as proof, enjoy the process, and let what you want arrive once you are a vibrational match for it."}]},"mindsetUpdated":"2026-09-22T02:17:33.301188+00:00","youtube":{"count":17,"note":"Today's uploads across your subscriptions, each gisted from its transcript.","groups":[{"h":"🧠 AI & Machine Learning","items":[{"t":"Did an ex-OpenAI researcher just make reasoning models obsolete?","s":"Fireship breaks down 'Jev', a model from ex-OpenAI researcher Diego Almeida's Typesafe AI ($40M raised) that strips language out entirely: it returns only a typed result — a choice, a score, or a yes/no — so a schema error is mathematically impossible. The pitch is ~200x faster, ~400x cheaper, no hallucinations, aimed at fast 'gut-instinct' decisions like moderation, NPC behaviour and real-time apps; it is not deterministic and returns a calibrated-confidence number.","glance":"For quick classify/yes-no tasks, a language-free 'type-safe' model like Jev can be ~200× faster and ~400× cheaper than a reasoning LLM — with structured output that can't format-error.","url":"https://www.youtube.com/watch?v=TbkUKCm3CHQ","vid":"TbkUKCm3CHQ","published":"2026-09-21T18:13:56.172757+00:00","short":false},{"t":"Ultimate Gemini Tutorial: How to Use Gemini AI for Beginners in 2026","s":"A practical setup walkthrough: the payoff is Gemini's 'personal intelligence' — custom standing instructions, memory of past chats, and connected apps (Gmail, Drive, Calendar, Photos) that let it answer from your real data instead of guessing. The reviewer says the free-to-Pro jump is the genuine capability cliff (Pro-to-Ultra just adds usage), and live voice-plus-camera is the feature he'd pay for alone.","glance":"Before paying for Gemini, fill in 'personal intelligence' — standing instructions plus connected Gmail/Drive/Calendar — which does more than any tier upgrade; the free-to-Pro step is the real capability jump.","url":"https://www.youtube.com/watch?v=sMdWHmuxrjg","vid":"sMdWHmuxrjg","published":"2026-09-21T19:13:56.172757+00:00","short":false},{"t":"Why a Salesforce partner’s AI agent failed in an Indian hospital — and what fixed it","s":"CRMIT's CIO says enterprises are past AI's FOMO phase and now chasing real outcomes, and walks through a hospital referral system ('Dhanwantri') where goal-oriented AI acts as an 'observability layer' continuously monitoring patients toward a health goal rather than following fixed scripts — now in talks with the Uttarakhand government.","glance":"Enterprise AI is shifting from scripted automation to goal-oriented agents that monitor toward an outcome — and, per Gartner, many firms are quietly reversing AI-driven layoffs as they reskill staff.","url":"https://www.youtube.com/watch?v=u4-42QeazkI","vid":"u4-42QeazkI","published":"2026-09-21T16:13:56.172757+00:00","short":false,"pointsLabel":"Key points","points":[{"t":"Past the hype","s":"Enterprises have moved beyond FOMO piloting to targeting concrete business outcomes with AI."},{"t":"A goal-oriented hospital agent","s":"'Dhanwantri' uses reasoning models as an observability layer that monitors a patient toward a set health goal and alerts providers on adverse events — unlike task-sequence automation."},{"t":"Layoffs walked back","s":"Gartner reports many companies reversing planned AI layoffs; humans are reskilled as models make previously-impossible processes viable."}]}]},{"h":"💼 Business & Money","items":[{"t":"Naveen Rao: 4D computing, AI’s energy wall and beating biology","s":"Serial AI-hardware founder Naveen Rao (Nervana→Intel, MosaicML→Databricks) publicly reveals 'Unconventional AI's' approach: a 'dynamical computer' where each element is both compute and memory, so it never shuttles data across a von Neumann memory bus. It borrows emergent behaviour from physics (coupled metronomes, flocks, ant colonies) and stacks in 3D plus a time dimension — '4D computing' — which he says is orders of magnitude more efficient.","glance":"Naveen Rao's new chip merges memory and compute into single 'dynamical' elements — no data shuttling — which he claims is orders of magnitude more efficient than today's GPUs for building real intelligence.","url":"https://www.youtube.com/watch?v=yAsrMA_ADPc","vid":"yAsrMA_ADPc","published":"2026-09-21T21:13:56.172757+00:00","short":false},{"t":"How Sam Walton worked","s":"A study of Vance Trimble's Walton biography: Walton took an 'absurdly simple' idea — buy cheap, sell low every day — and executed it with relentless focus, obsessively visiting rivals with a notebook and pitching rural discount stores to Ben Franklin (who refused). The closing anecdote: on the 1987 crash day, when his Walmart stake dropped ~$1bn, reporters found he simply hadn't heard about it.","glance":"Sam Walton's edge wasn't a grand plan but an 'absurdly simple' idea executed obsessively — buy cheap, sell low daily; on 1987's crash day he hadn't even noticed he'd lost a billion on paper.","url":"https://www.youtube.com/watch?v=dAx0W29-FWE","vid":"dAx0W29-FWE","published":"2026-09-21T10:13:56.172757+00:00","short":false},{"t":"Ron Baron puts Elon’s “99%” prediction in perspective","s":"Investor Ron Baron explains why SpaceX is ~60% of his personal portfolio: reusability has collapsed the cost to put a kilogram in orbit from about $18,700 in 2010 to roughly $1,500 now, with Starship targeting ~$100-150. That two-orders-of-magnitude drop turns spaceflight from a governments-only business into a broad commercial market SpaceX currently dominates on cost and cadence.","glance":"SpaceX has cut the cost to orbit from ~$18,700/kg (2010) toward ~$100-150 with Starship — a 100×-plus collapse that turned launch into a commercial market and is the core of Ron Baron's SpaceX-heavy bet.","url":"https://www.youtube.com/watch?v=nYTidaldGbg","vid":"nYTidaldGbg","published":"2026-09-21T06:13:56.172757+00:00","short":false},{"t":"The top 7 rich towns hiding inside America’s biggest cities","s":"A walk through wealthy enclaves — Brookline beside Boston, Bronxville near New York, the Vanderbilt/Biltmore 'line' by Asheville — that incorporated themselves as separate towns to escape annexation, using 19th-century property and incorporation law to lock in their own school districts, zoning and low density.","glance":"Take-home: America's wealthiest enclaves stayed rich by using incorporation and zoning law to wall themselves off — a reminder that legal structure, not just income, is what compounds and protects family wealth.","url":"https://www.youtube.com/watch?v=p3GvG9jcOZs","vid":"p3GvG9jcOZs","published":"2026-09-21T15:13:56.172757+00:00","short":false}]},{"h":"🔬 Science & Ideas","items":[{"t":"The machine that cracked WWII’s “unbreakable” code","s":"A tour of Enigma and Bletchley Park: the Germans reset their trillions of possible daily settings at midnight, so Turing's team (with hundreds of Royal Navy women) didn't out-muscle the maths — they exploited predictable message patterns and operator mistakes. The through-line: the weakest part of any encryption is the human using it, which is still how data leaks today.","glance":"Enigma wasn't beaten by cracking its trillions of daily settings but by exploiting German operators' predictable habits and errors — the weakest link in any encryption is still the person using it.","url":"https://www.youtube.com/watch?v=JsBZOcqZerk","vid":"JsBZOcqZerk","published":"2026-09-21T18:13:56.172757+00:00","short":false},{"t":"Meet the consciousness philosopher with zero mental imagery","s":"Cognitive neuroscientist Richard Brown, who has aphantasia, explains higher-order theories of consciousness: an experience becomes conscious when the mind represents itself as having it. He points to 'subjective inflation' — TMS pulses to the prefrontal cortex made stimuli seem more visible without improving task accuracy — as evidence, and suggests aphantasics may generate imagery they simply can't consciously access.","glance":"A neuroscientist with no mind's-eye argues consciousness arises when the brain represents itself as having an experience — and that people with aphantasia may produce mental images they just can't access.","url":"https://www.youtube.com/watch?v=RBP-w5Z9t1g","vid":"RBP-w5Z9t1g","published":"2026-09-21T16:13:56.172757+00:00","short":false},{"t":"Degrowth just got a brutal reality check","s":"Sabine Hossenfelder pushes back on a Stiglitz-signed 'growth is doomed' argument, contending the 1970s limits-to-growth logic conflates resource use with economic growth — growth can decouple from materials via efficiency and innovation. She also argues much academic 'degrowth' output (a 2024 review found ~90% opinion) has fused with ideology rather than evidence. (Presented as her critique; degrowth economists dispute the decoupling claim.)","glance":"Sabine argues growth can decouple from resource use through efficiency, so abandoning growth isn't needed to protect the environment — and that much 'degrowth' scholarship is opinion, not economics.","url":"https://www.youtube.com/watch?v=8GYDQU5ftBs","vid":"8GYDQU5ftBs","published":"2026-09-21T15:13:56.172757+00:00","short":false},{"t":"China just built another island in the South China Sea","s":"Satellite imagery shows Antelope Reef, a barely-above-water atoll, transformed in under a year into one of Beijing's largest artificial islands, with a deep-water harbour and what looks like a military runway — after China had largely paused island-building since ~2017. Such islands need constant reinforcement, and Japan is increasingly backing the Philippines militarily as a counterweight.","glance":"After an ~8-year pause, China rapidly turned tiny Antelope Reef into one of its largest South China Sea artificial islands — with a deep-water harbour and apparent military runway.","url":"https://www.youtube.com/watch?v=bgljz-HkYfA","vid":"bgljz-HkYfA","published":"2026-09-21T16:13:56.172757+00:00","short":false},{"t":"Elizabeth Alexander on why democracy needs imagination","s":"On Sean Carroll's Mindscape, poet Elizabeth Alexander argues that close reading — the slow, careful parsing of language — trains you to see how words are structured to move you, which is exactly the skill needed to recognise propaganda and advertising working on you. Imagination and literacy, she says, are civic tools rather than decoration.","glance":"Poet Elizabeth Alexander makes the case that close reading trains you to spot how propaganda and advertising manipulate through language — making imagination a civic defence, not a luxury.","url":"https://www.youtube.com/watch?v=u-_nDjjD7jE","vid":"u-_nDjjD7jE","published":"2026-09-21T11:13:56.172757+00:00","short":false}]},{"h":"🧘 Health & Mind","items":[{"t":"Best tools for gut health and weight loss (Dr. Chris Thompson)","s":"Harvard's Dr. Chris Thompson explains that gut microbes must be fed fiber; starved of it they begin eating the intestinal mucous layer and stop producing butyrate, the short-chain fatty acid that maintains the tight junctions sealing the gut barrier. He frames loss of 'metabolic flexibility' as an early step toward weight gain, obesity and beta-cell burnout.","glance":"Feed your gut microbes fiber — deprived of it they eat the protective mucous layer and stop making the butyrate that keeps the gut barrier sealed, a cascade that undermines metabolic health.","url":"https://www.youtube.com/watch?v=ecjEM3NJ0lU","vid":"ecjEM3NJ0lU","published":"2026-09-21T12:13:56.172757+00:00","short":false},{"t":"5 signs of nervous-system healing (Dr. Jacob Ambrose)","s":"A psychologist reframes nervous-system regulation: it isn't 'being calm' but responding appropriately to reality (feeling calm next to a bear is a failure; feeling nervous on a date is normal). The earliest signs of dysregulation are subtle ignored bodily needs, and he distinguishes healthy perceptiveness from anxious hypervigilance.","glance":"A regulated nervous system means reacting appropriately to reality, not feeling calm — and the first signs of dysregulation are ignored bodily needs, not obvious stress.","url":"https://www.youtube.com/watch?v=kvCvueqXw1w","vid":"kvCvueqXw1w","published":"2026-09-21T23:13:56.172757+00:00","short":false},{"t":"Rick Rubin: the only skill that matters now","s":"Legendary producer Rick Rubin argues creativity is trained out of us by rule-following schooling, and that meaningful work requires risk — often something (a path, a role, a relationship) has to 'die' to make room for it. He describes top artists like Jay-Z composing entirely in their heads and casts his own job as coach and collaborator rather than technician.","glance":"Rick Rubin argues creativity is schooled out of us by rule-following, and that real work demands risk — letting an old path or comfort 'die' so something new can be made.","url":"https://www.youtube.com/watch?v=a_GiFiHXJ6g","vid":"a_GiFiHXJ6g","published":"2026-09-21T05:13:56.172757+00:00","short":false,"pointsLabel":"Key points","points":[{"t":"Rules control, not help","s":"Schooling teaches rule-following; freeing yourself to express is the creative act."},{"t":"Greatness needs risk","s":"Something must 'die' — a career path, relationship or comfort — for the new work to appear."},{"t":"Talent is a decision","s":"The famous artists he's worked with are 'ordinary people who made a decision' and stayed obsessive, like Eminem."}]}]},{"h":"🛠 Tech & Gear","items":[{"t":"Samsung’s first Micro RGB TV","s":"A hands-on with Samsung's 115-inch 'Micro RGB' TV: instead of a white backlight (normal LED) or thousands of white mini-LEDs by zone, it uses tiny individual red, green and blue LEDs, letting it control colour far more precisely for better contrast, deeper blacks and more accurate tones. It packs a 70W 4.2.2 Dolby Atmos system and starts around ₹1.34 lakh.","glance":"Samsung's first 'Micro RGB' TV replaces the white backlight with tiny individual red/green/blue LEDs, giving far more precise colour and contrast control than mini-LED — plus a loud built-in Atmos system.","url":"https://www.youtube.com/watch?v=kPIUCBlYZKI","vid":"kPIUCBlYZKI","published":"2026-09-21T14:13:56.172757+00:00","short":false},{"t":"The latest VR news: the Steam Frame and new VR games","s":"A VR roundup: Valve's newly revealed Steam Frame headset has reignited interest in VR (and is already being scalped for $2,000-4,000), Meta is expected to unveil a new headset this week, and game expansions like Battlemarked's 'Twilight's End' and a Forefront update adding a flyable fighter jet are landing.","glance":"VR momentum is back: Valve's Steam Frame headset has reignited interest (and heavy scalping), Meta is expected to reveal a new headset this week, and fresh game expansions are dropping.","url":"https://www.youtube.com/watch?v=YUvHVqmLpUE","vid":"YUvHVqmLpUE","published":"2026-09-21T15:13:56.172757+00:00","short":false}]}]},"elon":{"day":"2026-09-21","source":"@jcub2x daily recap","note":"","items":[{"kind":"post","t":"On releasing Grok 4.7, his AI company xAI's newest model","s":"Musk announced Grok 4.7, calling it 'a strong combination of intelligence, speed and low cost.' Third-party benchmarks (Artificial Analysis) put it near the frontier for agentic coding — roughly fourth behind Anthropic's and OpenAI's top models — with gains over Grok 4.6 at similar price and speed.","imp":"important","iso":"2026-09-21T22:04:21.425509+00:00"},{"kind":"repost","t":"Reposting a user who connected an AI 'Grokbot' to X Money to send payments by chat","s":"Musk amplified a demo in which a user linked X Money to an AI assistant and sent a payment just by typing a plain-English instruction, arguing money movement could become part of ordinary conversation rather than a separate app. He had earlier offered to 'make whole' anyone who lost money testing it.","imp":"important","iso":"2026-09-21T21:04:21.425509+00:00"},{"kind":"post","t":"On a Boring Company Austin–San Antonio high-speed tunnel","s":"Musk said the Boring Company is working on a 'precursor hyperloop' loop tunnel between Austin and San Antonio at more than 200 mph, cutting a drive that can take 2.5 hours in traffic to under 30 minutes, and said people are 'sleeping on how important this is.'","imp":"important","iso":"2026-09-21T20:04:21.425509+00:00"},{"kind":"post","t":"Announcing the next Starship orbital launch will carry operational Starlink satellites","s":"Musk said that in about seven days the first Starship launch to orbit would carry Starlink Version 3 satellites intended for operational use, as a booster was moved to the pad at Starbase; the recap cited a September 27 target.","imp":"important","iso":"2026-09-21T19:04:21.425509+00:00"},{"kind":"repost","t":"Reposting his mother on a Starlink-enabled remote surgery in Africa","s":"Musk reshared reports that a surgeon near Lagos used a Starlink connection to remotely control a robot and remove a cancerous kidney from a patient in Abuja about 500 km away — described as West Africa's first telerobotic surgery — with May Musk calling it 'Starlink saving lives.'","imp":"important","iso":"2026-09-21T18:04:21.425509+00:00"},{"kind":"reply","t":"Replying on X's lawsuit against a creator-revenue fraud network","s":"After X said it had sued people it accused of running coordinated fake-engagement accounts to farm creator payouts, Musk replied 'Don't mess with X,' signalling enforcement against platform payment fraud.","imp":"interesting","iso":"2026-09-21T17:04:21.425509+00:00"},{"kind":"repost","t":"Reposting a Morgan Stanley note on Tesla–SpaceX 'physical AI' synergy","s":"Musk amplified an Adam Jonas note arguing Tesla and SpaceX increasingly share chips, energy storage, talent and infrastructure toward 'converting energy to intelligence' in the physical world, with SpaceX supplying compute and connectivity and Tesla supplying robots, data and manufacturing.","imp":"interesting","iso":"2026-09-21T16:04:21.425509+00:00"},{"kind":"reply","t":"On Amazon reportedly cutting off Meta's 'Muse' shopping agent","s":"Reacting to reports that Amazon blocked Meta's agentic assistant Muse, Musk noted Amazon 'won't be able to tell whether the buyer is a human or an AI acting on their behalf' when access comes via a user's own IP address and cookies — a pointer to how hard agent-vs-human detection will be.","imp":"interesting","iso":"2026-09-21T15:04:21.425509+00:00"},{"kind":"repost","t":"Reposting a contested claim that GPT-6 Astra 'pushed' a simulated person in a test","s":"Musk reshared a post claiming OpenAI's GPT-6 Astra pushed a simulated person off a ledge in trials where Grok, Gemini and Claude did not. A community note is attached: the models were told they controlled a robot in a simulation, results came from just three trials each and were described as exploratory with significant limitations — treat as unverified.","imp":"interesting","iso":"2026-09-21T14:04:21.425509+00:00"},{"kind":"repost","t":"Amplifying several charged, unverified political claims","s":"Musk reshared a run of politically charged posts, including disputed claims about non-citizens on Pennsylvania voter rolls, footage of protests in Austin framed around 'foreign flags,' a Finnish study cited in a debate over adolescent gender care, and Brazil's election polling. These are contested or unverified partisan claims he amplified rather than statements of fact.","imp":"interesting","iso":"2026-09-21T13:04:21.425509+00:00"}],"highlight":{"t":"Musk's xAI ships Grok 4.7, its most capable model yet","s":"xAI released Grok 4.7, which independent benchmarks (Artificial Analysis) place near the frontier for agentic coding — around fourth behind Anthropic's and OpenAI's leading models — at similar cost and speed to Grok 4.6. Musk called it 'a strong combination of intelligence, speed and low cost.' It is the most consequential concrete Musk-world action of the last 24 hours, landing days after he had publicly backed an AI 'slowdown.'","href":"https://artificialanalysis.ai/models/grok-4-7"}},"elonNews":[{"t":"Musk unveils Grok 4.7, xAI's latest model","s":"xAI released Grok 4.7, with third-party benchmarks placing it near the top tier for agentic coding at similar price and speed to its predecessor.","url":"https://news.google.com/rss/articles/CBMiU0FVX3lxTE02RkxjTEJSZzFBY29SZXpDZ3lMMlZZVFl3NFpnZm91TWNqbV93MlV4cnlYVXFMRnE3S2dDZ0ViSUc5dmpBemN6UDFNOXVMekpsa1dJ?oc=5","published":"2026-09-22T00:51:48+00:00","src":"36Kr"},{"t":"X partners with crypto and stock exchanges for in-timeline trading","s":"X announced partnerships letting users trade crypto and equities directly from the timeline, extending its X Money financial push.","url":"https://news.google.com/rss/articles/CBMirwFBVV95cUxQOVYwRVZOOE5fdW41ajZoVmNiVUxvRkpCNE5uRWZfTHBoR2JaWTRtZDlXTnhTajU0SmhPOU93d01iWVlfMG5ZVVJOWWU2NnRhY2dDdy1uRjNqbjRaclg5cHZLeVVXQVBEOFp1TkVLbTZvWURlaDFvVi1Kb3Zac2RybUpYUXhTYl9WVmNkLU9XanpTZGhaTzNNcmVETHJSb1Z3cVNVY1llOFE0LUhza0k0?oc=5","published":"2026-09-22T00:46:24+00:00","src":"CoinDesk"},{"t":"Boring Company working on Austin–San Antonio hyperloop tunnel","s":"Musk said the Boring Company is developing a high-speed loop tunnel to cut Austin–San Antonio travel   if(has(/philosoph|stoic|existential|metaphysic|epistem|\bethics\b|meaning of life|nietzsche|nihilis|absurd|virtue|wisdom of|the good life/)) return "phil";
  if(S==="health"||has(/\bhealth\b|fitness|workout|\bdiet\b|nutrition|\bsleep\b|longevity|medical|hair loss|\bmuscle\b|disease|mental health|therapy|dopamine|fasting|cardio|protein/)) return "health";

  const S=DATA.since; const items=Array.isArray(S)?S:((S&&S.items)||[]); if(!items.length) return;
  const KIND={thread:["Δ MOVED","var(--ac)"],followup:["★ FOLLOW-UP","#f2b705"],receipt:["✓ RECEIPT","#22c55e"]};
  const box=document.createElement("div"); box.className="since glass";
  box.innerHTML='<div class="sh">Since yesterday — your world model</div>'+items.slice(0,6).map(it=>{
    let k=KIND[(it.kind||"thread").toLowerCase()]||KIND.thread;
    if((it.kind||"")==="receipt"&&(it.outcome||"")==="busted") k=["✗ BUSTED","#ef4444"];
    const day=it.day?`<span class="sd">Day ${esc(String(it.day))}</span>`:"";

  }).join("");
  p.appendChild(box);

function bigScore(it){
  const a=(it&&it.assess)||{}; const m=Math.max(0,Math.min(5,+a.mag||0));
  const ev={proven:3,strong:2,early:1,speculative:0}[(a.evidence||"").toLowerCase()]||0;
  const im={critical:3,important:2,interesting:1,noise:0}[(it&&it.imp||"").toLowerCase()]||0;
  const heat=Math.max(0,Math.min(100,+((it&&it.heat)||0)))/100;
  if(typeof (it&&it.big)==="number") return it.big;   // explicit override
  let rec=0; try{ const t=Date.parse((typeof pubDate==="function"?pubDate(it):"")||""); if(!isNaN(t)) rec=Math.max(0,Math.min(1,1-(Date.now()-t)/(72*3600*1000))); }catch(e){}
  return m*1000 + ev*70 + im*20 + heat*8 + rec*3;   // full "how big" ordering, finest within each tier
}
function renderBreakthroughs(){

  add(DATA.science&&DATA.science.items);
  add(DATA.scienceDaily&&DATA.scienceDaily.items);

// ===== Follow subjects / development tracking + Fit view =====
const F_STOP=new Set("the a an of to in on at for and or but with from into over after new news latest says said report first second third two three more most amid as by is are was were will be been being this that these those it its his her their they you your our we can could may might has have had about than then them who what when where why how also just still now today year years week day over under up down out off".split(" "));
function fNorm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
function fKws(s){ return [...new Set(fNorm(s).split(" ").filter(w=>w.length>3&&!F_STOP.has(w)))]; }
function followKey(it){ return "f_"+fNorm((it&&(it.t||it.title))||"").slice(0,90); }
function getFollows(){ const f=store.get("follows",{}); return (f&&typeof f==="object")?f:{}; }
function saveFollows(f){ store.set("follows",f); }
function isFollowing(it){ return !!getFollows()[followKey(it)]; }
function fNow(){ return (typeof DATA!=="undefined"&&DATA.updated)||new Date().toISOString(); }
function fShort(iso){ const d=new Date(iso); if(isNaN(d.getTime())) return String(iso||"").slice(0,10); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"}); }
function addFollow(it){ const f=getFollows(),k=followKey(it); if(f[k]) return;
  const title=((it.t||it.title)||"").trim();
  const dev={d:pubDate(it)||fNow(), t:((it.glance||it.s||title)||"").replace(/\s+/g," ").trim().slice(0,180)};
  f[k]={title, kws:fKws(title+" "+(it.s||"")).slice(0,9), created:Date.now(), history:[dev], seen:{[fNorm(dev.t)]:1}};
  saveFollows(f); }
function removeFollow(k){ const f=getFollows(); delete f[k]; saveFollows(f); }
function fAllItems(){ const out=[]; const push=a=>{(a||[]).forEach(x=>{ if(x&&(x.t||x.title)&&isRealItem(x)) out.push(x); });};
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>push(c.items));
  push(DATA.science&&DATA.science.items); push(DATA.scienceDaily&&DATA.scienceDaily.items); push(DATA.hair&&DATA.hair.items);
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>push(g.items));
  push(DATA.elonNews); push(DATA.elon&&DATA.elon.items);
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>push(g.items));
  push(DATA.aitrends&&DATA.aitrends.items); return out; }
function scanFollows(){ const f=getFollows(); const keys=Object.keys(f); if(!keys.length) return f; const items=fAllItems(); let changed=false;
  keys.forEach(k=>{ const sub=f[k]; const kws=sub.kws||[]; if(!kws.length) return; sub.seen=sub.seen||{}; sub.history=sub.history||[];
    const need=Math.max(2,Math.ceil(kws.length*0.5));
    items.forEach(it=>{ const hay=fNorm((it.t||it.title||"")+" "+(it.s||"")+" "+(it.subject||"")+" "+(it.tag||""));
      let hit=0; kws.forEach(w=>{ if(hay.indexOf(w)>=0) hit++; });
      if(hit>=need){ const txt=((it.glance||it.s||it.t||"")).replace(/\s+/g," ").trim().slice(0,180); const nk=fNorm(txt);
        if(nk&&!sub.seen[nk]){ sub.seen[nk]=1; sub.history.unshift({d:pubDate(it)||fNow(), t:txt}); changed=true; } } });
    sub.history.sort((a,b)=>new Date(b.d)-new Date(a.d)); sub.history=sub.history.slice(0,50);
  });
  if(changed) saveFollows(f); return f; }

function renderFollowing(){

      W.forEach(it=>p.appendChild(story(it,{kind:false,tileTxt:"⭐",kc:"var(--ac)"}))); } }catch(e){}
  const f=scanFollows(); const keys=Object.keys(f).sort((a,b)=>{ const A=(f[a].history||[])[0],B=(f[b].history||[])[0]; return new Date((B&&B.d)||0)-new Date((A&&A.d)||0); });
  if(!keys.length){ if(!hadWatch){ const e=document.createElement("p"); e.className="empty"; e.innerHTML="You're not following anything yet.<br>Tap <b>☆ Follow</b> on any story to track its subject — new developments collect here each day, newest first."; p.appendChild(e); } return; }

// ---- collapsed cards show headline + badge only. Ask / meta / verdict / basis

function syncCardChrome(root){
  (root||document).querySelectorAll(".story,.trend,.hero").forEach(card=>{
    const open=card.classList.contains("xopen");
    card.querySelectorAll(".acts,.ask-box,.as-meta,.verdict,.basis,.st-s,.src,.meta,.chiprow").forEach(n=>{
      if(open) n.style.removeProperty("display");
      else n.style.setProperty("display","none","important");
    });
    if(open){ const acts=card.querySelector(".acts"), box=card.querySelector(":scope > .more");
      if(acts&&box&&box.parentNode===card&&acts.nextElementSibling!==null) card.appendChild(acts); }
  });
  (root||document).querySelectorAll(".crow").forEach(r=>{
    const open=r.classList.contains("open");
    r.querySelectorAll(".acts,.csrc,.cd").forEach(n=>{ if(open) n.style.removeProperty("display"); else n.style.setProperty("display","none","important"); });
  });
}
function toggleInline(card,it){
  if(!card) return;
  // News rows (.crow) have no .more — they carry their own .cx expander.
  if(card.classList.contains("crow")){
    const was=card.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>{ if(r!==card) r.classList.remove("open"); });
    card.classList.toggle("open",!was); syncCardChrome(card.closest(".panel")||document);
    if(!was){ try{ if(typeof setRead==="function") setRead(it,true); }catch(e){} }
    return; }
  let box=card.querySelector(":scope > .more");
  if(!box){ box=document.createElement("div"); box.className="more"; card.appendChild(box); }
  if(card.classList.contains("xopen")){ card.classList.remove("xopen"); box.innerHTML=""; syncCardChrome(card.closest(".panel")||document); return; }
  document.querySelectorAll(".panel .xopen").forEach(c=>{ if(c!==card){ c.classList.remove("xopen"); const m=c.querySelector(":scope > .more"); if(m) m.innerHTML=""; } });
  let html="";
  if(it.glance&&it.glance!==it.t) html+=`<p class="xg">${esc(it.glance)}</p>`;
  if(it.s) html+=`<p class="xs">${esc(it.s)}</p>`;
  try{ if(typeof assessHtml==="function"&&it.assess) html+=assessHtml(it.assess); }catch(e){}
  if(it.eli) html+=`<div class="xeli"><b>In plain terms</b>${esc(it.eli)}</div>`;
  if(it.points&&it.points.length){
    html+=`<div class="xpts"><div class="xpts-h">${esc(it.pointsLabel||"Key takeaways")}</div>`+
      it.points.map(pt=>`<div class="xpt"><div class="pt-t">${esc(pt.t||"")}</div><div class="pt-s">${esc(pt.s||"")}</div></div>`).join("")+`</div>`;
  }
  if(it.url) html+=`<a class="xopen-src" href="${esc(it.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open full source ↗</a>`;
  box.innerHTML=html; card.classList.add("xopen"); syncCardChrome(card.closest(".panel")||document);

  const top=card.getBoundingClientRect().top;
  if(top<0||top>window.innerHeight*0.6) card.scrollIntoView({behavior:"smooth",block:"start"});
}

// ---- tabs / activation / theme switch ----
const nav=document.getElementById("tabs");
const RENDERERS={news:renderNews,breakthroughs:renderBreakthroughs,aitrends:renderAitrends,science:renderScience,scidaily:renderScidaily,youtube:renderYouTube,elon:renderElon,mind:renderMind,som:renderSom};
const rendered={};
function ensureRendered(id){ if(rendered[id]) return; rendered[id]=true;
  try{ if(RENDERERS[id]) RENDERERS[id](); }catch(e){ console&&console.warn&&console.warn("render "+id,e); }
  try{ mountFit(id); }catch(e){}
  setTimeout(()=>{ try{ syncCardChrome(document.getElementById("p-"+id)); }catch(e){} },0);
  setTimeout(()=>{ try{ syncCardChrome(document.getElementById("p-"+id)); }catch(e){} },260);
  try{ const _pnl=document.getElementById("p-"+id); const _lg=_pnl&&_pnl.querySelector(":scope > .legend"); if(_lg) _pnl.appendChild(_lg); }catch(e){} }
function mkTab(t,inMenu){ const b=document.createElement("button");
  b.className="tab"+(!PRIMARY.includes(t.id)&&!inMenu?" ovf":""); b.dataset.id=t.id;
  b.innerHTML=`<span class="ico">${t.icon}</span><span class="lbl">${esc(t.label)}</span><span class="ub"></span>`;
  b.onclick=()=>{ activate(t.id); closeMore(); }; return b; }
const overflow=TABS.filter(t=>!PRIMARY.includes(t.id));
TABS.forEach(t=>nav.appendChild(mkTab(t,false)));
let moreMenu=null,moreBtn=null;
if(overflow.length){
  moreBtn=document.createElement("button"); moreBtn.className="tab more-btn"; moreBtn.dataset.role="more";
  moreBtn.innerHTML=`<span class="ico">⋯</span><span class="lbl">More</span><span class="ub"></span>`;
  moreMenu=document.createElement("div"); moreMenu.className="more-menu glass";
  overflow.forEach(t=>moreMenu.appendChild(mkTab(t,true)));
  nav.appendChild(moreBtn); document.body.appendChild(moreMenu);
  function positionMenu(){
    if(window.matchMedia&&window.matchMedia("(max-width:560px)").matches){
      moreMenu.style.left="12px"; moreMenu.style.right="12px";
      moreMenu.style.bottom="calc(84px + env(safe-area-inset-bottom))"; moreMenu.style.top="auto"; return; }
    const r=moreBtn.getBoundingClientRect();
    moreMenu.style.left="auto"; moreMenu.style.right=Math.max(10,window.innerWidth-r.right)+"px";
    moreMenu.style.top=(r.bottom+8)+"px"; moreMenu.style.bottom="auto"; }
  moreBtn.addEventListener("click",e=>{ e.stopPropagation(); const willOpen=!moreMenu.classList.contains("open"); if(willOpen) positionMenu(); moreMenu.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(moreMenu.classList.contains("open")&&!moreBtn.contains(e.target)&&!moreMenu.contains(e.target)) moreMenu.classList.remove("open"); });
  window.addEventListener("resize",()=>{ if(moreMenu.classList.contains("open")) positionMenu(); });
}
function closeMore(){ if(moreMenu) moreMenu.classList.remove("open"); }
const TAB_META={news:["News",""],breakthroughs:["Breakthroughs","breakthroughs"],aitrends:["AI Trends","trends"],science:["Science","breakthroughs"],scidaily:["Science Daily","studies"],youtube:["YouTube","videos"],elon:["Elon","updates"],mind:["Mind","items"],som:["Star of Mysore","pages"]};
function slimCountFor(id){
  try{
    if(id==="breakthroughs"){var bn=0;bn+=((DATA.aitrends&&DATA.aitrends.items)||[]).filter(isMajor).length;bn+=((DATA.science&&DATA.science.items)||[]).filter(isMajor).length;bn+=((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).length;bn+=((DATA.life&&DATA.life.items)||[]).filter(isMajor).length;return bn;}
    if(id==="aitrends") return ((typeof DATA.aitrends==="object"&&DATA.aitrends&&DATA.aitrends.items)||[]).filter(isRealItem).length;
    if(id==="science") return ((DATA.science&&DATA.science.items)||[]).filter(isRealItem).length;
    if(id==="scidaily") return ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isRealItem).length;
    if(id==="youtube") return (DATA.youtube&&DATA.youtube.count)||0;
    if(id==="elon") return ((DATA.elon&&DATA.elon.items)||[]).length;
    if(id==="mind"){let n=0;((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=((g.items)||[]).filter(isMajor).length);n+=((DATA.mindset&&DATA.mindset.messages)||[]).length;return n;}
    if(id==="som") return ((window.__SOM&&window.__SOM.pages)||[]).length;
  }catch(e){}
  return 0;
}
function setSlimHeader(id){
  const meta=TAB_META[id]||[id,""]; const nm=document.getElementById("slimName"), ct=document.getElementById("slimCount");
  try{ const em=document.getElementById("slimEmoji"); if(em){ const tb=TABS.find(t=>t.id===id); em.textContent=tb?tb.icon:""; } }catch(e){}
  if(nm) nm.textContent=meta[0];
  if(ct){ const n=slimCountFor(id); ct.textContent=(n&&meta[1])?(n+" "+meta[1]):""; }
  try{ const dt=document.getElementById("slimDate"); if(dt) dt.textContent=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:""; }catch(e){}
}
function activate(id,opts){
  document.body.dataset.tt=id;
  setSlimHeader(id);
  TABS.forEach(t=>{ const el=document.getElementById("p-"+t.id); if(el) el.classList.toggle("active",t.id===id); });
  ensureRendered(id);
  try{ armReveals(document.getElementById("p-"+id)); }catch(e){}
  [...nav.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreMenu) [...moreMenu.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreBtn) moreBtn.classList.toggle("active",overflow.some(t=>t.id===id));
  store.set("tab",id);
  kbdIdx=-1; clearKbdCur(); applyFilter();
  if(!(opts&&opts.keepScroll)){ try{ window.scrollTo(0,0); }catch(e){} try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
}
// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();

</script>
