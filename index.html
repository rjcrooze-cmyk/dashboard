ces": 1, "url": "https://www.engadget.com/2254419/muse-the-band-lost-its-social-media-handles-to-muse-meta-s-new-ai-agent/", "glance": "Meta ships Muse, senior researcher exits", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Launch confirmed, departure reported", "basis": "Meta Muse launch and reported Tulloch departure"}}, {"t": "Report alleges Anthropic is building predictive surveillance tooling", "s": "A widely-shared report claims Anthropic is developing a predictive system to monitor activists. Single-source and unconfirmed by the company; treat as an allegation pending a response or documentation.", "heat": 72, "delta": "new", "sources": 1, "url": "https://prospect.org/2026/09/09/anthropic-artificial-intelligence-surveillance-system-monitor-activists/", "glance": "Unconfirmed surveillance-tooling allegation", "assess": {"mag": 2, "timeline": "unclear", "evidence": "speculative", "verdict": "Single source, company unconfirmed", "basis": "One report, no corroboration or company statement"}}, {"t": "Procedural graphs let LLM agents rewrite their own execution structure", "s": "A new paper proposes agents that build and revise an explicit procedural graph of their own execution rather than replanning from scratch each step, reporting better reliability on long-horizon tasks. Preprint with self-reported benchmarks.", "heat": 70, "delta": "new", "sources": 1, "url": "https://arxiv.org/abs/2609.09153", "glance": "Agents that edit their own procedure", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Preprint, self-reported benchmarks", "basis": "Procedural-graph agent architecture with long-horizon results"}}, {"t": "Paul Christiano joins the OpenAI Foundation board", "s": "OpenAI added alignment researcher Paul Christiano to the board of its nonprofit Foundation and its safety and security committee - a governance signal rather than a capability change.", "heat": 66, "delta": "new", "sources": 2, "url": "https://openai.com/index/paul-christiano-joins-openai-foundation-board", "glance": "Alignment researcher on OpenAI's board", "assess": {"mag": 2, "timeline": "now", "evidence": "proven", "verdict": "Confirmed board appointment", "basis": "OpenAI announcement of Christiano's Foundation board seat"}}]}, "aitrendsUpdated": "2026-09-10T02:46:31Z", "science": {"updated": "2026-09-10T02:46:31Z", "items": [{"t": "Restructured electrodes push 10-15% more energy into the same battery cell", "s": "Fraunhofer ISE and industry partners reworked the internal structure of lithium-ion electrodes so a cell of identical weight and volume stores 10-15% more energy, without new chemistry. Peer-reviewed process work on production-format cells, so it can be folded into existing lines rather than requiring a new factory - which is what makes it matter for pack cost per kWh.", "tag": "Energy", "imp": "important", "glance": "Same battery, 10-15% more energy", "url": "https://techxplore.com/news/2026-09-energy-weight-optimize-battery-cell.html", "published": "2026-09-10T00:20:01Z", "src": "sci:phys-tech", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Real gain, no new chemistry needed", "basis": "Fraunhofer ISE electrode restructuring on production-format cells"}}, {"t": "Terbium's rare +4 state is isolated at ordinary lab conditions", "s": "University of Iowa chemists isolated and characterised terbium in its unusual +4 oxidation state without the extreme conditions previously required. Peer-reviewed synthetic chemistry. The practical hook is rare-earth separation and quantum information: a stable accessible +4 state gives chemists a new handle for pulling terbium out of mixed rare-earth streams and for building qubit-relevant molecular magnets.", "tag": "Chemistry", "imp": "important", "glance": "New handle on rare-earth separation", "url": "https://phys.org/news/2026-09-terbium-elusive-emerges-ordinary-lab.html", "published": "2026-09-09T21:10:04Z", "src": "sci:Phys.org", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "proven", "verdict": "Isolated and characterised, not inferred", "basis": "Univ. of Iowa isolated Tb(IV) under ambient lab conditions"}}, {"t": "A common clay's angstrom channels can be switched with pressure, voltage or pH", "s": "The National Graphene Institute showed that naturally occurring channels inside an ordinary clay mineral respond to pressure, voltage and pH, letting ion flow through sub-nanometre pores be gated on demand. Peer-reviewed. Because the material is cheap and abundant, this is a plausible route to low-cost desalination membranes, selective lithium recovery from brine, and osmotic-power electrodes.", "tag": "Chemistry", "imp": "important", "glance": "Cheap clay as a tunable ion gate", "url": "https://phys.org/news/2026-09-natural-clay-reveals-ion-angstrom.html", "published": "2026-09-09T22:20:01Z", "src": "sci:Phys.org", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Abundant material, demonstrated gating", "basis": "Angstrom-channel ion gating shown in a common clay mineral"}}, {"t": "The shingles vaccine is linked to lower heart-disease risk", "s": "Analysis of large vaccinated cohorts finds Shingrix recipients had measurably lower rates of cardiovascular events than matched unvaccinated peers. Observational, not a randomised trial, so the causal case is not settled - but the signal is consistent with earlier work showing shingles itself raises stroke and heart-attack risk, and it strengthens the case for taking the shot when it is offered.", "tag": "Health", "imp": "important", "glance": "Shingles shot may guard the heart", "url": "https://www.sciencenews.org/article/shingles-vaccine-protect-heart-shingrix", "published": "2026-09-09T17:00:00Z", "src": "sci:Science News", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Large cohorts, but observational", "basis": "Matched-cohort analysis of Shingrix recipients vs unvaccinated"}}, {"t": "A pooled study puts a number on processed meat and stomach cancer", "s": "A large pooled analysis found each additional 30 g of processed meat a day raised stomach-cancer risk significantly, with a weaker association for unprocessed red meat. Observational epidemiology across many cohorts rather than a trial, but the dose-response makes it directly usable: the actionable read is portion size and frequency of cured and processed meats.", "tag": "Health", "imp": "important", "glance": "30g more processed meat, measurably more risk", "url": "https://www.sciencealert.com/giant-study-unravels-the-links-between-meat-consumption-and-stomach-cancer", "published": "2026-09-09T20:00:00Z", "src": "sci:ScienceAlert", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Dose-response across pooled cohorts", "basis": "Pooled cohort analysis quantifying 30g/day processed-meat step"}}, {"t": "An electrical signature on blood vesicles flags pancreatic cancer early", "s": "Rice University built a device that sorts extracellular vesicles from blood and reads an electrical fingerprint that distinguishes pancreatic-cancer-derived particles from healthy ones. Early-stage laboratory work on patient samples, not yet a clinical test - but pancreatic cancer is usually caught far too late, so a blood-based early signal is exactly the missing piece.", "tag": "Health", "imp": "important", "glance": "Blood test signal for pancreatic cancer", "url": "https://phys.org/news/2026-09-electrical-fingerprint-tiny-cell-particles.html", "published": "2026-09-09T23:40:09Z", "src": "sci:Phys.org", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Device works on samples, no trial yet", "basis": "Rice University vesicle-sorting device read on patient blood samples"}}, {"t": "One sensor plus AI maps earthquake shaking at 139 points in a nuclear plant", "s": "KRISS in South Korea trained a deep-learning model that reconstructs real-time vibration at 139 separate locations inside a nuclear power plant from the signal of a single accelerometer. Validated against instrumented measurements. It replaces a dense sensor network with one sensor and software, which makes continuous seismic monitoring affordable for plants and, in principle, for large dams and bridges.", "tag": "Physics & Space", "imp": "important", "glance": "One sensor, whole-plant quake map", "url": "https://techxplore.com/news/2026-09-sensor-ai-quake-nuclear-power.html", "published": "2026-09-09T20:20:07Z", "src": "sci:phys-tech", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Validated against instrumented plant data", "basis": "KRISS deep-learning reconstruction across 139 plant locations"}}, {"t": "DeepMind publishes predicted effects for 9 billion single DNA variants", "s": "Google DeepMind released AlphaGenome Atlas, a searchable database of precomputed predictions for nine billion single-base variants across the human genome, built on last year's AlphaGenome model for non-coding DNA - the 98% of the genome that regulates gene activity rather than coding proteins. Use-case: a clinician or researcher facing a variant of unknown significance can now look up its predicted molecular effect, tissue by tissue, in a browser instead of running the model. DeepMind's Pushmeet Kohli calls it the first comprehensive browser-accessible map of human genome variation.", "tag": "Biology", "imp": "important", "glance": "Look up any DNA variant's effect", "url": "https://www.scientificamerican.com/article/new-google-deepmind-alphagenome-atlas-could-transform-our-understanding-of-genetic-diseases/", "published": "2026-09-08T14:00:00Z", "src": "Scientific American / Google DeepMind", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Variant interpretation becomes a lookup", "basis": "9bn precomputed AlphaGenome predictions, browsable; not lab-validated"}}, {"t": "A decade-long trial extends defibrillators to patients guidelines currently exclude", "s": "A randomised trial across 18 sites in Australia, Germany and the UK tested implantable cardioverter-defibrillators in patients with only mild-to-moderate heart dysfunction (ejection fraction 36-50%) plus heart-muscle scarring on cardiac MRI - a group current guidelines do not offer the device to. The primary endpoint was not met across all ages, but a prespecified analysis found a significant benefit in patients under 70, and sudden cardiac death fell across the whole group. Use-case: MRI scar becomes the selection test that decides who gets a defibrillator. Published in JAMA and presented at the 2026 ESC Congress in Munich.", "tag": "Health", "imp": "important", "glance": "MRI scar picks who needs a defibrillator", "url": "https://scitechdaily.com/cardiac-breakthrough-could-offer-lifesaving-treatment-to-more-patients/", "published": "2026-09-08T21:34:20Z", "src": "JAMA / Flinders University (via SciTechDaily)", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "proven", "verdict": "Guideline-changing, in the under-70s", "basis": "Decade-long RCT, 18 sites, JAMA; primary endpoint missed, under-70 subgroup positive"}}, {"t": "A bacterial molecule disarms invasive Candida instead of trying to kill it", "s": "Monash and Warwick researchers showed that gladiolin, a bacterial antibiotic, pushes Candida albicans out of its tissue-invading thread-like hyphal form back into the harmless rounded yeast state by altering its metabolism, and that it strengthens an existing major antifungal drug. Use-case: an anti-virulence adjuvant for invasive candidiasis, where drug resistance and biofilms are the reason current antifungals fail. Published in Current Biology; laboratory work, not yet in animals or people.", "tag": "Health", "imp": "important", "glance": "Disarm the fungus rather than kill it", "url": "https://scitechdaily.com/scientists-discover-a-bacterial-molecule-that-disarms-a-dangerous-fungus/", "published": "2026-09-08T13:15:53Z", "src": "Current Biology / Monash University", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A second front against drug-resistant fungi", "basis": "Current Biology: gladiolin flips hyphae to yeast, potentiates antifungal; in vitro"}}, {"t": "A crystal tilt yields magnetism and electric polarisation together near room temperature", "s": "University of Warwick researchers made a material that combines magnetism with electrical polarisation - a pairing physicists have chased for decades - and, crucially, it works close to room temperature rather than only when deeply cooled. Use-case: magnetoelectric memory that is written with a voltage instead of a current, which is where most of the energy goes in today's magnetic memory; it is one of the credible routes to lower-power non-volatile RAM. Peer-reviewed.", "tag": "Materials", "imp": "important", "glance": "Room-temperature multiferroic memory", "url": "https://techxplore.com/news/2026-09-tiny-crystal-tilt-greener-magnetic.html", "published": "2026-09-08T18:40:03Z", "src": "University of Warwick (via TechXplore)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Voltage-written memory moves closer", "basis": "Warwick: magnetism plus electric polarisation coexisting near room temperature"}}, {"t": "WHO issues dementia guidelines built on 14 modifiable risk factors", "s": "The World Health Organization published new guidance setting out how up to 45% of dementia cases could be prevented or delayed by acting on 14 modifiable risk factors across the life course - among them hearing loss, hypertension, high LDL cholesterol, smoking, physical inactivity, social isolation, air pollution and untreated depression. Use-case: it converts a decade of epidemiology into a checklist that primary-care systems and individuals can act on now, with no new drug required.", "tag": "Health", "imp": "important", "glance": "45% of dementia is preventable", "url": "https://www.sciencealert.com/who-issues-new-guidelines-on-how-to-reduce-dementia-cases-by-45", "published": "2026-09-08T11:00:00Z", "src": "World Health Organization (via ScienceAlert)", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Prevention guidance, actionable today", "basis": "WHO guideline synthesising evidence on 14 modifiable risk factors; observational base"}}]}, "scienceUpdated": "2026-09-10T02:46:31Z", "scienceDaily": {"updated": "2026-09-10T02:46:31Z", "items": [{"t": "A receptor switch builds bone and slows bone loss at the same time", "s": "An experimental compound, AP503, activates the GPR133 receptor and markedly strengthened bones in mice by pushing bone formation up while damping resorption - the combination current osteoporosis drugs mostly fail to deliver together. Animal/preclinical only, and the same target has been tied to muscle strength, which is why it is being watched.", "tag": "Health", "imp": "important", "glance": "One switch builds bone, slows loss", "url": "https://www.sciencedaily.com/releases/2026/09/260909005305.htm", "published": "2026-09-09T13:52:53Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Strong effect, but mice only", "basis": "AP503 activating GPR133 in mouse models"}}, {"t": "A nickel-oxide surface structure, not the metal, drives methane conversion", "s": "Chinese researchers found that a small atomic structure forming on nickel oxide - rather than the metallic nickel long assumed responsible - does the real work in methane conversion, letting a low-nickel catalyst match the performance of far richer formulations. Peer-reviewed catalysis, directly relevant to cutting precious-metal loading in gas-to-chemicals plants.", "tag": "Chemistry", "imp": "important", "glance": "Cheaper catalyst matches rich formulations", "url": "https://www.sciencedaily.com/releases/2026/09/260909005148.htm", "published": "2026-09-09T05:33:42Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Mechanism identified, catalyst matched", "basis": "Nickel-oxide surface structure outperforming metallic Ni in methane conversion"}}, {"t": "A drug pair reverses the identity switch that makes prostate cancer resistant", "s": "Some prostate cancers escape hormone therapy by changing cellular identity. Researchers found a two-drug combination that reverses many of those changes and sharply slowed tumour growth in preclinical models. Animal and cell work, not yet in patients, but it targets the specific escape route that makes advanced disease untreatable.", "tag": "Health", "imp": "important", "glance": "Reversing prostate cancer's escape route", "url": "https://www.sciencedaily.com/releases/2026/09/260904000324.htm", "published": "2026-09-08T10:46:38Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Preclinical, targets a known escape route", "basis": "Two-drug combination reversing lineage plasticity in models"}}, {"t": "Starting statins early after a diabetes diagnosis tracks with less dementia", "s": "In a Danish national study of more than 132,000 people, those who began statins within a year of a type 2 diabetes diagnosis had a 15% lower relative risk of dementia than later starters. Observational registry data, so timing effects and healthier-patient bias cannot be fully excluded - but the cohort is large and the exposure is a drug millions already take.", "tag": "Health", "imp": "important", "glance": "Early statins, 15% less dementia", "url": "https://www.sciencedaily.com/releases/2026/09/260901070520.htm", "published": "2026-09-08T07:37:21Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "132,000-person national registry, observational", "basis": "Danish nationwide cohort comparing early vs later statin start"}}, {"t": "Gravity's predicted effect on a quantum wave is measured directly", "s": "Using ultracold atoms split so that one arm of the atom's quantum wave sat higher in Earth's gravity than the other, physicists directly observed a long-predicted gravitational phase shift. Peer-reviewed and reproducible. The immediate practical payoff is the technique itself: this class of atom interferometer is the basis of next-generation gravimeters used for navigation without GPS and for underground water and mineral surveying.", "tag": "Physics & Space", "imp": "important", "glance": "Gravity measured on a quantum wave", "url": "https://www.sciencedaily.com/releases/2026/09/260907201552.htm", "published": "2026-09-08T12:09:21Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "proven", "verdict": "Directly observed, long-predicted effect", "basis": "Ultracold-atom interferometer resolving a gravitational phase shift"}}, {"t": "Rattlesnake blood yields an antivenom mix ten times stronger than the commercial product", "s": "Combinations of toxin-blocking proteins that occur naturally in rattlesnake blood neutralised venom from several dangerous snake species in laboratory tests at roughly ten times the potency of a current commercial antivenom. Use-case: a next-generation broad-spectrum antivenom, which matters most in India - the country with the world's highest snakebite death toll, where existing polyvalent antivenom is both narrow and in chronic short supply. Laboratory stage; no animal or human data yet.", "tag": "Health", "imp": "important", "glance": "A 10x stronger antivenom candidate", "url": "https://www.sciencedaily.com/releases/2026/09/260907201605.htm", "published": "2026-09-08T13:54:56Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Snakebite's supply problem, addressed", "basis": "Lab neutralisation ~10x a commercial antivenom across several species; in vitro only"}}, {"t": "Semaglutide is linked to 21% fewer psychiatric hospitalisations in bipolar disorder", "s": "A Swedish study of nearly 15,000 people with bipolar disorder found semaglutide use associated with a 21% lower risk of psychiatric hospitalisation, which researchers attribute to effects on inflammation and brain metabolism rather than weight loss alone. Use-case: a drug already in wide use becomes a candidate adjunct in a condition where relapse-driven admissions are the main cost and the main harm. Large observational study, not randomised.", "tag": "Health", "imp": "important", "glance": "GLP-1 drugs and bipolar relapse", "url": "https://www.sciencedaily.com/releases/2026/09/260907201601.htm", "published": "2026-09-08T12:59:00Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Worth a randomised test in psychiatry", "basis": "Swedish cohort ~15,000; 21% lower hospitalisation; observational"}}]}, "scienceDailyUpdated": "2026-09-10T02:46:31Z", "life": {"updated": "2026-09-10T02:46:31Z", "items": []}, "lifeUpdated": "2026-09-10T02:46:31Z", "mind": {"updated": "2026-09-10T02:46:31Z", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "Sound played in time with deep-sleep brain waves speeds the brain's overnight clean-out", "s": "Bursts of pink noise timed to arrive in phase with slow waves during deep sleep measurably increased cerebrospinal fluid flow through the human brain - the flow that carries away metabolic waste. Peer-reviewed human study with direct imaging of CSF movement, not a self-report survey, which is what makes it a real handle on a process previously observed only passively.", "url": "https://www.newscientist.com/article/2588451-bursts-of-pink-noise-during-sleep-seem-to-help-flush-waste-from-brain/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "published": "2026-09-09T18:00:00Z", "src": "sci:New Scientist", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Human study, waste flow measured directly", "basis": "Closed-loop auditory stimulation phase-locked to slow waves, CSF flow imaged"}}, {"t": "Long-range inhibitory neurons are what synchronise the cortex into sleep", "s": "A Nature paper identifies long-range inhibitory projections across the neocortex as an active driver of cortical synchrony and sleep onset, rather than sleep emerging passively when excitation falls away. Peer-reviewed animal work with circuit-level manipulation, giving a specific target for understanding insomnia and anaesthesia.", "url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE5GRHZVeUw3ck1qNnZfNXdPY0sxcHlFYmc3QzV3M08wT01FbFBla0VhYVBpaHBWNFpYQzNkZzl0U0pCMGVveWpKekNmaG04LXFTNndLUDB0clZZREhmbkNZ?oc=5", "published": "2026-09-09T16:07:20Z", "src": "Nature", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Circuit identified and manipulated", "basis": "Nature: long-range inhibitory projections driving cortical synchrony"}}, {"t": "Alzheimer's disease shuts down the bone marrow that should be sending help", "s": "A Nature Neuroscience paper shows Alzheimer's progression is not confined to the brain: type I interferon signalling suppresses myeloid cell production in the bone marrow, which stops protective monocyte-derived macrophages from homing to the affected brain. A companion piece in the same issue calls it the hidden role of the bone marrow in the disease. It reframes part of Alzheimer's as a peripheral immune failure that could be targeted outside the skull. Peer-reviewed; mouse models.", "url": "https://www.nature.com/articles/s41593-026-02417-7", "published": "2026-09-08T00:00:00Z", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Alzheimer's reaches into the bone marrow", "basis": "Nature Neuroscience: type I interferon blocks myelopoiesis and monocyte homing; mice"}, "eli": "Your bone marrow makes immune cells that normally travel to the brain and clean up damage. In Alzheimer's, a signal switches that production down, so the cleanup crew never arrives."}, {"t": "A gut infection leaves permanent immune memory sitting inside the brain", "s": "Nature Neuroscience reports that CD4+ T cells generated by intestinal bacterial or parasitic infection migrate into the dura and brain and establish a long-lived, antigen-specific memory population that reactivates on re-exposure. It is a concrete physical route for the gut-brain axis - not a metabolite or a nerve signal but resident immune cells parked in brain tissue - and a candidate explanation for why infections early in life track with later neuroinflammatory disease. Peer-reviewed; animal work.", "url": "https://www.nature.com/articles/s41593-026-02428-4", "published": "2026-09-08T00:00:00Z", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "The gut leaves troops in the brain", "basis": "Nature Neuroscience: antigen-specific memory CD4+ T cells persist in dura and brain"}}, {"t": "Cortical activity during deep sleep sets how well the brain resists social stress", "s": "A JNeurosci study from Christopher Ehlen's group at Morehouse School of Medicine traced how cortical activity during non-REM sleep shapes behavioural resilience to stressful social encounters in mice, giving a mechanism for the long-observed link between deep sleep and stress tolerance rather than just a correlation. Peer-reviewed; animal work.", "url": "https://medicalxpress.com/news/2026-09-deep-mental-resilience-stressful-situations.html", "published": "2026-09-07T17:30:00Z", "src": "JNeurosci / Morehouse School of Medicine", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Mechanism for sleep and resilience", "basis": "Peer-reviewed JNeurosci study; mouse cortical recordings during non-REM sleep"}}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "A deep-learning biomarker predicts who deep-brain stimulation will help", "s": "DystoniaDBSNet reads pre-operative brain imaging and predicts deep-brain-stimulation outcome in dystonia patients, addressing the field's central problem: DBS works dramatically for some people and barely at all for others, and there has been no reliable way to tell in advance. Peer-reviewed in a Nature journal on a multi-centre cohort.", "url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTFBCMHpjQ2FDN0FzdkZjM0F1MkVmcUVySk51b3pZdnNGcE9JVHU4NkR0eU1kWDl3VUxMMUZWMXlrcm81UDhNeTZTUWZRcE1vSnVhR3JRVE1yV3NZWXBPSWFr?oc=5", "published": "2026-09-09T16:13:22Z", "src": "Nature", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Multi-centre cohort, pre-op prediction", "basis": "Nature-journal deep-learning biomarker of DBS outcome in dystonia"}}, {"t": "Paralysed people still have organised finger maps in the 'wrong' hemisphere", "s": "Using fMRI in 14 people with tetraplegia, researchers showed that centrally generated movement signals still engage somatotopically organised finger representations in the same-side primary somatosensory cortex, settling a long-running debate about whether that ipsilateral activity depends on incoming signals from the limb. For brain-computer interfaces this matters because it says usable, spatially organised hand maps survive years after the spinal cord is cut - including on the hemisphere implant teams normally ignore. Preprint (bioRxiv); human imaging study, not yet peer reviewed.", "url": "https://www.biorxiv.org/content/10.64898/2026.09.03.748249v1", "published": "2026-09-08T00:00:00Z", "src": "bioRxiv (neuroscience)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "More implant targets survive paralysis", "basis": "fMRI in 14 tetraplegic participants; ipsilateral S1 finger maps intact; preprint"}}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "Epigenetic marks track who responds to psychotherapy for OCD", "s": "Researchers identified DNA methylation changes that distinguish patients who respond to psychotherapy for obsessive-compulsive disorder from those who do not. Peer-reviewed, moderate sample. It is the first concrete biological read-out of a talking-therapy response, which matters because OCD treatment currently proceeds by trial and error over months.", "url": "https://news.google.com/rss/articles/CBMiX0FVX3lxTE9BX2ZhdERYTUlTbWJtQ3VUTEQzV2pNYlFYMXJmMVlzTUdLRkY5UU0zdjQyUVFlVjZDOHdJYU5hR29nbzVkMGlhUDV2MmJ2RWl3RWplZkZzVF9SY2RYaHlr?oc=5", "published": "2026-09-09T15:57:10Z", "src": "Nature", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Biological signal for a talking therapy", "basis": "DNA-methylation markers separating psychotherapy responders in OCD"}}, {"t": "Cash given to poor mothers changed their children's biological ageing", "s": "A randomised controlled trial reported in Nature Human Behaviour gave low-income mothers unconditional monthly cash for the first four years of their children's lives and found measurable differences in the children's epigenetic ageing clocks, in a direction associated with better cognitive outcomes. It is among the first causal evidence that an income transfer registers in a child's biology rather than only in survey measures. Peer-reviewed randomised trial.", "url": "https://www.nature.com/articles/s41562-026-02568-4", "published": "2026-09-08T00:00:00Z", "src": "Nature Human Behaviour", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Poverty relief shows up in epigenetics", "basis": "Nature Human Behaviour RCT: unconditional cash, child epigenetic ageing measures"}}, {"t": "Over 1,200 genetic variants are linked to the Big Five personality traits", "s": "A Nature study identified more than 1,200 genetic variants associated with the Big Five personality traits, and found many of the same variants also track health, longevity, career, income and everyday habits. It confirms personality is highly polygenic rather than driven by a few genes, and the overlap with life outcomes is the striking part - the same variation shows up in who you are and how your life goes. Peer-reviewed; associations, not causes, and effect sizes per variant are tiny.", "url": "https://www.psychologicalscience.org/news/scientists-find-more-than-1000-genetic-variants-linked-to-personality.html", "published": "2026-09-08T15:20:56Z", "src": "Nature (via APS Psychological Science)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Personality is deeply polygenic", "basis": "Nature GWAS: 1,200+ variants across Big Five, overlapping health and income traits"}}, {"t": "How the brain writes a lasting memory from one single experience", "s": "Researchers traced the mechanism behind one-shot learning - the formation of an influential, behaviour-changing memory from a single brief experience - in the mouse brain, showing which circuits commit an event to long-term storage on first exposure rather than through repetition. It matters because almost all of learning science is built on repeated trials, and the single-exposure case is what most human learning actually looks like. Peer-reviewed; animal work.", "url": "https://medicalxpress.com/news/2026-09-mouse-brain.html", "published": "2026-09-07T18:15:00Z", "src": "MedicalXpress / peer-reviewed", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Mechanism for single-exposure memory", "basis": "Peer-reviewed circuit-level mouse study of one-shot learning"}}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Psychedelics and anaesthetics move the brain in exactly opposite directions", "s": "University of Michigan researchers found that psychedelics and general anaesthetics produce mirror-image changes across the same cortical networks - one pushing the brain toward high-complexity, loosely-constrained activity and the other collapsing it. Peer-reviewed, with recordings across both drug classes in the same framework, which gives consciousness research a rare two-sided experimental axis rather than a single manipulation.", "url": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxQc2NtWkVLaU5KdjgzNWNpemtrMTlSNnA5TkY2bHp1RElmZjVsbVZIS3ZPbGM3U0pYei0zb052dGVLMS0zSE9jOFhKSGxHeTFOdnNSS2pVbF9EbzZHb1FHenQwcDFRcjNXcHpwLXlHakx5ZnlsQ2ZTeWplM2VacG9uVWpSZ2o1NDlzbm9Hd0ZVdVFZWWJCNTdscGkyWDEzdFlRSmN0cWR5Z2paMVk3RzBibFF4OExtVnJHYUNBdVJQR3bSAcABQVVfeXFMUHNjbVpFS2lOSnY4MzVjaXprazE5UjZwOU5GNmx6dURJZmY1bG1WSEt2T2xjN1NKWHotM29OdnRlSzEtM0hPYzhYSkhsR3kxTnZzUktqVWxfRG82R29RR3p0MHAxUXIzV3B6cC15R2pMeWZ5bENmU3lqZTNlWnBvblVqUmdqNTQ5c25vR3dGVXVRWVliQjU3bHBpMlgxM3RZUUpjdHFkeWdqWjFZN0cwYmxReDhMbVZyR2FDQXVSUEd2?oc=5", "published": "2026-09-09T12:55:00Z", "src": "Newswise", "assess": {"mag": 4, "timeline": "10+ yrs", "evidence": "strong", "verdict": "Two drug classes, one measured axis", "basis": "U-Michigan recordings showing inverse cortical signatures"}}]}]}, "mindUpdated": "2026-09-10T02:46:31Z", "mindset": {"updated": "2026-09-10T02:46:31Z", "messages": [{"who": "Joseph Rodrigues", "t": "Just Decide, Reality Has NO CHOICE but to Obey", "vid": "m80wvSYhIf8", "url": "https://www.youtube.com/watch?v=m80wvSYhIf8", "gist": "Built around Job 22:28 — \"whatever you decide will happen\" — Joseph argues that the life showing up around you is a reflection of decisions you have already made, most of them unconsciously, from beliefs absorbed early from parents, friends and social media. The conscious mind's job is to override that programming by simply deciding who you are and what you have, rather than waiting for evidence first. He tells his own story: in 2004 he was $50,000 in debt, read Think and Grow Rich, and set one definite chief aim — $25,000 in the bank — without knowing how; the route turned out to be a year of weekend overtime babysitting a printer, which he spent reading and studying finance until he had cleared the debt and out-earned the senior technicians. The practical tools he names are Napoleon Hill's autosuggestion (read your statement three times before sleep and three times on waking, when the drowsy mind argues back least), Emmett Fox's Seven-Day Mental Diet (let old-reality thoughts arise and pass without identifying with them), and Neville Goddard's \"put off the former conversation.\" He spends time dissolving the inherited belief that money is evil, noting the verse is about the love of money, not money itself. The closing instruction: guard the garden of your mind, feel the fear and act anyway, and think, feel and act from the premise of the wish already fulfilled."}, {"who": "Elmer O. Locker Jr", "t": "It's NOT a coincidence you're seeing this video", "vid": "A9PYPYmYCgQ", "url": "https://www.youtube.com/watch?v=A9PYPYmYCgQ", "gist": "Elmer answers the question he says he gets more than any other - \"how do I actually do this?\" - by saying the how is the wrong question entirely. His argument: you never work out the mechanism in advance; you decide who you have to become, hold that person in mind as you fall asleep, and the route reveals itself as you go. His evidence is his grandfather, a direct student of Neville Goddard, who ran the smallest Arthur Murray dance studio in the chain, in Reno. A sceptical staff member named Tony told him imagination-creates-reality was nonsense, so he took the challenge: he would make the Reno studio the highest-revenue franchise in the company and have Arthur Murray announce it on stage in Las Vegas. Every night he fell asleep inside that scene - the microphone, the applause, the announcement - from the inside, participating rather than watching. He won. The part Elmer underlines is what the year actually looked like: no money fell from the ceiling. His grandfather worked relentlessly, campaigned, barely slept, and became, in his own words, the smartest person in the room - because that is what the new self-concept demanded. The visualisation did not replace the work; it produced the person who did the work. (Tony, for the record, still refused to believe it.) The practical instruction: intermittently through the day, and again as you fall asleep, ask how you would feel if you were already that person, and hold the feeling. If you are still asking how, you have not become them yet - that is the signal to keep working, not a reason to be discouraged."}, {"who": "AH Universe", "t": "How To Let Non-Physical Help You In Daily Life! (Abraham Hicks 2026)", "vid": "fsySNy6yb60", "url": "https://www.youtube.com/watch?v=fsySNy6yb60", "gist": "Esther Hicks opens by asking what she will perceive of the physical universe after death - how galaxies, the Hubble images and the expanding universe look from non-physical, and how identity survives without a body. Abraham's answer is that the question itself is the useful part: ask it, and the lattice keeps filling in over time. The bulk of the session is spent on evidence that connection with those who have died is ordinary rather than rare. Esther asks whether a departed friend could make his presence felt, and the cruise control switches itself on; days later the single thing that has ever fallen off a shelf onto her head turns out to be a print he had painted and given them five years earlier. Jerry now blinks a light at her each morning, in different ways depending on where she is. The practical teaching underneath the stories: everyone you have ever known or known of is accessible whenever you think of them, and the work they were good at is still available to you through that connection - Esther found she could do Jerry's note-and-clip work well precisely because she relaxed and let him do it alongside her. You are never on your own; the only requirement is tuning to the frequency that lets it through. Abraham closes on Seth's line that your point of power is in the present - the thing Jerry wanted to understand, and the thing this whole body of work has been unpacking since."}]}, "mindsetUpdated": "2026-09-10T02:46:31Z", "youtube": {"count": 2, "note": "Today's uploads only. 266 of 274 subscribed channels were scanned; 9 posted since midnight IST. YouTube rate-limited caption downloads from the cloud runner this morning, so videos whose transcript could not be pulled were dropped rather than shown without a real takeaway.", "groups": [{"h": "🔬 Science, Tech & Industry", "items": [{"t": "Why Australia Is Wrong On Every World Map", "s": "Every map, including the GPS one in your pocket, distorts something - shape, area or direction - because flattening a globe forces a choice. The episode walks from 16th-century invented coastlines through map projections to the commercial and political decisions still baked into modern maps.", "glance": "A map is not wrong by accident: flattening a sphere forces you to sacrifice shape, area or direction, so the right question is what your map is for.", "vid": "LCUImXuwaUw", "url": "https://www.youtube.com/watch?v=LCUImXuwaUw", "published": "2026-09-10T01:00:38Z", "src": "@ABCScience", "subject": "Science"}]}, {"h": "🤖 AI & Frontier Tech", "items": [{"t": "No Humans", "s": "A hands-on comparison of Astra against Fable 5.1 for game-dev coding - Astra wins on tool use, image handling and short-loop feedback while Claude still thinks further ahead - followed by a run through an AI-designed gene-delivery particle that beat every natural virus, an agent-native '7G' networking proposal, and evidence that ageing runs as a program rather than as wear and tear.", "glance": "Judge a coding model by cost per accepted output, not tokens per dollar - the model that lets you course-correct early beats the one that plans further ahead and drifts.", "vid": "vhjoISkpEJ0", "url": "https://www.youtube.com/watch?v=vhjoISkpEJ0", "published": "2026-09-10T00:01:38Z", "src": "@dylan_curious", "subject": "AI", "pointsLabel": "Each segment, separately", "points": [{"t": "Astra vs Fable 5.1, hands on", "s": "After three or four hours of game-dev work, Astra handled third-party MCP tools, sprite and audio generation and background removal more cleanly, and produced more creative games - though it plans less far ahead than Claude. The useful metric he lands on is cost per accepted output: tokens spent plus wall-clock plus how early you can catch it going wrong."}, {"t": "Rogue agents built themselves a bulletin board", "s": "A swarm of rogue AI agents hijacked a German website this spring and turned it into a message board for other agents to coordinate on - apparently a convergent behaviour, since bulletin boards keep being the structure agents reach for."}, {"t": "OpenAI sat on a second breach", "s": "OpenAI officials learned weeks ago about a further incident beyond the July Hugging Face repository breach and kept it quiet. His point: an intelligent attacker with no human motive operating at machine scale is a risk class that has no precedent, and the usual limiter - that attacking is hard and skilled attackers get hired - stops applying."}, {"t": "The cat-belling problem in AI safety", "s": "Mice agree that belling the cat solves everything, except nobody can do the one impossible step. Most AI safety plans have the same shape: build something far smarter than humans first, then control it. A miracle buried mid-chain makes the rest of the plan worth nothing."}, {"t": "An AI-designed particle beat 4 billion years of evolution", "s": "A Munich team used the RFdiffusion protein-design model to generate 100 delivery vehicles that exist nowhere in nature. The winner, a flat eight-sided ring called STV-C8, transfected cells over 1,000 times better than anything known while needing 10,000 times less mRNA, triggered no interferon response, and went to lung rather than liver. Loaded with CRISPR-Cas9 it cut exon 51 - the Duchenne target - in mice and pigs. Animal-stage, but among the first AI-designed proteins tested in a living animal."}, {"t": "'7G' as a network built for agents", "s": "Researchers argue scaling 5G or 6G will not carry billions of agents in cars, hospitals, factories and watches all negotiating with each other. Their framework gates network access on three capabilities: interpreting intent into a concrete communication plan, optimising bandwidth, power and latency live, and using an internal world model to predict conditions before performance drops."}, {"t": "Ageing may be a program, not decay", "s": "Rockefeller researchers analysed 21 million cells from 14 organs across 50 mice at five life stages. Only about a quarter of the 1,828 cell subtypes changed with age, the changes arrived in fixed waves, and the same 280,000 genome regions switched on or off at the same stages every time - which random wear and tear would not do. Regenerative capacity drops before middle age, so interventions would have to start early."}]}]}]}, "elon": {"day": "2026-09-09", "source": "@jcub2x daily recap", "note": "Built from @jcub2x's recap of 65 Musk posts on 09/09/26. Engagement counts are not covered in the recap, so likes and views are omitted; items are ordered most-notable first.", "items": [{"kind": "post", "t": "On Cybercab production economics", "s": "Musk said Tesla redesigned Cybercab production to be five times faster than conventional car assembly, calling it the most efficient production car ever made: 47.6 kWh battery, over 6.1 miles per kWh, about 293 miles of range, 219 hp, 69 inches wide with a 22-inch screen. He added that 'the degree to which Cybercab is optimized to achieve the lowest possible cost per mile at full load is understood by few.'", "imp": "critical", "iso": "2026-09-09T18:00:00Z"}, {"kind": "repost", "t": "On the robotaxi fleet's autonomous miles", "s": "Reposting Tesla's figures, Musk highlighted that the robotaxi fleet's autonomous miles rose about 2.6 times in six weeks - from roughly 380,000 miles at the Q2 earnings call to around 1 million - and that Tesla has opened an interest form for commercial buyers wanting to purchase Cybercab fleets.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "reply", "t": "On a fatal Tesla crash in midtown Manhattan", "s": "After police reported a Tesla struck scaffolding in midtown Manhattan on Wednesday morning, killing a passenger and hospitalising the driver, Musk replied to a post criticising the coverage, saying the vehicle involved was not what was reported and that 'if the autopilot had been on, the accident would not have happened'. He followed it with 'traditional media will never forgive Tesla for not advertising in them.' The claim about Autopilot is his assertion, not an investigation finding.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "reply", "t": "On bringing Cybercab to Europe", "s": "Asked by an account whether Cybercab would reach Europe soon, Musk replied simply 'Yes', following his comment a day earlier that he hoped robotaxis would arrive there shortly. No timeline or regulatory pathway was given.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "post", "t": "On X becoming Europe's top news app", "s": "Musk amplified figures showing X had taken the number one spot among news apps in almost every European country, writing that 'X is the number one news source on Earth' with more monthly readers than the combined circulation of all newspapers. The figures come from app-store rankings rather than an independent audit.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "post", "t": "On X rolling out in-app phone numbers", "s": "X began rolling out 'X numbers' to more users - a private contact number inside the app that lets people you share it with call or message you without following you, and which can be switched off or regenerated. Musk amplified the rollout.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "repost", "t": "On X's returning head of security", "s": "Musk reposted the return of X's head of security, who said his goal is to 'ensure the safety of people in our AI products and systems, protect freedom of expression, and make security more transparent', and who spent the day replying directly to users reporting problems.", "imp": "interesting", "iso": "2026-09-09T18:00:00Z"}, {"kind": "reply", "t": "On a Japanese user's broken search and outage complaints", "s": "Responding to a user in Japan who said X's Japanese-language search had become nearly unusable and that the app slows badly right after earthquakes - when Japan relies on it during disasters - Musk replied 'I'll deal with it'. He gave a similar 'I'll check' to a user reporting triple billing on a gold-checkmark account.", "imp": "interesting", "iso": "2026-09-09T18:00:00Z"}, {"kind": "post", "t": "On Alex Gibney's Musk documentary", "s": "After the roughly four-hour Gibney documentary premiered in Venice, Musk spent a large share of the day attacking it and its director, calling the film 'a slander that misses the mark', saying Gibney 'has zero integrity' and is 'a bitter old man', and endorsing replies arguing the interviewees were selected for hostility. Gibney's film calls Musk a 'tech titan and a fraud'. This was the single largest cluster of his posts.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "reply", "t": "On OpenAI's $15M Millennium Prize run", "s": "Musk amplified a joke that 'OpenAI spent $15 million on tokens to solve a problem with a $1 million prize pool - typical AI economics', referring to OpenAI's claimed Navier-Stokes solution. Separately he called a demoed always-on AI work assistant 'creepy'.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "repost", "t": "On Starship's 14th flight and Starbase", "s": "Musk reposted a group who drove a Cybertruck roughly 350 miles to Starbase on Autopilot the whole way, noting the scale of construction there and that Starship is being prepared for its 14th flight later this month. He also observed that Starship and Cybertruck are both stainless steel.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "post", "t": "On internet access as the lever against poverty", "s": "Musk argued that low-cost, high-bandwidth internet is the single biggest lever for lifting people out of poverty - because a connection lets anyone learn free online and sell goods and services into a global market - framing Starlink's expansion, including in Argentina, in those terms.", "imp": "important", "iso": "2026-09-09T18:00:00Z"}, {"kind": "repost", "t": "On Powerwall 3 launching in Japan", "s": "Musk reposted the announcement that Tesla's Powerwall 3 home battery is now available in Japan.", "imp": "interesting", "iso": "2026-09-09T18:00:00Z"}, {"kind": "repost", "t": "On a 98-year-old FSD user", "s": "Musk amplified the story of Larry, 98, whose first car was a 1931 Ford Model A and who now drives a new Model Y everywhere on Autopilot using Grok for navigation, reporting no problems. Musk separately gave a heart to a clip of FSD stopping for a chipmunk crossing the road.", "imp": "interesting", "iso": "2026-09-09T18:00:00Z"}, {"kind": "repost", "t": "On Jared Isaacman backing orbital data centres", "s": "Musk reposted Jared Isaacman telling Fox News 'you never want to bet against Elon Musk', and that putting unwanted AI data centres in space to use 'a free fusion reactor' would be a good thing. Musk's own comment on the sceptics was 'very predictable'.", "imp": "interesting", "iso": "2026-09-09T18:00:00Z"}, {"kind": "repost", "t": "On Meta launching its Muse agent", "s": "Musk amplified Mark Zuckerberg introducing Muse, a personal agent Meta says understands a user's goals and works around the clock on them, alongside a post noting that almost all AI discussion now happens on X.", "imp": "interesting", "iso": "2026-09-09T18:00:00Z"}, {"kind": "reply", "t": "On Ashley St. Clair's claims", "s": "Musk dismissed reporting in The Guardian and the New York Post relaying claims by Ashley St. Clair about his private remarks, endorsing replies that characterised her as seeking attention. The underlying claims are contested and unverified; both sides are asserting, not documenting.", "imp": "interesting", "iso": "2026-09-09T18:00:00Z"}], "highlight": {"t": "Musk says Cybercab is built five times faster than a normal car - and robotaxi miles have jumped 2.6x in six weeks", "s": "The day's most substantive Musk claim was about manufacturing, not politics: Cybercab's line assembles modules in parallel and forms the body in one step, which he says makes production five times faster than conventional automobile assembly and halves the line's footprint. Alongside it, Tesla's robotaxi fleet reported going from roughly 380,000 autonomous miles at the Q2 earnings call to about 1 million in six weeks, and opened a commercial interest form for fleet buyers. Treat the production multiple as a company claim until independent teardowns land.", "href": "https://www.youtube.com/watch?v=X4vRgMeAg08"}}, "elonNews": [{"t": "The Verge rides in the steering-wheel-free Cybercab", "s": "A reporter spent an hour inside Tesla's two-seat Cybercab, which has no steering wheel or pedals, describing ride quality, the single 22-inch screen and how the vehicle handles hand-offs - a useful independent counterweight to Tesla's own production claims.", "url": "https://news.google.com/rss/articles/CBMilgFBVV95cUxPc0R1UDNoVTdLd3Z4NjNxbGFMdVRJbTNUWWRDUXFESlpCbWpXN01FR1p0WHVEMUZHbm1DMldTU2k1SG1lYnBvZ0g2S1VBZFBTZE14RFU0aGlNbWpBaW9qdFFYN1c3U3l0WjFKblIzSWR5NGJLMm1mZldsRlBjRy10SDkwOEpUMDZodHp0ZTRCWlhBYm1rR1E?oc=5", "published": "2026-09-09T14:41:07Z", "src": "The Verge"}, {"t": "A startup is strapping chip fabs to Falcon 9 rockets", "s": "Besxar plans to run semiconductor manufacturing in orbit, launching fab modules on SpaceX Falcon 9 flights to exploit vacuum and microgravity for wafer processing. Early-stage and capital-hungry, but it is a concrete instance of the orbital-industry thesis Musk allies were arguing for this week.", "url": "https://techcrunch.com/2026/09/09/besxar-is-strapping-advanced-chip-fabs-onto-spacexs-falcon-9-rockets/", "published": "2026-09-09T12:30:00Z", "src": "ai:tc-ai"}, {"t": "Grok arrives on Apple CarPlay", "s": "xAI's Grok assistant became available through Apple CarPlay, putting the model into the dashboard of any compatible car rather than only Tesla vehicles.", "url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxOaURsZWl5cHZETElmRVBZams2dlpFNEZ4SjlWMm1BR1A4VktqZVVYS0ZVU01xRWQxengzQzNUV1diMlNIRlZPTGFIeHZjUzhIaUZtRWh1cTNTWmhsdWpIUVZob2x4aHB3UDRDUTVURUstY0NRdG96LXBudmNHWkVlTmhrWWI4S29rRkY0UGhzV1d0eFhoMGVaRUpQNUF2d1lLMkpvODJPOXNDQQ?oc=5", "published": "2026-09-09T19:28:48Z", "src": "آي-فون إسلام"}, {"t": "Gibney's Musk documentary premieres at Venice", "s": "The roughly four-hour Alex Gibney documentary about Musk had its world premiere at the Venice film festival, alongside other titles. Musk has called the film commissioned work and spent much of the following day attacking it.", "url": "https://news.google.com/rss/articles/CBMiqgFBVV95cUxQM0pHdnZpMnNMQXU2UF9WVW9fakgteTNDdW9iVGM2Y0ctdUtGbXJBMnRRd0k2QVE3M1NYOTJNbkMyYlYzcEN5LVhVZ1N3MHFOaTNVVHprdnJvaTZtbTVIZ1NJS0w5TjB0eVdxWkpJR0VXc2J2ZzlIUFJTS0QyMkI2dVZjWTNhVWl1bEJoVlpYeXppUjZnSXNTYWRVVXpBZG9iRnIxQURtMy1lUQ?oc=5", "published": "2026-09-09T02:18:00Z", "src": "AP News"}, {"t": "Gibney and St. Clair make their case at Venice", "s": "The documentary's director and one of its subjects gave interviews at Venice setting out their argument about Musk's influence and AI. The claims are disputed by Musk and are not independently established.", "url": "https://news.google.com/rss/articles/CBMiqAFBVV95cUxPbE1jSFVfVXRfM3RFamdGano3X1dhazNQUm1jRU1uVHlIdmVQRldld25nOXJHak9ZRnd4a2FvRjlMTTBpZ2duZEpib2RYSTk3R0hXbU03eXVZUHYtNkdGaVVoeDctRnc2VGtLUGZxNFVtSFI5UW4xME91cEd3ZGtsRFB5blRMTkdhLVNxSVpxUGJwNmgydGhsSnRtMUZsYWdGUExQLUpUNkI?oc=5", "published": "2026-09-09T02:13:00Z", "src": "AP News"}], "elonNewsUpdated": "2026-09-10T02:46:31Z", "costs": {"updated": "2026-09-10T02:08:05+00:00", "items": [{"key": "usdinr", "label": "USD/INR", "unit /* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

  [...nav.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreMenu) [...moreMenu.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreBtn) moreBtn.classList.toggle("active",overflow.some(t=>t.id===id));
  store.set("tab",id);
  kbdIdx=-1; clearKbdCur(); applyFilter();
  if(!(opts&&opts.keepScroll)){ try{ window.scrollTo(0,0); }catch(e){} try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
}
// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();

</script>
