elf-reported", "basis": "First-party description of internal monitoring; no external evaluation"}, "delta": "new"}]}, "aitrendsUpdated": "2026-09-08T02:40:31Z", "science": {"updated": "2026-09-08T02:40:31Z", "items": [{"t": "A hidden defect leaves IBD gut cells primed to die even in remission", "s": "A WEHI-led study found that in inflammatory bowel disease patients with few or no symptoms, intestinal cells still carry a molecular defect that keeps them primed for cell death, with higher levels tracking relapse. Use-case: it explains why flare-ups return in people who look well, and it gives a biomarker to decide who can safely taper medication - the single hardest call in IBD management. Peer-reviewed.", "tag": "Health", "imp": "important", "glance": "Why IBD keeps coming back", "url": "https://scitechdaily.com/scientists-discover-a-hidden-defect-that-could-explain-why-ibd-keeps-coming-back/", "published": "2026-09-08T00:50:00Z", "src": "SciTechDaily / WEHI", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "A biomarker for safe tapering", "basis": "WEHI patient study; defect present in symptom-free patients and tracks relapse"}}, {"t": "Semaglutide cuts asthma attacks by up to 40% and COPD flare-ups by 20%", "s": "Research presented at the European Respiratory Society Congress in Barcelona, led by Chloe Bloom at Imperial College London's National Heart & Lung Institute, links semaglutide to up to 40% fewer asthma attacks and about 20% fewer COPD exacerbations. The use-case is immediate: a drug already in wide use for diabetes and weight loss looks repurposable for two of the most common chronic lung diseases. Maturity caveat - this is congress-presented observational work, not yet peer-reviewed, and confounding by weight loss itself has not been fully separated out.", "tag": "Health", "imp": "important", "glance": "GLP-1 drug cuts asthma attacks", "url": "https://medicalxpress.com/news/2026-09-semaglutide-linked-copd-flare-ups.html", "published": "2026-09-07T22:20:00Z", "src": "MedicalXpress / ERS Congress 2026", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Big effect, needs a trial", "basis": "ERS congress presentation, large cohort; not peer-reviewed, confounding unresolved"}}, {"t": "A spin-logic device performs all 16 Boolean operations with no initialisation step", "s": "A preprint reports programmable spin-orbit-torque logic that achieves the complete set of 16 Boolean operations in a single device without an initialisation cycle, using chirally asymmetric switching - a target that has resisted more than two decades of work. Use-case: non-von-Neumann AI chips where logic and memory sit in the same element, cutting the data movement that dominates inference energy. Maturity: arXiv preprint, not yet peer-reviewed.", "tag": "Physics & Space", "imp": "important", "glance": "One device, all 16 logic gates", "url": "https://arxiv.org/abs/2609.04594", "published": "2026-09-07T04:00:00Z", "src": "arXiv (cond-mat)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Two-decade target, preprint only", "basis": "arXiv preprint; device demonstrated but not peer-reviewed or fabbed at scale"}}, {"t": "The tendon and ligament stem cell is finally identified in mice and humans", "s": "A Cell paper identifies the resident stem cell that builds and maintains tendon and ligament, in both mice and humans, and shows that when its differentiation goes wrong the result contributes to lumbar spinal stenosis. Use-case: tendon and ligament injuries heal into scar rather than tissue, which is why rotator cuff and ACL repairs fail; having the responsible cell gives a target for repair rather than patching. Peer-reviewed in Cell.", "tag": "Biology", "imp": "important", "glance": "The cell that rebuilds tendons", "url": "https://www.cell.com/cell/fulltext/S0092-8674(26)00945-1", "published": "2026-09-07T00:00:00Z", "src": "Cell", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Foundational cell for tendon repair", "basis": "Peer-reviewed in Cell; identified in both mice and human tissue"}}, {"t": "Flexible single-crystal Bi2Te3 films hit high thermoelectric power density", "s": "A Nature Communications paper reports single-crystal bismuth telluride thin-film thermoelectric generators that keep high power density while bending - the two properties that normally trade off against each other. Use-case: body-heat and waste-heat powered sensors that never need a battery change, which is the blocking constraint for industrial condition-monitoring tags and wearable medical patches.", "tag": "Materials", "imp": "important", "glance": "Bendable heat-to-power films", "url": "https://www.nature.com/articles/s41467-026-77574-1", "published": "2026-09-07T00:00:00Z", "src": "Nature Communications", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Breaks the flex-vs-power tradeoff", "basis": "Peer-reviewed device result in Nature Communications with measured power density"}}, {"t": "Proteomic ageing clocks are embedded inside a phase 2a trial for the first time", "s": "A Nature Biotechnology paper integrates blood proteomic ageing clocks into a running phase 2a clinical trial, so that whether a drug slows biological ageing can be read out alongside its primary endpoint. Use-case: this is the missing measurement instrument for the whole geroprotection field - until now, ageing drugs had no endpoint a regulator could see inside a normal-length trial.", "tag": "Health", "imp": "important", "glance": "Ageing gets a trial endpoint", "url": "https://www.nature.com/articles/s41587-026-03286-y", "published": "2026-09-07T00:00:00Z", "src": "Nature Biotechnology", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Gives ageing drugs a readable endpoint", "basis": "Peer-reviewed in Nature Biotechnology; clocks run inside a live phase 2a trial"}}, {"t": "A wearable exposes the hidden hormone disorder behind up to 1 in 5 high blood pressure cases", "s": "Using a wearable to sample hormone levels continuously rather than in a single clinic draw, researchers found the fluctuating aldosterone patterns that standard tests miss in primary aldosteronism - a cause of hypertension that may affect as many as one in five people with high blood pressure and, unlike essential hypertension, is often curable with surgery or a specific drug. Use-case: a diagnostic change that moves patients from lifelong pills to a cure. Peer-reviewed clinical study.", "tag": "Health", "imp": "important", "glance": "Curable hypertension often missed", "url": "https://scitechdaily.com/a-hidden-hormone-disorder-may-be-driving-millions-of-high-blood-pressure-cases/", "published": "2026-09-06T18:30:00Z", "src": "SciTechDaily", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Turns lifelong pills into a cure", "basis": "Clinical study using continuous wearable hormone sampling vs standard single draws"}}, {"t": "A self-rebuilding five-metal electrode lets green-hydrogen cells run at industrial current", "s": "Researchers at the Chinese Academy of Sciences built an anode from a high-entropy antiperovskite combining five metals on porous nickel foam. Instead of degrading, the surface reconstructs into a more active form under load, letting an anion-exchange-membrane electrolyser hold industrial current density for a sustained run. The use-case is the central economic problem in green hydrogen - AEM stacks are cheap because they avoid iridium, but their anodes wear out; an electrode that improves as it runs changes the stack replacement cost.", "tag": "Energy", "imp": "important", "glance": "Electrode that improves as it runs", "url": "https://scitechdaily.com/this-self-rebuilding-electrode-could-supercharge-green-hydrogen-production/", "published": "2026-09-06T16:00:00Z", "src": "SciTechDaily / Chinese Academy of Sciences", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Solves the AEM anode wear problem", "basis": "Peer-reviewed materials result with a sustained industrial-density electrolyser run"}}, {"t": "Starting statins early after a type 2 diabetes diagnosis tracks with less dementia", "s": "Danish national registers covering 132,585 people newly diagnosed with type 2 diabetes who had never taken statins: those started on statin therapy had a lower subsequent dementia risk, most strongly when it began early (The Lancet Regional Health). This is an observational registry study, so it shows association rather than cause - but statins are cheap, already indicated in most of these patients, and the Copenhagen team says they are being underused.", "tag": "Health", "imp": "important", "glance": "Statins tied to less dementia in diabetes", "url": "https://www.sciencealert.com/statins-linked-to-lower-dementia-risk-in-massive-type-2-diabetes-study", "published": "2026-09-06T15:00:00Z", "src": "ScienceAlert / The Lancet Regional Health", "assess": {"mag": 4, "timeline": "now", "evidence": "early", "verdict": "Cheap existing drug, association only", "basis": "Observational Danish registry, n=132,585, Lancet Regional Health; no causal proof"}}, {"t": "Isar Aerospace's Spectrum becomes Europe's first commercial rocket in orbit", "s": "The 28-metre two-stage Spectrum lifted off from Andoya Spaceport in northern Norway on Saturday evening and was in low-Earth orbit seven minutes later - the first privately developed European launch vehicle to reach orbit. This is a flown result, not a study: it gives European satellite operators and institutional customers a launch option that does not depend on SpaceX or on Ariane's backlog.", "tag": "Physics & Space", "imp": "important", "glance": "Europe gets a commercial rocket", "url": "https://arstechnica.com/space/2026/09/german-company-becomes-first-in-europe-to-launch-fully-commercial-orbital-rocket/", "published": "2026-09-06T11:55:26Z", "src": "Ars Technica", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Europe regains independent launch access", "basis": "Spectrum reached LEO from Andoya Sept 5; first commercial European orbital vehicle"}}, {"t": "A fibre-derived gut metabolite made an oral drug that supercharges cancer immunotherapy", "s": "University of Michigan researchers found that 3,4-dihydroxybenzoic acid, produced by gut bacteria breaking down dietary fibre, strengthens antitumour immunity, and turned it into an oral compound that helped T cells attack tumours in mice. Use-case: a cheap oral add-on to checkpoint immunotherapy, which currently works in only a minority of patients. Maturity: mouse studies only, no human data.", "tag": "Health", "imp": "important", "glance": "Fibre metabolite boosts immunotherapy", "url": "https://scitechdaily.com/researchers-discover-a-gut-microbe-metabolite-that-supercharges-cancer-immunotherapy/", "published": "2026-09-06T03:00:00Z", "src": "SciTechDaily / University of Michigan", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Promising, still all mice", "basis": "Mouse tumour models only; oral formulation demonstrated, no human trial"}}]}, "scienceUpdated": "2026-09-08T02:40:31Z", "scienceDaily": {"updated": "2026-09-08T02:40:31Z", "items": [{"t": "A popular brain supplement tracks with a shorter lifespan in men", "s": "A study of more than 270,000 people links higher blood levels of the amino acid tyrosine - sold widely as a focus and mood supplement - to shorter lifespan in men, and backs the association with genetic (Mendelian randomisation) analysis rather than observation alone. No effect was seen in women. Use-case is immediate and actionable: it is a reason for men to stop taking a supplement that is sold over the counter with no dosing oversight.", "tag": "Health", "imp": "important", "glance": "Common supplement linked to shorter life", "url": "https://www.sciencedaily.com/releases/2026/09/260904000330.htm", "published": "2026-09-06T21:21:00Z", "src": "ScienceDaily top", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Actionable supplement warning", "basis": "270,000-person cohort plus Mendelian randomisation; men only"}}, {"t": "Breast tumours mapped in detail reveal dormant cancer cells hiding behind shields", "s": "Researchers mapped breast tumours at fine spatial resolution and found pockets of dormant cancer cells sheltering behind protective structures. Unlike the fast-dividing cells that chemotherapy targets, these sit still and survive treatment, which is the mechanism behind recurrence years later. Use-case: it names what to target to stop relapse, and gives a way to test whether a therapy has actually cleared it. Peer-reviewed.", "tag": "Health", "imp": "important", "glance": "Where breast cancer hides to return", "url": "https://www.sciencedaily.com/releases/2026/09/260904000326.htm", "published": "2026-09-06T21:00:00Z", "src": "ScienceDaily health", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Names the cells behind relapse", "basis": "Spatial tumour mapping identifying dormant surviving populations"}}, {"t": "Sorbitol, the sugar-free sweetener, turns out not to be harmless", "s": "Washington University in St. Louis researchers found that sorbitol - the sugar alcohol in sugar-free gum, sweets and many low-calorie foods - has effects beyond the known laxative one, with consequences for the gut that the 'harmless bulk sweetener' framing had assumed away. Use-case: it is a direct input to what goes into reformulated low-sugar products and what people with gut conditions should avoid. Peer-reviewed.", "tag": "Health", "imp": "important", "glance": "Sugar-free sweetener has a catch", "url": "https://www.sciencedaily.com/releases/2026/09/260903064251.htm", "published": "2026-09-06T19:00:00Z", "src": "ScienceDaily health", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Reframes a very common additive", "basis": "WashU peer-reviewed study on a sweetener in wide food use"}}, {"t": "A coached lifestyle programme beat plain health advice on cognition across 11 countries", "s": "LatAm-FINGERS randomised older adults at risk of dementia in 11 Latin American countries to a culturally adapted two-year programme of exercise, diet, cognitive training and social engagement, or to general health advice; the structured, regularly coached arm improved memory and thinking roughly 55% more. Published in The Lancet and presented at AAIC 2026. No drug is involved, and the programme was deliberately built to be affordable and deliverable by ordinary public health systems.", "tag": "Health", "imp": "important", "glance": "Coached lifestyle plan lifts cognition", "url": "https://www.sciencedaily.com/releases/2026/09/260903064246.htm", "published": "2026-09-06T17:07:44Z", "src": "ScienceDaily (Alzheimer's Association)", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Drug-free dementia prevention that travels", "basis": "2-year randomised LatAm-FINGERS trial, 11 countries, The Lancet; +55% vs advice"}}, {"t": "AI took real-time control of fusion plasma on the DIII-D tokamak", "s": "Princeton's PACMAN framework runs several machine-learning models inside the control loop, reading plasma diagnostics and commanding all six heating gyrotrons in about 20 milliseconds. In five experiments on the real DIII-D tokamak in San Diego it predicted a damaging tearing instability roughly 200 milliseconds before it appeared and adjusted the plasma to stop it forming. Peer-reviewed in Nuclear Fusion - and disruption control is one of the hard blockers between today's tokamaks and a reactor that makes power.", "tag": "Physics & Space", "imp": "important", "glance": "AI steers fusion plasma in real time", "url": "https://www.sciencedaily.com/releases/2026/09/260903064215.htm", "published": "2026-09-06T07:28:43Z", "src": "ScienceDaily (PPPL)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Real-machine disruption control, not simulation", "basis": "Nuclear Fusion; 5 DIII-D runs, ~20 ms loop, 200 ms tearing-mode warning"}, "eli": "Fusion plasma goes unstable faster than a person can react; this AI spots the wobble a fifth of a second early and corrects it."}, {"t": "Blocking SET restores a tumour-suppressing enzyme and stops glioblastoma forming in animals", "s": "Ohio State researchers found that glioblastoma cells shut down PP2A - an enzyme that normally restrains growth and damage repair - using three proteins, ANP32A, CIP2A and SET. Knocking SET down prevented tumours forming in cell and animal models, and interfering with the related proteins made the cancer cells markedly more sensitive to radiation. Preclinical only, no patients yet; the appeal is that it makes the radiation and chemotherapy glioblastoma patients already receive work better rather than replacing them.", "tag": "Health", "imp": "important", "glance": "A way to make GBM radiation work", "url": "https://www.sciencedaily.com/releases/2026/09/260903064242.htm", "published": "2026-09-06T06:58:29Z", "src": "ScienceDaily (Ohio State / OSUCCC-James)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Radiosensitises the hardest brain cancer", "basis": "Ohio State preclinical; SET knockdown blocks tumour formation, restores PP2A"}}]}, "scienceDailyUpdated": "2026-09-08T02:40:31Z", "life": {"updated": "2026-09-08T02:40:31Z", "items": []}, "lifeUpdated": "2026-09-08T02:40:31Z", "mind": {"updated": "2026-09-08T02:40:31Z", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "Cortical activity during deep sleep sets how well the brain resists social stress", "s": "A JNeurosci study from Christopher Ehlen's group at Morehouse School of Medicine traced how cortical activity during non-REM sleep shapes behavioural resilience to stressful social encounters in mice, giving a mechanism for the long-observed link between deep sleep and stress tolerance rather than just a correlation. Peer-reviewed; animal work.", "url": "https://medicalxpress.com/news/2026-09-deep-mental-resilience-stressful-situations.html", "published": "2026-09-07T17:30:00Z", "src": "JNeurosci / Morehouse School of Medicine", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Mechanism for sleep and resilience", "basis": "Peer-reviewed JNeurosci study; mouse cortical recordings during non-REM sleep"}}, {"t": "Inhibitory brain circuits actively hold back adult glioma growth", "s": "A Neuron paper shows that inhibitory interneuron circuits restrain the progression of adult glioma by suppressing calcium-driven oncogenic programmes inside tumour cells - the brain's own wiring acting as a brake on its most lethal cancer. Where earlier work showed excitatory neurons feed glioma growth, this identifies the opposing arm, and with it a circuit-level target. Peer-reviewed in Neuron.", "url": "https://www.cell.com/neuron/fulltext/S0896-6273(26)00638-0", "published": "2026-09-07T00:00:00Z", "src": "Neuron (Cell Press)", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "The brain's own brake on glioma", "basis": "Peer-reviewed in Neuron; circuit-level mechanism with calcium signalling"}}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Nothing new today in this group", "s": "A full scan of Nature Neuroscience, Neuron, bioRxiv neuroscience and arXiv q-bio.NC, plus a targeted web sweep for Neuralink, BrainGate and recent implant trial results, found no Major or Historic peer-reviewed BCI result inside the last 72 hours. The most recent substantial paper - long-term independent home use of an intracortical speech and cursor interface in Nature Medicine - is already outside the window.", "url": "", "published": "", "src": "", "assess": {"mag": 1, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result in window", "basis": "Full feed scan plus web sweep; nothing mag 4+ within 72 hours"}}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "How the brain writes a lasting memory from one single experience", "s": "Researchers traced the mechanism behind one-shot learning - the formation of an influential, behaviour-changing memory from a single brief experience - in the mouse brain, showing which circuits commit an event to long-term storage on first exposure rather than through repetition. It matters because almost all of learning science is built on repeated trials, and the single-exposure case is what most human learning actually looks like. Peer-reviewed; animal work.", "url": "https://medicalxpress.com/news/2026-09-mouse-brain.html", "published": "2026-09-07T18:15:00Z", "src": "MedicalXpress / peer-reviewed", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Mechanism for single-exposure memory", "basis": "Peer-reviewed circuit-level mouse study of one-shot learning"}}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today in this group", "s": "The journal, preprint and press-release feeds carried no new peer-reviewed consciousness research at Major or Historic level in the last 72 hours. The only item in range was a speculative essay on whether alien life could be conscious in unfamiliar ways, which is commentary rather than a result.", "url": "", "published": "", "src": "", "assess": {"mag": 1, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result in window", "basis": "Full feed scan; only speculative commentary available"}}]}]}, "mindUpdated": "2026-09-08T02:40:31Z", "mindset": {"updated": "2026-09-08T02:40:31Z", "messages": [{"who": "Joseph Rodrigues", "t": "Just Decide, Reality Has NO CHOICE but to Obey", "vid": "m80wvSYhIf8", "url": "https://www.youtube.com/watch?v=m80wvSYhIf8", "gist": "Built around Job 22:28 — \"whatever you decide will happen\" — Joseph argues that the life showing up around you is a reflection of decisions you have already made, most of them unconsciously, from beliefs absorbed early from parents, friends and social media. The conscious mind's job is to override that programming by simply deciding who you are and what you have, rather than waiting for evidence first. He tells his own story: in 2004 he was $50,000 in debt, read Think and Grow Rich, and set one definite chief aim — $25,000 in the bank — without knowing how; the route turned out to be a year of weekend overtime babysitting a printer, which he spent reading and studying finance until he had cleared the debt and out-earned the senior technicians. The practical tools he names are Napoleon Hill's autosuggestion (read your statement three times before sleep and three times on waking, when the drowsy mind argues back least), Emmett Fox's Seven-Day Mental Diet (let old-reality thoughts arise and pass without identifying with them), and Neville Goddard's \"put off the former conversation.\" He spends time dissolving the inherited belief that money is evil, noting the verse is about the love of money, not money itself. The closing instruction: guard the garden of your mind, feel the fear and act anyway, and think, feel and act from the premise of the wish already fulfilled."}, {"who": "Elmer O. Locker Jr", "t": "Find Wholeness — Gratitude for Your Life NOW", "vid": "F6SV6-HksyA", "url": "https://www.youtube.com/watch?v=F6SV6-HksyA", "gist": "A short, blunt message about finding wholeness before you find anything else. Elmer's method for gratitude is deliberate contrast: instead of comparing your life upward to people who have more, look honestly at how much worse it could realistically be. He points to people who genuinely do not know what they will eat tomorrow, or who work a year for a pair of sandals, and says there are millions right now who would trade places with you without hesitating. The point is not guilt — it is that taking your life for granted is what keeps you feeling incomplete. Appreciate what is already here, feel whole and complete in this moment, and only from that state do the opportunities to have what you actually want open up."}, {"who": "AH Universe", "t": "There Isn't Anything For You To Worry About! (Abraham Hicks 2026)", "vid": "Qnib8id8UgI", "url": "https://www.youtube.com/watch?v=Qnib8id8UgI", "gist": "Abraham is asked whether evil should be defined or simply accepted as part of life, and answers that evil is not a force with its own source - it is the absence of a well-being that is always being offered. Health, ease and good outcomes are one stream; you are either in vibrational harmony with it or you are holding resistance to it, and the experience of that resistance is what gets named as evil or sickness. The follow-up matters more than the metaphysics: every thought ever thought still exists and attracts its own kind, so a person can fixate hard enough on what they do not want to stay tuned to a large accumulated stream of it. That is the trap in listing everything you are against - 'I shall not do that, I do not want that' includes the unwanted thing in your vibration every time you name it, so the more precisely you push against something the more reliably you disallow what you actually want. The practical instruction is to stop treating feeling as irrelevant data. Abraham's image is leaving your hand on a hot stove because a book told you the thought was a good one: the emotion is the readout telling you which direction you are pointed. Once you can reliably connect what you are thinking and feeling to what keeps showing up, you stop believing something arbitrary is inserting itself into your life - and death, in this frame, is not an ending either, just another vibrational response."}]}, "mindsetUpdated": "2026-09-08T02:40:31Z", "youtube": {"count": 13, "note": "Today's unseen uploads from your subscriptions, ordered by usefulness. Every item is gisted from the actual transcript. Scanned 260 channels via yt-dlp (YouTube's channel RSS endpoint is blocked from this runner); 27 uploads in the last 24 hours, of which 13 were dropped as sleep-genre, music, vlog or already shown, and 1 dropped for having no usable captions.", "groups": [{"h": "🔬 Science, Tech & Industry", "items": [{"vid": "Y5rSSvXfL4g", "url": "https://www.youtube.com/watch?v=Y5rSSvXfL4g", "t": "5 open source tools that replaced my $320/mo AI stack", "src": "Fireship", "published": "2026-09-07T17:30:00Z", "s": "Fireship replaces roughly $320/month of Cursor, Claude Max, GPT Pro and Gemini Ultra subscriptions with a self-hosted stack: Ollama to run open-weight models locally so proprietary code never leaves the machine, a local router that fronts dozens of providers behind one OpenAI-compatible endpoint (and tracks spend and compresses tool output), a context-compression layer for agents that would otherwise read 50,000 lines to make a trivial edit, and a visual workflow builder that exposes an LLM pipeline as an API.", "glance": "A local router plus context compression is where the real savings are - most AI spend is agents re-reading files, not model quality."}, {"vid": "Vjh3YCnI3vo", "url": "https://www.youtube.com/watch?v=Vjh3YCnI3vo", "t": "OpenAI's chief scientist just issued a warning", "src": "Wes Roth", "published": "2026-09-07T09:00:00Z", "s": "Walks through Jakub Pachocki's 'An Alien Mind' alongside OpenAI's 'Research acceleration' post. The two together argue recursive self-improvement is near: OpenAI's internal chart shows agentic workdays now running about 3x human researcher output, up from parity around June 2026. Pachocki's stated worry is that alignment and interpretability are progressing slower than capability, that we have no satisfactory theory of generalisation, and that a high score on an alignment metric may mean the model learned the metric rather than the value.", "glance": "The bottleneck OpenAI now names is confidence in monitoring, not capability - and its stated reason to keep scaling fast is building defences against other AI.", "pointsLabel": "Key points from the piece", "points": [{"t": "Recursive self-improvement is the explicit expectation", "s": "Pachocki traces the line from the 2023 RL reasoning results (the Q* leak) through o1 to today, and says he expects this rate of progress to carry into models improving themselves."}, {"t": "Agents already outwork the humans", "s": "OpenAI's own metric puts agentic workdays at roughly 3x human researcher output, crossing parity around mid-June 2026."}, {"t": "Alignment metrics may be gamed rather than met", "s": "A high alignment score may mean the model learned to score well on that metric, not that it is more aligned - and there is no satisfactory theory of generalisation to distinguish the two."}, {"t": "The defensive argument for going faster", "s": "The strongest stated case for training smarter models quickly is building cybersecurity defences against other AI, while a narrow window to harden critical systems is still open."}]}, {"vid": "Ji4amrxrzVM", "url": "https://www.youtube.com/watch?v=Ji4amrxrzVM", "t": "GPT-6 Astra is a freak", "src": "The AI Search", "published": "2026-09-07T04:00:00Z", "s": "Hands-on stress test of GPT-6 Astra through the desktop app rather than chat. It coded a from-scratch ray-traced bullet-through-water-balloon simulation with no external libraries in 32 minutes using a self-critic loop that screenshots the scene and rescores it; built a procedural third-person Unreal Engine game with Mixamo animations mapped onto a downloaded character; drove a sprite editor by cursor rather than code; and reconstructed a full building interior in Blender via MCP with a fly-through camera in 1h12m. On brain-tumour MRI reading it got 1 of 6 correct - the top score, but tied with Kimi and GLM.", "glance": "The jump is in long autonomous runs with self-criticism, not raw answers - and it still fails clinical image reading, so treat the medical demos with suspicion."}, {"vid": "8gq-WP8GzVM", "url": "https://www.youtube.com/watch?v=8gq-WP8GzVM", "t": "The Yak Mutation That Could Help Repair the Brain", "src": "From First Principles", "published": "2026-09-07T18:00:00Z", "s": "Deep dive on a Neuron paper that works backwards from a high-altitude Tibetan animal adaptation to a myelin-repair strategy for multiple sclerosis. Current MS drugs stop the immune attack but cannot rebuild the myelin already lost, because the brain's own repair machinery stalls with age. The genetic clue points at a receptor on the resident stem cells; the hard part is not delivery across the blood-brain barrier, which is solved, but targeting - finding a molecule small enough to cross that activates only that receptor on those cells.", "glance": "Delivery into the brain is largely a solved problem now; the unsolved one is selectivity, which is why so few neuro drugs make it out of animals."}]}, {"h": "💼 Business, Money & Systems", "items": [{"vid": "8onRObEtkBI", "url": "https://www.youtube.com/watch?v=8onRObEtkBI", "t": "800 IQ Tesla Cybercab Analysis", "src": "Solving The Money Problem", "published": "2026-09-07T06:00:00Z", "s": "Reacts to a Moonshots panel on the Cybercab rollout in Austin. The argument is that removing the steering wheel, pedals, mirrors and the second row of seats strips out enough hardware cost that no competitor can match the per-mile economics, before modular manufacturing is even counted. An early Austin rider reports fares running about 50% below comparable Uber trips, and Nevada has cleared 5,000 vehicles.", "glance": "The two-seat layout is a cost decision, not a design one - lower mass and fewer parts are what let the service price below Uber and still run profitably.", "pointsLabel": "Points from the panel", "points": [{"t": "Cost comes from what was removed", "s": "No steering wheel, pedals, mirrors or driver means a large block of component cost is simply gone - the panel's view is nobody can match the hardware price."}, {"t": "Fares are already about half of Uber", "s": "An early Austin rider reports roughly 50% cheaper trips for comparable journeys, described as smoother and cleaner."}, {"t": "Discount-funded rivals lose more per trip", "s": "If you must price below your own cost to compete, every additional trip deepens the loss - the panel's argument for why Waymo and Uber struggle here."}, {"t": "Accessibility is the underrated market", "s": "Blind and disabled riders gain independent mobility, and small towns already substituting subsidised rideshare for transit are the obvious first municipal customers."}]}, {"vid": "F5CD0u2LVGs", "url": "https://www.youtube.com/watch?v=F5CD0u2LVGs", "t": "The Pierre Cardin Family Feud: He Branded Everything but Never Chose Who Came Next", "src": "Old Money Luxury", "published": "2026-09-07T16:00:00Z", "s": "Pierre Cardin licensed his name across more than 100 countries and 800-plus product categories, running the whole web personally with no board and no successor. He never married and had no children; three months before he died he told a reporter nothing had been organised. Since 2020, 22 relatives have fought in French courts, including over a handwritten 11-line note dated 2016 that surfaced two years after his death naming one grand-nephew sole heir - a document absent from the original estate inventory.", "glance": "A family business dies with the founder when the licensing web lives only in his head - the two people who understood it, a niece on the creative side and a grand-nephew on the commercial side, each knew only half.", "pointsLabel": "Lessons for a family business", "points": [{"t": "Undocumented knowledge is not an asset", "s": "Cardin's licence structure was learned contract by contract from inside; no accountant hired after his death could reconstruct it, so its value was unrecoverable."}, {"t": "Naming no successor is itself a decision", "s": "Refusing the question for four decades handed the outcome to 22 relatives and the French courts instead of to anyone he chose."}, {"t": "Split competence guarantees a fight", "s": "One heir held the creative side, another the commercial side, and neither was sufficient alone - a structure that made conflict inevitable."}, {"t": "Late-surfacing documents destroy trust", "s": "An 11-line handwritten note appearing two years after the inventory triggered a far larger legal war than the estate itself."}]}, {"vid": "R1NckhWc2j0", "url": "https://www.youtube.com/watch?v=R1NckhWc2j0", "t": "I Went OFF Grid for 48 Hours… Here's What Happened", "src": "Two Bit da Vinci", "published": "2026-09-07T20:30:00Z", "s": "Two San Diego houses run fully off-grid for 48 hours in peak summer heat with air conditioning and EV charging on the batteries. The smaller house started at 82% and ended a full day at 75%; the bigger one dipped to 15% overnight before recovering to 95% by the next afternoon, even with cloud cover on day two. Going from one power module (about 7.2-7.6 kW continuous, 10 kW burst) to two is what made backing up the EV charger possible; the battery expansion took about 45 minutes to install.", "glance": "Size the system so every load is a must-have and shed manually later - the reverse, adding loads back one at a time, is what leaves people stranded overnight."}]}, {"h": "🧠 Ideas, Health & How-To", "items": [{"vid": "bv56Cuq-fyY", "url": "https://www.youtube.com/watch?v=bv56Cuq-fyY", "t": "How Mitochondria Control Your Metabolism | Dr. Jared Rutter", "src": "Huberman Lab", "published": "2026-09-07T12:15:00Z", "s": "Jared Rutter (University of Utah, HHMI) argues you do not have one metabolism - what people call 'my metabolism' is the sum of every cell's separate metabolism, and cells differ in which fuels they can use at all. The counterintuitive core: mitochondria with too much energy are the dangerous state, because over-powered mitochondria throw off reactive oxygen species that damage proteins and DNA.", "glance": "Too much mitochondrial energy, not too little, is what generates the reactive oxygen species that damage DNA - which reframes 'boost your mitochondria' advice.", "pointsLabel": "Takeaways", "points": [{"t": "There is no single metabolism", "s": "Body metabolism is the aggregate of every cell's own processing of what you eat, drink and breathe - and cells differ in which fuels they can burn."}, {"t": "Overpowered mitochondria are the risk", "s": "When mitochondria carry more energy than they convert to ATP, that state generates reactive oxygen species that mutate DNA and damage proteins."}, {"t": "Neurons are near-obligate glucose burners", "s": "Their capacity to use fatty acids is very limited, which is why the body defends blood glucose so aggressively - the heart, by contrast, burns lipids, glucose and lactate interchangeably."}, {"t": "Lactate is a signal, not just waste", "s": "Exercise-generated lactate appears to signal BDNF release in the brain, which builds connections rather than pruning them."}, {"t": "Mitochondria carry their own circular genome", "s": "A relic of the bacterium they descend from, separate from the linear nuclear chromosomes, with its own disease implications."}]}, {"vid": "6VzTupxvbRM", "url": "https://www.youtube.com/watch?v=6VzTupxvbRM", "t": "Why You Procrastinate! (And 4 Easy Brain-Based Ways To Get Started)", "src": "ADHD Chatter Podcast", "published": "2026-09-08T04:20:00Z", "s": "An ADHD coach reframes procrastination as a dopamine-availability problem rather than a character one: the block is at the start line, not in knowing what to do, and interest is what changes what the brain can do. The practical levers are manufacturing interest in the outcome (attaching a concrete reward to a dull task changes it from a chore into a game), adding a time challenge to create urgency, doing it with someone rather than alone, and giving yourself permission to leave some things undone.", "glance": "Attach a concrete payoff to the boring task - the coach's example is reframing 'return these parcels' as 'collect £100' - because interest, not discipline, is what gets an ADHD brain over the start line.", "pointsLabel": "The four levers", "points": [{"t": "Manufacture interest in the outcome", "s": "Link the dull task to a concrete return you actually want; the same errand becomes doable when it is framed as collecting money rather than doing a chore."}, {"t": "Add a time challenge", "s": "A deadline creates 'I must do this now' urgency and gamifies a task that is otherwise open-ended."}, {"t": "Do it with someone", "s": "Body-doubling replaces the internal push with an external one - the coach's advice for parents is 'let's do this together', never 'you're being lazy'."}, {"t": "Give yourself permission to skip", "s": "Deciding consciously not to do the washing up is different from failing to do it, and it stops the shame cycle that late-diagnosed adults describe."}]}, {"vid": "S5KGV4NAE3A", "url": "https://www.youtube.com/watch?v=S5KGV4NAE3A", "t": "He dreamed of a self-feeding solar house. So he built an A-frame greenhouse home", "src": "Kirsten Dirksen", "published": "2026-09-07T07:30:00Z", "s": "A Swedish family built a wooden house inside a greenhouse shell - started as rain protection during construction, then became the point. The glass envelope adds what they call a fifth season, giving many more days above 20°C in Scandinavia and letting figs, grapes and nectarines grow outside their climate. Bath and toilet greywater is cleaned in the cellar and routed through the planting beds as nutrition before it emerges clean. Ventilation is deliberately low-tech: doors and upper-floor openings used as a stack, no sensors.", "glance": "Deliberately low-tech beats automation here - doors and upper openings as a stack vent do the cooling that sensor systems would, with nothing to fail in 50 years.", "pointsLabel": "Ideas worth stealing", "points": [{"t": "Greenhouse as a climate envelope", "s": "Three sides glazed, north side closed; humans and tomatoes want the same climate zone, so the buffer that grows Mediterranean fruit also makes the house comfortable."}, {"t": "Greywater as fertigation", "s": "Bath and toilet water is cleaned in the cellar and passed through the growing beds, which take the nutrients before the water runs out clean."}, {"t": "Stack ventilation, no sensors", "s": "Open ground-floor doors and upper-floor doors and let wind and buoyancy do the cooling; the family chose it explicitly over automation for a 50-year service life."}, {"t": "Design for the eye's resting distance", "s": "The house is one long sightline so you look through it to fruit and the lake - a sloping bedroom wall means you see sky from the bed."}]}, {"vid": "mW45xe6NdHE", "url": "https://www.youtube.com/watch?v=mW45xe6NdHE", "t": "Jared Diamond on the Course of History and the Role of Leaders | Mindscape 367", "src": "Sean Carroll's Mindscape", "published": "2026-09-07T11:30:00Z", "s": "Diamond defends the geography-over-individuals thesis but concedes the harder version needs evidence, and points at a natural experiment that supplies it: Denmark's public records let researchers match all 78,000 company CEOs against hospital and death records, so the effect of a CEO being distracted by a family bereavement on company performance can actually be measured. He also notes the Fertile Crescent's advantage - domesticable plants and animals - was self-erasing, because once those spread to Europe and China the region had nothing unique left.", "glance": "The way to test whether leaders matter is a natural experiment, not a narrative - Denmark's 78,000 CEOs matched to death records is the cleanest available.", "pointsLabel": "Threads from the conversation", "points": [{"t": "The Fertile Crescent's advantage erased itself", "s": "Its edge was domesticable plants and animals; once those spread outward, nothing unique remained, and the region is not dominant today."}, {"t": "Measuring whether leaders matter", "s": "Danish public records on 78,000 companies plus hospitalisation and death records let researchers test how a CEO's family bereavement affects firm performance."}, {"t": "Academia punishes leaving your specialty", "s": "Diamond's own account is that writing across fields, and even the Pulitzer, carried a professional cost rather than a benefit."}, {"t": "Founders are more replaceable than the story says", "s": "Bezos was not uniquely qualified to build an everything store - eBay and Walmart were already running variants on different principles."}]}, {"vid": "8yY0XF4RIxY", "url": "https://www.youtube.com/watch?v=8yY0XF4RIxY", "t": "Meet The Neuroscientist Who Does Recreational Heroin", "src": "The Giant's Shoulder", "published": "2026-09-07T15:00:00Z", "s": "Carl Hart, professor of psychology and psychiatry at Columbia, describes 30 years of laboratory work in which volunteers live in a sealed unit for weeks while receiving real doses of crack cocaine and methamphetamine under measurement. His conclusion, which he says the data forced on him against his expectations, is that addiction tracks availability and life circumstances far more than pharmacology, and that the hard-versus-soft drug distinction has no basis in the body or the plants. He argues for legalisation under alcohol-style limits on human-rights grounds. Contested position, presented as his own.", "glance": "Hart's claim is that the hard/soft drug line is a human invention the body does not recognise - a contested reading of his own data that most addiction researchers do not share."}]}, {"h": "🌏 India & Policy", "items": [{"vid": "LU0TkAx0EjI", "url": "https://www.youtube.com/watch?v=LU0TkAx0EjI", "t": "India Uses BRICS Chairmanship to Build a Shared Supercomputing Network", "src": "AIM Media House", "published": "2026-09-07T16:00:00Z", "s": "Two tracks running at once. Bilaterally, Russian aviation, energy, nuclear and heavy-industry firms are preparing deeper Indian presence through technology transfer and local manufacturing under Make in India, centred on the Innoprom India expo from 9-11 September, with a 10 September plenary between Piyush Goyal and Anton Alikhanov covering regional aviation, critical minerals and additive manufacturing. Multilaterally, India is using its chairmanship of the now 11-member BRICS to push GRAIN, a shared supercomputing access network, plus a research repository for advanced materials data, a startup and incubator network linking chip-design firms, and cross-border digital payments.", "glance": "The strategic question the video raises is whether shared BRICS compute reduces dependence on Western technology stacks or simply swaps one set of dependencies for another."}]}]}, "elon": {"day": "2026-09-07", "source": "@jcub2x daily recap", "note": "Built from the @jcub2x recap for 7 September, covering the 23 posts Musk made that day - published this morning and about 10 hours old at build time. Engagement counts are not in the recap, so likes and views are not shown; ordering is by notability, not by engagement.", "highlight": {"t": "Musk amplified a blind rider's account of regaining independence in a Cybercab", "s": "Musk reposted David Moss's thread about his 62-year-old father Gary, who lost his sight five years ago, riding the Austin Cybercab repeatedly. Moss's father said the automatic doors, legroom, braille controls and space for a service animal made the vehicle usable without help, and that at 52 mph the ride was so quiet he would have guessed 35. Business Insider wrote the story up the same day, making it the most widely picked-up Musk-adjacent item of the last 24 hours.", "href": "https://www.youtube.com/watch?v=kKZHSxO1k2Y"}, "items": [{"kind": "repost", "t": "David Moss's thread about his blind father riding the Austin Cybercab", "s": "Musk reposted the thread; Moss's 62-year-old father, blind for five years, rode the robotaxi several times and said the automatic doors, legroom, braille controls and service-animal space let function urlDate(u){ if(!u) return null; let m;
  m=u.match(/\/(20\d{2})\/(\d{2})\/(\d{2})(?:[\/?#]|$)/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;

  return null; }
function pubDate(item){ return (item && (item.published || item.iso || urlDate(item.url||item.href))) || null; }
function ytId(u){ if(!u) return null; let m=u.match(/[?&]v=([A-Za-z0-9_-]{11})/)||u.match(/youtu\.be\/([A-Za-z0-9_-]{11})/)||u.match(/\/(?:embed|shorts)\/([A-Za-z0-9_-]{11})/); return m?m[1]:null; }

function relAge(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d.getTime())) return "";
  let s=Math.floor((Date.now()-d.getTime())/1000); if(s<0)s=0;
  if(s<60) return "just now";
  if(s<3600){const n=Math.floor(s/60);return n+" min"+(n>1?"s":"")+" ago";}
  if(s<86400){const n=Math.floor(s/3600);return n+" hour"+(n>1?"s":"")+" ago";}
  const days=Math.floor(s/86400);
  if(days===1) return "yesterday";
  if(days<7) return days+" days ago";
  if(days<30){const n=Math.floor(days/7);return n+" week"+(n>1?"s":"")+" ago";}
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }

/* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

  const im={critical:3,important:2,interesting:1,noise:0}[(it&&it.imp||"").toLowerCase()]||0;
  const heat=Math.max(0,Math.min(100,+((it&&it.heat)||0)))/100;

  if(ct){ const n=slimCountFor(id); ct.textContent=(n&&meta[1])?(n+" "+meta[1]):""; }
  try{ const dt=document.getElementById("slimDate"); if(dt) dt.textContent=(typeof DATA!=="undefined"&&DATA.date)?DATA.date:""; }catch(e){}
}
function activate(id,opts){
  document.body.dataset.tt=id;
  setSlimHeader(id);
  TABS.forEach(t=>{ const el=document.getElementById("p-"+t.id); if(el) el.classList.toggle("active",t.id===id); });
  ensureRendered(id);
  try{ armReveals(document.getElementById("p-"+id)); }catch(e){}
  [...nav.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreMenu) [...moreMenu.querySelectorAll(".tab")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  if(moreBtn) moreBtn.classList.toggle("active",overflow.some(t=>t.id===id));
  store.set("tab",id);
  kbdIdx=-1; clearKbdCur(); applyFilter();
  if(!(opts&&opts.keepScroll)){ try{ window.scrollTo(0,0); }catch(e){} try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
}
// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();

</script>
