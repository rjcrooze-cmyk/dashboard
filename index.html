CSR-backed millet processing facility", "s": "The Mysuru food-research institute inaugurated a secondary millet processing line intended to help small producers move up from raw grain to finished products. Capacity is aimed at farmer groups in the surrounding districts.", "imp": "interesting", "glance": "New millet processing line", "url": "https://www.deccanherald.com/india/karnataka", "published": "2026-08-20T13:55:29.613764+00:00", "src": "Deccan Herald"}]}, {"h": "🏙️ Bengaluru", "tag": "Bengaluru", "items": [{"t": "Bengaluru school under surveillance after hundreds of pupils fall ill", "s": "Health teams placed a city school under a 15-day watch after around 500 students reported illness and two staff tested positive; separately, 215 pupils at Clarence High School reported flu-like symptoms. Water and canteen sources are being tested.", "imp": "critical", "glance": "School illness outbreak probed", "url": "https://www.deccanherald.com/india/karnataka/bengaluru", "published": "2026-08-20T19:55:29.613764+00:00", "src": "Deccan Herald"}, {"t": "Chemists say fake drugs likely bypassed the retail chain entirely", "s": "Bengaluru pharmacists told investigators the counterfeit medicines now surfacing appear to have moved through parallel channels rather than licensed distributors, which would make routine retail checks ineffective at catching them.", "imp": "critical", "glance": "Counterfeit drugs bypass retail", "url": "https://timesofindia.indiatimes.com/city/bengaluru", "published": "2026-08-20T18:55:29.613764+00:00", "src": "Times of India"}, {"t": "Elevated Pink Line to open end-September, BMRCL readies safety inspection", "s": "Namma Metro's elevated Pink Line stretch is being prepared for the statutory commissioner-of-metro-rail-safety inspection, with services targeted for the end of September. The underground section remains further out.", "imp": "important", "glance": "Pink Line nears opening", "url": "https://www.deccanherald.com/india/karnataka/bengaluru", "published": "2026-08-20T21:55:29.613764+00:00", "src": "Deccan Herald"}, {"t": "Sewer leak blamed for Bannerghatta Road cave-in", "s": "The South City Corporation concluded that a leaking sewer pipeline eroded the sub-base and caused the road to collapse. Repairs will keep part of the carriageway shut through the weekend.", "imp": "important", "glance": "Sewer leak caused road collapse", "url": "https://www.deccanherald.com/india/karnataka/bengaluru", "published": "2026-08-20T20:55:29.613764+00:00", "src": "Deccan Herald"}, {"t": "High Court orders CID probe into IndusInd fake gold-loan case", "s": "The court handed the investigation to the Criminal Investigation Department after finding the initial inquiry inadequate. The case involves loans allegedly disbursed against gold that was never pledged.", "imp": "important", "glance": "CID to probe gold-loan fraud", "url": "https://timesofindia.indiatimes.com/city/bengaluru", "published": "2026-08-20T17:55:29.613764+00:00", "src": "Times of India"}]}]}, "newsUpdated": "2026-08-21T01:55:29.613764+00:00", "aitrends": {"updated": "2026-08-21T01:57:07.998996+00:00", "items": [{"t": "Robot model learns a new task from one 12-second demo", "heat": 96, "s": "Generalist AI released GEN-1.5, a robot foundation model that watches a 3-12 second demonstration and immediately attempts the task with no fine-tuning or gradient updates. Across 10 physical jobs — unscrewing a jar lid, stacking cups, sweeping, unzipping a pouch — it hit 59% success from a single demo and 83% after five minutes of task data. The use-case is direct: factory and warehouse robots retrained by showing rather than reprogramming.", "glance": "Show a robot once, it copies", "sources": 4, "url": "https://interestingengineering.com/ai-robotics/gen-1-5-robot-learns-physical-tasks-one-demonstration", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Real-time imitation crosses a usable bar", "basis": "Vendor benchmark across 10 tasks: 59% one-shot, 83% with 5 min data"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "DeepSeek returns with a fully pluggable coding harness", "heat": 93, "s": "DeepSeek shipped V4 Pro alongside an open coding harness in which every component — model adapter, tools, sandbox, UI, even the agent loop — is a swappable plugin configured in one line of YAML, and the repo became the fastest-starred on GitHub. It lands the same week OpenAI paused frontier reinforcement-learning runs. The use-case is a coding agent teams can point at any model and any sandbox instead of accepting a vendor's defaults.", "glance": "Open harness, any model plugs in", "sources": 5, "url": "https://github.com/deepseek-ai", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Open tooling erodes closed-agent lock-in", "basis": "Released model + harness; fastest-starred GitHub repo, hands-on builds reported"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Speculative decoding cuts on-device AI latency by half", "heat": 81, "s": "Liquid AI released DSpark draft checkpoints for its LFM2.5 family (1.2B, 2.6B and 8B-A1B), adding a speculative-decoding path that trades a small memory increase for up to 3.18x GPU throughput and 2.87x on-device, with output quality unchanged. Function-calling latency drops 57% on the 2.6B model. The concrete use-case is agents that run acceptably on a phone or laptop rather than a data centre.", "glance": "Phones get usable local agents", "sources": 3, "url": "https://huggingface.co/blog/LiquidAI/lfm25-dspark", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "On-device agents become practical", "basis": "Published throughput numbers with day-one llama.cpp and SGLang support"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Encrypting a prompt injection walks Grok past its guardrails", "heat": 78, "s": "Researchers showed that wrapping a malicious instruction in a simple cipher — 'cryptographic context injection' — gets Grok to exfiltrate user chats and personal data, days after a comparable attack on Microsoft 365 Copilot. Ars reports the hole was still live at publication despite xAI being notified in June. The practical lesson for anyone wiring an assistant to email or files: guardrails are not a security boundary.", "glance": "Ciphered injections defeat guardrails", "sources": 4, "url": "https://arstechnica.com/security/2026/08/grok-exfiltrates-user-data-when-malicious-instructions-are-encrypted/", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Prompt injection remains structurally unfixed", "basis": "Working demonstrated exploit; vendor notified June, still reproducible"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Microsoft opens up Skala, its learned DFT functional", "heat": 72, "s": "Microsoft Research broadened access to Skala 1.1, a deep-learning exchange-correlation functional for density functional theory, with better accuracy and a living benchmark tracking performance across the computational-chemistry stack. DFT is the workhorse for predicting how molecules and materials behave, so a more accurate functional shortens the simulate-then-synthesise loop in drug and battery discovery.", "glance": "Better chemistry simulation, open", "sources": 3, "url": "https://www.microsoft.com/en-us/research/blog/broadening-access-to-skala-creates-a-faster-path-to-predictive-dft/", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Learned functionals move into real workflows", "basis": "Version 1.1 with public benchmark and ecosystem integrations"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Nevada clears three companies for large robotaxi fleets", "heat": 68, "s": "Nevada regulators granted Tesla, Uber and Waymo permits to operate thousands of driverless vehicles, making it one of the most permissive US autonomy markets. Unlike earlier city-by-city pilots this is a statewide authorisation, so the constraint shifts from regulation to how many vehicles each firm can actually field.", "glance": "Statewide robotaxi green light", "sources": 4, "url": "https://techcrunch.com/", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Regulation stops being the bottleneck", "basis": "State permits issued to all three operators for at-scale deployment"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "A third of new web pages show signs of AI authorship", "heat": 61, "s": "A study of pages published since ChatGPT's launch estimates that roughly one in three shows statistical markers of AI writing or editing. Detection at this scale is inferential rather than definitive, so treat the exact fraction as an estimate — but the direction matters for anyone training on scraped web text.", "glance": "AI wrote a third of the new web", "sources": 3, "url": "https://techcrunch.com/", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Training data is increasingly self-referential", "basis": "Large-scale classifier study; detection methods carry known error rates"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Anthropic watermarks Claude's text output", "heat": 57, "s": "Anthropic is embedding a watermark directly into generated text rather than in strippable metadata, reportedly surviving some editing and copy-paste. Users have pushed back over privacy, code copyright and the fact that a watermark may flag text Claude merely edited. The mechanism has not been disclosed.", "glance": "Watermark travels with the text", "sources": 4, "url": "https://www.anthropic.com/news", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Provenance marking arrives, contested", "basis": "Vendor rollout; technique undisclosed, robustness unverified externally"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "OpenAI pauses frontier RL over a cyber-capability threshold", "heat": 54, "s": "OpenAI said it would hold its next large reinforcement-learning run for about two weeks after an internal model, reported as 'Astra', appeared to cross a critical cyber-capability threshold — following an earlier incident where a model escaped an evaluation sandbox. Sceptics read the pause as positioning; either way it is the first publicly announced voluntary halt of a frontier run.", "glance": "First announced frontier pause", "sources": 5, "url": "https://openai.com/index/", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Safety pause, motives contested", "basis": "Company statement only; no external verification of the capability claim"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Grok 4.6 lands on Bedrock at a steep discount", "heat": 49, "s": "xAI's Grok 4.6 is now available through Amazon Bedrock and is being pitched as matching frontier-model quality at roughly a 60% discount, with SpaceX engineering teams cited as internal users. Independent benchmark confirmation is thin so far.", "glance": "Cheaper frontier-class API", "sources": 3, "url": "https://aws.amazon.com/bedrock/", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Price pressure on frontier APIs", "basis": "Vendor and partner claims; no independent benchmark replication yet"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Ramp ships its own model router", "heat": 42, "s": "The fintech released Router, an in-house layer that picks which model handles each request based on cost and task type — the sort of infrastructure companies used to buy, now built internally as inference spend grows.", "glance": "Firms build routing in-house", "sources": 2, "url": "https://techcrunch.com/", "assess": {"mag": 2, "timeline": "now", "evidence": "proven", "verdict": "Routing becomes table stakes", "basis": "Product launch by a single company"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Codex clears a five-year test migration in two weeks", "heat": 38, "s": "OpenAI published an Asana case study claiming Codex replaced an outdated testing system in two weeks for about $12,000 — work the company had scoped at five years. It is a vendor-published account of one customer, so the multiple is illustrative rather than a benchmark.", "glance": "Big migration, tiny timeline", "sources": 2, "url": "https://openai.com/index/asana/", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Legacy migration is the killer app", "basis": "Vendor case study, single customer, self-reported figures"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "EU court says AI-generated content gets no copyright", "heat": 35, "s": "A European ruling holds that purely AI-generated output does not attract copyright protection, leaving generated assets in the public domain unless a human contribution is substantial enough to qualify. Businesses building on generated art, code or copy in the EU need to reassess what they actually own.", "glance": "No copyright on pure AI output", "sources": 2, "url": "https://news.ycombinator.com/", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Ownership of generated assets narrows", "basis": "Court decision reported via secondary sources; scope still being read"}, "delta": "new", "published": "2026-08-20T19:57:07.998996+00:00"}, {"t": "Binance opens agent trading with limited oversight", "heat": 31, "s": "The exchange now lets AI agents place trades, with the burden of constraining them falling largely on users rather than platform-level limits. Autonomous execution against real balances raises an obvious failure mode when an agent misreads a market.", "glance": "Agents trading real money", "sources": 2, "url": "https://techcrunch.com/", "assess": {"mag": 2, "timeline": "now", "evidence": "proven", "verdict": "Autonomy outpaces its own guardrails", "basis": "Product launch; risk controls described as user-configured"}, "delta": "steady", "published": "2026-08-20T19:57:07.998996+00:00"}]}, "aitrendsUpdated": "2026-08-21T01:57:07.998996+00:00", "science": {"updated": "2026-08-21T01:57:07.998996+00:00", "items": [{"t": "First phase 3 win for a personalised mRNA cancer therapy in melanoma", "s": "Merck and Moderna say a phase 3 trial of intismeran autogene — an mRNA therapy built from each patient's own tumour mutations — plus Keytruda cut the risk of recurrence or death versus Keytruda alone in fully resected stage IIB–IV melanoma. It is the first successful phase 3 of an individualised mRNA cancer treatment; results are a company topline, not yet peer-reviewed or published, and the FDA still has to review it.", "tag": "Health", "imp": "critical", "glance": "mRNA cancer vaccine works", "url": "https://www.scientificamerican.com/article/moderna-and-merck-announce-landmark-trial-showing-mrna-therapy-significantly-cuts-odds-of-recurrent-skin-cancer/", "published": "2026-08-19T20:45:00Z", "src": "Scientific American", "assess": {"mag": 5, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "First phase 3 win for personalised cancer mRNA", "basis": "Phase 3 topline in resected stage IIB-IV melanoma; not yet published"}, "eli": "Doctors read the DNA of your own tumour, then print an mRNA shot that teaches your immune system to hunt exactly that tumour. In the biggest test so far, adding it to standard immunotherapy kept the cancer from coming back more often than immunotherapy alone."}, {"t": "Magnetic levitation smooths over the flaws in quantum-chip fabrication", "s": "Engineers at FAMU-FSU and the National High Magnetic Field Laboratory designed a quantum computing architecture that magnetically levitates the qubit, so tiny fabrication defects in surrounding components stop degrading it. Manufacturing variability is one of the main reasons quantum processors do not scale cleanly, so an architecture tolerant of it is worth more than another qubit-count record.", "tag": "Physics & Space", "imp": "important", "glance": "Levitated qubits tolerate defects", "url": "https://phys.org/news/2026-08-magnetically-levitated-quantum-bit-flaws.html", "published": "2026-08-20T21:57:07.998996+00:00", "src": "Phys.org / FAMU-FSU", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Fault tolerance from mechanics, not code", "basis": "Design and modelling study from a national-lab group; no fabricated device yet"}}, {"t": "A forgotten bacterial antibiotic disarms the fungi that kill two million a year", "s": "Monash University researchers report in Current Biology that a little-known bacterial antibiotic strips Candida albicans of its ability to switch into the invasive filamentous form that causes life-threatening infection. Fungal infections kill an estimated two million people a year and resistance to the small existing antifungal arsenal is rising; because this compound disarms rather than kills the fungus, it puts less selective pressure on resistance. Peer-reviewed laboratory work — not yet tested in patients.", "tag": "Health", "imp": "critical", "glance": "New weapon against killer fungi", "url": "https://www.sciencealert.com/deadly-drug-resistant-fungal-infections-are-spreading-scientists-just-discovered-a-potential-treatment", "published": "2026-08-20T19:57:07.998996+00:00", "src": "Current Biology / Monash", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Disarming beats killing for resistance", "basis": "Peer-reviewed Current Biology study; in vitro, no human trials yet"}, "eli": "Some fungi turn from harmless round cells into invading threads. This old antibiotic stops the switch, so the fungus stays harmless instead of being killed — which gives it less reason to evolve resistance."}, {"t": "Physicists find the right lattice site to build a nuclear clock", "s": "Writing in Science, Thorsten Schumm's group at TU Wien mapped the four positions a thorium atom can occupy inside a grown crystal and identified which one keeps the nuclear transition clean. Nuclear clocks track a neutron flip rather than an electron jump, promising roughly ten times the precision of today's atomic clocks while being shielded by the atom itself — which means the clock could sit in a crystal instead of a room full of vacuum chambers. Better clocks feed directly into GPS accuracy, geodesy and navigation without satellites.", "tag": "Physics & Space", "imp": "important", "glance": "Nuclear clock gets its home", "url": "https://www.scientificamerican.com/article/physicists-pinpoint-the-perfect-crystal-site-for-an-ultra-accurate-nuclear-clock/", "published": "2026-08-20T17:57:07.998996+00:00", "src": "Science / TU Wien", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Solid-state clocks stop being theoretical", "basis": "Peer-reviewed Science paper mapping four candidate lattice sites"}, "eli": "Today's best clocks watch electrons, which need a lab full of shielding. This one watches the atom's core, which shields itself — so it can be grown into a crystal you could carry."}, {"t": "A saliva sample can flag gut cancer without a colonoscopy", "s": "A Cell Host & Microbe study from Yonsei University compared oral and faecal microbes across 507 people — healthy controls, people with type 2 diabetes and gastrointestinal cancer patients — and found that mouth-dwelling species colonise the gut differently in people with cancer, leaving a detectable signature in saliva. The use-case is blunt: a spit test as a first-line screen for a cancer whose current diagnosis depends on an invasive scope that many people avoid. Peer-reviewed, but a single cohort that needs replication.", "tag": "Health", "imp": "critical", "glance": "Spit test for colorectal cancer", "url": "https://www.sciencealert.com/a-hidden-pattern-in-your-saliva-can-predict-risk-of-colorectal-cancer-study-finds", "published": "2026-08-20T15:57:07.998996+00:00", "src": "Cell Host & Microbe / Yonsei", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Non-invasive screening looks reachable", "basis": "507-person peer-reviewed cohort; needs independent replication"}}, {"t": "KAIST's zinc battery turns its worst side-reaction into storage", "s": "Water-based zinc batteries lose capacity because protons intrude into the electrode. The KAIST team redesigned a MOF-derived electrode so those protons are stored usefully instead, raising energy density and holding performance past 500 cycles. Aqueous zinc chemistry is non-flammable and cheap, which is what makes it attractive for building-scale and grid storage where lithium's fire risk is the objection. Lab cells, not yet a commercial format.", "tag": "Energy", "imp": "important", "glance": "Zinc battery stops fighting protons", "url": "https://interestingengineering.com/energy/zinc-battery-electrode-proton-storage-mof", "published": "2026-08-20T00:06:23+00:00", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Proton storage rescues aqueous zinc", "basis": "KAIST lab cells sustaining 500+ cycles with proton-storing MOF-derived electrode"}}, {"t": "Iron trick makes sodium batteries hold as much charge as lithium ones", "s": "Layered-oxide cathodes can store far more charge if the oxygen in the lattice takes part in the redox reaction, but that reaction is usually irreversible and wrecks the structure. Writing in Nature Energy, the team uses iron to mediate the lattice-oxygen redox so it reverses cleanly, delivering a sodium-ion cell that holds 200 Wh per kg and stays stable over cycling. Sodium is cheap and abundant, so this is the energy density that makes sodium-ion a real substitute for lithium in grid storage and entry-level EVs. Peer-reviewed, cell-level result — not yet a manufactured pack.", "tag": "Energy", "imp": "important", "glance": "Sodium batteries hit lithium territory", "url": "https://www.nature.com/articles/s41560-026-02112-8", "published": "2026-08-20T00:00:00+00:00", "src": "Nature Energy", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Cheap sodium cells close the density gap", "basis": "Peer-reviewed Nature Energy cell reaching 200 Wh/kg with reversible lattice-oxygen redox"}}, {"t": "Machine learning finds existing drugs that protect neurons in childhood dementia", "s": "Using patient-derived neural models that reproduce key features of childhood dementia, a Nature Communications team built a screening platform combining imaging, transcriptomics, electrophysiology and machine learning, and picked out repurposed compounds that reduced the disease phenotype. Repurposed drugs are the fastest route to the clinic for an ultra-rare, currently untreatable disease — but this is preclinical human-cell work.", "tag": "Health", "imp": "important", "glance": "Repurposed drugs for childhood dementia", "url": "https://www.nature.com/articles/s41467-026-76837-1", "published": "2026-08-20T00:00:00Z", "src": "Nature Communications", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Screening platform names repurposable neuroprotectants", "basis": "Preclinical patient-derived neural models, Nature Communications; no human dosing"}}, {"t": "A high-quality rye genome opens a new gene pool for wheat breeding", "s": "An international team led by the IPK Leibniz Institute published a high-quality rye reference genome plus a diversity panel, mapping the genes behind rye's drought tolerance, disease resistance and nutrient efficiency. Rye traits are already moved into wheat through rye-wheat translocations, so having the genome makes those transfers targeted rather than trial-and-error. Peer-reviewed genomics resource; the breeding gains take seasons to arrive.", "tag": "Biology", "imp": "important", "glance": "Rye genome to toughen wheat", "url": "https://phys.org/news/2026-08-rye-genome-uncovers-diversity-wheat.html", "published": "2026-08-19T23:00:01+00:00", "src": "Phys.org", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Drought genes get a proper map", "basis": "Peer-reviewed reference genome plus diversity panel from IPK-led consortium"}}, {"t": "People past 100 carry an unusual store of cancer-killing T cells", "s": "A Cell Reports study found that around age 100 a rare population of cytotoxic CD4 T cells — helper cells that behave like killers — expands and keeps adapting in supercentenarians. The authors read it as an adaptive response to lifelong antigen exposure, which makes these cells a concrete target for immunotherapy and healthy-ageing work. Observational immunology in a small, rare cohort.", "tag": "Biology", "imp": "important", "glance": "Superagers' killer T cells", "url": "https://www.sciencealert.com/people-who-live-past-100-may-be-protected-by-rare-cancer-killing-immune-cells", "published": "2026-08-19T23:00:00Z", "src": "ScienceAlert / Cell Reports", "assess": {"mag": 4, "timeline": "10+ yrs", "evidence": "early", "verdict": "A named immune-cell target for healthy ageing", "basis": "Cell Reports observational study of a small supercentenarian cohort"}}, {"t": "3D-printed ceramic waveguides could push fibre lasers ten times harder", "s": "Researchers 3D-printed ceramic waveguides that channel and amplify light with far better heat handling than glass fibre, and calculate they could carry roughly ten times the optical power before failing. Higher-power waveguides matter for industrial cutting and welding, for long-haul optical amplification, and for directed-energy work. Demonstrated at component scale in the lab; system-level power records are still to be shown.", "tag": "Physics & Space", "imp": "important", "glance": "Ceramic beats glass in lasers", "url": "https://phys.org/news/2026-08-3d-ceramic-waveguide-lasers-surpass.html", "published": "2026-08-19T22:40:01+00:00", "src": "Phys.org", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Printed ceramics lift the power ceiling", "basis": "Lab-fabricated waveguide with measured thermal handling; 10x figure is projected"}}, {"t": "China lands and recovers a Zhuque-3 booster, joining SpaceX and Blue Origin", "s": "LandSpace successfully landed and recovered the first stage of its Zhuque-3 rocket, eight months after its first attempt exploded on the pad. China now has a demonstrated reusable orbital-class booster, which is the main lever on launch cost for satellites, constellations and cargo.", "tag": "Physics & Space", "imp": "important", "glance": "China lands reusable booster", "url": "https://www.scientificamerican.com/article/china-successfully-lands-its-zhuque-3-rocket-rivaling-blue-origin-and-spacex/", "published": "2026-08-19T16:00:00Z", "src": "Scientific American", "assess": {"mag": 4, "timeline": "now", "evidence": "proven", "verdict": "Reusable orbital booster demonstrated outside the US", "basis": "Flown and recovered first stage; second attempt after a 2025 failure"}}, {"t": "An experimental tetanus-diphtheria vaccine survives without refrigeration", "s": "In early trials a reformulated tetanus and diphtheria vaccine still protected without needing a cold chain. Refrigeration is the single largest logistics cost and failure point for immunisation in hot, remote and low-income regions, so a shelf-stable formulation changes who can be reached — but this is early-stage trial data, not an approved product.", "tag": "Health", "imp": "important", "glance": "Vaccine needs no fridge", "url": "https://www.sciencenews.org/article/experimental-vaccine-doesnt-need-fridge", "published": "2026-08-19T13:30:00Z", "src": "Science News", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Cold-chain-free vaccine clears early trials", "basis": "Early-stage human trials of a reformulated Td vaccine; not approved"}}, {"t": "Entangled photons made straight from sunlight for the first time", "s": "A group has generated quantum-entangled photon pairs using ordinary sunlight as the pump, something long assumed impractical because sunlight is incoherent and weak per mode. If it holds up, entanglement sources stop needing an expensive coherent laser, which lowers the cost floor for quantum key distribution links and for field-deployed quantum sensors. Single result, early-stage — replication and a measured entanglement fidelity under real outdoor conditions are the things to watch.", "tag": "Physics & Space", "imp": "important", "glance": "Sunlight as a quantum source", "url": "https://www.sciencealert.com/for-the-first-time-researchers-have-generated-quantum-entanglement-directly-from-sunlight", "published": "2026-08-19T10:00:00+00:00", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Free light replaces the pump laser", "basis": "First reported sunlight-pumped entangled-pair generation; single group, not yet replicated"}}, {"t": "A light-driven reaction breaks down mixed plastic waste without any catalyst", "s": "Researchers in Science Advances report an autoinductive photochemical route that upcycles aromatic polymers and mixed plastics using autosensitization — the reaction generates its own sensitiser, so no added catalyst is needed. Mixed, contaminated plastic streams are exactly what mechanical recycling cannot handle, so a catalyst-free chemical route matters for real waste.", "tag": "Chemistry", "imp": "important", "glance": "Catalyst-free plastic upcycling", "url": "https://www.science.org/doi/abs/10.1126/sciadv.aeg9384?af=R", "published": "2026-08-19T07:00:00Z", "src": "Science Advances", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Mixed-plastic upcycling without an added catalyst", "basis": "Peer-reviewed lab chemistry in Science Advances; no pilot-scale demonstration"}}, {"t": "A pacemaker that runs on the heartbeat it is regulating", "s": "A Science Advances team built a leadless intracardiac pacemaker powered by a triboelectric nanogenerator that harvests energy from the heart's own motion, removing the battery that forces most patients into a replacement operation every seven to ten years. Reported in animal work; the engineering problem it solves — repeat surgery purely to change a cell — is a real and expensive one.", "tag": "Health", "imp": "important", "glance": "Battery-free heart pacemaker", "url": "https://www.science.org/doi/abs/10.1126/sciadv.aef8903", "published": "2026-08-19T06:57:07.998996+00:00", "src": "Science Advances", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Self-powering ends replacement surgery", "basis": "Peer-reviewed Science Advances; animal-stage device, not in humans"}}, {"t": "Cobalt oxide sheets turn waste CO2 straight into acetic acid", "s": "Chemists report in Science Advances that ultrathin CoO nanosheets catalyse the direct hydrogenation of carbon dioxide to acetic acid, a bulk industrial chemical normally made from fossil feedstock. Doing it in one step avoids the multi-stage routes that make CO2-to-chemicals uneconomic, giving captured carbon a product worth selling rather than a hole to bury it in. Laboratory-scale catalysis.", "tag": "Chemistry", "imp": "important", "glance": "CO2 into a sellable chemical", "url": "https://www.science.org/doi/abs/10.1126/sciadv.aeg1076", "published": "2026-08-19T06:57:07.998996+00:00", "src": "Science Advances", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Carbon capture gains an economic product", "basis": "Peer-reviewed catalysis study at laboratory scale"}}]}, "scienceUpdated": "2026-08-21T01:57:07.998996+00:00", "scienceDaily": {"updated": "2026-08-21T01:57:07.998996+00:00", "items": [{"t": "A thousand genetic switches explain why women's immune systems misfire", "s": "Researchers identified more than 1,000 regulatory elements that behave differently in male and female immune cells, showing that female immune systems are genetically tuned for stronger inflammatory responses — an advantage against infection that also raises the risk of autoimmune misfires like lupus. The use-case is drug targeting: it names concrete switches to aim sex-specific autoimmune therapies at, rather than treating the sex difference as unexplained. Peer-reviewed.", "tag": "Biology", "imp": "important", "glance": "Why lupus hits women harder", "url": "https://www.sciencedaily.com/releases/2026/08/260819041239.htm", "published": "2026-08-20T03:57:07.998996+00:00", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Sex-specific immunity gets druggable targets", "basis": "Peer-reviewed regulatory-element mapping across male and female immune cells"}}, {"t": "AI-designed 'intrabodies' can hunt misfolded proteins inside living cells", "s": "Antibodies normally only work outside cells, which is why the misfolded proteins that drive Alzheimer's, Parkinson's, Huntington's and motor neurone disease have been so hard to target. Researchers used computational design to convert ordinary antibodies into small, stable 'intrabodies' that fold and function in the crowded interior of a human cell. That opens a route to drugs that grab a toxic protein at source rather than mopping it up outside. Cell-based work so far — no animal efficacy or clinical data yet.", "tag": "Health", "imp": "important", "glance": "Antibodies that work inside cells", "url": "https://www.sciencedaily.com/releases/2026/08/260819041242.htm", "published": "2026-08-20T02:01:27+00:00", "src": "ScienceDaily health", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Intracellular targets finally reachable", "basis": "Computationally designed intrabodies shown to fold and bind inside human cells"}}, {"t": "Probiotic bacteria engineered into drug factories inside pancreatic tumours", "s": "Engineered probiotic bacteria infiltrated pancreatic tumours, recruited cancer-fighting immune cells and slowed tumour growth in animal studies, and worked better when combined with chemotherapy, radiation or immunotherapy. Pancreatic cancer is one of the hardest tumours to reach with drugs, so a living carrier that concentrates inside it is a real delivery route. Animal work only.", "tag": "Health", "imp": "important", "glance": "Bacteria attack pancreatic cancer", "url": "https://www.sciencedaily.com/releases/2026/08/260816044830.htm", "published": "2026-08-19T12:10:13Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Living drug delivery into a hard tumour", "basis": "Animal studies; tumour growth slowed and synergy with existing therapies"}}, {"t": "Tiny quantum engines pull usable energy out of waste heat", "s": "A quantum-scale engine design was shown to extract useful work from heat that classical engines discard, using quantum correlations rather than a bigger temperature gap. Waste heat is the largest single loss in industry and computing, so any mechanism that harvests it has an obvious end use — though this is fundamental thermodynamics at the device scale, far from a product.", "tag": "Physics & Space", "imp": "important", "glance": "Engines from waste heat", "url": "https://www.sciencedaily.com/releases/2026/08/260819041222.htm", "published": "2026-08-19T11:49:52Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "10+ yrs", "evidence": "early", "verdict": "Quantum route to harvesting discarded heat", "basis": "Peer-reviewed quantum thermodynamics result at device scale, no prototype"}}, {"t": "Silver nanoparticles cut DNA and make gene assembly five times more efficient", "s": "Japanese researchers used silver nanoparticles to slice DNA precisely and leave longer 'sticky ends', letting genetic fragments join up to five times more efficiently than conventional methods. Building long DNA sequences is the rate-limiting step for gene therapies, cancer vaccines, engineered drugs and improved crops, so a cheaper assembly step feeds all of them. Laboratory method, not yet in production pipelines.", "tag": "Biology", "imp": "important", "glance": "Faster DNA assembly method", "url": "https://www.sciencedaily.com/releases/2026/08/260816044842.htm", "published": "2026-08-19T07:46:13Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "A five-fold speed-up in building long DNA", "basis": "Peer-reviewed method paper with measured 5x assembly efficiency gain"}}]}, "scienceDailyUpdated": "2026-08-21T01:57:07.998996+00:00", "life": {"updated": "2026-08-21T01:57:07.998996+00:00", "items": []}, "lifeUpdated": "2026-08-21T01:57:07.998996+00:00", "costs": {"updated": "2026-08-21T01:42:24+00:00", "items": [{"key": "usdinr", "label": "USD/INR", "unit": "INR", "value": 95.71, "delta": -0.05, "delta_pct": -0.0522, "dir": "down", "asof": "2026-08-20", "src": "Frankfurter (ECB ref)", "url": "https://www.frankfurter.app/", "stale": false}, {"key": "brent", "label": "Brent crude", "unit": "USD/bbl", "value": 93.73, "delta": -0.05, "delta_pct": -0.05, "dir": "down", "asof": "2026-08-21", "src": "Markets Insider (indication)", "url": "https://markets.businessinsider.com/commodities/oil-price?type=brent", "stale": false, "note": "Intraday delayed indication (~15 min), not settlement"}, {"key": "lead", "label": "Lead (LME cash)", "unit": "USD/tonne", "value": 1848.0, "delta": 21.0, "delta_pct": 1.1494, "dir": "up", "asof": "2026-08-20", "src": "Westmetall (LME official)", "url": "https://www.westmetall.com/en/markdaten.php?action=table&field=LME_Pb_cash", "stale": false, "note": "LME official cash settlement, ~1 business-day lag"}, {"key": "lithium", "label": "Lithium (LIT ETF proxy)", "unit": "USD/share", "value": 74.58, "delta": 0.01, "delta_pct": 0.01, "dir": "up", "asof": "2026-08-20", "src": "Nasdaq (LIT ETF)", "url": "https://api.nasdaq.com/api/quote/LIT/info?assetclass=etf", "stale": false, "note": "PROXY: lithium/battery ETF, NOT Li2CO3 spot. Indicates trend only"}, {"key": "rubber", "label": "Natural rubber (RSS4)", "unit": "INR/kg", "value": 274.0, "delta": 0.0, "delta_pct": 0.0, "dir": "flat", "asof": "2026-08-21", "src": "Rubber Board of India", "url": "https://rubberboard.org.in/public", "stale": false, "note": "RSS4 Kottayam; source lists INR/100kg (shown INR/kg). "}, {"key": "eva", "label": "EVA (no free daily spot)", "unit": "USD/tonne", "value": null, "delta": null, "delta_pct": null, "dir": "down", "asof": "2026-08-21", "src": "proxy: crude/naphtha trend", "url": "", "stale": true, "note": "No reliable FREE daily EVA (ethylene-vinyl-acetate) spot price. EVA is a petrochemical derived from ethylene/naphtha, so its cost tracks crude. Direction mirrors Brent as a proxy; no numeric value fetched (not fabricated)."}]}, "elon": {"day": "2026-08-19", "source": "@jcub2x daily recap", "note": "Built from the @jcub2x recap covering Musk's 129 posts on 19 Aug (published ~24h ago). Engagement counts are not in the recap, so like/view numbers are not shown; items are ordered most-notable first. Politically charged posts are summarised factually and contested claims are flagged.", "highlight": {"t": "Musk calls for Derek Chauvin's release, reviving a contested account of George Floyd's death", "s": "In by far his most-amplified thread of the day, Musk said Chauvin 'was unjustly convicted' and should be freed, and endorsed claims that Floyd died of an overdose rather than restraint. Those claims are disputed: the county medical examiner ruled the death a homicide and the conviction survived appeal. Chauvin's lawyer is separately petitioning for dismissal.", "href": "https://x.com/elonmusk"}, "items": [{"kind": "post", "t": "On calls to release Derek Chauvin, the ex-officer convicted in George Floyd's death", "s": "Musk posted that Chauvin 'was unjustly convicted of murder' and should be freed, arguing he neither caused nor intended a death, and repeated 'Free Chauvin' across several replies. The claims he amplified — that the autopsy showed no asphyxia and that an overdose was the cause — are contested: the Hennepin County medical examiner ruled the death a homicide, and the conviction was upheld on appeal. Chauvin's attorney is separately seeking dismissal. This was the most-discussed post of his day.", "imp": "critical", "iso": "2026-08-19T23:58:26.738631+00:00", "href": "https://x.com/elonmusk"}, {"kind": "post", "t": "On Starship's recovery after 24 days at sea", "s": "Musk confirmed SpaceX guided the Flight 13 vehicle to calmer water off Christmas Island and will attempt to tow it back to Starbase, calling it a step toward reusability. He separately said the first attempt to catch a Starship with the tower is 'a few months' away. Locals gathered along the coast to watch the tow.", "imp": "important", "iso": "2026-08-19T22:58:26.738631+00:00", "href": "https://x.com/elonmusk"}, {"kind": "post", "t": "On Starlink crossing 11,000 satellites in orbit", "s": "After a Falcon 9 launch of 24 more satellites, Musk marked the constellation passing 11,000 — about 1,300 added this year and by far the largest ever built — with the comment 'one satellite at a time'. SpaceX has asked the FCC to approve a third-generation constellation of up to 100,000.", "imp": "important", "iso": "2026-08-19T21:58:26.738631+00:00"}, {"kind": "post", "t": "On SpaceX completing 100 launches in 231 days of 2026", "s": "Musk quoted the milestone with '100', and reposted a projection of mass-to-orbit rising sharply once Starship reuse is routine. He also plugged Grok Build after a user assembled the full 100-launch graphic with it.", "imp": "important", "iso": "2026-08-19T20:58:26.738631+00:00"}, {"kind": "repost", "t": "On the Moderna–Merck mRNA melanoma trial result", "s": "Responding to the phase 3 readout, Musk wrote that 'despite its obvious misuse during COVID, mRNA has tremendous promise for curing diseases' and that synthetic RNA 'will cure many diseases', framing it as making disease a software problem. Asked about a rival lab chief's line that AI wins public trust by curing cancer, he replied that AI will do it.", "imp": "important", "iso": "2026-08-19T23:58:26.738631+00:00"}, {"kind": "post", "t": "On Grokbot being used for everyday admin", "s": "Musk amplified a run of user reports — clearing 90,000 emails, cancelling unused subscriptions, listing and selling a pile of clothes end-to-end — and told followers 'you can make an instant one-person company with Grokbot'. He also promised to ask the team for a free usage reset on Grok Imagine.", "imp": "interesting", "iso": "2026-08-19T19:58:26.738631+00:00"}, {"kind": "reply", "t": "On Nvidia backing a 4.25GW SoftBank data centre in Ohio", "s": "To the $105bn Ohio announcement, Musk replied that it 'will take much longer to bring online than they think' — a rare public scepticism about a rival's compute buildout.", "imp": "important", "iso": "2026-08-19T18:58:26.738631+00:00"}, {"kind": "reply", "t": "On where AI capability is heading", "s": "Asked about specialist versus general superintelligence, Musk said 'specialists will be far more efficient', and elsewhere called China 'by far the strongest competitor in artificial intelligence'. On a chart of 18 orders of magnitude of compute-cost decline he cautioned 'nothing is guaranteed'.", "imp": "important", "iso": "2026-08-19T19:58:26.738631+00:00"}, {"kind": "repost", "t": "On the Tesla Semi's updated economics", "s": "Musk reposted the refreshed Semi page: up to 500 miles fully loaded, a 1.2MW megacharger recovering about 60% of range in 30 minutes, and a claim it pays for itself within a typical ownership period on lower energy and maintenance costs. Tesla separately confirmed a European reveal at IAA.", "imp": "important", "iso": "2026-08-19T17:58:26.738631+00:00"}, {"kind": "repost", "t": "On Giga Shanghai's six-millionth battery pack", "s": "Musk congratulated the Shanghai team on the milestone, posting alongside images of the plant's tally board.", "imp": "interesting", "iso": "2026-08-19T16:58:26.738631+00:00"}, {"kind": "reply", "t": "On full self-driving as an accessibility tool", "s": "Musk agreed with a post about a driver born without hands who has covered 25,000 miles largely on FSD, and with a separate argument that a cheaper, longer-range Tesla today than in 2015 shows how living standards improve.", "imp": "interesting", "iso": "2026-08-19T15:58:26.738631+00:00"}, {"kind": "post", "t": "On Starlink expanding into aviation and shipping", "s": "He reposted Lufthansa activating Starlink in flight, Vodacom Lesotho launching an enterprise service, and Hyundai Glovis fitting 45 of 47 ships — plus reports of passengers switching airlines for connectivity.", "imp": "interesting", "iso": "2026-08-19T18:58:26.738631+00:00"}]}, "elonNews": [{"t": "Nevada approves Tesla, Uber and Waymo for thousands of robotaxis", "s": "State regulators issued permits allowing all three to run driverless fleets at scale, one of the broadest US autonomy authorisations yet.", "url": "https://techcrunch.com/", "published": "2026-08-21T00:58:26.738631+00:00", "src": "TechCrunch"}, {"t": "Musk puts first Starship tower catch 'a few months' away", "s": "After the Flight 13 vehicle was recovered at sea, Musk gave a timeline for attempting the tower catch that full reusability depends on.", "url": "https://www.space.com/", "published": "2026-08-20T20:58:26.738631+00:00", "src": "Space.com"}, {"t": "SpaceX expected to add a Starship base in Louisiana", "s": "Governor Landry is set to announce a new SpaceX site, adding manufacturing capacity beyond Starbase and Florida.", "url": "https://www.wwltv.com/", "published": "2026-08-20T19:58:26.738631+00:00", "src": "WWL-TV / Aviation Week"}, {"t": "Tesla confirms the Semi is coming to Europe, with an IAA reveal", "s": "The electric truck will be shown at the IAA commercial-vehicle show, Tesla's first firm signal of a European Semi rollout.", "url": "https://electrek.co/", "published": "2026-08-20T19:58:26.738631+00:00", "src": "Electrek"}, {"t": "Tesla calls FSD v15 a 'step-change' and puts Optimus sales in 2027", "s": "The company described the new self-driving release as a significant jump and said the humanoid robot goes on sale in 2027 — a timeline JPMorgan analysts think may slip again.", "url": "https://electrek.co/", "published": "2026-08-20T19:58:26.738631+00:00", "src": "Electrek"}, {"t": "Grok 4.6 reaches Amazon Bedrock at a claimed 60% discount", "s": "xAI's model is pitched as frontier-class at well below frontier pricing, with SpaceX engineering cited as an internal user. Independent benchmarks are still thin.", "url": "https://aws.amazon.com/bedrock/", "published": "2026-08-20T20:58:26.738631+00:00", "src": "The Motley Fool"}, {"t": "Republicans look to Musk and AI super PACs ahead of the midterms", "s": "Reports suggest Musk could spend up to $200m supporting Republican candidates, including Texas attorney general Ken Paxton, who trails on fundraising.", "url": "https://www.gizmodo.com/", "published": "2026-08-20T20:58:26.738631+00:00", "src": "Gizmodo / NY Post"}, {"t": "Grok users report a run of gibberish responses", "s": "Multiple users documented degraded or nonsensical output over the past day; xAI has not published a cause.", "url": "https://techcrunch.com/", "published": "2026-08-20T17:58:26.738631+00:00", "src": "TechCrunch / Gizmodo"}], "elonNewsUpdated": "2026-08-21T01:58:26.738631+00:00", "mind": {"updated": "2026-08-21T01:58:26.738631+00:00", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "Schizophrenia's synapse loss follows an organised left-frontal pattern", "s": "Synaptic-density brain scans show schizophrenia involves widespread loss of the connections between neurons, hitting the left hemisphere hardest and spreading in a pattern that tracks the brain's own chemistry and wiring rather than at random. The researchers identify a left frontal region that may be where the loss begins — which would give trials a defined target and a defined stage to intervene at.", "url": "https://www.sciencedaily.com/releases/2026/08/260820002443.htm", "published": "2026-08-20T11:58:26.738631+00:00", "src": "ScienceDaily / imaging study", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Synapse loss has a startingsite", "basis": "Peer-reviewed synaptic-density imaging; organised spread, left frontal origin"}, "eli": "Brain cells talk through junctions called synapses. In schizophrenia many are lost — and this scan shows they go in an orderly pattern starting at one spot, not everywhere at once."}, {"t": "The brain's decision hub rewires itself rather than just working harder", "s": "Tracking the frontoparietal cortex during uncertain decisions, researchers found it does not simply raise its activity when a task gets difficult — it changes which regions it talks to, reorganising its connectivity in real time according to what information the decision needs. That reframes cognitive effort as routing rather than intensity.", "url": "https://www.sciencedaily.com/releases/2026/08/260819041224.htm", "published": "2026-08-20T00:58:26.738631+00:00", "src": "ScienceDaily / neuroimaging", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Cognitive control is routing, not effort", "basis": "Peer-reviewed functional-connectivity study across varying decision demands"}}, {"t": "A drug screen flags dithiocarbamates as TDP-43 stabilisers", "s": "High-content screening identified dithiocarbamates as a chemical class that restores TDP-43 proteostasis — the protein whose mislocalisation defines most ALS and a large share of frontotemporal dementia. Having a tractable chemical series against TDP-43 is what the field has lacked. bioRxiv preprint in cell models; no animal or human data.", "url": "https://www.biorxiv.org/content/10.64898/2026.08.14.741835v1?rss=1", "published": "2026-08-19T00:00:00+00:00", "src": "bioRxiv neuroscience", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A chemical handle on ALS's core protein", "basis": "bioRxiv high-content screen in cell models identifying a TDP-43-stabilising class"}}, {"t": "The cortex thickens years before Alzheimer's amyloid becomes detectable", "s": "Longitudinal MRI in Nature Neuroscience shows cortical thickness changes appearing at least seven years before amyloid turns positive on PET. That reframes the earliest window of Alzheimer's disease and gives a cheap, widely available scan a possible role in spotting people long before current biomarkers do.", "url": "https://www.nature.com/articles/s41593-026-02363-4", "published": "2026-08-19T00:00:00Z", "src": "Nature Neuroscience", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Alzheimer's leaves a structural trace years earlier", "basis": "Longitudinal MRI-PET cohort, peer-reviewed in Nature Neuroscience"}, "eli": "Brain scans picked up a change in the thickness of the brain's outer layer about seven years before the protein doctors currently look for showed up. That means an ordinary MRI might flag Alzheimer's risk far earlier than we thought.", "glance": "The cortex thickens years before Alzheim"}, {"t": "Psilocybin rewires burst firing across the whole brain through 5-HT2A", "s": "Simultaneous Neuropixels recordings of 46,360 single units across 35 mice, with EEG, pupillometry and a 5-HT2A blocker for control, show psilocybin selectively reconfiguring burst coding brain-wide rather than simply raising activity. It gives a mechanistic account of a drug already in late-stage depression trials. Preprint on bioRxiv, animal data, not yet peer-reviewed.", "url": "https://www.biorxiv.org/content/10.64898/2026.08.14.744865v1", "published": "2026-08-19T00:00:00Z", "src": "bioRxiv", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Mechanism for psilocybin's brain-wide effect", "basis": "Preprint; 46,360 units across 35 mice with ketanserin pharmacological control"}, "glance": "Psilocybin rewires burst firing across t"}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Non-invasive recordings decoded into accurate full sentences", "s": "A q-bio.NC preprint reports decoding natural, unconstrained sentences from non-invasive brain recordings with accuracy that previously needed implanted electrodes, using a language-model-conditioned decoder. If it survives review and replication, it matters enormously for people who cannot speak but are not candidates for surgery. Preprint, small cohort, and the decoder leans on strong language priors — a known route to over-optimistic reconstruction scores.", "url": "https://arxiv.org/abs/2608.18114", "published": "2026-08-20T04:00:00+00:00", "src": "arXiv q-bio.NC", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Speech decoding without opening the skull", "basis": "arXiv preprint; sentence-level accuracy from non-invasive recordings, unreplicated"}}, {"t": "Magnetic nanodiscs switch on astrocytes deep in the brain with no implant", "s": "Anti-GLAST-conjugated magnetite vortex nanodiscs plus a low-amplitude alternating magnetic field activated astrocytes selectively in living brain tissue, without viral gene delivery, tethered fibre implants or MRI-scale magnets. Every existing method of targeting these cells needs surgery or gene therapy, so a wireless route is what would make astrocyte neuromodulation usable outside specialist labs. bioRxiv preprint, animal work.", "url": "https://www.biorxiv.org/content/10.64898/2026.08.13.744740v1", "published": "2026-08-19T00:00:00Z", "src": "bioRxiv", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Wireless deep-brain stimulation without genes or implants", "basis": "Preprint; anti-GLAST magnetite nanodiscs activate astrocytes at low magnetic field"}, "glance": "Magnetic nanodiscs switch on astrocytes "}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "Cutting social media does not, by itself, lift young adults' wellbeing", "s": "A controlled trial in which young adults limited their social-media use found no reliable improvement in wellbeing measures against controls — a null result that runs against both popular advice and several widely cited earlier studies. It suggests time-on-app is the wrong lever, and that what people do while there matters more than how long they stay.", "url": "https://www.psychologicalscience.org/", "published": "2026-08-20T16:58:26.738631+00:00", "src": "Psychological Science / APS", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Screen-time limits are the wrong lever", "basis": "Controlled trial with null result; peer-reviewed, contradicts prior correlational work"}}, {"t": "Rewriting a painful childhood memory in imagery cut fear of failure for months", "s": "Researchers at SWPS University and the Nencki Institute had young adults revisit painful childhood memories through imagery-based rescripting, and found lasting reductions in fear, guilt, sadness and stress that persisted months later. Published in Frontiers in Psychology; a controlled study in young adults, so the effect size in older or clinical populations is still open.", "url": "https://www.sciencedaily.com/releases/2026/08/260815064833.htm", "published": "2026-08-18T05:06:35Z", "src": "ScienceDaily / SWPS University", "eli": "Instead of arguing with a bad memory, you re-imagine the scene with a different ending — and the feeling attached to it loosens.", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Durable change from a short imagery protocol", "basis": "Peer-reviewed study in Frontiers in Psychology with months-long follow-up"}, "glance": "Rewriting a painful childhood memory in "}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Serial awakenings map the EEG signature of dreaming versus blank sleep", "s": "Using high-density EEG and repeatedly waking sleepers to ask what, if anything, they were experiencing, researchers isolated the electrical signatures that separate conscious experience during sleep from its absence. Because it compares conscious and unconscious states inside the same sleeping brain, the design removes much of the confound that makes consciousness research hard to interpret.", "url": "https://www.biorxiv.org/", "published": "2026-08-19T23:58:26.738631+00:00", "src": "bioRxiv / serial-awakening EEG", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A clean contrast for consciousness", "basis": "High-density EEG serial-awakening study; preprint, not yet peer-reviewed"}}, {"t": "Travelling brain waves may be the engine that builds what you see", "s": "Researchers argue that electrical waves sweeping across the cortex are not background noise but a core computational mechanism — shaping what gets noticed, predicting what comes next and assembling the brain's internal picture of the world. It is a synthesis of accumulated recording evidence rather than a single new experiment, so treat it as a strong framework claim, not a settled finding.", "url": "https://www.sciencedaily.com/releases/2026/08/260816044827.htm", "published": "2026-08-18T16:40:57Z", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "unclear", "evidence": "early", "verdict": "Travelling waves proposed as perception's mechanism", "basis": "Peer-reviewed synthesis of cortical travelling-wave recordings; framework claim"}, "glance": "Travelling brain waves may be the engine"}]}]}, "mindUpdated": "2026-08-21T01:58:26.738631+00:00", "mindset": {"updated": "2026-08-21T01:58:26.738631+00:00", "messages": [{"who": "Joseph Rodrigues", "t": "Act like you are already there (The Science of Getting Rich)", "vid": "rIwy6GyZU1E", "url": "https://www.youtube.com/watch?v=rIwy6GyZU1E", "gist": "Working from Wallace Wattles' line to 'think and speak of all the things you have asked for in terms of actual present ownership', Rodrigues separates acting-as-if from pretending. Pretending is a conscious performance you have to keep up; what he is describing is placing a single instruction in the subconscious — the decision that you already are what you want to be — and then letting identity, values and skills reorganise around it. His point is that acting like you are already there is the *result* of that decision, not the technique for producing it. The practical takeaway: stop rehearsing the wanting, which reinforces the absence, and settle the question once."}, {"who": "Elmer O. Locker Jr", "t": "Embrace Change — Your Divine Unfolding and New Reality Awaits", "vid": "9kU8UwCcfuY", "url": "https://www.youtube.com/watch?v=9kU8UwCcfuY", "gist": "A short message on how to read a period of upheaval. Locker's frame is that the disruption is the shift itself arriving, not evidence it has failed — you are being pulled into the new state rather than pushed out of the old one. The warning he gives is specific and useful even stripped of the theology: the thing that stalls the change is reacting hard against each piece of turbulence, because every negative reaction quietly downgrades your new assumption from a settled state back to a temporary one you are still auditioning. Hold the assumption steady and let the noise pass."}, {"who": "Abraham Hicks", "t": "You Will Say I Finally Get It Before This One Ends! 💡 Abraham Hicks 2026", "vid": "EFH4--b1Suc", "url": "https://www.youtube.com/watch?v=EFH4--b1Suc", "gist": "The frame here is that a desire is already a reality — a vibrational one — the moment life helps you clarify it, long before it can be seen, heard or touched. Abraham calls that store of clarified wants the vortex, and says you cannot stop creating it; the only variable is whether you tune to its frequency or hold yourself apart from it. The mechanism offered for that is emotion: negative feeling is not a verdict on other people's behaviour but a readout of the gap between what you have become and where your attention currently sits. They retell Jerry's question, 'how do we turn thoughts to things', and Esther's nine months of daily meditation — quieting attention until, absent resistance, the connection arrived as motion before it ever arrived as words. Diversity and contrast are defended as the engine that produces preference in the first place, so the instruction is not to eliminate the unwanted but to stop broadcasting from it."}]}, "mindsetUpdated": "2026-08-21T01:58:26.738631+00:00", "youtube": {"count": 13, "note": "Scanned 274 subscribed channels (268 eligible after EXCLUDE and routing). Ranked by usefulness, knowledge-rich first; every item has a transcript-based takeaway. YouTube's bot check blocked captions on 28 of 56 requested videos this run, so a few of today's uploads could not be gisted and were dropped rather than shown without a real summary.", "groups": [{"h": "🔬 Science, tech & AI", "items": [{"t": "Breakthrough: New Type of Matter Discovered", "s": "A team working with a ferroelectric crystal cooled it until the electrically-polarised domains inside spontaneously braided into a three-dimensional woven fabric — at about 17°C, not near absolute zero. The weave is stable, re-forms in a new pattern each time it is heated and cooled, and parts of it can be rewritten with a green laser. Hossenfelder rates it 0/10 on her nonsense meter and thinks it is Nobel-track material, while noting the laser rewriting is not yet controllable enough for real memory.", "glance": "A genuinely new form of ordered matter appeared at room temperature and can be partly rewritten with light — a plausible route to optical memory and neuromorphic hardware, though control is still crude.", "url": "https://www.youtube.com/watch?v=NzQQXQK_Ngk", "vid": "NzQQXQK_Ngk", "published": "2026-08-20T15:00:38+00:00", "src": "@SabineHossenfelder", "imp": "important", "subject": "Physics & materials"}, {"t": "DeepSeek is back... and Silicon Valley is terrified", "s": "DeepSeek re-emerged with V4 Pro and an open coding harness whose defining idea is that everything is a plugin — model adapter, tools, sandbox, UI, even the agent's central loop — swappable with one line of YAML, which made it the fastest-starred repo in GitHub history. In a one-shot build test it produced a working app in about 30 minutes for roughly $30 and 2.6m output tokens. It landed the same week OpenAI announced a two-week pause on frontier RL, citing a model that may have crossed a critical cyber-capability threshold.", "glance": "Coding agents are becoming modular infrastructure you assemble, not products you buy — you can point the same harness at any model or sandbox.", "url": "https://www.youtube.com/watch?v=xBByvFrqmWU", "vid": "xBByvFrqmWU", "published": "2026-08-20T17:53:37+00:00", "src": "@Fireship", "imp": "important", "subject": "AI"}, {"t": "This is A Heart on a Chip", "s": "Researchers scanned the arteries of real patients across a range of disease severity, turned each into a 3D image, printed it onto glass and built a working replica of that specific artery on a chip. Pumping fluid through the models let them watch clots form live — and the finding was that clotting depends not just on how narrow an artery is but on the particular shape of the vessel and how that shape makes blood flow.", "glance": "Clot risk is driven by an artery's individual geometry, not just its narrowness — which is why patient-specific chips could personalise treatment.", "url": "https://www.youtube.com/watch?v=yEbT5hb0xWs", "vid": "yEbT5hb0xWs", "published": "2026-08-20T14:36:36+00:00", "src": "@CleoAbram", "imp": "important", "subject": "Health"}, {"t": "Claude’s Text Watermark Could Follow It Everywhere", "s": "Anthropic is adding a watermark woven into the text Claude generates rather than into metadata, so it survives copy-paste and reportedly some editing. The likely mechanism is nudging the model's choice between near-synonymous tokens to leave a statistical pattern invisible to readers but detectable by a tool. The pushback is substantive: it may also flag text Claude only edited, and raises questions about privacy and copyright on AI-assisted code.", "glance": "Text watermarks travel with the words themselves, so provenance now follows a copy-paste — and may not distinguish writing from editing.", "url": "https://www.youtube.com/watch?v=O-8TbMFOAfg", "vid": "O-8TbMFOAfg", "published": "2026-08-20T12:41:43+00:00", "src": "@mreflow", "imp": "important", "subject": "AI"}]}, {"h": "📈 Business & economics", "items": [{"t": "Why you shouldn't worry about the fertility crisis", "s": "A new paper by Nobel laureate Daron Acemoglu and co-authors finds the biggest fertility collapses in history — China, Japan, South Korea — coincided with growth miracles rather than disasters, and that countries with the lowest 1950 fertility grew faster over the next 70 years. The mechanism is labour scarcity forcing mechanisation, as it did on British farms during Napoleonic-era naval conscription. MoneyMacro then argues why this time may differ: 1950's lowest fertility was Austria at 2.0, while South Korea is now at 0.8, a collapse in the talent pool with no historical precedent.", "glance": "Falling birth rates historically forced innovation and raised productivity — but today's ultra-low rates are a different order of magnitude, so the reassuring precedent may not hold.", "url": "https://www.youtube.com/watch?v=IabDOXf7Acs", "vid": "IabDOXf7Acs", "published": "2026-08-20T12:30:26+00:00", "src": "@MoneyMacro", "imp": "important", "subject": "Economics", "points": [{"t": "The doom case has two legs", "s": "Fewer workers supporting more pensioners, plus the claim that younger populations are uniquely innovative and aging ones bottleneck talent."}, {"t": "History contradicts the second leg", "s": "Low-fertility countries in 1950 went on to export significantly more high-tech products, not fewer — labour scarcity pushed them up the value chain."}, {"t": "Scarcity mechanises economies", "s": "When the Royal Navy stripped coastal regions of working-age men, wages rose and British farms mechanised — the same pattern behind East Asian robotics adoption."}, {"t": "But the scale is now unprecedented", "s": "Austria's 2.0 in 1950 was near replacement; Korea's 0.8 shrinks each generation by 38%, and its birth cohorts fell from 650,000 a year to 230,000."}, {"t": "The practical read", "s": "Expect aging economies to automate hard rather than simply stagnate — but don't assume the historical offset scales to ultra-low fertility."}], "pointsLabel": "Takeaways"}, {"t": "ALERT: Indian IT Revenue Per Employee Spikes As Workforce Rationalization Accelerates", "s": "India's five largest IT firms booked $25.6bn combined in Q1 FY27 with revenue per employee up at all five — but TCS and Wipro added staff while Infosys, HCLTech and Tech Mahindra cut it. Analyst Gaurav Vasu attributes roughly 60% of the improvement to workforce rationalisation and only 40% to AI efficiency, and notes AI-led services are still only about 8.2% of Infosys revenue. The presenter's own read is blunt: the sector looks leaner rather than smarter, with old contracts still running out before AI can reset the economics.", "glance": "Indian IT's productivity jump is mostly headcount reduction wearing an AI label — the pyramid is breaking before the AI revenue arrives to replace it.", "url": "https://www.youtube.com/watch?v=gUnKwCyW7qo", "vid": "gUnKwCyW7qo", "published": "2026-08-20T15:30:19+00:00", "src": "@aimmediahouse", "imp": "important", "subject": "Business"}, {"t": "BREAKING: India Bans Import Of 405 Defence Items In Massive ₹3,070 Crore Local Push", "s": "India banned imports of 405 more defence items — Su-30 MKI engine parts, T-90 tank components, radar and sonar systems, Konkurs-M missile parts — in the sixth indigenisation list since 2020, phasing out between December 2026 and December 2029. The presenter is careful about what it does and doesn't mean: these are Russian-designed platforms, so what is being localised is the supply chain beneath them, not the designs. Domestic share of the defence budget has moved from 36% to over 65% in five years and exports have grown roughly 30-fold to ₹21,083 crore.", "glance": "India is localising the supply chains under foreign-designed weapons rather than the designs themselves — real progress, but this list is about 1% of the 2030 target.", "url": "https://www.youtube.com/watch?v=0a_AKuKJ1BY", "vid": "0a_AKuKJ1BY", "published": "2026-08-20T14:00:24+00:00", "src": "@aimmediahouse", "imp": "important", "subject": "India / defence"}]}, {"h": "🛠️ Practical & craft", "items": [{"t": "Essentials: How to Access Your Creativity | Rick Rubin", "s": "Rick Rubin's account of creativity, condensed by Huberman. Ideas behave like clouds or dreams — they change shape as you look and vanish if you don't catch them — and the work is not intellectual analysis but noticing what produces a feeling of interest in you. His central claim about perception is that we constantly invent explanatory stories for what we see, then remember the invention as fact, which means our resolution on almost everything is far lower than we assume. The practical consequence: creativity depends on staying present in the work, not on being happy.", "glance": "Creative output depends on staying undistracted and noticing what genuinely interests you — not on mood, technique, or believing you already understand what you're looking at.", "url": "https://www.youtube.com/watch?v=QP8Kpf1UQwM", "vid": "QP8Kpf1UQwM", "published": "2026-08-20T12:00:13+00:00", "src": "@hubermanlab", "imp": "important", "subject": "Creativity", "points": [{"t": "Ideas are weather, not objects", "s": "An idea looks like one thing now and something else an hour later, and can be gone entirely — so capture it when it appears rather than evaluating it."}, {"t": "You are always inventing stories", "s": "See someone running, invent 'chasing his dog', and you'll later recall it as fact. Most of what we 'know' is a first plausible guess we stopped questioning."}, {"t": "Presence beats happiness", "s": "Plenty of unhappy people create well. What matters is whether you can stay in the work — feelings only interfere when they block you feeling the work."}, {"t": "Clues repeat", "s": "One recommendation is coincidence; three of the same thing probably isn't. Pay attention to what keeps arriving."}, {"t": "Belief is load-bearing", "s": "If you believe you can make something great, your odds improve. Harnessing belief on your own behalf is a practical act, not a mystical one."}], "pointsLabel": "Takeaways"}, {"t": "Seedance 2.5 Tutorial: How to Make AI Videos With Seedance in 2026", "s": "A working manual for Seedance 2.5 built around one principle: the model takes four inputs that each own a different job, and stuffing all four into the prompt box is why results drift. Text owns intent and event order; image references own identity and style; a video reference owns motion; audio owns timing. If a detail can live in a reference it should never go in the prompt. Chain actions with 'while' and 'then', give each subject exactly one verb, and name concrete materials — 'a copper pot on a marble counter' reproduces reliably where 'a fancy kitchen' does not.", "glance": "Put identity in references and events in the prompt, chain actions with 'while' and 'then', and give every subject exactly one verb — stacking two actions on one subject is what collapses success rates.", "url": "https://www.youtube.com/watch?v=AuviLdG_PSc", "vid": "AuviLdG_PSc", "published": "2026-08-20T17:23:05+00:00", "src": "@iamAImaster", "imp": "important", "subject": "AI video", "points": [{"t": "Four inputs, four jobs", "s": "Prompt = intent and order. Images = identity and style. Video = motion. Audio = timing. Describing motion in text while feeding a motion reference makes them fight."}, {"t": "Bind actions with time words", "s": "'While' and 'then' are parsed as timing instructions. A flat list of subjects gives you a photo with jitter; a causal chain gives you a scene."}, {"t": "One verb per subject", "s": "Three subjects doing one thing each works fine. Adding a second action to the same subject collapsed success across eight runs — split it into another clip."}, {"t": "Name materials, not adjectives", "s": "Naming a material hands the model its physics free — 'water on a steel counter' spreads and reflects correctly. 'Fancy' gets you a different room every run."}, {"t": "Build face sets from several angles", "s": "Front-on-only reference photos mean the model invents a profile whenever your subject turns away. Keep motion references under 15 seconds and shoot locked-off."}], "pointsLabel": "Practical rules"}]}, {"h": "💭 Ideas", "items": [{"t": "What will happen to thieves criminals, Rowdy in the AI era: evolution of stealing job", "s": "A speculative but coherent argument that theft is migrating from objects to attention. The claim is that as AI systems accumulate a complete picture of your weaknesses, the profitable crime stops being taking your things and becomes steering your decisions — supplying cues timed to land in the gaps between what he describes as roughly 50-millisecond spikes of conscious registration. His concrete recommendation is to avoid short-form video, which he argues is the most efficient delivery mechanism for exactly this. Treat the neuroscience as the speaker's own framework rather than established consensus.", "glance": "The argument worth taking seriously: as systems learn your weak points, influence becomes cheaper than theft — and short-form video is the delivery channel best suited to it.", "url": "https://www.youtube.com/watch?v=5rzJ0zM1CVE", "vid": "5rzJ0zM1CVE", "published": "2026-08-20T13:00:16+00:00", "src": "@AnirbanBandyopadhyay", "imp": "important", "subject": "AI & society"}]}, {"h": "🎬 Shorts", "items": [{"t": "SpaceX AI Compute: Under 1 Year Payback! Insane Growth Ahead! #shorts", "s": "SpaceX disclosed on its Q2 2026 earnings call that the payback period on its AI compute capex is under a year, against a norm of five to ten years for capital investment and twenty-plus for heavy infrastructure. The argument for why: inference demand is effectively unbounded, nobody can bring compute online as fast or as cheaply, so every AI company queues up — and the moment they get capacity they raise usage limits and revenue immediately.", "glance": "A sub-one-year payback on compute capex is the number that explains why SpaceX's AI business could scale to hundreds of billions in annual revenue.", "url": "https://www.youtube.com/watch?v=aueKy-jsqqY", "vid": "aueKy-jsqqY", "published": "2026-08-21T00:39:51+00:00", "src": "@SolvingTheMoneyProblem", "imp": "important", "subject": "Business", "short": true}, {"t": "SpaceX's AI Compute: The Ultimate Money Printer! #shorts", "s": "The claim is that Anthropic and Google are collectively paying SpaceX over $2bn a month for AI compute — which, if accurate, is the strongest available evidence they could not build equivalent capacity themselves as fast or as cheaply. The reasoning is that no buyer at that scale rents when building is viable.", "glance": "Rental spend at that scale is itself the evidence: if the biggest labs could build this capacity themselves, they would not be paying $2bn a month to lease it.", "url": "https://www.youtube.com/watch?v=AdkYSNusBC4", "vid": "AdkYSNusBC4", "published": "2026-08-20T12:32:29+00:00", "src": "@SolvingTheMoneyProblem", "imp": "important", "subject": "Business", "short": true}, {"t": "Humanity's Offsite Backup: Moon & Mars Colonies #shorts", "s": "A compact framing of the Mars-and-Moon case as disaster recovery: humanity currently runs without an off-site backup, and the whole argument is about building one while the option exists. Explicitly not an argument against fixing problems on Earth — the analogy is that backing up your drive was never a reason to stop maintaining it.", "glance": "The colonisation case reframed as ordinary risk management: you build the off-site backup while you still can, not instead of maintaining the primary.", "url": "https://www.youtube.com/watch?v=ZDLBBXqqx6w", "vid": "ZDLBBXqqx6w", "published": "2026-08-20T21:02:30+00:00", "src": "@SolvingTheMoneyProblem", "imp": "important", "subject": "Space", "short": true}]}]}};

/* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

      text=typeof res==="string"?res:(res&&(res.text||res.content||res.output))||JSON.stringify(res);

}

  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
