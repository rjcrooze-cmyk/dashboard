"Frontier-grade coding model, free, unattributed", "url": "https://techcrunch.com/2026/08/23/whos-behind-the-new-stealth-model-ox-alpha/", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Frontier coding capability, free and anonymous", "basis": "Live on OpenRouter; independent developer reports; provider undisclosed"}}, {"t": "AI-written exploits move from theory to active threat", "s": "OpenAI policy chief Chris Lehane warned of a new chapter of 'persistent' AI-driven cyber-attacks, days after a joint CISA/FBI/NSA/DOE/EPA advisory said attackers are already using AI-generated Python scripts against energy and water control systems and called it an active, not theoretical, risk. In the same window, Iran-linked hackers were blamed for a four-day UK power plant shutdown, though officials have not tied AI to that specific intrusion. The use-case cuts both ways: the same capability that writes the exploit is what defenders now have to run continuously.", "heat": 84, "delta": "new", "sources": 3, "glance": "Agencies call AI-written exploits active", "url": "https://www.theguardian.com/technology/2026/aug/23/openai-cyber-attacks-threat-chris-lehane", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Offensive AI is operational, not hypothetical", "basis": "Five-agency joint advisory citing AI-generated exploitation scripts in the wild"}}, {"t": "Anthropic weighs an IPO that could top $100 billion", "s": "Reports say Anthropic is preparing a listing that would rival or exceed SpaceX's record raise, with the filing expected to name AI backlash among its risk factors. Business story rather than capability story, but it sets the funding cadence the whole frontier-model field runs on.", "heat": 80, "delta": "rising", "sources": 4, "glance": "Anthropic eyes record-scale listing", "url": "https://www.nytimes.com/2026/08/21/technology/anthropic-ipo-100-billion.html", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Reported plan, not a filed prospectus", "basis": "Multiple outlets citing sources; no S-1 on file"}}, {"t": "OpenAI absorbs the Instant team and shuts its cloud", "s": "The Instant database team is joining OpenAI, closing new signups immediately, giving existing users twelve months to migrate and shutting cloud apps on 31 August 2027. Instant's founders said most of their usage had shifted to agents. The product stays open source with a self-hosting guide, so the practical effect is another sync-layer team folded into agent tooling.", "heat": 74, "delta": "new", "sources": 2, "glance": "OpenAI takes another agent-infra team", "url": "https://www.instantdb.com/essays/instant_team_joins_openai", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Confirmed acquihire, cloud sunsetting", "basis": "Announced by Instant's founders with dated shutdown timeline"}}, {"t": "Anthropic's top model struggles against cheaper rivals", "s": "An FT report says Anthropic's flagship is losing usage share to cheaper models even where benchmarks favour it, with buyers optimising on cost per task rather than peak capability. It is the clearest read yet that the frontier premium is getting harder to defend.", "heat": 68, "delta": "new", "sources": 3, "glance": "Cost beats capability in model buying", "url": "https://www.ft.com/content/5ee49718-c258-4f01-aa32-7e5b76ae5245", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Single report on a shifting market", "basis": "FT sourcing on usage trends; no vendor numbers published"}}, {"t": "Qwen 3.8 27B finishes a reverse-engineering job in half an hour", "s": "A developer handed Alibaba's 27-billion-parameter Qwen 3.8 a reverse-engineering task and reported it completed in about 30 minutes, work that would normally take a frontier model or a person far longer. Single anecdotal report, not a benchmark, but it fits the pattern of small open-weight Chinese models closing on frontier behaviour for narrow tasks.", "heat": 64, "delta": "new", "sources": 2, "glance": "27B open model handles hard RE task", "url": "https://www.xda-developers.com/qwen-3-8-27b-reverse-engineering-job-frontier-model/", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "One anecdote, not a measured result", "basis": "Single developer write-up; no reproducible benchmark published"}}, {"t": "Z.ai delays GLM-5.3 over cybersecurity concerns", "s": "The Chinese lab pushed back the GLM-5.3 release citing cybersecurity risk, days after developers reported using GLM-5.3 builds in practice. A model held back on security grounds is now a recurring pattern rather than a one-off.", "heat": 58, "delta": "new", "sources": 2, "glance": "Chinese lab holds a release on security", "url": "https://betanews.com/2026/08/22/z-ai-delays-glm-5-3-release-over-cybersecurity-risks/", "assess": {"mag": 3, "timeline": "now", "evidence": "early", "verdict": "Vendor-stated delay, reasons unverified", "basis": "Company statement reported secondhand; no technical detail released"}}, {"t": "OpenAI cuts GPT-5.6 Sol developer pricing by over 20%", "s": "The price reduction on OpenAI's frontier reasoning model landed at the top of Hacker News and remains the reference point for the current round of undercutting. A day old now and priced in — the follow-on question is whether rivals match rather than whether the cut happened.", "heat": 56, "delta": "cooling", "sources": 2, "glance": "Frontier inference gets 20% cheaper", "url": "https://developers.openai.com/api/docs/models/gpt-5.6-sol", "assess": {"mag": 3, "timeline": "now", "evidence": "proven", "verdict": "Confirmed cut, already absorbed", "basis": "Listed on OpenAI's own model pricing docs"}}, {"t": "A DeepMind-alumni agent outperforms OpenAI and Anthropic at replication", "s": "Inherent says its research 'teammate' beat frontier assistants at reproducing published results end to end. Vendor-reported, on the company's own evaluation, so the number needs independent replication — which is a pointed irony for a replication benchmark.", "heat": 52, "delta": "cooling", "sources": 2, "glance": "Agent claims replication-benchmark lead", "url": "https://techcrunch.com/2026/08/22/inherent-founded-by-deepmind-alumni-says-its-ai-teammate-just-outperformed-anthropic-and-openai/", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "early", "verdict": "Vendor benchmark, not yet reproduced", "basis": "Self-reported evaluation by the vendor; no third-party run"}}, {"t": "Model labs build chips while chipmakers build models", "s": "Coverage this weekend framed the convergence plainly: Anthropic and OpenAI are pushing into custom silicon for inference cost, while Nvidia and AMD keep shipping their own models. Both sides are trying to own the margin the other currently takes.", "heat": 50, "delta": "new", "sources": 3, "glance": "Model labs and chipmakers swap lanes", "url": "https://www.chosun.com/english/industry-en/2026/08/24/ai-model-firms-develop-chips/", "assess": {"mag": 3, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Strategy shift still mostly on paper", "basis": "Reported plans and early silicon; no shipped lab-designed inference chip"}}, {"t": "OpenAI asks California to tighten its own AI safety law", "s": "OpenAI told legislators the state's newly passed AI safety bill should be strengthened, an unusual position for a company that lobbied against earlier versions. Read one way it is a bid for a single federal-grade standard rather than a patchwork.", "heat": 46, "delta": "new", "sources": 3, "glance": "OpenAI pushes to harden state AI law", "url": "https://techcrunch.com/2026/08/23/openai-says-california-should-strengthen-its-ai-safety-bill/", "assess": {"mag": 3, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Real filing, uncertain legislative outcome", "basis": "OpenAI's written submission on California's passed AI safety bill"}}, {"t": "Nvidia's quarter lands as the AI-chip trade wobbles", "s": "Nvidia reports this week with semiconductor sentiment already unsettled, Samsung approving a record $80 billion shareholder return on the AI memory boom, and SK Hynix weighing a Japanese HBM plant. The print is the sector's clearest read on whether datacentre demand is still accelerating.", "heat": 44, "delta": "new", "sources": 4, "glance": "Nvidia print tests the AI-chip trade", "url": "https://www.livemint.com/market/shares-flat-in-asia-before-iran-sanctions-news-nvidia-results-11787532489714.html", "assess": {"mag": 3, "timeline": "now", "evidence": "strong", "verdict": "Scheduled result, outcome unknown", "basis": "Earnings date confirmed; sector context from Samsung and SK Hynix moves"}}, {"t": "Chinese groups model American voters to test political messaging", "s": "Reporting says Chinese organisations have built simulated electorates from US voter data to pre-test political messages. Sourcing is thin and the claim is contested, but it names a use of population-scale simulation that election authorities have no framework for.", "heat": 38, "delta": "new", "sources": 2, "glance": "Simulated electorates as message labs", "url": "https://news.ycombinator.com/item?id=49404517", "assess": {"mag": 2, "timeline": "unclear", "evidence": "speculative", "verdict": "Contested claim, thin sourcing", "basis": "Social-media-originated reporting; no primary documentation seen"}}, {"t": "Seven ESP32 microcontrollers wired into a working 0.4B LLM", "s": "A hobbyist split a roughly 0.4-billion-parameter model across seven ESP32 boards and got it generating. Useless as a product, genuinely interesting as a floor-test of how little silicon a working language model actually needs.", "heat": 30, "delta": "new", "sources": 2, "glance": "An LLM running on hobby microcontrollers", "url": "https://www.xda-developers.com/someone-wired-up-seven-esp32s-to-create-a-04b-llm-and-so-can-you/", "assess": {"mag": 2, "timeline": "unclear", "evidence": "proven", "verdict": "A demonstrated novelty, not a platform", "basis": "Working build documented with parts list and output"}}]}, "aitrendsUpdated": "2026-08-24T07:50:46+05:30", "science": {"updated": "2026-08-24T07:50:46+05:30", "items": [{"t": "Heat is steered like a beam at room temperature for the first time", "s": "A UCLA team used boron arsenide and a nanoscale gold probe that acts as both heater and sensor to observe phonon focusing — heat travelling in directed, ray-like patterns instead of spreading evenly — at about 300 K. Reported in Nature Physics, it is a measured observation, not a device: the use-case is thermal management in dense chips, where heat could be guided and drained along chosen paths rather than dumped in all directions.", "tag": "Physics & Space", "imp": "important", "glance": "Heat steered like light in chips", "url": "https://www.sciencealert.com/scientists-observe-quantum-heat-waves-at-room-temperature-for-the-first-time", "published": "2026-08-24T01:30:00+05:30", "src": "Nature Physics / UCLA", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "proven", "verdict": "Chip cooling gains a steering wheel", "basis": "Phonon focusing directly observed at ~300K in boron arsenide, Nature Physics"}, "eli": "Heat normally spreads out in every direction, like ink in water. The team made it travel in narrow beams instead, at ordinary room temperature. If you can aim heat, you can pull it out of a hot chip on purpose instead of hoping it escapes."}, {"t": "A plastic that boils away when heated, then rebuilds itself as the same polymer", "s": "Chemical engineers at the University of Surrey made poly(1,2-dithiolane), whose sulfur-sulfur links break reversibly: heat turns it to vapour at relatively low temperature and it re-polymerises on cooling. Published in Macromolecules as a proof of concept — the researchers explicitly say it is not a replacement for conventional plastics — the use-case is genuinely circular packaging, where a material can be depolymerised to clean monomer and reused rather than downcycled.", "tag": "Chemistry", "imp": "important", "glance": "Plastic that unmakes and remakes itself", "url": "https://www.sciencealert.com/a-new-kind-of-plastic-vaporizes-when-heated-and-then-reassembles-itself", "published": "2026-08-23T20:30:00+05:30", "src": "Macromolecules / University of Surrey", "assess": {"mag": 4, "timeline": "10+ yrs", "evidence": "early", "verdict": "A real route to circular plastic", "basis": "Lab proof-of-concept polymer in Macromolecules; authors stress it is not a drop-in"}}, {"t": "Quantum signals cross 13 miles of open air between two New York labs", "s": "Brookhaven National Laboratory and Stony Brook University sent few-photon quantum states 21 km through the atmosphere in a daytime demonstration on August 21, using astronomy-derived turbulence correction to keep the states intact. It is the first US free-space link of its kind and bolts a wireless hop onto the country's longest quantum network. The use-case is reaching sites where laying fibre is impractical, and working at wavelengths fibre handles badly.", "tag": "Physics & Space", "imp": "important", "glance": "Quantum link without any fibre", "url": "https://interestingengineering.com/science/building-quantum-network-in-open-air", "published": "2026-08-23T19:33:26+05:30", "src": "Brookhaven National Laboratory / Stony Brook", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Quantum networks escape the cable", "basis": "First US free-space quantum link, 21 km, demonstrated 21 Aug on a live network"}}, {"t": "A weekly GLP-1 shot beats daily insulin in thalassaemia-driven diabetes", "s": "In a 24-week randomised trial published in Diabetologia, a team from Ain Shams University in Egypt gave 80 adolescents with transfusion-dependent beta-thalassaemia diabetes either weekly dulaglutide or standard daily insulin. The GLP-1 arm spent more time in the healthy glucose range with better variability and no excess hypoglycaemia. Peer-reviewed but a single small trial; the use-case is replacing daily injections with one weekly shot for a group with no dedicated treatment pathway.", "tag": "Health", "imp": "important", "glance": "Weekly shot replaces daily insulin", "url": "https://www.sciencealert.com/one-type-of-diabetes-responds-better-to-a-weekly-glp-1-drug-than-to-insulin", "published": "2026-08-23T13:30:00+05:30", "src": "Diabetologia / Ain Shams University", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "A simpler regimen for a neglected group", "basis": "Randomised 24-week trial, n=80 adolescents, Diabetologia; single-centre"}}, {"t": "A football-field-sized airship doubles the altitude of airborne wind power", "s": "China's S4000 stratospheric wind system flew its turbine to 13,123 ft, twice the height reached by earlier airborne designs, and generated power there. Winds are stronger and steadier at altitude, so the use-case is delivering grid power to sites where towers are impractical — islands, disaster zones and remote industry — without the foundations a conventional turbine needs. Still a flight demonstration, not a deployed system.", "tag": "Energy", "imp": "important", "glance": "Airborne turbine doubles its altitude", "url": "https://interestingengineering.com/energy/china-s4000-stratosphere-airborne-wind-turbine", "published": "2026-08-23T19:59:15+05:30", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "High-altitude wind clears a real bar", "basis": "S4000 airship generated power at 13,123 ft, double the prior airborne record"}}, {"t": "A quantum trick pushes coherent X-rays past a long-standing energy ceiling", "s": "UC San Diego and TU Wien found a quantum regime that generates coherent X-rays at higher energies than the accepted limit allowed, opening a cheaper route to hard-X-ray light without a synchrotron. Useful for imaging, materials inspection and chip metrology.", "tag": "Physics", "imp": "important", "glance": "Coherent X-rays break an energy limit", "url": "https://scitechdaily.com/quantum-experiment-breaks-a-long-standing-x-ray-energy-limit/", "src": "UC San Diego / TU Wien", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Table-top route to harder coherent X-rays", "basis": "Experiment demonstrating a new quantum regime above the prior X-ray energy limit"}, "published": "2026-08-23T07:07:17+05:30"}, {"t": "A once-daily pill brings skin colour back in vitiligo", "s": "A daily oral drug produced meaningful repigmentation in people with vitiligo in a controlled trial — the first pill-based option in a condition treated so far mainly with creams and light therapy. Peer-reviewed trial data; effects build over months rather than weeks.", "tag": "Health", "imp": "important", "glance": "Oral drug repigments vitiligo skin", "url": "https://www.sciencealert.com/this-once-daily-pill-helps-the-skin-regain-its-color-in-people-with-vitiligo", "src": "ScienceAlert", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "First real oral option for vitiligo", "basis": "Controlled trial showing repigmentation from a once-daily oral drug"}, "published": "2026-08-23T05:49:17+05:30"}, {"t": "Engineered natural killer cells finally get inside solid tumours", "s": "Stanford Medicine researchers re-engineered natural killer cells so they can enter and persist inside solid tumours, which has been the main barrier to using them as a cancer therapy; treated mice showed slowed tumour growth. Preclinical mouse work, not yet in patients.", "tag": "Health", "imp": "important", "glance": "NK cells breach solid tumours in mice", "url": "https://scitechdaily.com/scientists-supercharge-natural-killer-cells-to-attack-solid-tumors/", "src": "Stanford Medicine / SciTechDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Cracks the solid-tumour barrier for NK therapy", "basis": "Mouse study: engineered NK cells entered solid tumours and slowed growth"}, "published": "2026-08-23T03:19:17+05:30"}, {"t": "A stem-cell therapy improved nine in ten patients in the largest heart-failure trial yet", "s": "A Chinese multicentre trial of a cell therapy for chronic heart failure reported significant improvement in about 90% of participants, making it the largest trial of its kind to report. Results are from the trial investigators and await independent replication and full peer-reviewed publication.", "tag": "Health", "imp": "important", "glance": "Largest cardiac stem-cell trial reports gains", "url": "https://interestingengineering.com/science/heal-chf-stem-cell-heart-failure-trial", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "early", "verdict": "Biggest cardiac cell-therapy signal so far", "basis": "Largest reported heart-failure cell trial; investigator-reported, awaiting replication"}, "published": "2026-08-23T02:07:17+05:30"}, {"t": "A platinum-nickel catalyst keeps splitting water for 3,000 hours", "s": "Korean researchers used atomic-level engineering to build a Pt-Ni hydrogen catalyst that ran continuously for 3,000 hours without meaningful decay — durability, not peak activity, is what has kept green-hydrogen electrolysers expensive. Lab-scale demonstration.", "tag": "Energy", "imp": "important", "glance": "Hydrogen catalyst lasts 3,000 hours", "url": "https://interestingengineering.com/innovation/atomic-engineering-produces-hydrogen-catalyst-that-lasts-3000-hours", "src": "Interesting Engineering", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Durability was the electrolyser bottleneck", "basis": "3,000-hour continuous run of a Pt-Ni catalyst at lab scale"}, "published": "2026-08-22T23:37:17+05:30"}]}, "scienceUpdated": "2026-08-24T07:50:46+05:30", "scienceDaily": {"updated": "2026-08-24T07:50:46+05:30", "items": [{"t": "AI decodes the hidden 'on switch' that starts about 60% of human genes", "s": "A model trained on roughly 500,000 DNA sequences identified the initiator element — the short signature that tells the cell where to begin transcribing — and found it in about 60% of human genes. Peer-reviewed work with a direct use-case: it lets clinicians predict whether a mutation in a non-coding region will actually break gene expression, and gives gene-therapy designers a reliable start signal to build in.", "tag": "Biology", "imp": "important", "glance": "The start signal in most human genes", "url": "https://www.sciencedaily.com/releases/2026/08/260823014943.htm", "published": "2026-08-23T17:44:40+05:30", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "Gene regulation gets a readable key", "basis": "Initiator motif identified across ~500,000 sequences, present in ~60% of human genes"}, "eli": "Every gene needs a 'start here' mark so the cell knows where to begin reading it. Most of those marks were invisible to us. An AI trained on half a million DNA stretches found the pattern, so now we can tell when a mutation has erased a gene's start button."}, {"t": "Zirconia dental crowns go from 100 hours of processing to under 30 minutes", "s": "Researchers cut the sintering and processing time for 3D-printed zirconia crowns from as much as 100 hours to below half an hour while keeping strength in the usable range. The use-case is immediate: a permanent, custom, full-strength crown printed and fitted in one appointment, replacing the temporary-crown-plus-second-visit routine.", "tag": "Health", "imp": "important", "glance": "Permanent crown in one visit", "url": "https://www.sciencedaily.com/releases/2026/08/260822015217.htm", "published": "2026-08-23T20:06:33+05:30", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "1-2 yrs", "evidence": "strong", "verdict": "Same-day permanent crowns become real", "basis": "Zirconia processing cut from ~100 hours to under 30 minutes at usable strength"}}, {"t": "Turning coating 'defects' into droplet seeds boosts heat transfer 5.5-fold", "s": "An ultrathin polymer coating whose tiny structures were previously treated as flaws turns out to give water droplets a place to nucleate during condensation, then helps them detach fast — raising condensation heat transfer about 5.5 times. Condensers sit inside power plants, desalination units and air conditioning, so the use-case is straightforward efficiency in equipment that already exists.", "tag": "Energy", "imp": "important", "glance": "Condenser efficiency up 5.5 times", "url": "https://www.sciencedaily.com/releases/2026/08/260823014940.htm", "published": "2026-08-23T11:19:40+05:30", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "A cheap coating buys real efficiency", "basis": "5.5x condensation heat-transfer gain from an ultrathin polymer coating, peer-reviewed"}}, {"t": "An old compound burns fat without stripping muscle, in mice", "s": "TOFA, a decades-old molecule, raised energy expenditure by up to 18% in mice, cut body fat with no significant muscle loss, and improved blood sugar, triglycerides and fatty liver. This is animal work only, and the muscle-sparing claim is exactly what needs replication in humans — but it points at a different lever from the appetite suppression that current obesity drugs rely on.", "tag": "Health", "imp": "important", "glance": "Fat loss without muscle loss, in mice", "url": "https://www.sciencedaily.com/releases/2026/08/260823014953.htm", "published": "2026-08-23T15:54:17+05:30", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "A second lever on obesity, in animals", "basis": "Mouse study: +18% energy use, fat loss without significant muscle loss"}}, {"t": "Cannabis use tracks with 37% higher stroke risk across 100 million people", "s": "A pooled analysis covering more than 100 million people found recreational drug use associated with markedly higher stroke risk — nearly double for cocaine, more than double for amphetamines, and 37% higher for cannabis — including in younger adults. It is observational, so it shows association rather than cause, but at this scale it is directly usable in clinical risk conversations as cannabis access widens.", "tag": "Health", "imp": "important", "glance": "Cannabis linked to 37% more strokes", "url": "https://www.sciencedaily.com/releases/2026/08/260822015215.htm", "published": "2026-08-23T11:03:17+05:30", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Stroke risk belongs in the cannabis talk", "basis": "Pooled observational analysis, >100 million people; association not causation"}}, {"t": "Freezing a fibre's core makes light and sound interact 1,000x more strongly", "s": "Freezing the liquid core of an optical fibre created conditions where light and sound couple more than a thousand times more strongly than in ordinary fibre — the effect underpinning fibre sensors, signal processing and narrow-linewidth lasers. Reported by the research team; lab-scale.", "tag": "Physics", "imp": "important", "glance": "Frozen fibre boosts light-sound coupling 1,000x", "url": "https://www.sciencedaily.com/releases/2026/08/260821012228.htm", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "3-5 yrs", "evidence": "strong", "verdict": "A thousandfold jump in a workhorse effect", "basis": "Frozen-core fibre showed >1,000x stronger light-sound interaction in lab tests"}, "published": "2026-08-22T18:49:17+05:30"}, {"t": "A yeast beta-glucan supplement restored anti-tumour immunity in mice", "s": "A simple yeast-derived food supplement reversed the immune suppression that lets tumours grow in mice, restoring the immune system's ability to attack cancer cells. Mouse study only — a cheap oral adjunct is the appeal, but nothing here has been tested in people.", "tag": "Health", "imp": "important", "glance": "Yeast supplement revives tumour immunity in mice", "url": "https://www.sciencedaily.com/releases/2026/08/260821012230.htm", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "early", "verdict": "Cheap oral route to restoring tumour immunity", "basis": "Mouse study: yeast beta-glucan restored anti-tumour immune function"}, "published": "2026-08-22T16:25:17+05:30"}]}, "scienceDailyUpdated": "2026-08-24T07:50:46+05:30", "life": {"updated": "2026-08-24T07:50:46+05:30", "items": []}, "lifeUpdated": "2026-08-24T07:50:46+05:30", "mind": {"updated": "2026-08-24T07:50:46+05:30", "groups": [{"h": "🧠 Neuroscience & Brain", "items": [{"t": "Alzheimer's biggest risk gene shrinks neurons years before memory fails", "s": "Researchers found that APOE4 raises levels of a protein called Nell2, which shrinks neurons and degrades memory circuits well before any symptom appears — offering a mechanism for why the gene is so damaging rather than just a statistical association. Peer-reviewed, but the work is in mice, so the human timeline is unestablished.", "url": "https://www.sciencedaily.com/releases/2026/08/260823014945.htm", "published": "2026-08-23T20:30:00+05:30", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "A mechanism behind the biggest risk gene", "basis": "APOE4 to Nell2 to neuronal shrinkage shown in mice, peer-reviewed"}, "eli": "One gene, APOE4, makes Alzheimer's far more likely. Nobody knew quite why. It turns out it raises a protein that makes brain cells physically shrink, and that starts long before anyone notices memory trouble — which is exactly when a treatment would need to arrive."}, {"t": "The brain signals a coming relapse before the drinking restarts", "s": "Mice that developed compulsive drinking after a period of abstinence showed more than double the normal activity in a stress-and-addiction region — and crucially the signal appeared before they drank again, not after. Animal work, but a pre-relapse marker is a different kind of target from treating relapse once it has happened.", "url": "https://www.sciencedaily.com/releases/2026/08/260823014820.htm", "published": "2026-08-23T08:00:00+05:30", "src": "ScienceDaily", "assess": {"mag": 4, "timeline": "5-10 yrs", "evidence": "strong", "verdict": "Relapse announces itself in advance", "basis": "Doubled activity in stress-addiction region preceded relapse drinking in mice"}}]}, {"h": "🔌 Brain–Computer Interfaces", "items": [{"t": "Nothing new today in this area", "s": "A full scan of the Nature, Cell, ScienceDaily, bioRxiv and APS feeds plus a targeted web sweep turned up no Major or Historic peer-reviewed result in this group inside the window.", "url": "", "published": "", "src": "", "assess": {"mag": 4, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result today", "basis": "Full mind feed set scanned; nothing met the Major/Historic bar"}}]}, {"h": "🧩 Psychology & Cognition", "items": [{"t": "Speaking several languages tracks with a brain that looks years younger", "s": "In a large multi-country cohort, people who spoke several languages showed brain-age estimates well below their chronological age — about 13 years younger for four-language speakers. Observational, so it cannot show that learning a language causes the gap, but the dose-response pattern across number of languages is consistent.", "url": "https://www.sciencedaily.com/releases/2026/08/260821012226.htm", "src": "ScienceDaily / mind_brain", "assess": {"mag": 4, "timeline": "now", "evidence": "strong", "verdict": "Multilingualism tracks a younger brain age", "basis": "Large multi-country cohort; dose-response by number of languages spoken"}, "published": "2026-08-22T19:01:17+05:30", "imp": "important", "glance": "Speaking several languages tracks with a brain that looks years younger"}]}, {"h": "🌌 Consciousness Studies", "items": [{"t": "Nothing new today in this area", "s": "A full scan of the Nature, Cell, ScienceDaily, bioRxiv and APS feeds plus a targeted web sweep turned up no Major or Historic peer-reviewed result in this group inside the window.", "url": "", "published": "", "src": "", "assess": {"mag": 4, "timeline": "unclear", "evidence": "early", "verdict": "No qualifying result today", "basis": "Full mind feed set scanned; nothing met the Major/Historic bar"}}]}]}, "mindUpdated": "2026-08-24T07:50:46+05:30", "mindset": {"updated": "2026-08-24T07:50:46+05:30", "messages": [{"who": "Joseph Rodrigues", "t": "Act like you are already there (The Science of Getting Rich)", "vid": "rIwy6GyZU1E", "url": "https://www.youtube.com/watch?v=rIwy6GyZU1E", "gist": "Working from Wallace Wattles' line to 'think and speak of all the things you have asked for in terms of actual present ownership', Rodrigues separates acting-as-if from pretending. Pretending is a conscious performance you have to keep up; what he is describing is placing a single instruction in the subconscious — the decision that you already are what you want to be — and then letting identity, values and skills reorganise around it. His point is that acting like you are already there is the *result* of that decision, not the technique for producing it. The practical takeaway: stop rehearsing the wanting, which reinforces the absence, and settle the question once."}, {"who": "Elmer O. Locker Jr", "t": "Grateful for Freedom — Prison Past to Present Life", "vid": "yXdIxA-iFJM", "url": "https://www.youtube.com/watch?v=yXdIxA-iFJM", "gist": "Locker uses his own prison sentence as a gratitude anchor: when the feeling will not come on its own, go back to the worst stretch you actually lived through and compare it to where you are standing now. The point is not to dwell on the past but to use it as a reference point — freedom stops being invisible once you remember what its absence felt like. Any hard chapter you have already survived can serve the same function."}, {"who": "Abraham Hicks", "t": "Answer This Honestly And You Will Know What Is Coming!", "vid": "E_E5G7dZlvY", "url": "https://www.youtube.com/watch?v=E_E5G7dZlvY", "gist": "The question posed is not whether you want something but whether you believe your own desire. Life keeps generating new desire — that part is automatic and cannot be slowed. What varies is how much of it you actually believe is available to you, and beliefs are just habits of thought, most of them inherited by watching what the people around you were living. The trap is that observing 'what is' and then believing it makes it recur, so most people end up believing in not-enough because that is what they witnessed. The move is to think past what is: attention is what causes more of a thing to arrive, so choosing where it goes — rather than sorting manifestations into good and bad piles — is the whole of deliberate creation."}]}, "mindsetUpdated": "2026-08-24T07:50:46+05:30", "youtube": {"count": 3, "note": "Today's uploads from the full 274-channel subscription sweep. YouTube's bot check blocked caption downloads for all but three of today's videos, so this is the subset with a real transcript-based takeaway; the rest were dropped rather than shown without one.", "groups": [{"h": "🤖 AI, Tech & Business", "items": [{"t": "Ilya Sutskever's new \"Superintelligence\" model will change EVERYTHING", "s": "Wes Roth argues a cluster of very large models — Gemini 4, OpenAI's Astra, and possibly SSI's first release — all land between now and year-end, and pairs that with a five-agency US advisory saying attackers are already using AI-generated Python to hit energy and water systems.", "glance": "Several frontier models are due before year-end, and US agencies now call AI-written exploits an active threat to utilities rather than a theoretical one.", "vid": "VbNdual0DFo", "url": "https://www.youtube.com/watch?v=VbNdual0DFo", "published": "2026-08-23T16:20:00+05:30", "src": "@WesRoth", "subject": "AI", "pointsLabel": "The four threads he covers", "points": [{"t": "Ox Alpha is the current mystery", "s": "A stealth model nobody has claimed; he thinks it is not a Western lab, and notes Gavin Baker's claim that Ilya Sutskever's SSI planned an August release."}, {"t": "The release calendar is crowded", "s": "Gemini 4 has finished pre-training, OpenAI's Astra is expected around October or November, and several more land before year-end."}, {"t": "AI-written exploits are now official", "s": "CISA, FBI, NSA, DOE and EPA issued a joint advisory saying attackers use AI-generated Python exploitation scripts, dramatically lowering the skill needed."}, {"t": "DeepMind is losing people", "s": "Demis Hassabis moved to Alphabet chief scientist and DeepMind chair, alongside departures to OpenAI and Anthropic — a bet on world models rather than scaling coding models."}]}, {"t": "How to Write Ads That Sell", "s": "A close reading of Claude Hopkins' Scientific Advertising and My Life in Advertising, built around Hopkins' core method: find the ordinary fact your competitors think is too boring to mention, and be the first to say it out loud.", "glance": "The winning ad usually comes from one overlooked fact buried in research, not from cleverness — Schlitz went from fifth to first by describing the purity process every brewer already used.", "vid": "9YrcSWczGdg", "url": "https://www.youtube.com/watch?v=9YrcSWczGdg", "published": "2026-08-23T19:45:00+05:30", "src": "@founderspodcast1", "subject": "Business", "pointsLabel": "Takeaways from the episode", "points": [{"t": "Claim the common fact first", "s": "Hopkins told the Schlitz story of steam-cleaned plate-glass rooms — standard across all brewers — and the first company to say it owned 'purity' outright."}, {"t": "The maker is too close to the product", "s": "What looks ordinary from inside a factory often astonishes the customer. Hopkins' rule: tell the pains you take to excel."}, {"t": "Take the risk off the customer", "s": "\"Ask a person to take a chance on you and you have a fight. Offer to take a chance on him and the way is easy.\""}, {"t": "The one line comes from the boring documents", "s": "Ogilvy's Rolls-Royce headline about the electric clock came out of an obscure engineering document. Hopkins: genius is the art of taking pains."}, {"t": "The book was locked in a safe", "s": "Albert Lasker made Hopkins hold Scientific Advertising for 20 years because it gave away the agency's method. It has since sold millions of copies."}]}]}, {"h": "🔬 Science & Physics", "items": [{"t": "The God Particle", "s": "A history of the Higgs field and the 2012 discovery, explaining why particles have mass at all, how the five-sigma threshold works, and why vacuum decay is not something a collider can trigger.", "glance": "The Higgs field is the one quantum field with a non-zero value everywhere, and how strongly a particle couples to it is exactly what sets that particle's mass.", "vid": "7oR0Pmd-WIk", "url": "https://www.youtube.com/watch?v=7oR0Pmd-WIk", "published": "2026-08-23T23:20:00+05:30", "src": "@SEA", "subject": "Physics", "pointsLabel": "What it explains", "points": [{"t": "Mass is a coupling, not a substance", "s": "Quarks couple strongly to the Higgs field and get more mass; photons do not couple at all and stay massless, which is why they cannot slow down."}, {"t": "Five sigma is the discovery bar", "s": "Three sigma is roughly a 1-in-740 fluke; five sigma is about 1 in 3.5 million. ATLAS and CMS independently hit five sigma at 125-126 GeV."}, {"t": "Vacuum decay is not a collider risk", "s": "Cosmic rays have produced far more Higgs bosons over the universe's life than the LHC ever will. If it were easy to trigger, it would already have happened."}]}]}]}, "elon": {"day": "2026-08-23", "source": "@jcub2x daily recap", "note": "YouTube's bot check blocked every caption request for today's recap (\"Elon Musk posted 31 times on X today, 08/23/26\"), so the per-post breakdown could not be transcribed this run. The recap's own chapt   let s=Math.floor((Date.now()-d.getTime())/1000); if(s<0)s=0;

  if(s<3600){const n=Math.floor(s/60);return n+" min"+(n>1?"s":"")+" ago";}
  if(s<86400){const n=Math.floor(s/3600);return n+" hour"+(n>1?"s":"")+" ago";}
  const days=Math.floor(s/86400);
  if(days===1) return "yesterday";
  if(days<7) return days+" days ago";

/* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();

async function askQuestion(c,input){

    const ctx=(c.dataset.title||(it&&it.t)||"");

  const T=c.dataset.title||(it&&it.t)||""; if(T) parts.push("HEADLINE: "+T);
  const S=c.dataset.summary||(it&&it.s)||""; if(S) parts.push("SUMMARY: "+S);
  if(it){
    if(it.why) parts.push("WHY IT MATTERS: "+it.why);
    if(it.eli) parts.push("IN PLAIN TERMS: "+it.eli);
    if(it.assess){const a=it.assess;parts.push("RATING: magnitude "+a.mag+"/5, timeline "+a.timeline+", evidence "+a.evidence+(a.verdict?"; verdict “"+a.verdict+"”":"")+(a.basis?" (basis: "+a.basis+")":""));}
    if(Array.isArray(it.facts)&&it.facts.length) parts.push("KEY FACTS: "+it.facts.map(f=>f.l+": "+f.v).join("; "));
    if(it.src) parts.push("SOURCE: "+it.src);

${parts.join("\n")}${priorTxt}

Answer the reader's question directly in 2-4 sentences, leading with the answer. Draw on BOTH the item context above AND your own broader knowledge — specific names, numbers, dates and background — to give a genuinely useful reply. Do NOT say the summary/context \"doesn't mention\" or \"doesn't say\" something: if a detail isn't in the context, answer it from what you already know instead. Only if you genuinely cannot answer at all should you say so briefly and point to the source link. Neutral and factual; no preamble, no bullet lists.`;
  try{ let text;
    if(window.cowork&&window.cowork.askClaude){ const res=await window.cowork.askClaude(prompt,it?[it]:[]);
      text=typeof res==="string"?res:(res&&(res.text||res.content||res.output))||JSON.stringify(res);
    } else { const rr=await fetch(__ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, url:(it&&it.url)||"", title:(c.dataset.title||(it&&it.t)||"")})});

      if(!rr.ok) throw new Error((jj&&jj.error)||("HTTP "+rr.status));
      text=jj.text||jj.answer||(jj.content&&jj.content[0]&&jj.content[0].text)||JSON.stringify(jj); }
    p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>${fmt(String(text).trim())}`;
  }catch(e){ p.classList.remove("loading"); p.innerHTML=`<span class="q">${esc(q)}</span>Couldn't answer right now — ${esc(String((e&&e.message)||e))}. Try the source link.`; }
}

    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");
    el.classList.add("kbd-cur");
    if(el.scrollIntoView) try{ el.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ el.scrollIntoView(); }
    setTimeout(()=>el.classList.remove("kbd-cur"),2200); },80);
}
// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }
  return 0;
}
function refreshBadges(){
  TABS.forEach(t=>{ const n=tabUnread(t.id); const txt=n?(n>9?"9+":String(n)):"";
    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
    if(moreMenu) [...moreMenu.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt); });
  if(moreBtn){ const m=overflow.reduce((s,t)=>s+tabUnread(t.id),0); const u=moreBtn.querySelector(".ub"); if(u) u.textContent=m?(m>9?"9+":String(m)):""; }
}
// ---- filter ----
const filterBar=document.getElementById("filterBar"),filterIn=document.getElementById("filterIn"),filterN=document.getElementById("filterN");
document.getElementById("filterBtn").onclick=()=>{ const open=!filterBar.classList.contains("open"); filterBar.classList.toggle("open",open); if(open) filterIn.focus(); else { filterIn.value=""; applyFilter(); } };
let filterT=null;
filterIn.addEventListener("input",()=>{ if(filterT)clearTimeout(filterT); filterT=setTimeout(applyFilter,120); });
function activePanel(){ return document.querySelector(".panel.active"); }
function applyFilter(){
  const p=activePanel(); if(!p) return;
  const q=(filterIn.value||"").trim().toLowerCase();
  p.classList.toggle("filtering",!!q);
  const stories=[...p.querySelectorAll(".srow")];
  if(!q){ stories.forEach(s=>s.hidden=false); p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen!==undefined){ d.open=d.dataset.wasOpen==="1"; delete d.dataset.wasOpen; } }); filterN.textContent=""; return; }
  p.querySelectorAll("details").forEach(d=>{ if(d.dataset.wasOpen===undefined) d.dataset.wasOpen=d.open?"1":"0"; d.open=true; });
  let hits=0; stories.forEach(s=>{ const hit=(s.textContent||"").toLowerCase().includes(q); s.hidden=!hit; if(hit)hits++; });
  filterN.textContent=hits+" match"+(hits===1?"":"es");
  kbdIdx=-1; clearKbdCur();
}
// ---- keyboard ----
let kbdIdx=-1;
function visibleStories(){ const p=activePanel(); if(!p) return []; return [...p.querySelectorAll(".srow")].filter(s=>!s.hidden&&s.offsetParent!==null); }
function clearKbdCur(){ document.querySelectorAll(".srow.kbd-cur").forEach(s=>s.classList.remove("kbd-cur")); }
function kbdMove(dir){ const list=visibleStories(); if(!list.length) return;
  kbdIdx=Math.max(0,Math.min(list.length-1,(kbdIdx<0?(dir>0?0:list.length-1):kbdIdx+dir)));
  clearKbdCur(); const s=list[kbdIdx]; s.classList.add("kbd-cur");
  let d=s.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
  if(s.scrollIntoView) try{ s.scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){ s.scrollIntoView(); } }
function kbdCur(){ const l=visibleStories(); return (kbdIdx>=0&&kbdIdx<l.length)?l[kbdIdx]:null; }
const kbdHelp=document.getElementById("kbdHelp");
document.getElementById("kbdX").onclick=()=>kbdHelp.classList.remove("open");
kbdHelp.addEventListener("click",e=>{ if(e.target===kbdHelp) kbdHelp.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  const tgt=e.target;
  const typing=tgt&&(tgt.tagName==="INPUT"||tgt.tagName==="TEXTAREA"||tgt.tagName==="SELECT"||tgt.isContentEditable);
  if(e.key==="Escape"){
    if(kbdHelp.classList.contains("open")){ kbdHelp.classList.remove("open"); return; }
    if(gradeOvl.classList.contains("open")){ closeGrade(); return; }
    if(typing&&tgt===filterIn){ if(filterIn.value){ filterIn.value=""; applyFilter(); } else { filterBar.classList.remove("open"); filterIn.blur(); } return; }
    if(typing){ tgt.blur(); return; }
    clearKbdCur(); kbdIdx=-1; return; }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="?"){ kbdHelp.classList.toggle("open"); e.preventDefault(); return; }
  if(e.key==="/"){ filterBar.classList.add("open"); filterIn.focus(); e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="9"){ const t=TABS[+e.key-1]; if(t) activate(t.id); return; }
  if(e.key==="j"){ kbdMove(1); return; }
  if(e.key==="k"){ kbdMove(-1); return; }
  if(e.key==="t"){ if(window.cycleTheme) cycleTheme(); return; }
  const cur=kbdCur(); if(!cur) return;
  if(e.key==="Enter"||e.key==="o"){ const a=cur.querySelector('a[href][target="_blank"]'); if(a) a.click(); return; }
  if(e.key==="r"){ const it=STORY.get(cur); if(it){ const now=!cur.classList.contains("read"); cur.classList.toggle("read",now); setRead(it,now); showToast(now?"Marked read":"Marked unread");
      const cat=cur.closest("details.cat"); if(cat){ const rows=[...cat.querySelectorAll(".crow")]; const u=rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i)&&!isReadItem(i);}).length; const chp=cat.querySelector(".cn"); if(chp){ chp.className="cn"+(u>0?" unread":""); chp.textContent=u>0?u+" new":String(rows.filter(x=>{const i=STORY.get(x);return i&&isRealItem(i);}).length); } } } return; }
});
// ---- manifest ----
(function(){ try{
  var icon=document.querySelector('link[rel="apple-touch-icon"]').getAttribute("href");
  var m={name:"Daily Dashboard",short_name:"Dashboard",display:"standalone",orientation:"portrait",background_color:"#eef1f8",theme_color:"#eef1f8",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  var blob=new Blob([JSON.stringify(m)],{type:"application/manifest+json"});
  var link=document.createElement("link"); link.rel="manifest"; link.href=URL.createObjectURL(blob); document.head.appendChild(link);
}catch(e){} })();
// ---- premium motion: masthead dissolve + reveal-on-scroll ----
(function(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mast=document.getElementById("mastFull"); let lastY=window.scrollY||0, ticking=false;
  function onScroll(){ const y=window.scrollY||0;
    const _doc=document.documentElement; const nearBottom=(window.innerHeight+y)>=(_doc.scrollHeight-160);
    if(mast && !nearBottom){ if(y>70 && y>=lastY) mast.classList.add("mast-hide");
      else if(y<lastY-3 || y<48) mast.classList.remove("mast-hide"); }
    lastY=y; ticking=false; }
  window.addEventListener("scroll",()=>{ if(!ticking){ requestAnimationFrame(onScroll); ticking=true; } },{passive:true});
})();
window.__revealIO = (window.IntersectionObserver)? new IntersectionObserver((es,o)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); o.unobserve(e.target); } });
},{threshold:.1,rootMargin:"0px 0px -36px 0px"}) : null;
function armReveals(panel){ /* reveal-on-scroll disabled 2026-07-11 — cards render immediately, no fade-in lag */ }
// ---- FAB options menu ----
(function(){ const fb=document.getElementById("fabMenu"), sh=document.getElementById("fabSheet"); if(!fb||!sh) return;
  fb.addEventListener("click",e=>{ e.stopPropagation(); sh.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(sh.classList.contains("open")&&!fb.contains(e.target)&&!sh.contains(e.target)) sh.classList.remove("open"); });
  sh.querySelectorAll(".fab-item").forEach(b=>b.addEventListener("click",()=>{ if(b.id!=="filterBtn") sh.classList.remove("open"); }));
})();
// ---- boot ----
refreshBadges();
const savedTab=store.get("tab","news");
activate(TABS.some(t=>t.id===savedTab)?savedTab:"news");
setTimeout(()=>{try{syncCardChrome(document);}catch(e){}},350);
// ---- delegated expand handler (2026-08-15). Owns card taps for every tab:
// .crow (News) toggles its built-in .open; .story/.trend/.hero expand inline via toggleInline.
document.addEventListener("click",function(e){
  if(e.target.closest("a,button,input,textarea,select,summary,.ask-box,.acts,.pts,.fitbar,nav,.fab-sheet,.more-menu")) return;
  const row=e.target.closest(".crow");
  if(row){ e.preventDefault(); e.stopPropagation();
    const wasOpen=row.classList.contains("open");
    document.querySelectorAll(".crow.open").forEach(r=>r.classList.remove("open"));
    if(!wasOpen){ row.classList.add("open"); try{ const it=(typeof STORY!=="undefined")?STORY.get(row):null; if(it&&typeof setRead==="function") setRead(it,true);}catch(x){} }
    return; }
  const card=e.target.closest(".story,.trend,.hero");
  if(!card||!card.closest(".panel")) return;
  let it=null; try{ it=(typeof STORY!=="undefined")?STORY.get(card):null; }catch(x){}
  if(!it) return;
  e.preventDefault(); e.stopPropagation();
  if(typeof toggleInline==="function") toggleInline(card,it);
},false);

// ---- layout mode (2026-08-15): compact List rows or a Tile grid, on every tab ----
(function(){ const root=document.documentElement;
  function cur(){ const v=store.get("view",null); return (v==="tile"||v==="list")?v:"list"; }
  window.applyView=function(){ const v=cur(); root.setAttribute("data-view",v);
    document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>b.classList.toggle("on",b.dataset.vw===v)); };
  document.querySelectorAll("#viewGrid .theme-opt").forEach(b=>{ b.onclick=()=>{ store.set("view",b.dataset.vw); applyView(); }; });
  applyView();
})();

</script>
