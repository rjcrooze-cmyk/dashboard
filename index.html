<!doctype html><!--
  TEMPLATE for Rohit's Daily Dashboard  ·  "STUDIO" edition (NuPhy Kick75 product-page look
  + Glass light/dark). Three themes total — the pixel-keycap "Kick75" theme was removed 2026-07-11.
  The Cowork daily task ONLY replaces the three marked regions each morning:
    /*DATA_START*/ ... /*DATA_END*/       (the JSON data)
    /*THUMBS_START*/ ... /*THUMBS_END*/   (inline video thumbnails)
    /*SOM_START*/ ... /*SOM_END*/         (Star of Mysore page images)
  Everything else (tabs, CSS, render functions, freshness guard) is the template - edit freely,
  but KEEP those six markers intact. Current tab row: News · Breakthroughs · YouTube · Elon · Mind · SOM. Do NOT re-add Audio/Tools/Science/Science-Daily/AI-Trends/Watch/Following tabs.
  The placeholders here are just sample data so the page renders in a browser while you edit.

  STUDIO EDITION notes (data contract and localStorage keys are unchanged):
  - THREE explicit theme buttons in the ⋯ menu (✨ Studio / ☀ Glass / 🌙 Dark) — no cycling toggle.
    Stored in dash_theme; DEFAULT is "studio" (any old stored "retro" value falls back to studio).
    The "t" key still cycles all three.
  - STUDIO theme = the NuPhy Kick75 product-page look: real sampled colours (#ededed grey,
    #e7c353 mustard, #cf3327 red, #68b3f8 sky, RGB gradient #5796d0→#af5092→#d54c8e→#de7954)
    and two real keyboard-free WebP crops (cloud band drifting on the masthead top, RGB waveform
    washing the hero); white cards + product shadows + black Archivo headlines + black CTA pills;
    glossy floating objects (#blob1-3 restyled); animated RGB accents (active-tab underglow, hero
    rail + sheen, bottom-edge glow via #skyGround). Retro is kept to two popping accents only:
    the cloud band and the pixel "all caught up" sign-off (Press Start 2P stays loaded for it).
  - The masthead TITLE was removed on purpose (no "Daily Dashboard" heading) — do not re-add it.
    The masthead is: Mysuru chip + date pill, grade pills, and the signal ring.
  - Renders the optional per-item fields when present: assess{mag,timeline,evidence,verdict,basis},
    kind, facts[], stage, stageDay, forYou (news), subject (youtube). Older data renders fine without them.
  - Save button and Mark-read buttons are intentionally ABSENT (per Rohit). Opening a story still
    silently marks it read (dash_read) and powers unread badges. "In brief" box exists on News ONLY.
  - If you redesign again, update the daily task's STRUCTURE LOCK section in the SAME edit.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Dashboard</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#eef1f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%232563eb'/%3E%3Cstop%20offset='1'%20stop-color='%235b46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='512'%20height='512'%20rx='110'%20fill='%23080b13'/%3E%3Ccircle%20cx='256'%20cy='230'%20r='120'%20fill='none'%20stroke='url(%23g)'%20stroke-width='34'/%3E%3Crect%20x='140'%20y='388'%20width='232'%20height='30'%20rx='15'%20fill='url(%23g)'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html{font-size:16px}
html,body{margin:0}
body{font:400 .95rem/1.55 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Hind Mysuru",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;position:relative;overflow-x:clip}
:root{color-scheme:light;--shadowc:rgba(30,40,90,.14);
  --bg:#eef1f8;--ink:#12151f;--ink2:#3c4155;--mut:#868da2;
  --glassA:rgba(255,255,255,.66);--glassB:rgba(255,255,255,.45);
  --topline:rgba(255,255,255,.85);--edge:rgba(255,255,255,.55);--edge2:rgba(30,40,90,.06);
  --grid:rgba(60,90,200,.10);
  --shadow:0 14px 34px rgba(30,40,90,.12),0 2px 8px rgba(30,40,90,.06);
  --crit:#ef4444;--impt:#f59e0b;--gold:#f2b705;--good:#22c55e}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#080b13;--ink:#eef0f8;--ink2:#c2c7d8;--mut:#7d8399;
  --glassA:rgba(24,29,46,.62);--glassB:rgba(24,29,46,.44);
  --topline:rgba(255,255,255,.2);--edge:rgba(255,255,255,.13);--edge2:rgba(255,255,255,.05);
  --grid:rgba(120,150,255,.10);
  --shadow:0 16px 40px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.32)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="studio"]){color-scheme:dark;
  --bg:#080b13;--ink:#eef0f8;--ink2:#c2c7d8;--mut:#7d8399;
  --glassA:rgba(24,29,46,.62);--glassB:rgba(24,29,46,.44);
  --topline:rgba(255,255,255,.2);--edge:rgba(255,255,255,.13);--edge2:rgba(255,255,255,.05);
  --grid:rgba(120,150,255,.10);
  --shadow:0 16px 40px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.32)}}
/* ===== per-tab themes (accent, hero gradient, glow trio) ===== */
body[data-tt="news"]{--ac:#2563eb;--ac2:#7c8cff;--hA:#2563eb;--hB:#5b46e5;--g1:rgba(37,99,235,.55);--g2:rgba(124,58,237,.38);--g3:rgba(56,189,248,.36)}
body[data-tt="aitrends"]{--ac:#06b6d4;--ac2:#a78bfa;--hA:#0891b2;--hB:#7c3aed;--g1:rgba(6,182,212,.55);--g2:rgba(139,92,246,.42);--g3:rgba(236,72,153,.3)}
body[data-tt="science"]{--ac:#0d9488;--ac2:#34d399;--hA:#0d9488;--hB:#059669;--g1:rgba(13,148,136,.55);--g2:rgba(52,211,153,.38);--g3:rgba(34,211,238,.32)}
body[data-tt="scidaily"]{--ac:#7c3aed;--ac2:#c084fc;--hA:#7c3aed;--hB:#c026d3;--g1:rgba(124,58,237,.55);--g2:rgba(192,38,211,.38);--g3:rgba(99,102,241,.32)}
body[data-tt="youtube"]{--ac:#e11d48;--ac2:#fb7185;--hA:#e11d48;--hB:#d946ef;--g1:rgba(225,29,72,.5);--g2:rgba(217,70,239,.36);--g3:rgba(251,146,60,.28)}
body[data-tt="elon"]{--ac:#9aa7c7;--ac2:#e2e8f0;--hA:#1e293b;--hB:#475569;--g1:rgba(148,163,184,.38);--g2:rgba(100,116,139,.32);--g3:rgba(226,232,240,.16)}
body[data-tt="mind"]{--ac:#c026d3;--ac2:#e879f9;--hA:#c026d3;--hB:#7c3aed;--g1:rgba(192,38,211,.5);--g2:rgba(124,58,237,.38);--g3:rgba(244,114,182,.32)}
body[data-tt="loa"]{--ac:#f59e0b;--ac2:#fbbf24;--hA:#f59e0b;--hB:#ea580c;--g1:rgba(245,158,11,.5);--g2:rgba(234,88,12,.36);--g3:rgba(251,113,133,.26)}
body[data-tt="som"]{--ac:#b45309;--ac2:#d6a354;--hA:#92400e;--hB:#b45309;--g1:rgba(180,83,9,.46);--g2:rgba(214,163,84,.36);--g3:rgba(120,53,15,.3)}
/* ===== aurora + grid ===== */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.4px);background-size:26px 26px;
  -webkit-mask:linear-gradient(#000 45%,transparent 90%);mask:linear-gradient(#000 45%,transparent 90%)}
.blob{position:fixed;border-radius:50%;filter:blur(78px);pointer-events:none;z-index:0;animation:drift 14s ease-in-out infinite;transition:background .5s ease}
@keyframes drift{50%{transform:translate(16px,12px) scale(1.06)}}
#blob1{width:420px;height:420px;top:-150px;right:-100px;background:radial-gradient(circle,var(--g1),transparent 70%)}
#blob2{width:340px;height:320px;top:70px;left:-140px;background:radial-gradient(circle,var(--g2),transparent 70%);animation-delay:-4s}
#blob3{width:280px;height:280px;top:460px;right:-80px;background:radial-gradient(circle,var(--g3),transparent 72%);animation-delay:-8s}
#skyGround{display:none}
/* ===== layout ===== */
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px 18px 64px}
a{color:inherit}
:where(a,button,input,summary):focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
button{font-family:inherit}
::selection{background:var(--ac);color:#fff}
/* ===== glass panels ===== */
.glass,.gcard{position:relative;border:1px solid transparent;border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 var(--topline)}
.glass{background:linear-gradient(var(--glassA),var(--glassA)) padding-box,linear-gradient(165deg,var(--edge) 0%,var(--edge2) 45%,color-mix(in srgb,var(--ac) 35%,transparent) 100%) border-box;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
.gcard{background:linear-gradient(var(--glassB),var(--glassB)) padding-box,linear-gradient(165deg,var(--edge) 0%,var(--edge2) 50%,color-mix(in srgb,var(--ac) 26%,transparent) 100%) border-box}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.glass{background:var(--glassA)}}
/* ===== pills ===== */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.02em;
  background:color-mix(in srgb,var(--pc,#868da2) 15%,transparent);color:var(--pc,#868da2);
  border:1px solid color-mix(in srgb,var(--pc,#868da2) 34%,transparent);
  box-shadow:0 0 16px color-mix(in srgb,var(--pc,#868da2) 24%,transparent),inset 0 1px 0 rgba(255,255,255,.16);white-space:nowrap}
button.pill{cursor:pointer;font-size:.68rem;font-weight:800}
button.pill:active{transform:scale(.96)}
@keyframes pulse{50%{box-shadow:0 0 28px color-mix(in srgb,var(--pc) 58%,transparent)}}
.pill.live{animation:pulse 1.7s ease-in-out infinite}
/* ===== slim per-tab header + FAB options ===== */
.slim-head{display:none;padding:6px 6px 2px;margin-bottom:10px}
body:not([data-tt="news"]) #mastFull{display:none}
body:not([data-tt="news"]) .slim-head{display:block}
.slim-title{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
#slimName{font-size:1.85rem;font-weight:850;letter-spacing:-.03em;background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.slim-count{font-size:.82rem;font-weight:800;letter-spacing:.02em;color:var(--mut)}
.fab-menu{position:fixed;top:14px;right:14px;z-index:55;width:40px;height:40px;border:none;border-radius:14px;cursor:pointer;font-size:1.3rem;line-height:1;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));box-shadow:0 5px 16px color-mix(in srgb,var(--ac) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.fab-menu:active{transform:scale(.94)}
.fab-sheet{position:fixed;top:60px;right:14px;z-index:56;display:none;flex-direction:column;gap:3px;padding:8px;min-width:200px;border-radius:20px}
.fab-sheet.open{display:flex}
.fab-item{display:flex;align-items:center;gap:8px;border:none;background:none;color:var(--ink);font:700 .82rem/1 inherit;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left}
.fab-item:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.fab-row{display:flex;align-items:center;gap:7px;padding:8px 12px;border-top:1px solid var(--edge2);margin-top:3px}
.fab-lbl{flex:1;font-size:.72rem;font-weight:700;color:var(--mut)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:2px 4px 6px}
.theme-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:12px;cursor:pointer;border:1px solid var(--edge2);background:color-mix(in srgb,var(--mut) 8%,transparent);color:var(--ink2);font:800 .58rem/1 inherit;letter-spacing:.03em;transition:transform .08s ease,box-shadow .08s ease}
.theme-opt .em{font-size:1.05rem;line-height:1}
.theme-opt:active{transform:translateY(1px)}
.theme-opt.on{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
/* ===== masthead ===== */
.mast{padding:16px 18px;margin-bottom:12px;display:flex;gap:15px;align-items:center;flex-wrap:wrap;position:sticky;top:8px;z-index:20;transform-origin:top center;transition:opacity .32s ease,transform .32s ease,filter .32s ease,margin .32s ease}
.mast.mast-hide{opacity:0;transform:translateY(-22px) scale(.965);filter:blur(6px);pointer-events:none;margin-bottom:-88px}
.ring{position:relative;flex:0 0 92px;width:92px;height:92px;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ac) 42%,transparent))}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rn{font-size:1.65rem;font-weight:850;letter-spacing:-.04em;line-height:1;background:linear-gradient(120deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ring .rl{font-size:.54rem;font-weight:800;letter-spacing:.14em;color:var(--mut)}
.m-right{flex:1;min-width:210px}
.m-date{font-size:.68rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 9px}
.m-sub{display:flex;gap:6px;flex-wrap:wrap}
.m-tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.tool{border:1px solid var(--edge2);background:color-mix(in srgb,var(--mut) 8%,transparent);color:var(--mut);border-radius:12px;padding:5px 9px;cursor:pointer;font-size:.74rem;font-weight:700;line-height:1}
.tool:hover{color:var(--ink)}
.update-all{border:none;border-radius:12px;padding:6px 13px;cursor:pointer;font-size:.74rem;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.update-all:disabled{opacity:.55;cursor:default}
.update-status{color:var(--mut);font-size:.74rem;margin:2px 4px 8px}
.update-status:empty{display:none}
/* ===== tabs ===== */
nav.tabs{position:sticky;top:10px;z-index:30;display:flex;gap:4px;padding:5px;margin:0 0 14px;border-radius:999px}
.tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:none;background:none;padding:8px 4px;border-radius:999px;font-size:.64rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);cursor:pointer;position:relative;white-space:nowrap}
.tab .ico{display:none;font-size:1.05rem;line-height:1}
.tab.active{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 5px 18px color-mix(in srgb,var(--ac) 48%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.tab .ub{position:absolute;top:-2px;right:2px;background:var(--crit);color:#fff;font-size:.56rem;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab .ub:empty{display:none}
.more-menu{position:fixed;z-index:1000;padding:8px;display:none;flex-direction:column;gap:3px;min-width:180px;border-radius:20px}
.more-menu.open{display:flex}
.more-menu .tab{flex-direction:row;justify-content:flex-start;gap:9px;padding:11px 13px;font-size:.72rem;letter-spacing:.06em}
.more-menu .tab .ico{display:inline}
/* ===== sections / heroes / cards ===== */
.sec{font-size:.64rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:18px 6px 10px;display:flex;align-items:center;gap:8px}
/* ===== animated panel headings, section breakers & stickers (added 2026-07-11) ===== */
.phead{display:flex;align-items:center;gap:12px;margin:4px 4px 14px;flex-wrap:wrap}
.ph-badge{font-size:2rem;line-height:1;display:inline-block;transform-origin:50% 80%;animation:ph-pop .55s cubic-bezier(.34,1.56,.64,1) both,bob 3.2s ease-in-out 1s infinite}
.ph-ttl{font-size:1.95rem;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1;background:linear-gradient(100deg,var(--ac),var(--ac2,#8b5cf6));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ph-badge,.sp,.brk-emo,.sec-emo{will-change:transform}
.sp{display:inline-block;font-size:1.35rem;line-height:1}
.sp.spin{animation:spin 4.5s linear infinite}
.sp.float{animation:floaty 3s ease-in-out infinite}
.brk{display:flex;align-items:center;gap:14px;margin:24px 6px 4px}
.brk-line{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 45%,transparent),transparent)}
.brk-emo{font-size:1.75rem;line-height:1;display:inline-block;filter:drop-shadow(0 4px 7px rgba(0,0,0,.22))}
.brk-emo.bob{animation:bob 2.4s ease-in-out infinite}
.brk-emo.beat{animation:beat 1.6s ease-in-out infinite}
.brk-emo.spin{animation:spin 6s linear infinite}
.sec-emo{font-size:1.05rem;display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes ph-pop{0%{opacity:0;transform:scale(.4) rotate(-16deg)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1)}42%{transform:scale(1.14)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(9deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ph-badge,.sp,.brk-emo,.sec-emo{animation:none}}
.panel{display:none;animation:fade .22s ease}
.panel.active{display:block}
.reveal,.reveal.in{opacity:1!important;transform:none!important;transition:none!important}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.empty{color:var(--mut);font-size:.84rem;font-style:italic;margin:6px}
.hero{border-radius:24px;padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--hA) 20%,var(--glassA)),color-mix(in srgb,var(--hB) 12%,var(--glassA))) padding-box,
    linear-gradient(165deg,var(--edge),color-mix(in srgb,var(--hA) 42%,transparent)) border-box;
  border:1px solid transparent;backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 16px 40px color-mix(in srgb,var(--hA) 20%,var(--shadowc,rgba(0,0,0,.28))),inset 0 1px 0 var(--topline)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;top:-110px;right:-64px;background:radial-gradient(circle,color-mix(in srgb,var(--hA) 26%,transparent),transparent 70%);pointer-events:none}
.hero .pill{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac2);border-color:color-mix(in srgb,var(--ac) 34%,transparent)}
.hero .st-t,.hero .st-t a{color:var(--ink)}
.hero .st-s{color:var(--ink)}
.hero .why{margin-top:9px;padding:8px 12px;border-radius:13px;font-size:.78rem;font-weight:600;color:var(--ink2);background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px solid color-mix(in srgb,var(--ac) 26%,transparent)}
.hero .meta{color:var(--mut)}
.hero .heat{background:color-mix(in srgb,var(--mut) 16%,transparent)}
.hero .heat i{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.hero .trank{opacity:1}
.story{padding:14px 16px;margin-bottom:11px;display:flex;gap:12px}
.tile{flex:0 0 42px;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.08rem;
  background:linear-gradient(135deg,color-mix(in srgb,var(--kc,var(--ac)) 30%,transparent),color-mix(in srgb,var(--kc,var(--ac)) 9%,transparent));
  border:1px solid color-mix(in srgb,var(--kc,var(--ac)) 40%,transparent);
  box-shadow:0 5px 16px color-mix(in srgb,var(--kc,var(--ac)) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.sbody{flex:1;min-width:0}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.st-t{font-size:.98rem;font-weight:800;letter-spacing:-.01em;margin:0 0 3px;line-height:1.4}
.st-t a{text-decoration:none}
.st-t a:hover{text-decoration:underline;text-decoration-color:var(--ac);text-underline-offset:3px}
.st-s{color:var(--ink);font-size:.85rem;margin:0}

/* ================= "STUDIO" THEME (4th) =================
   The NuPhy Kick75 product-page look, copied as closely as possible with REAL sampled colours
   and REAL (keyboard-free) picture crops from the Kick75 artwork, inlined as WebP:
   - #ededed studio grey (page bg), #e7c353 switch-card mustard, #cf3327 switch red, #68b3f8 sky
   - RGB gradient #5796d0 → #af5092 → #d54c8e → #de7954 sampled off the "1000Hz" numerals
   - real cloud-band crop drifting across the masthead top; real RGB-waveform crop washing the hero
   Clean modern: white cards, product-photo shadows, bold Archivo black headlines, glossy floating
   objects, animated RGB accents. Retro kept to two popping accents: the cloud band + the pixel
   "all caught up" sign-off. */
:root[data-theme="studio"]{color-scheme:light;
  --bg:#ededed;--ink:#141412;--ink2:#3f3f3c;--mut:#8a8a86;
  --glassA:#ffffff;--glassB:#ffffff;
  --topline:rgba(255,255,255,0);--edge:rgba(20,20,18,.05);--edge2:rgba(20,20,18,.08);
  --grid:transparent;
  --shadow:0 1px 2px rgba(20,20,18,.05),0 22px 44px -14px rgba(20,20,18,.16);
  --crit:#cf3327;--impt:#e7a53a;--gold:#e7c353;--good:#2f9e5b;
  --rgbA:#5796d0;--rgbB:#af5092;--rgbC:#d54c8e;--rgbD:#de7954}
:root[data-theme="studio"] body{background:radial-gradient(1200px 620px at 50% -12%,#f8f8f7,transparent 62%),radial-gradient(900px 520px at 88% 108%,#e3e3e1,transparent 56%),var(--bg)}
:root[data-theme="studio"] body::before{background-image:none;-webkit-mask:none;mask:none}
/* glossy floating studio objects (real product shading, soft float) */
:root[data-theme="studio"] .blob{filter:none;opacity:1;animation:sfloat 9s ease-in-out infinite}
:root[data-theme="studio"] #blob1{width:86px;height:86px;top:150px;right:5%;
  background:radial-gradient(circle at 32% 26%,#ffb9ab 0%,#df4a3a 40%,#a01a10 76%,#7c0f07 100%);
  box-shadow:inset 0 3px 6px rgba(255,255,255,.55),inset 0 -10px 16px rgba(90,8,4,.55),0 30px 28px -16px rgba(120,20,12,.4)}
:root[data-theme="studio"] #blob1::after{content:"";position:absolute;left:16%;top:12%;width:26px;height:15px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),transparent);transform:rotate(-24deg)}
:root[data-theme="studio"] #blob2{width:62px;height:62px;top:auto;bottom:130px;left:4%;border-radius:20px;animation-delay:-3.2s;
  background:linear-gradient(155deg,#f4d97a,#e7c353 45%,#c69d2c);

:root[data-theme="studio"] .slim-count{color:#8a8a86}
:root[data-theme="studio"] .sec{font-family:"Archivo",inherit;font-size:.76rem;font-weight:800;letter-spacing:.14em;color:#141412}
:root[data-theme="studio"] .sec::before{content:"";flex:0 0 16px;width:16px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--rgbA),var(--rgbC),var(--rgbD))}
:root[data-theme="studio"] .since .sh,:root[data-theme="studio"] .legend>summary{background:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:#141412;color:#141412;font-family:"Archivo",inherit;font-weight:900}
:root[data-theme="studio"] .q::before,:root[data-theme="studio"] .q .auth{background:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:#141412;color:#141412}

:root[data-theme="studio"] .hero{color:#141412;border:1px solid rgba(20,20,18,.06);

:root[data-theme="studio"] .hero .why{background:#f6f6f4;border:1px solid rgba(20,20,18,.07);color:#3f3f3c}
:root[data-theme="studio"] .hero .pill{background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 30%,transparent)}
/* heat meters: the 1000Hz waveform — thin RGB bars */
:root[data-theme="studio"] .heat{height:14px;border-radius:4px;background:#efefed;box-shadow:inset 0 1px 2px rgba(20,20,18,.08)}
:root[data-theme="studio"] .heat i{border-radius:4px;background:linear-gradient(90deg,var(--rgbA),var(--rgbB) 42%,var(--rgbC) 66%,var(--rgbD));box-shadow:none;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 4px,transparent 4px 7px);mask:repeating-linear-gradient(90deg,#000 0 4px,transparent 4px 7px)}
:root[data-theme="studio"] .heat i::after{display:none}
:root[data-theme="studio"] .hero .heat{background:#efefed}
:root[data-theme="studio"] .hero .heat i{background:linear-gradient(90deg,var(--rgbA),var(--rgbB) 42%,var(--rgbC) 66%,var(--rgbD))}
/* tiles, badges, extras */
:root[data-theme="studio"] .tile{background:color-mix(in srgb,var(--kc,var(--ac)) 13%,#fff);border:1px solid color-mix(in srgb,var(--kc,var(--ac)) 28%,transparent);box-shadow:0 10px 18px -10px color-mix(in srgb,var(--kc,var(--ac)) 55%,transparent)}
:root[data-theme="studio"] .sub{border:2px solid #fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--sc,#334155) 60%,transparent)}
:root[data-theme="studio"] .thumb{border:1px solid rgba(20,20,18,.08);box-shadow:0 12px 24px -12px rgba(20,20,18,.3)}
:root[data-theme="studio"] .fy{background:color-mix(in srgb,#e7c353 24%,#fff);border:1px solid rgba(150,110,20,.35);box-shadow:none;color:#3a2c00}
:root[data-theme="studio"] .verdict{box-shadow:none}
:root[data-theme="studio"] .cat>summary .cn.unread{background:#141412;color:#fff;border:none}
:root[data-theme="studio"] .allcaught{font-family:"Press Start 2P",ui-monospace,monospace;font-size:.52rem;opacity:1;
  background:linear-gradient(90deg,var(--rgbA),var(--rgbC),var(--rgbD));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:pxblink 1.6s steps(2,jump-none) infinite}
:root[data-theme="studio"] .allcaught::before{content:"▶ "}
:root[data-theme="studio"] .allcaught::after{content:" ◀"}
:root[data-theme="studio"] .toast{background:linear-gradient(#2b2b28,#141412);color:#fff;box-shadow:0 12px 28px -10px rgba(20,20,18,.6)}
:root[data-theme="studio"] ::selection{background:#141412;color:#fff}
/* ===== Follow button + Following tab (added 2026-07-11) ===== */
.act-follow.on{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.fol{padding:15px 17px;margin-bottom:12px}
.fol-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.fol-title{font-weight:850;font-size:1.05rem;color:var(--ink);line-height:1.3}
.fol-x{flex:0 0 auto;font-size:.58rem!important;letter-spacing:.04em;opacity:.8}
.fol-x:hover{opacity:1;color:#ef4444}
.fol-latest{margin-top:8px;font-size:.92rem;color:var(--ink2);font-weight:650;line-height:1.5}
.fol-latest::before{content:"● LATEST  ";font-size:.55rem;font-weight:850;letter-spacing:.12em;color:#22c55e;vertical-align:middle}
.fol-hist{margin-top:11px;border-top:1px solid var(--edge2);padding-top:9px}
.fol-hist>summary{cursor:pointer;list-style:none;font-size:.64rem;font-weight:850;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.fol-hist>summary::-webkit-details-marker{display:none}
.fol-hist>summary::after{content:" ▾";color:var(--mut)}
.fol-hist[open]>summary::after{content:" ▴"}
.fol-list{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.fol-row{display:flex;gap:11px;font-size:.82rem}
.fol-d{flex:0 0 60px;color:var(--mut);font-weight:800;font-size:.66rem;padding-top:2px;white-space:nowrap}
.fol-t{color:var(--ink2);line-height:1.45}
/* ===== Per-tab "Fit to screen" slider + condensed density ===== */
.fitbar{display:flex;align-items:center;gap:12px;margin:2px 2px 14px;padding:11px 16px;column-span:all;-webkit-column-span:all}
.fb-ic{font-size:1.15rem}
.fb-lbl{font-weight:850;font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
.fit-seg{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.fit-seg button{flex:1;min-width:62px;border:1px solid var(--edge2);background:color-mix(in srgb,var(--mut) 9%,transparent);color:var(--ink2);font:800 .62rem/1 inherit;letter-spacing:.03em;padding:8px 6px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:transform .08s ease}
.fit-seg button.on{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.fit-seg button:active{transform:scale(.95)}
/* column layout by fit level (mobile → desktop scales up) */
.panel[data-fit="2"]{column-count:1;column-gap:14px}
.panel[data-fit="3"]{column-count:2;column-gap:14px}
.panel[data-fit="4"]{column-count:2;column-gap:12px}
@media(min-width:760px){
  .panel[data-fit="2"]{column-count:2;column-gap:16px}
  .panel[data-fit="3"]{column-count:3;column-gap:16px}
  .panel[data-fit="4"]{column-count:4;column-gap:14px}
}
.panel.dense .story,.panel.dense .crow,.panel.dense .trend,.panel.dense .hero,.panel.dense .gcard,.panel.dense .cat{break-inside:avoid;-webkit-column-break-inside:avoid}
/* collapse expandable cards to just the title until tapped (.xopen reveals everything incl. Ask/Follow) */
.panel.dense .story:not(.xopen) .sbody>:not(.st-t),
.panel.dense .trend:not(.xopen) .sbody>:not(.st-t),
.panel.dense .hero:not(.xopen)>:not(.st-t){display:none!important}
.panel.dense .story .tile{display:none}
.panel.dense .story:not(.xopen),.panel.dense .trend:not(.xopen),.panel.dense .hero:not(.xopen){cursor:pointer}
/* an expanded card breaks out of the columns to full, readable width */
.panel.dense .story.xopen,.panel.dense .trend.xopen,.panel.dense .hero.xopen{column-span:all;-webkit-column-span:all;outline:1px solid color-mix(in srgb,var(--ac) 45%,transparent);max-width:860px;margin:4px 0 12px!important;padding:14px 16px!important}
.panel.dense .story.xopen .st-t,.panel.dense .trend.xopen .st-t{font-size:1.02rem!important;line-height:1.4}
.panel.dense .story.xopen .st-s,.panel.dense .story.xopen .cs,.panel.dense .trend.xopen .st-s{font-size:.92rem!important;line-height:1.6}
.panel.dense .story.xopen .tile{display:inline-flex}
/* hide the density word-label on phones so it never runs off-screen */
@media(max-width:560px){ .fitbar{gap:8px;padding:9px 11px} .fb-lbl{display:none} .fit-seg button{min-width:0;font-size:.57rem;padding:8px 3px;letter-spacing:.02em} }
.panel.dense .legend,.panel.dense .phead,.panel.dense .brk,.panel.dense .glance,.panel.dense .news-toolbar,.panel.dense .since{display:none!important}
.panel.dense .sec{margin:9px 4px 4px;column-span:all;-webkit-column-span:all}
.panel.dense .story,.panel.dense .gcard,.panel.dense .trend,.panel.dense .crow{padding:8px 11px!important;margin:0 0 8px!important}
.panel.dense .st-t{font-size:.84rem!important;line-height:1.34;font-weight:700}
.panel.dense .hero .st-t{font-size:.92rem!important}
.panel.dense .cat>summary{font-size:.82rem}
.panel.dense .trank{transform:scale(.82)}

/* ===== full-screen article READER (opens from densified/fit-to-screen cards so a story fills the screen instead of a narrow column) ===== */
.reader{position:fixed;inset:0;z-index:85;display:none;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.reader.open{display:block}
body.reader-lock{overflow:hidden}
.reader-inner{max-width:720px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 22px calc(56px + env(safe-area-inset-bottom))}
.reader-x{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:86;width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;font-size:1.1rem;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));box-shadow:0 5px 16px color-mix(in srgb,var(--ac) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.reader-x:active{transform:scale(.94)}
.reader-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.reader-chip{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:color-mix(in srgb,var(--pc,var(--ac)) 16%,transparent);color:var(--pc,var(--ac));border:1px solid color-mix(in srgb,var(--pc,var(--ac)) 34%,transparent)}
.reader-h1{font-size:1.6rem;line-height:1.28;font-weight:900;letter-spacing:-.01em;margin:2px 0 10px;color:var(--ink)}
.reader-meta{font-size:.76rem;font-weight:700;color:var(--mut);margin-bottom:16px}
.reader-glance{font-size:1.02rem;line-height:1.6;font-weight:700;color:var(--ink);margin:0 0 14px}
.reader-s{font-size:1.08rem;line-height:1.75;color:var(--ink);margin:0 0 18px}
.reader-why{font-size:.95rem;line-height:1.6;color:var(--ink);background:color-mix(in srgb,var(--ac) 9%,transparent);border-left:3px solid var(--ac);border-radius:10px;padding:11px 14px;margin:0 0 16px}

jor vendors; adoption just starting"}},{"t":"DeepMind WeatherNext 2 leaps ahead on cyclones","s":"Applied breakthrough: Google DeepMind's WeatherNext 2 model showed a large accuracy jump in forecasting tropical cyclone tracks and intensity, a concrete public-safety use-case rolling into Google products.","heat":55,"delta":"new","sources":3,"url":"https://deepmind.google/discover/blog/weathernext-2-a-breakthrough-in-forecasting-cyclones/","glance":"Better AI storm prediction","assess":{"mag":4,"timeline":"now","evidence":"strong","verdict":"Usable gain for disaster prep","basis":"DeepMind reports measurable cyclone-forecast improvement, deploying now"}},{"t":"ChatGPT gives free users unlimited chats","s":"Product + access: OpenAI upgraded GPT-5.6 Sol in ChatGPT, opened GPT-5.6 Luna to free users, and removed text-chat caps on the free tier — a competitive land-grab as rivals close in.","heat":52,"delta":"new","sources":3,"url":"https://openai.com/index/improving-gpt-5-6-sol-in-chatgpt/","glance":"Free tier gets uncapped","assess":{"mag":2,"timeline":"now","evidence":"proven","verdict":"Retention play, not capability leap","basis":"Official release; incremental model tune plus access expansion"}},{"t":"Self-improving agents draw money and benchmarks","s":"Momentum: Prime Intellect's self-improving 'Prime Agent' harness (241 HN pts, claims it beats Codex/Claude Code) landed alongside Mirendil's $100M+ Google Cloud deal to scale self-improving AI.","heat":50,"delta":"rising","sources":3,"url":"https://www.primeintellect.ai/blog/prime-agent","glance":"Self-improving coding agents heat up","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"early","verdict":"Promising but self-reported gains","basis":"Vendor benchmark claims + large funding; independent tests pending"}},{"t":"Anthropic to design its own Claude chips","s":"Strategy, cooling: Anthropic confirmed hiring a hardware team to design custom silicon for Claude, joining OpenAI and Google in reducing Nvidia dependence — still years from tape-out.","heat":46,"delta":"cooling","sources":3,"url":"https://arstechnica.com/ai/2026/08/anthropic-will-design-its-own-hardware-to-power-claude/","glance":"Claude wants its own silicon","assess":{"mag":3,"timeline":"1-2 yrs","evidence":"strong","verdict":"Signal now, hardware far off","basis":"Hiring confirmed; custom chips need 2+ yrs to ship"}},{"t":"Cloudflare open-sources an AI 'operating system'","s":"Release: Cloudflare open-sourced a vibe-coding platform pitched as an AI operating system for non-coders, letting people build and deploy apps from natural language on its edge.","heat":42,"delta":"new","sources":2,"url":"https://arstechnica.com/ai/2026/08/cloudflare-open-sources-vibe-coding-platform-for-people-who-arent-coders/","glance":"Vibe-coding goes open source","assess":{"mag":2,"timeline":"now","evidence":"proven","verdict":"Lowers build-an-app barrier","basis":"Open-sourced and shipping; real-world impact unproven"}}]},"aitrendsUpdated":"2026-08-07T07:31:00+05:30","science":{"updated":"2026-08-07T08:30:00+05:30","items":[{"t":"New antivenom strategy proves 10x more potent than a current treatment","s":"Peer-reviewed PNAS study (29 Jul 2026): combinations of conserved metalloproteinase inhibitors found in rattlesnake blood neutralized the lethal action of viper venom in the lab about 10x more effectively than a current treatment, offering a blueprint for recombinant, horse-serum-free antivenoms. Demonstrated so far in biochemical/animal lethality assays; veterinary use is expected first, then human snakebite therapy.","tag":"Health","imp":"important","glance":"Snake-inspired antivenom 10x more potent","why":"Points to safer, broader recombinant antivenoms for a neglected disease that kills ~100,000 people a year.","url":"https://scitechdaily.com/new-antivenom-strategy-is-10-times-more-potent-than-a-current-treatment/","published":"2026-08-06T19:05:40Z","src":"SciTechDaily","eli":"Snakes make their own antidotes, and scientists mixed those blood proteins to block venom far better than today's antivenom.","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Big if it scales — lab-stage blueprint","basis":"PNAS 2026; rattlesnake serum inhibitor mix neutralizes viper venom in lab"}}]},"scienceUpdated":"2026-08-07T07:31:00+05:30","scienceDaily":{"updated":"2026-08-07T08:30:00+05:30","items":[{"t":"Existing osteoporosis drug halted spinal disc degeneration in animal study","s":"Communications Biology study (Univ. Edinburgh/Bristol): zebrafish lacking a working col9a1b collagen gene developed mineral buildup and spinal fusion resembling human degenerative disc disease, and an already-approved osteoporosis drug reduced the damage. It is the first drug-based path for a widespread condition that currently has no medication and only surgery — but the evidence is zebrafish-only so far.","tag":"Health","imp":"important","glance":"Old drug may treat disc disease","why":"Suggests a repurposed, already-safe drug could one day treat an untreatable, hugely common back condition.","url":"https://www.sciencedaily.com/releases/2026/08/260806051943.htm","published":"2026-08-06T09:50:21Z","src":"ScienceDaily","eli":"Fish bred to mimic human disc disease had less spinal damage when given a drug already used for weak bones.","assess":{"mag":4,"timeline":"5-10 yrs","evidence":"early","verdict":"Promising — but zebrafish-only so far","basis":"Communications Biology 2026; col9a1b zebrafish; repurposed osteoporosis drug"}}]},"scienceDailyUpdated":"2026-08-07T07:31:00+05:30","life":{"updated":"2026-08-07T08:30:00+05:30","items":[]},"lifeUpdated":"2026-08-07T07:31:00+05:30","mind":{"updated":"2026-08-07T07:24:55+05:30","groups":[{"h":"🧠 Neuroscience & Brain","items":[{"t":"Prescription THC (dronabinol) erased PTSD nightmares in over a third of patients","s":"In a multicenter, double-blind, placebo-controlled trial, an oral THC drug significantly cut trauma-related nightmares versus placebo — more than half of participants responded and over a third reported their nightmares stopped completely. It targets the endocannabinoid system's role in REM dreaming, offering the first controlled win for a symptom that resists antidepressants and blood-pressure drugs.","url":"https://www.sciencedaily.com/releases/2026/08/260805082450.htm","published":"2026-08-05T23:16:44-04:00","src":"ScienceDaily / Nature Medicine","assess":{"mag":4,"timeline":"1-2 yrs","evidence":"strong","verdict":"First controlled win for PTSD nightmares","basis":"Nature Medicine RCT, n=171, double-blind, Cohen's d=0.65, P<0.001"},"eli":"A cannabis-based pill quieted the terrifying dreams of PTSD in a rigorous trial — a third had them vanish."}]},{"h":"🔌 Brain–Computer Interfaces","items":[{"t":"Nothing new today","s":"No Major-calibre brain–computer interface research in the last 72h.","url":"","published":"","src":"—"}]},{"h":"🧩 Psychology & Cognition","items":[{"t":"Nothing new today","s":"No Major-calibre psychology & cognition research in the last 72h.","url":"","published":"","src":"—"}]},{"h":"🌌 Consciousness Studies","items":[{"t":"Nothing new today","s":"No Major-calibre consciousness studies research in the last 72h.","url":"","published":"","src":"—"}]}]},"mindUpdated":"2026-08-07T07:31:00+05:30","mindset":{"updated":"2026-08-07T07:24:55+05:30","messages":[{"who":"Joseph Rodrigues","t":"You are paid to exist by simply being yourself","vid":"oVpRlau9wzM","url":"https://www.youtube.com/watch?v=oVpRlau9wzM","gist":"Rodrigues argues that doing what you genuinely love naturally pulls money toward you, drawing on his own story: a high-school dropout who fell into deep 'flow' teaching himself computers, which later became a career. The practical throughline is that income concentrates in a few high-leverage activities — prospecting, lead generation, client acquisition and ongoing relationships — and once you're doing what you love in those areas, the money you earn lets you delegate, hire and buy the (now cheap, often AI-powered) technology that used to cost thousands. The takeaway: find your own 'flow' work rather than copying his, then reinvest what it earns into people, tools and relationships so the required tasks show up effortlessly."},{"who":"Elmer O. Locker Jr","t":"You are already a millionaire — awaken inside the simulation","vid":"fBKOhqY91Ss","url":"https://www.youtube.com/watch?v=fBKOhqY91Ss","gist":"Locker frames reality as a simulation contained within your own mind, so 'going somewhere to get' what you want is unnecessary — the move is to awaken by mastering the direction of your attention. Practically, he says to eliminate the low-value inputs that keep you 'asleep' (non-educational short-form scrolling, instant gratification, distractions), become intensely present, and then use focused imagination — scripting or affirmations felt as already-true — to project a new self into your experience. His core claim is that your problems aren't 'out there' but created unconsciously by a scattered mind, and reclaiming conscious control of attention is what lets you deliberately create the life you want."},{"who":"AH Universe","t":"How to reach a better thought when you feel awful","vid":"Zb1-tWFryJs","url":"https://www.youtube.com/watch?v=Zb1-tWFryJs","gist":"This Abraham-Hicks session reframes what it means to 'reach for a better thought' and what willpower actually is: not forcing or asserting, but choosing a thought that allows — willpower as guiding your focus. The mechanism is that each habitual thought carries a vibrational frequency, and your mood is simply the readout of the balance you run in a day; by law of attraction you can only access thoughts vibrationally near your current one, so when you feel awful your range is narrow (roughly 'frightened' to 'pretty rotten') and the blissful thought you crave is out of reach and can't be willed into place. The practical fix is incremental laddering: reach for the best-feeling thought available right now and hold it for as little as 17 seconds so it becomes your new mid-range — pushing the worst thought out of range and pulling a slightly better one in, until within an hour or two your whole vibration has shifted. What powers the reaching isn't grim discipline but focus and your 'selfish' desire to feel good, surfaced by contrast — knowing what you don't want is what makes clear what you do."}]},"youtube":{"count":15,"note":"15 videos from today's uploads (9 full incl. 3 with segment takeaways, 6 shorts); dropped a VR gaming livestream for no captions, plus spiritual/esoteric lectures, a dark prison documentary and low-content vlogs/reviews as non-knowledge.","groups":[{"h":"🤖 AI & Tech","items":[{"id":"AL-XQiM4248","ch":"@WesRoth","t":"AI just killed Crypto...  (INSANE)","s":"A five-year-old key-generation bug in Coldcard Bitcoin hardware wallets let attackers drain ~$70M from ~1,200 wallets in 41 minutes; the vendor blames AI-assisted code review that now surfaces latent bugs faster than human experts. Frontier models are also breaking cryptography, so any code ever made public should be assumed to be under active AI probing.","glance":"AI code-auditors now find years-old software bugs faster than experts, so treat any once-public code as already exploitable and lock down your accounts.","url":"https://www.youtube.com/watch?v=AL-XQiM4248","published":"2026-08-07T00:06:07+00:00","subject":"AI cybersecurity","pointsLabel":"Key points","points":[{"t":"Weak-key wallet hack","s":"A latent Coldcard bug generated private keys from a tiny pool for 5 years; attackers brute-forced them and drained the richest wallets first, ~$70M in 41 minutes."},{"t":"AI outpaces auditors","s":"A Bitcoin red team ran AI audits over 390 repos and found ~5,000 issues (85 critical, 635 high) that humans had missed for years."},{"t":"Crypto broken faster than fixed","s":"Claude found a novel attack halving the security of NIST post-quantum candidate Hawk in 60 hours; experts now put a crypto-breaking quantum computer near 2029, ahead of most 2035 migration targets."},{"t":"Practical defense","s":"Prefer large institutions with strong AI security, patch immediately, reboot phones daily, use per-site passwords plus app/hardware 2FA, and lock down email as the master key."}]},{"id":"nOqOv_O8-Ug","ch":"@AI.Uncovered","t":"POV: The Day AI Learned How to Pay...","s":"Visa, Mastercard and Google have launched live 'agentic commerce' rails giving AI agents tokenized payment credentials to buy within user-set rules, removing the human final click. When a manipulated agent buys the wrong thing, responsibility fractures across user, AI vendor, merchant and bank, each able to prove its own step worked.","glance":"AI shopping agents can now spend your money within preset rules, but removing the human 'final click' scatters accountability when the agent buys the wrong thing.","url":"https://www.youtube.com/watch?v=nOqOv_O8-Ug","published":"2026-08-06T22:07:44+00:00","subject":"Agentic commerce","pointsLabel":"Key points","points":[{"t":"Rails are live","s":"Visa+OpenAI, a Mastercard+ING+Worldline payment in Europe, and Google's agent payments protocol now let agents search, select and pay within budget and merchant limits."},{"t":"Accountability fractures","s":"If a prompt-injected agent buys a compromised pick that stays within budget, the transaction looks valid to every party, so no one clearly owns the loss."},{"t":"Approval fatigue","s":"Repeated one-tap approvals train users to rubber-stamp; permissions quietly expand until the agent effectively spends unsupervised."},{"t":"Demand visibility","s":"Trustworthy agents must show why an option was chosen and which paid listings shaped the ranking; authority without visibility turns convenience into blind faith."}]},{"id":"xNKL-uiBEDg","ch":"@aimmediahouse","t":"🔴 LIVE: IBM Opens AI FutureNow Centre in Vizag | Jeff Dean Leaves Google | Front Page","s":"AIM's daily tech news show covers a major Google DeepMind reshuffle (Hassabis becomes chair and Alphabet chief scientist while 27-year veteran Jeff Dean exits to found startup Discovery Loop), a US-China hardware war over data-center components, and Indian IT giants splitting on whether to own AI data centers.","glance":"Google DeepMind is restructuring as Jeff Dean leaves to build an AI-for-science startup, while a US-China data-center hardware war and India's AI infrastructure bets reshape the industry.","url":"https://www.youtube.com/watch?v=xNKL-uiBEDg","published":"2026-08-06T20:46:31+00:00","subject":"AI industry news","pointsLabel":"Top stories","points":[{"t":"Google DeepMind reshuffle","s":"Hassabis moves to chair of DeepMind and Alphabet chief scientist; Koray Kavukcuoglu takes operational control as 27-year veteran Jeff Dean exits with top researchers to found Discovery Loop, a public-benefit corp automating ML science."},{"t":"Hardware trade war","s":"The US FCC is drafting a ban on Chinese optical transceivers in data centers over security; China retaliated with drone-export controls, signaling conflicts fought over hardware and data rather than weapons."},{"t":"Indian IT splits on data centers","s":"TCS (with TPG) and HCL are investing billions to own AI data-center capacity for ~10-15x higher revenue per megawatt, while Infosys stays asset-light and bets the hyperscalers win."},{"t":"IBM bets on Vizag","s":"IBM opened its 15th India 'FutureNow' consulting center in Visakhapatnam to grab early talent, as a new tax bill grants foreign cloud firms tax-free income until 2047."}]},{"id":"lKs6Gl_dX8w","ch":"@VarunMayya","t":"A researcher left OpenAI to turn thoughts into text.","s":"An OpenAI researcher left to join Conduit, a startup training AI to decode brainwaves from a non-invasive neural headband into text. Invasive implants already hit ~97.5% accuracy and Meta reached 61% non-invasively; the key insight is that noisy brain signals need only be combined with an LLM and on-screen context to infer exact intent.","glance":"Non-invasive 'thought-to-text' headbands are nearing viability by pairing noisy brainwave signals with an LLM and screen context to infer intent, promising hands-free computing in 2-4 years.","url":"https://www.youtube.com/watch?v=lKs6Gl_dX8w","published":"2026-08-06T17:21:06+00:00","subject":"Brain-computer interface"},{"id":"FjalStmjUpw","ch":"@mreflow","t":"It's like Slack... But for AIs","s":"Jack Dorsey launched Buzz, a decentralized open-source Slack competitor where you can invite AI agents running any model into channels, assign them tasks in parallel, and have them review each other's work. A demo had three agents each build a webpage, then critique the others' output.","glance":"Jack Dorsey's Buzz is a Slack-style workspace where you invite multiple AI agents to work in parallel, tag them with tasks, and have them critique each other's output.","url":"https://www.youtube.com/watch?v=FjalStmjUpw","published":"2026-08-06T15:02:48+00:00","subject":"AI agents"},{"id":"HYq19AX9_2w","ch":"@SillycornsMedia","t":"The New Redmi Note 17 is Here!","s":"First look at the Redmi Note 17 5G: a huge 8,000mAh silicon-carbon battery gives 2+ days and 10+ hours screen-on, plus a flat 6.9-inch AMOLED, IP65 and 4 years of OS updates, but 2026's RAM/storage crisis forces a price bump and an entry-level Snapdragon 4 Gen 4 chip.","glance":"The Redmi Note 17 packs a massive 8,000mAh battery and 4 years of updates, but 2026's component crisis means a price bump and a weaker entry-level chip.","url":"https://www.youtube.com/watch?v=HYq19AX9_2w","published":"2026-08-06T06:33:58+00:00","subject":"Phone review"},{"id":"1vAGYbbtahU","ch":"@DwarkeshPatel","t":"The Skill Great Teachers Have That LLMs Completely Lack - Grant Sanderson","s":"Grant Sanderson (3Blue1Brown) argues LLMs are too placating: they praise every question instead of telling a student they are thinking about a topic the wrong way. Great teachers 'jujitsu' a student's flawed framing into the right answer, something current models don't do.","glance":"Great teachers redirect a student's wrong framing toward the right answer, while LLMs just flatter every question instead of challenging how you're thinking.","url":"https://www.youtube.com/watch?v=1vAGYbbtahU","published":"2026-08-06T22:13:29+00:00","subject":"AI & learning","short":true}]},{"h":"🚀 Space & SpaceX","items":[{"id":"wb30YrILxfs","ch":"@SolvingTheMoneyProblem","t":"SpaceX's INSANE AI Compute Plan: 20 Gigawatts Power & Cooling Next Year! #shorts","s":"SpaceX has a tentative target of 20 gigawatts of power and cooling capacity online by end of next year, sized so chips (not power) are the limiting factor. It expects priority delivery of Nvidia's Rubin GPUs, betting it can bring compute online faster than rivals.","glance":"SpaceX aims for 20GW of power and cooling by end of 2027 so chips are never the bottleneck, positioning it to deploy Nvidia GPUs faster than any rival.","url":"https://www.youtube.com/watch?v=wb30YrILxfs","published":"2026-08-06T15:57:42+00:00","subject":"SpaceX compute","short":true},{"id":"9yQEQNrXGWc","ch":"@SolvingTheMoneyProblem","t":"SpaceX Eyes $100B ARR Milestone Ahead of Schedule #shorts","s":"In its first earnings as a public company, SpaceX signaled it will hit $100B annualized revenue by December, a floor it says it would reach 'doing nothing,' roughly a year ahead of pre-IPO projections, with the revenue mix similar to what it shared before listing.","glance":"SpaceX now expects to reach $100B annualized revenue by December, about a year ahead of its pre-IPO schedule and treated as a floor rather than a stretch.","url":"https://www.youtube.com/watch?v=9yQEQNrXGWc","published":"2026-08-06T09:31:25+00:00","subject":"SpaceX earnings","short":true},{"id":"BhFjTrYR_gM","ch":"@ASTRO_ALEXANDRA","t":"August 12 is the peak of the largest meteor shower of the year AND a total solar eclipse","s":"On August 12 three sky events coincide: the Perseids peak with 50-100 meteors/hour and frequent fireballs, a new moon makes skies extra dark, and that new moon produces a total solar eclipse. Never view the sun or eclipse without solar eclipse glasses.","glance":"On August 12 the Perseid meteor shower peaks at up to 100/hour under a dark new-moon sky that also brings a total solar eclipse; use eclipse glasses for the sun.","url":"https://www.youtube.com/watch?v=BhFjTrYR_gM","published":"2026-08-06T21:35:06+00:00","subject":"Astronomy events","short":true}]},{"h":"🧠 Health & Mind","items":[{"id":"xKvlK7OqZso","ch":"@hubermanlab","t":"Control Your Brain Chemistry for Focus, Motivation & Well-Being | Huberman Lab Essentials","s":"Huberman explains how four neuromodulators (dopamine, epinephrine, serotonin, acetylcholine) set your states and how baseline levels shift across the day, then gives a 'toolkit' of behaviors, foods and supplements to nudge each one toward focus, energy, motivation or calm.","glance":"Four neuromodulators govern focus, motivation and mood, and simple tools like morning sunlight, caffeine, cold exposure and gratitude can reliably tune each one.","url":"https://www.youtube.com/watch?v=xKvlK7OqZso","published":"2026-08-06T12:00:35+00:00","subject":"Neuroscience","pointsLabel":"Key tools","points":[{"t":"Daily rhythm sets the baseline","s":"Dopamine and epinephrine peak in the first ~9 hours after waking; serotonin dominates later, so the same tool has a bigger effect at the right time of day."},{"t":"Raise dopamine (motivation)","s":"Morning sunlight and regular caffeine increase dopamine-receptor efficacy; cold exposure gives a sustained, crash-free dopamine rise; supplements like L-tyrosine work but can crash."},{"t":"Raise epinephrine (energy)","s":"Exercise, caffeine, and cyclic hyperventilation (Wim Hof-style breathing) reliably boost adrenaline and alertness; ease off if prone to anxiety or panic."},{"t":"Acetylcholine and serotonin","s":"Choline-rich foods plus alpha-GPC sharpen focus for learning; receiving and even observing gratitude, physical contact, and inositol raise serotonin for calm and better sleep."}]},{"id":"nfZ7-hDHgcU","ch":"@ruriohama","t":"why you stay awake even when you're sleepy","s":"'Revenge bedtime procrastination': when your daytime feels out of your control, staying up late becomes an act of reclaiming autonomy and avoiding the anxiety of tomorrow, even knowing morning will make you pay for the lost sleep.","glance":"Staying up when exhausted is often 'revenge bedtime procrastination'—reclaiming autonomy and delaying a dreaded tomorrow when your daytime feels out of your control.","url":"https://www.youtube.com/watch?v=nfZ7-hDHgcU","published":"2026-08-06T14:00:15+00:00","subject":"Sleep psychology","short":true}]},{"h":"🌍 Science & How-To","items":[{"id":"WNvAic8KLb0","ch":"@crashcourse","t":"Earthquakes Explained: Crash Course Geology #14","s":"Earthquakes release built-up stress when brittle crust along faults suddenly slips, sending body waves (fast P, damaging S) and slow surface waves. Scientists can forecast probability but no one has ever predicted an exact quake; the fix is early-warning systems and earthquake-resistant building.","glance":"Earthquakes can be forecast as probabilities but never precisely predicted; the real protection is seconds-early warning systems and earthquake-resistant construction.","url":"https://www.youtube.com/watch?v=WNvAic8KLb0","published":"2026-08-06T16:00:16+00:00","subject":"Geology","pointsLabel":"Key points","points":[{"t":"What shakes","s":"Tectonic stress strains brittle crust until a fault slips, releasing energy as fast P-waves, damaging side-to-side S-waves, and slow but destructive surface waves."},{"t":"Magnitude is logarithmic","s":"Moment magnitude is a 10x energy jump per whole number, so a 6.0 releases ~1,000x the energy of a 4.0; ground type and rock age change how far shaking travels."},{"t":"No one can predict quakes","s":"Foreshocks are only identifiable in hindsight; the USGS says exact prediction isn't foreseeable, so science forecasts long-term probability like a weather report."},{"t":"Preparation beats prediction","s":"Early-warning systems (Japan, Mexico, California) buy seconds, and quake-resistant building codes plus personal readiness cut casualties."}]},{"id":"_4nadAz0d3I","ch":"@Thepainfreepettrainer","t":"Is it really true that you can't teach an old dog new tricks?","s":"A step-by-step lure-training demo teaches a 6-year-old dog to 'play dead': lure into a down then a C-shape over the back, mark with 'yes' and reward, add the cue, then progressively fade the food lure into a hand signal and finally into the verbal cue alone.","glance":"You can train an older dog by luring the motion, marking success with a reward, adding a cue, then gradually fading the food lure into a hand signal and word.","url":"https://www.youtube.com/watch?v=_4nadAz0d3I","published":"2026-08-06T23:05:41+00:00","subject":"Dog training","short":true}]},{"h":"💡 Life & Business","items":[{"id":"2EtZHm-gs5o","ch":"@bigthink","t":"Jaleel White on the greatest perspective shift of his life","s":"'Family Matters' star Jaleel White reflects that living off external validation as a child actor left him tied to fame as his identity; fatherhood shifted him to value steady work over dream roles and to build slowly, because what rises fast falls fast while what's built slowly lasts.","glance":"Chasing external validation makes fame your identity; Jaleel White found peace by valuing steady work over dream roles—what's built slowly is far more durable.","url":"https://www.youtube.com/watch?v=2EtZHm-gs5o","published":"2026-08-06T13:00:39+00:00","subject":"Life lessons"}]}]},"elon":{"day":"2026-08-06","source":"@jcub2x daily recap","note":"Fresh recap: 'Elon posted 63 times' for Aug 6, published ~23:00 UTC Aug 6 — post list covers Aug 6. Engagement counts omitted; charged political posts summarized factually with contested claims flagged.","highlight":{"t":"Musk unveils Terafab — $16.8B Tesla–SpaceX chip fab, 'largest and most valuable building on Earth'","s":"Tesla and SpaceX confirmed Grimes County, Texas for Terafab, a jointly funded semiconductor complex: $16.8B first phase, 3,000+ jobs, ~100M sq ft (10x Giga Texas), targeting over a terawatt of AI compute per year for Optimus, Cybercab and space-based data centers, with filings pointing to up to $119B across phases. It landed the same day SpaceX's 911M-share IPO lockup expired — the stock rose ~2% as the feared insider-sale flood failed to materialize.","href":"https://techcrunch.com/2026/08/06/tesla-and-spacex-will-invest-16-8b-to-start-building-terafab-chip-factory-in-texas/"},"items":[{"kind":"post","t":"Terafab announcement · Tesla+SpaceX chip fab in Grimes County, TX","s":"Amplified Tesla's Terafab reveal ($16.8B first phase, 3,000+ jobs, ~100M sq ft, target >1 TW of AI compute a year): 'Terafab Texas will be the largest and most valuable building on Earth by far. And it will be stunningly beautiful' — adding 'sci-fi city is what we're aiming for' and guessing output splits roughly 25% Optimus / 75% AI spacecraft.","imp":"critical","iso":"2026-08-06T20:00:00Z"},{"kind":"reply","t":"Nikita Bier steps back as X head of product","s":"'Thanks for helping me make this platform much better. You will be missed.' — replying to Bier's announcement that he is moving to an adviser role after about a year, with product handed to Benji Taylor (design) and other leads.","imp":"important","iso":"2026-08-06T19:00:00Z"},{"kind":"reply","t":"French politicians and magistrates move against X · Le Pen support","s":"After Green-party figures demanded X be shut down over his backing of Marine Le Pen, replied 'I demand that she be shut down for treason against France'; on a reported judicial push to strip X's host status and treat it as co-author of users' posts: 'If they do this, they will be international criminals.' (Charged exchange; the reclassification is an unprecedented, so-far unconfirmed legal theory reported by French press.)","imp":"important","iso":"2026-08-06T18:00:00Z"},{"kind":"post","t":"Megapack 3 production starts · Brookshire, TX","s":"'Megapack 3 starting production. Congrats Tesla Mega team' — quoting Tesla's news that its newest Megafactory went from groundbreaking to operation in 16 months, with 50 GWh/year design capacity.","imp":"important","iso":"2026-08-06T17:00:00Z"},{"kind":"post","t":"Regulatory war stories · Fish & Wildlife launch reviews","s":"Retold how environmental reviews once had SpaceX 'kidnap a seal, strap it to a board, put headphones on the seal and play sonic boom sounds' — plus shark- and whale-strike analyses — 'I don't think the public is quite aware of the madness that goes on. This actually happened.'","imp":"interesting","iso":"2026-08-06T16:00:00Z"},{"kind":"post","t":"Falcon stage Moon-impact 'video'","s":"Shared a dramatic clip of his spent rocket stage hitting the Moon, then noted 'This is fake, by the way' — Community Notes flagged it as a simulation; the real August impact was confirmed only via telescope observation.","imp":"interesting","iso":"2026-08-06T15:00:00Z"},{"kind":"post","t":"Grok / xAI updates","s":"Reposted the near-daily Grok build changelog and a Grok-in-Blender demo ('describe it, it builds, it fixes its own render'), and told a commenter debating training-vs-inference budgets that '99% of compute long-term will be for inference.'","imp":"interesting","iso":"2026-08-06T14:30:00Z"},{"kind":"reply","t":"Bloomberg op-ed on Starlink phone service","s":"'Bloomberg is garbage' — after Eric Trump pushed back on a Bloomberg piece calling SpaceX phone plans overpromised, citing SpaceX's ~80%+ share of 2025 mass-to-orbit and 165 Falcon flights without a failure.","imp":"interesting","iso":"2026-08-06T14:00:00Z"},{"kind":"reply","t":"Blue Origin BE-4 anomaly update","s":"'Hope you get back to flight soon.' — responding to Dave Limp's update tracing the New Glenn hot-fire anomaly to a BE-4 main oxygen-valve failure, with retrofit hardware due by month's end.","imp":"interesting","iso":"2026-08-06T13:00:00Z"},{"kind":"repost","t":"Politics & immigration threads","s":"Backed the Save America Act election-security push ('Great'), amplified a thesis that welfare plus non-citizen voting creates a self-reinforcing migration loop ('This is what is happening'), endorsed calling a UK editor a 'traitor' in a row over 'demographic security,' and dismissed child cobalt-mining claims as 'utterly false.' (Charged material; several amplified statistics are unverified, and rights groups have documented child labor in artisanal — though not industrial — cobalt mining.)","imp":"interesting","iso":"2026-08-06T12:00:00Z"},{"kind":"reply","t":"Alex Gibney's 4-hour 'Musk' documentary, in US theaters Oct 16","s":"'It's a hit piece. Gibney is incapable of anything else. Also, 4 hours — is it trying to bore people to death?'","imp":"interesting","iso":"2026-08-06T11:00:00Z"},{"kind":"reply","t":"Lighter threads · black-hole computing, fashion, Grok Imagine","s":"To a black-holes-as-ultimate-computers musing: 'You're right, but one step at a time. Next step is extending consciousness permanently beyond Earth'; quipped that 2026 fashion needs an update beyond suits and jeans; told a Grok Imagine user hitting moderation limits he is 'fixing' it.","imp":"noise","iso":"2026-08-06T10:00:00Z"}]},"elonNews":[{"t":"Tesla and SpaceX to invest $16.8B in first phase of 'Terafab' chip factory in Texas","s":"The companies confirmed Grimes County for a jointly developed ~100M-sq-ft semiconductor complex targeting over a terawatt of AI compute per year for Optimus, Cybercab and space data centers — filings suggest up to $119B across phases; chip stocks rose on the news.","url":"https://techcrunch.com/2026/08/06/tesla-and-spacex-will-invest-16-8b-to-start-building-terafab-chip-factory-in-texas/","published":"2026-08-06T15:21:00Z","src":"TechCrunch"},{"t":"SpaceX shares rise on lockup day as feared insider flood fails to materialize","s":"W /* Freshness rule: show only items within 24h of the last refresh (DATA.updated),
   so nothing older than a day is displayed, and nothing vanishes mid-day as the
   clock moves. NO same-day dedup — pressing Update just re-pulls the last 24h and
   shows everything in it, even if it was shown before.
   DATA.mindset, DATA.elon (labelled daily recap), DATA.mind (7-day window) and DATA.hair (persistent) are exempt. */
(function enforceFreshness(){
  var DAY_MS=24*60*60*1000;
  var ref=Date.parse(DATA&&DATA.updated); if(isNaN(ref)) ref=Date.now();
  var PLACE=/nothing new|nothing major|no news|no relevant|no notable|no major|no standout|no items|not available|no entries|no new video/i;
  function isPlace(it){ return !!it && PLACE.test(String((it&&(it.t||it.author))||"")); }
  function fresh(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false;
    var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=DAY_MS; }
  function filt(a){ return Array.isArray(a)?a.filter(fresh):a; }
  if(DATA.news&&Array.isArray(DATA.news.cats)) DATA.news.cats.forEach(function(c){ if(c) c.items=filt(c.items); });
  DATA.elonNews=filt(DATA.elonNews);
  /* DATA.mind is exempt: Mind sources on a 7-day window (2026-07-09 change C). */
  if(DATA.science&&Array.isArray(DATA.science.items)){ DATA.science.items=DATA.science.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.science.items.length){ DATA.science.items=[{t:"Nothing new today", s:"No fresh science breakthrough surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.scienceDaily&&Array.isArray(DATA.scienceDaily.items)){ DATA.scienceDaily.items=DATA.scienceDaily.items.filter(function(it){ if(isPlace(it)) return true; var d=pubDate(it); if(!d) return false; var t=new Date(d).getTime(); if(isNaN(t)) return false; return (ref-t)<=2*DAY_MS; }); if(!DATA.scienceDaily.items.length){ DATA.scienceDaily.items=[{t:"Nothing new today", s:"No fresh ScienceDaily research surfaced in the last couple of days.", url:"", published:""}]; } }
  if(DATA.youtube&&Array.isArray(DATA.youtube.groups)){
    var groups=[];
    DATA.youtube.groups.forEach(function(g){ if(!g) return;
      if(g.type==="aim"){ g.keys=filt(g.keys||[]); g.count=g.keys.length; if(g.keys.length||(g.headlines&&g.headlines.length)) groups.push(g); }
      else { g.items=filt(g.items||[]); if(g.items.length) groups.push(g); } });
    DATA.youtube.groups=groups;
    DATA.youtube.count=groups.reduce(function(n,g){ return n+((g.items&&g.items.length)||(g.keys&&g.keys.length)||0); },0);
    if(!groups.length){ DATA.youtube.groups=[{h:"YouTube",items:[{t:"Nothing new in the last 24h", s:"No relevant uploads from your subscriptions in the last 24 hours.", url:"", published:""}]}]; DATA.youtube.count=0; }
  }
})();
/*FRESH_GUARD_END*/

  const has=re=>re.test(hay);
  if(S==="mindset"||has(/spiritual|meditat|consciousness|enlighten|manifest|non-dual|awareness|\bsoul\b|\bgod\b|divine|ego death|surrender|awaken|mindful/)) return "spirit";
  if(has(/philosoph|stoic|existential|metaphysic|epistem|\bethics\b|meaning of life|nietzsche|nihilis|absurd|virtue|wisdom of|the good life/)) return "phil";
  if(S==="health"||has(/\bhealth\b|fitness|workout|\bdiet\b|nutrition|\bsleep\b|longevity|medical|hair loss|\bmuscle\b|disease|mental health|therapy|dopamine|fasting|cardio|protein/)) return "health";

const F_STOP=new Set("the a an of to in on at for and or but with from into over after new news latest says said report first second third two three more most amid as by is are was were will be been being this that these those it its his her their they you your our we can could may might has have had about than then them who what when where why how also just still now today year years week day over under up down out off".split(" "));
function fNorm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim(); }
function fKws(s){ return [...new Set(fNorm(s).split(" ").filter(w=>w.length>3&&!F_STOP.has(w)))]; }
function followKey(it){ return "f_"+fNorm((it&&(it.t||it.title))||"").slice(0,90); }
function getFollows(){ const f=store.get("follows",{}); return (f&&typeof f==="object")?f:{}; }

function fNow(){ return (typeof DATA!=="undefined"&&DATA.updated)||new Date().toISOString(); }
function fShort(iso){ const d=new Date(iso); if(isNaN(d.getTime())) return String(iso||"").slice(0,10); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"}); }

  f[k]={title, kws:fKws(title+" "+(it.s||"")).slice(0,9), created:Date.now(), history:[dev], seen:{[fNorm(dev.t)]:1}};
  saveFollows(f); }
function removeFollow(k){ const f=getFollows(); delete f[k]; saveFollows(f); }
function fAllItems(){ const out=[]; const push=a=>{(a||[]).forEach(x=>{ if(x&&(x.t||x.title)&&isRealItem(x)) out.push(x); });};
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>push(c.items));
  push(DATA.science&&DATA.science.items); push(DATA.scienceDaily&&DATA.scienceDaily.items); push(DATA.hair&&DATA.hair.items);
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>push(g.items));

function scanFollows(){ const f=getFollows(); const keys=Object.keys(f); if(!keys.length) return f; const items=fAllItems(); let changed=false;
  keys.forEach(k=>{ const sub=f[k]; const kws=sub.kws||[]; if(!kws.length) return; sub.seen=sub.seen||{}; sub.history=sub.history||[];
    const need=Math.max(2,Math.ceil(kws.length*0.5));
    items.forEach(it=>{ const hay=fNorm((it.t||it.title||"")+" "+(it.s||"")+" "+(it.subject||"")+" "+(it.tag||""));
      let hit=0; kws.forEach(w=>{ if(hay.indexOf(w)>=0) hit++; });
      if(hit>=need){ const txt=((it.glance||it.s||it.t||"")).replace(/\s+/g," ").trim().slice(0,180); const nk=fNorm(txt);
        if(nk&&!sub.seen[nk]){ sub.seen[nk]=1; sub.history.unshift({d:pubDate(it)||fNow(), t:txt}); changed=true; } } });
    sub.history.sort((a,b)=>new Date(b.d)-new Date(a.d)); sub.history=sub.history.slice(0,50);
  });
  if(changed) saveFollows(f); return f; }

const TAB_META={news:["News",""],breakthroughs:["Breakthroughs","breakthroughs"],aitrends:["AI Trends","trends"],science:["Science","breakthroughs"],scidaily:["Science Daily","studies"],youtube:["YouTube","videos"],elon:["Elon","updates"],mind:["Mind","items"],som:["Star of Mysore","pages"]};
function slimCountFor(id){
  try{
    if(id==="breakthroughs"){var bn=0;bn+=((DATA.aitrends&&DATA.aitrends.items)||[]).filter(isMajor).length;bn+=((DATA.science&&DATA.science.items)||[]).filter(isMajor).length;bn+=((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).length;bn+=((DATA.life&&DATA.life.items)||[]).filter(isMajor).length;return bn;}
    if(id==="aitrends") return ((typeof DATA.aitrends==="object"&&DATA.aitrends&&DATA.aitrends.items)||[]).filter(isRealItem).length;
    if(id==="science") return ((DATA.science&&DATA.science.items)||[]).filter(isRealItem).length;
    if(id==="scidaily") return ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isRealItem).length;

}
function activate(id,opts){

// ---- grade collection: ring + clickable pills + popup ----
function gradeItems(){
  const out={critical:[],important:[],interesting:[]};
  const push=(it,tab)=>{ const k=(it&&it.imp||"").toLowerCase(); if(out[k]&&isRealItem(it)) out[k].push({it,tab}); };
  ((DATA.news&&DATA.news.cats)||[]).forEach(c=>(c.items||[]).forEach(it=>push(it,"news")));
  ((DATA.science&&DATA.science.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.scienceDaily&&DATA.scienceDaily.items)||[]).filter(isMajor).forEach(it=>push(it,"breakthroughs"));
  ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{(g.items||[]).forEach(it=>push(it,"youtube"));(g.keys||[]).forEach(it=>push(it,"youtube"));});
  (DATA.elonNews||[]).forEach(it=>push(it,"elon"));
  ((DATA.elon&&DATA.elon.items)||[]).forEach(it=>push(it,"elon"));
  ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>(g.items||[]).filter(isMajor).forEach(it=>push(it,"mind")));
  return out;
}
const GRADES=gradeItems();
(function buildMast(){
  const n={critical:GRADES.critical.length,important:GRADES.important.length,interesting:GRADES.interesting.length};
  const total=n.critical+n.important+n.interesting;
  const pills=document.getElementById("gradePills");
  function mk(kind,color,label){
    const b=document.createElement("button"); b.className="pill"; b.style.setProperty("--pc",color);
    b.textContent="● "+n[kind]+" "+label; b.onclick=()=>openGrade(kind); return b; }
  if(n.critical) pills.appendChild(mk("critical","#ef4444","critical"));
  if(n.important) pills.appendChild(mk("important","#f59e0b","important"));
  if(n.interesting){ const s=document.createElement("span"); s.className="pill"; s.style.setProperty("--pc","var(--ac)"); s.textContent="● "+n.interesting+" noted"; pills.appendChild(s); }
  if(!total){ const s=document.createElement("span"); s.className="pill"; s.textContent="quiet day"; pills.appendChild(s); return; }
  const wrap=document.getElementById("ringWrap"), svg=document.getElementById("ringSvg");
  wrap.hidden=false; document.getElementById("ringN").textContent=total;
  const R=38, C=2*Math.PI*R;
  const segs=[["#ef4444",n.critical],["#f59e0b",n.important],["var(--ac)",n.interesting]].filter(p=>p[1]>0);
  const gap=segs.length>1?12:0;
  let off=0, html=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="color-mix(in srgb,var(--mut) 16%,transparent)" stroke-width="8"/>`;
  segs.forEach(([c,v])=>{ const frac=v/total, len=Math.max(1.5,C*frac-gap);
    html+=`<circle cx="46" cy="46" r="${R}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}"/>`; off+=C*frac; });
  svg.innerHTML=html;
})();
const gradeOvl=document.getElementById("gradeOvl");
function openGrade(kind){
  const list=document.getElementById("gradeList"), title=document.getElementById("gradeTitle");
  const color=kind==="critical"?"#ef4444":"#f59e0b";
  title.style.setProperty("--pc",color); title.textContent="● "+GRADES[kind].length+" "+kind+" today";
  const byTab={}; GRADES[kind].forEach(x=>{(byTab[x.tab]=byTab[x.tab]||[]).push(x);});
  let html="";
  TABS.forEach(t=>{ const rows=byTab[t.id]; if(!rows||!rows.length) return;
    html+=`<div class="mgrp">${esc(t.label)}</div>`;
    rows.forEach((x,i)=>{ const it=x.it; const age=relAge(pubDate(it));
      html+=`<div class="mrow" data-tab="${t.id}" data-key="${esc(cardKey(it))}">
        <span class="tile" style="--kc:${color}">${t.icon}</span>
        <div style="flex:1;min-width:0"><p class="mt">${esc(it.t||it.s||"")}</p>${it.s&&it.t?`<p class="ms">${esc(it.s)}</p>`:""}
        <div class="mm">${age?esc(age)+" · ":""}${esc(it.src||"")}</div></div></div>`; });
  });
  list.innerHTML=html||'<p class="empty">Nothing in this grade today.</p>';
  list.querySelectorAll(".mrow").forEach(r=>r.onclick=()=>{ jumpTo(r.dataset.tab,r.dataset.key); });
  gradeOvl.classList.add("open");
}
function closeGrade(){ gradeOvl.classList.remove("open"); }
document.getElementById("gradeX").onclick=closeGrade;
gradeOvl.addEventListener("click",e=>{ if(e.target===gradeOvl) closeGrade(); });
function jumpTo(tab,key){
  closeGrade(); activate(tab,{keepScroll:true});
  setTimeout(()=>{ const el=ELEMS.get(key); if(!el) return;
    let d=el.closest("details"); while(d){ d.open=true; d=d.parentElement?d.parentElement.closest("details"):null; }
    if(el.classList.contains("crow")) el.classList.add("open");

// ---- unread badges ----
function unreadOf(items){ return (items||[]).filter(it=>isRealItem(it)&&!isReadItem(it)).length; }
function tabUnread(id){
  if(id==="news"){ let n=0; ((DATA.news&&DATA.news.cats)||[]).forEach(c=>n+=unreadOf(c.items)); return n; }
  if(id==="aitrends") return unreadOf(typeof DATA.aitrends==="object"&&DATA.aitrends?DATA.aitrends.items:[]);
  if(id==="science") return unreadOf(DATA.science&&DATA.science.items);
  if(id==="scidaily") return unreadOf(DATA.scienceDaily&&DATA.scienceDaily.items);
  if(id==="youtube"){ let n=0; ((DATA.youtube&&DATA.youtube.groups)||[]).forEach(g=>{n+=unreadOf(g.items);n+=unreadOf(g.keys);}); return n; }
  if(id==="elon") return unreadOf(DATA.elonNews);
  if(id==="mind"){ let n=0; ((DATA.mind&&DATA.mind.groups)||[]).forEach(g=>n+=unreadOf(g.items)); return n; }

}
function refreshBadges(){

    [...nav.querySelectorAll('[data-id="'+t.id+'"] .ub')].forEach(u=>u.textContent=txt);
